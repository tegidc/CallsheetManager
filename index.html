const DB_OBJECT_KEYS = ['db:roleseniority','db:settings','db:roles'];
const isObjDB = key => DB_OBJECT_KEYS.includes(key);
let dbStamp = {};   // key -> updated_at last seen
let dbBase  = {};   // key -> deep snapshot matching that stamp
let dbLoadFailed = new Set();
const dbClone = v => JSON.parse(JSON.stringify(v ?? null));

async function loadDB(key){
  const empty = () => isObjDB(key) ? {} : [];
  try{
    const { data, error } = await sb.from('app_data').select('value, updated_at').eq('key', key).maybeSingle();
    if(error){ console.error('Supabase load failed ('+key+'):', error.message); dbLoadFailed.add(key); return empty(); }
    dbLoadFailed.delete(key);
    if(!data){ dbStamp[key] = null; dbBase[key] = empty(); return empty(); }
    dbStamp[key] = data.updated_at;
    dbBase[key]  = dbClone(data.value);
    return data.value;
  }catch(e){ console.error('Supabase load exception ('+key+'):', e); dbLoadFailed.add(key); return empty(); }
}

function mergeDB(base, mine, theirs){
  const same = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  if(Array.isArray(mine) && Array.isArray(theirs)){
    const keyed = a => Array.isArray(a) && a.every(r => r && typeof r==='object' && r.id);
    if(!keyed(mine) || !keyed(theirs) || !keyed(base||[])) return mine;
    const B = new Map((base||[]).map(r=>[r.id,r]));
    const M = new Map(mine.map(r=>[r.id,r]));
    const T = new Map(theirs.map(r=>[r.id,r]));
    const out = [];
    // their order first (so records added elsewhere keep a stable home), then ours
    const ids = [...new Set([...theirs.map(r=>r.id), ...mine.map(r=>r.id)])];
    ids.forEach(id=>{
      const b = B.get(id), m = M.get(id), t = T.get(id);
      if(m && t)  { out.push(same(m,b) ? t : m); return; }           // both have it: the side that changed wins, ours on a tie
      if(m && !t) { if(!b) out.push(m); return; }                    // only ours: new here = keep, else they deleted it
      if(!m && t) { if(!b) out.push(t); return; }                    // only theirs: new there = keep, else we deleted it
    });
    return out;
  }
  if(mine && theirs && typeof mine==='object' && typeof theirs==='object'){
    const out = {...theirs};
    Object.keys(mine).forEach(k=>{
      if(!same(mine[k], (base||{})[k]) || !(k in theirs)) out[k] = mine[k];   // we changed it, or it's new here
    });
    Object.keys(base||{}).forEach(k=>{ if(!(k in mine) && same((base||{})[k], theirs[k])) delete out[k]; });
    return out;
  }
  return mine;
}

async function saveDB(key, value){
  const stamp = () => new Date().toISOString();
  // `value` is reassigned by the merge below, so this deliberately reads it at
  // call time: a retry should push the merged value, not the pre-merge one.
  const fail = (kind, detail) => { reportSaveFailure(key, kind, detail, value); return {ok:false, kind, detail}; };
  const ok   = () => { clearSaveFailure(key); return {ok:true}; };
  if(dbLoadFailed.has(key)){
    // This collection never loaded, so what's in memory is NOT what's in the
    // database — writing now would overwrite the stored data with a fallback.
    return fail('unsaved', "this data couldn't be loaded when the app started, so saving it is blocked to protect what's already stored — reload the page");
  }
  try{
    for(let attempt=0; attempt<3; attempt++){
      const now = stamp();
      // No row yet (or we've never read one): plain upsert, nothing to conflict with.
      if(dbStamp[key] == null){
        const { data, error } = await sb.from('app_data')
          .upsert({ key, value, updated_at:now }).select('updated_at');
        if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
        // store the stamp AS POSTGRES RETURNS IT, not the JS string we sent: the two
        // differ textually ('…123Z' vs '…123000+00:00') and only compare equal because
        // postgres casts them. Round-tripping the canonical value removes that reliance.
        dbStamp[key] = (data && data[0] && data[0].updated_at) || now;
        dbBase[key] = dbClone(value); return ok();
      }
      // Guarded write — only lands if nobody else has written since we last looked.
      const { data, error } = await sb.from('app_data')
        .update({ value, updated_at:now }).eq('key', key).eq('updated_at', dbStamp[key]).select('updated_at');
      if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
      if(data && data.length){ dbStamp[key] = data[0].updated_at || now; dbBase[key] = dbClone(value); return ok(); }

      // Guard failed: somebody wrote in between. Take their version, merge, retry.
      const { data: fresh, error: reErr } = await sb.from('app_data')
        .select('value, updated_at').eq('key', key).maybeSingle();
      if(reErr || !fresh){
        console.error('Supabase merge re-read failed ('+key+')', reErr && reErr.message);
        return fail('unsaved', (reErr && reErr.message) || 'the stored row could not be read back');
      }
      const merged = mergeDB(dbBase[key], value, fresh.value);
      console.warn(`[${key}] another tab or device wrote while this one was editing — merged both instead of overwriting.`);
      dbStamp[key] = fresh.updated_at;
      dbBase[key]  = dbClone(fresh.value);
      value = merged;
      applyMergedDB(key, merged);   // put the merged result back into the live in-memory array
    }
    console.error('Supabase save gave up after repeated conflicts ('+key+')');
    return fail('discarded', 'three guarded writes in a row were beaten by another writer');
  }catch(e){
    console.error('Supabase save exception ('+key+'):', e);
    return fail('unsaved', (e && e.message) || String(e));
  }
}

function saveInBackground(key, value){
  return saveDB(key, value).then(res=>{
    if(res && !res.ok) renderProjectBody();
    return res;
  });
}

const DB_KEY_LABELS = {
  'db:crew':'the crew database', 'db:locations':'the locations database',
  'db:projects':'project details', 'db:shootdays':'shoot days',
  'db:settings':'settings', 'db:roles':'the roles list',
  'db:roleseniority':'role seniority',
  'db:travelmethods':'travel methods', 'db:coprocompanies':'production companies',
  'db:vendors':'the vendors list', 'db:feedback':'demo feedback notes'
};
let saveFailure = null;   // {key, kind:'unsaved'|'discarded', detail, value, retrying}

function reportSaveFailure(key, kind, detail, value){
  /* 'discarded' outranks 'unsaved' for the same key: it's the one that means data
     is actually gone, so a later network blip must not quietly demote the wording
     from "your change was not saved" to "not saved yet". */
  const keepWorse = saveFailure && saveFailure.key===key
                    && saveFailure.kind==='discarded' && kind!=='discarded';
  saveFailure = { key, value, retrying:false,
                  kind:   keepWorse ? 'discarded'        : kind,
                  detail: keepWorse ? saveFailure.detail : detail };
  renderSaveFailureBanner();
}
/* Cleared only by a success on the SAME key — db:projects saving fine says nothing
   about whether db:shootdays ever landed. */
function clearSaveFailure(key){
  if(saveFailure && saveFailure.key===key){ saveFailure = null; renderSaveFailureBanner(); }
}
function dismissSaveFailure(){ saveFailure = null; renderSaveFailureBanner(); }
async function retrySaveFailure(){
  if(!saveFailure || saveFailure.retrying) return;
  const f = saveFailure;
  f.retrying = true; renderSaveFailureBanner();
  await saveDB(f.key, f.value);   // clears the banner on success, replaces it on a fresh failure
  if(saveFailure === f) saveFailure.retrying = false;
  renderSaveFailureBanner();
}
function renderSaveFailureBanner(){
  let el = document.getElementById('saveFailBanner');
  if(!saveFailure){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='saveFailBanner'; document.body.appendChild(el); }
  const f = saveFailure, what = DB_KEY_LABELS[f.key] || f.key, lost = f.kind==='discarded';
  el.className = 'save-banner' + (lost ? ' save-banner-lost' : '');
  const msg = lost
    ? `<strong>Your last change was not saved.</strong> Something else kept writing to ${esc(what)} while you were editing, so this change could not be stored. It is still on screen but it is <strong>not in the database</strong> — reload now and it is gone.`
    : `<strong>Not saved yet.</strong> Couldn't write ${esc(what)} to the database. Nothing has been lost — your changes are still on screen, and the next save of the same data that succeeds will carry them.`;
  el.innerHTML = `<div class="save-banner-text">${msg}${f.detail?`<div class="save-banner-detail">${esc(f.detail)}</div>`:''}</div>
    <button type="button" class="small" onclick="retrySaveFailure()"${f.retrying?' disabled':''}>${f.retrying?'Retrying…':'Retry save'}</button>
    <span class="save-banner-close" onclick="dismissSaveFailure()" title="Dismiss">${icon('close')}</span>`;
}

/* The in-memory arrays are what every screen renders from, and other code holds
   references to them, so a merge has to be written back IN PLACE (splice, not
   reassign) or half the app keeps rendering the pre-merge copy. */
function applyMergedDB(key, merged){
  const live = { 'db:crew':()=>crewDB, 'db:locations':()=>locationsDB,
                 'db:projects':()=>projectsDB, 'db:shootdays':()=>shootDaysDB,
                 'db:travelmethods':()=>travelMethodsList, 'db:coprocompanies':()=>coProCompaniesList,
                 'db:vendors':()=>vendorsDB, 'db:feedback':()=>feedbackDB }[key];
  if(live && Array.isArray(merged)){
    const arr = live(); if(Array.isArray(arr)){ arr.splice(0, arr.length, ...merged); }
  } else if(key==='db:settings' && merged && typeof merged==='object'){
    appSettings = Object.assign({}, SETTINGS_DEFAULTS, merged); applyAppSettings();
  } else if(key==='db:roleseniority' && merged) { ROLE_SENIORITY = merged; }
  else if(key==='db:roles' && merged && !Array.isArray(merged)) { ROLES_BY_DEPT = merged; }
  if(typeof renderSide==='function') renderSide();
  if(typeof renderMain==='function') renderMain();
}

async function initApp(){
  /* All nine collections load in PARALLEL — none depends on another's value, and
     in series this was nine full round-trips before anything rendered. */
  const [crew, locations, projects, shootdays, travel, copro,
         savedRoles, savedRoleSeniority, savedSettings, vendors, feedback] = await Promise.all([
    loadDB('db:crew'), loadDB('db:locations'), loadDB('db:projects'),
    loadDB('db:shootdays'), loadDB('db:travelmethods'), loadDB('db:coprocompanies'),
    loadDB('db:roles'), loadDB('db:roleseniority'), loadDB('db:settings'),
    loadDB('db:vendors'), loadDB('db:feedback')
  ]);
  crewDB = crew; locationsDB = locations; projectsDB = projects;
  shootDaysDB = shootdays; travelMethodsList = travel; coProCompaniesList = copro;
  vendorsDB = vendors; feedbackDB = feedback;
  if(savedRoles && !Array.isArray(savedRoles) && Object.keys(savedRoles).length) ROLES_BY_DEPT = savedRoles;
  if(savedRoleSeniority && !Array.isArray(savedRoleSeniority) && Object.keys(savedRoleSeniority).length) ROLE_SENIORITY = savedRoleSeniority;
  if(savedSettings && !Array.isArray(savedSettings)) appSettings = Object.assign({}, SETTINGS_DEFAULTS, savedSettings);
  applyAppSettings();
  renderLoadFailureBanner();
  if(!travelMethodsList.length){
    travelMethodsList = ['Own car','Production transport','Train','Flying','Public transport'];
    await saveDB('db:travelmethods', travelMethodsList);
  }
  if(!dbLoadFailed.size && !crewDB.length && !locationsDB.length && !projectsDB.length){
    try{
      await loadScriptOnce('sample-data.js');
      await seedSampleData();
      await migrateCrewEntries();
      await migrateOnShoot();
      await migratePhaseMembers();
    }catch(e){ console.error('Sample data failed to load:', e); }
  }
  renderSide(); renderMain();
  renderDemoBanner();
}

/* Loads that failed are already softened to empty collections and banner-flagged;
   this catch is for anything past that (a migration throwing, a render error) so a
   broken boot says so instead of leaving a silent blank page. */
initApp().catch(e=>{
  console.error('App failed to start:', e);
  const el = document.createElement('div');
  el.className = 'save-banner save-banner-lost';
  el.innerHTML = '<div class="save-banner-text"><strong>The app hit a problem while starting.</strong> Try reloading the page; if this keeps happening, the browser console has the details.</div>'
    + '<button type="button" class="small" onclick="location.reload()">Reload</button>';

const GRID_ROW_SELECTOR = '.crewgrid-row, .meal-subrow, .pb-role-row';
const checkboxesIn = row => [...row.querySelectorAll('.crewgrid-check input[type=checkbox]')];
document.addEventListener('keydown', function(e){
  const keys = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter'];
  if(!keys.includes(e.key)) return;
  const active = document.activeElement;
  if(!active || active.type!=='checkbox' || !active.closest('.crewgrid-check')) return;

  // Enter toggles, matching Space — click() so the onchange handler still fires
  if(e.key==='Enter'){ e.preventDefault(); active.click(); return; }

  const row = active.closest(GRID_ROW_SELECTOR);
  if(!row) return;
  e.preventDefault();
  const inRow = checkboxesIn(row);
  const i = inRow.indexOf(active);

  if(e.key==='Home'){ inRow[0]?.focus(); return; }
  if(e.key==='End'){ inRow[inRow.length-1]?.focus(); return; }
  if(e.key==='ArrowRight'){ if(i<inRow.length-1) inRow[i+1].focus(); return; }
  if(e.key==='ArrowLeft'){ if(i>0) inRow[i-1].focus(); return; }

  // up/down: same column index in the nearest row that actually has checkboxes
  const allRows = [...document.querySelectorAll(GRID_ROW_SELECTOR)];
  const step = e.key==='ArrowDown' ? 1 : -1;
  for(let ri = allRows.indexOf(row) + step; ri >= 0 && ri < allRows.length; ri += step){
    const targetInputs = checkboxesIn(allRows[ri]);
    if(!targetInputs.length) continue;              // skip label-only rows
    targetInputs[Math.min(i, targetInputs.length-1)].focus();
    return;
  }
});

async function toggleAllForPerson(id, kind){
  const days = projectDays();
  if(kind==='hotel'){
    const crewId = id;
    const p = currentProject();
    p.hotelNightBefore = p.hotelNightBefore || [];
    const allOn = p.hotelNightBefore.includes(crewId) && days.every(d=>(d.hotelNights||[]).includes(crewId));
    if(allOn){
      p.hotelNightBefore = p.hotelNightBefore.filter(id=>id!==crewId);
      days.forEach(d=>{ d.hotelNights = (d.hotelNights||[]).filter(id=>id!==crewId); });
    } else {
      if(!p.hotelNightBefore.includes(crewId)) p.hotelNightBefore.push(crewId);
      days.forEach(d=>{ d.hotelNights = d.hotelNights||[]; if(!d.hotelNights.includes(crewId)) d.hotelNights.push(crewId); });
    }
    saveInBackground('db:projects', projectsDB);
  } else {
    // 'days' — Days on site, keyed by ENTRY id
    const entryId = id;
    const allOn = days.length>0 && days.every(d=>entryOnDay(entryId, d));
    days.forEach(d=>{
      d.positions = d.positions || [];
      const idx = d.positions.findIndex(pos=>pos[0]===entryId);
      if(allOn){ if(idx>-1) d.positions.splice(idx,1); }
      else if(idx===-1){ d.positions.push([entryId, '', '', '', '']); }
    });
  }
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}
/* ---- toggle-all for one meal across every day, for one person (Catering) ---- */
async function toggleAllMealForPerson(crewId, mealKey){
  const days = projectDays();
  const allOn = days.length>0 && days.every(d=>getCateringMeals(d.id, crewId)[mealKey]);
  days.forEach(d=>{
    d.cateringMeals = d.cateringMeals || {};
    d.cateringMeals[crewId] = d.cateringMeals[crewId] || {b:false, l:false, d:false};
    d.cateringMeals[crewId][mealKey] = !allOn;
    if(!d.cateringMeals[crewId].b && !d.cateringMeals[crewId].l && !d.cateringMeals[crewId].d) delete d.cateringMeals[crewId];
  });
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}

function refreshTabScrollCues(){
  document.querySelectorAll('.tabs').forEach(tabs=>{
    const overflows = tabs.scrollWidth > tabs.clientWidth + 1;
    let wrap = tabs.parentElement;
    if(!wrap || !wrap.classList.contains('tabscroll')){
      if(!overflows) return;                       // nothing to signal
      wrap = document.createElement('div');
      wrap.className = 'tabscroll';
      tabs.parentNode.insertBefore(wrap, tabs);
      wrap.appendChild(tabs);
      tabs.addEventListener('scroll', ()=>{
        const atEnd = tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2;
        wrap.classList.toggle('tabscroll-end', atEnd);
      }, {passive:true});
    }
    wrap.classList.toggle('tabscroll-end', !overflows ||
      tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2);
  });
}

function buildTaskFlags(p, days){

  if(!projectEntries(p).length) items.push({ label:'No crew assigned yet', onclick:`goProjectTab('crew')` });

  days.filter(d=>!d.locationId).forEach(d=>{
    items.push({ label:`No location — ${shootDayLabel(d)}`, onclick:`currentShootDayId='${d.id}';goProjectTab('days')` });

async function acceptAiProposal(id){
  const state = aiScanProposals[id]; if(!state || state.status!=='pending') return;
  const type = state.type;
  if(type==='propose_shoot_date'){
    const date = val(`ai-date-${id}`), label = val(`ai-label-${id}`), notes = val(`ai-notes-${id}`);
    state.status = 'accepted_new';
    await addShootDayFromProposal(date, label, notes);
  } else if(type==='propose_location'){
    const useMatch = document.getElementById(`ai-usematch-${id}`);
    const matchedLoc = useMatch && useMatch.checked && state.input.match_id ? locById(state.input.match_id) : null;
    if(matchedLoc){
      state.status = 'accepted_match'; state.matchLabel = matchedLoc.name;
      await addLocToProject(matchedLoc.id);
    } else {
      const name = val(`ai-name-${id}`), addr = val(`ai-addr-${id}`);
      state.status = 'accepted_new';
      await addNewLocationFromProposal(name, addr);
    }
  } else if(type==='propose_crew'){
    const useMatch = document.getElementById(`ai-usematch-${id}`);
    const matchedCrew = useMatch && useMatch.checked && state.input.match_id ? crewById(state.input.match_id) : null;
    if(matchedCrew){
      state.status = 'accepted_match'; state.matchLabel = matchedCrew.name;
      await addCrewToProject(matchedCrew.id);
    } else {
      const name = val(`ai-name-${id}`), dept = val(`ai-dept-${id}`), role = val(`ai-role-${id}`);
      state.status = 'accepted_new';
      await addNewCrewFromProposal(name, dept, role);
    }
  }
  renderProjectBody();
}
function discardAiProposal(id){
  const state = aiScanProposals[id]; if(!state || state.status!=='pending') return;
  state.status = 'discarded';
  renderProjectBody();
}

/* ---- file attachments ---- */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]); // strip the data: URL prefix
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
async function fileToContentBlock(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    const b64 = await fileToBase64(file);
    return { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } };
  }
  if(name.endsWith('.docx')){
    try{ await ensureMammoth(); }catch(e){ throw new Error('the .docx reader failed to load'); }
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return { type:'text', text:`[Attached document: ${file.name}]\n\n${result.value}` };
  }
  const text = await fileToText(file);
  return { type:'text', text:`[Attached document: ${file.name}]\n\n${text}` };
}
async function handleAiScanFileInput(inputEl){
  const files = [...(inputEl.files||[])];
  inputEl.value = ''; // so re-picking the same file again later still fires onchange
  const failures = [];
  for(const file of files){
    if(file.size > 15*1024*1024){ failures.push(`"${file.name}" is over 15MB — attach a smaller file.`); continue; }
    try{
      const block = await fileToContentBlock(file);
      aiScanPendingFiles.push({ block, filename: file.name });
    } catch(err){
      failures.push(`Couldn't read "${file.name}": ${err.message||err}`);
    }
  }
  aiScanError = failures.length ? failures.join('\n') : null;
  renderProjectBody();
}
function removeAiScanPendingFile(idx){ aiScanPendingFiles.splice(idx,1); renderProjectBody(); }

/* ---- sending a turn ---- */
function buildCrewSummary(){ return crewDB.map(c=>({id:c.id, name:c.name, role:c.role||''})); }
function buildLocationSummary(){ return locationsDB.map(l=>({id:l.id, name:l.name})); }
function pendingAiToolResultBlocks(){
  const last = aiScanMessages[aiScanMessages.length-1];
  if(!last || last.role!=='assistant') return [];
  const toolUses = (last.content||[]).filter(b=>b.type==='tool_use');
  return toolUses.map(tu=>{
    const st = aiScanProposals[tu.id];
    let text = 'The user has not reviewed this proposal yet.';
    if(st){
      if(st.status==='accepted_new') text = 'The user added this as a new record in the project.';
      else if(st.status==='accepted_match') text = `The user confirmed this matches an existing record (${st.matchLabel||'match'}) and assigned it to the project.`;
      else if(st.status==='discarded') text = 'The user declined this proposal. Do not propose it again unless new information changes it.';
    }
    return { type:'tool_result', tool_use_id: tu.id, content: text };
  });
}
/* strip the display-only filename we stash on document/text blocks before
   they go anywhere near the actual API request */
function stripAiScanDisplayFields(messages){
  return JSON.parse(JSON.stringify(messages, (k,v)=> k==='_filename' ? undefined : v));
}
async function sendAiScanMessage(){
  if(aiScanBusy) return;
  const text = (val('aiScanInput')||'').trim();
  const files = aiScanPendingFiles.slice();
  if(!text && !files.length) return;

  const content = files.map(f=>Object.assign({}, f.block, {_filename:f.filename}));
  if(text) content.push({ type:'text', text });
  const newUserMsg = { role:'user', content:[...pendingAiToolResultBlocks(), ...content] };

  aiScanPendingUserMsg = newUserMsg;
  aiScanBusy = true; aiScanError = null;
  renderProjectBody();

  try{
    const outgoing = stripAiScanDisplayFields([...aiScanMessages, newUserMsg]);
    const res = await fetch(AI_SCAN_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_SCAN_ANON_KEY, 'apikey':AI_SCAN_ANON_KEY },
      body: JSON.stringify({ messages: outgoing, crewSummary: buildCrewSummary(), locationSummary: buildLocationSummary() })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
    const assistantMsg = { role:'assistant', content: data.content||[] };
    assistantMsg.content.forEach(b=>{
      if(b.type==='tool_use') aiScanProposals[b.id] = { type:b.name, input:b.input||{}, status:'pending' };
    });
    aiScanMessages = [...aiScanMessages, newUserMsg, assistantMsg];
    aiScanPendingUserMsg = null;
    aiScanPendingFiles = [];
    aiScanDraftText = '';
  } catch(err){
    aiScanError = err.message || String(err);
    aiScanPendingUserMsg = null; // don't leave a fake-sent bubble behind — aiScanDraftText/aiScanPendingFiles are untouched, so Send retries cleanly
  } finally {
    aiScanBusy = false;
    renderProjectBody();
  }
}

const UNDO_WINDOW_MS = 10000;
let undoPending = null;   // {label, snaps:[{key,data}], timer}

function undoCollectionFor(key){
  return { 'db:crew':crewDB, 'db:locations':locationsDB, 'db:projects':projectsDB,
           'db:shootdays':shootDaysDB, 'db:coprocompanies':coProCompaniesList }[key];
}
function undoRestoreCollection(key, data){
  switch(key){
    case 'db:crew':          crewDB = data; break;
    case 'db:locations':     locationsDB = data; break;
    case 'db:projects':      projectsDB = data; break;
    case 'db:shootdays':     shootDaysDB = data; break;
    case 'db:coprocompanies':coProCompaniesList = data; break;
  }
}
/* Call AFTER the confirm() has passed but BEFORE anything is mutated. */
function beginUndo(keys){
  return keys.map(k=>({ key:k, data:dbClone(undoCollectionFor(k)) }));
}
function finishUndo(label, snaps){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = { label, snaps, timer:setTimeout(dismissUndo, UNDO_WINDOW_MS) };
  renderUndoToast();
}
function dismissUndo(){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = null; renderUndoToast();
}
async function undoLastAction(){
  if(!undoPending) return;
  const snaps = undoPending.snaps;
  dismissUndo();
  for(const s of snaps){ undoRestoreCollection(s.key, s.data); await saveDB(s.key, s.data); }
  // A deleted project/day may have been the open one — bounce out rather than
  // leaving the screen pointed at a record that has just come back differently.
  if(currentProjectId && !projById(currentProjectId)){ route={screen:'welcome'}; currentProjectId=null; }
  renderSide(); renderMain();
}
function renderUndoToast(){
  let el = document.getElementById('undoToast');
  if(!undoPending){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='undoToast'; document.body.appendChild(el); }
  el.className = 'undo-toast';
  el.innerHTML = `<span>${esc(undoPending.label)}</span>
    <span class="undo-action" onclick="undoLastAction()">Undo</span>
    <span class="undo-close" onclick="dismissUndo()" title="Dismiss">${icon('close')}</span>`;
}

async function deleteProject(id){
  if(!confirm('Delete this project and all its shoot days? Crew and locations in your databases are not affected.')) return;
  const proj = projById(id);

  projectsDB = projectsDB.filter(p=>p.id!==id);
  shootDaysDB = shootDaysDB.filter(d=>d.projectId!==id);
  await saveDB('db:projects', projectsDB); await saveDB('db:shootdays', shootDaysDB);
  route={screen:'welcome'}; currentProjectId=null; renderSide(); renderMain();
  finishUndo(`Deleted project "${(proj&&(proj.title||proj.client))||''}" and its shoot days.`, snaps);
}

function matchesCrewFilterState(c, f){
  if(f.depts.size && !f.depts.has(deptBucketKey(c.department))) return false;
  if(f.company==='__blank__' && (c.coProductionCompany||'')) return false;
  else if(f.company && f.company!=='__blank__' && (c.coProductionCompany||'')!==f.company) return false;

  if(f.excludeOtherCompanies && (c.coProductionCompany||'')) return false;
  return true;
}

  const onDay = c.crewId ? (d => entryOnDay(c.id, d)) : (d => crewOnDay(c.id, d, p));
  return f.daysMode==='and' ? days.every(onDay) : days.some(onDay);

function crewSeniorityBand(c){

function sortProjectCrewGroup(list, p, days){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  switch(projectCrewFilter.sort){
    case 'name': return list.slice().sort(byName);
    case 'role': return list.slice().sort((a,b)=>(a.role||'').localeCompare(b.role||'')||byName(a,b));
    case 'seniority': return list.slice().sort((a,b)=>roleSeniorityRank(a.department,a.role)-roleSeniorityRank(b.department,b.role)||byName(a,b));
    case 'company': return list.slice().sort((a,b)=>(a.coProductionCompany||'￿').localeCompare(b.coProductionCompany||'￿')||byName(a,b));
    case 'daysCount': {
      const pj = currentProject();
      const dayCount = c => c.isPersonBlock ? crewDayCount(personIdOf(c), days, pj)
                          : c.crewId ? entryDayCount(c.id, days) : crewDayCount(c.id, days, pj);
      return list.slice().sort((a,b)=>dayCount(b)-dayCount(a)||byName(a,b));
    }
    case 'added': {
      // Phase BK — a person joined the project when their FIRST entry did, not when
      // their highest-seniority one did, so a block ranks on its earliest entry.
      const order = projectEntries(p).map(e=>e.id);
      const idx = c => c.isPersonBlock
        ? Math.min(...c.entries.map(e=>order.indexOf(e.id)))
        : order.indexOf(c.id);
      return list.slice().sort((a,b)=>idx(a)-idx(b));
    }
    case 'dept':
    default: return sortHoDFirst(list);
  }
}
function buildProjectCrewGroups(list, p, days){
  const gb = projectCrewFilter.groupBy;
  const bySort = arr => sortProjectCrewGroup(arr, p, days);
  const bucketOf = keyFn => {
    const buckets = {};
    list.forEach(c=>{ const key = keyFn(c); (buckets[key]=buckets[key]||[]).push(c); });
    return buckets;
  };
  const groupAlpha = (rawKeyFn, blankLabel) => {
    const buckets = bucketOf(c => rawKeyFn(c) || blankLabel);
    const keys = Object.keys(buckets).sort((a,b)=> a===blankLabel?1 : b===blankLabel?-1 : a.localeCompare(b));
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  };
  const groupFixed = (keyFn, orderedKeys) => {
    const buckets = bucketOf(keyFn);
    return orderedKeys.filter(k=>buckets[k]&&buckets[k].length).map(k=>({key:k, label:k, code:'', items:bySort(buckets[k])}));
  };
  const SIMPLE_GROUPERS = {
    company:  () => groupAlpha(c => c.coProductionCompany, 'No lead company'),
    role:     () => groupAlpha(c => c.role, 'No role set'),
    travel:   () => groupAlpha(c => ((p&&p.travelMethods)||{})[personIdOf(c)], 'Not set'),
    catering: () => groupAlpha(c => c.dietaryGeneral, 'Standard / not set'),
    hotel:      () => groupFixed(c => personHasHotel(c,p,days) ? 'Has hotel' : 'No hotel', ['Has hotel','No hotel']),
    personType: () => groupFixed(c => deptBucketKey(c.department)==='Talent' ? 'Talent' : deptBucketKey(c.department)==='Client' ? 'Client' : 'Crew', ['Crew','Talent','Client']),
    // c.vatRegistered is strictly '' / 'Yes' / 'No' — the same #ncVat field
    // Budget's VAT calc already reads (buildBudgetData()), not a second source
    vat:        () => groupFixed(c => c.vatRegistered==='Yes' ? 'VAT registered' : c.vatRegistered==='No' ? 'Not VAT registered' : 'Not set', ['VAT registered','Not VAT registered','Not set']),
    seniority:  () => groupFixed(crewSeniorityBand, ['Department leads','Mid-level','Support / entry level']),
  };
  if(SIMPLE_GROUPERS[gb]) return SIMPLE_GROUPERS[gb]();

  if(gb==='deptCompany'){
    const meta = {};
    list.forEach(c=>{
      const dept = deptBucketKey(c.department), co = c.coProductionCompany || 'No lead company';
      const key = `${dept} — ${co}`;
      (meta[key]=meta[key]||{dept,co,items:[]}).items.push(c);
    });
    return Object.keys(meta)
      .sort((a,b)=> (DEPARTMENTS.indexOf(meta[a].dept)-DEPARTMENTS.indexOf(meta[b].dept)) || meta[a].co.localeCompare(meta[b].co))
      .map(key=>({key, label:key, code:DEPARTMENT_CODES[meta[key].dept]||'', items:bySort(meta[key].items)}));
  }
  if(gb==='daysOnSite'){
    // Phase BK — a PERSON BLOCK is on a day if ANY of its entries is (crewOnDay, the
    // person-level signal), so a two-role person lands in that day's bucket once.
    const isOn = (c, d) => c.isPersonBlock ? crewOnDay(personIdOf(c), d, p)
                         : c.crewId ? entryOnDay(c.id, d) : crewOnDay(c.id, d, p);
    const buckets = {};
    (days||[]).forEach(d=>{
      const onDay = list.filter(c=>isOn(c, d));
      if(onDay.length) buckets[`Day ${d.dayNum||'?'}`] = onDay;
    });
    const notOn = list.filter(c=>!(days||[]).some(d=>isOn(c, d)));
    if(notOn.length) buckets['Not on any shoot day'] = notOn;
    const keys = (days||[]).map(d=>`Day ${d.dayNum||'?'}`).filter(k=>buckets[k]).concat(notOn.length?['Not on any shoot day']:[]);
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  }
  if(gb==='none'){
    const buckets = bucketOf(c => deptBucketKey(c.department));
    const known = DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length);
    const rest = Object.keys(buckets).filter(d=>!DEPARTMENTS.includes(d)).sort();
    const items = known.concat(rest).reduce((out,d)=>out.concat(bySort(buckets[d])), []);
    return [{key:'all', label:'All crew', code:'', items}];
  }
  // default: 'dept'
  const buckets = bucketOf(c => deptBucketKey(c.department));
  return DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length).map(d=>({key:d, label:d, code:DEPARTMENT_CODES[d]||'', items:bySort(buckets[d])}));
}

function buildPersonBlocks(entryViews){

    byPerson.get(v.crewId).push(v);
  });
  return order.map(crewId=>{

    return Object.assign({}, topSeniorityEntry(entries), { crewId, entries, isPersonBlock:true });
  });
}

let frontedEntryCache = { view:null, projectId:null, map:new Map() };
function frontedCacheMap(){
  if(frontedEntryCache.view!==crewGridView || frontedEntryCache.projectId!==currentProjectId){
    frontedEntryCache = { view:crewGridView, projectId:currentProjectId, map:new Map() };
  }
  return frontedEntryCache.map;
}
function resetFrontedEntryCache(){ frontedEntryCache = { view:null, projectId:null, map:new Map() }; }
function phaseDaysOfEntry(entryId, p, days){
  // Phase BT — both phase tabs front on their OWN booked days, each reading only its
  // own store; everything else still fronts on the shoot-day signal.
  if(isPhaseTab(crewGridView)) return phaseDaysOf(crewGridView, entryId, p) || 0;
  return entryDayCount(entryId, days);
}
/* works on entry views AND on raw p.crewEntries records — both carry id/role/department */
function pickFrontedEntry(entries, p, days){
  return entries.slice().sort((a,b)=>
      (phaseDaysOfEntry(b.id, p, days) - phaseDaysOfEntry(a.id, p, days))
   || (seniorityRankOf(a) - seniorityRankOf(b))
  )[0];
}
/* the fronted entry of a block being rendered — memoised, re-picked if the cached
   choice is not among this block's currently visible entries */
function frontedEntryOfBlock(block, p, days){
  const entries = block.entries;
  if(entries.length<2) return entries[0];
  const map = frontedCacheMap();
  const cached = map.get(block.crewId);
  if(cached){ const hit = entries.find(e=>e.id===cached); if(hit) return hit; }
  const best = pickFrontedEntry(entries, p, days);
  map.set(block.crewId, best.id);
  return best;
}
/* a person's entries that are CURRENTLY ON SCREEN — the same entry-grain filter test
   renderProjectCrew() builds the blocks from, so this can't drift from what is rendered. */
function visibleEntriesForPerson(crewId, p){

function bulkTargetEntryId(crewId, fallbackEntry, p, days){
  const pool = visibleEntriesForPerson(crewId, p).filter(v=>projectCrewSelected.has(v.id));
  if(!pool.length) return fallbackEntry.id;
  if(pool.length===1) return pool[0].id;
  const cached = frontedCacheMap().get(crewId);
  if(cached && pool.some(v=>v.id===cached)) return cached;
  return pickFrontedEntry(pool, p, days).id;
}

const ROLES_FREEZE_MIN_W = 901;   // matches the @media(max-width:900px) block that releases it
function sizeRolesTablewrap(){
  const el = document.querySelector('.roles-tablewrap');
  if(!el) return;
  /* ⚠️ Below the mobile breakpoint the CSS releases the scroll box entirely (see the
     @media(max-width:900px) rule), so an inline max-height here would fight it and win. Clear
     it rather than compute one. */
  if(window.innerWidth < ROLES_FREEZE_MIN_W){ el.style.maxHeight = ''; fitRolesZone(); return; }
  const top = el.getBoundingClientRect().top;
  el.style.maxHeight = Math.max(240, Math.round(window.innerHeight - top - 24)) + 'px';
  fitRolesZone();
}
const ROLES_ZONE_MIN_GUTTER = 40;   // the floor of .roles-widezone's own clamp()
/* the same gutter .roles-widezone's CSS clamp() resolves to, in JS, so the two cannot drift */
const rolesZoneGutter = () =>
  Math.min(110, Math.max(ROLES_ZONE_MIN_GUTTER, document.documentElement.clientWidth * 0.05));
function fitRolesZone(){
  const zone = document.querySelector('.roles-zone');
  const el = document.querySelector('.roles-tablewrap');
  if(!zone) return;
  zone.style.marginLeft = zone.style.marginRight = '';
  if(!el || window.innerWidth < ROLES_FREEZE_MIN_W) return;   // mobile has always just scrolled
  const wide = zone.classList.contains('roles-widezone');
  zone.style.marginLeft = zone.style.marginRight = '0px';
  const overflow = el.scrollWidth - el.clientWidth;
  if(overflow <= 0) return;                                    // fits the paper column: leave it there
  const gutter = rolesZoneGutter();
  const box = zone.getBoundingClientRect();
  if(!wide){
    /* Budget OFF — grow RIGHT only, so the left edge stays on the banner. See the note above. */
    const room = document.documentElement.clientWidth - box.right - ROLES_ZONE_MIN_GUTTER;
    const take = Math.min(overflow, Math.max(0, room));
    if(take > 0) zone.style.marginRight = -take + 'px';
    return;
  }
  const maxBleed = Math.max(0, Math.min(box.left, document.documentElement.clientWidth - box.right) - gutter);
  const bleed = Math.min(Math.ceil(overflow / 2), maxBleed);
  if(bleed > 0) zone.style.marginLeft = zone.style.marginRight = -bleed + 'px';
}

const ROLES_NAV_SEL = 'input:not([type=hidden]), button, select, textarea';
const rolesNavTarget = cell => {
  if(!cell) return null;
  if(cell.matches('[tabindex]:not([tabindex="-1"])')) return cell;
  const el = cell.querySelector(ROLES_NAV_SEL);
  return (el && !el.disabled) ? el : null;
};
const rolesNavRows = () => {
  const wrap = document.querySelector('.roles-tablewrap');
  /* offsetParent filters out rows inside a collapsed department — arrowing down should
     land on the next row you can SEE, not walk invisibly through a folded group */
  return wrap ? [...wrap.querySelectorAll('.roles-grid.pb-head')].filter(r=>r.offsetParent!==null) : [];
};
function rolesNavFocus(cell){
  const el = rolesNavTarget(cell);
  if(!el) return false;
  el.focus();
  if(el.tagName==='INPUT' && el.type==='text' && el.select) el.select();
  el.scrollIntoView({block:'nearest', inline:'nearest'});
  return true;
}
function onRolesGridKey(ev){
  const key = ev.key;
  if(key!=='ArrowUp' && key!=='ArrowDown' && key!=='ArrowLeft' && key!=='ArrowRight') return;
  if(ev.altKey || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
  const el = ev.target;
  const cell = el && el.closest && el.closest('.roles-grid.pb-head > *');
  if(!cell) return;
  /* the day ticks that Space opens are ordinary checkbox cells to the right of Shoot, so
     nothing special is needed for them — they are reached, and filled, exactly like Buyout */
  const row = cell.parentElement;
  const horizontal = key==='ArrowLeft' || key==='ArrowRight';
  /* the free-text exception — see the note above. A number cell (.roles-num / the rate) is
     not asked; it always moves. */
  if(horizontal && el.tagName==='INPUT' && el.type==='text' && !cell.matches('.roles-num, .roles-grid-rate')){
    const at = el.selectionStart;
    if(at!==el.selectionEnd) return;                       // a selection: let the arrow collapse it
    if(key==='ArrowLeft'  && at>0) return;
    if(key==='ArrowRight' && at<(el.value||'').length) return;
  }
  const cells = [...row.children];
  const i = cells.indexOf(cell);
  const step = (key==='ArrowRight' || key==='ArrowDown') ? 1 : -1;
  let moved = false;
  if(horizontal){
    /* skip cells with nothing to focus — Total, Subtotal and the Shoot count are read-only,
       and stopping on them would be a dead keypress in the middle of a row */
    for(let j=i+step; j>=0 && j<cells.length && !moved; j+=step) moved = rolesNavFocus(cells[j]);
  } else {
    const rows = rolesNavRows(), r = rows.indexOf(row);
    for(let j=r+step; j>=0 && j<rows.length && !moved; j+=step) moved = rolesNavFocus(rows[j].children[i]);
  }
  /* only swallow the key if it actually moved — at the edge of the table the arrow should
     still scroll the page, as it would anywhere else */
  if(moved) ev.preventDefault();
}
document.addEventListener('keydown', onRolesGridKey);
let rolesFocusMark = null;
document.addEventListener('focusin', ev=>{
  const cell = ev.target && ev.target.closest && ev.target.closest('.roles-grid.pb-head > *');
  if(!cell) return;
  const row = cell.parentElement, id = (row.id||'').replace('role-row-','');
  if(id) rolesFocusMark = {entryId:id, i:[...row.children].indexOf(cell), at:Date.now()};
});
function restoreRolesFocus(){
  const m = rolesFocusMark;
  if(!m || Date.now()-m.at > 3000) return;
  const ae = document.activeElement;
  if(ae && ae!==document.body && ae.closest && ae.closest('.roles-tablewrap')) return;  // never left
  const row = document.getElementById('role-row-'+m.entryId);
  /* ⚠️ The Shoot cell keeps its index when the day ticks open — they are inserted AFTER it —
     so expanding with Space lands focus back on the same cell it was pressed from, and the
     next Right steps onto D1. Do not "fix" the index for the new columns. */
  const el = rolesNavTarget(row && row.children[m.i]);
  if(!el) return;
  el.focus();
  if(el.tagName==='INPUT' && el.type==='text' && el.select) el.select();
}

const NAME_ABBREV_MAX = 10;
function rolesShortName(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  const first = parts[0].length>NAME_ABBREV_MAX ? parts[0].slice(0,NAME_ABBREV_MAX)+'…' : parts[0];
  if(parts.length===1) return first;
  return first + ' ' + parts.slice(1).map(w=>w[0].toUpperCase()+'.').join('');
}
const ROLE_JOINERS = new Set(['of','and','the','for','to','a']);
function rolesShortRole(role){
  const raw = String(role||'').trim();
  if(!raw) return '';
  const words = raw.split(/[\s/]+/).filter(Boolean).filter(w=>!ROLE_JOINERS.has(w.toLowerCase()));
  if(words.length<2) return raw.length>NAME_ABBREV_MAX+2 ? raw.slice(0,NAME_ABBREV_MAX+2)+'…' : raw;
  /* a word that is already an abbreviation ("AD", "PA", "DOP") contributes itself, not just
     its first letter — "1st AD" must not collapse to "1A" */
  return words.map(w=>(w.length<=3 && w===w.toUpperCase()) ? w : w[0].toUpperCase()).join('');
}

function rolesColumns(data){
  const money = crewShowMoney;
  const people = (data && data.people) || [];
  /* Kit and Labour appear only when the toggle is on AND somebody here actually has a
     split rate — the same rule Per Person uses, so two empty columns don't turn up on a
     job where nobody brings kit. */

  const cols = [];
  const push = (head, width, o) => cols.push(Object.assign({head, width}, o||{}));
  if(money) push('Total', '92px', {key:'total', title:'Fee for this role across every phase being costed — inc-VAT, the same figure the Budget shows'});
  CREW_PHASES.forEach(ph=>{
    if(!budgetScope[ph.scope]) return;
    const isShoot = ph.view==='days';
    /* the Shoot header is a CONTROL in the modes that show a count — clicking it opens the
       per-day ticks to its right. `chev` is the whole cue: a caret and the word, no button
       chrome, matching the app's other disclosure headers (dept-caret, sd-block-head). */
    const canOpen = isShoot && projectDays().length>0;
    push(canOpen
        ? `<span class="roles-shoot-head" role="button" tabindex="0"
             onclick="event.stopPropagation();toggleRolesShootColumn()"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleRolesShootColumn();}"
             aria-expanded="${rolesShootOpen()?'true':'false'}"
             ><span class="dept-caret">${rolesShootOpen()?'▾':'▸'}</span>${ph.head}</span>`
        : ph.head,
      '46px',
      {key:'phase', phase:ph,
       title: canOpen ? (rolesShootOpen()?'Click to close the day ticks':'Click to tick which shoot days') : ph.headTitle});
    if(isShoot && rolesShootOpen()){
      projectDays().forEach(d=>push(`D${esc(d.dayNum||'?')}`, '30px',
        {key:'shootday', day:d,
         title:`Day ${esc(d.dayNum||'?')} — ${esc(fmtDate(d.date)||'date not set')}`}));
    }
    if(isShoot && budgetScope.production){
      push('OT', '46px', {key:'overtime',
        title:'Overtime, in units — a unit is one day’s equivalent, so 0.5 is half a day, costed at the day rate. Not costed on a buyout (no day rate to multiply) or with no shoot days.'});
    }
  });
  /* Buyout is a fact about the DEAL — one agreed fee rather than a day rate — so it sits
     beside the day counts whose meaning it changes. (Phase BV kept it out of the old DATES
     mode; there are no modes to be in or out of since Phase CF.) */
  push('Buyout', '60px', {key:'buyout', title:'One agreed fee for the whole job — the day counts only split it across the phases'});
  if(money){

function applyRolesColumnOrder(cols){
  const order = appSettings.rolesColumnOrder;
  if(!order || !order.length) return cols;
  /* a unit is a column plus whatever must travel with it */
  const units = [];
  cols.forEach(c=>{
    if(c.key==='shootday' && units.length) units[units.length-1].cols.push(c);
    else units.push({id:c.id, cols:[c]});
  });
  let rank = -1;
  return units.map((u,i)=>{
    const r = order.indexOf(u.id);
    if(r>=0){ rank = r; return {u, r, tie:0, i}; }
    return {u, r:rank, tie:1, i};
  }).sort((a,b)=> a.r-b.r || a.tie-b.tie || a.i-b.i)
    .reduce((out,k)=>out.concat(k.u.cols), []);
}

function rolesVisibleColIds(){

}
function reorderRolesColumns(visibleIds, dragId, targetId, after){
  const out = (appSettings.rolesColumnOrder || []).slice();
  visibleIds.forEach((id,i)=>{
    if(out.includes(id)) return;
    const prev = visibleIds.slice(0,i).reverse().find(x=>out.includes(x));
    out.splice(prev ? out.indexOf(prev)+1 : 0, 0, id);
  });
  const next = out.filter(id=>id!==dragId);
  const t = next.indexOf(targetId);
  if(t<0) return out;
  next.splice(after ? t+1 : t, 0, dragId);
  return next;
}

     column instead of the top of the document */

function rolesClearDropCues(){

    .forEach(el=>el.classList.remove('roles-col-dropbefore','roles-col-dropafter'));

const rolesDropAfter = (ev, el) => {
  const r = el.getBoundingClientRect();
  return ev.clientX > r.left + r.width/2;
};
function onRolesColDragStart(ev, id){
  rolesDragColId = id;
  ev.dataTransfer.effectAllowed = 'move';
  /* Firefox refuses to start a drag with no payload; the id is also the payload */
  try{ ev.dataTransfer.setData('text/plain', id); }catch(_){}
  ev.currentTarget.classList.add('roles-col-dragging');
}
function onRolesColDragOver(ev, id){
  if(!rolesDragColId || rolesDragColId===id) return;
  ev.preventDefault();                      // without this the drop never fires
  ev.dataTransfer.dropEffect = 'move';
  const el = ev.currentTarget;
  const after = rolesDropAfter(ev, el);
  rolesClearDropCues();
  el.classList.add(after ? 'roles-col-dropafter' : 'roles-col-dropbefore');
}
function onRolesColDragLeave(ev){
  ev.currentTarget.classList.remove('roles-col-dropbefore','roles-col-dropafter');
}
function onRolesColDragEnd(){
  rolesDragColId = null;
  rolesClearDropCues();
  document.querySelectorAll('.roles-col-dragging').forEach(el=>el.classList.remove('roles-col-dragging'));
}
function onRolesColDrop(ev, id){
  ev.preventDefault();
  const drag = rolesDragColId, after = rolesDropAfter(ev, ev.currentTarget);
  const ids = rolesVisibleColIds();
  onRolesColDragEnd();
  if(!drag || drag===id) return;
  saveRolesColumnOrder(reorderRolesColumns(ids, drag, id, after));
}
/* Alt+←/→ — the same move without a mouse, and the reason the drag can stay pointer-only */
function onRolesColKey(ev, id){
  if(!ev.altKey || (ev.key!=='ArrowLeft' && ev.key!=='ArrowRight')) return;
  ev.preventDefault();
  const ids = rolesVisibleColIds();
  const j = ids.indexOf(id) + (ev.key==='ArrowLeft' ? -1 : 1);
  if(j<0 || j>=ids.length) return;
  saveRolesColumnOrder(reorderRolesColumns(ids, id, ids[j], ev.key==='ArrowRight'), id);
}

async function setEntryOvertime(entryId, rawValue){

  if(!entryById(entryId, p)) return;
  const trimmed = (rawValue||'').trim();
  let next = null;
  if(trimmed!==''){
    const n = Number(trimmed);
    /* garbage reverts by re-rendering without saving, exactly as saveEntryRate() and
       setPhaseDays() do — the field visibly returns to the last stored value rather than
       sitting there holding text nothing accepted */
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }

     idiom phaseWrite() and saveEntryRate() use, so a project nobody has touched carries no key */
  if(next==null) delete p.overtime[entryId]; else p.overtime[entryId] = next;

    if(next==null) delete p.overtime[id]; else p.overtime[id] = next;

function abbreviateName(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  if(parts.length===1) return parts[0];
  return `${parts[0][0].toUpperCase()}. ${parts[parts.length-1]}`;
}
function buildHotelSummary(){
  const p = currentProject(); if(!p) return null;
  const days = projectDays();
  if(!days.length) return null;
  const preDate = days[0].date ? new Date(new Date(days[0].date+'T00:00:00').getTime()-86400000) : null;
  const nights = [{
    label: preDate ? fmtDate(preDate.toISOString().slice(0,10)) : 'Night before Day 1',
    date: preDate,
    guestIds: p.hotelNightBefore||[]
  }];
  days.forEach(d=>{
    nights.push({
      label: d.date ? fmtDate(d.date) : `Day ${d.dayNum||'?'}`,
      date: d.date ? new Date(d.date+'T00:00:00') : null,
      guestIds: d.hotelNights||[]
    });
  });
  const active = nights.filter(n=>n.guestIds.length);
  if(!active.length) return null;

  const personMap = new Map();
  active.forEach(n=>{
    n.guestIds.forEach(id=>{
      if(!personMap.has(id)) personMap.set(id, { id, name: crewInfo(id).name, nightDates:[] });
      personMap.get(id).nightDates.push(n.date);
    });
  });
  const people = [...personMap.values()].map(person=>{
    const dated = person.nightDates.filter(Boolean).sort((a,b)=>a-b);
    const checkIn = dated.length ? dated[0] : null;
    const lastNight = dated.length ? dated[dated.length-1] : null;
    return {
      id: person.id, name: person.name,
      totalNights: person.nightDates.length,
      checkIn, checkOut: lastNight ? new Date(lastNight.getTime()+86400000) : null
    };
  });
  people.sort((a,b)=>{
    const at = a.checkIn ? a.checkIn.getTime() : Infinity;
    const bt = b.checkIn ? b.checkIn.getTime() : Infinity;
    return at!==bt ? at-bt : b.totalNights-a.totalNights;
  });
  const orderIndex = new Map(people.map((pp,i)=>[pp.id,i]));

  const perNight = active.map(n=>{
    const ids = [...n.guestIds].sort((x,y)=>(orderIndex.get(x)??999)-(orderIndex.get(y)??999));
    return { label:n.label, rooms:ids.length, names: ids.map(id=>abbreviateName(crewInfo(id).name)) };
  });
  const roomBooking = people.map((pp,i)=>({
    roomNo: i+1, name: pp.name,
    from: pp.checkIn ? fmtDate(pp.checkIn.toISOString().slice(0,10)) : '—',
    to: pp.checkOut ? fmtDate(pp.checkOut.toISOString().slice(0,10)) : '—',
    totalNights: pp.totalNights
  }));
  const maxRooms = Math.max(...active.map(n=>n.guestIds.length));
  const dateRange = `${active[0].label} – ${active[active.length-1].label}`;
  const summary = `${maxRooms} room${maxRooms>1?'s':''} max, ${active.length} night${active.length>1?'s':''}, ${dateRange}`;
  return { summary, perNight, roomBooking };
}

function buildCateringSummaryGrid(personOk){
  personOk = personOk || (()=>true);
  const p = currentProject(); if(!p) return null;
  const days = projectDays();
  if(!days.length) return null;
  const costs = getCateringCosts(p);
  const cols = days.map(d=>{
    const label = d.date ? fmtDate(d.date) : `Day ${d.dayNum||'?'}`;
    /* ⚠️ Meals are kept on the day record for everyone, on the shoot or not — taking
       someone off does not wipe what you had ticked. They simply stop being counted, so
       putting them back gives the identical headcount. */
    const meals = d.cateringMeals || {};
    let b=0, l=0, dd=0;
    Object.entries(meals).forEach(([crewId,m])=>{
      if(!crewOnShoot(crewId, p) || !personOk(crewId)) return;
      if(m.b) b++; if(m.l) l++; if(m.d) dd++;
    });
    const deliveryFee = (b>0?costs.delivery:0) + (l>0?costs.delivery:0) + (dd>0?costs.delivery:0);
    const dailyCost = (b*costs.b) + (l*costs.l) + (dd*costs.d) + deliveryFee;
    return { dayId:d.id, dayNum:d.dayNum, label, b, l, d:dd, deliveryFee, dailyCost };
  });
  const totalCost = cols.reduce((sum,c)=>sum+c.dailyCost, 0);
  const OMNI = 'Omnivore / eats everything';
  const dietOf = c => (c && c.dietaryGeneral) ? c.dietaryGeneral : OMNI;
  const fedPerDay = days.map(d=>Object.entries(d.cateringMeals||{})
    .filter(([crewId,m])=>m && (m.b||m.l||m.d) && crewOnShoot(crewId, p) && personOk(crewId))
    .map(([crewId])=>crewById(crewId))
    .filter(Boolean));
  const dietLabels = [...new Set(fedPerDay.flat().map(dietOf))]
    .sort((a,b)=> a===OMNI ? -1 : b===OMNI ? 1 : a.localeCompare(b));   // omnivores first, the rest alphabetical
  const diets = dietLabels.map(label=>({
    label,
    perDay: fedPerDay.map(list=>list.filter(c=>dietOf(c)===label).length),
    peak: Math.max(0, ...fedPerDay.map(list=>list.filter(c=>dietOf(c)===label).length))
  }));
  /* Specials: everyone fed who has ANYTHING recorded — a diet, a note, or both. Someone
     with both fields empty is an omnivore with no requirements and is left out, which is
     the "don't include people who are blank" rule. */
  const fedOnce = [...new Map(fedPerDay.flat().map(c=>[c.id,c])).values()]
    .filter(c=>c.dietaryGeneral || c.dietarySpecific)
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const specials = fedOnce.map(c=>({ id:c.id, name:c.name||'', general:c.dietaryGeneral||'', specific:c.dietarySpecific||c.dietary||'' }));
  return { costs, cols, totalCost, diets, specials, fedPeak: Math.max(0, ...fedPerDay.map(l=>l.length)) };
}

function buildTransportSummary(personOk){
  personOk = personOk || (()=>true);
  const p = currentProject(); if(!p) return null;
  const days = projectDays();
  if(!days.length) return null;
  const costs = getTransportCosts(p);
  const travelMethods = p.travelMethods || {};
  const assigned = projectCrew(p).map(c=>c.id).filter(personOk);
  // only show methods actually chosen by someone on this project, in travelMethodsList order
  const usedMethods = travelMethodsList.filter(m=>assigned.some(id=>travelMethods[id]===m));
  if(!usedMethods.length) return null;
  const cols = days.map(d=>{
    const label = d.date ? fmtDate(d.date) : `Day ${d.dayNum||'?'}`;
    const onSite = assigned.filter(id=>crewOnDay(id, d, p));
    const counts = {};
    usedMethods.forEach(m=>counts[m]=0);
    onSite.forEach(id=>{
      const m = travelMethods[id];
      if(m && counts.hasOwnProperty(m)) counts[m]++;
    });
    const carCount = counts['Own car']||0;
    const publicCount = counts['Public transport']||0;
    const dailyCost = (carCount*costs.mileage) + (publicCount*costs.publicPerDay);
    /* G15 — see buildCateringSummaryGrid(): dayId is the join key, dayNum is the
       column heading. */
    return { dayId:d.id, dayNum:d.dayNum, label, counts, dailyCost };

}

function camerasForEdit(scope){
  if(scope==='project'){
    const p = currentProject(); if(!p) return null;
    p.cameras = normalizeCameras(p.cameras, currentProjectId);
    return { obj:p.cameras, key:'db:projects', arr:()=>projectsDB };
  }
  const day = currentDay(); if(!day) return null;
  if(!day.cameras){
    day.cameras = JSON.parse(JSON.stringify(resolveCameras(day)));   // fork the resolved (already-normalized) default
  } else {
    day.cameras = normalizeCameras(day.cameras, day.projectId);
  }
  return { obj:day.cameras, key:'db:shootdays', arr:()=>shootDaysDB };
}
/* every camera edit ends the same way: persist, re-render the list, and (day scope
   only) refresh the "differs from project defaults" banner */
async function commitCameras(scope, t){
  await saveDB(t.key, t.arr());
  renderCameraDesignations(scope);
  if(scope==='day') refreshTechSpecsBanner();
  else renderTechSpecsRoundup();
}
async function moveOperator(scope, crewId, dir){
  const t = camerasForEdit(scope); if(!t) return;
  const order = t.obj.order;
  const i = order.indexOf(crewId), j = i+dir;
  if(i<0||j<0||j>=order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  await commitCameras(scope, t);
}
async function addOperatorCamera(scope, crewId){

  const c = crewById(crewId) || {};
  const defaults = [c.camera1, c.camera2, c.camera3];
  list.push({ body: defaults[list.length]||'', shorthand:'' });

}
async function removeOperatorCamera(scope, crewId, index){

  await commitCameras(scope, t);

async function removeUnnamedCamera(scope, index){

}
