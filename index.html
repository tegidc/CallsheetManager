function aiScanMessageHTML(msg){
  const isUser = msg.role==='user';
  const blocks = Array.isArray(msg.content) ? msg.content : [{type:'text', text:msg.content}];
  const parts = blocks.map(b=>{
    if(b.type==='text') return `<div class="ai-bubble-text">${esc(b.text).replace(/\n/g,'<br>')}</div>`;
    if(b.type==='document') return `<div class="ai-bubble-file">${icon('doc')} ${esc(b._filename||'Attached document')}</div>`;
    if(b.type==='tool_use') return proposalCardHTML(b);
    return ''; // tool_result and anything else: bookkeeping, not shown as a bubble
  }).filter(Boolean).join('');
  if(!parts) return '';
  return `<div class="ai-turn ${isUser?'ai-turn-user':'ai-turn-assistant'}">
    <div class="ai-turn-role">${isUser?'You':'Claude'}</div>
    ${parts}
  </div>`;
}
/* The AI Chat panel body — formerly the whole of the standalone "AI Scan"
   section (its own .section, header and open/close toggle). Now just the
   panel content for quickAddMode==='ai', same slot the other three quick-add
   controls render into. Project-switch reset moved to quickAddSectionHTML(),
   since that's the function that now runs on every Overview render regardless
   of which control (if any) is open. */
function aiScanChatBodyHTML(){
  const displayMessages = aiScanPendingUserMsg ? [...aiScanMessages, aiScanPendingUserMsg] : aiScanMessages;
  const turnsHTML = displayMessages.map(aiScanMessageHTML).filter(Boolean).join('');
  const chipsHTML = aiScanPendingFiles.length ? `<div class="ai-attachments">${aiScanPendingFiles.map((f,i)=>
    `<span class="pill">${icon('doc')} ${esc(f.filename)} <span onclick="removeAiScanPendingFile(${i})" style="cursor:pointer;" title="Remove">${icon('close')}</span></span>`).join('')}</div>` : '';
  const errorHTML = aiScanError ? `<div class="ai-error">${esc(aiScanError)}</div>` : '';
  // Shown before anything is typed, not after a failed send (R14).
  const notConfiguredHTML = aiScanConfigState === 'missing'
    ? `<div class="ai-notconfigured">${icon('sparkle')} <strong>AI Scan isn't set up yet.</strong>
         The server has no Anthropic API key, so sending a message will fail. Someone needs to run
         <code>supabase secrets set ANTHROPIC_API_KEY=…</code> once — it's a credential, so it can't be
         done from inside the app.</div>`
    : '';
  return `
    ${notConfiguredHTML}
    <div class="hint" style="margin-bottom:10px;">Chat about the project, or attach a briefing document (PDF, .docx, .txt) — Claude proposes shoot dates, locations and crew as you go. Nothing is added until you tick a proposal. This conversation isn't saved — it starts over if you leave and come back.</div>
    <div class="ai-chat" id="aiScanChat">${turnsHTML || '<div class="empty-note">Say something about the project, or attach a briefing document, to get started.</div>'}</div>
    ${errorHTML}
    ${aiScanBusy ? `<div class="hint" style="margin-bottom:8px;">Thinking…</div>` : ''}
    ${chipsHTML}
    <div class="ai-input-row">
      <input type="file" id="aiScanFileInput" accept=".pdf,.docx,.txt" multiple style="display:none" onchange="handleAiScanFileInput(this)">
      <button class="icon-btn" onclick="document.getElementById('aiScanFileInput').click()" title="Attach a document" aria-label="Attach a document" ${aiScanBusy?'disabled':''}>${icon('paperclip')}</button>
      <input type="text" id="aiScanInput" placeholder="Tell me about the shoot…" value="${esc(aiScanDraftText)}" oninput="aiScanDraftText=this.value" ${aiScanBusy?'disabled':''} onkeydown="if(event.key==='Enter'){event.preventDefault();sendAiScanMessage();}">
      <button class="icon-btn" onclick="sendAiScanMessage()" title="Send" aria-label="Send" ${aiScanBusy?'disabled':''}>${icon('send')}</button>
    </div>`;
}

/* ---- file attachments ---- */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]); // strip the data: URL prefix
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
/* PDFs go to the API natively as a document block — Claude reads them
   directly, no extraction needed. .docx has no native API support, so it's
   extracted to plain text client-side via mammoth.js first. .txt (and
   anything else) is just read as text. */
async function fileToContentBlock(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    const b64 = await fileToBase64(file);
    return { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } };
  }
  if(name.endsWith('.docx')){
    if(typeof mammoth==='undefined') throw new Error('the .docx reader failed to load');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return { type:'text', text:`[Attached document: ${file.name}]\n\n${result.value}` };
  }
  const text = await fileToText(file);
  return { type:'text', text:`[Attached document: ${file.name}]\n\n${text}` };
}
async function handleAiScanFileInput(inputEl){
  const files = [...(inputEl.files||[])];
  inputEl.value = ''; // so re-picking the same file again later still fires onchange
  /* G17 — collect every failure, don't overwrite. This used to assign aiScanError
     on each failing file, so picking four files with two bad ones told you about
     one of them — and the other silently wasn't attached either. Attaching a
     briefing document is the primary way into AI Scan; a dropped attachment that
     reports someone else's error only surfaces as a wrong answer later.
     One line per failure; `.ai-error` carries white-space:pre-line for them. */
  const failures = [];
  for(const file of files){
    if(file.size > 15*1024*1024){ failures.push(`"${file.name}" is over 15MB — attach a smaller file.`); continue; }
    try{
      const block = await fileToContentBlock(file);
      aiScanPendingFiles.push({ block, filename: file.name });
    } catch(err){
      failures.push(`Couldn't read "${file.name}": ${err.message||err}`);
    }
  }
  aiScanError = failures.length ? failures.join('\n') : null;
  renderProjectBody();
}
function removeAiScanPendingFile(idx){ aiScanPendingFiles.splice(idx,1); renderProjectBody(); }

/* ---- sending a turn ---- */
function buildCrewSummary(){ return crewDB.map(c=>({id:c.id, name:c.name, role:c.role||''})); }
function buildLocationSummary(){ return locationsDB.map(l=>({id:l.id, name:l.name})); }
/* Every tool_use block from the assistant's LAST turn needs a matching
   tool_result before the conversation can continue — the API requires it.
   Reflects whatever the user has (or hasn't) actioned on each card so far,
   so Claude doesn't re-propose something already discarded, and knows what's
   actually landed if asked. Ticking/discarding a card does NOT call the API
   by itself (per the brief) — these accumulate silently and go out bundled
   with whatever the user sends next. */
function pendingAiToolResultBlocks(){
  const last = aiScanMessages[aiScanMessages.length-1];
  if(!last || last.role!=='assistant') return [];
  const toolUses = (last.content||[]).filter(b=>b.type==='tool_use');
  return toolUses.map(tu=>{
    const st = aiScanProposals[tu.id];
    let text = 'The user has not reviewed this proposal yet.';
    if(st){
      if(st.status==='accepted_new') text = 'The user added this as a new record in the project.';
      else if(st.status==='accepted_match') text = `The user confirmed this matches an existing record (${st.matchLabel||'match'}) and assigned it to the project.`;
      else if(st.status==='discarded') text = 'The user declined this proposal. Do not propose it again unless new information changes it.';
    }
    return { type:'tool_result', tool_use_id: tu.id, content: text };
  });
}
/* strip the display-only filename we stash on document/text blocks before
   they go anywhere near the actual API request */
function stripAiScanDisplayFields(messages){
  return JSON.parse(JSON.stringify(messages, (k,v)=> k==='_filename' ? undefined : v));
}
async function sendAiScanMessage(){
  if(aiScanBusy) return;
  const text = (val('aiScanInput')||'').trim();
  const files = aiScanPendingFiles.slice();
  if(!text && !files.length) return;

  const content = files.map(f=>Object.assign({}, f.block, {_filename:f.filename}));
  if(text) content.push({ type:'text', text });
  const newUserMsg = { role:'user', content:[...pendingAiToolResultBlocks(), ...content] };

  aiScanPendingUserMsg = newUserMsg;
  aiScanBusy = true; aiScanError = null;
  renderProjectBody();

  try{
    const outgoing = stripAiScanDisplayFields([...aiScanMessages, newUserMsg]);
    const res = await fetch(AI_SCAN_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_SCAN_ANON_KEY, 'apikey':AI_SCAN_ANON_KEY },
      body: JSON.stringify({ messages: outgoing, crewSummary: buildCrewSummary(), locationSummary: buildLocationSummary() })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
    const assistantMsg = { role:'assistant', content: data.content||[] };
    assistantMsg.content.forEach(b=>{
      if(b.type==='tool_use') aiScanProposals[b.id] = { type:b.name, input:b.input||{}, status:'pending' };
    });
    aiScanMessages = [...aiScanMessages, newUserMsg, assistantMsg];
    aiScanPendingUserMsg = null;
    aiScanPendingFiles = [];
    aiScanDraftText = '';
  } catch(err){
    aiScanError = err.message || String(err);
    aiScanPendingUserMsg = null; // don't leave a fake-sent bubble behind — aiScanDraftText/aiScanPendingFiles are untouched, so Send retries cleanly
  } finally {
    aiScanBusy = false;
    renderProjectBody();
  }
}
async function saveProjectTechSpecs(){
  const p = currentProject(); if(!p) return;
  p.techSpecs = p.techSpecs || {};
  const entered = readTechSpecFields('pj');
  TECHSPEC_FIELDS.forEach(f=>{ if(entered[f]) p.techSpecs[f] = entered[f]; else delete p.techSpecs[f]; });
  const numbering = document.getElementById('pjContinuousNumbering');
  if(numbering) p.continuousNumbering = numbering.value!=='reset';
  flashSaveResult('pjStatus', await saveDB('db:projects', projectsDB));
}
async function saveProjectOverview(silent){
  const p = currentProject(); if(!p) return;
  const client=val('ovClient'), title=val('ovTitle'), start=val('ovStart');
  if(!client||!title||!start){ if(!silent) alert('Client, working title and initial shoot date are required.'); return; }

/* ---- R17: undo for destructive actions ------------------------------------
   Scope is deliberately deletes + bulk edits, not a general edit history. Those are
   the actions that actually lose work with no way back — and bulk edit sharpened
   that considerably, since one click can now rewrite 60 people at once.

   It works by snapshotting whole collections before the action and restoring them
   if Undo is pressed. That's crude, but it's exactly right for this app's shape:
   every mutation already ends in "saveDB the whole collection", so a snapshot IS
   the unit of change, and restoring one can't half-apply.

   Restoring has to REASSIGN (crewDB = …) rather than splice, because deleteCrew()
   and friends reassign too — so the snapshot must become the live array itself, not
   be poured into whatever array happens to be there. */
const UNDO_WINDOW_MS = 10000;
let undoPending = null;   // {label, snaps:[{key,data}], timer}

function undoCollectionFor(key){
  return { 'db:crew':crewDB, 'db:locations':locationsDB, 'db:projects':projectsDB,
           'db:shootdays':shootDaysDB, 'db:coprocompanies':coProCompaniesList }[key];
}
function undoRestoreCollection(key, data){
  switch(key){
    case 'db:crew':          crewDB = data; break;
    case 'db:locations':     locationsDB = data; break;
    case 'db:projects':      projectsDB = data; break;
    case 'db:shootdays':     shootDaysDB = data; break;
    case 'db:coprocompanies':coProCompaniesList = data; break;
  }
}
/* Call AFTER the confirm() has passed but BEFORE anything is mutated. */
function beginUndo(keys){
  return keys.map(k=>({ key:k, data:dbClone(undoCollectionFor(k)) }));
}
function finishUndo(label, snaps){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = { label, snaps, timer:setTimeout(dismissUndo, UNDO_WINDOW_MS) };
  renderUndoToast();
}
function dismissUndo(){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = null; renderUndoToast();
}
async function undoLastAction(){
  if(!undoPending) return;
  const snaps = undoPending.snaps;
  dismissUndo();
  for(const s of snaps){ undoRestoreCollection(s.key, s.data); await saveDB(s.key, s.data); }
  // A deleted project/day may have been the open one — bounce out rather than
  // leaving the screen pointed at a record that has just come back differently.
  if(currentProjectId && !projById(currentProjectId)){ route={screen:'welcome'}; currentProjectId=null; }
  renderSide(); renderMain();
}
function renderUndoToast(){
  let el = document.getElementById('undoToast');
  if(!undoPending){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='undoToast'; document.body.appendChild(el); }
  el.className = 'undo-toast';
  el.innerHTML = `<span>${esc(undoPending.label)}</span>
    <span class="undo-action" onclick="undoLastAction()">Undo</span>
    <span class="undo-close" onclick="dismissUndo()" title="Dismiss">${icon('close')}</span>`;
}

async function deleteProject(id){
  if(!confirm('Delete this project and all its shoot days? Crew and locations in your databases are not affected.')) return;
  const proj = projById(id);
  const snaps = beginUndo(['db:projects','db:shootdays']);
  projectsDB = projectsDB.filter(p=>p.id!==id);
  shootDaysDB = shootDaysDB.filter(d=>d.projectId!==id);
  await saveDB('db:projects', projectsDB); await saveDB('db:shootdays', shootDaysDB);
  route={screen:'welcome'}; currentProjectId=null; renderSide(); renderMain();
  finishUndo(`Deleted project "${(proj&&(proj.title||proj.client))||''}" and its shoot days.`, snaps);
}

/* ============ .filter-panel-foot — shared by all three filter panels ============

     hint     — one line of already-escaped text describing the current scope

/* ---- Crew-on-project filter/group/sort + bulk select ----
   One shared filter state across every view-switcher tab (Roles/Days on
   site/Hotel/Travel/Catering) — it's a module-level global, so switching
   tabs via setCrewGridView() never resets it. */
/* ⚠️ THE OPENING VIEW IS ALREADY NARROWED, deliberately: grouped by department, sorted
   by seniority, with Talent and other companies excluded. That is the list you are
   almost always after — our own crew, HoD first — rather than all 70 rows including
   presenters and other outfits' people.
   ⚠️ It is NOT what Clear resets to. Clear means "show me everything", so it drops both
   exclusions; landing back on the same filtered view would leave no way to see the
   whole roster. The Filter chip shows 2 on load, which is honest — two filters ARE on.
   ⚠️ THIS ALSO SCOPES THE BUDGET, which shares this filter. The opening total therefore
   excludes Talent and other-company crew unless you clear it. */
/* ⚠️ Phase CC — groupBy OPENS ON 'none', which is a flat list still ordered department by
   department and by seniority inside each; see buildProjectCrewGroups' 'none' branch for why
   that is an order and not a heap. 'dept' (the old default) is one pick away in the panel for
   anyone who wants the subheads. */
let projectCrewFilter = { depts:new Set(), company:'', roles:new Set(), excludeTalent:true, excludeOtherCompanies:true, inverse:false, sort:'seniority', groupBy:'none', days:new Set(), daysMode:'or' };
let projectCrewFilterOpen = false;
let projectCrewFilterRolesOpen = false;
function toggleProjectFilterRolesSection(){ projectCrewFilterRolesOpen = !projectCrewFilterRolesOpen; renderProjectBody(); }
let projectCrewSelected = new Set();
/* shared by both filter panels (Crew on this project + Crew database) — each
   keeps its own filter-state object but the matching rules are identical.
   The Days filter (Phase T item 3) is NOT part of this shared function — the
   Crew database screen has no project/shoot-day context, so it's applied as
   a separate check only for the project screen, see personMatchesProjectFilter. */
function matchesCrewFilterState(c, f){
  if(f.depts.size && !f.depts.has(deptBucketKey(c.department))) return false;
  if(f.company==='__blank__' && (c.coProductionCompany||'')) return false;
  else if(f.company && f.company!=='__blank__' && (c.coProductionCompany||'')!==f.company) return false;
  if(f.roles.size && !(c.roles||[]).some(r=>f.roles.has(r))) return false;
  if(f.excludeTalent && deptBucketKey(c.department)==='Talent') return false;
  if(f.excludeOtherCompanies && (c.coProductionCompany||'')) return false;
  return true;
}
/* Days filter (Phase T item 3) — multiselect shoot days, with an OR/AND toggle:
   OR = on any of the selected days, AND = on every one of the selected days.
   "On" a day means they have a position assignment on it (same definition the
   Days on site grid itself uses). */
/* Phase BF — `c` is an ENTRY view on Roles/Days on site (c.crewId set) and a PERSON view
   on Hotel/Travel/Catering (no c.crewId). An entry matches on its own days; a person
   matches on the UNION of their entries' days, which is what "is this human on site that
   day" has to mean once one human can hold two entries. */
function personMatchesProjectDayFilter(c){
  const f = projectCrewFilter;
  if(!f.days.size) return true;
  const p = currentProject();
  const days = shootDaysDB.filter(d=>d.projectId===currentProjectId && f.days.has(d.id));
  const onDay = c.crewId ? (d => entryOnDay(c.id, d)) : (d => crewOnDay(c.id, d, p));
  return f.daysMode==='and' ? days.every(onDay) : days.some(onDay);
}
function personMatchesProjectFilter(c){
  const matches = matchesCrewFilterState(c, projectCrewFilter) && personMatchesProjectDayFilter(c);
  return projectCrewFilter.inverse ? !matches : matches;
}
function personHasHotel(c, p, days){
  const id = personIdOf(c);   // hotel is person-level; `c` may be an entry view
  if(((p&&p.hotelNightBefore)||[]).includes(id)) return true;
  return days.some(d=>(d.hotelNights||[]).includes(id));
}
/* seniority BAND for the Group by "Seniority" option — derived from the real
   per-department roleSeniorityRank() (index/ROLE_SENIORITY), not a separate
   flat list. Rank 0 is always the first/most-senior role listed for a
   department in ROLES_BY_DEPT, so low ranks band together sensibly across
   departments even though the underlying numbers aren't globally comparable. */
function crewSeniorityBand(c){
  const r = roleSeniorityRank(c.department, c.role);
  if(r<10) return 'Department leads';
  if(r<30) return 'Mid-level';
  return 'Support / entry level';
}
function sortProjectCrewGroup(list, p, days){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  switch(projectCrewFilter.sort){
    case 'name': return list.slice().sort(byName);
    case 'role': return list.slice().sort((a,b)=>(a.role||'').localeCompare(b.role||'')||byName(a,b));
    case 'seniority': return list.slice().sort((a,b)=>roleSeniorityRank(a.department,a.role)-roleSeniorityRank(b.department,b.role)||byName(a,b));
    case 'company': return list.slice().sort((a,b)=>(a.coProductionCompany||'￿').localeCompare(b.coProductionCompany||'￿')||byName(a,b));
    case 'daysCount': {
      // Phase BK — the list is PERSON BLOCKS now, so this is the deduplicated union of
      // that person's entries' days (crewDayCount), never the sum of their entries.
      // The two non-block branches are kept for any caller handing over plain entry or
      // person views. ⚠️ Phase AO's grain trap: entryDayCount would double a two-role
      // person who works both roles on the same day.
      const pj = currentProject();
      const dayCount = c => c.isPersonBlock ? crewDayCount(personIdOf(c), days, pj)
                          : c.crewId ? entryDayCount(c.id, days) : crewDayCount(c.id, days, pj);
      return list.slice().sort((a,b)=>dayCount(b)-dayCount(a)||byName(a,b));
    }
    case 'added': {
      // Phase BK — a person joined the project when their FIRST entry did, not when
      // their highest-seniority one did, so a block ranks on its earliest entry.
      const order = projectEntries(p).map(e=>e.id);
      const idx = c => c.isPersonBlock
        ? Math.min(...c.entries.map(e=>order.indexOf(e.id)))
        : order.indexOf(c.id);
      return list.slice().sort((a,b)=>idx(a)-idx(b));
    }
    case 'dept':
    default: return sortHoDFirst(list);
  }
}
/* groups the (already filtered) crew list by whichever attribute Group by is
   currently set to — same {key,label,code,items} shape regardless of which,
   so every crewGridView branch renders off of it without caring which
   grouping is active. "Shoot day on site" is the one multi-bucket grouping —
   a person assigned to 3 shoot days appears in 3 groups, same idea as a
   tag-style filter would. */
function buildProjectCrewGroups(list, p, days){
  const gb = projectCrewFilter.groupBy;
  const bySort = arr => sortProjectCrewGroup(arr, p, days);
  const bucketOf = keyFn => {
    const buckets = {};
    list.forEach(c=>{ const key = keyFn(c); (buckets[key]=buckets[key]||[]).push(c); });
    return buckets;
  };
  /* Gate 1 / G9 — nine of the thirteen group-by options were two pieces of data
     (a key function and a label order) wearing eight lines of bucket/sort/map
     boilerplate each. Two table-driven helpers now cover them:
       groupAlpha(rawKeyFn, blankLabel) — bucket by rawKeyFn(c), falling back to
         blankLabel for anyone with no value, sorted alphabetically with the
         blank forced last (company, role, travel, catering).
       groupFixed(keyFn, orderedKeys)   — bucket by keyFn(c), rendered in a fixed
         order with empty buckets dropped (hotel, personType, vat, seniority).
     deptCompany (composite key), daysOnSite (multi-bucket, a crew member can be
     in several) and dept (canonical DEPARTMENTS order + codes, the default) stay
     as their own branches below — genuinely different shapes, not copy-paste. */
  const groupAlpha = (rawKeyFn, blankLabel) => {
    const buckets = bucketOf(c => rawKeyFn(c) || blankLabel);
    const keys = Object.keys(buckets).sort((a,b)=> a===blankLabel?1 : b===blankLabel?-1 : a.localeCompare(b));
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  };
  const groupFixed = (keyFn, orderedKeys) => {
    const buckets = bucketOf(keyFn);
    return orderedKeys.filter(k=>buckets[k]&&buckets[k].length).map(k=>({key:k, label:k, code:'', items:bySort(buckets[k])}));
  };
  const SIMPLE_GROUPERS = {
    company:  () => groupAlpha(c => c.coProductionCompany, 'No lead company'),
    role:     () => groupAlpha(c => c.role, 'No role set'),
    travel:   () => groupAlpha(c => ((p&&p.travelMethods)||{})[personIdOf(c)], 'Not set'),
    catering: () => groupAlpha(c => c.dietaryGeneral, 'Standard / not set'),
    hotel:      () => groupFixed(c => personHasHotel(c,p,days) ? 'Has hotel' : 'No hotel', ['Has hotel','No hotel']),
    personType: () => groupFixed(c => deptBucketKey(c.department)==='Talent' ? 'Talent' : deptBucketKey(c.department)==='Client' ? 'Client' : 'Crew', ['Crew','Talent','Client']),
    // c.vatRegistered is strictly '' / 'Yes' / 'No' — the same #ncVat field
    // Budget's VAT calc already reads (buildBudgetData()), not a second source
    vat:        () => groupFixed(c => c.vatRegistered==='Yes' ? 'VAT registered' : c.vatRegistered==='No' ? 'Not VAT registered' : 'Not set', ['VAT registered','Not VAT registered','Not set']),
    seniority:  () => groupFixed(crewSeniorityBand, ['Department leads','Mid-level','Support / entry level']),
  };
  if(SIMPLE_GROUPERS[gb]) return SIMPLE_GROUPERS[gb]();

  if(gb==='deptCompany'){
    const meta = {};
    list.forEach(c=>{
      const dept = deptBucketKey(c.department), co = c.coProductionCompany || 'No lead company';
      const key = `${dept} — ${co}`;
      (meta[key]=meta[key]||{dept,co,items:[]}).items.push(c);
    });
    return Object.keys(meta)
      .sort((a,b)=> (DEPARTMENTS.indexOf(meta[a].dept)-DEPARTMENTS.indexOf(meta[b].dept)) || meta[a].co.localeCompare(meta[b].co))
      .map(key=>({key, label:key, code:DEPARTMENT_CODES[meta[key].dept]||'', items:bySort(meta[key].items)}));
  }
  if(gb==='daysOnSite'){
    // Phase BK — a PERSON BLOCK is on a day if ANY of its entries is (crewOnDay, the
    // person-level signal), so a two-role person lands in that day's bucket once.
    const isOn = (c, d) => c.isPersonBlock ? crewOnDay(personIdOf(c), d, p)
                         : c.crewId ? entryOnDay(c.id, d) : crewOnDay(c.id, d, p);
    const buckets = {};
    (days||[]).forEach(d=>{
      const onDay = list.filter(c=>isOn(c, d));
      if(onDay.length) buckets[`Day ${d.dayNum||'?'}`] = onDay;
    });
    const notOn = list.filter(c=>!(days||[]).some(d=>isOn(c, d)));
    if(notOn.length) buckets['Not on any shoot day'] = notOn;
    const keys = (days||[]).map(d=>`Day ${d.dayNum||'?'}`).filter(k=>buckets[k]).concat(notOn.length?['Not on any shoot day']:[]);
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  }
  /* ⚠️ Phase CC — "None" MEANS NO HEADERS, NOT NO ORDER, and it is the default now. The list
     is still department by department in the canonical DEPARTMENTS order, and still sorted
     inside each department by whatever Sort by says (seniority by default) — exactly the
     sequence the 'dept' grouper produces, with the subheads taken out. That is the point:
     working down a column of day-counts, a subhead every four rows is a row you have to skip
     over, and the department is already on the row as a pill. Grouping by Department is still
     there in the picker for anyone who wants the headers back.
     ⚠️ Do NOT "simplify" this to bySort(list). Sorting the whole list by seniority alone
     interleaves the departments — every department's lead, then every department's number
     two — which is not a list anybody reads. */
  if(gb==='none'){
    const buckets = bucketOf(c => deptBucketKey(c.department));
    const known = DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length);
    const rest = Object.keys(buckets).filter(d=>!DEPARTMENTS.includes(d)).sort();
    const items = known.concat(rest).reduce((out,d)=>out.concat(bySort(buckets[d])), []);
    return [{key:'all', label:'All crew', code:'', items}];
  }
  // default: 'dept'
  const buckets = bucketOf(c => deptBucketKey(c.department));
  return DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length).map(d=>({key:d, label:d, code:DEPARTMENT_CODES[d]||'', items:bySort(buckets[d])}));
}

   now, so there is no single-entry checkbox left in the UI to call it —
   toggleCrewPersonSelected() (with the block's visible entry ids) and
   toggleSelectAllFilteredCrew() are the only two ways into projectCrewSelected. */
/* Select all (Phase T item 2) — idsCSV is always exactly the currently-filtered/visible
   crew ids (see renderProjectCrew), never the full project roster, so this only ever
   selects what the active filter is showing right now. */
function toggleSelectAllFilteredCrew(idsCSV, checked){
  const ids = idsCSV ? idsCSV.split(',') : [];
  if(checked) ids.forEach(id=>projectCrewSelected.add(id));
  else ids.forEach(id=>projectCrewSelected.delete(id));
  renderProjectBody();
}
function clearCrewSelection(){ projectCrewSelected.clear(); bulkEditOpen = false; renderProjectBody(); }
/* ---- Selected-set bulk edit (Phase Bulk Edit) ----
   Every per-field editor on the Crew tab (day/hotel/meal checkboxes, travel method,
   Show as, role) calls this at the top of its mutation to find out who the edit
   should actually apply to. If the person being edited is part of the current
   multi-select AND at least one other person is also selected, the edit fans out to
   the whole selected set; otherwise it's just that one person, same as before this
   phase. Callers still own their own field-specific mutation — this only answers
   "which ids", so a single loop + one save/render per call site covers every field
   without a per-field bulk-edit implementation. */
/* ⚠️ Phase BL narrowed the fan-out. It used to return EVERY selected entry id; it now
   returns the edited entry plus ONE entry per other selected PERSON — that person's
   FRONTED entry, i.e. the one actually on screen. A collapsed multi-role person shows
   one line, and a bulk rate/day edit must not silently rewrite a role the user cannot
   see. Deliberately NARROWER than BK's person-level rule: the person-level fields
   (hotel, travel, catering, Show as) still go through selectedCrewTargets() and still
   cover the whole person, unchanged. */
function selectedEditTargets(entryId){
  if(!(projectCrewSelected.size>1 && projectCrewSelected.has(entryId))) return [entryId];
  const p = currentProject(), days = projectDays();
  const self = entryById(entryId, p);
  const out = [entryId], seen = new Set(self ? [self.crewId] : []);
  projectCrewSelected.forEach(id=>{
    const e = entryById(id, p);
    if(!e || seen.has(e.crewId)) return;
    seen.add(e.crewId);
    out.push(bulkTargetEntryId(e.crewId, e, p, days));
  });
  return out;
}
/* ---- Phase BF: one Set, two currencies ----
   projectCrewSelected always holds ENTRY ids — it is module-level and deliberately
   survives setCrewGridView(), so it has to mean one thing, and the entry is the finer
   grain of the two. The person-level views (Hotel/Travel/Catering) render one row per
   human, so they translate at the edges:
     crewIsSelected()      — is ANY of this person's entries selected
     toggleCrewPersonSelected() — select/deselect ALL of them together
     selectedCrewTargets() — the distinct PEOPLE behind the current selection, for the
                             person-level fields that fan out (hotel, travel, catering,
                             Show as). Deduplicated, so a two-entry person is written once.
   With one entry per person all three collapse to exactly the pre-BF behaviour. */
function crewIsSelected(crewId){
  return entriesForCrew(crewId, currentProject()).some(e=>projectCrewSelected.has(e.id));
}
/* `entryIdsCSV` (Phase BK) — the person-block checkbox passes this person's VISIBLE
   entry ids, so under a partial-match filter selecting a block selects exactly the rows
   the block is showing. Called with no third argument (every pre-BK caller) it still
   covers all of that person's entries, unchanged. */
function toggleCrewPersonSelected(crewId, checked, entryIdsCSV){
  const ids = entryIdsCSV ? entryIdsCSV.split(',').filter(Boolean)
                          : entriesForCrew(crewId, currentProject()).map(e=>e.id);
  ids.forEach(id=>{ if(checked) projectCrewSelected.add(id); else projectCrewSelected.delete(id); });
  renderProjectBody();
}
function selectedCrewTargets(crewId){
  if(!(projectCrewSelected.size>1 && crewIsSelected(crewId))) return [crewId];
  const p = currentProject();
  const out = new Set();
  projectCrewSelected.forEach(entryId=>{ const e = entryById(entryId, p); if(e) out.add(e.crewId); });
  out.add(crewId);
  return [...out];
}
/* the person behind a row, whichever kind of view it is */
const personIdOf = (c) => c.crewId || c.id;

/* ============ Phase BK — person blocks ======================================
   Every Crew sub-tab now renders ONE CARD PER PERSON: a name line carrying that
   person's PERSON-level facts (hotel nights, travel method, meals, Show as — all of
   them keyed to crewId, which is exactly why a flat per-entry list had nowhere
   natural to put them), with that person's role ENTRIES stacked beneath it.

   Display layer only. Nothing is written, nothing is stored, `p.crewEntries` is
   untouched, and every consumer outside this tab's six row renderers — Budget, all
   four exports, the call sheet, the WhatsApp text — still sees every entry.

   The block object is itself shaped like the entry view of the person's
   HIGHEST-SENIORITY role, with the (already filtered) entry list hung off it as
   `.entries`. That is entryView()'s own trick one level up: every existing sort,
   group and identity helper keeps reading `.id`/`.name`/`.role`/`.department`
   unchanged and simply ranks the person by their top role — which is what BK asked
   for, via the EXISTING roleSeniorityRank(), with no second seniority concept.
   `.crewId` is the person, so personIdOf() still returns the crew id. */
function seniorityRankOf(c){
  const r = roleSeniorityRank(c.department, c.role);
  return r===Infinity ? Number.MAX_SAFE_INTEGER : r;   // Infinity-Infinity is NaN
}
function topSeniorityEntry(entries){
  return entries.slice().sort((a,b)=>seniorityRankOf(a)-seniorityRankOf(b))[0];
}
function buildPersonBlocks(entryViews){
  const order = [], byPerson = new Map();
  (entryViews||[]).forEach(v=>{
    if(!byPerson.has(v.crewId)){ byPerson.set(v.crewId, []); order.push(v.crewId); }
    byPerson.get(v.crewId).push(v);
  });
  return order.map(crewId=>{
    const entries = byPerson.get(crewId);
    return Object.assign({}, topSeniorityEntry(entries), { crewId, entries, isPersonBlock:true });
  });
}

/* ============ Phase BL — the fronted entry ==================================
   A multi-role person's stack collapses to ONE LINE showing ONE REAL ENTRY — never a
   synthesised summary, so whatever rate/days that line shows are that entry's own
   honest numbers.

   Fronted = most days IN THE CURRENT PHASE (whichever crewGridView is active), ties
   broken by ROLE_SENIORITY via roleSeniorityRank(), remaining ties by roster order
   (Array#sort is stable). "Days in the current phase" is:
     'preprod'/'post' → phaseDaysOf(view, entryId) — that tab's OWN authoritative day
                                             count, out of its own store only
     everything else → entryDayCount()     — the shoot-day-worked signal
                                             ((d.positions||[]).some(pos=>pos[0]===entryId))
   ⚠️ ROLES resolves to that same shoot-day signal. Confirmed against the code rather
   than assumed: the Roles grid is Name / Role / Rate / Show as and carries no day
   dimension of its own at all, and entryOnDay()/d.positions is the ONLY per-entry
   "days" that exists outside the two phase stores. So Roles fronts exactly
   as Days on site does. ⚠️ entryDayCount(), never crewDayCount() — fronting is a
   choice BETWEEN a person's entries, so the person-level union would rank them all
   equal (the Phase AO grain trap, in the direction that silently does nothing).

   ⚠️ RECOMPUTED ON LOAD AND TAB-SWITCH ONLY — NEVER ON AN EDIT. Almost every field on
   these tabs re-renders the whole tab body on save (setPhaseDays, saveEntryRate,
   toggleCrewOnDay, toggleMeal…), so computing this inline would re-front — and
   visibly re-order — the row the user just typed into. The choice is memoised per
   person for as long as (crewGridView, project) hold; setCrewGridView() drops the
   cache and a fresh load starts with none. A cached choice that is no longer among
   the person's VISIBLE entries (a filter has hidden it) is re-picked, which is what
   makes a partial-match filter front the right row. Nothing here touches a record. */
let frontedEntryCache = { view:null, projectId:null, map:new Map() };
function frontedCacheMap(){
  if(frontedEntryCache.view!==crewGridView || frontedEntryCache.projectId!==currentProjectId){
    frontedEntryCache = { view:crewGridView, projectId:currentProjectId, map:new Map() };
  }
  return frontedEntryCache.map;
}
function resetFrontedEntryCache(){ frontedEntryCache = { view:null, projectId:null, map:new Map() }; }
function phaseDaysOfEntry(entryId, p, days){
  // Phase BT — both phase tabs front on their OWN booked days, each reading only its
  // own store; everything else still fronts on the shoot-day signal.
  if(isPhaseTab(crewGridView)) return phaseDaysOf(crewGridView, entryId, p) || 0;
  return entryDayCount(entryId, days);
}
/* works on entry views AND on raw p.crewEntries records — both carry id/role/department */
function pickFrontedEntry(entries, p, days){
  return entries.slice().sort((a,b)=>
      (phaseDaysOfEntry(b.id, p, days) - phaseDaysOfEntry(a.id, p, days))
   || (seniorityRankOf(a) - seniorityRankOf(b))
  )[0];
}
/* the fronted entry of a block being rendered — memoised, re-picked if the cached
   choice is not among this block's currently visible entries */
function frontedEntryOfBlock(block, p, days){
  const entries = block.entries;
  if(entries.length<2) return entries[0];
  const map = frontedCacheMap();
  const cached = map.get(block.crewId);
  if(cached){ const hit = entries.find(e=>e.id===cached); if(hit) return hit; }
  const best = pickFrontedEntry(entries, p, days);
  map.set(block.crewId, best.id);
  return best;
}
/* a person's entries that are CURRENTLY ON SCREEN — the same entry-grain filter test
   renderProjectCrew() builds the blocks from, so this can't drift from what is rendered. */
function visibleEntriesForPerson(crewId, p){
  return entriesForCrew(crewId, p).map(entryView).filter(Boolean).filter(personMatchesProjectFilter);
}
/* the entry a bulk edit may write to for a person who is NOT the row being edited.
   ⚠️ It is picked from the entries that are BOTH selected AND currently visible, never
   from the cache alone. Caught in testing: projectCrewSelected and the fronted-entry
   cache both survive a filter change, so a person selected while unfiltered — or simply
   rendered earlier under a different filter — could otherwise have a bulk edit land on
   an entry that is no longer on screen, which is precisely what BL forbids. The cached
   choice is honoured only when it is still in that pool, so the on-screen row and the
   edit target are the same thing by construction. */
function bulkTargetEntryId(crewId, fallbackEntry, p, days){
  const pool = visibleEntriesForPerson(crewId, p).filter(v=>projectCrewSelected.has(v.id));
  if(!pool.length) return fallbackEntry.id;
  if(pool.length===1) return pool[0].id;
  const cached = frontedCacheMap().get(crewId);
  if(cached && pool.some(v=>v.id===cached)) return cached;
  return pickFrontedEntry(pool, p, days).id;
}

/* ---- the block's shared chrome ---- */
/* "Bulk select means the person" (BK) expressed in the ONE currency
   projectCrewSelected has ever held — entry ids. Routes through the existing
   toggleCrewPersonSelected(); no second selection model. Under a partial-match filter
   it carries this person's VISIBLE entry ids only, which is what the block is showing. */
function personBlockSelectCbHTML(block){
  const ids = block.entries.map(e=>e.id);
  const checked = ids.some(id=>projectCrewSelected.has(id));
  return `<input type="checkbox" class="bulk-select-cb" ${checked?'checked':''} onclick="event.stopPropagation()" onchange="toggleCrewPersonSelected('${block.crewId}', this.checked, '${ids.join(',')}')" title="Select">`;
}
const personBlockDomId = (block) => `pb-${crewGridView}-${block.crewId}`;
/* the collapsed line's chevron + muted "+N". Renders NOTHING when there is nothing
   hidden — a genuine single-role person, and a two-role person a filter has reduced to
   one visible entry, both get no chevron at all. */
function personBlockToggleHTML(block, hiddenCount, open){
  if(hiddenCount<1) return '';
  return `<span class="pb-toggle" onclick="event.stopPropagation();togglePersonBlockStack('${personBlockDomId(block)}')" title="Show this person's other roles on this project"><span class="pb-caret">${open?'▾':'▸'}</span><span class="pb-more"${open?' style="display:none;"':''}>+${hiddenCount}</span></span>`;
}
/* ⚠️ DOM-only, deliberately: BL keeps NO open/closed state anywhere — not persisted,
   not on a record, not even a module-level Set — so every block opens closed on every
   render and this flips the rows in place rather than re-rendering. Same
   direct-DOM-instead-of-re-render idiom applyBlockState()/prepDragApply() already use. */
function togglePersonBlockStack(domId){
  const wrap = document.getElementById(domId); if(!wrap) return;
  const open = wrap.getAttribute('data-open')==='1';
  wrap.setAttribute('data-open', open ? '0' : '1');
  wrap.querySelectorAll('.pb-role-extra').forEach(el=>{ el.style.display = open ? 'none' : ''; });
  const caret = wrap.querySelector('.pb-caret'); if(caret) caret.textContent = open ? '▸' : '▾';
  const more  = wrap.querySelector('.pb-more');  if(more)  more.style.display = open ? '' : 'none';
}
/* the wrapper every one of the six sub-tabs' blocks ends in. `expansionHTML` is passed
   rather than derived so Pre-production can keep having no crew-record edit path. */
function personBlockWrapHTML(block, inner, opts){
  opts = opts||{};
  return `<div class="person-block${opts.editing?' person-block-editing':''}${opts.extraClass?' '+opts.extraClass:''}" id="${personBlockDomId(block)}" data-open="${opts.open?'1':'0'}">
    ${inner}${opts.expansionHTML||''}
  </div>`;
}
/* ⚠️ REMOVED in Phase BM: roleChipHTML() — BK's second, menu-less chip renderer for
   Days on site / Hotel / Travel / Catering. Those four tabs now open the roles menu
   from their chip like Roles and Pre-production always have, so all six go through the
   ONE roleBannerHTML() above and there is no second chip to drift. Do not look for it. */
/* ⚠️ This clears BOTH the roster entries and every shoot day's `positions` (via
   removeCrewEntries(), Phase BF), the same two
   places removeCrewFromProject() has always cleared. Removing only the roster slot left a
   bulk-removed person sitting on the call sheet — they were off the roster but still
   holding a position on the days they'd been assigned to. The undo snapshot has to
   cover db:shootdays for the same reason. */
async function bulkRemoveSelectedFromProject(){
  const p = currentProject(); if(!p) return;
  const n = projectCrewSelected.size;
  if(!n || !confirm(`Remove ${n} crew member(s) from this project?`)) return;
  const snaps = beginUndo(['db:projects','db:shootdays']);
  removeCrewEntries(p, [...projectCrewSelected]);
  projectCrewSelected.clear();
  await saveDB('db:projects', projectsDB);
  await saveDB('db:shootdays', shootDaysDB);
  renderProjectBody();
  finishUndo(`Removed ${n} crew member${n>1?'s':''} from this project.`, snaps);
}
/* bulk edit (item 2b) — right now just Lead Company, the one field this phase
   moved off the main "Crew on this project" row. Extend bulkEditPanelHTML /
   applyBulkEdit together if more bulk-editable fields are needed later. */
let bulkEditOpen = false;
function toggleBulkEdit(){ bulkEditOpen = !bulkEditOpen; renderProjectBody(); }
/* ============ ONE WAY INTO THE CREW FORM: SELECT, THEN EDIT (Phase CC) ============
   ⚠️ The Edit button on the bulk bar branches on HOW MANY are ticked, because the two cases
   are genuinely different jobs and pretending otherwise is how you get a form that offers to
   set forty people's phone number to the same digits:
     one ticked   — that person's own crew record, the whole form, in a modal
     two or more  — only the fields that can honestly be written to several records at once
   ⚠️ The single case reuses `editingCrewId` and `crewExpansionHTML()` exactly as the pencil
   did, so saveCrew()/closeCrewForm() already null it out and re-render, and the modal closes
   itself with no new lifecycle to keep in step. */
function openCrewBulkEdit(){
  if(projectCrewSelected.size===1){ editCrew([...projectCrewSelected][0]); return; }
  toggleBulkEdit();
}
/* ⚠️ Rendered from renderProjectCrew's body, NOT from the bulk bar — the bar disappears the
   moment the selection is cleared, and a modal that vanishes mid-edit because something
   deselected underneath it is a lost form. */
function crewEditModalHTML(){
  const shell = (title, body, onClose) => `<div class="modal-overlay crew-edit-modal" onclick="${onClose}">
      <div class="modal-box crew-edit-box" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>${body}
      </div>
    </div>`;
  if(bulkEditOpen && projectCrewSelected.size>1){
    return shell(`Edit ${projectCrewSelected.size} crew records`, bulkEditFieldsHTML(), 'toggleBulkEdit()');
  }
  if(!editingCrewId) return '';
  /* the selection holds ENTRY ids, and the form wants the entry view so its two
     project-scoped controls (day rate, role chips) act on the right role */
  const v = (projectEntryViews(currentProject())||[]).find(x=>x.id===editingCrewId);
  if(!v) return '';
  return shell(v.name || 'Edit crew record', crewExpansionHTML(v, 'crew-edit-form'), 'closeCrewForm()');
}
/* ⚠️ ONE FIELD, and it is not an oversight — Lead company is the only thing on a crew record
   that is safely the same for several people at once. Name, phone, email, rate and role are
   per person by definition; department is per person in practice (it is half of every saved
   role path, so writing it here and not there would put someone in one department wearing
   another's role). More bulk fields are a real ask; each one needs its own write and its own
   undo, which is why they are not smuggled in behind this one. */
function bulkEditFieldsHTML(){
  const inUse = crewDB.map(x=>x.coProductionCompany).filter(Boolean);
  const known = [...new Set(coProCompaniesList.concat(inUse))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  const opts = ['<option value="">— Lead company —</option>']
    .concat(known.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`))
    .concat(['<option value="__add__">+ Add company…</option>']).join('');
  return `<div>
    <label>Lead company</label><select id="bulkLeadCompany">${opts}</select>
    <div class="toolbar" style="margin:14px 0 0;">
      <button class="primary" onclick="applyBulkLeadCompany()">Apply to ${projectCrewSelected.size} selected</button>
      <button onclick="toggleBulkEdit()">Cancel</button>
    </div>
  </div>`;
}
async function applyBulkLeadCompany(){
  let value = val('bulkLeadCompany');
  if(value==='__add__'){
    value = (prompt('Co-production company name:')||'').trim();
    if(value && !coProCompaniesList.includes(value)){
      coProCompaniesList.push(value);
      await saveDB('db:coprocompanies', coProCompaniesList);
    }
  }
  const n = projectCrewSelected.size;
  const snaps = beginUndo(['db:crew']);
  crewDB.forEach(c=>{ if(projectCrewSelected.has(c.id)) c.coProductionCompany = value; });
  await saveDB('db:crew', crewDB);
  bulkEditOpen = false;
  renderProjectBody();
  finishUndo(`Set lead company on ${n} crew member${n>1?'s':''}.`, snaps);
}
function bulkActionBarHTML(){
  if(!projectCrewSelected.size) return '';
  const propagateHint = projectCrewSelected.size>1
    ? `<span class="hint">Editing a field for one selected person applies it to all ${projectCrewSelected.size}</span>` : '';
  return `<div class="bulk-action-bar">
    <strong>${projectCrewSelected.size} selected</strong>
    <button class="small" onclick="openCrewBulkEdit()">Edit</button>
    <button class="small danger" onclick="bulkRemoveSelectedFromProject()">Remove from project</button>
    <span class="hint" style="cursor:pointer;" onclick="clearCrewSelection()">Clear selection</span>
    ${propagateHint}
  </div>`;
}
/* ---- Crew toolbar (Phase Detail) --------------------------------------------
   The bar used to be four loose string variables concatenated at the point of use,
   which is how its four controls drifted into four different fonts and shapes.
   These two functions own it instead: anything that needs a Crew toolbar builds it
   here so the markup, the ordering and the styling can only change in one place.
   Left group is what you act WITH (select, filter); right group is what you act ON
   the whole list with (summary, expand/collapse). ---------------------------- */
function crewToolbarSelectAll(idsCSV, allSelected, filterCount){
  return `<label class="crew-header-selectall">
      <input type="checkbox" ${allSelected?'checked':''} onchange="toggleSelectAllFilteredCrew('${idsCSV}', this.checked)"> Select all${filterCount?' (filtered)':''}
    </label>`;
}
/* ---- BUDGET : show the money on the Crew screens ----
   Off by default. Roles is used far more often for "who is on this job and doing what"
   than for what they cost, and a rate column invites reading — and quoting — a number
   over someone's shoulder. Turning it on reveals the banner's totals, Total and Day rate on
   Roles, and the rate field on Pre-Prod and Post.
   ⚠️ Labelled "Budget" since Phase BX; it was "Budget" from Phase BU. Still NOT "Costs" — the
   Budget tab has Est. Costs and a Costs PP toggle meaning something else entirely (a person's
   hotel/travel/food), and a control called Costs that showed day rates would collide with
   both. "Budget" is unambiguous because it names the TAB whose figures it reveals. */
let crewShowMoney = false;
function toggleCrewMoney(){ crewShowMoney = !crewShowMoney; renderProjectBody(); }
/* ⚠️ REMOVED in Phase BU: crewMoneyToggleHTML(). The Budget control is a .bnr-tool button in
   the banner's TOOLS cluster now, built by budgetSummaryBarHTML() — do not look for a
   second copy in the Crew toolbar. The Crew toolbar keeps only what acts on the LIST. */

/* ⚠️ REMOVED in Phase CF: THE ROLES MODES — `ROLES_MODES`, `crewRolesMode`,
   `setCrewRolesMode()`, and the STAGE | DAYS picker in the banner. Do not look for them, and
   do not test `crewRolesMode` in new code.
   What they were: two shapes for the Prep · Shoot · Post columns. STAGE made each one a
   checkbox and was the only place phase membership could be set; DAYS (key 'totals', because
   the labels changed in Phase BV and the keys deliberately did not) made Prep and Post
   typeable numbers with Shoot a read-only count expanding into per-day ticks.
   Why they went: Stage only existed to maintain the opt-in membership lists, and Phase CF
   derives membership from the days instead — a number in Prep or Post, a ticked day on the
   shoot. With nothing left for Stage to set, a two-button picker that changed the meaning of
   three columns was a mode to learn for no gain. Roles is one shape now.
   ⚠️ WHAT WENT WITH IT: the **Show as** column, which only ever appeared in Stage mode. It is
   not lost — it is on the crew record, reachable by ticking a row and pressing Edit — but
   there is no longer an inline quick-edit for it on the grid. Say so if that is wanted back;
   it is a column, and columns are cheap now that they can be reordered. */
/* ---- SHOOT EXPANDS SIDEWAYS INTO ITS OWN DAYS ----
   The Shoot column is a plain count because a shoot day is a tick against a numbered day,
   not a number you type. Clicking its header opens those ticks inline: one narrow column per
   shoot day, D1…Dn, exactly the grid the Production sub-tab holds — so the answer to "which
   days" is reachable without leaving the screen you are costing on.
   ⚠️ Phase CF: there are no modes any more, so the old "DAYS and DATES modes only" caveat is
   gone with them — the Shoot cell is always a count that expands.
   ⚠️ The count STAYS when expanded rather than being replaced. An empty cell under a "Shoot"
   header reads as missing data, and the total is the thing you scan for; the day ticks are
   the detail behind it, not a substitute.
   Session state, like the mode itself — not persisted. */
let rolesShootExpanded = false;
function toggleRolesShootColumn(){ rolesShootExpanded = !rolesShootExpanded; renderProjectBody(); }

/* ---- NAME AND ROLE COLLAPSE SIDEWAYS (Phase BX) ----
   Roles is the widest table in the app and the two widest columns on it are text you already
   know: you are scanning for a number, and 170px of "Sabrina Goreeba" plus 150px of "Line
   Producer" is 320px of it. Clicking either header collapses that column to an abbreviation,
   which buys back most of the horizontal scroll the money columns cost.
   ⚠️ Roles ONLY, applied by overriding --pb-name-w / --pb-role-w on this tab's own .tablewrap.
   Those tokens are SHARED by .roles-grid, .crewgrid and .prep-grid so the lead columns line up
   across all seven Crew sub-tabs (Phase BO) — overriding them globally would knock the other
   six out of step with each other. A custom property set on the wrapper reaches only the grids
   inside it, which is exactly the scope wanted.
   ⚠️ Nothing is lost: the full text stays in each cell's `title`, and the role chip is still
   the roles-menu trigger. Session state, like every other view choice here. */
/* ---- the frozen-pane box's height, measured (Phase BX) ----
   Runs after every Crew render and on resize. Ends the scroll box at the bottom of the viewport
   from wherever it actually starts, which is the only way the frozen header row stays on screen:
   see the note on .roles-tablewrap for why a fixed calc() cannot work here.
   ⚠️ A FLOOR of 240px, so a short window or a tall banner can't collapse the box to a sliver.
   Below the floor the page scrolls as it always did — a cramped 240px of rows you can scroll is
   better than 40px of rows you can't read. */
const ROLES_FREEZE_MIN_W = 901;   // matches the @media(max-width:900px) block that releases it
function sizeRolesTablewrap(){
  const el = document.querySelector('.roles-tablewrap');
  if(!el) return;
  /* ⚠️ Below the mobile breakpoint the CSS releases the scroll box entirely (see the
     @media(max-width:900px) rule), so an inline max-height here would fight it and win. Clear
     it rather than compute one. */
