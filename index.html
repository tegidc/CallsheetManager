<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Sheet App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Jost:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- AI Scan (Phase AI Scan): client-side .docx text extraction only — PDFs go to the
     Anthropic API natively as a document block, no library needed for those. -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
  /*
    BRAND NOTE: Moret and Futura PT are paid/licensed fonts not available on Google Fonts.
    Using closest free equivalents: Fraunces (warm rounded serif, stands in for Moret) for
    headings, and Jost (geometric sans in the Futura family) for body copy. Oswald (the
    real brand font) is used as specified for uppercase labels and project codes/numbers.
    Swap the font-family values below for the real Moret/Futura PT files if you get access
    to hosted versions.
  */
  :root{
    --bg:#FFFFFF;            /* White (was Ivory #FFFFF5) — matches --panel for a seamless flat feel */
    --panel:#FFFFFF; --panel-2:#EEF5F2;
    /* Drawn dividing lines — deliberately faint (Fonts Review). Used for rules
       between rows and under headings, NOT for form fields. */
    --line:rgba(17,10,8,.10);
    /* Form fields are ruled underlines now, and a 10% line is too faint to read as
       "fill this in" — so fields get their own, stronger weight. */
    --field-line:rgba(17,10,8,.30);
    --tape:#017756;          /* Sea Green — primary brand accent, LIGHT backgrounds */
    --tape-light:#0FA47A;    /* same hue lifted for DARK backgrounds — 6.17:1 on the
                                sidebar vs 3.52:1 for --tape (Fonts Review) */
    --tape-ink:#FFFFF5;      /* Ivory text on Sea Green */
    --danger:#a4321f;
    --text:#110A08;          /* Black */
    --muted:#6f6a63;
    --mono:ui-monospace, monospace;                     /* browser default mono — no webfont loaded (Style Review) */
    --disp:'Fraunces', Georgia, serif;                  /* stands in for Moret */
    --label:'Oswald', sans-serif;                       /* brand utility font — kept as-is */
    --body:'Jost', 'Futura PT', sans-serif;              /* stands in for Futura PT */
    /* Brand-green background tints. Style Review collapsed nine hand-written rgba()
       values down to four tokens — two "barely there" levels for panels vs editing
       states, then medium/strong for badges and active controls. */
    --tint-1:rgba(1,119,86,.03);   /* panels: filter, bulk-edit, formgroup, day-override */
    --tint-2:rgba(1,119,86,.05);   /* editing / overridden row states */
    --tint-3:rgba(1,119,86,.10);   /* badges, hover fills, bulk action bar */
    --tint-4:rgba(1,119,86,.14);   /* active controls — must stay distinct from tint-3 */
    /* Phase Q: the two former hand-written one-offs are tokens too, so a brand-colour
       change in Settings reaches every tinted surface rather than leaving these behind. */
    /* ---- the three phases, as colour (Phase BW) ----
       One hue each, so a mark in the Dates popup says WHICH phase it belongs to without a
       label on every cell. Shoot keeps the brand green — it is the main event and the colour
       the app already means by "live". Prep is an ochre and the edit an indigo: chosen to sit
       either side of the green in hue AND to differ in lightness, so they stay separable in
       greyscale and for red-green colour blindness, where ochre-vs-green is the risky pair.
       ⚠️ Colour is never the ONLY carrier: the phase circles are labelled, the selected phase
       is named above the calendar, and every marked cell's title says which phases it holds.
       All three are dark enough to take white text at the contrast the rest of the app uses. */
    --phase-prep:#8A5A0B; --phase-shoot:#017756; --phase-post:#4A3C8C;
    --phase-prep-soft:rgba(138,90,11,.13); --phase-shoot-soft:rgba(1,119,86,.13);
    --phase-post-soft:rgba(74,60,140,.13);
    --tint-5:rgba(1,119,86,.35);   /* sidebar active-project gradient */
    --tint-6:rgba(1,119,86,.28);   /* selected saved-role pill / Head of Department pill */
    /* Default box: white fill, 8px radius, 10px padding (Style Review) */
    --box-radius:8px; --box-pad:10px;
    /* TYPE SCALE (Fonts Review). Body ladder collapsed from eight sizes to three:
       --fs-name for names and primary rows, --fs-meta for secondary text and hints,
       --fs-ctl for controls and labels. --fs-field is the one extra value, pinned by
       the separate "tighter inputs" decision, and belongs to form controls only. */
    --fs-name:14px; --fs-field:13px; --fs-meta:12px; --fs-ctl:11px;
    --field-label-w:112px;   /* label column for inline fields — keeps rows aligned */
    /* Phase BO — the three leading person-block columns, shared by .roles-grid,
       .crewgrid and .prep-grid so Controls/Name/Role start at the same x on every
       Crew sub-tab. Each grid keeps its own columns after Role (Rate/Show as on
       Roles, rate+days fields on Pre-production, day checkboxes on the other four) —
       only the shared leading columns needed to agree. */
    --pb-controls-w:34px;    /* a bulk-select checkbox, and nothing else. ⚠️ Was 56px, to
                                 fit Roles' Edit pencil beside it — Phase CC took that
                                 pencil out (selecting and pressing Edit is the one way in
                                 now), so all six tabs are checkbox-only and the column is
                                 the width of a checkbox again. 22px of the table back. */
    --pb-name-w:170px;       /* fixed, not flexible — a flexible Name column is what
                                 let Role drift depending on how long a name was.
                                 170px (was 220px, Phase BO follow-up — narrowed to
                                 close up the gap before Role) comfortably fits every
                                 name in the sample data at 14px Jost 600; a longer
                                 one just sits closer to the chip, same overflow
                                 handling as everywhere else in the app */
    --pb-role-w:150px;       /* fixed; role chips longer than this ellipsis-truncate
                                 (.pb-role-cell .role-chip below) — the full name is
                                 still in the chip's title tooltip */
    /* Phase BU — the banner's zones. TOTALS is 450px because the three 26px Oswald figures
       measure 136 + 106 + 128 with two 30px gaps = 430, plus room for a seven-figure job.
       STAGE is 270px: "Pre-production" beside a 9-character amount, with the amount
       right-aligned. TOTALS is FIXED on purpose — it is what keeps STAGE from moving when
       the headline changes shape. See .phase-banner. */
    /* ⚠️ Phase CJ retuned both. TOTALS was 450px for three 26px figures side by side; it is
       one figure with two small lines under it now, so 260px covers the widest of them
       ("£116,627.00" plus the "inc. £8,127.00 VAT" note on its label line). Everything it
       gave up went to STAGE, which grew from one amount per phase to three — 440px fits
       "Pre-production" beside three right-aligned 9-character figures. They still sum inside
       #main's 796px: 260 + 28 gap + 440 = 728. TOTALS stays FIXED, which is what keeps STAGE
       from moving when the headline changes — see .phase-banner. */
    --bnr-totals-w:260px;
    --bnr-stage-w:440px;
    --pb-phase-fields-w:130px; /* Pre-production/Post only: the rate+days column, sized
                                 to the two inputs (60 + 10 gap + 60). Was a flat 200px
                                 sized to the removed "N days booked" counter. Retuned
                                 for mobile below, where the inputs themselves grow. */
    --sidew:230px;
    /* ⚠️ The page's paper width and its side padding, as TOKENS rather than two numbers
       inside .main — Roles' wide zone (see .roles-widezone) has to compute how far it may
       break out of that column, which means knowing both. Change them here, not in .main. */
    --mainw:840px; --main-pad:22px;
    --side-bg:#110A08; --side-text:#FFFFF5; --side-line:rgba(255,255,245,.14); --side-hover:rgba(255,255,245,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--text); font-family:var(--body); -webkit-font-smoothing:antialiased;}

  .app{display:flex; min-height:100vh;}
  .side{width:var(--sidew); flex:0 0 var(--sidew); background:var(--side-bg); border-right:1px solid var(--side-line);
    padding:16px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .main{flex:1; min-width:0; padding:20px var(--main-pad) 90px; max-width:var(--mainw); margin:0 auto;}

  /* top bar + scrim: only ever visible on mobile */
  .topbar{display:none;}
  .scrim{display:none;}

  .brand{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .brand .dot{width:10px; height:10px; border-radius:2px; background:var(--tape); transform:rotate(45deg);}
  .brand strong{font-family:var(--disp); font-size:16px; letter-spacing:.3px; color:var(--side-text);}

  .side-label{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; color:rgba(255,255,245,.55);
    text-transform:uppercase; margin:16px 6px 6px;}
  .side-item{padding:8px 10px; border-radius:7px; font-size:var(--fs-field); cursor:pointer; color:var(--side-text);
    display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .side-item:hover{background:var(--side-hover);}
  /* Sidebar accents use --tape-light, the brand hue lifted for dark backgrounds
     (Fonts Review). #0FA47A measures 6.17:1 on the sidebar against 3.52:1 for the
     brand green, so active items clear AA without introducing a second identity. */
  .side-item.active{background:var(--side-hover); color:var(--tape-light); font-weight:600;}
  .side-item .ico{opacity:.85; font-size:var(--fs-meta);}
  .side-proj{padding:7px 10px; border-radius:7px; font-size:var(--fs-field); cursor:pointer; margin-bottom:2px; color:var(--side-text);}
  .side-proj:hover{background:var(--side-hover);}
  .side-proj.active{background:linear-gradient(90deg, var(--tint-5), transparent); color:var(--tape-light); font-weight:600; border-left:2px solid var(--tape-light); padding-left:8px;}
  .side-proj .code{font-family:var(--label); letter-spacing:1.2px; font-size:var(--fs-ctl); color:rgba(255,255,245,.5); display:block;}
  .side-proj.active .code{color:var(--tape-light); opacity:.9;}
  .side-new{margin-top:6px; width:100%; text-align:left; font-size:var(--fs-meta); color:rgba(255,255,245,.6); background:transparent; border:1px dashed var(--side-line);}
  .side-new:hover{color:var(--tape-light); border-color:var(--tape-light);}
  .side-empty{font-size:var(--fs-meta); color:rgba(255,255,245,.45); padding:4px 10px; font-style:italic;}

  /* SECTIONS HAVE NO FRAME (Fonts Review, model C). A section is divided by its
     heading rule alone — no border, no fill, no padding. Margin does the spacing.
     Boxes are kept only where one genuinely means something: the call sheet preview
     (.card, a sheet of paper), dialogs, transient panels, and open editing states. */
  .section{background:none; border:none; border-radius:0; padding:0; margin-bottom:26px;}
  /* PATTERN A — the one tab-entry heading style (Style Review).
     Fraunces 700 15px, brand green, with a thin grey rule that starts after the
     words and sits on the text's vertical centre. Green at rest, black on hover
     (the inverse of the old behaviour, per the review). Every tab-entry heading,
     shoot-day block, summary block and company group now uses this. */
  .section h2{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.2px; text-transform:none;
    color:var(--tape); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .section h2::after{content:''; flex:1; height:1px; background:var(--line);}
  .sd-block{margin-bottom:4px;}
  /* flex-start + margin-left:auto on any trailing action, NOT space-between: with
     space-between a header that has no action (every Shoot Day block) pushed its
     own title to the far right, away from its caret. */
  .sd-block-head{display:flex; align-items:center; justify-content:flex-start; gap:8px; cursor:pointer; user-select:none;
    font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.2px;
    color:var(--tape); margin:26px 0 12px; padding-bottom:0; border-bottom:none;}
  .sd-block:first-child .sd-block-head{margin-top:0;}
  /* A collapsible head that opens its own .section rather than sitting in a run of
     .sd-blocks — it needs no top margin because the .section already spaces it.
     Was seven copies of style="margin:0 0 12px; font-size:15px" (the font-size a
     no-op: .sd-block-head is already 15px). Add the class, don't re-inline it. */
  .sd-block-head.flush{margin:0 0 12px;}
  .sd-block-head .dept-caret{font-size:11px; color:inherit;}
  .sd-block-head > button{margin-left:12px; flex:0 0 auto;}
  .sd-block-head:hover{color:var(--text);}
  /* The rule fills the gap between title and any trailing action. When a
     .sd-block-head-toggle is present the rule belongs to it, so it sits between
     the title and the button rather than after the button. */
  .sd-block-head:not(:has(.sd-block-head-toggle))::after{content:''; flex:1; height:1px; background:var(--line);}
  /* Preview & Export section headers reuse the same look, but only the caret+title
     span toggles collapse — the header action (e.g. a Copy button) sits alongside it
     and stays clickable/visible on its own, including while the body is collapsed. */
  .sd-block-head-toggle{display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:0;}
  .sd-block-head-toggle::after{content:''; flex:1; height:1px; background:var(--line);}
  .sd-block-head-toggle:hover{color:var(--text);}
  .sd-block-head-toggle .dept-caret{color:inherit;}
  .grid{display:grid; gap:10px;} .grid.g2{grid-template-columns:1fr 1fr;} .grid.g3{grid-template-columns:1fr 1fr 1fr;}

  label{display:block; font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; color:var(--muted); margin-bottom:4px; font-weight:500;}

  /* FIELDS SIT ON A LINE, NOT STACKED (Style Review).
     In a one- or two-up grid — where a short value used to get a needlessly
     full-width box — the label moves beside its control, in a fixed label column
     so rows line up down the page. Anything after the label (hint, second control)
     stacks inside the control column rather than wrapping under the label.
     Deliberately NOT applied to .g3: those cells are already narrow, and a
     104px label column there leaves ~55px for the control, which clips dates and
     times. Dense rows keep the label above, where the control gets the full cell.
     Bare labels outside a .grid — log line, notes, descriptions — stay full-width
     stacked, which is what long text wants. Below 900px everything reverts to
     stacked (see mobile block). */
  .grid:not(.g3) > div:has(> label:first-child){display:grid;
    grid-template-columns:var(--field-label-w) minmax(0,1fr);
    align-items:center; column-gap:10px; row-gap:4px;}
  .grid:not(.g3) > div:has(> label:first-child) > label{margin:0; line-height:1.25; align-self:center;}
  .grid:not(.g3) > div:has(> label:first-child) > *:not(label){grid-column:2;}
  /* textareas are tall — pin the label to the first line instead of centring it */
  .grid:not(.g3) > div:has(> label:first-child):has(> textarea){align-items:start;}
  .grid:not(.g3) > div:has(> label:first-child):has(> textarea) > label{padding-top:9px;}

  /* One inline-field pattern. .ts-field was a Tech-Specs-only duplicate of
     .field-inline; the Style Review merged them, so both names share these rules.
     Label beside a control that's sized to the value it holds ("25p" gets a small
     box, "S-Log3 CineGamut3" a wider one) rather than stretching to full width. */
  .ts-grid{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center;}
  .ts-field, .field-inline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;}
  .ts-field > label, .field-inline > label{margin:0; white-space:nowrap; flex:0 0 auto;}
  .ts-field > select, .ts-field > input[type=text],
  .field-inline > select, .field-inline > input[type=text]{width:auto; min-width:0; flex:0 1 auto;}
  /* [type=text] is needed to out-specify the global input[type=text]{width:100%} */
  .ts-field input[type=text]{width:152px; padding:6px 8px; font-size:var(--fs-field);}
  /* box sized to the value it holds, rather than every field getting the same width */
  .ts-field input.fld-xs{width:52px;} .ts-field input.fld-sm{width:78px;}
  .ts-field input.fld-md{width:132px;} .ts-field input.fld-date{width:150px;}
  .ts-field input[type=date]{width:150px; padding:6px 8px; font-size:var(--fs-field);}
  .ts-field > .hint, .field-inline > .hint{margin:0; flex:1 1 220px; min-width:0;}
  .ts-banner{font-size:var(--fs-meta); color:var(--muted); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:7px 10px; margin-bottom:12px;}
  .ts-banner.differs{background:var(--tint-3); border-color:var(--tape); color:var(--text);}
  .ts-banner span{color:var(--tape); cursor:pointer; text-decoration:underline; margin-left:6px;}
  /* Camera designations: name+tags | stacked per-camera lines | reorder, left-aligned
     columns, not pushed to the right. File-naming tags live under the operator's
     name, not per camera column — each camera line is its own left-to-right unit
     (designation, body, shorthand), stacked rather than column-aligned across cameras. */
  .cam-row{display:grid; grid-template-columns:minmax(150px,1fr) minmax(0,2fr) 60px; gap:10px; align-items:start;
    padding:11px 0;}
  .cam-who strong{font-family:var(--body); font-weight:600; font-size:14px;}
  .cam-tags{font-family:var(--mono); font-size:var(--fs-ctl); margin-top:4px; line-height:1.5;}
  /* align-items:flex-start stops "+ Add camera" stretching the full column width */
  .cam-cams{display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0;}
  .cam-cams > .cam-cam-line{align-self:stretch;}
  .cam-cam-line{display:flex; align-items:center; gap:6px;}
  .cam-badge{font-family:var(--label); font-size:var(--fs-ctl); font-weight:600; letter-spacing:1.2px; color:var(--tape);
    background:var(--tint-3); border-radius:5px; padding:5px 7px; flex:0 0 auto; white-space:nowrap;}
  .cam-body-input, .cam-shorthand-input{font-size:var(--fs-field); padding:5px 7px; min-height:0; width:auto; flex:1 1 0; min-width:0;}
  .cam-reorder{display:flex; flex-direction:column; gap:4px; align-items:center;}
  .cam-reorder .icon-btn[disabled]{opacity:.25; cursor:default;}
  .req::after{content:' *'; color:var(--danger);}
  /* FIELDS ARE RULED LINES, NOT FILLED BOXES (Fonts Review).
     No fill and no box — just a rule under the part you write in. Because the label
     sits in its own column, the rule starts where the writing starts, which is what
     marks the field as fillable. Focus thickens the rule to brand green rather than
     moving anything, so nothing shifts as you tab through a form. */
  input[type=text], input[type=date], textarea, select{
    width:100%; background:transparent; border:none; border-radius:0;
    border-bottom:1px solid var(--field-line);
    color:var(--text); padding:6px 8px 5px; font-family:var(--body); font-size:var(--fs-field);}
  input[type=text]:hover, input[type=date]:hover, textarea:hover, select:hover{
    border-bottom-color:var(--text);}
  input:focus, textarea:focus, select:focus{
    outline:none; border-bottom-color:var(--tape); box-shadow:0 1px 0 0 var(--tape);}
  input[readonly]{opacity:.7; border-bottom-style:dotted;}
  /* Settings' colour pickers (Phase Q). A swatch is the value, so it gets the box the
     ruled-line fields deliberately don't have — there is no "writing area" to underline. */
  input[type=color]{width:56px; height:30px; padding:2px; background:transparent;
    border:1px solid var(--field-line); border-radius:var(--box-radius); cursor:pointer;}
  textarea{resize:vertical; min-height:52px; line-height:1.5;}

  /* CHECKBOXES: an X, not a tick, and the box never changes fill (Fonts Review).
     The native control with accent-color painted a solid green box when checked;
     this draws an ink X on a box that stays white, so a filled-in grid reads like a
     marked-up paper form. Only the mark changes — never the background. */
  input[type=checkbox]{
    appearance:none; -webkit-appearance:none; width:16px; height:16px; margin:0;
    border:1.5px solid #8d8880; border-radius:3px; background:#fff;
    position:relative; cursor:pointer; flex:0 0 auto; vertical-align:middle;}
  input[type=checkbox]::after{
    content:'\00D7'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-family:var(--body); font-weight:500; font-size:15px;
    line-height:1; color:var(--text); opacity:0;}
  input[type=checkbox]:checked{border-color:var(--text);}
  input[type=checkbox]:checked::after{opacity:1;}
  input[type=checkbox]:hover{border-color:var(--text);}
  input[type=checkbox]:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}

  button{font-family:var(--body); font-weight:600; font-size:var(--fs-field); cursor:pointer; border-radius:7px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:8px 13px;}
  button:hover{border-color:var(--tape);} button:active{transform:translateY(1px);}
  button.primary{background:var(--tape); color:var(--tape-ink); border-color:var(--tape);}
  button.danger{color:var(--danger);} button.small{padding:5px 9px; font-size:var(--fs-meta);}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0;
    border:none; background:transparent; color:var(--muted); font-size:var(--fs-meta); cursor:pointer; border-radius:5px;
    vertical-align:middle; margin-left:2px; line-height:1;}
  .icon-btn:hover{color:var(--tape); background:var(--tint-3);}
  .icon-btn.active{color:var(--tape); background:var(--tint-4);}
  /* destructive icon button — stays quiet until hovered, so a row of controls
     doesn't read as a row of warnings */
  .icon-btn.danger-ic:hover{color:var(--danger); background:rgba(164,50,31,.10);}
  .ic{display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; vertical-align:-2px;}
  .ic svg{display:block; width:100%; height:100%;}
  .icon-btn .ic{width:14px; height:14px; vertical-align:middle;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center;}
  .status{font-size:var(--fs-meta); color:var(--muted);}

  /* Page headline follows the preview-card pattern picked in the Style Review:
     a large all-caps display title, with upper-and-lower-case sub information
     in the body font beneath it (not an uppercase eyebrow above it). */
  .page-head{margin-bottom:16px;}
  .page-head h1{font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:.4px;
    text-transform:uppercase; margin:0; color:var(--text);}
  .page-head .eyebrow{font-family:var(--body); font-size:13px; letter-spacing:0; color:var(--muted);
    text-transform:none; margin-top:2px;}
  .page-head .code{font-family:var(--label); letter-spacing:1.2px; font-size:var(--fs-ctl); color:var(--tape); margin-top:4px;}

  .tabs{display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  /* Crew Database tab strip. The count rides INSIDE the tab, muted and at body weight,
     so it reads as a quantity rather than as part of the label — the same treatment
     .dept-count gets on a department heading, which is the other place in this app a
     number sits next to a name. */
  .crewdb-tab-count{font-family:var(--body); font-weight:400; letter-spacing:0; opacity:.55;}
  .tab{padding:9px 16px; font-family:var(--label); font-weight:500; font-size:var(--fs-ctl); letter-spacing:1.2px;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--tape); border-color:var(--tape);}
  .tabs.daytabs{margin-bottom:14px;}
  .tabs.daytabs .tab{padding:7px 13px; font-size:var(--fs-ctl);}
  .tab.daytab-add{color:var(--tape); opacity:.85;}
  .tab.daytab-add:hover{opacity:1;}

  .row{display:grid; gap:8px; align-items:end; margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed var(--line);}
  .row:last-child{border-bottom:none;}
  .rows-sched .row{grid-template-columns:24px 30px 100px 90px 1fr 34px; position:relative;}
  .rows-sched .row .sc-select{align-self:center; width:16px; height:16px;}
  /* hover between schedule rows to insert a new blank row at that point, instead of
     only being able to append at the bottom — sits just left of the Time column,
     since that's the column you're navigating in when you'd reach for this */
  .sched-insert-hint{position:absolute; top:-10px; left:50px; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center; opacity:0; z-index:2;
    cursor:pointer; transition:opacity .12s ease;}
  .sched-insert-hint span{font-family:var(--label); font-size:13px; font-weight:600; line-height:1;
    color:var(--tape-ink); background:var(--tape); border-radius:50%; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;}
  .rows-sched .row:hover .sched-insert-hint, .sched-insert-hint:hover{opacity:1;}
  .sc-move{display:flex; flex-direction:column; align-self:center; gap:0;}
  .sc-move .icon-btn{width:20px; height:14px;}
  .sc-move .ic{width:11px; height:11px;}
  .sched-tools{align-items:center;}
  .sched-shift{display:inline-flex; align-items:center; gap:6px; padding:4px 8px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel-2);}
  .sched-shift select{width:auto; padding:5px 7px; font-size:var(--fs-field);}
  .sched-shift .hint{margin:0; white-space:nowrap;}
  .rows-add .row{grid-template-columns:1fr 1fr 34px;}

  .list-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .list-card.list-card-editing{border-color:var(--tape); background:var(--tint-2); margin-bottom:0; border-radius:8px 8px 0 0;}
  .crew-entry{margin-bottom:8px;}
  .crew-entry .list-card{margin-bottom:0;}
  .inline-form-card{border:1px solid var(--tape); border-top:none; border-radius:0 0 var(--box-radius) var(--box-radius); padding:var(--box-pad); margin-bottom:8px; background:var(--panel);}
  /* Names and record titles: geometric sans (--body) at 14px everywhere (Style Review) */
  .list-card .meta strong{font-family:var(--body); font-weight:600; font-size:14px; color:var(--text);}
  .list-card .meta div{color:var(--muted); font-size:var(--fs-meta); margin-top:2px;}
  .list-card .actions{display:flex; gap:6px; flex-wrap:wrap;}
  /* ---- the Crew Database card's two lines ----
     The crew card has no .actions column any more (Use as template and Delete both
     left), so .meta has to claim the width .list-card's space-between used to hand to
     the buttons — otherwise the roles wrap early against a phantom right column. */
  .crew-entry .list-card .meta{flex:1 1 auto; min-width:0;}
  /* THE CARD IS THE CONTROL — clicking it opens the record in read mode, so it has to
     say so before it's clicked. Hover tint and pointer only; no border change, because
     .list-card-editing already owns the border and the two would fight. */
  .crew-card{cursor:pointer;}
  .crew-card:hover{background:var(--tint-1);}
  .crew-card:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  /* the caret sits where the eye/pencil pair used to, so the DEPT | Name | Roles line
     starts at the same x whether a card is open or shut */
  .crew-card-caret{flex:0 0 auto; color:var(--muted); font-size:11px; width:12px;}
  .crew-card-open .crew-card-caret{color:var(--tape);}
  /* the banner's Edit / back control is pushed to the far end of the head line, so it
     reads as acting on the panel below rather than on the name beside it */
  .crew-card-action{margin-left:auto; flex:0 0 auto;}
  /* an open card and its expansion are one object: square off the join between them */
  .crew-card-open{border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .crew-card-head{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;}
  /* the name sets the line, so it does NOT shrink to make room for a long role list —
     the roles wrap to the next line instead. Overrides `.list-card .meta strong`'s
     size/weight only where it needs to (nothing) — it inherits both. */
  .crew-card-name{flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .crew-card-roles{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;}
  .crew-card-roles select.pill-select{max-width:180px;}
  /* ⚠️ `.list-card .meta div` above sets the muted meta colour and a 2px top margin on
     ANY div inside .meta — this line is one of them, so it only adds the link
     treatment. Anchors are styled explicitly: they inherit nothing useful from the
     muted rule, and an unstyled <a> here would arrive blue-and-underlined. */
  .crew-card-contact{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .crew-card-link{color:var(--muted); text-decoration:none; font-size:var(--fs-meta);}
  .crew-card-link:hover{color:var(--tape); text-decoration:underline;}
  .crew-card-sep{color:var(--muted); opacity:.5;}
  .empty-note{color:var(--muted); font-size:var(--fs-meta); font-style:italic;}

  .searchresults{position:relative;}
  .srlist{border:1px solid var(--line); border-radius:6px; background:var(--panel-2); margin-top:4px; max-height:200px; overflow:auto;}
  .sritem{padding:7px 9px; font-size:var(--fs-meta); cursor:pointer; border-bottom:1px solid var(--line);}
  .sritem:last-child{border-bottom:none;} .sritem:hover{background:var(--panel-2);}
  .mapembed{width:100%; height:220px; border:1px solid var(--line); border-radius:8px; margin-top:8px;}

  .card{background:var(--panel); border:1px solid rgba(17,10,8,.20); border-radius:var(--box-radius); padding:16px; margin-bottom:16px;}
  .card h3{font-family:var(--label); font-size:11px; letter-spacing:1.2px; color:var(--tape); margin:16px 0 8px; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;}
  .card h3::after{content:''; flex:1; height:1px; background:var(--line);}
  .card h3:first-child{margin-top:0;}
  .card .line1{font-family:var(--disp); font-weight:700; font-size:22px; color:var(--text);}
  .card .sub{color:var(--muted); font-size:var(--fs-meta); margin-top:2px;}
  .card table{width:100%; border-collapse:collapse; font-size:var(--fs-field);}
  /* two-column key-info block at top of call sheet preview */
  .key-info-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 28px; margin:16px 0 20px;
    padding:14px 16px; background:var(--panel-2); border-radius:8px; border:1px solid var(--line);}
  .ki-col{display:flex; flex-direction:column; gap:12px;}
  .ki-item h4{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--tape); margin:0 0 4px;}
  .ki-item{font-size:var(--fs-field); line-height:1.5;}
  .ki-item ul{margin:4px 0 0; padding-left:18px;}
  /* No rule between people (Phase Detail) — only under the column headings. The
     card stays white; the header rule is stronger than --line so it reads as the
     one division on the sheet. */
  .card td{padding:5px 6px; text-align:left; vertical-align:top;}
  .card th{padding:5px 6px; text-align:left; vertical-align:top;
    border-bottom:1.5px solid rgba(17,10,8,.35);}
  .card th{color:var(--muted); font-family:var(--label); font-weight:500; font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase;}
  .card ul{margin:4px 0; padding-left:18px;}
  .section table{width:100%; border-collapse:collapse; font-size:var(--fs-field);}
  .section td, .section th{padding:7px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  .section th{color:var(--tape); font-family:var(--label); font-weight:500; font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase;}
  pre#waText{white-space:pre-wrap; word-break:break-word; font-family:var(--mono); font-size:var(--fs-meta);
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px; line-height:1.6; max-height:420px; overflow:auto;}
  .hint{font-size:var(--fs-meta); color:var(--muted); margin-top:6px;}
  .pill{display:inline-block; font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; padding:2px 8px; border-radius:20px;
    background:var(--panel-2); color:var(--muted); letter-spacing:1.2px; vertical-align:middle;}
  .pill.dept{background:var(--tint-3); color:var(--tape);}
  /* Phase BE — role chips only (roleBannerHTML()'s single banner chip and
     rolesTagListHTML()'s tag-list editor). Was a .pill.dept capsule: tinted green
     fill, no border — a label shape from a different design language than the rest
     of the app, which is rounded-rectangle-with-a-border throughout. Given a
     dedicated class rather than restyling .pill.dept itself, since that class is
     shared with deptLabelHTML()'s department badge — which this phase does not
     touch. Reuses the
     checkbox's own border/radius literals verbatim (Phase Fonts: 1.5px solid,
     3px radius, no fill) rather than a new nearby-but-different number, and
     var(--text) for "primary text colour" — the same variable the checkbox
     itself switches to on :checked. */
  /* ⚠️ GREEN AT REST, INK ON HOVER. Every role chip on a project screen opens the roles
     menu, and an all-black chip gave no sign of that — it read as a printed label. Green
     is this app's one interactive colour, and darkening to ink on hover is the feedback
     that says the thing under the cursor does something. The muted/.active pair stays
     underneath for the one case that ISN'T a control: a chip rendered for a role that is
     not currently set reads muted, as it always did. */
  .role-chip{display:inline-block; font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; padding:2px 8px; border-radius:3px; vertical-align:middle;
    background:transparent; border:1.5px solid var(--muted); color:var(--muted);
    transition:color .12s ease, border-color .12s ease;}
  .role-chip.active{border-color:var(--tape); color:var(--tape);}
  .role-chip[onclick]{cursor:pointer;}
  .role-chip[onclick]:hover, .role-chip[onclick]:focus-visible{border-color:var(--text); color:var(--text); outline:none;}
  @media (prefers-reduced-motion: reduce){ .role-chip{transition:none;} }
  /* Inline pickers (department, company) are just fields (Fonts Review): same Jost,
     same size, same ruled underline as a typed input — to the person filling the form
     it's another thing to fill in, so it shouldn't look like a coloured tag. Keeps the
     compact inline sizing and the custom arrow; loses the green pill. */
  select.pill-select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-color:transparent; color:var(--text); border:none;
    border-bottom:1px solid var(--field-line); border-radius:0;
    font-family:var(--body); font-size:var(--fs-field); font-weight:400; letter-spacing:0;
    width:auto; padding:6px 18px 5px 2px; cursor:pointer; vertical-align:middle; margin-left:2px; max-width:180px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23110A08' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 4px center; background-size:9px;
  }
  select.pill-select:hover{border-bottom-color:var(--text);}
  select.pill-select:focus{outline:none; border-bottom-color:var(--tape); box-shadow:0 1px 0 0 var(--tape);}
  select.pill-select.empty{
    color:var(--muted);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236f6a63' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  }
  /* LABEL FAMILY (Style Review) — one look for every small uppercase label:
     Oswald 11px, 1.2px tracking, brand green, no bottom border. Block-level
     section labels also get the Pattern A rule (starts after the words, sits on
     their vertical centre); column and table headers get the type but no rule. */
  .subhead{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--tape); margin:14px 0 8px; padding-bottom:0; border-bottom:none;
    display:flex; align-items:center; gap:8px;}
  .subhead::after{content:''; flex:1; height:1px; background:var(--line);}
  .subhead:first-child{margin-top:0;}
  .subhead.dept-toggle{cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px;}
  /* Company groups adopt Pattern A too — same job as a summary block header. */
  /* Company groups are Oswald Bold in ink (Phase Detail). They previously matched
     .sd-block-head exactly — Fraunces 700 15px green — so Position assignments
     stacked two typographically identical heading levels. Different font, different
     colour, so block / company / department now read as three distinct levels. */
  .posn-company-header{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-family:var(--label); font-weight:700; font-size:13px; letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--text); margin:16px 0 8px; padding-bottom:0; border-bottom:none;
  }
  .posn-company-header .dept-caret{color:var(--tape);}
  .posn-company-header .dept-count{font-family:var(--body); font-weight:400;
    font-size:var(--fs-meta); letter-spacing:0; text-transform:none; color:var(--muted);}
  .posn-company-header::after{content:''; flex:1; height:1px; background:var(--line);}
  .posn-company-group:first-child .posn-company-header{margin-top:0;}
  .posn-company-header:hover{color:var(--tape);}
  .posn-company-body{margin-left:2px;}
  .posn-name{font-size:var(--fs-field); display:flex; flex-direction:column; gap:1px;}
  .subhead.dept-toggle:hover{color:var(--tape);}
  .dept-caret{font-size:9px; width:10px; display:inline-block;}
  .dept-code{color:var(--tape); font-weight:600; letter-spacing:1.2px;}
  .dept-count{color:var(--muted); font-weight:400;}
  /* Same label type as the Crew tab's Select all / Filter row, so every header
     control across the app reads at one weight and size (Style Review). */
  .dept-toggle-all{font-family:var(--body); font-size:var(--fs-meta); letter-spacing:0; text-transform:none;
    color:var(--muted); text-align:right; margin-bottom:8px;}
  .dept-toggle-all span{cursor:pointer;}
  .dept-toggle-all span:hover{color:var(--tape);}
  /* filter panel — the shared Filter trigger for all three filter panels (Crew
     database, Crew-on-project, Budget), built by filterToggleHTML() (G1). No
     margin-bottom here: Crew-on-project and Budget render it as a flex item inside
     .crew-header-row, which already supplies the row's own bottom margin — giving
     the trigger its own would double up and add uneven space only when the row
     wraps. Crew database renders it standalone, straight in a .section, so it
     still needs one; see the .section > .filter-toggle rule below. */
  .filter-toggle{cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:4px;
    font-family:var(--body); font-size:var(--fs-meta); letter-spacing:0; text-transform:none; color:var(--muted);}
  .filter-toggle:hover{color:var(--tape);}
  .section > .filter-toggle{margin-bottom:8px;}
  /* Crew tab header row (Phase V) — Select all + Filter left-aligned, Expand/Collapse
     all + Summary right-aligned, all sharing one font/size so nothing reads as bolder
     or bigger than its neighbours. The Filter panel itself renders below this row,
     not inside it, so opening it can't distort the row's alignment. */
  /* Header controls (Select all / Filter / Expand-collapse / Summary / All) are in
     the BODY font, not the label font (Fonts Review) — they're things you click,
     not captions, and Oswald's uppercase tracking made them read as headings. */
  /* CREW TOOLBAR (Phase Detail). One row, one font, no rule underneath. The right
     group is pushed by margin-left:auto rather than space-between — with
     space-between the two halves were flung 481px apart at 1000px and the gap grew
     with the window. Order is Select all / Filter … Summary / Expand-Collapse all,
     so the All-type action sits furthest right, above the grid's own All column. */
  .crew-header-row{display:flex; align-items:center; flex-wrap:wrap;
    gap:6px 16px; font-family:var(--body); font-size:var(--fs-meta); letter-spacing:0; text-transform:none;
    color:var(--muted); margin-bottom:8px;}
  .crew-header-left, .crew-header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  /* R1 — Budget's Copy / Export, generalised in Phase AP into the ONE output-menu
     trigger both Budget and Preview & Export wear (was .budget-output; renamed
     because it is no longer Budget's). Inherits the toolbar's Jost/--fs-meta/muted
     treatment like every other header control (they're things you click, not
     captions), and goes brand green on hover the same way. */
  .output-menu{display:flex; align-items:center; gap:14px;}
  .output-menu > span{display:inline-flex; align-items:center; gap:5px; cursor:pointer;}
  .output-menu > span:hover{color:var(--tape);}
  .output-menu svg{width:13px; height:13px;}
  /* The two words inside the one trigger read as a pair, not two buttons — a
     hair more space before "Export" so "Copy" and its icon stay grouped. */
  .output-menu-sep{opacity:.4; margin:0 3px;}
  .crew-header-right{margin-left:auto;}
  /* Select all is a <label>, so the global label{} rule was giving it Oswald 11px
     while its neighbours were Jost 12px. Put it back in the toolbar's own font. */
  .crew-header-row label{font-family:var(--body); font-size:var(--fs-meta);
    letter-spacing:0; text-transform:none; font-weight:400; color:inherit; margin:0;}
  .crew-header-row label, .crew-header-row span{cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:4px;}
  .crew-header-row label:hover, .crew-header-row span:hover{color:var(--tape);}
  .crew-header-selectall input{margin:0;}
  .filter-panel{border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); margin-bottom:10px; background:var(--tint-1);}
  .filter-chips{display:flex; flex-wrap:wrap; gap:4px 10px;}
  .dept-admin-block{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px;}
  /* The row of trailing checkboxes + hint + "Clear filters" at the bottom of a
     filter panel. Was inline on the Crew panel's closing div; a second filter
     panel (Budget's day filter) needed the same row, so it's a class now. All
     three panels build this row through filterPanelFootHTML() — see that
     function for the visibility rule the class exists to carry. */
  .filter-panel-foot{margin-top:10px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  /* The "Clear filters" link itself — was the same inline style repeated on
     each panel; a class so all three can't drift apart. */
  .filter-clear{cursor:pointer; color:var(--tape);}
  .filter-chips label{font-size:var(--fs-meta); display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .bulk-action-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--tint-3);
    border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:var(--fs-meta);}
  .bulk-select-cb{width:16px; height:16px; flex:0 0 auto;}
  .bulk-edit-panel{border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); margin-bottom:10px; background:var(--tint-1);}
  /* Roles tab (Phase S, reordered Phase Z) — proper tidy columns instead of one
     packed inline row. Controls | Name | Role | Rate | Show as. */
  /* Controls | Name | Role | Total | Prep | Shoot | Post | Buyout | Day rate | Show as.
     The three phase columns sit together and in chronological order, with Buyout
     immediately after them because it is what changes their meaning. */
  /* ⚠️ Phase BU — THE TEMPLATE IS A VARIABLE, set as --roles-cols on the enclosing
     .tablewrap by rolesColumns(). It has to be: the column set now depends on Budget, Itemize
     VAT, Split kit, Costs PP, the Stage/Days/Dates mode and the three phase filters, which
     is far past what a handful of static classes can enumerate — .no-money was already the
     second of them. The fallback keeps the grid sane if a caller forgets to set it. */
  .roles-grid{display:grid; align-items:center; column-gap:10px;
    grid-template-columns:var(--roles-cols, var(--pb-controls-w) var(--pb-name-w) var(--pb-role-w)
      56px 56px 56px 60px minmax(110px,1fr));}
  .roles-total{font-variant-numeric:tabular-nums; white-space:nowrap; text-align:center;}
  .roles-num{min-width:0; text-align:center; font-variant-numeric:tabular-nums;}
  .roles-num .budget-rate-input{width:100%; text-align:center;}
  /* ⚠️ REMOVED in Phase BW: .roles-phase-days (a number field + calendar button side by side,
     Phase BU) and .roles-phase-cal (the icon alone, Phase BV). Both belonged to the DATES
     mode, which no longer exists — dates are marked in the Dates popup. A phase cell is a
     plain number in both remaining modes, so .roles-num covers it. */
  /* the Shoot header, when it is a disclosure control. Inherits the header row's own
     uppercase Oswald — this is a heading that happens to be clickable, not a button dropped
     into a header, so it grows a caret and a pointer and nothing else. Same idiom as
     .dept-toggle and .sd-block-head-toggle. */
  .roles-shoot-head{cursor:pointer; user-select:none; display:inline-flex; align-items:center;
    gap:2px; white-space:nowrap;}
  .roles-shoot-head:hover{color:var(--text);}
  .roles-shoot-head:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .roles-shoot-head .dept-caret{font-size:9px; line-height:1;}
  /* the expanded day ticks. .crewgrid-check already centres a checkbox in a day column on
     the Production/Hotel grids; this only pins the width, since these columns are narrower
     (30px) than that grid's own. */
  .roles-shootday{min-width:0;}
  /* ⚠️ REMOVED in Phase BU: .roles-shoot and .roles-shoot-n, and the checkbox they wrapped.
     The Shoot column is a plain read-only day count now — a tick with a small number riding
     beside it was two answers in one cell, and the count next to the checkbox is the thing
     the brief asked to be rid of. Membership moved to Stage mode. Do not look for them. */
  /* the same-human marker on a person split across departments */
  .role-dupe-star{color:var(--tape); font-weight:700; margin-left:3px; cursor:help;}
  /* ---- "Also on this project as" ---- */
  .also-listed{margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:12px;}
  /* ---- Swap for ---- */
  .swap-pane label{display:block;}
  .swap-keep{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .swap-keep-head{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin-bottom:8px;}
  /* every carried item on its own line: these are decisions, and a wrapped row of
     checkboxes reads as a tag cloud rather than as a list of things to weigh */
  .swap-keep label{display:flex; align-items:center; gap:8px; margin:0 0 6px;
    font-family:var(--body); font-size:var(--fs-meta); font-weight:400; letter-spacing:0;
    text-transform:none; color:var(--text); cursor:pointer;}
  .swap-pane button.primary[disabled]{opacity:.45; cursor:not-allowed;}
  .also-listed-head{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin-bottom:8px;}
  .also-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; cursor:pointer;
    padding:7px 8px; margin:0 -8px; border-radius:6px; font-size:var(--fs-meta);}
  .also-row:hover{background:var(--tint-2);}
  .also-row:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  .also-dept{font-family:var(--label); font-size:10.5px; font-weight:600; letter-spacing:1.1px;
    text-transform:uppercase; color:var(--tape);}
  .also-stages{color:var(--muted);}
  /* the row you were sent to, so arriving reads as arriving */
  @keyframes roleRowFlash{ from{background:var(--tint-4);} to{background:transparent;} }
  .role-row-flash{animation:roleRowFlash 1.6s ease-out 1;}
  @media (prefers-reduced-motion: reduce){ .role-row-flash{animation:none; outline:2px solid var(--tape); outline-offset:-2px;} }
  /* a buyout is a different KIND of number from a day rate, so the row says so rather
     than leaving the reader to infer it from a tick box three columns away */
  .roles-buyout{display:flex; align-items:center; justify-content:center;}
  .buyout-flag{font-family:var(--label); font-size:10px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--tape); border:1px solid var(--tape);
    border-radius:20px; padding:0 6px; margin-left:6px; white-space:nowrap;}
  .roles-grid-rate{white-space:nowrap;}
  .roles-grid-header-row, .prep-grid-header-row{padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid var(--line);}
  /* the Name/Role headings, when they are disclosure controls (Phase BX). Same treatment as
     .roles-shoot-head — a heading that happens to be clickable, so it grows a caret and a
     pointer and nothing else. */
  .roles-col-toggle{cursor:pointer; user-select:none; display:inline-flex; align-items:center;
    gap:2px; white-space:nowrap;}
  .roles-col-toggle:hover{color:var(--text);}
  .roles-col-toggle:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .roles-col-toggle .dept-caret{font-size:9px; line-height:1;}
  /* the Shoot day-count as a second trigger for the expansion (Phase BX) */
  .roles-shoot-total{cursor:pointer; user-select:none;}
  .roles-shoot-total:hover{color:var(--tape);}
  .roles-shoot-total:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  /* ============ FROZEN PANES ON ROLES (Phase BX) ============
     Roles scrolls sideways at desktop width with the money columns on, and scrolled right you
     could no longer tell whose £2,250 of VAT you were reading. Controls / Name / Role pin to
     the left edge of the scrollport; the heading row pins to the top of it.
     ⚠️ This needs .tablewrap to be a REAL two-axis scrollport, which is why .roles-tablewrap
     carries a max-height. `overflow-x:auto` alone computes overflow-y to `auto` per spec, so
     the wrapper already captures vertical sticky — a header row with `top:0` would pin to the
     top of the wrapper's own content box and then scroll away with the page, i.e. not stick at
     all. Giving it a height makes the pinning real in both directions.
     ⚠️ Only ROLES gets this. The other six sub-tabs fit their width and are pinned on mobile by
     the rules further down; adding a scroll box to all of them would put a second scrollbar on
     screens that never needed one. */
  /* ⚠️ The height is SET IN JS, by sizeRolesTablewrap(), and it has to be: the box must end at
     the bottom of the viewport, and where it STARTS moves. The banner above it changes height
     when Budget is toggled (three figures vs a sentence), when Itemize VAT is toggled, and when
     the mode picker appears — so any fixed `calc(100vh - Npx)` is wrong for most states, and
     wrong in the way that matters: too tall, the box runs past the viewport, the PAGE scrolls
     instead, and the frozen header row scrolls off with it. 60vh is the fallback for the frame
     before the measurement lands. */
  .roles-tablewrap{max-height:60vh; overflow:auto; overscroll-behavior:contain;}
  /* ⚠️ WITHOUT THIS THE FROZEN COLUMNS ONLY HALF WORK, and the failure is subtle enough to
     ship by accident: a sticky box is never pushed outside its own CONTAINING BLOCK, which
     here is the grid container. Left at the wrapper's width (800px) while the template sums to
     1415px, the grid overflows its own box — so scrolling 615px right let Name travel about
     50px and then jam, sliding away with everything else. max-content makes the container as
     wide as its columns, which is the span the sticky cells need to hold across.
     min-width:100% is the other half of the pair: when the columns DO fit, the grid fills the
     wrapper so the trailing minmax(…,1fr) can still absorb the slack (under max-content alone a
     1fr resolves to its minimum and the rows would stop short of the right-hand rule).
     Same rule the mobile block below has always applied to all seven sub-tabs — this is it at
     desktop width, for Roles only. */
  .roles-tablewrap .roles-grid,
  .roles-tablewrap .dept-group,
  .roles-tablewrap .person-block{width:max-content; min-width:100%;}
  .roles-tablewrap .roles-grid-header-row{
    position:sticky; top:0; z-index:3; background:var(--bg); margin-bottom:0;
    padding-top:2px;
  }
  /* the three leading columns. Each needs an opaque fill of its own — rows are transparent, so
     without it the scrolling cells show through underneath. The offsets are the column widths
     plus the 10px grid gap, and they are read from the SAME tokens the grid template uses, so a
     collapsed Name column (Phase BX narrows --pb-name-w) moves the Role column's pin with it
     rather than leaving a gap or an overlap. */
  .roles-tablewrap .roles-grid-controls,
  .roles-tablewrap .pb-head-blank{
    position:sticky; left:0; z-index:2; background:var(--bg); align-self:stretch;
    width:calc(var(--pb-controls-w) + 10px);
  }
  .roles-tablewrap .roles-grid-name,
  .roles-tablewrap .pb-head-name{
    position:sticky; left:calc(var(--pb-controls-w) + 10px); z-index:2; background:var(--bg);
    align-self:stretch; display:flex; align-items:center;
  }
  .roles-tablewrap .pb-role-cell,
  .roles-tablewrap .pb-head-role{
    position:sticky; left:calc(var(--pb-controls-w) + var(--pb-name-w) + 20px); z-index:2;
    background:var(--bg); align-self:stretch; display:flex; align-items:center;
    box-shadow:6px 0 6px -6px rgba(17,10,8,.16);
  }
  /* the header row's own three lead cells sit at BOTH edges, so they outrank the row cells
     (z-index 2) and the header row (3) alike */
  .roles-tablewrap .roles-grid-header-row .pb-head-blank,
  .roles-tablewrap .roles-grid-header-row .pb-head-name,
  .roles-tablewrap .roles-grid-header-row .pb-head-role{z-index:4;}
  /* the department heading is narrower than the rows it labels, so it pins left too rather
     than sliding out of view as you scroll across */
  .roles-tablewrap > .dept-toggle{position:sticky; left:0; z-index:5; background:var(--bg);
    width:calc(100% - 2px);}
  /* an open person-block edit form is a FORM, not a row — it must not inherit the row's
     max-content width and scroll sideways as 700px of text fields */
  .roles-tablewrap{container-type:inline-size;}
  .roles-tablewrap .pb-editform{position:sticky; left:0; width:100cqw;}
  /* ============ ROLES RUNS WIDE (desktop only) ============
     Every other screen in this app is a sheet of paper 840px wide, and should stay one. Roles
     is the exception: it is a table of INPUTS whose column set grows with Budget, Itemize VAT,
     Split kit and Costs PP, and on a wide monitor it was scrolling sideways inside an 800px
     box with empty desk either side of it. The zone below the toolbar breaks out of the paper
     column to use that room; everything above it — the tab strip, the totals banner, the tool
     buttons — stays exactly where it was, so the page still reads as a document with one wide
     table in it rather than as a full-bleed spreadsheet.
     ⚠️ SYMMETRIC NEGATIVE MARGINS, not a width: the zone is a block, so widening it is the
     same calculation on both sides and it cannot end up off-centre from the column above.
       (avail - paper)/2   how much desk there is on ONE side of the paper
       + --main-pad        .main's own padding, which the zone starts inside of
       - --roles-gutter    the margin kept from the window edge (the "margin of kind")
     max(0px, …) is what makes this self-disabling: below ~1070px of viewport the desk is gone,
     the bleed computes to 0 and the zone sits in the paper column like everything else. There
     is no breakpoint to keep in step with the layout — the sum reaches zero on its own.
     ⚠️ THE GUTTER IS GENEROUS AND IT GROWS WITH THE WINDOW — clamp(40px, 5vw, 110px), not a
     token 30px. The point of this zone is to use the desk, not to run the table into the
     window edge: a table that stops a hair short of the frame reads as an overflow, whereas
     the same table with an inch of margin still reads as a wide sheet of paper, which is what
     the rest of the app is. 5vw keeps that margin looking the same on a 1280 laptop and a
     1920 monitor rather than growing tight on one and vast on the other.
     ⚠️ 100vw INCLUDES the scrollbar where the platform draws a classic one, so the bleed can
     overshoot by half a scrollbar per side — about 7px, absorbed by a gutter this size. The
     zone still stays centred (it is measured from .main, which is centred in the real content
     box) rather than sliding under the scrollbar.
     ⚠️ Gated at 901px to match the mobile block below, where .side leaves the flow and becomes
     a drawer — under that breakpoint `100vw - --sidew` is not the available width at all. */
  .roles-widezone{--roles-bleed:0px;}
  @media(min-width:901px){
    .roles-widezone{
      --roles-gutter:clamp(40px, 5vw, 110px);
      --roles-bleed:max(0px, (100vw - var(--sidew) - var(--mainw))/2 + var(--main-pad) - var(--roles-gutter));
      margin-left:calc(-1 * var(--roles-bleed));
      margin-right:calc(-1 * var(--roles-bleed));
    }
  }
  .roles-grid-header, .prep-grid-header{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; color:var(--tape); letter-spacing:1.2px; text-transform:uppercase;}
  /* ---- drag a heading to move the column (Phase CA) ----
     The grab cursor is the whole affordance at rest; anything louder would put a permanent
     handle in every heading of the app's densest row for something you do once a month. */
  .roles-head-drag{cursor:grab;}
  .roles-head-drag:active{cursor:grabbing;}
  .roles-head-drag:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .roles-col-dragging{opacity:.4;}
  /* ⚠️ inset box-shadow, not a border: a border would add 2px to a heading whose width IS the
     column's, so every cue would nudge the whole grid sideways as you dragged across it */
  .roles-col-dropbefore{box-shadow:inset 2px 0 0 var(--tape);}
  .roles-col-dropafter{box-shadow:inset -2px 0 0 var(--tape);}
  /* Phase BR — RATE and DAYS over Pre-production's two bare number fields. One header
     CELL (column 4 holds both inputs), laid out on the same flex row and the same field
     width as .prep-fields-row below it so each label lands over its own input. */
  .prep-header-fields{display:flex; align-items:center; gap:10px;}
  .prep-header-fields span{width:60px; flex:0 0 auto;}
  /* Phase BR — Name/Role are column headings on every sub-tab now, so they left-align
     even inside .crewgrid-header, which centres its day labels.
     ⚠️ This used to be a bare `.pb-head-name, .pb-head-role` rule relying on source order
     ("same specificity, later source wins"). It only beat .roles-grid-header /
     .prep-grid-header, which are declared just above; .crewgrid-header is declared ~130
     lines LATER, so its text-align:center won on Days on site / Hotel / Travel / Catering
     and Name/Role drifted to the middle of their columns while Roles and Pre-production
     kept them left — the same heading in two different places depending on the sub-tab.
     Now (0,2,0) via :is(), so it beats any single-class header rule wherever that rule is
     declared. Add new grid header classes to the :is() list, don't reorder the file. */
  :is(.roles-grid-header, .prep-grid-header, .crewgrid-header).pb-head-name,
  :is(.roles-grid-header, .prep-grid-header, .crewgrid-header).pb-head-role{text-align:left;}
  /* ⚠️ REMOVED in Phase BK: .roles-grid-row / .roles-grid-row-editing / .roles-grid-editform.
     The Roles list is person BLOCKS now — .person-block owns the spacing, the editing
     tint (.person-block-editing) and the expansion box (.pb-editform), for all six
     sub-tabs at once instead of one set of rules per tab. */
  .roles-grid-controls{display:flex; align-items:center; gap:0;}
  .roles-grid-name{min-width:0; font-family:var(--body); font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .roles-grid-cell{min-width:0;}
  .roles-grid-showas{display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Phase BD — the Pre-production row, since Phase BJ a Crew sub-tab (T-2.9). Same
     grid idiom as .roles-grid: Controls (bulk-select only, no Edit pencil — this tab
     has no crew-record edit path of its own) | Name | Role | the two bare number
     fields | the calendar marker. There is deliberately NO header row — rate and days
     carry no column headers and no inline labels, magnitude alone distinguishes them.
     The name column is capped the same way .crewgrid's is (Phase Detail), with a
     trailing minmax(0,1fr) so spare width lands after the row rather than stranding
     the marker at the edge. */
  /* the fields column. Was a flat 200px, sized to the COUNTER rather than to the inputs
     ("5 days booked · 7 dates marked" wrapped at 150px). With the counter gone the only
     thing in this column is the two inputs, so the track is now exactly what they need
     — and it has to be a token, because it is the one leading-column width that CHANGES
     on mobile: the inputs grow 60px→76px there (.prep-fields below), so a hardcoded
     desktop value would clip them. Header labels follow the same widths, so RATE/DAYS
     stay over their own inputs at both sizes. (Token lives in :root with the other
     --pb-* leading-column widths; mobile overrides it in the same :root block that
     retunes them.) */
  /* ⚠️ Phase BT — align-items:CENTER, not `start`. Phase BO's note two blocks down
     already claimed all three grids centred; .prep-grid alone still said `start`, and
     that mismatch WAS the "Pre-production is spaced differently" complaint: in the
     shared 33px row a 28px input/name sat hard against the top with the slack all
     below it, while Roles and the four .crewgrid tabs centred theirs. Mobile never
     had the bug (.prep-name is align-self:stretch + flex-centred there), which is why
     it only ever showed up on desktop. Still centre now the counter is gone: a row can
     be taller than 33px for a stacked role or an open calendar, and Name/Role should
     centre against the whole group. Same grid used by both phase sub-tabs. */
  .prep-grid{display:grid; align-items:center; column-gap:10px;
    grid-template-columns:var(--pb-controls-w) var(--pb-name-w) var(--pb-role-w) var(--pb-phase-fields-w) 32px minmax(0,1fr);}
  .prep-controls{display:flex; align-items:center;}
  .prep-cell{min-width:0;}
  /* names match every other list in the app: Jost 600 14px (Phase Style Review) */
  .prep-name{font-family:var(--body); font-weight:600; font-size:var(--fs-name);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prep-fields-row{display:flex; align-items:center; gap:10px;}
  .prep-fields .budget-rate-input{width:60px;}
  /* ⚠️ REMOVED with the counter itself: .prep-counter / .prep-counter:empty. Their whole
     job was keeping a row that HAD counter text from being taller than one that didn't;
     with no second line under the fields at all, every phase row is now the bare
     .prep-fields-row and sits at the shared 33px floor unconditionally. */
  /* the marks indicator. WEIGHT is the whole signal (muted = nothing marked, ink =
     marked) rather than a second visual language for the same idea — the same
     convention .pb-toggle uses. (It was AZ's .role-add-marker convention originally;
     Phase BM removed that element, but the convention it set stands.) */
  .prep-cal-btn{color:var(--muted);}
  .prep-cal-btn.has-marks{color:var(--text);}
  .prep-calcell{display:flex; justify-content:flex-start;}
  /* the calendar is a transient editing panel, so it takes the app's panel treatment
     (.filter-panel / .bulk-edit-panel), not a bare block — Phase Fonts keeps boxes
     only where one means something, and "this row is open for editing" is one. */
  .prep-calwrap{grid-column:1/-1; margin-top:8px;}
  .prep-cal{border:1px solid var(--line); border-radius:var(--box-radius);
    padding:var(--box-pad); background:var(--tint-1); max-width:330px;}
  .prep-cal-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .prep-cal-title{font-family:var(--body); font-weight:600; font-size:var(--fs-field); flex:1;}
  .prep-cal-nav{cursor:pointer; color:var(--muted); font-size:15px; line-height:1; padding:0 3px; user-select:none;}
  .prep-cal-nav:hover{color:var(--tape);}
  .prep-cal-clear{cursor:pointer; color:var(--tape); font-size:var(--fs-meta);}
  .prep-cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px;}
  .prep-cal-wd{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    color:var(--tape); text-align:center; padding-bottom:4px;}
  /* a marked day is the same filled-dark chip the mobile day-chips use (Phase Bulk
     Edit) — one signal for one state, no outline-plus-mark doubling up. */
  .prep-cal-day{display:flex; align-items:center; justify-content:center; user-select:none;
    height:28px; border-radius:3px; cursor:pointer; font-size:var(--fs-field);
    border:1.5px solid transparent;}
  .prep-cal-day:not(.empty):hover{border-color:var(--field-line);}
  .prep-cal-day.marked{background:var(--text); color:#fff; font-weight:600; border-color:var(--text);}
  .prep-cal-day.empty{visibility:hidden; cursor:default;}
  .prep-cal .hint{margin-top:8px;}
  /* ============ THE DATES POPUP (Phase BW) ============
     One person, all three phases, one calendar. Uses the app's own .modal-overlay/.modal-box
     shell and the .prep-cal-* grid the phase tabs already have, so the calendar itself is one
     implementation — only the chrome around it and the phase colouring are new. */
  .dates-box{max-width:400px;}
  .dates-head{margin-bottom:12px;}
  .dates-name{font-family:var(--body); font-weight:600; font-size:15px; line-height:1.25;}
  .dates-role{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-top:2px;}
  /* the phase picker: three circles, one per phase, in their own colours */
  .dates-phases{display:flex; gap:8px; margin-bottom:12px;}
  .dates-phase{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:8px 4px 7px; border:1px solid var(--line); border-radius:var(--box-radius);
    cursor:pointer; user-select:none; background:transparent;}
  .dates-phase:hover{border-color:var(--field-line);}
  .dates-phase:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-dot{width:16px; height:16px; border-radius:50%; flex:0 0 auto;
    border:2px solid currentColor; background:transparent;}
  .dates-phase-lbl{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.1px;
    text-transform:uppercase; line-height:1;}
  .dates-phase-n{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    line-height:1; letter-spacing:0; text-transform:none;}
  .dates-phase.prep{color:var(--phase-prep);} .dates-phase.shoot{color:var(--phase-shoot);}
  .dates-phase.post{color:var(--phase-post);}
  /* selected: the circle fills and the card takes the phase's own faint wash, so which phase
     you are editing is readable from the card and not only from the ring */
  .dates-phase.on .dates-dot{background:currentColor;}
  .dates-phase.on{border-color:currentColor; font-weight:600;}
  .dates-phase.prep.on{background:var(--phase-prep-soft);}
  .dates-phase.shoot.on{background:var(--phase-shoot-soft);}
  .dates-phase.post.on{background:var(--phase-post-soft);}
  /* the calendar, tinted to whichever phase is selected. .marked is the class the shared
     drag machinery toggles (prepDragApply), so the colour has to come from the CONTAINER
     rather than from a per-phase class on the cell — otherwise a live drag would paint in
     the wrong colour until the next render. */
  /* ⚠️ --phase-c, NOT currentColor, and this is not a style preference. `background:
     currentColor` resolves against the element's OWN color — and this rule sets `color:#fff`
     on the same element, so the background came out WHITE: a marked day rendered as a blank
     box with white text on it. The phase colour has to arrive through a property the rule
     isn't simultaneously overwriting. */
  .dates-cal{--phase-c:var(--tape);}
  .dates-cal.prep{--phase-c:var(--phase-prep); color:var(--phase-prep);}
  .dates-cal.shoot{--phase-c:var(--phase-shoot); color:var(--phase-shoot);}
  .dates-cal.post{--phase-c:var(--phase-post); color:var(--phase-post);}
  .dates-cal .prep-cal-day.marked{background:var(--phase-c); border-color:var(--phase-c); color:#fff;}
  .dates-cal{border:none; padding:0; margin:0;}
  /* a day the OTHER phases hold: a dot under the number, in that phase's colour, so a clash
     between prep and the shoot is visible while you are marking either */
  .prep-cal-day{position:relative;}
  .dates-others{position:absolute; bottom:2px; left:0; right:0; display:flex;
    justify-content:center; gap:2px; pointer-events:none;}
  .dates-others i{width:4px; height:4px; border-radius:50%; display:block;}
  .prep-cal-day.marked .dates-others i{outline:1px solid rgba(255,255,255,.7);}
  /* read-only: the shoot's dates are the shoot days' own, so the grid says so rather than
     accepting clicks that could not be stored anywhere */
  .dates-cal.readonly .prep-cal-day{cursor:default;}
  .dates-cal.readonly .prep-cal-day:not(.empty):hover{border-color:var(--line);}
  .dates-foot{margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dates-count{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);}
  /* the shortfall flag — fewer dates marked than days booked. Amber, not red: nothing is
     broken and nothing is blocked, there is just a booking not yet placed on the calendar. */
  .dates-short{display:flex; align-items:flex-start; gap:7px; margin-top:10px;
    padding:8px 10px; border-radius:6px; background:rgba(138,90,11,.09);
    border:1px solid rgba(138,90,11,.28);
    font-family:var(--body); font-size:var(--fs-meta); color:#7A4F09; line-height:1.45;}
  .dates-short strong{color:#7A4F09;}
  /* the row's own button. .short is the same signal at list scale, so a shortfall is findable
     without opening all 41 rows. */
  .dates-cell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .dates-btn{display:inline-flex; align-items:center; gap:4px; cursor:pointer;
    border:1px solid var(--line); border-radius:5px; background:transparent; padding:3px 7px;
    font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:.8px; color:var(--muted);
    white-space:nowrap;}
  /* ---- Phase CF: which ROLE you are marking, when a person holds more than one ----
     Deliberately quieter than .dates-phase (no colour dot, no count): the phase buttons are
     what you move between constantly, this is a thing you set once on the way in. */
  /* another role's count, beside this role's own. Italic and bracketed so the two never read
     as one figure, and muted so the number you can actually edit stays the loud one. */
  .dates-phase-other{font-style:italic; font-weight:400; opacity:.65; margin-left:3px;}
  .dates-roles{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;}
  .dates-role-btn{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:.8px;
    text-transform:uppercase; padding:5px 10px; border:1px solid var(--line); border-radius:20px;
    background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .dates-role-btn:hover{border-color:var(--tape); color:var(--tape);}
  .dates-role-btn.on{border-color:var(--tape); background:var(--tint-3); color:var(--tape); font-weight:600;}
  .dates-role-btn:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-btn:hover{border-color:var(--tape); color:var(--tape);}
  .dates-btn:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-btn.has-marks{color:var(--text);}
  .dates-btn.short{border-color:rgba(138,90,11,.5); color:#7A4F09;}
  .dates-btn svg{flex:0 0 auto;}
  .modal-overlay{position:fixed; inset:0; background:rgba(17,10,8,.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;}
  .modal-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--box-radius); padding:16px; max-width:420px; width:100%; box-shadow:0 12px 40px rgba(17,10,8,.25);}
  .modal-box h3{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin:0 0 14px;
    display:flex; align-items:center; gap:8px;}
  .modal-box h3::after{content:''; flex:1; height:1px; background:var(--line);}
  /* the crew form is a real form, not a confirm dialog — .modal-box's 420px would put two
     fields per line and then scroll forever, and the page behind it is 840px of paper */
  .crew-edit-box{max-width:620px; max-height:88vh; overflow:auto;}
  /* ---- Add person (Phase CM): a search field and a list, nothing else ---- */
  /* ---- Location costs (Phase CO; folded into the row in CQ) ----
     ⚠️ REMOVED in Phase CQ: .loc-cost-card / .loc-cost-head / .loc-cost-total — the standalone
     card's own frame, heading and total. The panel hangs inside .crewgrid-editform now, which
     already carries the border and the fill, and the row above it carries the name and the
     figure. Do not reintroduce a heading here. */
  /* the row, as a disclosure — the .dept-caret idiom Crew uses, nothing louder */
  .loc-name-cell{cursor:pointer; user-select:none; display:flex; align-items:baseline; gap:6px;}
  .loc-name-cell:hover{color:var(--tape);}
  .loc-name-cell:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  .loc-name-cell .dept-caret{flex:0 0 auto;}
  .loc-name-text{min-width:0;}
  .loc-row-total{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;
    font-weight:600; align-self:center;}
  .loc-row-open{background:var(--tint-1);}
  .loc-cost-panel{margin-top:8px;}
  /* the banner: the same grid as .phase-banner, minus the phase stack it has no use for */
  .loc-banner{grid-template-columns:minmax(0,1fr); grid-template-areas:"totals" "tools";}
  .loc-banner .bnr-toolrow{justify-content:flex-end;}
  /* VAT as a toggle, sized and spaced like the other fields on the row */
  .loc-vat-field .loc-vat-toggle{display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--body); font-size:var(--fs-meta); color:var(--text); padding:6px 0;}
  .loc-cost-fields{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end;}
  .loc-cost-fields > div{min-width:0;}
  .loc-cost-fields select{width:130px;}
  .loc-cost-fields .budget-rate-input{width:96px;}
  /* one charge per line — these are things you read down a list and total in your head, not
     a wrapping row of pills */
  .loc-extras{margin-top:10px; border-top:1px solid var(--line); padding-top:8px;}
  .loc-extra-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .loc-extra-label{flex:1 1 auto; min-width:0;}
  .loc-extra-row .budget-rate-input{width:96px;}
  /* ---- day-by-day rates/hours (Phase CP) ---- */
  .loc-days{margin-top:10px; border-top:1px solid var(--line); padding-top:8px;}
  .loc-day-head, .loc-day-row{display:grid; grid-template-columns:44px repeat(var(--locday-cols,2), 96px) minmax(0,1fr);
    align-items:center; gap:8px;}
  .loc-day-head{font-family:var(--label); font-size:10px; letter-spacing:1.1px; text-transform:uppercase;
    color:var(--muted); margin-bottom:4px;}
  .loc-day-head span:last-child, .loc-day-cost{text-align:right;}
  .loc-day-row{margin-bottom:4px;}
  .loc-day-num{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1px; color:var(--tape);}
  .loc-day-cost{font-variant-numeric:tabular-nums; white-space:nowrap;}
  @media(max-width:900px){
    .loc-cost-fields select, .loc-cost-fields .budget-rate-input{width:100%;}
    .loc-cost-fields > div{flex:1 1 100%;}
  }
  .add-person-box{max-width:520px;}
  .add-person-search{width:100%; font-size:15px; padding:10px 12px;}
  /* tall enough to show the shortlist without the modal growing and shrinking as you type —
     a list that changes height under the cursor is a list you mis-click */
  .add-person-results{margin-top:10px; max-height:46vh; overflow:auto;}
  .crew-add-person{margin-right:4px;}
  .crew-edit-box .crew-edit-form{margin:0;}
  /* ---- Phase CC: the department pill, left of the name ----
     The name cell is a row now, not a text node: pill, then the name, which is why the name
     got a span of its own. min-width:0 + the ellipsis stay on the TEXT, so a long name is what
     truncates — never the three letters that say which department you are looking at. */
  .roles-grid-name{display:flex; align-items:center; gap:6px; min-width:0;}
  /* ⚠️ FIXED WIDTH, so the codes read as a COLUMN rather than as a ragged edge — "CAT/TRA" is
     twice the width of "SET", and left to itself every name on the page starts at a different
     x. 56px is the widest code plus its padding. This is a track in all but name; it is done
     inside the Name cell rather than as a real fourth lead column because those three columns
     are shared with five other sub-tabs (Phase BO) and only Roles wants a pill. */
  .roles-grid-name .pill.dept{flex:0 0 56px; display:inline-flex; justify-content:center;
    padding-left:0; padding-right:0;}
  .roles-name-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .roles-inline{display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px;}
  /* ⚠️ REMOVED in Phase BM: .role-add-marker (+ .has-roles, :hover) — AZ's separate "+"
     marker beside the chip. The chip itself is the roles-menu trigger now, and the
     marker's has-other-saved-roles weighting is not replaced: BK/BL's chevron + muted
     "+N" already carry that signal one level up, on the block. Do not look for it. */
  .formgroup{border:none; border-radius:0; padding:0; margin-bottom:16px; background:none;}
