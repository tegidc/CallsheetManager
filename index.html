  // only store fields that actually differ from the database record
  const ov = {};
  OVERRIDABLE_FIELDS.forEach(f=>{ if((proposed[f]||'') !== (base[f]||'')) ov[f] = proposed[f]; });
  day.crewOverrides = day.crewOverrides || {};
  if(Object.keys(ov).length) day.crewOverrides[crewId] = ov; else delete day.crewOverrides[crewId];
  await saveDB('db:shootdays', shootDaysDB);
  editingCrewId = null;
  renderPositionAssignments();
}
async function clearDayOverride(crewId){
  const day = currentDay(); if(!day) return;
  if(day.crewOverrides) delete day.crewOverrides[crewId];
  await saveDB('db:shootdays', shootDaysDB);
  editingCrewId = null;
  renderPositionAssignments();
}
/* shared ordering for every position list in the call sheet output: department
   (canonical order), then role seniority within that department, then role text,
   then name — role.role is the display text (showAs||role), role.canonicalRole is
   the raw saved role used to look up seniority (showAs is free text and usually
   won't match a saved role, so it can't be used for ranking) */
function positionOutputCompare(a,b){
  return deptRank(a.department)-deptRank(b.department)
    || roleSeniorityRank(deptBucketKey(a.department), a.canonicalRole)-roleSeniorityRank(deptBucketKey(b.department), b.canonicalRole)
    || (a.role||'').localeCompare(b.role||'')
    || (a.name||'').localeCompare(b.name||'');
}
function buildFullData(d){
  const p=projById(d.projectId)||{};
  const primary=locById(d.locationId);
  const addLocs=(d.additionalLocationIds||[]).map(([id,note])=>{const l=locById(id);return l?{name:l.name,address:l.address,note}:null;}).filter(Boolean);
  const allPositions=(d.positions||[]).map(([cid,call])=>{const c=resolveCrewForDay(cid, d);return{role:c.showAs||c.role,canonicalRole:c.role,name:c.name,call,phone:c.phone,department:c.department||'',subDepartment:c.subDepartment||'',coProductionCompany:c.coProductionCompany||''};});
  const crewOnly = allPositions.filter(r=>!r.coProductionCompany);
  // Client and Talent stand apart from the crew departments (Phase N item 3) — pulled
  // out of the canonical-department-order crew list into their own dedicated blocks
  const positions = crewOnly.filter(r=>!['Client','Talent'].includes(deptBucketKey(r.department))).sort(positionOutputCompare);
  const clientPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Client').sort(positionOutputCompare);
  const talentPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Talent').sort(positionOutputCompare);
  const coProBuckets = {};
  allPositions.filter(r=>r.coProductionCompany).forEach(r=>{ (coProBuckets[r.coProductionCompany]=coProBuckets[r.coProductionCompany]||[]).push(r); });
  const coProductionGroups = Object.keys(coProBuckets).sort((a,b)=>a.localeCompare(b))
    .map(company=>({ company, people: coProBuckets[company].sort(positionOutputCompare) }));
  const cams = resolveCameras(d);
  const cameraDesignations = cameraDesignationRows(cams);
  return { prodCompany:p.company||COMPANY, shootTitle:[p.client,p.title].filter(Boolean).join(' — '),
    dayNum:d.dayNum,dayTotal:d.dayTotal,shootDate:d.date,allCrewCall:d.allCrewCall, weather:d.weather||{},
    primary,addLocs,positions,clientPositions,talentPositions,coProductionGroups, hospital:primary?primary.hospital:null, schedule:d.schedule||[], brief:d.brief||[], parking:d.parking||'', notes:d.notes||'',
    // resolved, not raw: a day stores only what DIFFERS from the project defaults
    // (saveShootDay deletes d.techSpecs entirely when nothing differs), so reading
    // d.techSpecs directly exported blank tech specs for every day on the defaults.
    techSpecs:resolveTechSpecs(d), cameraDesignations };
}
/* Only one output shape is in the DOM at a time now (Phase Q), so each of these is
   guarded rather than assumed — the WhatsApp <pre> doesn't exist in printable mode
   and the card doesn't exist in WhatsApp mode. */
function generatePreview(d){
  const data=buildFullData(d);
  renderPreviewCard(data);
  const wa=document.getElementById('waText');
  if(wa) wa.textContent=buildWAText(data);
  renderTechSpecsSection(data);
}
function renderTechSpecsSection(d){
  const el=document.getElementById('techSpecsSection'); if(!el) return;
  const ts=d.techSpecs||{};
  const rows=techSpecRows(ts);
  const cams = d.cameraDesignations||[];
  const headerActions = `<button class="small" onclick="copyTechSpecs()">${icon('copy')} Copy tech specs</button>`;
  if(!rows.length && !cams.length){ el.innerHTML = pvBlockHTML('techspecs', 'Tech specs', headerActions, '<div class="empty-note">No tech specs set for this day yet — add them under Tech, or per-day under Shoot Days.</div>'); return; }
  const body = `<div class="hint" style="margin:0 0 10px;">Camera/technical crew only — not included in the WhatsApp text above.</div>` + techSpecsRoundupBodyHTML(rows, cams);
  el.innerHTML = pvBlockHTML('techspecs', 'Tech specs', headerActions, body);
}
/* text form of a day's tech specs — shared by the Copy button and the WhatsApp
   export's Tech specs section (Phase Q). Takes RESOLVED data (buildFullData output),
   not a raw day, so both callers are looking at the same override-vs-default result. */
function techSpecsLines(data){
  const ts=data.techSpecs||{};
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  const L=[`*TECH SPECS* — ${data.shootTitle||''} ${dayLine}`.trim()];
  techSpecRows(ts).forEach(([k,v])=>L.push(`${k}: ${v}`));
  if(data.cameraDesignations && data.cameraDesignations.length){
    L.push('','*CAMERA DESIGNATIONS*');
    data.cameraDesignations.forEach(cd=>L.push(`Camera ${cd.letter} — ${cd.name}${cd.shorthand?(' ['+cd.shorthand+']'):''} (${cd.tag})`));
  }
  return L;
}
function copyTechSpecsText(){
  const d=currentDay(); if(!d) return '';
  return techSpecsLines(buildFullData(d)).join('\n');
}
function copyTechSpecs(){ return copyText(copyTechSpecsText()); }
/* one Dept/Position/Name/Call/Phone table, shared by Client, Talent and the main
   Position assignments block on the call sheet preview */
function positionsTableHTML(title, people, subtitle){
  if(!people || !people.length) return '';
  return `<h3>${esc(title)}${subtitle?` <span style="color:var(--muted); text-transform:none; font-weight:400;">${subtitle}</span>`:''}</h3><div class="tablewrap"><table><tr><th>Dept</th><th>Position</th><th>Name</th><th>Call</th><th>Phone</th></tr>`+
    people.map(r=>`<tr><td>${esc(DEPARTMENT_CODES[deptBucketKey(r.department)]||'')}</td><td>${esc(r.role)}</td><td>${esc(r.name)}</td><td>${esc(r.call)}</td><td>${esc(r.phone)}</td></tr>`).join('')+`</table></div>`;
}
function renderPreviewCard(d){
  const dayLine=(d.dayNum||d.dayTotal)?`Day ${d.dayNum||'?'}${d.dayTotal?(' of '+d.dayTotal):''}`:'';
  const open = previewBlocks.callsheet;
  const header=`<div class="sd-block-head-toggle" onclick="togglePreviewBlock('callsheet')">
      <span class="dept-caret" id="pvc-callsheet">${open?'▾':'▸'}</span>
      <div>
        <div class="line1">${esc(d.prodCompany)}${d.shootTitle?(' · '+esc(d.shootTitle)):''}</div>
        <div class="sub">${[fmtDate(d.shootDate),dayLine,d.allCrewCall?('All-crew call '+esc(d.allCrewCall)):''].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  let h='';

  /* ---- two-column key-info block at the top ---- */
  let col1='', col2='';
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)) col1+=`<div class="ki-item"><h4>Weather</h4><div>${[w.temp,w.precip,w.cond,w.sun&&('☀ '+w.sun)].filter(Boolean).map(esc).join(' · ')}</div></div>`;
  if(d.primary){
    col1+=`<div class="ki-item"><h4>Primary location</h4><div>${esc(d.primary.name)}<br>${esc(d.primary.address||'')}</div>`;
    if(d.primary.onsiteContactName) col1+=`<div class="hint">Contact: ${esc(d.primary.onsiteContactName)}${d.primary.onsiteContactPhone?(' — '+esc(d.primary.onsiteContactPhone)):''}</div>`;
    col1+=`</div>`;
  }
  if(d.hospital) col1+=`<div class="ki-item"><h4>Nearest hospital</h4><div>${esc(d.hospital.name)}<br>${esc(d.hospital.address||'')} (~${esc(d.hospital.distanceKm)}km)</div></div>`;
  if(d.brief.length) col2+=`<div class="ki-item"><h4>Production brief</h4><ul>${d.brief.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  if(d.parking) col2+=`<div class="ki-item"><h4>Parking / arrival</h4><div>${esc(d.parking).replace(/\n/g,'<br>')}</div></div>`;
  if(d.notes) col2+=`<div class="ki-item"><h4>Production notes</h4><div>${esc(d.notes).replace(/\n/g,'<br>')}</div></div>`;
  if(col1||col2) h+=`<div class="key-info-grid"><div class="ki-col">${col1}</div><div class="ki-col">${col2}</div></div>`;

  if(d.addLocs.length) h+=`<h3>Additional locations</h3><ul>`+d.addLocs.map(l=>`<li>${esc(l.name)} — ${esc(l.address||'')}${l.note?(' ('+esc(l.note)+')'):''}</li>`).join('')+`</ul>`;
  if(d.schedule.length){ h+=`<h3>Schedule</h3><div class="tablewrap"><table><tr><th>Time</th><th>Duration</th><th>Description</th></tr>`+d.schedule.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')+`</table></div>`; }
  // Client stands apart, ahead of the crew list; Talent stands apart, right after it (Phase N item 3)
  h += positionsTableHTML('Client', d.clientPositions);
  h += positionsTableHTML('Position assignments', d.positions);
  h += positionsTableHTML('Talent', d.talentPositions);
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>{
      h += positionsTableHTML(g.company, g.people, '(co-production)');
    });
  }
  const card = document.getElementById('previewCard'); if(!card) return;
  card.innerHTML = header + `<div id="pvb-callsheet" style="display:${open?'':'none'}; margin-top:14px;">${h}</div>`;
}
/* pushes a "*HEADING*" line then one "*Role* — Name" / "Call · phone" pair per
   person — the shared WhatsApp-text block for Client, Position assignments,
   Talent and each co-production group */
function pushPeopleLines(L, heading, people){
  if(!people || !people.length) return;
  L.push('', `*${heading}*`);
  people.forEach(r=>{ L.push(`*${r.role||'Crew'}* — ${r.name||''}`); const bits=[r.call&&('Call '+r.call),r.phone].filter(Boolean).join(' · '); if(bits)L.push(bits); });
}
function buildWAText(d){
  const L=[]; const dayLine=(d.dayNum||d.dayTotal)?`Day ${d.dayNum||'?'}${d.dayTotal?(' of '+d.dayTotal):''}`:'';
  let head=`*${d.prodCompany}*`; if(d.shootTitle) head+=` — ${d.shootTitle}`; L.push(head);
  const meta=[fmtDate(d.shootDate),dayLine].filter(Boolean).join(' · '); if(meta) L.push(`📅 ${meta}`);
  if(d.allCrewCall) L.push(`⏰ All-crew call: *${d.allCrewCall}*`);
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ L.push('','*WEATHER*'); if(w.temp)L.push(`🌡 ${w.temp}`); if(w.precip)L.push(`☔ ${w.precip}`); if(w.cond)L.push(w.cond); if(w.sun)L.push(`🌅/🌇 ${w.sun}`); }
  if(d.primary){ L.push('','*LOCATION*',`📍 ${d.primary.name}`,d.primary.address||''); if(d.primary.onsiteContactName)L.push(`Contact: ${d.primary.onsiteContactName}${d.primary.onsiteContactPhone?(' — '+d.primary.onsiteContactPhone):''}`); if(d.primary.accessInfo)L.push(`Access: ${d.primary.accessInfo}`); if(d.primary.recceInfo)L.push(`Recce: ${d.primary.recceInfo}`); }
  if(d.addLocs.length){ L.push('','*ADDITIONAL LOCATIONS*'); d.addLocs.forEach(l=>L.push(`- ${l.name} — ${l.address||''}${l.note?(' ('+l.note+')'):''}`)); }
  if(d.hospital) L.push('','*NEAREST HOSPITAL*',`${d.hospital.name} — ${d.hospital.address||''} (~${d.hospital.distanceKm}km)`);
  if(d.schedule.length){ L.push('','*SCHEDULE*'); d.schedule.forEach(r=>L.push(`${r[0]}${r[1]?(' ('+r[1]+')'):''} — ${r[2]}`)); }
  pushPeopleLines(L, 'CLIENT', d.clientPositions);
  pushPeopleLines(L, 'POSITIONS', d.positions);
  pushPeopleLines(L, 'TALENT', d.talentPositions);
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>pushPeopleLines(L, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(d.brief.length){ L.push('','*PRODUCTION BRIEF*'); d.brief.forEach(l=>L.push(`- ${l}`)); }
  if(d.parking) L.push('','*PARKING / ARRIVAL*',d.parking);
  if(d.notes) L.push('','*NOTES*',d.notes);
  /* Phase Q — the four optional sections, appended in the same order the printable
     shape stacks them, each gated by its Include checkbox. Tech specs used to be
     hardcoded OUT of this text ("the version for the full crew"); that rule is now
     the Tech specs checkbox instead of a rule nobody could see, so the old crew-wide
     message is one untick away. Hotels/Catering/Travel are project-wide summaries,
     not per-day slices — the same text their Copy buttons produce. */
  if(exportSections.tech){ L.push(''); techSpecsLines(d).forEach(l=>L.push(l)); }
  if(exportSections.hotels){ const h=hotelSummaryLines(); if(h){ L.push('','*HOTELS*'); h.forEach(l=>L.push(l)); } }
  if(exportSections.catering){ const c=cateringOrderLines(); if(c){ L.push('','*CATERING*'); c.forEach(l=>L.push(l)); } }
  if(exportSections.travel){ const t=transportSummaryLines(); if(t){ L.push('','*TRAVEL*'); t.forEach(l=>L.push(l)); } }
  return L.join('\n');
}
/* pushes a heading row, a Dept/Position/Name/Call/Phone header row, and one row per
   person — the shared Excel block for Client, Position assignments, Talent and each
   co-production group */
function pushPeopleRows(aoa, heading, people){
  if(!people || !people.length) return;
  aoa.push([heading]); aoa.push(['Dept','Position','Name','Call','Phone']);
  people.forEach(r=>aoa.push([DEPARTMENT_CODES[deptBucketKey(r.department)]||'',r.role,r.name,r.call,r.phone])); aoa.push([]);
}
function downloadExcel(){
  const d=currentDay(); if(!d) return;
  const data=buildFullData(d); const aoa=[];
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  aoa.push([data.prodCompany,data.shootTitle]); aoa.push([fmtDate(data.shootDate),dayLine,data.allCrewCall?('All-crew call: '+data.allCrewCall):'']); aoa.push([]);
  const w=data.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ aoa.push(['WEATHER']); aoa.push(['Temp',w.temp,'Precip',w.precip,'Condition',w.cond,'Sunrise/Sunset',w.sun]); aoa.push([]); }
  if(data.primary){ aoa.push(['PRIMARY LOCATION']); aoa.push([data.primary.name,data.primary.address]); if(data.primary.onsiteContactName)aoa.push(['On-site contact',data.primary.onsiteContactName,data.primary.onsiteContactPhone||'']); if(data.primary.accessInfo)aoa.push(['Access',data.primary.accessInfo]); if(data.primary.recceInfo)aoa.push(['Recce',data.primary.recceInfo]); aoa.push([]); }
  if(data.addLocs.length){ aoa.push(['ADDITIONAL LOCATIONS']); aoa.push(['Name','Address','Note']); data.addLocs.forEach(l=>aoa.push([l.name,l.address,l.note])); aoa.push([]); }
  if(data.hospital){ aoa.push(['NEAREST HOSPITAL']); aoa.push([data.hospital.name,data.hospital.address,data.hospital.distanceKm+'km']); aoa.push([]); }
  if(data.schedule.length){ aoa.push(['SCHEDULE']); aoa.push(['Time','Duration','Description']); data.schedule.forEach(r=>aoa.push(r)); aoa.push([]); }
  pushPeopleRows(aoa, 'CLIENT', data.clientPositions);
  pushPeopleRows(aoa, 'POSITION ASSIGNMENTS', data.positions);
  pushPeopleRows(aoa, 'TALENT', data.talentPositions);
  if(data.coProductionGroups && data.coProductionGroups.length){
    data.coProductionGroups.forEach(g=>pushPeopleRows(aoa, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(data.brief.length){ aoa.push(['PRODUCTION BRIEF']); data.brief.forEach(l=>aoa.push([l])); aoa.push([]); }
  if(data.parking){ aoa.push(['PARKING / ARRIVAL']); aoa.push([data.parking]); aoa.push([]); }
  if(data.notes){ aoa.push(['PRODUCTION NOTES']); aoa.push([data.notes]); }
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:24},{wch:24},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Call Sheet');
  /* Phase Q — one sheet per ticked section, same four checkboxes that gate the
     printable blocks and the WhatsApp text. A section with no data at all still
     produces no sheet, ticked or not: an empty tab is worse than a missing one. */
  const addSheet=(name, sheetAoa, cols)=>{
    const s=XLSX.utils.aoa_to_sheet(sheetAoa);
    if(cols) s['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,s,name);
  };
  if(exportSections.tech){
    const tsRows=techSpecRows(data.techSpecs||{});
    const tsAoa=[['TECH SPECS — camera/technical crew reference'],[],...tsRows];
    if(data.cameraDesignations && data.cameraDesignations.length){
      tsAoa.push([]); tsAoa.push(['CAMERA DESIGNATIONS']); tsAoa.push(['Camera','Name','Shorthand','File tag']);
      data.cameraDesignations.forEach(cd=>tsAoa.push([cd.letter, cd.name, cd.shorthand||'', cd.tag]));
    }
    addSheet('Tech Specs', tsAoa, [{wch:20},{wch:30}]);
  }
  if(exportSections.hotels){
    const hotel=buildHotelSummary();
    if(hotel){
      const hAoa=[['HOTEL BOOKING', hotel.summary],[],['ROOM-BOOKING TABLE'],['Room No.','Name','Date from','Date to','Total nights']];
      hotel.roomBooking.forEach(r=>hAoa.push([r.roomNo, r.name, r.from, r.to, r.totalNights]));
      hAoa.push([]); hAoa.push(['PER-NIGHT TABLE']); hAoa.push(['Night','Rooms','Names']);
      hotel.perNight.forEach(n=>hAoa.push([n.label, n.rooms, n.names.join(', ')]));
      addSheet('Hotel', hAoa, [{wch:10},{wch:24},{wch:16},{wch:16},{wch:40}]);
    }
  }
  if(exportSections.catering){
    const catering=buildCateringExport();
    if(catering){
      const cAoa=[['CATERING ORDER'],[]];
      catering.forEach(day=>{
        cAoa.push([day.label]); cAoa.push(['Meal','Count']);
        if(day.bCount) cAoa.push(['Breakfast', day.bCount]);
        if(day.lCount) cAoa.push(['Lunch', day.lCount]);
        if(day.dCount) cAoa.push(['Dinner', day.dCount]);
        if(day.dietaryNotes.length){
          cAoa.push(['Dietary requirements']); cAoa.push(['Name','Type','Specific']);
          day.dietaryNotes.forEach(n=>cAoa.push([n.name, n.general, n.specific]));
        }
        cAoa.push([]);
      });
      addSheet('Catering', cAoa, [{wch:24},{wch:18},{wch:32}]);
    }
  }
  if(exportSections.travel){
    const travel=buildTransportSummary();
    if(travel){
      const tAoa=[['TRANSPORT SUMMARY'],[], ['Method', ...travel.cols.map(c=>c.label)]];
      travel.usedMethods.forEach(m=>tAoa.push([m, ...travel.cols.map(c=>c.counts[m])]));
      tAoa.push(['Daily cost', ...travel.cols.map(c=>Number((c.dailyCost||0).toFixed(2)))]);
      tAoa.push([]); tAoa.push(['Total transport cost', Number((travel.totalCost||0).toFixed(2))]);
      addSheet('Travel', tAoa, [{wch:24}]);
    }
  }
  XLSX.writeFile(wb,`callsheet-${data.shootDate||'draft'}${data.dayNum?('-day'+data.dayNum):''}.xlsx`);
}
</script>
