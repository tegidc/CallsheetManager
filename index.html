       the one thing in these rows that must NOT shrink — it is the tap target for
       the pencil, the trash and the calendar. Everything that was overshooting it is
       brought back to 34px, which is still a comfortable touch height for a field.
       Rows still grow past 40px for genuine content (a prep counter, a wrapped role
       chip) exactly as Phase BO's follow-up decided — this is a floor, not a cap. */
    .pb-head, .pb-role-row{min-height:40px;}
    /* the three that were overshooting. All written to out-specify a type-or-
       attribute selector (input[type=text] / button.small), not just a bare class. */
    .roles-grid-showas input[type=text]{min-height:34px; padding:6px 7px;}
    .crewgrid select, .prep-grid select, .roles-grid select{min-height:34px; padding:6px 20px 6px 8px;}
    button.small.all-toggle-btn{min-height:0; padding:0 4px;}

    /* --- position assignment rows --- */
    .posn-dept-badge{justify-self:start; padding:5px 10px;}
    .posn-row .posn-call{max-width:none;}

    /* --- crew identity pills wrap instead of squashing --- */
    .crew-ident-pills{gap:5px;}
    select.pill-select{max-width:100%;}

    /* --- preview tables scroll instead of squashing --- */
    .card table{font-size:13px;}
    .key-info-grid{grid-template-columns:1fr; gap:14px;}
    pre#waText{font-size:13px; max-height:340px;}
    .mapembed{height:200px;}

    /* --- misc readability --- */
    .formgroup{padding:13px 11px;}
    .hint{font-size:13px;}
    .empty-note{font-size:14px;}
    .private-note{font-size:12.5px; padding:9px 11px;}
    .srlist{max-height:250px;}
    .sritem{padding:12px 11px; font-size:14px;}
    .subhead{font-size:12px;}
    .budget-vat-toggle{margin-left:0; width:100%;}

    /* --- sticky save bar on the shoot-day editor --- */
    .toolbar.sticky-actions{
      position:sticky; bottom:0; z-index:30; margin:16px -13px 0;
      padding:11px 13px calc(11px + env(safe-area-inset-bottom));
      background:var(--bg); border-top:1px solid var(--line);
      box-shadow:0 -4px 16px rgba(17,10,8,.08);
    }
  }

  @media(max-width:420px){
    .page-head h1{font-size:20px;}
    .card .line1{font-size:19px;}
    .main{padding:12px 11px 96px;}
    .section{padding:13px 11px;}
  }
</style>
</head>

<!-- Supabase: loaded as a classic (non-module) script so it runs synchronously in document
     order, before the app script below touches it. This is Supabase's own documented
     "vanilla JS, no build step" pattern — no npm install needed. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* single client instance, reused by every loadDB/saveDB call */
const sb = supabase.createClient(
  'https://ioueoaasqnseuhrtzhbz.supabase.co',
  'sb_publishable_roKbOQwNFveMHtT0OeJk5A_R1jvrKdr'
);
</script>

<script>
/* ============================================================ STATE + STORAGE */
const COMPANY = 'Little Film Productions';

/* ============================================================ APP SETTINGS (Phase Q)
   Font + brand colour for the call sheet output and the app chrome, persisted to
   'db:settings' like every other collection. Deliberately NOT multi-tenant: the
   company is still the hardcoded COMPANY above, and there is no logo/company-detail
   upload — that's parked until the app opens up beyond Little Film Productions.

   Everything here works by writing the SAME CSS custom properties the stylesheet
   already declares in :root (--disp, --tape, --tape-light, --tint-1..6) onto
   documentElement, so no rule needs to know settings exist. That is also why the two
   former hand-written rgba(1,119,86,…) one-offs became --tint-5/--tint-6: a token
   that isn't a token can't follow the brand colour. */
const FONT_CHOICES = {
  fraunces:  { label:'Fraunces (default — stands in for Moret)', stack:"'Fraunces', Georgia, serif" },
  oswald:    { label:'Oswald (the real brand font)',             stack:"'Oswald', sans-serif" },
  jost:      { label:'Jost (stands in for Futura PT)',           stack:"'Jost', 'Futura PT', sans-serif" },
  georgia:   { label:'Georgia (system serif)',                   stack:"Georgia, 'Times New Roman', serif" },
  helvetica: { label:'Helvetica / Arial (system sans)',          stack:"'Helvetica Neue', Helvetica, Arial, sans-serif" },
};
/* Only families already in the Google Fonts request on line 8 (plus two system stacks)
   are offered — adding a family here means adding it to that <link> too, or it renders
   as the fallback and nobody notices.
   R15: this pool now feeds all THREE font roles, not just headings — hence the rename
   from HEADER_FONTS. The three roles are the same three the design system has always
   had (Fraunces display / Oswald label / Jost body); settings just makes each one
   choosable instead of only the first. `headerFont` keeps its original key so
   settings saved before R15 still load. */
const SETTINGS_DEFAULTS = { headerFont:'fraunces', labelFont:'oswald', bodyFont:'jost',
                            brand:'#017756', brandLight:'#0FA47A' };
let appSettings = Object.assign({}, SETTINGS_DEFAULTS);

function hexToRgbTriple(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return null;
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].join(',');
}
/* the six tint levels, all derived from one brand colour */
const TINT_ALPHAS = [.03, .05, .10, .14, .35, .28];
function applyAppSettings(){
  const root = document.documentElement.style;
  // Same mechanism as before, three times: write the token the stylesheet already
  // declares, so no CSS rule needs to know settings exist.
  const stackFor = (key, fallback) => (FONT_CHOICES[appSettings[key]] || FONT_CHOICES[fallback]).stack;
  root.setProperty('--disp',  stackFor('headerFont','fraunces'));
  root.setProperty('--label', stackFor('labelFont','oswald'));
  root.setProperty('--body',  stackFor('bodyFont','jost'));
  const brand = appSettings.brand || SETTINGS_DEFAULTS.brand;
  const light = appSettings.brandLight || SETTINGS_DEFAULTS.brandLight;
  root.setProperty('--tape', brand);
  root.setProperty('--tape-light', light);
  const triple = hexToRgbTriple(brand);
  if(triple) TINT_ALPHAS.forEach((a,i)=>root.setProperty('--tint-'+(i+1), `rgba(${triple},${a})`));
}
async function saveAppSettings(){ await saveDB('db:settings', appSettings); }
async function setSetting(field, value){
  appSettings[field] = value;
  applyAppSettings();
  await saveAppSettings();
}
async function resetAppSettings(){
  appSettings = Object.assign({}, SETTINGS_DEFAULTS);
  applyAppSettings();
  await saveAppSettings();
  renderMain();
}
const DEPARTMENTS = ['Production','Client','Talent','Cinematography','Audio','Grip','Equipment','Set','Vanities','Catering & Travel','Post Production','Other'];
const DEPARTMENT_CODES = {
  'Production':'PROD', 'Client':'CLIENT', 'Talent':'TALENT', 'Cinematography':'CIN', 'Audio':'AUD',
  'Grip':'GRIP', 'Equipment':'EQUIP', 'Set':'SET', 'Vanities':'HMUC', 'Catering & Travel':'CAT/TRA',
  'Post Production':'POST', 'Other':'—'
};
/* common sub-departments — free text on the crew record, these are just suggestions */
/* sub-departments mapped to their parent department (extensible at runtime, persisted to db:subdepartments) */
let SUBDEPARTMENTS_BY_DEPT = {
  'Production':      ['Runner','Marshall','Support'],
  'Cinematography':  ['1st AC','2nd AC','Loader'],
  'Audio':           ['Boom Op'],
  'Grip':            ['Best Boy'],
  'Post Production': ['Colourist'],
};
/* canonical roles a person can be booked as, grouped per department (extensible at
   runtime, persisted to db:roles) — a crew member can hold several of these at once
   (c.roles, folder-path strings like "Cinematography/DOP"); c.role stays the single
   free-text title shown everywhere on the call sheet, and picking a saved role just
   sets it quickly instead of retyping. */
let ROLES_BY_DEPT = {
  'Production':        ['Director','Executive Producer','Line Producer','Field Producer','Producer','Production Manager','Production Coordinator','PA','Runner'],
  'Talent':            ['Presenter','Host','Guest','Contributor','Cast'],
  'Cinematography':    ['DOP','1st AC','2nd AC','Camera Operator','Loader','Focus Puller'],
  'Audio':             ['Sound Mixer','Sound Recordist','Boom Operator'],
  'Grip':              ['Gaffer','Best Boy','Grip','Rigger'],
  'Equipment':         ['Equipment Manager','Kit Tech'],
  'Set':               ['Set Designer','Art Director','Props'],
  'Vanities':          ['HMUA','Hair Stylist','Costume/Wardrobe'],
  'Catering & Travel': ['Chef','Caterer','Driver','Travel Coordinator'],
  'Post Production':   ['Editor','Colourist','DIT','Assistant Editor'],
};
function rolesFor(dept){ return ROLES_BY_DEPT[dept] || []; }
/* per-role seniority rank within a department (e.g. DOP outranks 1st AC outranks
   Camera Operator), used to order Position Assignments and the call sheet output
   within a department — extensible at runtime, persisted to db:roleseniority.
   Keyed by "Department/Role" path. Falls back to the role's position in
   ROLES_BY_DEPT[dept] (so freshly-added canonical roles sort sensibly with no
   admin action needed), then Infinity for a role not found at all. */
let ROLE_SENIORITY = {};
function roleSeniorityRank(dept, role){
  if(!role) return Infinity;
  const key = dept+'/'+role;
  if(ROLE_SENIORITY[key]!=null) return ROLE_SENIORITY[key];
  const i = (ROLES_BY_DEPT[dept]||[]).indexOf(role);
  return i===-1 ? Infinity : i*10;
}
/* move a role up/down in its department's seniority order (dir -1 = more senior,
   +1 = less senior), then renumber every role in that department sequentially so
   ranks stay dense and comparable */
async function moveRoleSeniority(dept, role, dir){
  const roles = (ROLES_BY_DEPT[dept]||[]).slice().sort((a,b)=>roleSeniorityRank(dept,a)-roleSeniorityRank(dept,b));
  const i = roles.indexOf(role), j = i+dir;
  if(i===-1 || j<0 || j>=roles.length) return;
  [roles[i],roles[j]] = [roles[j],roles[i]];
  roles.forEach((r,idx)=>{ ROLE_SENIORITY[dept+'/'+r] = idx*10; });
  await saveDB('db:roleseniority', ROLE_SENIORITY);
  refreshCrewDatabase();
}
/* department for a "Department/Role" saved-role path — the single source of
   truth for a person's department once they have a saved role (see setActiveRole) */
function departmentForRolePath(rolePath){ const i = rolePath.indexOf('/'); return i>=0 ? rolePath.slice(0,i) : ''; }
/* single source of truth for department order — used for grouping crew lists AND ordering the final call sheet */
function deptBucketKey(dept){ return DEPARTMENTS.includes(dept) ? dept : 'Other'; }
/* ---- one canonical collapsible group header ----
   The project Crew tab and the crew database rendered this markup independently;
   sharing it means the caret, code, label and count can't drift apart. `code` is
   optional — the project Crew tab can group by hotel rather than department, and
   those groups have no department code to show. */
/* Phase BR — the three leading header cells: blank Controls | NAME | ROLE.
   Phase BO made Controls/Name/Role the same three columns on every Crew sub-tab; this
   makes them carry the same two labels too. Before it, Roles was the only tab that named
   them and the other five rendered a single blank `.crewgrid-corner` spanning all three,
   so the same column was headed on one tab and anonymous on the next.
   ⚠️ The `cellClass` argument is the OWNING GRID's own header-cell class
   (`roles-grid-header` / `crewgrid-header` / `prep-grid-header`) — those differ only in
   default text-align, and `.pb-head-name`/`.pb-head-role` re-left-align the centred one.
   ⚠️ `.pb-head-blank`/`.pb-head-name` are also the mobile pin hooks (they sit at the same
   left offsets as `.crewgrid-controls`/`.crewgrid-row-name`), so a header row built any
   other way will scroll out of step with its own rows. */
function pbHeadLeadCellsHTML(cellClass){
  return `<div class="${cellClass} pb-head-blank"></div>
    <div class="${cellClass} pb-head-name">Name</div>
    <div class="${cellClass} pb-head-role">Role</div>`;
}
function deptHeaderHTML(label, count, collapsed, onclickJS, code){
  const c = code===undefined ? (DEPARTMENT_CODES[label]||'') : code;
  return `<div class="subhead dept-toggle" onclick="${onclickJS}">
      <span class="dept-caret">${collapsed?'▸':'▾'}</span> ${c?`<span class="dept-code">${esc(c)}</span> `:''}${esc(label)} <span class="dept-count">(${count})</span>

/* ============================================================ CREW ENTRIES (Phase BF)
   THE SCHEMA, in one place. A project's roster is a list of ENTRIES, not of people:

     p.crewEntries = [{ id, crewId, role, department, subDepartment, rate? }, …]

   `id` is the entry's own id; `crewId` points back at the shared crew record. One
   person can hold several entries on one project (Meurig as AC *and* as operator),
   each carrying its own role and its own rate. That is Option 2 of the three compared
   on 9 Aug; Option 3 (composite crewId+role) was rejected precisely because it breaks
   when someone holds the SAME role twice at different rates — so nothing here may
   assume (crewId, role) is unique.

   ⚠️ THE SCOPE RULE — what is keyed to an entry and what is keyed to a person:
     PER ENTRY  — role, rate, days on site.  d.positions[i][0] is an ENTRY id.
                  d.crewOverrides is keyed by ENTRY id.
     PER PERSON — hotel, travel, catering.   p.travelMethods, p.hotelNightBefore,
                  d.hotelNights and d.cateringMeals stay keyed by CREW id, untouched.
                  Two roles is still one bed and one lunch.
   Days on site for the person-level tabs is the UNION of that person's entries' days,
   DEDUPLICATED — see crewDayCount(). Getting that wrong is the Phase AO double-count:
   a builder that asks "does anyone hold a position that day" answers twice for a
   person with two entries covering it.

   Replaces p.crewIds (a flat array of crew ids) and p.crewRateOverrides (a per-project
   crewId→rate map); both are removed by migrateCrewEntries() below. */
const projectEntries = (p) => ((p||currentProject()||{}).crewEntries||[]);
const entryById = (entryId, p) => projectEntries(p).find(e=>e.id===entryId) || null;
/* every entry a given person holds on a project, in roster order */
const entriesForCrew = (crewId, p) => projectEntries(p).filter(e=>e.crewId===crewId);
/* ---- the view objects every screen actually renders from ----
   entryView() is the reason this migration is not a rewrite: it hands back the crew
   record with the ENTRY's id/role/department layered on top, so every existing sort,
   group, filter and identity helper that reads `.id` / `.name` / `.role` /
   `.department` keeps working unchanged — it just gets an entry-shaped object instead
   of a person-shaped one. `.crewId` is what marks it as an entry view; anything that
   needs the real person (the crew form, hotel/travel/catering) reads that. */
function entryView(e){
  const c = crewById(e.crewId);
  if(!c) return null;
  return Object.assign({}, c, {
    id: e.id, crewId: e.crewId, role: e.role||'',
    department: e.department||'', subDepartment: e.subDepartment||''
  });
}
const projectEntryViews = (p) => projectEntries(p).map(entryView).filter(Boolean);
/* DISTINCT people on a project, in roster order — for the person-level tabs (hotel,
   travel, catering) and anywhere "how many humans" is the question. `.id` is the CREW
   id here, deliberately: those tabs' toggles are all keyed by crewId. Role/department
   come from the person's FIRST entry so the row reads the same as the Roles tab
   rather than falling back to their crew-database default. */
function projectCrew(p){
  const seen = new Set(), out = [];
  projectEntries(p).forEach(e=>{
    if(seen.has(e.crewId)) return;
    seen.add(e.crewId);
    const c = crewById(e.crewId); if(!c) return;
    out.push(Object.assign({}, c, {
      id: c.id, role: e.role||'', department: e.department||'', subDepartment: e.subDepartment||''
    }));
  });
  return out;
}
/* ---- days on site ----
   entryDayCount: days THIS entry holds a position on.
   crewDayCount:  days ANY of this person's entries holds a position on, deduplicated.
   ⚠️ Use the second for anything person-level (travel, hotel, headcounts). Using the
   first, or counting positions directly, double-counts a person with two entries on
   one day — the exact shape Phase AO flagged in buildTransportSummary(). */
const entryOnDay = (entryId, d) => (d.positions||[]).some(pos=>pos[0]===entryId);
const entryDayCount = (entryId, days) => (days||[]).filter(d=>entryOnDay(entryId, d)).length;
function crewOnDay(crewId, d, p){
  const ids = new Set(entriesForCrew(crewId, p).map(e=>e.id));
  return (d.positions||[]).some(pos=>ids.has(pos[0]));
}
const crewDayCount = (crewId, days, p) => (days||[]).filter(d=>crewOnDay(crewId, d, p)).length;
/* the one place an entry is created — every "put this person on this project" path
   (the Crew tab picker, AI Scan's matched-accept, Overview Quick add, and saveCrew()'s
   brand-new-person-inside-a-project branch) goes through here, so a new entry can't
   drift into three slightly different shapes. Role/department seed from the person's
   crew-database record, which is exactly what the roster showed before BF. Returns the
   new entry, or (when `force` is falsy — every existing caller) the existing one when
   this is a re-add of someone already on the project: pre-BF behaviour, adding twice was
   a no-op. Phase BA's "Add again as" is the one deliberate exception: it passes
   force=true to skip that dedup and get a genuinely second entry, carrying its own role
   (set right after by setEntryRole()) and its own independently-resolvable rate. */
function addCrewEntry(p, crewId, force){
  if(!p || !crewId) return null;
  p.crewEntries = p.crewEntries || [];
  if(!force){
    const already = p.crewEntries.find(e=>e.crewId===crewId);
    if(already) return already;
  }
  const c = crewById(crewId);
  const e = { id: uid(), crewId,
    role: (c&&c.role)||'', department: (c&&c.department)||'', subDepartment: (c&&c.subDepartment)||'' };
  p.crewEntries.push(e);

/* remove entries and everything keyed to THEM — the entry-id equivalent of what
   removeCrewFromProject()/bulkRemoveSelectedFromProject() have always cleared, which is
   the roster slot and the shoot-day positions.
   ⚠️ Person-level data (travel method, hotel nights, catering meals) is deliberately
   NOT cleared here, because it never was before BF. Removing someone from a project has
   always left those behind; changing that would be a behaviour change, and this phase
   has none. It also happens to be the right shape for the entry model — two roles is
   one bed, so dropping one entry must not cancel a booking the other still needs. */
function removeCrewEntries(p, entryIds){
  if(!p) return;
  const kill = new Set(entryIds);
  p.crewEntries = (p.crewEntries||[]).filter(e=>!kill.has(e.id));
  shootDaysDB.forEach(d=>{
    if(d.projectId!==p.id) return;
    if(d.positions) d.positions = d.positions.filter(pos=>!kill.has(pos[0]));
    if(d.crewOverrides) kill.forEach(id=>{ delete d.crewOverrides[id]; });
  });
  // Phase BD — p.prepSchedule is a PARALLEL structure keyed by entry id, so unlike
  // entry.rate it does not disappear when the entry does. Prune it here, at the one
  // place both the single (removeCrewFromProject) and bulk
  // (bulkRemoveSelectedFromProject) removals already meet. deleteCrew() does NOT come
  // through here — it prunes for itself, see its own note.
  prunePrepSchedule(p, kill);
}
/* ---- the migration ----
   Runs once from initApp(), before the first render, and is IDEMPOTENT: a project that
   already carries crewEntries is skipped, so re-running it (a reload, a second tab) can
   never re-migrate or duplicate. It writes its backup keys BEFORE any migration write,
   and only when there is actually something to migrate — a no-op load writes nothing at
   all. Returns a short report for the console.

   One entry per (project, person), carrying that person's role/department at migration
   time and their existing per-project rate override, so a person with one role is
   indistinguishable from how they looked before this ran. Positions and per-day crew
   overrides are rekeyed crewId→entryId in the same pass. Hotel, travel and catering are
   deliberately NOT touched. */
async function migrateCrewEntries(){
  const stale = projectsDB.filter(p=>!Array.isArray(p.crewEntries));
  if(!stale.length) return null;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const prefix = `backup_pre_BF_${stamp}`;
  // Backup first, always — three collections, because positions and crewOverrides move
  // too. If any backup write fails, stop: no migration write happens.
  for(const [key, val] of [['db:projects', projectsDB], ['db:shootdays', shootDaysDB], ['db:crew', crewDB]]){
    const res = await saveDB(`${prefix}:${key}`, val);
    if(res && res.ok===false){ console.error('[BF] backup failed, migration aborted:', key, res); return {aborted:key}; }
  }
  const report = { backupPrefix:prefix, projects:0, entries:0, positions:0, overrides:0, rates:0, orphanPositions:0 };
  stale.forEach(p=>{
    const map = {};   // crewId -> entryId, for rekeying this project's days
    p.crewEntries = (p.crewIds||[]).map(crewId=>{
      const c = crewById(crewId);
      const e = { id: uid(), crewId,
        role: (c&&c.role)||'', department: (c&&c.department)||'', subDepartment: (c&&c.subDepartment)||'' };
      const ov = (p.crewRateOverrides||{})[crewId];
      if(ov!==undefined && ov!==null && !isNaN(Number(ov))){ e.rate = Number(ov); report.rates++; }
      map[crewId] = e.id;
      return e;
    });
    report.projects++; report.entries += p.crewEntries.length;
    shootDaysDB.filter(d=>d.projectId===p.id).forEach(d=>{
      if(Array.isArray(d.positions)){
        // An unmappable position has no entry to point at. Drop it rather than leave a
        // dangling id — it was already invisible (the roster is what every screen
        // renders from), and the count is reported rather than swallowed.
        const before = d.positions.length;
        d.positions = d.positions.map(pos=>{
          const eid = map[pos[0]];
          return eid ? [eid, ...pos.slice(1)] : null;
        }).filter(Boolean);
        report.positions += d.positions.length;
        report.orphanPositions += before - d.positions.length;
      }
      if(d.crewOverrides && Object.keys(d.crewOverrides).length){
        const next = {};
        Object.keys(d.crewOverrides).forEach(crewId=>{
          const eid = map[crewId];
          if(eid){ next[eid] = d.crewOverrides[crewId]; report.overrides++; }
        });
        d.crewOverrides = next;
      }
    });
    delete p.crewIds;
    delete p.crewRateOverrides;
  });
  await saveDB('db:projects', projectsDB);
  await saveDB('db:shootdays', shootDaysDB);
  console.info('[BF] crew entries migration:', report);
  return report;
}

/* G11 — the honest version of the above: hand it saveDB()'s result rather than
   flashing "Saved" unconditionally. On failure it does NOT fade after two seconds,
   because the thing it is reporting hasn't gone away; the detail and the retry
   live in the banner saveDB raises, so this only has to stop lying. */
function flashSaveResult(elId, res, okText){
  const st = document.getElementById(elId); if(!st) return;
  if(res && res.ok){ flashStatus(elId, okText); return; }

/* one clipboard path for every Copy button — async API with a textarea fallback
   for browsers/contexts that block it. Pass a message to confirm, or omit to copy
   silently (used where the button itself is feedback enough). */
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }
    catch(e2){ alert('Copy failed — select the text and copy manually.'); document.body.removeChild(ta); return; }
    document.body.removeChild(ta);
  }
  if(okMsg) alert(okMsg);
}

/* Every read/write in the app already goes through these two functions, keyed by a
   string like 'db:crew'. Swapping the backend here is the only change needed —
   every .find/.filter/.push elsewhere in the file operates on the in-memory arrays
   these return, exactly as before. */
/* ---- R18: two tabs must not silently overwrite each other -------------------
   Every save writes a WHOLE collection back (that's the app's shape — mutate the
   in-memory array, then saveDB the array). With a plain upsert that means the
   second tab to save wins outright: add a crew member in one tab while renaming a
   project in the other, and one of those edits is gone with no error and no trace.
   This needed no accounts and no second person — two tabs was enough.

   The fix is a guarded write plus a three-way merge, which works precisely BECAUSE
   every record carries a stable `id`:
     · dbStamp[key] — the row's updated_at as we last saw it.
     · dbBase[key]  — a snapshot of the collection as it was at that moment.
   The write is conditional on updated_at still matching. If it doesn't, somebody
   else wrote in between, so rather than clobbering them we fetch their version and
   merge base/ours/theirs per record: whichever side actually CHANGED a record wins,
   additions from both sides are kept, and a deletion is only honoured against the
   side that still matches base. Then we retry the guarded write.
   Nothing outside these two functions changed — saveDB(key, value) is called the
   same way from ~80 places and still returns a promise. -------------------- */
/* G13 — this list is the app's statement of "which collections are object-shaped
   rather than arrays of records". It governs exactly ONE thing: the empty value
   loadDB() falls back to when the row is missing or the read errors ({} vs []).
   It does NOT gate merging — mergeDB() branches on the runtime shape of the values
   it is handed, and applyMergedDB() switches on the key by name — so db:roles has
   always been merged correctly despite being absent here. What its absence actually
   caused: a missing/errored db:roles read returned [] instead of {}. Three separate
   guards happened to absorb that (initApp()'s !Array.isArray(savedRoles) check,
   mergeDB()'s tolerance of an array as base, and the fact that a null stamp routes
   to a plain upsert rather than the merge path), so no data was lost — but it was
   harmless by luck in the one function that IS the storage contract. */
const DB_OBJECT_KEYS = ['db:subdepartments','db:roleseniority','db:settings','db:roles'];
const isObjDB = key => DB_OBJECT_KEYS.includes(key);
let dbStamp = {};   // key -> updated_at last seen
let dbBase  = {};   // key -> deep snapshot matching that stamp
const dbClone = v => JSON.parse(JSON.stringify(v ?? null));

async function loadDB(key){
  const empty = () => isObjDB(key) ? {} : [];
  try{
    const { data, error } = await sb.from('app_data').select('value, updated_at').eq('key', key).maybeSingle();
    if(error){ console.error('Supabase load failed ('+key+'):', error.message); return empty(); }
    if(!data){ dbStamp[key] = null; dbBase[key] = empty(); return empty(); }
    dbStamp[key] = data.updated_at;
    dbBase[key]  = dbClone(data.value);
    return data.value;
  }catch(e){ console.error('Supabase load exception ('+key+'):', e); return empty(); }
}

/* Three-way merge of one collection. Arrays of {id:…} records merge per record;
   plain objects (settings, sub-departments, role seniority) merge per key. Arrays
   of bare strings (travel methods, co-pro companies) have no identity to merge on,
   so ours simply wins — they're short config lists, not records. */
function mergeDB(base, mine, theirs){
  const same = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  if(Array.isArray(mine) && Array.isArray(theirs)){
    const keyed = a => Array.isArray(a) && a.every(r => r && typeof r==='object' && r.id);
    if(!keyed(mine) || !keyed(theirs) || !keyed(base||[])) return mine;
    const B = new Map((base||[]).map(r=>[r.id,r]));
    const M = new Map(mine.map(r=>[r.id,r]));
    const T = new Map(theirs.map(r=>[r.id,r]));
    const out = [];
    // their order first (so records added elsewhere keep a stable home), then ours
    const ids = [...new Set([...theirs.map(r=>r.id), ...mine.map(r=>r.id)])];
    ids.forEach(id=>{
      const b = B.get(id), m = M.get(id), t = T.get(id);
      if(m && t)  { out.push(same(m,b) ? t : m); return; }           // both have it: the side that changed wins, ours on a tie
      if(m && !t) { if(!b) out.push(m); return; }                    // only ours: new here = keep, else they deleted it
      if(!m && t) { if(!b) out.push(t); return; }                    // only theirs: new there = keep, else we deleted it
    });
    return out;
  }
  if(mine && theirs && typeof mine==='object' && typeof theirs==='object'){
    const out = {...theirs};
    Object.keys(mine).forEach(k=>{
      if(!same(mine[k], (base||{})[k]) || !(k in theirs)) out[k] = mine[k];   // we changed it, or it's new here
    });
    Object.keys(base||{}).forEach(k=>{ if(!(k in mine) && same((base||{})[k], theirs[k])) delete out[k]; });
    return out;
  }
  return mine;
}

/* ---- G11: a save that failed must never say "Saved" -------------------------
   Every failure path in here used to be console.error(…) followed by a bare
   `return`, so saveDB() returned undefined on failure exactly as it did on
   success, and the callers flashed "Saved" either way. Offline, mid-flight, or
   after three genuine conflicts, the edit had not landed and the UI confirmed it
   had. R18 stopped two tabs overwriting each other; it did not make failure
   visible. This does.

   saveDB() now returns {ok:true} or {ok:false, kind, detail}. The ~80 call sites
   that ignore the return keep working unchanged — the honesty they get is the
   banner, which saveDB raises itself so that no call site has to remember to.

   TWO kinds, deliberately not one, because they mean opposite things:
     'unsaved'   — the write never landed (network down, Supabase error, failed
                   re-read). NOTHING IS LOST: the edit is still in the live
                   in-memory collection, and because every save writes the whole
                   collection, the next successful save of that same collection
                   carries it. The honest words are "not saved yet".
     'discarded' — three guarded writes in a row lost their guard, so this change
                   was merged-and-abandoned rather than stored. The merged state
                   exists only in this tab; reload and it is gone. The honest
                   words are "your change was not saved", and it gets a red,
                   persistent banner rather than a 2-second flash.
   Conflating those two is most of the harm in this finding, so they get different
   words, different colours and a different register.

   ⚠️ The eleven grid interactions that `await saveDB()` before rendering are NOT
   touched here — that's G14, and it is only safe once this exists. --------- */
async function saveDB(key, value){
  const stamp = () => new Date().toISOString();
  // `value` is reassigned by the merge below, so this deliberately reads it at
  // call time: a retry should push the merged value, not the pre-merge one.
  const fail = (kind, detail) => { reportSaveFailure(key, kind, detail, value); return {ok:false, kind, detail}; };
  const ok   = () => { clearSaveFailure(key); return {ok:true}; };
  try{
    for(let attempt=0; attempt<3; attempt++){
      const now = stamp();
      // No row yet (or we've never read one): plain upsert, nothing to conflict with.
      if(dbStamp[key] == null){
        const { data, error } = await sb.from('app_data')
          .upsert({ key, value, updated_at:now }).select('updated_at');
        if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
        // store the stamp AS POSTGRES RETURNS IT, not the JS string we sent: the two
        // differ textually ('…123Z' vs '…123000+00:00') and only compare equal because
        // postgres casts them. Round-tripping the canonical value removes that reliance.
        dbStamp[key] = (data && data[0] && data[0].updated_at) || now;
        dbBase[key] = dbClone(value); return ok();
      }
      // Guarded write — only lands if nobody else has written since we last looked.
      const { data, error } = await sb.from('app_data')
        .update({ value, updated_at:now }).eq('key', key).eq('updated_at', dbStamp[key]).select('updated_at');
      if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
      if(data && data.length){ dbStamp[key] = data[0].updated_at || now; dbBase[key] = dbClone(value); return ok(); }

      // Guard failed: somebody wrote in between. Take their version, merge, retry.
      const { data: fresh, error: reErr } = await sb.from('app_data')
        .select('value, updated_at').eq('key', key).maybeSingle();
      if(reErr || !fresh){
        console.error('Supabase merge re-read failed ('+key+')', reErr && reErr.message);
        return fail('unsaved', (reErr && reErr.message) || 'the stored row could not be read back');
      }
      const merged = mergeDB(dbBase[key], value, fresh.value);
      console.warn(`[${key}] another tab or device wrote while this one was editing — merged both instead of overwriting.`);
      dbStamp[key] = fresh.updated_at;
      dbBase[key]  = dbClone(fresh.value);
      value = merged;
      applyMergedDB(key, merged);   // put the merged result back into the live in-memory array
    }
    console.error('Supabase save gave up after repeated conflicts ('+key+')');
    return fail('discarded', 'three guarded writes in a row were beaten by another writer');
  }catch(e){
    console.error('Supabase save exception ('+key+'):', e);
    return fail('unsaved', (e && e.message) || String(e));
  }
}

/* ---- G14: render first, save after -----------------------------------------
   The eleven highest-frequency grid interactions used to `await saveDB()` BEFORE
   re-rendering, so ticking one checkbox in the Days-on-site grid didn't repaint
   until Supabase had answered — and R18 made that potentially TWO round-trips,
   since a failed guard triggers a re-read, a merge and a retry. The audit measured
   the full 66-crew × 6-day re-render at 4.2ms, so none of the sluggishness was
   rendering; it was all network. The in-memory mutation has already happened by
   the time we render, so the optimistic render is correct regardless.

   ⚠️ THIS IS ONLY SAFE BECAUSE G11 EXISTS. Every failure inside saveDB() raises
   the persistent failure banner from the choke point itself, so a save that never
   lands cannot pass unannounced. If you are ever tempted to simplify G11's error
   path away, these eleven interactions become fast and SILENTLY LOSSY — which is
   strictly worse than the slow version this replaced. Do not decouple them.

   ⚠️ A failed save is NEVER rolled back, and that is deliberate:
     · 'unsaved'   — the edit is still live in memory and every save writes the
                     WHOLE collection, so the next successful save carries it.
                     Rolling back would destroy a perfectly good edit.
     · 'discarded' — applyMergedDB() has already spliced the merged result into the
                     live arrays and re-rendered, so memory already holds the
                     resolved state; the banner says it isn't in the database.
   What we DO on failure is re-render, so the screen is guaranteed to match memory
   at the moment the banner appears rather than still showing what was painted
   optimistically before the round-trip. */
function saveInBackground(key, value){
  return saveDB(key, value).then(res=>{
    if(res && !res.ok) renderProjectBody();
    return res;
  });
}

/* G11 — the failure surface. A banner rather than only an inline status, because
   ~80 of saveDB()'s call sites flash nothing at all: they mutate, save and
   re-render, and a failure there was invisible even in principle. The banner is
   raised by saveDB itself so every one of them is covered, and it persists until
   the same key saves successfully or the user dismisses it — a 2-second flash is
   the wrong register for "this is not in the database". */
const DB_KEY_LABELS = {
  'db:crew':'the crew database', 'db:locations':'the locations database',
  'db:projects':'project details', 'db:shootdays':'shoot days',
  'db:settings':'settings', 'db:roles':'the roles list',
  'db:roleseniority':'role seniority', 'db:subdepartments':'sub-departments',
  'db:travelmethods':'travel methods', 'db:coprocompanies':'production companies'
};
let saveFailure = null;   // {key, kind:'unsaved'|'discarded', detail, value, retrying}

function reportSaveFailure(key, kind, detail, value){
  /* 'discarded' outranks 'unsaved' for the same key: it's the one that means data
     is actually gone, so a later network blip must not quietly demote the wording
     from "your change was not saved" to "not saved yet". */
  const keepWorse = saveFailure && saveFailure.key===key
                    && saveFailure.kind==='discarded' && kind!=='discarded';
  saveFailure = { key, value, retrying:false,
                  kind:   keepWorse ? 'discarded'        : kind,
                  detail: keepWorse ? saveFailure.detail : detail };
  renderSaveFailureBanner();
}
/* Cleared only by a success on the SAME key — db:projects saving fine says nothing
   about whether db:shootdays ever landed. */
function clearSaveFailure(key){
  if(saveFailure && saveFailure.key===key){ saveFailure = null; renderSaveFailureBanner(); }
}
function dismissSaveFailure(){ saveFailure = null; renderSaveFailureBanner(); }
async function retrySaveFailure(){
  if(!saveFailure || saveFailure.retrying) return;
  const f = saveFailure;
  f.retrying = true; renderSaveFailureBanner();
  await saveDB(f.key, f.value);   // clears the banner on success, replaces it on a fresh failure
  if(saveFailure === f) saveFailure.retrying = false;
  renderSaveFailureBanner();
}
function renderSaveFailureBanner(){
  let el = document.getElementById('saveFailBanner');
  if(!saveFailure){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='saveFailBanner'; document.body.appendChild(el); }
  const f = saveFailure, what = DB_KEY_LABELS[f.key] || f.key, lost = f.kind==='discarded';
  el.className = 'save-banner' + (lost ? ' save-banner-lost' : '');
  const msg = lost
    ? `<strong>Your last change was not saved.</strong> Something else kept writing to ${esc(what)} while you were editing, so this change could not be stored. It is still on screen but it is <strong>not in the database</strong> — reload now and it is gone.`
    : `<strong>Not saved yet.</strong> Couldn't write ${esc(what)} to the database. Nothing has been lost — your changes are still on screen, and the next save of the same data that succeeds will carry them.`;
  el.innerHTML = `<div class="save-banner-text">${msg}${f.detail?`<div class="save-banner-detail">${esc(f.detail)}</div>`:''}</div>
    <button type="button" class="small" onclick="retrySaveFailure()"${f.retrying?' disabled':''}>${f.retrying?'Retrying…':'Retry save'}</button>
    <span class="save-banner-close" onclick="dismissSaveFailure()" title="Dismiss">${icon('close')}</span>`;
}

/* The in-memory arrays are what every screen renders from, and other code holds
   references to them, so a merge has to be written back IN PLACE (splice, not
   reassign) or half the app keeps rendering the pre-merge copy. */
function applyMergedDB(key, merged){
  const live = { 'db:crew':()=>crewDB, 'db:locations':()=>locationsDB,
                 'db:projects':()=>projectsDB, 'db:shootdays':()=>shootDaysDB,
                 'db:travelmethods':()=>travelMethodsList, 'db:coprocompanies':()=>coProCompaniesList }[key];
  if(live && Array.isArray(merged)){
    const arr = live(); if(Array.isArray(arr)){ arr.splice(0, arr.length, ...merged); }
  } else if(key==='db:settings' && merged && typeof merged==='object'){
    appSettings = Object.assign({}, SETTINGS_DEFAULTS, merged); applyAppSettings();
  } else if(key==='db:subdepartments' && merged) { SUBDEPARTMENTS_BY_DEPT = merged; }
  else if(key==='db:roleseniority' && merged)    { ROLE_SENIORITY = merged; }
  else if(key==='db:roles' && merged && !Array.isArray(merged)) { ROLES_BY_DEPT = merged; }
  if(typeof renderSide==='function') renderSide();
  if(typeof renderMain==='function') renderMain();
}

async function initApp(){
  crewDB = await loadDB('db:crew');
  locationsDB = await loadDB('db:locations');
  projectsDB = await loadDB('db:projects');
  shootDaysDB = await loadDB('db:shootdays');
  travelMethodsList = await loadDB('db:travelmethods');
  coProCompaniesList = await loadDB('db:coprocompanies');
  const savedSubDepts = await loadDB('db:subdepartments');
  if(savedSubDepts && !Array.isArray(savedSubDepts) && Object.keys(savedSubDepts).length) SUBDEPARTMENTS_BY_DEPT = savedSubDepts;
  const savedRoles = await loadDB('db:roles');
  if(savedRoles && !Array.isArray(savedRoles) && Object.keys(savedRoles).length) ROLES_BY_DEPT = savedRoles;
  const savedRoleSeniority = await loadDB('db:roleseniority');
  if(savedRoleSeniority && !Array.isArray(savedRoleSeniority) && Object.keys(savedRoleSeniority).length) ROLE_SENIORITY = savedRoleSeniority;
  const savedSettings = await loadDB('db:settings');
  if(savedSettings && !Array.isArray(savedSettings)) appSettings = Object.assign({}, SETTINGS_DEFAULTS, savedSettings);
  applyAppSettings();
  if(!travelMethodsList.length){
    travelMethodsList = ['Own car','Production transport','Train','Flying','Public transport'];
    await saveDB('db:travelmethods', travelMethodsList);
  }
  if(!crewDB.length && !locationsDB.length && !projectsDB.length){
    await seedSampleData();   // first-ever load — populate with the OFTV sample so there's something to work with
  }
  /* Phase BF — convert p.crewIds to p.crewEntries before anything renders, so no screen
     ever meets the old shape and no dual-shape read path is needed anywhere in the file.
     Idempotent and a no-op (zero writes) once every project carries crewEntries, which
     is why it can sit on the load path safely. Backups are written inside it, before any
     migration write. Placed after seedSampleData() so a first-ever load migrates the
     seed in the same pass rather than leaving it on the old shape. */
  await migrateCrewEntries();
  renderSide(); renderMain();
}
initApp();

/* ---- Grid ergonomics: keyboard navigation ----
   The core interaction here is "move down a list answering yes/no", so it should be
   possible without touching the mouse. Space toggles natively; this adds:
     ← →      move along the row
     ↑ ↓      move to the same column in the next/previous row
     Home/End jump to the first/last checkbox in the row
     Enter    toggle (same as Space — Enter is what the hand reaches for in a list)
   Rows carrying no checkboxes (e.g. the name row above a person's catering meals)
   are skipped rather than swallowing the keypress and stranding focus. */
/* Phase BK — `.pb-role-row` joined the list because Days on site's day checkboxes moved
   onto the role rows (a position is keyed to an entry). Rows that carry none — a Hotel
   or Travel role row, a Roles/Pre-production one — return an empty checkbox list and are
   skipped by the same "label-only row" rule the catering name row already relied on. */
const GRID_ROW_SELECTOR = '.crewgrid-row, .meal-subrow, .pb-role-row';
/* ONLY the day/meal cells — scoping to .crewgrid-check matters because a row also
   contains the bulk-select checkbox in its name cell. Counting that one made Home
   land on it instead of the first day, and threw every column index off by one, so
   up/down drifted a column left each time. */
const checkboxesIn = row => [...row.querySelectorAll('.crewgrid-check input[type=checkbox]')];
document.addEventListener('keydown', function(e){
  const keys = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter'];
  if(!keys.includes(e.key)) return;
  const active = document.activeElement;
  if(!active || active.type!=='checkbox' || !active.closest('.crewgrid-check')) return;

  // Enter toggles, matching Space — click() so the onchange handler still fires
  if(e.key==='Enter'){ e.preventDefault(); active.click(); return; }

  const row = active.closest(GRID_ROW_SELECTOR);
  if(!row) return;
  e.preventDefault();
  const inRow = checkboxesIn(row);
  const i = inRow.indexOf(active);

  if(e.key==='Home'){ inRow[0]?.focus(); return; }
  if(e.key==='End'){ inRow[inRow.length-1]?.focus(); return; }
  if(e.key==='ArrowRight'){ if(i<inRow.length-1) inRow[i+1].focus(); return; }
  if(e.key==='ArrowLeft'){ if(i>0) inRow[i-1].focus(); return; }

  // up/down: same column index in the nearest row that actually has checkboxes
  const allRows = [...document.querySelectorAll(GRID_ROW_SELECTOR)];
  const step = e.key==='ArrowDown' ? 1 : -1;
  for(let ri = allRows.indexOf(row) + step; ri >= 0 && ri < allRows.length; ri += step){
    const targetInputs = checkboxesIn(allRows[ri]);
    if(!targetInputs.length) continue;              // skip label-only rows
    targetInputs[Math.min(i, targetInputs.length-1)].focus();
    return;
  }
});

/* ---- toggle-all per person: Days on site + Hotel (kind: 'days' | 'hotel') ----
   Genuine on/off toggle: if everything for this person is already ticked, turn
   it all off; otherwise turn it all on. */
/* ⚠️ Phase BF — the two branches take DIFFERENT ids. 'hotel' is person-level, so it
   takes a crewId; 'days' is entry-level, so it takes an entryId. The caller
   (crewAssignRowHTML) is rendering a person row on the Hotel view and an entry row on
   Days on site, so it already has the right one in hand either way. */
async function toggleAllForPerson(id, kind){
  const days = projectDays();
  if(kind==='hotel'){
    const crewId = id;
    const p = currentProject();
    p.hotelNightBefore = p.hotelNightBefore || [];
    const allOn = p.hotelNightBefore.includes(crewId) && days.every(d=>(d.hotelNights||[]).includes(crewId));
    if(allOn){
      p.hotelNightBefore = p.hotelNightBefore.filter(id=>id!==crewId);
      days.forEach(d=>{ d.hotelNights = (d.hotelNights||[]).filter(id=>id!==crewId); });
    } else {
      if(!p.hotelNightBefore.includes(crewId)) p.hotelNightBefore.push(crewId);
      days.forEach(d=>{ d.hotelNights = d.hotelNights||[]; if(!d.hotelNights.includes(crewId)) d.hotelNights.push(crewId); });
    }
    saveInBackground('db:projects', projectsDB);
  } else {
    // 'days' — Days on site, keyed by ENTRY id
    const entryId = id;
    const allOn = days.length>0 && days.every(d=>entryOnDay(entryId, d));
    days.forEach(d=>{
      d.positions = d.positions || [];
      const idx = d.positions.findIndex(pos=>pos[0]===entryId);
      if(allOn){ if(idx>-1) d.positions.splice(idx,1); }
      else if(idx===-1){ d.positions.push([entryId, '', '', '', '']); }
    });
  }
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}
/* ---- toggle-all for one meal across every day, for one person (Catering) ---- */
async function toggleAllMealForPerson(crewId, mealKey){
  const days = projectDays();
  const allOn = days.length>0 && days.every(d=>getCateringMeals(d.id, crewId)[mealKey]);
  days.forEach(d=>{
    d.cateringMeals = d.cateringMeals || {};
    d.cateringMeals[crewId] = d.cateringMeals[crewId] || {b:false, l:false, d:false};
    d.cateringMeals[crewId][mealKey] = !allOn;
    if(!d.cateringMeals[crewId].b && !d.cateringMeals[crewId].l && !d.cateringMeals[crewId].d) delete d.cateringMeals[crewId];
  });
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}

/* ---- horizontally scrollable tab strips (mobile) ----
   Wraps any .tabs that actually overflows in a .tabscroll so the edge-fade cue
   appears, and clears the cue once scrolled to the end. Re-run after any render
   that produces tabs; it is idempotent and a no-op when nothing overflows. */
function refreshTabScrollCues(){
  document.querySelectorAll('.tabs').forEach(tabs=>{
    const overflows = tabs.scrollWidth > tabs.clientWidth + 1;
    let wrap = tabs.parentElement;
    if(!wrap || !wrap.classList.contains('tabscroll')){
      if(!overflows) return;                       // nothing to signal
      wrap = document.createElement('div');
      wrap.className = 'tabscroll';
      tabs.parentNode.insertBefore(wrap, tabs);
      wrap.appendChild(tabs);
      tabs.addEventListener('scroll', ()=>{
        const atEnd = tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2;
        wrap.classList.toggle('tabscroll-end', atEnd);
      }, {passive:true});
    }
    wrap.classList.toggle('tabscroll-end', !overflows ||
      tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2);
  });
}

/* ============================================================================
   Overview: Quick add (Phase Quick Add) — a shortcut, not a fourth place to
   manage anything. One shoot date, one location, one crew member, or an AI Scan
   chat turn at a time, without leaving Overview; everything added here is
   edited normally on its own tab afterwards.

   Deliberately NOT a parallel implementation. Every commit path below calls
   the same function AI Scan's accept flow and the unified Add Location flow
   already call:
     shoot day      → addShootDayFromProposal()  (which reuses makeShootDayRecord())
     location — existing → addLocToProject()
     location — new      → startNewLocationFromSearch() → locFormHTML()/saveLocation()
     crew — existing     → addCrewToProject()
     crew — new          → addNewCrewFromProposal()
   The location control goes further and reuses the Locations tab's actual
   search widget (locAddQuery / onLocAddInput() / locAddResultsHTML() /
   #locFormWrap) rather than a lookalike — the two are never on screen at the
   same time, since they live on different tabs of the same body element.
   Crew has no such widget yet, so quickCrewResultsHTML() below is a
   line-for-line mirror of locAddResultsHTML() rather than a new idea.

   AI Chat (formerly its own standalone "AI Scan" section, folded in here per
   user request) is the fourth button, same row and style as the other three.
   It's the odd one out functionally — a whole chat interface, not a small
   form — but it opens in the exact same slot the other three panels use
   (`quickAddMode==='ai'`), so from the outside it behaves like any other
   quick-add control. aiScanChatBodyHTML() carries the actual chat markup;
   everything about AI Scan's own state (aiScanMessages, proposals, etc.) is
   untouched — only its container and open/close toggle moved.

   No collapsible header/divider around the row itself, on request — the four
   buttons sit directly at the bottom of the Project details card, always
   visible, not behind their own disclosure toggle the way Tasks/AI Scan
   (when it was standalone) were.

   Draft fields are held outside the DOM for the reason aiScanDraftText
   documents: renderProjectBody() replaces the whole tab body on every state
   change, which would otherwise wipe half-typed input.
   ============================================================================ */
let quickAddMode = null;                  // null | 'day' | 'loc' | 'crew' | 'ai' — one control open at a time
let quickAddError = null;                 // e.g. "Pick a date first."
/* Keys are the shoot-day RECORD field names, deliberately — the quick form is the
   same "Day details" + "Production brief" set as the Shoot Days tab's General
   information card (T-5.2), so there's nothing to translate on the way in and no
   parallel vocabulary to keep in step. `brief` is the raw textarea text here and
   becomes an array via parseBriefLines() at commit, exactly as saveShootDay() does. */
let quickDayDraft = { dayNum:'', date:'', allCrewCall:'', brief:'' };
let quickCrewQuery = '';
let quickCrewNewOpen = false;             // the "create new crew member" mini-form
let quickCrewDraft = { name:'', dept:DEPARTMENTS[0], role:'' };

/* Clicking the control that's already open closes it — the row should never
   need a separate Cancel button to get back to four plain buttons. */
function setQuickAddMode(mode){
  const same = quickAddMode === mode;
  resetQuickAdd();
  quickAddMode = same ? null : mode;
  if(quickAddMode === 'loc') locAddQuery = '';   // shared with the Locations tab widget
  if(quickAddMode === 'day'){
    // Day # prefills to what this new day would be, so the count climbs on its
    // own as days are added and never has to be typed. (G19 removed the matching
    // total — it is derived from projectDays().length, not typed or stored.)
    quickDayDraft.dayNum = String(projectDays().length + 1);
  }
  if(quickAddMode === 'ai') checkAiScanConfigured();   // fire-and-forget; re-renders if it learns something — same call the old standalone toggle made on open
  renderProjectBody();
}
/* Called both from here and from the shared add functions the three controls
   end in, so the box returns to its resting state whichever entry point the
   user actually finished through. */
function resetQuickAdd(){
  quickAddMode = null; quickAddError = null;
  quickDayDraft = { dayNum:'', date:'', allCrewCall:'', brief:'' };
  quickCrewQuery = ''; quickCrewNewOpen = false;
  quickCrewDraft = { name:'', dept:DEPARTMENTS[0], role:'' };

/* ---------------------------------------------------------------------------
   Overview: Tasks — merged auto-flags + manual tasks, one box (Phase Tasks).
   Auto-flags are dumb rule-checks against current project data, computed live
   on every render — never persisted, never manually dismissed. A flag simply
   stops appearing once its condition no longer holds. Manual tasks are
   persisted per-project records the user creates by hand. Both live in this
   one merged section, replacing the old standalone "Bare minimums" box.
   --------------------------------------------------------------------------- */
let tasksSectionOpen = false;            // collapsed by default, same convention as AI Scan/summary blocks
function toggleTasksSection(){ tasksSectionOpen = !tasksSectionOpen; renderProjectBody(); }
let showCompletedTasks = false;
function toggleShowCompletedTasks(){ showCompletedTasks = !showCompletedTasks; renderProjectBody(); }

/* Each rule has its own site-wide on/off toggle in appSettings (persisted to
   db:settings, same mechanism as the header font/brand colour) — not
   per-project, so trying all three and turning off whichever proves noisy
   sticks across every project. */
function buildTaskFlags(p, days){
  const items = [];
  const noDateDays = days.filter(d=>!d.date);
  if(noDateDays.length) items.push({ label:`${noDateDays.length} shoot day${noDateDays.length>1?'s':''} missing a date`, onclick:`currentShootDayId='${noDateDays[0].id}';goProjectTab('days')` });
  if(!(p.locationIds||[]).length) items.push({ label:'No locations added yet', onclick:`goProjectTab('locations')` });
  if(!projectEntries(p).length) items.push({ label:'No crew assigned yet', onclick:`goProjectTab('crew')` });

  days.filter(d=>!d.locationId).forEach(d=>{
    items.push({ label:`No location — ${shootDayLabel(d)}`, onclick:`currentShootDayId='${d.id}';goProjectTab('days')` });
  });
  days.filter(d=>!(d.positions||[]).length).forEach(d=>{
    items.push({ label:`No crew — ${shootDayLabel(d)}`, onclick:`crewGridView='days';goProjectTab('crew')` });
  });
  // Grouped into ONE pill, not one per person — unlike the two day-based rules
  // above (where the brief explicitly asked for one flag per day), a project
  // can easily carry 60+ crew, and a flag per no-rate person would flood this
  // box. Clicking jumps to Budget's Per Person view, where every no-rate
  // person is already listed together with an inline field to fix it.
  // Guarded with a typeof check so this rule degrades to a no-op, not an
  // error, if Budget's resolveEntryRate() isn't present in some future branch.
  if(typeof resolveEntryRate==='function'){
    const noRateCount = projectEntries(p).filter(e=>!resolveEntryRate(e.id,p).hasRate).length;
    if(noRateCount) items.push({ label:`${noRateCount} crew member${noRateCount>1?'s':''} with no day rate set`, onclick:`budgetView='person';goProjectTab('budget')` });
  }
  return items;
}
function taskFlagPillsHTML(items){
  if(!items.length) return '<div class="empty-note">No flags right now.</div>';
  return `<div class="taglist">${items.map(it=>`<span class="pill" style="cursor:pointer;border:1px solid var(--danger);color:var(--danger)" onclick="${it.onclick}" title="Click to fix">⚠ ${esc(it.label)}</span>`).join('')}</div>`;
}
/* R6: the draft Title/Note, held outside the DOM. renderProjectBody() replaces the
   whole tab body on every state change (this app's pattern everywhere), so an input
   whose value isn't sourced from state is blanked by any re-render — including
   collapsing the Tasks box or ticking an existing task. Exactly the problem, and
   exactly the fix, that aiScanDraftText already documents for the AI Scan box.
   Cleared only once a task has actually been added. */
let taskDraftTitle = '';
let taskDraftNote  = '';
async function addProjectTask(){
  const p = currentProject(); if(!p) return;
  const title = (val('taskTitleInput')||'').trim();
  if(!title) return;
  const note = (val('taskNoteInput')||'').trim();
  taskDraftTitle = ''; taskDraftNote = '';
  p.tasks = p.tasks || [];
  p.tasks.push({ id:uid(), title, note, completed:false, createdAt:new Date().toISOString() });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}
async function toggleProjectTask(taskId, checked){
  const p = currentProject(); if(!p) return;
  const t = (p.tasks||[]).find(x=>x.id===taskId); if(!t) return;
  t.completed = checked;
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
async function deleteProjectTask(taskId){
  const p = currentProject(); if(!p) return;
  p.tasks = (p.tasks||[]).filter(x=>x.id!==taskId);
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}
function taskListItemHTML(t){

        <strong style="${t.completed?'text-decoration:line-through; color:var(--muted);':''}">${esc(t.title)}</strong>

}
/* Completed tasks hide by default behind a count toggle rather than sitting
   struck-through in the main list — a reasonable default per the brief, not
   a hard requirement; revisit if it feels wrong once used for real. */
function tasksListHTML(p){
  const tasks = p.tasks || [];
  const open = tasks.filter(t=>!t.completed);
  const done = tasks.filter(t=>t.completed);
  const openHTML = open.length ? open.map(taskListItemHTML).join('') : '<div class="empty-note">No tasks yet.</div>';
  const doneToggle = done.length ? `<div class="hint" style="cursor:pointer; margin-top:8px;" onclick="toggleShowCompletedTasks()">${showCompletedTasks?'▾':'▸'} Show completed (${done.length})</div>` : '';
  const doneHTML = (showCompletedTasks && done.length) ? `<div style="margin-top:8px;">${done.map(taskListItemHTML).join('')}</div>` : '';

function renderTasksSection(p, days){
  const flagItems = buildTaskFlags(p, days);
  const openTaskCount = (p.tasks||[]).filter(t=>!t.completed).length;
  const inner = `

        <div><label>Note (optional)</label><input type="text" id="taskNoteInput" value="${esc(taskDraftNote)}" placeholder="Optional detail" oninput="taskDraftNote=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();addProjectTask();}"></div>
      </div>

/* ============================================================================

   Function that proxies the Anthropic API (the key never reaches the client).
   Claude reads free text + attached briefing documents and, when confident
   about a specific element, proposes it as a structured card (shoot date,
   location, or crew member) via tool use. Ticking a card commits straight
   into the project's normal data — no further AI call involved in accepting.

   Chat history is frontend-memory only, per project, for the life of this
   page load — nothing here is persisted (explicitly out of scope; flag back
   if that turns out to be unwanted once used for real). Deliberately no
   propose_task / propose_schedule_item types yet — see the Overview Tasks
   phase and MAP.md for why those are parked, not missing.
   ============================================================================ */
const AI_SCAN_ENDPOINT = 'https://ioueoaasqnseuhrtzhbz.supabase.co/functions/v1/ai-scan';
// Same publishable/anon key already used by the sb client above — not a new
// exposure, just reused as the Edge Function's bearer token.
const AI_SCAN_ANON_KEY = 'sb_publishable_roKbOQwNFveMHtT0OeJk5A_R1jvrKdr';

let aiScanProjectId = null;             // which project aiScanMessages currently belongs to
let aiScanMessages = [];                // [{role, content:[...blocks]}] — Anthropic message shape, frontend-only
let aiScanProposals = {};               // {toolUseId: {type, input, status:'pending'|'accepted_new'|'accepted_match'|'discarded', matchLabel}}

let aiScanBusy = false;
let aiScanError = null;

// The draft text box. renderProjectBody() fully replaces .innerHTML on every
// state change (this app's established pattern everywhere), which would wipe
// an in-progress, not-yet-sent message the instant ANYTHING else re-rendered

// val('aiScanInput') is still used to read it at the moment Send is clicked.
let aiScanDraftText = '';

/* R14: AI Scan needs ANTHROPIC_API_KEY set as a Supabase secret by hand. Until this
   check existed the feature looked completely normal and only failed at the moment
   somebody typed a message and pressed Send — the worst possible time to find out.

   The probe is free. The Edge Function checks for the key BEFORE it parses the
   request body and long before it calls Anthropic, so a deliberately malformed POST
   comes back either "isn't configured yet" (no key) or "Invalid JSON body" (key is
   set). Either way no Anthropic call is made and no tokens are spent.

   A network/CORS failure leaves the state 'unknown' and shows nothing — the function's
   CORS is locked to the live github.io origin, so opening index.html straight off disk
   can't reach it, and crying wolf there would be worse than staying quiet. */
let aiScanConfigState = 'unknown';   // 'unknown' | 'ok' | 'missing'
async function checkAiScanConfigured(){
  if(aiScanConfigState !== 'unknown') return;
  try{
    const res = await fetch(AI_SCAN_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_SCAN_ANON_KEY, 'apikey':AI_SCAN_ANON_KEY },
      body:'{'   // deliberately invalid — never reaches the model
    });
    const data = await res.json().catch(()=>({}));
    aiScanConfigState = /isn'?t configured/i.test(data.error || '') ? 'missing' : 'ok';
  }catch(e){ aiScanConfigState = 'unknown'; return; }
  if(aiScanConfigState === 'missing') renderProjectBody();
}

/* ---- committing a ticked proposal into real project data --------------------
   Matched proposals reuse the exact existing add-crew/add-location functions.
   New records mirror saveCrew()/saveLocation()'s record shape exactly, but
   can't call those functions directly — they're bound to ~25 form fields via
   val('nc...')/val('nl...') on the Crew/Locations database forms, not
   parameters, and faking that whole form for a chat-driven add would be far
   more fragile than a small dedicated constructor. addShootDayFromProposal
   DOES reuse the actual shared makeShootDayRecord() — the one piece of this
   that already took a data-only shape. ------------------------------------- */
/* The one commit path for "create a shoot day from plain field values", shared by
   AI Scan's propose_shoot_date accept and Overview Quick add. Starts from the real
   makeShootDayRecord() so a day made here is indistinguishable from one made with
   + New day (starter schedule, empty positions, the lot), then overlays whichever
   fields the caller actually has. Only non-empty values overlay, so a caller that
   knows nothing about, say, allCrewCall keeps the record default rather than
   blanking it. */
async function addShootDayRecord(fields){
  const p = currentProject(); if(!p) return null;
  const rec = makeShootDayRecord(currentProjectId, p);
  Object.entries(fields||{}).forEach(([k,v])=>{
    if(v===undefined || v===null || v==='') return;
    if(Array.isArray(v) && !v.length) return;
    rec[k] = v;
  });
  shootDaysDB.push(rec);
  await saveDB('db:shootdays', shootDaysDB);
  return rec;
}
/* AI Scan's shape: the model proposes a single-line label, which is a one-line
   production brief. Kept as a named wrapper so the accept path reads the same as
   its sibling addNewLocationFromProposal()/addNewCrewFromProposal(). */
async function addShootDayFromProposal(date, label, notes){
  return addShootDayRecord({ date, brief: label?[label]:[], notes });
}
async function addNewLocationFromProposal(name, addressOrNotes){
  const p = currentProject(); if(!p || !name) return null;
  const rec = { id:uid(), name, address:addressOrNotes||'', fee:'', lat:null, lon:null,
    onsiteContactName:'', onsiteContactPhone:'', accessInfo:'', recceInfo:'', parkingInfo:'', hospital:null, nearestParking:null };
  locationsDB.push(rec);
  await saveDB('db:locations', locationsDB);
  p.locationIds = p.locationIds||[]; if(!p.locationIds.includes(rec.id)) p.locationIds.push(rec.id);
  await saveDB('db:projects', projectsDB);

}
async function addNewCrewFromProposal(name, department, role){

async function acceptAiProposal(id){
  const state = aiScanProposals[id]; if(!state || state.status!=='pending') return;
  const type = state.type;
  if(type==='propose_shoot_date'){
    const date = val(`ai-date-${id}`), label = val(`ai-label-${id}`), notes = val(`ai-notes-${id}`);
    state.status = 'accepted_new';
    await addShootDayFromProposal(date, label, notes);
  } else if(type==='propose_location'){
    const useMatch = document.getElementById(`ai-usematch-${id}`);
    const matchedLoc = useMatch && useMatch.checked && state.input.match_id ? locById(state.input.match_id) : null;
    if(matchedLoc){
      state.status = 'accepted_match'; state.matchLabel = matchedLoc.name;
      await addLocToProject(matchedLoc.id);
    } else {
      const name = val(`ai-name-${id}`), addr = val(`ai-addr-${id}`);
      state.status = 'accepted_new';
      await addNewLocationFromProposal(name, addr);
    }
  } else if(type==='propose_crew'){
    const useMatch = document.getElementById(`ai-usematch-${id}`);
    const matchedCrew = useMatch && useMatch.checked && state.input.match_id ? crewById(state.input.match_id) : null;
    if(matchedCrew){
      state.status = 'accepted_match'; state.matchLabel = matchedCrew.name;
      await addCrewToProject(matchedCrew.id);
    } else {
      const name = val(`ai-name-${id}`), dept = val(`ai-dept-${id}`), role = val(`ai-role-${id}`);
      state.status = 'accepted_new';
      await addNewCrewFromProposal(name, dept, role);
    }
  }
  renderProjectBody();
}
function discardAiProposal(id){
  const state = aiScanProposals[id]; if(!state || state.status!=='pending') return;
  state.status = 'discarded';
  renderProjectBody();
}

function aiScanMessageHTML(msg){

  // Shown before anything is typed, not after a failed send (R14).
  const notConfiguredHTML = aiScanConfigState === 'missing'
    ? `<div class="ai-notconfigured">${icon('sparkle')} <strong>AI Scan isn't set up yet.</strong>
         The server has no Anthropic API key, so sending a message will fail. Someone needs to run
         <code>supabase secrets set ANTHROPIC_API_KEY=…</code> once — it's a credential, so it can't be
         done from inside the app.</div>`
    : '';
  return `
    ${notConfiguredHTML}
    <div class="hint" style="margin-bottom:10px;">Chat about the project, or attach a briefing document (PDF, .docx, .txt) — Claude proposes shoot dates, locations and crew as you go. Nothing is added until you tick a proposal. This conversation isn't saved — it starts over if you leave and come back.</div>
    <div class="ai-chat" id="aiScanChat">${turnsHTML || '<div class="empty-note">Say something about the project, or attach a briefing document, to get started.</div>'}</div>
    ${errorHTML}
    ${aiScanBusy ? `<div class="hint" style="margin-bottom:8px;">Thinking…</div>` : ''}
    ${chipsHTML}
    <div class="ai-input-row">
      <input type="file" id="aiScanFileInput" accept=".pdf,.docx,.txt" multiple style="display:none" onchange="handleAiScanFileInput(this)">
      <button class="icon-btn" onclick="document.getElementById('aiScanFileInput').click()" title="Attach a document" aria-label="Attach a document" ${aiScanBusy?'disabled':''}>${icon('paperclip')}</button>
      <input type="text" id="aiScanInput" placeholder="Tell me about the shoot…" value="${esc(aiScanDraftText)}" oninput="aiScanDraftText=this.value" ${aiScanBusy?'disabled':''} onkeydown="if(event.key==='Enter'){event.preventDefault();sendAiScanMessage();}">
      <button class="icon-btn" onclick="sendAiScanMessage()" title="Send" aria-label="Send" ${aiScanBusy?'disabled':''}>${icon('send')}</button>
    </div>`;
}

/* ---- file attachments ---- */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]); // strip the data: URL prefix
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
/* PDFs go to the API natively as a document block — Claude reads them
   directly, no extraction needed. .docx has no native API support, so it's
   extracted to plain text client-side via mammoth.js first. .txt (and
   anything else) is just read as text. */
async function fileToContentBlock(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    const b64 = await fileToBase64(file);
    return { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } };
  }
  if(name.endsWith('.docx')){
    if(typeof mammoth==='undefined') throw new Error('the .docx reader failed to load');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return { type:'text', text:`[Attached document: ${file.name}]\n\n${result.value}` };
  }
  const text = await fileToText(file);
  return { type:'text', text:`[Attached document: ${file.name}]\n\n${text}` };
}
async function handleAiScanFileInput(inputEl){
  const files = [...(inputEl.files||[])];
  inputEl.value = ''; // so re-picking the same file again later still fires onchange
  /* G17 — collect every failure, don't overwrite. This used to assign aiScanError
     on each failing file, so picking four files with two bad ones told you about
     one of them — and the other silently wasn't attached either. Attaching a
     briefing document is the primary way into AI Scan; a dropped attachment that
     reports someone else's error only surfaces as a wrong answer later.
     One line per failure; `.ai-error` carries white-space:pre-line for them. */
  const failures = [];
  for(const file of files){
    if(file.size > 15*1024*1024){ failures.push(`"${file.name}" is over 15MB — attach a smaller file.`); continue; }
    try{
      const block = await fileToContentBlock(file);
      aiScanPendingFiles.push({ block, filename: file.name });
    } catch(err){
      failures.push(`Couldn't read "${file.name}": ${err.message||err}`);
    }
  }
  aiScanError = failures.length ? failures.join('\n') : null;
  renderProjectBody();
}
function removeAiScanPendingFile(idx){ aiScanPendingFiles.splice(idx,1); renderProjectBody(); }

/* ---- sending a turn ---- */
function buildCrewSummary(){ return crewDB.map(c=>({id:c.id, name:c.name, role:c.role||''})); }
function buildLocationSummary(){ return locationsDB.map(l=>({id:l.id, name:l.name})); }
/* Every tool_use block from the assistant's LAST turn needs a matching
   tool_result before the conversation can continue — the API requires it.
   Reflects whatever the user has (or hasn't) actioned on each card so far,
   so Claude doesn't re-propose something already discarded, and knows what's
   actually landed if asked. Ticking/discarding a card does NOT call the API
   by itself (per the brief) — these accumulate silently and go out bundled
   with whatever the user sends next. */
function pendingAiToolResultBlocks(){
  const last = aiScanMessages[aiScanMessages.length-1];
  if(!last || last.role!=='assistant') return [];
  const toolUses = (last.content||[]).filter(b=>b.type==='tool_use');
  return toolUses.map(tu=>{
    const st = aiScanProposals[tu.id];
    let text = 'The user has not reviewed this proposal yet.';
    if(st){
      if(st.status==='accepted_new') text = 'The user added this as a new record in the project.';
      else if(st.status==='accepted_match') text = `The user confirmed this matches an existing record (${st.matchLabel||'match'}) and assigned it to the project.`;
      else if(st.status==='discarded') text = 'The user declined this proposal. Do not propose it again unless new information changes it.';
    }
    return { type:'tool_result', tool_use_id: tu.id, content: text };
  });
}
/* strip the display-only filename we stash on document/text blocks before
   they go anywhere near the actual API request */
function stripAiScanDisplayFields(messages){
  return JSON.parse(JSON.stringify(messages, (k,v)=> k==='_filename' ? undefined : v));
}
async function sendAiScanMessage(){
  if(aiScanBusy) return;
  const text = (val('aiScanInput')||'').trim();
  const files = aiScanPendingFiles.slice();
  if(!text && !files.length) return;

  const content = files.map(f=>Object.assign({}, f.block, {_filename:f.filename}));
  if(text) content.push({ type:'text', text });
  const newUserMsg = { role:'user', content:[...pendingAiToolResultBlocks(), ...content] };

  aiScanPendingUserMsg = newUserMsg;
  aiScanBusy = true; aiScanError = null;
  renderProjectBody();

  try{
    const outgoing = stripAiScanDisplayFields([...aiScanMessages, newUserMsg]);
    const res = await fetch(AI_SCAN_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_SCAN_ANON_KEY, 'apikey':AI_SCAN_ANON_KEY },
      body: JSON.stringify({ messages: outgoing, crewSummary: buildCrewSummary(), locationSummary: buildLocationSummary() })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
    const assistantMsg = { role:'assistant', content: data.content||[] };
    assistantMsg.content.forEach(b=>{
      if(b.type==='tool_use') aiScanProposals[b.id] = { type:b.name, input:b.input||{}, status:'pending' };
    });
    aiScanMessages = [...aiScanMessages, newUserMsg, assistantMsg];
    aiScanPendingUserMsg = null;
    aiScanPendingFiles = [];
    aiScanDraftText = '';
  } catch(err){
    aiScanError = err.message || String(err);
    aiScanPendingUserMsg = null; // don't leave a fake-sent bubble behind — aiScanDraftText/aiScanPendingFiles are untouched, so Send retries cleanly
  } finally {
    aiScanBusy = false;
    renderProjectBody();
  }
}
async function saveProjectTechSpecs(){
  const p = currentProject(); if(!p) return;
  p.techSpecs = p.techSpecs || {};
  const entered = readTechSpecFields('pj');
  TECHSPEC_FIELDS.forEach(f=>{ if(entered[f]) p.techSpecs[f] = entered[f]; else delete p.techSpecs[f]; });
  const numbering = document.getElementById('pjContinuousNumbering');
  if(numbering) p.continuousNumbering = numbering.value!=='reset';
  flashSaveResult('pjStatus', await saveDB('db:projects', projectsDB));
}
async function saveProjectOverview(silent){

  const client=val('ovClient'), title=val('ovTitle'), start=val('ovStart');
  if(!client||!title||!start){ if(!silent) alert('Client, working title and initial shoot date are required.'); return; }
  p.client=client; p.title=title; p.startDate=start; p.logline=val('ovLogline'); p.description=val('ovDescription');
  flashSaveResult('ovStatus', await saveDB('db:projects', projectsDB));
