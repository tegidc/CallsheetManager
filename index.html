  .formgroup > .fg-title{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;}
  .formgroup > .fg-title::after{content:''; flex:1; height:1px; background:var(--line);}
  /* collapsible crew-form sections */
  summary.fg-title{cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:6px;}
  summary.fg-title::-webkit-details-marker{display:none;}
  summary.fg-title::before{content:'▸'; font-size:9px; transition:transform .15s ease; display:inline-block;}
  details[open] > summary.fg-title::before{transform:rotate(90deg);}
  summary.fg-title:hover{opacity:.75;}
  .private-note{font-size:var(--fs-meta); color:var(--muted); background:rgba(164,50,31,.08); border:1px solid rgba(164,50,31,.28);
    border-radius:6px; padding:6px 9px; margin-bottom:8px;}
  .private-note b{color:var(--danger);}
  .taglist{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .crewrow-select{display:grid; grid-template-columns:46px 1fr 100px 34px; gap:8px; align-items:start; margin-bottom:8px; padding-top:6px;}
  .posn-dept-badge{font-family:var(--label); font-size:var(--fs-ctl); font-weight:600; letter-spacing:1.2px; color:var(--tape);
    background:var(--tint-3); border-radius:5px; padding:6px 4px; text-align:center; align-self:center;}
  /* shared crew identity block — used by every crew list in the app */
  .crew-ident{min-width:0;}
  .crew-ident-top{display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
  .crew-ident-top strong{font-family:var(--body); font-weight:600; font-size:14px; margin-left:4px;}
  .crew-ident-pills{display:flex; flex-wrap:wrap; gap:4px; margin:5px 0 3px;}
  /* compact single-row variant — everything on one line */
  .crew-ident.one-line{display:flex; align-items:center; gap:6px; flex-wrap:nowrap; min-width:0;}
  .crew-ident.one-line strong{font-family:var(--body); font-weight:600; font-size:14px; white-space:nowrap;}
  .crew-ident.one-line .crew-ident-sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .crew-ident.one-line select.pill-select{max-width:150px;}
  .crew-ident.one-line .icon-btn{flex:0 0 auto;}
  /* roles row: same "one row per person" block as one-line, but wraps onto
     further lines instead of clipping — used where a saved-roles taglist
     needs to sit alongside the dept/company pickers */
  .crew-ident.one-line.wrap-row{flex-wrap:wrap;}
  .crew-ident.one-line.wrap-row .crew-ident-sub{white-space:normal; overflow:visible; text-overflow:clip;}
  .crew-ident.one-line.wrap-row .roles-inline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-left:2px;}
  .override-dot{color:var(--tape); font-size:9px; flex:0 0 auto; cursor:help;}
  .posn-row-overridden{background:var(--tint-2); border-radius:8px;}
  .day-override-form{border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); background:var(--tint-1);}
  .day-override-form .fg-title{font-family:var(--label); font-size:11px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-bottom:8px;}
  select.pill-select.copro{color:var(--text);}
  select.pill-select.copro.empty{color:var(--muted);}
  /* The name column used to be minmax(200px,1fr)/minmax(200px,340px) and carried the
     checkbox and role chip embedded inside it (Phase Detail, then Phase BN). Phase BO
     gave Days on site/Hotel/Travel/Catering the same Controls/Name/Role leading
     columns Roles/Pre-production already had — --pb-controls-w/--pb-name-w/
     --pb-role-w, shared tokens so all six sub-tabs' Controls/Name/Role start at the
     same x — with a trailing flexible column so spare width still lands after the
     row rather than stranding the day checkboxes at the right edge. */
  /* ⚠️ Phase BO: column-gap raised from 6px to 10px to match .roles-grid/.prep-grid
     exactly — a 4px/gap difference was enough to put Role (and therefore every day
     column after it) a few px out of line with the other five sub-tabs. The day
     columns themselves stay 38px; this only widens the gutters between them a
     little, not the columns. */
  .crewgrid{display:grid; grid-template-columns:var(--pb-controls-w) var(--pb-name-w) var(--pb-role-w) repeat(var(--daycols), var(--daycolwidth, 38px)) 74px minmax(0,1fr);
    align-items:center; column-gap:10px;}
  .crewgrid-header-row{padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid var(--line);}
  .crewgrid-header{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; color:var(--tape); text-align:center; letter-spacing:1.2px; text-transform:uppercase;}
  /* No rule between people — the department heading does the dividing (Fonts Review) */
  .crewgrid-row{padding:8px 0;}
  .crewgrid-controls{display:flex; align-items:center;}
  .crewgrid-role-cell{min-width:0;}
  /* ⚠️ FLEX, so the repeat asterisk sits BESIDE the name rather than under it. The cell
     holds a <div class="crew-ident"> and then the star as a sibling; block-level layout
     put the star on its own line on every crewgrid tab. */
  .crewgrid-row-name{min-width:0; display:flex; align-items:center; gap:3px;}
  .crewgrid-row-name > .crew-ident{min-width:0;}
  .crewgrid-row-name .icon-btn{margin-left:0; margin-right:2px;}
  .crewgrid-check{display:flex; justify-content:center;}
  .crewview-tabs{margin-bottom:12px;}
  .crewgrid-check input{width:16px; height:16px;}
  /* catering: three stacked rows per person (Breakfast/Lunch/Dinner), kept compact
     so three rows don't feel like three times the space of one */
  .crewgrid-catering-person{padding-bottom:6px; margin-bottom:6px;}
  .crewgrid-catering-person:last-child{margin-bottom:0;}
  .meal-subrow{margin-top:1px;}
  .meal-subrow .meal-cell input{width:13px; height:13px;}
  .meal-subrow .meal-cell input::after{font-size:12px;}
  .meal-row-label-wrap{display:flex; align-items:center; gap:8px; min-width:0; padding-left:2px;}
  .meal-row-label{font-family:var(--label); font-size:11px; font-weight:500; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape);}
  .meal-row-all{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    cursor:pointer; flex-shrink:0; text-align:right;}
  .meal-row-all:hover{color:var(--tape);}
  .crewgrid-remove{display:flex; align-items:center; justify-content:flex-end; gap:2px;}
  /* Row-level "All": a text control in the body font, always in the row's final
     column so it lines up down the page (Fonts Review). Was a bordered button on
     Days/Hotel and a left-hand text link on Catering — now one thing, one place. */
  .all-toggle-btn{background:none; border:none; padding:0; min-height:0;
    font-family:var(--body); font-weight:400; font-size:var(--fs-meta); color:var(--muted);
    cursor:pointer; text-align:right;}
  .all-toggle-btn:hover{color:var(--tape); border:none;}
  .crewgrid-editform{grid-column:1/-1; margin-top:8px; border:1px solid var(--tape); border-radius:var(--box-radius); padding:var(--box-pad); background:var(--panel);}

  /* ---- Phase BK/BL — the person block ----
     One card per person on every Crew sub-tab: a name line carrying that person's
     PERSON-level facts, then their role entries stacked beneath it. Every row inside
     is still the tab's own grid class (.roles-grid / .crewgrid / .prep-grid) with
     explicit grid-column placement, so the columns still read straight down the page
     exactly as they did when the list was flat — that alignment is the whole point.
     Deliberately no border, no fill and no divider of its own on desktop: the
     department heading already does the grouping (Fonts Review), and the Crew tab is
     the one place in this app where drawn-on lines were measured as a problem. */
  .person-block{padding:6px 0;}
  .person-block-editing{background:var(--tint-2); border-radius:8px; padding:8px;}
  .person-block .pb-head{padding:0;}
  /* Phase BO, revised in the follow-up — a shared BASELINE row height across all
     six sub-tabs, not five: 33px is Travel's own natural height (driven by its
     <select>), so Travel is unchanged and the others just grow enough to match it
     — align-items:center (already set on .roles-grid/.crewgrid/.prep-grid) centres
     shorter content in the taller row. Pre-production/Post sit at the SAME 33px floor
     unconditionally now: this used to depend on their counter line collapsing when
     empty (:empty on the since-removed .prep-counter), so a row grew the moment it had
     a rate or a mark to report. With the counter gone there is no second line under
     the fields at all, and a phase row only exceeds 33px when the chevron reveals a
     stacked-away second role or the date calendar is open. Phase BO originally
     excluded Pre-production from the shared height entirely; that was wrong then, and
     nothing needs excluding now. */
  .pb-head, .pb-role-row{min-height:33px;}
  .pb-role-row{padding:2px 0;}
  /* ⚠️ Phase BO: dropped the 20px indent this used to carry. Role is now its own
     explicit shared column (--pb-role-w) across all six sub-tabs, so a stacked-away
     row already reads as "belonging to the name above" from its blank Controls/Name
     cells — an extra left-padding would just eat into an already-fixed-width column
     and misalign the chip from the head row's own. */
  .pb-role-cell{min-width:0;}
  /* the chip and the block's chevron/"+N" are one unit that must not wrap onto a
     second line (a long role name used to wrap the trailing glyph and make that
     row taller than its neighbours — originally AZ's marker, Phase BM removed the
     marker but the wrapping problem is the same for what still sits there) — AND
     .roles-inline is an inline-flex box that shrink-wraps its content by default,
     so without min-width/max-width here it grows past the fixed-width role column
     rather than being clipped by it. */
  .pb-role-cell .roles-inline{flex-wrap:nowrap; min-width:0; max-width:100%;}
  /* the role chip itself ellipsis-truncates inside that now-bounded box rather
     than stretching the row or overflowing; full text is still in the chip's title */
  .pb-role-cell .role-chip{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; min-width:0;}
  /* the collapsed line's chevron + muted "+N". WEIGHT is the whole signal, the same
     convention as .prep-cal-btn — not a second visual language. Renders at all only
     when something is actually hidden.
     ⚠️ Phase BM leans on this: it is now the ONLY "this person has more going on than
     what's shown" signal on a role row, since AZ's "+" marker and its
     has-other-saved-roles weighting are gone. The chip did NOT inherit a weighting to
     compensate — that would duplicate this one level down. */
  .pb-toggle{display:inline-flex; align-items:center; gap:3px; cursor:pointer; user-select:none;
    color:var(--muted); font-family:var(--body); font-size:var(--fs-meta); line-height:1; flex:0 0 auto;}
  .pb-toggle:hover{color:var(--tape);}
  .pb-caret{font-size:9px;}
  /* the crew Edit/View expansion, shared by all six sub-tabs' blocks. Same treatment as
     the .roles-grid-editform / .crewgrid-editform it replaces, minus the grid-column —
     it is a sibling of the rows now, not a cell inside one. */
  .pb-editform{margin-top:8px; border:1px solid var(--tape); border-radius:var(--box-radius);
    padding:var(--box-pad); background:var(--panel);}

  /* scrollable wrapper for wide preview tables */
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px;}
  .tablewrap table{min-width:520px;}

  /* Budget summary bar (Phase Budget) — glanceable stat figures, without needing a
     .card wrapper.
     ⚠️ Phase AN: the figure itself is Oswald, not Fraunces — a deliberate exception
     to Phase Fonts' "every Oswald label is 11px" rule. Fraunces' serif numerals read
     badly at a glance; Oswald's are built for this. Sized up to 26px (from 22px) and
     given light tracking (0.4px, well under the 1.2px label tracking — enough to
     open the digits up at this weight without spacing them out like a caption) since
     Oswald's condensed forms otherwise read lighter than Fraunces bold did at the
     same pixel size. The .lbl caption below it is unchanged Oswald 11px/1.2px. */
  /* ============ THE BANNER: TOTALS | STAGE | TOOLS (Phase BU) ============
     ⚠️ THREE FIXED ZONES, IN A GRID — NOT a flex row that packs to its content, and this
     is the whole point of the rule: THE STAGE CLUSTER MUST NOT MOVE. It is the same three
     phase buttons on the Budget's three views and on Crew ▸ Roles, and it is a CONTROL you
     click repeatedly while switching between them — so it holds one position, and the
     TOTALS zone keeps its width whether it is showing three figures, one, or (with Budget off
     on Roles) nothing at all. "Totaliser or blank", and blank still occupies its column.
     ⚠️ Do not make --bnr-totals-w content-sized, and do not swap this for flex with
     margin-left:auto. Either one reintroduces exactly the jump this replaced: Itemize VAT
     off drops the headline from three figures to one, and Stage used to slide ~340px left.
     The two widths are sized to their contents' worst case — three 26px Oswald figures,
     and "Pre-production" beside a 9-character amount. */
  /* ⚠️ TOOLS TAKES ITS OWN ROW, and that is forced by #main's max-width:840px — measured,
     not guessed. Inside its padding the banner is 796px, and the three zones want
     430 + 270 + 342 = ~1070. Three across cannot fit at any window size, because the cap is
     on the content column rather than the viewport. So the grid is:
         TOTALS | STAGE
         TOOLS  (spanning, right-aligned)
     which keeps the reading order TOTALS → STAGE → TOOLS and, more to the point, keeps
     STAGE's left edge pinned at --bnr-totals-w + the gap no matter what.
     ⚠️ The first column is FIXED and the second takes the slack. That single fact is what
     stops STAGE moving: with Itemize VAT off the headline drops from three figures to one,
     and with Budget off on Roles it has no figures at all — under a content-sized column each
     of those slid STAGE hundreds of pixels sideways, mid-click. Do not make column 1
     auto/max-content, and do not go back to a flex row with margin-left:auto. */
  .phase-banner{display:grid; grid-template-columns:var(--bnr-totals-w) minmax(0,1fr);
    grid-template-areas:"totals stage" "tools tools";
    gap:12px 28px; align-items:start;
    margin:14px 0 18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .bnr-totals{grid-area:totals; display:flex; align-items:flex-start; gap:30px; min-width:0;}
  /* fixed width inside a flexible column, so the amounts right-align on the same edge on
     every view rather than tracking whatever width is left over */
  .phase-banner .budget-scope-stack{grid-area:stage; width:var(--bnr-stage-w); max-width:100%;}
  .budget-stat .num{font-family:var(--label); font-weight:700; font-size:26px; letter-spacing:.4px;
    color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .budget-stat .lbl{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-top:2px;}
  /* the note that makes the whole banner's state readable when TOTALS is blank — otherwise
     an empty left third reads as a screen that failed to load rather than one with the
     money deliberately switched off */
  .bnr-totals-off{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    align-self:center; max-width:34ch; line-height:1.45;}
  /* ---- TOOLS: buttons, right-aligned, one cluster ----
     Phase BU pulled the Budget text toggle out of the Crew toolbar and the three checkbox
     labels out of the summary bar, and made all of them the same pill. They were three
     different affordances (a bare word, a checkbox, a checkbox) doing one kind of job:
     changing what this screen shows. The Crew toolbar keeps what acts on the LIST —
     Select all, Filter, Copy · Export, Collapse all. */
  /* ⚠️ A COLUMN OF RIGHT-ALIGNED ROWS, not one wrapping row. The mode picker sits on top and
     the money controls below it, and both are flush to the same right edge — which is what
     pins Budget (the last button on the lower row) to one x whether its three companions are
     showing or not. See budgetSummaryBarHTML for why the order within the row matters. */
  .bnr-tools{grid-area:tools; display:flex; flex-direction:column; align-items:flex-end;
    gap:7px; min-width:0;}
  .bnr-toolrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .bnr-tool{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.1px;
    text-transform:uppercase; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:5px; padding:4px 9px; cursor:pointer;
    user-select:none; white-space:nowrap; line-height:1.35;}
  .bnr-tool:hover{border-color:var(--tape); color:var(--tape);}
  .bnr-tool.on{background:var(--tape); border-color:var(--tape); color:var(--tape-ink); font-weight:600;}
  .bnr-tool:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  /* the mode picker is a SEGMENTED control, not three loose pills: its options are
     mutually exclusive, and three separate on/off pills would imply you could have two. */
  .bnr-modes{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .bnr-modes .bnr-tool{border:none; border-radius:0; border-left:1px solid var(--line);}
  .bnr-modes .bnr-tool:first-child{border-left:none;}
  .bnr-scope-note{grid-column:1/-1; margin:0;}
  .budget-rate-input{width:64px; text-align:left;}
  /* ---- money fields ----
     ⚠️ The £ is a SIBLING of the input, never inside its value. Everything that reads
     these fields parses them as numbers (saveEntryRate, saveCateringCosts, collectRoleRates,
     the whole budget), so a symbol in the value would have to be stripped in a dozen
     places and would silently cost £0 in whichever one got missed.
     ⚠️ The prefix greys out when the field is empty, so a column of placeholders reads as
     "nothing entered" rather than as a column of naked currency symbols. */
  .money-field{display:inline-flex; align-items:baseline; gap:1px; min-width:0;}
  .money-field::before{content:'£'; color:var(--muted); font-size:var(--fs-meta); flex:0 0 auto;}
  .money-field:has(input:placeholder-shown)::before{opacity:.45;}
  .money-field input{text-align:center;}
  /* the three numeric columns on Roles read as a block of figures, so they centre together
     — a right-aligned rate beside a left-aligned day count reads as two different tables */
  .roles-num .budget-rate-input, .roles-grid-rate .money-field input{text-align:center;}
  /* a header sits over its own column, so it aligns the way that column's CONTENT does.
     ⚠️ After .pb-head-name/.pb-head-role's left-align rule, which is :is()-weighted — a
     plain .roles-head-c would lose to it. It never applies to Name/Role anyway; the
     specificity is so a later edit to either rule can't silently re-align the other. */
  :is(.roles-grid-header, .prep-grid-header).roles-head-c{text-align:center;}
  /* ⚠️ REMOVED in Phase BU: .roles-grid.no-money. Roles' template is --roles-cols now (see
     .roles-grid) — one computed value covering every combination, rather than a class per
     shape. .prep-grid.no-money below is untouched: Pre-Prod/Post still have exactly the two
     shapes it describes. */
  /* Pre-Prod/Post keep their column but it holds one field instead of two */
  .prep-grid.no-money{--pb-phase-fields-w:60px;}
  .prep-grid.no-money .prep-header-fields span{width:60px;}
  /* ⚠️ REMOVED in Phase BU: .crew-money-toggle. The Budget control is a .bnr-tool in the
     banner's TOOLS cluster now, the same pill as Itemize VAT / Split kit / Costs PP — they
     all change what the screen shows, and they were three different affordances doing it.
     Do not look for a bare-text toggle in the Crew toolbar. */
  /* ---- the crew form's Rates section: one row per saved role ----
     A grid, not a table, so the header cells and the body cells share one column
     definition and cannot drift; the role column takes the slack so the four number
     columns stay put down the list. */
  /* seven columns don't fit a narrow form, so the rows scroll sideways inside their own
     box rather than squeezing the number columns to unreadable widths — same answer
     .tablewrap gives every other wide table in this app */
  .rate-rows-scroll{overflow-x:auto;}
  .rate-rows{display:flex; flex-direction:column; gap:2px; min-width:560px;}
  .rate-row{display:grid; grid-template-columns:minmax(0,1fr) 74px 92px 74px 60px 66px 72px;
    align-items:center; column-gap:10px; min-height:32px;}
  .rate-row-head{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape);
    padding-bottom:4px; margin-bottom:2px; border-bottom:1px solid var(--line);}
  .rate-row-role{font-family:var(--body); font-weight:600; font-size:var(--fs-name);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rate-row-split{display:flex; align-items:center; gap:6px; margin:0;
    font-family:var(--body); font-size:var(--fs-meta); font-weight:400; letter-spacing:0;
    text-transform:none; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .rate-row .budget-rate-input{width:100%;}
  /* a disabled kit box still holds its column — it reads as "not split", not as missing */
  .rate-row .rr-kit:disabled{opacity:.4; cursor:not-allowed;}
  /* all three derived cells are TEXT, never inputs, so they can't look typeable */
  .rr-labour, .rr-vat, .rr-inc{font-size:var(--fs-meta); color:var(--muted);}
  /* the inc-VAT figure is the one you quote, so it carries the ink the others don't */
  .rr-inc{color:var(--text);}
  /* AG: the Day Rate input + its "save to crew database" icon, wherever the pair appears
     (Roles tab, Budget Per Person, the crew Edit expansion) */
  .rate-with-save{display:inline-flex; align-items:center; gap:4px;}
  .rate-with-save .hint{font-size:11px; white-space:nowrap;}
  .budget-extras-row td{padding-top:14px;}
  .budget-total-row td{padding-top:10px; border-top:1.5px solid var(--field-line);
    font-weight:600;}
  .budget-noRate{color:var(--muted); font-style:italic;}
  /* the VAT note riding on the TOTAL's label. Body font, not the label's uppercase
     letter-spaced type — it is a sentence about the number, not a second heading for it. */
  .budget-stat-note{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; text-transform:none; color:var(--muted); margin-left:8px;}
  /* the ex-VAT line under the headline. Same size and weight as the VAT note beside the
     label — they are a pair — but green, because it is a NUMBER in its own right rather
     than a remark about the one above it. */
  .budget-stat-sub{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; text-transform:none; color:var(--tape); margin-top:3px;
    font-variant-numeric:tabular-nums;}
  /* ---- STAGE: the phase stack, zone 2 of the banner ----
     Phase BU gave it a zone of its own rather than letting it ride at the end of the
     headline's flex row, which is what made it move when the headline changed shape. */
  .budget-scope-stack{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .bnr-zone-head{font-family:var(--label); font-size:10px; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  /* ⚠️ Phase CJ — A GRID, NOT space-between, because there are three figures per row now and
     they have to land on the same three right edges down the stack. The name takes the slack;
     each amount gets a fixed track wide enough for a 9-character figure.
     ⚠️ THE ORDER IS xVAT · VAT · TOTAL, which is deliberately NOT Per Department's
     TOTAL · xVAT · VAT. These rows are an equation that sums downward AND rightward — the two
     small figures add to the bold one — and the bold total stays on the right edge where the
     stack's single amount used to sit, so nothing has to be relearned. Per Department is a
     table you scan by total first; this is three lines that add up. */
  /* ⚠️ TWO TRACKS BY DEFAULT, FOUR WHILE ITEMIZING, and the TOTAL column is the last track
     in both — so the figure you read most lands on the same right edge whether the breakdown
     is showing or not, and toggling VAT adds columns to its left rather than moving it. */
  .budget-scope-row{display:grid; grid-template-columns:minmax(0,1fr) 84px;
    align-items:baseline; gap:0 10px;
    padding:3px 0; cursor:pointer; border-bottom:1px solid var(--line);
    font-family:var(--body); font-size:var(--fs-meta);}
  .budget-scope-row.itemized{grid-template-columns:minmax(0,1fr) 84px 68px 84px;}
  /* the counts row (money off) has one cell where the figures go, so it spans them */
  .budget-scope-row .budget-scope-count{grid-column:2 / -1; text-align:right;}
  .budget-scope-ex, .budget-scope-vat{text-align:right; white-space:nowrap; color:var(--muted);
    font-variant-numeric:tabular-nums;}
  /* ex-VAT is the figure you work from, so it carries the brand colour the headline's own
     ex-VAT line does — the two are the same fact at two scales */
  .budget-scope-ex{color:var(--tape);}
  /* the column headings: the same uppercase label type the rest of the banner uses, and not
     a control — clicking a scope row is a toggle, and this row must not look like one */
  .budget-scope-head{cursor:default; font-family:var(--label); font-size:10px;
    letter-spacing:1.1px; text-transform:uppercase; color:var(--muted); padding-bottom:2px;}
  .budget-scope-head:hover{color:var(--muted);}
  .budget-scope-row:last-child{border-bottom:none;}
  .budget-scope-row:hover{color:var(--tape);}
  .budget-scope-row:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .budget-scope-name{white-space:nowrap;}
  .budget-scope-amt{font-weight:600; white-space:nowrap; text-align:right;
    font-variant-numeric:tabular-nums;}
  /* what the row says with the money hidden. Body font and muted, NOT the amount's Oswald
     600 — it is a description of the phase, not a figure standing where a figure was, and
     matching the money's weight would invite reading it as one. */
  .budget-scope-count{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; color:var(--muted); white-space:nowrap;}
  /* off ≠ gone: the line stays, greyed, so "switched off" and "nothing booked" read
     differently. Not display:none, and not a strikethrough — this is a state, not a deletion. */
  /* off ≠ gone, and off ≠ blank: the figure STAYS and fades with its own label, at the
     one opacity, so an excluded phase still tells you what including it would add. */
  .budget-scope-row.off{opacity:.38;}
  /* Est. Costs is a look, not a sum — italic, and never bold, so it can't be mistaken
     for one of the figures that adds into the total beside it */
  .budget-est-costs{font-style:italic; color:var(--muted);}
  /* ⚠️ A multi-role person is several ROWS (one per entry). The rule between them is
     dropped and the name left blank on the continuations, so the block reads as one
     human with two lines rather than two people who happen to share a name. The rule
     under the LAST of their rows stays — that one separates them from the next person. */
  .budget-same-person td{border-top:none;}
  tr:has(+ .budget-same-person) td{border-bottom:none;}
  /* ---- catering summary ----
     The total leads the block: it's the number you came for, and it used to sit under a
     six-column grid, below the fold. */
  .csm-total{font-size:var(--fs-meta); color:var(--muted); margin-bottom:10px;}
  .csm-total strong{font-family:var(--body); font-size:18px; color:var(--text); margin-left:6px;}
  /* the cost column is inputs, so it needs a real width where the day columns can stay
     as narrow as their numbers */
  .csm-cost-head{width:96px;}
  .csm-cost-cell{width:96px;}
  .csm-cost-cell input{width:80px; text-align:left;}
  /* Dietaries / Specials are sub-tables INSIDE the summary block, so they take a quieter
     heading than the block's own — the same label type as a column header, not an h2 */
  .csm-subhead{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin:18px 0 4px;}
  /* the note and its pencil are one unit: the pencil sits at the END of the text rather
     than in a column of its own, so a short note doesn't leave the icon stranded */
  .csm-note{display:inline-flex; align-items:flex-start; gap:4px;}
  .csm-note .icon-btn{flex:0 0 auto;}

  /* AI Scan (Phase AI Scan) — the first chat UI in the app. Deliberately NOT
     rounded chat bubbles: this app's whole visual language is ruled lines and
     flat paper-form boxes, so a turn is a left-border-flagged block instead of
     importing a generic chat look that would clash with everything else. */
  .ai-chat{max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    padding:2px 2px 2px 0; margin-bottom:10px;}
  .ai-turn{border-left:2px solid var(--line); padding-left:12px;}
  .ai-turn-assistant{border-left-color:var(--tape);}
  .ai-turn-role{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  .ai-turn-assistant .ai-turn-role{color:var(--tape);}
  .ai-bubble-text{font-size:var(--fs-field); line-height:1.5;}
  .ai-bubble-file{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-meta);
    color:var(--muted); background:var(--panel-2); border-radius:20px; padding:3px 10px; margin-top:4px;}
  .ai-card{border:1px solid var(--tape); border-radius:var(--box-radius); padding:var(--box-pad);
    margin-top:8px; background:var(--tint-1);}
  .ai-card-resolved{border-color:var(--line); background:none; opacity:.72;}
  .ai-match-banner{display:flex; align-items:center; gap:8px; font-size:var(--fs-meta);
    margin-bottom:10px; cursor:pointer;}
  .ai-card-status{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--muted); margin-top:8px;}
  /* G17 — pre-line so a multi-file attach can report one line per failed file
     rather than only the last one. Single-line errors are unaffected. */
  .ai-error{border:1px solid var(--danger); color:var(--danger); border-radius:var(--box-radius);
    padding:9px 11px; font-size:var(--fs-meta); margin-bottom:10px; white-space:pre-line;}
  /* R14 — "no API key set". Deliberately NOT .ai-error red: nothing has gone wrong
     and nothing the user did caused it; it's a setup step they're being told about
     before they waste a message on it. Amber, informational. */
  .ai-notconfigured{border:1px solid rgba(180,120,10,.45); background:rgba(180,120,10,.07);
    color:#7a5200; border-radius:var(--box-radius); padding:10px 12px;
    font-size:var(--fs-meta); line-height:1.5; margin-bottom:10px;
    display:flex; align-items:flex-start; gap:8px;}
  .ai-notconfigured code{font-family:var(--mono); font-size:11.5px;
    background:rgba(180,120,10,.14); padding:1px 5px; border-radius:3px;}
  .ai-notconfigured .ic, .ai-notconfigured svg{flex:0 0 auto;}
  /* R13 — an active Inverse flips what the whole list means, so the toggle says so
     rather than leaving it to a tick buried in the open panel. */
  .filter-inverted{font-family:var(--label); font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--danger); border:1px solid var(--danger);
    border-radius:3px; padding:0 4px; margin-left:4px; vertical-align:1px;}
  /* R17 — the undo toast. Sits above everything, bottom-left so it never covers the
     primary actions on the right, and stays out of the mobile drawer's way. */
  .undo-toast{position:fixed; left:18px; bottom:18px; z-index:900; display:flex; align-items:center; gap:14px;
    background:var(--text); color:#FBFAF8; border-radius:8px; padding:11px 14px;
    font-family:var(--body); font-size:var(--fs-meta); box-shadow:0 6px 22px rgba(0,0,0,.28);
    max-width:min(420px, calc(100vw - 36px));}
  .undo-toast .undo-action{font-weight:600; color:var(--tape-light); cursor:pointer; white-space:nowrap;}
  .undo-toast .undo-action:hover{text-decoration:underline;}
  .undo-toast .undo-close{cursor:pointer; opacity:.6; display:inline-flex;}
  .undo-toast .undo-close:hover{opacity:1;}
  .undo-toast svg{width:13px; height:13px;}
  @media(max-width:600px){ .undo-toast{left:12px; right:12px; bottom:12px; max-width:none;} }
  /* G11 — the save-failure banner. Top-centre and persistent, not bottom-left and
     timed like .undo-toast: the undo toast is an offer that expires, this is a
     statement of fact that stays true until the save succeeds. Amber for "not
     saved yet" (nothing lost, same informational register as .ai-notconfigured),
     red for "your change was not saved" (data is actually gone). */
  .save-banner{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:950;
    display:flex; align-items:flex-start; gap:14px;
    background:#FBF6E9; border:1px solid rgba(180,120,10,.55); color:#5f4100;
    border-radius:8px; padding:11px 13px; font-family:var(--body); font-size:var(--fs-meta);
    line-height:1.5; box-shadow:0 6px 22px rgba(0,0,0,.22);
    max-width:min(620px, calc(100vw - 28px));}
  .save-banner-lost{background:#FBEDEA; border-color:var(--danger); color:#6d2114;}
  .save-banner-text{flex:1 1 auto;}
  .save-banner-detail{font-family:var(--mono); font-size:11px; opacity:.75; margin-top:5px;
    word-break:break-word;}
  .save-banner button.small{flex:0 0 auto; margin-top:1px;}
  .save-banner-close{cursor:pointer; opacity:.6; display:inline-flex; margin-top:2px;}
  .save-banner-close:hover{opacity:1;}
  .save-banner svg{width:13px; height:13px;}
  @media(max-width:600px){ .save-banner{left:12px; right:12px; transform:none;
    max-width:none; flex-wrap:wrap;} }
  /* the inline counterpart — a status span that is reporting a failure, not "Saved" */
  .status-failed{color:var(--danger); font-weight:600;}
  .ai-attachments{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .ai-input-row{display:flex; align-items:center; gap:8px;}
  .ai-input-row input[type=text]{flex:1;}

  /* ============================================================
     MOBILE / TABLET
     ============================================================ */
  @media(max-width:900px){
    /* --- slide-out drawer nav --- */
    .topbar{
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;
      background:var(--side-bg); color:var(--side-text); padding:10px 12px;
      border-bottom:1px solid var(--side-line);
    }
    .topbar .burger{
      background:transparent; border:1px solid var(--side-line); color:var(--side-text);
      width:44px; height:44px; min-width:44px; border-radius:9px; font-size:17px; line-height:1;
      display:flex; align-items:center; justify-content:center; padding:0;
    }
    .topbar .burger:hover{border-color:var(--tape-light);}
    .topbar .tb-title{font-family:var(--disp); font-weight:700; font-size:16px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;}
    .topbar .tb-dot{width:9px; height:9px; border-radius:2px; background:var(--tape); transform:rotate(45deg); flex:0 0 auto;}

    .app{display:block;}
    .side{
      position:fixed; top:0; left:0; bottom:0; z-index:60;
      width:82vw; max-width:300px; height:100vh; height:100dvh;
      transform:translateX(-102%); transition:transform .22s ease;
      border-right:1px solid var(--side-line); padding:16px 14px 40px;
      box-shadow:4px 0 24px rgba(0,0,0,.3);
    }
    .side.open{transform:translateX(0);}
    .scrim{
      display:block; position:fixed; inset:0; z-index:50;
      background:rgba(17,10,8,.5); opacity:0; pointer-events:none; transition:opacity .22s ease;
    }
    .scrim.open{opacity:1; pointer-events:auto;}
    .main{padding:14px 13px 96px;}

    /* bigger tap targets throughout the drawer */
    .side-item, .side-proj{padding:11px 12px; font-size:15px;}
    .side-proj .code{font-size:12px; margin-top:2px;}
    .side-new{padding:11px 12px; font-size:14px;}
    .side-label{font-size:11px; margin:18px 6px 7px;}

    /* --- form controls: 16px stops iOS auto-zoom on focus --- */
    input[type=text], input[type=date], textarea, select{
      font-size:16px; padding:11px 11px; min-height:46px;
    }
    textarea{min-height:80px;}
    label{font-size:12px; margin-bottom:5px;}
    /* Inline label columns go back to stacked on narrow screens — a fixed 104px
       label column leaves too little room for the control on a phone. */
    .grid:not(.g3) > div:has(> label:first-child){display:block;}
    .grid:not(.g3) > div:has(> label:first-child) > label{margin-bottom:5px;}
    .grid:not(.g3) > div:has(> label:first-child):has(> textarea) > label{padding-top:0;}

    /* --- buttons: 44px minimum touch target --- */
    button{font-size:15px; padding:12px 16px; min-height:46px;}
    .icon-btn{width:40px; height:40px; font-size:14px; min-height:0;}
    select.pill-select{font-size:12px; padding:5px 22px 5px 10px; max-width:150px;}
    button.small{font-size:14px; padding:10px 13px; min-height:44px;}
    .toolbar{gap:10px;}
    .toolbar button{flex:1 1 auto;}

    /* --- everything in one column --- */
    .grid.g2, .grid.g3{grid-template-columns:1fr;}
    /* tech specs + camera rows stack on mobile */
    /* .ts-grid already flows and wraps; nothing to override on mobile */
    .cam-row{grid-template-columns:1fr; gap:8px;}

    /* --- Phase BP: schedule / location / position rows stay ROWS ---
       These used to become stacked cards (one field per line, a control strip along
       the top). A row that is a row on desktop is now a row on a phone too: the
       columns keep their desktop meaning and the list scrolls sideways to reach the
       ones that don't fit, exactly the way Budget's tables already behaved. Each
       list gets its own scrollport (.rows-sched / .rows-add / #rows-posn), and the
       rows inside get width:max-content so their own borders and fills span the
       whole row rather than stopping at the viewport edge. */
    .rows-sched, .rows-add, #rows-posn{
      overflow-x:auto; -webkit-overflow-scrolling:touch;
    }
    /* the insert-a-row hint hangs above its row and would be clipped by the
       scrollport, so the schedule reserves a little padding for it */
    .rows-sched{padding-top:8px;}
    .rows-sched .row, .rows-add .row, .crewrow-select{
      width:max-content; min-width:100%;
    }
    /* Slightly wider than desktop so 16px form text (the iOS no-zoom size) fits,
       and the reorder arrows get a real tap target instead of a 20x14 sliver. */
    .rows-sched .row{grid-template-columns:26px 34px 132px 104px 220px 42px; align-items:center;}
    .rows-sched .row input[type=text]{padding:9px 8px; min-height:42px;}
    .rows-sched .row .sc-select{width:20px; height:20px;}
    .sc-move .icon-btn{width:30px; height:21px;}
    .sc-move .ic{width:13px; height:13px;}
    /* "insert a row here" is hover-revealed on desktop, which touch can never do,
       so on mobile it is permanently visible. Moved out to the far left and centred
       on the dashed divider it acts on, rather than desktop's position over the Time
       column — always-on, it would otherwise sit on top of every time field. */
    .sched-insert-hint{opacity:1; top:-18px; left:1px; width:20px; height:20px;}
    .sched-insert-hint span{width:20px; height:20px; font-size:13px;}
    .sched-shift{flex-wrap:wrap; width:100%; justify-content:flex-start;}
    .rows-sched .row .rm{width:42px; min-width:0; padding:0 6px;}
    .rows-add .row{grid-template-columns:220px 220px 42px;}
    .rows-add .row .rm, .crewrow-select .rm{width:42px; min-width:0; padding:0 6px;}
    .crewrow-select{grid-template-columns:46px 230px 120px 42px;}

    /* --- tabs scroll horizontally rather than wrapping into stacks --- */
    /* The scrollbar is hidden, so without a cue a cut-off tab just looks clipped.
       The wrapper fades the right edge to signal "there's more this way", and the
       fade clears once you've scrolled to the end (.tabscroll-end, set in JS). */
    .tabs{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      scroll-snap-type:x proximity;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{padding:12px 15px; font-size:13.5px; white-space:nowrap; flex:0 0 auto; scroll-snap-align:start;}
    .tabscroll{position:relative;}
    .tabscroll::after{
      content:''; position:absolute; top:0; right:0; bottom:1px; width:34px; pointer-events:none;
      background:linear-gradient(90deg, rgba(255,255,255,0), var(--bg) 78%);
      opacity:1; transition:opacity .15s ease;
    }
    .tabscroll.tabscroll-end::after{opacity:0;}

    /* --- cards / lists --- */
    .section{padding:14px 13px;}
    .card{padding:16px 14px;}
    .list-card{align-items:flex-start; padding:12px;}
    .list-card .actions{width:100%; margin-top:4px;}
    .list-card .actions button{flex:1 1 auto;}
    .page-head h1{font-size:22px; line-height:1.2;}
    .page-head{margin-bottom:14px;}


    /* --- Phase BP: the six Crew sub-tabs stay a MATRIX on mobile ---
       ⚠️ This replaces the stacked-card treatment every one of these grids used to
       get (each person a bordered card, day cells reflowed into a wrapping row of
       labelled D1/D2/… chips, header rows hidden, .tablewrap's overflow switched
       off). The cards read fine in isolation but broke the one thing the Crew tab
       is for — comparing people down a column — and made a 13-person department a
       very long scroll. Rows now keep their desktop columns at every width and the
       list scrolls SIDEWAYS to reach what doesn't fit, the same behaviour Budget's
       tables already had. Header rows come back for the same reason: once the day
       label is a column heading, it doesn't need repeating in every cell.

       The leading columns tighten so more of a row is on screen before you have to
       scroll — same three shared tokens, smaller values, so Controls/Name/Role still
       line up across all six sub-tabs exactly as Phase BO set them. The sizes are
       picked so the leading columns end at 310px on a 375px phone: the FIRST day
       column then pokes ~25px into view at rest, which is the whole scroll cue.
       Sum them to 335 or more and the row looks like it simply has no day columns. */
    :root{--pb-controls-w:50px; --pb-name-w:126px; --pb-role-w:104px;}
    /* width:max-content (not the scrollport's width) is what lets a row's own
       border/fill span the WHOLE row instead of stopping at the viewport edge;
       min-width:100% keeps a short row filling the width when it fits. The
       trailing minmax(0,1fr) column collapses to 0 under max-content, which is
       what we want here — spare width belongs at the end of a scrolling row. */
    .tablewrap .crewgrid, .tablewrap .roles-grid, .tablewrap .prep-grid,
    .tablewrap .person-block, .tablewrap .dept-group{width:max-content; min-width:100%;}
    /* …with one exception: the edit form a person block expands into is a FORM, not
       a row. Left to inherit the block's max-content width it would be ~700px of
       sideways-scrolling text fields. 100cqw is the scrollport's own width (hence
       container-type on .tablewrap), and sticky left:0 keeps the form in view
       wherever the rows happen to be scrolled to. */
    .tablewrap{container-type:inline-size;}
    .pb-editform, .crewgrid-editform{position:sticky; left:0; width:100cqw;}
    /* The department heading is narrower than the rows it labels, so it pins to the
       left edge of the scrollport rather than sliding away as you scroll across.
       (Its class is .subhead.dept-toggle — there is no .dept-head.) */
    .tablewrap > .dept-toggle{position:sticky; left:0; width:calc(100% - 2px);}
    /* THE CONTROLS + NAME COLUMNS PIN. Without this the whole point of the matrix
       goes: you scroll right to reach D4 and no longer know whose row you are
       ticking, or how to select/edit them. Role is NOT pinned — pinning all three
       leading columns would leave 9px of day column on a 375px screen.
       --pb-pin-w is exactly Controls + gap + Name, so every row-level mask below
       lands on the same edge whatever the sub-tab. */
    :root{--pb-pin-w:186px;}   /* 50 + 10 + 126 */
    /* Pinned cells need an opaque fill, because rows are transparent — hence --bg,
       with the editing tint re-composited on top via background-image so an open
       row doesn't punch a white hole in itself. align-self:stretch, not the grid's
       default centring: the fill has to cover the row's FULL height or the day
       cells show through above and below it. And .crewgrid-controls is widened to
       60px — 10px past its own 50px track — so the column gap behind it is covered
       too, rather than leaving a 10px slot of scrolling content between the two. */
    .crewgrid-controls, .roles-grid-controls, .prep-controls, .pb-head-blank{
      position:sticky; left:0; z-index:2; background:var(--bg);
      align-self:stretch; width:60px;
    }
    .crewgrid-row-name, .roles-grid-name, .prep-name, .pb-head-name{
      position:sticky; left:60px; z-index:2; background:var(--bg);
      align-self:stretch; display:flex; align-items:center;
      padding-right:6px; box-shadow:6px 0 6px -6px rgba(17,10,8,.16);
    }
    /* Rows with no Controls/Name cells of their own still need the same mask, or
       their day cells slide out into the pinned strip: Catering's meal-row label and
       the Locations day-grid header's corner both SPAN the three leading columns, so
       they get an explicit --pb-pin-w width rather than their natural span; a stacked
       extra-role row has nothing there at all, so it grows a mask from ::before
       (a grid container's pseudo-element is a grid item like any other).
       ⚠️ Since Phase BR the six Crew sub-tabs' header rows no longer use
       .crewgrid-corner — they carry real .pb-head-blank/.pb-head-name cells that pin
       on the rules above. Locations is the last caller of the spanning corner. */
    .crewgrid-header-row .crewgrid-corner, .meal-row-label-wrap, .pb-role-row::before{
      position:sticky; left:0; z-index:2; background:var(--bg);
      align-self:stretch; width:var(--pb-pin-w);
      box-shadow:6px 0 6px -6px rgba(17,10,8,.16);
    }
    .pb-role-row::before{content:''; grid-column:1/3;}
    /* .crewgrid-name-span is the Locations day-grid's name cell, which has no
       Controls cell beside it and spans all three leading columns (grid-column:1/4).
       Left alone it would pin 326px wide and swallow the screen, so it pins from 0
       at the same --pb-pin-w edge as everything else — and stays display:block,
       since it stacks a name over an address rather than holding one flex line. */
    .crewgrid-name-span{left:0; width:var(--pb-pin-w); display:block; overflow:hidden;
      padding:2px 6px 2px 0;}
    .crewgrid-name-span .hint{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .person-block-editing :is(.crewgrid-controls, .roles-grid-controls, .prep-controls,
      .crewgrid-row-name, .roles-grid-name, .prep-name, .meal-row-label-wrap),
    .person-block-editing .pb-role-row::before{
      background-image:linear-gradient(var(--tint-2), var(--tint-2));
    }
    /* Bigger day cells: the desktop 16px checkbox is nowhere near a touch target,
       so the checkbox GROWS to fill its column — the whole ~38x34 cell is the
       control. Deliberately still the app's own checkbox (bordered box, "×" when
       ticked), not the solid-fill chip the old stacked layout invented: six days
       across thirteen people is a lot of rows, and a wall of filled blocks is much
       harder to read down a column than a wall of ×s. No data-day label on the cell
       any more either — the restored header row carries it once, at the top. */
    .crewgrid-check input{width:100%; height:34px; border-radius:4px;}
    .crewgrid-check input::after{font-size:22px;}
    .meal-subrow .meal-cell input{width:100%; height:26px;}
    .meal-subrow .meal-cell input::after{font-size:17px;}
    /* The in-row number fields keep the 16px iOS-no-zoom size but not the 46px
       form-control padding, which would blow a 118px Rate column wide open.
       ⚠️ Written as input.budget-rate-input, not .budget-rate-input — the global
       input[type=text] rule outranks a bare class (0,1,1 vs 0,1,0), which is why
       these fields were rendering at width:100% of whatever cell held them and
       clipping "450" to "45" in the Budget tables. */
    input.budget-rate-input{width:76px; padding:6px 7px; min-height:34px;}
    .prep-fields input.budget-rate-input{width:76px;}
    .prep-header-fields span{width:76px;}   /* follows .prep-fields' mobile width */
    /* …and the column that holds them has to grow by the same amount, or the second
       input is clipped by its own track. 76 + 10 gap + 76. Desktop value is 130px. */
    :root{--pb-phase-fields-w:162px;}
    .prep-calcell{justify-content:flex-start;}
    .prep-cal{max-width:100%;}
    .prep-cal-day{height:34px;}

    /* --- Phase BQ: ONE row height across all six sub-tabs, on mobile too ---
       Phase BO settled the six sub-tabs onto a shared 33px row on desktop. Phase BP
       reinstated the rows on mobile but let each tab's own tallest control set the
       height, so they drifted apart again: Roles 46px (the "Show as" field taking the
       generic 46px mobile form-control height), Travel 48px (its <select>, same
       reason), Days/Hotel 44px (the "All" button picking up button.small's 44px
       floor), Pre-production and Catering 40px (a 40px .icon-btn).

       40px is the floor here rather than desktop's 33px because a 40px .icon-btn is
       the one thing in these rows that must NOT shrink — it is the tap target for
       the pencil, the trash and the calendar. Everything that was overshooting it is
       brought back to 34px, which is still a comfortable touch height for a field.
       Rows still grow past 40px for genuine content (a prep counter, a wrapped role
       chip) exactly as Phase BO's follow-up decided — this is a floor, not a cap. */
    .pb-head, .pb-role-row{min-height:40px;}
    /* the three that were overshooting. All written to out-specify a type-or-
       attribute selector (input[type=text] / button.small), not just a bare class. */
    .roles-grid-showas input[type=text]{min-height:34px; padding:6px 7px;}
    .crewgrid select, .prep-grid select, .roles-grid select{min-height:34px; padding:6px 20px 6px 8px;}
    button.small.all-toggle-btn{min-height:0; padding:0 4px;}

    /* --- position assignment rows --- */
    .posn-dept-badge{justify-self:start; padding:5px 10px;}
    .posn-row .posn-call{max-width:none;}

    /* --- crew identity pills wrap instead of squashing --- */
    .crew-ident-pills{gap:5px;}
    select.pill-select{max-width:100%;}

    /* --- preview tables scroll instead of squashing --- */
    .card table{font-size:13px;}
    .key-info-grid{grid-template-columns:1fr; gap:14px;}
    pre#waText{font-size:13px; max-height:340px;}
    .mapembed{height:200px;}

    /* --- misc readability --- */
    .formgroup{padding:13px 11px;}
    .hint{font-size:13px;}
    .empty-note{font-size:14px;}
    .private-note{font-size:12.5px; padding:9px 11px;}
    .srlist{max-height:250px;}
    .sritem{padding:12px 11px; font-size:14px;}
    .subhead{font-size:12px;}
    /* Phase BU — the banner's zones stack on a phone. The fixed TOTALS width exists to stop
       STAGE moving between views on a wide screen; in one column there is no sideways
       position left to hold, so it is released rather than forcing a 450px column to
       scroll. TOOLS goes left-aligned here — right-aligned against the screen edge with
       nothing beside it reads as a stray. */
    /* ⚠️ NO FROZEN-PANE BOX ON A PHONE. The banner is tall here, so the measured box hits its
       240px floor and lands below the fold — a cramped nested scroller inside a page that also
       scrolls, which is worse than what it replaced. Released back to the horizontal-only
       scroll the mobile rules further down already handle, where Controls and Name pin and the
       PAGE scrolls vertically. The frozen header is a desktop affordance; on a phone you are
       scrolling one row at a time anyway. sizeRolesTablewrap() bails out at this width too. */
    .roles-tablewrap{max-height:none; overflow-x:auto; overflow-y:visible;}
    .roles-tablewrap .roles-grid-header-row{position:static;}
    .phase-banner{grid-template-columns:minmax(0,1fr);
      grid-template-areas:"totals" "stage" "tools"; gap:14px 0;}
    .bnr-totals{gap:22px; flex-wrap:wrap;}
    .phase-banner .budget-scope-stack{width:100%;}
    /* Budget stays last in its row on mobile too, so it keeps holding one position — but the
       rows go flush LEFT, since right-aligned against the screen edge with nothing beside
       them reads as a stray. */
    .bnr-tools{align-items:flex-start; gap:8px;}
    .bnr-toolrow{justify-content:flex-start;}

    /* --- sticky save bar on the shoot-day editor --- */
    .toolbar.sticky-actions{
      position:sticky; bottom:0; z-index:30; margin:16px -13px 0;
      padding:11px 13px calc(11px + env(safe-area-inset-bottom));
      background:var(--bg); border-top:1px solid var(--line);
      box-shadow:0 -4px 16px rgba(17,10,8,.08);
    }
  }

  @media(max-width:420px){
    .page-head h1{font-size:20px;}
    .card .line1{font-size:19px;}
    .main{padding:12px 11px 96px;}
    .section{padding:13px 11px;}
  }
</style>

<!-- Supabase: loaded as a classic (non-module) script so it runs synchronously in document
     order, before the app script below touches it. This is Supabase's own documented
     "vanilla JS, no build step" pattern — no npm install needed. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* single client instance, reused by every loadDB/saveDB call */
const sb = supabase.createClient(
  'https://ioueoaasqnseuhrtzhbz.supabase.co',
  'sb_publishable_roKbOQwNFveMHtT0OeJk5A_R1jvrKdr'

<script>
/* ============================================================ STATE + STORAGE */
const COMPANY = 'Little Film Productions';

/* ============================================================ APP SETTINGS (Phase Q)
   Font + brand colour for the call sheet output and the app chrome, persisted to
   'db:settings' like every other collection. Deliberately NOT multi-tenant: the
   company is still the hardcoded COMPANY above, and there is no logo/company-detail
   upload — that's parked until the app opens up beyond Little Film Productions.

   Everything here works by writing the SAME CSS custom properties the stylesheet
   already declares in :root (--disp, --tape, --tape-light, --tint-1..6) onto
   documentElement, so no rule needs to know settings exist. That is also why the two
   former hand-written rgba(1,119,86,…) one-offs became --tint-5/--tint-6: a token
   that isn't a token can't follow the brand colour. */
const FONT_CHOICES = {
  fraunces:  { label:'Fraunces (default — stands in for Moret)', stack:"'Fraunces', Georgia, serif" },
  oswald:    { label:'Oswald (the real brand font)',             stack:"'Oswald', sans-serif" },
  jost:      { label:'Jost (stands in for Futura PT)',           stack:"'Jost', 'Futura PT', sans-serif" },
  georgia:   { label:'Georgia (system serif)',                   stack:"Georgia, 'Times New Roman', serif" },
  helvetica: { label:'Helvetica / Arial (system sans)',          stack:"'Helvetica Neue', Helvetica, Arial, sans-serif" },
};
/* Only families already in the Google Fonts request on line 8 (plus two system stacks)
   are offered — adding a family here means adding it to that <link> too, or it renders
   as the fallback and nobody notices.
   R15: this pool now feeds all THREE font roles, not just headings — hence the rename
   from HEADER_FONTS. The three roles are the same three the design system has always
   had (Fraunces display / Oswald label / Jost body); settings just makes each one
   choosable instead of only the first. `headerFont` keeps its original key so
   settings saved before R15 still load. */
/* ⚠️ `rolesColumnOrder` is null, NOT [] — the default is shared by every Object.assign that
   builds appSettings, so an array here would be one array handed to every caller and a
   push() anywhere would rewrite the default. Nothing mutates it in place (every save
   assigns a fresh array), and null reads as "no custom order" without a length check. */
const SETTINGS_DEFAULTS = { headerFont:'fraunces', labelFont:'oswald', bodyFont:'jost',
                            brand:'#017756', brandLight:'#0FA47A', rolesColumnOrder:null };
let appSettings = Object.assign({}, SETTINGS_DEFAULTS);

function hexToRgbTriple(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return null;
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].join(',');
}
/* the six tint levels, all derived from one brand colour */
const TINT_ALPHAS = [.03, .05, .10, .14, .35, .28];
function applyAppSettings(){
  const root = document.documentElement.style;
  // Same mechanism as before, three times: write the token the stylesheet already
  // declares, so no CSS rule needs to know settings exist.
  const stackFor = (key, fallback) => (FONT_CHOICES[appSettings[key]] || FONT_CHOICES[fallback]).stack;
  root.setProperty('--disp',  stackFor('headerFont','fraunces'));
  root.setProperty('--label', stackFor('labelFont','oswald'));
  root.setProperty('--body',  stackFor('bodyFont','jost'));
  const brand = appSettings.brand || SETTINGS_DEFAULTS.brand;
  const light = appSettings.brandLight || SETTINGS_DEFAULTS.brandLight;
  root.setProperty('--tape', brand);
  root.setProperty('--tape-light', light);
  const triple = hexToRgbTriple(brand);
  if(triple) TINT_ALPHAS.forEach((a,i)=>root.setProperty('--tint-'+(i+1), `rgba(${triple},${a})`));
}
async function saveAppSettings(){ await saveDB('db:settings', appSettings); }
async function setSetting(field, value){
  appSettings[field] = value;
  applyAppSettings();
  await saveAppSettings();
}
async function resetAppSettings(){
  appSettings = Object.assign({}, SETTINGS_DEFAULTS);
  applyAppSettings();
  await saveAppSettings();
  renderMain();
}
const DEPARTMENTS = ['Production','Client','Talent','Cinematography','Audio','Grip','Equipment','Set','Vanities','Catering & Travel','Post Production','Other'];
const DEPARTMENT_CODES = {
  'Production':'PROD', 'Client':'CLIENT', 'Talent':'TALENT', 'Cinematography':'CIN', 'Audio':'AUD',
  'Grip':'GRIP', 'Equipment':'EQUIP', 'Set':'SET', 'Vanities':'HMUC', 'Catering & Travel':'CAT/TRA',
  'Post Production':'POST', 'Other':'—'
};
/* ⚠️ SUB-DEPARTMENTS ARE GONE (see migrateDropSubDepartments). SUBDEPARTMENTS_BY_DEPT,
   subDeptsFor(), db:subdepartments, the c.subDepartment field on crew records, the
   matching field on project entries and day overrides, the crew-form input, the
   Group by → Sub-department option and the day-override picker's nested options were
   all removed together. A department plus a role's seniority rank is the whole
   structure now. Most of what sub-departments were used for ("Runner", "1st AC",
   "Boom Op", "Colourist") are ROLES, and exist as roles — which is why nothing needed
   re-homing. Don't reintroduce a second level here without deciding what it means that
   roles don't already cover. */
/* canonical roles a person can be booked as, grouped per department (extensible at
   runtime, persisted to db:roles) — a crew member can hold several of these at once
   (c.roles, folder-path strings like "Cinematography/DOP"); c.role stays the single
   free-text title shown everywhere on the call sheet, and picking a saved role just
   sets it quickly instead of retyping. */
let ROLES_BY_DEPT = {
  'Production':        ['Director','Executive Producer','Line Producer','Field Producer','Producer','Production Manager','Production Coordinator','PA','Runner'],
  'Talent':            ['Presenter','Host','Guest','Contributor','Cast'],
  'Cinematography':    ['DOP','1st AC','2nd AC','Camera Operator','Loader','Focus Puller'],
  'Audio':             ['Sound Mixer','Sound Recordist','Boom Operator'],
  'Grip':              ['Gaffer','Best Boy','Grip','Rigger'],
  'Equipment':         ['Equipment Manager','Kit Tech'],
  'Set':               ['Set Designer','Art Director','Props'],
  'Vanities':          ['HMUA','Hair Stylist','Costume/Wardrobe'],
  'Catering & Travel': ['Chef','Caterer','Driver','Travel Coordinator'],
  'Post Production':   ['Editor','Colourist','DIT','Assistant Editor'],
};
function rolesFor(dept){ return ROLES_BY_DEPT[dept] || []; }
/* per-role seniority rank within a department (e.g. DOP outranks 1st AC outranks
   Camera Operator), used to order Position Assignments and the call sheet output
   within a department — extensible at runtime, persisted to db:roleseniority.
   Keyed by "Department/Role" path. Falls back to the role's position in
   ROLES_BY_DEPT[dept] (so freshly-added canonical roles sort sensibly with no
   admin action needed), then Infinity for a role not found at all. */
let ROLE_SENIORITY = {};
function roleSeniorityRank(dept, role){
  if(!role) return Infinity;
  const key = dept+'/'+role;
  if(ROLE_SENIORITY[key]!=null) return ROLE_SENIORITY[key];
  const i = (ROLES_BY_DEPT[dept]||[]).indexOf(role);
  return i===-1 ? Infinity : i*10;
}
/* move a role up/down in its department's seniority order (dir -1 = more senior,
   +1 = less senior), then renumber every role in that department sequentially so

/* ============================ SWAP FOR ======================================
   Replace the PERSON on this booking, keeping the booking.

   ⚠️ WHY THIS IS SMALL: the entry IS the booking. Role, department, rate, buyout,
   show-as, prep days, edit days and every shoot-day position are keyed by ENTRY id, so
   pointing e.crewId at someone else carries all of it across with nothing to copy. Only
   the three PERSON-keyed logistics — hotel nights, catering meals, travel method — are
   filed under crewId and have to be moved by hand. That split is the whole design; know
   which side a thing is on before adding to either.

   ⚠️ THE OLD PERSON MAY STILL BE ON THE JOB. If they hold another entry, their bed,
   lunches and lift belong to that one and must NOT be cleared — the swap only takes the
   logistics away when this was their LAST entry, and that is decided BEFORE the swap or
   the answer changes underneath us.
   ⚠️ THE NEW PERSON MAY ALREADY BE ON THE JOB. Their own hotel/catering/travel is never
   overwritten; copying only fills what they do not already have, so swapping someone
   into a second role cannot quietly rewrite their first.
   ⚠️ Only offers a toggle for something that EXISTS — a booking with no prep days
   shouldn't ask about prep days. */
let swapPickId = '';
let swapKeep = null;      // null = not yet initialised for this entry
function swapOptionsFor(entryId, p){
  const e = entryById(entryId, p); if(!e) return [];
  const days = projectDays();
  const prep = phaseDaysOf('preprod', entryId, p);
  const post = phaseDaysOf('post', entryId, p);
  const shoot = entryOnShoot(entryId, p) ? entryDayCount(entryId, days) : 0;
  const rate = resolveEntryRate(entryId, p);
  const hotelNights = days.filter(d=>(d.hotelNights||[]).includes(e.crewId)).length
                    + ((p.hotelNightBefore||[]).includes(e.crewId) ? 1 : 0);
  const meals = days.filter(d=>(d.cateringMeals||{})[e.crewId]).length;
  const travel = (p.travelMethods||{})[e.crewId] || '';
  const opts = [];
  if(rate.hasRate) opts.push({key:'rate',    label:`Day rate — ${budgetFmt(rate.rate)}${entryIsBuyout(entryId)?' (buyout)':''}`});
  if(prep)         opts.push({key:'prep',    label:`Prep days — ${prep}`});
  if(shoot)        opts.push({key:'shoot',   label:`Shoot days — ${shoot}`});
  if(post)         opts.push({key:'post',    label:`Post days — ${post}`});
  if(hotelNights)  opts.push({key:'hotel',   label:`Hotel — ${hotelNights} night${hotelNights===1?'':'s'}`});
  if(travel)       opts.push({key:'travel',  label:`Travel — ${travel}`});
  if(meals)        opts.push({key:'catering',label:`Catering — ${meals} day${meals===1?'':'s'} of meals`});
  return opts;
}
function rolesMenuSwapHTML(entryId, crewId, p){
  const opts = swapOptionsFor(entryId, p);
  if(swapKeep===null){ swapKeep = {}; opts.forEach(o=>swapKeep[o.key]=true); }   // like-for-like by default
  const others = crewDB.filter(c=>c.id!==crewId).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return `<div class="swap-pane">
    <label for="swapPick">Replace with</label>
    <select id="swapPick" onchange="setSwapPick(this.value)">
      <option value="">— Choose a crew member —</option>
      ${groupedCrewOptionsHTML(others)}
      <option value="__new__">+ Add someone new…</option>
    </select>
    ${opts.length ? `<div class="swap-keep">
      <div class="swap-keep-head">Carry over</div>
      ${opts.map(o=>`<label><input type="checkbox" ${swapKeep[o.key]?'checked':''} onchange="setSwapKeep('${o.key}', this.checked)"> ${esc(o.label)}</label>`).join('')}
    </div>` : '<div class="hint" style="margin-top:10px;">Nothing booked on this role yet — the swap just changes who holds it.</div>'}
    <div class="toolbar" style="margin-top:14px;">
      <button class="primary" ${swapPickId?'':'disabled'} onclick="confirmSwap('${entryId}')">Swap</button>
    </div>
    <div class="hint">The role, and anything left ticked, stays on this booking. ${esc((crewById(crewId)||{}).name||'They')} keeps everything on their other roles.</div>
  </div>`;
}
function setSwapPick(v){
  if(v==='__new__'){ swapPickId=''; closeRolesMenu(); toggleCrewForm(); return; }
  swapPickId = v; renderGlobalOverlay();
}
function setSwapKeep(k, on){ swapKeep = Object.assign({}, swapKeep, {[k]:on}); renderGlobalOverlay(); }
async function confirmSwap(entryId){
  const p = currentProject(); if(!p || !swapPickId) return;
  const e = entryById(entryId, p); if(!e) return;
  const oldId = e.crewId, newId = swapPickId;
  const oldName = (crewById(oldId)||{}).name || 'them', newName = (crewById(newId)||{}).name || 'them';
  const keep = swapKeep || {};
  const days = projectDays();
  const wasLastEntry = entriesForCrew(oldId, p).length === 1;
  if(!confirm(`Swap ${oldName} for ${newName} on ${e.role||'this role'}?`)) return;
  const snaps = beginUndo(['db:projects','db:shootdays']);
  // ---- the booking: ONE field, because everything else is keyed to the entry ----
  e.crewId = newId;
  if(!keep.rate){ delete e.rate; delete e.buyout; }
  /* ⚠️ Phase CF simplified this: dropping a phase is dropping its DAYS, full stop. It used to
     have to drop the membership list entry as well, or the new person turned up on the
     Pre-Prod tab with a blank count as though they had been booked for prep nobody had
     costed. With membership derived from the days, deleting the days IS taking them out. */
  if(!keep.prep && p.prepSchedule) delete p.prepSchedule[entryId];
  if(!keep.post && p.postSchedule) delete p.postSchedule[entryId];
  if(!keep.shoot){
    days.forEach(d=>{ if(Array.isArray(d.positions)) d.positions = d.positions.filter(pos=>pos[0]!==entryId); });
  }
  // ---- person-keyed logistics: moved by hand, never over the new person's own ----
  days.forEach(d=>{
    if(keep.hotel && (d.hotelNights||[]).includes(oldId) && !d.hotelNights.includes(newId)) d.hotelNights.push(newId);
    if(keep.catering && (d.cateringMeals||{})[oldId] && !(d.cateringMeals||{})[newId]){
      d.cateringMeals[newId] = Object.assign({}, d.cateringMeals[oldId]);
    }
    if(wasLastEntry){
      if(Array.isArray(d.hotelNights)) d.hotelNights = d.hotelNights.filter(id=>id!==oldId);
      if(d.cateringMeals) delete d.cateringMeals[oldId];
    }
  });
  if(keep.hotel && (p.hotelNightBefore||[]).includes(oldId) && !p.hotelNightBefore.includes(newId)) p.hotelNightBefore.push(newId);
  if(wasLastEntry && Array.isArray(p.hotelNightBefore)) p.hotelNightBefore = p.hotelNightBefore.filter(id=>id!==oldId);
  p.travelMethods = p.travelMethods || {};
  if(keep.travel && p.travelMethods[oldId] && !p.travelMethods[newId]) p.travelMethods[newId] = p.travelMethods[oldId];
  if(wasLastEntry) delete p.travelMethods[oldId];
  await saveDB('db:projects', projectsDB);
  await saveDB('db:shootdays', shootDaysDB);
  swapPickId = ''; swapKeep = null;
  closeRolesMenu();
  renderProjectBody();
  finishUndo(`${oldName} swapped for ${newName}`, snaps);
}
/* ---- "Also on this project as" ----
   The menu used to open on a two-role person and say "No other saved roles", which is
   true of their crew record and useless on a screen where they are visibly listed twice.
   What you actually want to know is where ELSE this person is booked, and to be able to
   get there. Role · stage · days, one line per other entry, and clicking it takes you to
   that row.
   ⚠️ Reads the same three sources the Roles row does — phaseDaysOf for prep and post,
   the shoot opt-in plus entryDayCount for the shoot — so it can never disagree with the
   row it sends you to. An entry booked in two stages lists both. */
function entryStageSummary(e, p){
  const out = [];
  const prep = phaseDaysOf('preprod', e.id, p);
  const post = phaseDaysOf('post', e.id, p);
  const shoot = entryOnShoot(e.id, p) ? entryDayCount(e.id, projectDays()) : 0;
  if(prep) out.push({stage:'Pre-Prod', days:prep});
  if(shoot) out.push({stage:'Production', days:shoot});
  if(post) out.push({stage:'Post', days:post});
  return out;
}
function rolesMenuAlsoListedHTML(entryId, crewId, p){
  const others = entriesForCrew(crewId, p).filter(e=>e.id!==entryId);
  if(!others.length) return '';
  return `<div class="also-listed">
    <div class="also-listed-head">Also on this project as</div>
    ${others.map(o=>{
      const stages = entryStageSummary(o, p);
      const dept = deptBucketKey(o.department);
      return `<div class="also-row" role="button" tabindex="0"
          onclick="goToRoleRow('${o.id}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToRoleRow('${o.id}');}"
          title="Go to this role">
        <span class="role-chip">${esc(o.role||'—')}</span>
        <span class="also-dept">${esc(DEPARTMENT_CODES[dept]||dept)}</span>
        <span class="also-stages">${stages.length
          ? stages.map(st=>`${esc(st.stage)} · ${st.days} day${st.days===1?'':'s'}`).join('  ·  ')
          : '<span class="budget-noRate">Not booked in any stage yet</span>'}</span>
      </div>`;
    }).join('')}

/* Close the menu, make sure the target row's department group is open, then scroll to it
   and flash it — a row three departments down that you were silently teleported to is
   indistinguishable from nothing having happened. */
function goToRoleRow(entryId){
  closeRolesMenu();
  const p = currentProject();
  const e = p && entryById(entryId, p);
  if(e){
    const dept = deptBucketKey(e.department);
    if(collapsedProjectDepts.has(dept)){ collapsedProjectDepts.delete(dept); renderProjectBody(); }
  }
  setTimeout(()=>{
    const el = document.getElementById('role-row-'+entryId);
    if(!el) return;
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({behavior: smooth?'smooth':'auto', block:'center'});
    el.classList.remove('role-row-flash');
    void el.offsetWidth;                 // restart the animation if it is already running
    el.classList.add('role-row-flash');
  }, 30);
}
/* ---- "Add new role" dialog (item 5) ----

   replacing the old two-prompt() flow. addRoleDialogFor is either a crew id
   (add straight onto that person, existing behaviour) or '__new__' (feeding
   the not-yet-saved crew-creation form's role picker instead).
   Phase BB — addRoleDialogThen is an optional continuation, called with the resulting
   "Department/Role" path once it's actually landed on c.roles. Only the roles menu's
   footer item passes one (to then apply the new role to an entry, per its active mode);

let addRoleDialogFor = null;

function openAddRoleDialog(forId, onAdded){ addRoleDialogFor = forId; addRoleDialogThen = onAdded||null; renderGlobalOverlay(); }

/* re-renders the persistent overlay (id="globalOverlay", outside #main) that hosts

function renderGlobalOverlay(){

/* ---- Dietary (general) ----

/* ---- the crew form's Rates section ----
   ONE LINE PER SAVED ROLE, because the rate is a fact about the role a person is doing,
   not about the person: a DOP who also operates is worth two different numbers and
   c.rate ("Fee / rate", still there, still the catch-all) can only hold one.

   ⚠️ These inputs save with the FORM, on Save crew member — not on change. Every other
   rate box in this app (Budget's, the Roles tab's) writes immediately, but those sit in
   a list, not inside a form with its own Save and Cancel. A field that had already
   written itself while Cancel was still on screen would be the trap; consistency with
   the box six lines up (Fee / rate) matters more here than consistency with the ones on
   another screen. collectRoleRates() is the read side, and it reads the DOM rather than
   any shadow state, so what you see is what saves.

   Labour is derived on every keystroke and is not an input — see the note on roleRateFor
   for why it is never stored. */
function crewRatesSectionHTML(c){
  const roles = (c && c.roles) || [];
  const vatReg = (c && c.vatRegistered)==='Yes';
  const rows = roles.map(rp=>{
    const rr = roleRateFor(c, rp) || {};
    const name = rp.includes('/') ? rp.split('/').slice(1).join('/') : rp;

    const rate = rr.rate!=null ? rr.rate : '';

      <span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input rr-kit" value="${esc(String(kit))}" placeholder="—" ${hasSplit?'':'disabled'} oninput="refreshRateRow(this)"></span>
      <span class="rr-labour">${hasSplit ? esc(fmtRateVat(labourOf(rate, kit))) : '—'}</span>
      <span class="rr-vat">${(vatReg && hasRate) ? esc(fmtRateVat(n*VAT_RATE)) : '—'}</span>

      </div>
    </div>

      <div class="rate-row rate-row-head">
        <span>Role</span><span>Day rate</span><span>Split</span><span>Kit</span><span>Labour</span><span>VAT</span><span>Inc VAT</span>
      </div>
      ${rows}
    </div></div>
    <div class="hint" style="margin-top:8px;">A rate here is used for that role ahead of Fee / rate below, and a project can still override it for one job. Kit is a fixed equipment charge — labour is whatever is left of the day rate, so the two always add up.</div>
    <div class="hint" style="margin-top:4px;">VAT is ${Math.round(VAT_RATE*100)}% of the whole day rate, kit included — it isn't apportioned, because the same rate applies to both halves. Shown only while VAT registered is Yes; every figure entered here is ex-VAT.</div>`
    : `<div class="hint">Rates are per role. Give this person a saved role above and a line will appear here for it.</div>`}

/* money for the rate rows only. Plain 2dp with no currency symbol, matching the bare
   numbers in the inputs beside them — budgetFmt()'s "£1,234.00" next to an unadorned
   "800" would read as two different kinds of number. */
function fmtRateVat(n){ return '£' + (Math.round(n*100)/100).toFixed(2); }
/* Recalculates ONE row in place — never a re-render, which would throw away whatever is
   half-typed in the rest of the form. Called from the rate box, the kit box and the
   split toggle, so all three routes land on the same arithmetic. */
function refreshRateRow(el){
  const row = el.closest('.rate-row'); if(!row) return;
  const split = row.querySelector('.rr-split').checked;
  const kitInput = row.querySelector('.rr-kit');
  kitInput.disabled = !split;
  if(!split) kitInput.value = '';
  const rateRaw = row.querySelector('.rr-rate').value.trim();
  const rate = Number(rateRaw);
  const kit = Number(kitInput.value);
  const hasRate = rateRaw!=='' && !isNaN(rate);
  row.querySelector('.rr-labour').textContent =
    (split && hasRate && !isNaN(kit)) ? fmtRateVat(labourOf(rate, kit)) : '—';
  /* ⚠️ Reads #ncVat LIVE rather than a value captured at render: the select sits in this
     same section and can be changed after the rows are on screen. */
  const vatReg = (val('ncVat')==='Yes');
  row.querySelector('.rr-vat').textContent = (vatReg && hasRate) ? fmtRateVat(rate*VAT_RATE) : '—';
  row.querySelector('.rr-inc').textContent = (vatReg && hasRate) ? fmtRateVat(rate*(1+VAT_RATE)) : '—';
}
/* the VAT select changes every row at once, so it re-runs the same per-row function
   rather than carrying its own copy of the arithmetic */
function refreshAllRateRows(){
  document.querySelectorAll('.rate-row[data-rolepath] .rr-rate').forEach(refreshRateRow);
}
/* The read side of the Rates section. A row with no usable rate stores NOTHING rather
   than a zero — an absent entry falls through the rate chain to c.rate, which is what
   an empty box should mean; a stored 0 would silently cost that role at nothing. */
function collectRoleRates(existing){
  const out = Object.assign({}, existing||{});
  document.querySelectorAll('.rate-row[data-rolepath]').forEach(row=>{
    const path = row.getAttribute('data-rolepath');
    const rateRaw = row.querySelector('.rr-rate').value.trim();
    const rate = Number(rateRaw);
    if(rateRaw==='' || isNaN(rate)){ delete out[path]; return; }
    const split = row.querySelector('.rr-split').checked;
    const kitRaw = row.querySelector('.rr-kit').value.trim();
    const kit = Number(kitRaw);
    out[path] = { rate, kit: (split && kitRaw!=='' && !isNaN(kit)) ? kit : null };
  });
  return out;
}
/* The Edit form's Company field, in place of the old free-text "Co-Production company".

/* "+ Add company…" — adds to the saved list and leaves the new name selected, so the
   form still reads it from #ncCoPro on save like any other pick. Cancelling snaps back
   to whatever was selected before rather than leaving "__add__" in the field. */
async function crewCompanyPicked(selectEl){
  if(selectEl.value!=='__add__') return;
  const name = (prompt('Company name:')||'').trim();
  if(!name){ selectEl.value = (crewById(val('crewEditId'))||{}).coProductionCompany || ''; return; }
  if(!coProCompaniesList.includes(name)){
    coProCompaniesList.push(name);
    await saveDB('db:coprocompanies', coProCompaniesList);
  }
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  selectEl.insertBefore(opt, selectEl.lastElementChild);
  selectEl.value = name;
}
/* ⚠️ REMOVED HERE: useCrewAsTemplate() / duplicateCrew() ("Use as template", Phase BG)
   and coProPillSelect() / quickSetCoPro() (the "— Lead company —" quick-pick select).
   Both were Crew Database CARD controls and the card is two lines now — see

   duplicateCrew()'s output went with it. saveCrew()'s duplicate-NAME warning stays: it
   covers records created or renamed by hand, which is now the only way to make one.
   coProCompaniesList and c.coProductionCompany are unchanged — the Edit form's Company
