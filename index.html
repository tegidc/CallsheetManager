/* Overview "shoot days" count field — kept in sync both ways with the actual
   Shoot Days list. Growing it creates blank new days (same shape as + New day).
   Shrinking it never silently deletes — it expands an inline checkbox picker
   (shootDayReductionPending) so the specific day(s) to lose can be ticked,
   rather than a sequence of native prompt() popups (Phase T item 1). */
let shootDayReductionPending = null;   // { removeCount, selected:Set() } while picking which day(s) to remove
function shootDayLabel(d){ return `Day ${d.dayNum||'?'}${d.date?' — '+fmtDate(d.date):''}${d.locationId?' — '+((locById(d.locationId)||{}).name||''):''}`; }
async function syncShootDayCount(newCountStr){
  const p = currentProject(); if(!p) return;
  const days = projectDays(p.id);
  const newCount = parseInt(newCountStr, 10);
  shootDayReductionPending = null;
  if(!Number.isFinite(newCount) || newCount < 0 || newCount === days.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
  if(newCount > days.length){
    for(let i=days.length; i<newCount; i++){
      const rec = makeShootDayRecord(p.id, p);
      shootDaysDB.push(rec);
    }
    await saveDB('db:shootdays', shootDaysDB);
    renderProjectOverview(document.getElementById('projectBody'));
    return;
  }
  // shrinking — expand an inline checkbox picker instead of deciding for the user
  shootDayReductionPending = { removeCount: days.length - newCount, selected: new Set() };
  renderProjectOverview(document.getElementById('projectBody'));
}
function toggleShootDayReductionPick(dayId, checked){
  if(!shootDayReductionPending) return;
  if(checked) shootDayReductionPending.selected.add(dayId); else shootDayReductionPending.selected.delete(dayId);
  renderProjectOverview(document.getElementById('projectBody'));
}
function cancelShootDayReduction(){
  shootDayReductionPending = null;
  renderProjectOverview(document.getElementById('projectBody'));
}
async function confirmShootDayReduction(){
  const pend = shootDayReductionPending;
  if(!pend || pend.selected.size!==pend.removeCount) return;
  shootDaysDB = shootDaysDB.filter(d=>!pend.selected.has(d.id));
  if(pend.selected.has(currentShootDayId)) currentShootDayId = null;
  shootDayReductionPending = null;
  await saveDB('db:shootdays', shootDaysDB);
  renderProjectOverview(document.getElementById('projectBody'));
}
function shootDayReductionPanelHTML(days){
  const pend = shootDayReductionPending; if(!pend) return '';

}

/* ---- Crew Database tabs ----
   PURELY A VIEW. Nothing here writes, and no record carries a "which tab am I on"
   field — each tab is a predicate over the same crewDB, so moving someone between

   is the only place that fact lives. Do not add a tab that can't be expressed as a
   predicate over an existing field.

   ⚠️ ONE ORDERED LIST: the strip renders from this, the counts count with it, and
   setCrewDbView validates against it, so tab order, label and membership cannot
   drift apart. Adding a tab is a row here.

   The three specific tabs deliberately OVERLAP — a Talent who came via a co-pro
   company is in both Talent and Other companies, because both are true of them.

   ever-growing exclusion list. That is also why it's the default: it's the roster you
   actually come here to amend.

const isCrewDbTalent  = c => deptBucketKey(c.department)==='Talent';
const isCrewDbClient  = c => deptBucketKey(c.department)==='Client';
const isCrewDbOtherCo = c => !!c.coProductionCompany;
const CREW_DB_TABS = [
  { key:'crew',      label:'Crew',            test:c=>!isCrewDbTalent(c) && !isCrewDbClient(c) && !isCrewDbOtherCo(c) },
  { key:'talent',    label:'Talent',          test:isCrewDbTalent },
  { key:'clients',   label:'Clients',         test:isCrewDbClient },
  { key:'companies', label:'Other companies', test:isCrewDbOtherCo },
  { key:'all',       label:'All',             test:()=>true },
  { key:'settings',  label:'Settings',        test:null },
];
let crewDbView = 'crew';
const crewDbTab = () => CREW_DB_TABS.find(t=>t.key===crewDbView) || CREW_DB_TABS[0];
function setCrewDbView(key){
  if(!CREW_DB_TABS.some(t=>t.key===key)) return;
  crewDbView = key;
  // a card left open in one tab must not reopen against a different list
  editingCrewId = null; viewingCrewId = null; addingCrewNew = false;
  refreshCrewDatabase();
}
/* everyone the CURRENT tab is about, before search and before the filter panel —
   the one place the tab predicate is applied, so the list and the count can't disagree */
function crewDbTabList(tab){
  const t = tab || crewDbTab();
  return t.test ? crewDB.filter(t.test) : [];
}
function crewDbTabsHTML(){
  return `<div class="tabs crewdb-tabs">${CREW_DB_TABS.map(t=>{
    const count = t.test ? ` <span class="crewdb-tab-count">${crewDbTabList(t).length}</span>` : '';
    return `<div class="tab ${crewDbView===t.key?'active':''}" onclick="setCrewDbView('${t.key}')">${esc(t.label)}${count}</div>`;
  }).join('')}</div>`;
}
function renderCrewDatabase(m){

     The wrapper .tabscroll lives inside #main, so each of those re-renders destroys it
     and the mobile edge-fade would never come back. Same setTimeout-0 idiom as

  setTimeout(refreshTabScrollCues, 0);

/* Add a canonical role to a department, from the department admin panel.
   ⚠️ Writes ROLES_BY_DEPT / db:roles — the SAME store confirmAddRoleDialog() writes to
   when it invents a role while attaching it to a person. That was previously the ONLY
   way a new canonical role could come into existence: you had to be giving it to
   somebody. This is the department-level entry point that was missing, and it touches
   no crew record at all.
   Seniority is left alone deliberately. A new role is pushed to the END of the
   department's list and has no ROLE_SENIORITY entry, so roleSeniorityRank() ranks it
   last — most junior — which is the right default and is exactly the fallback that
   function already documents. Reorder it with the arrows in the list above. */
async function addRoleToDeptAdmin(dept){
  const role = (prompt(`New role in ${dept}:`)||'').trim();
  if(!role) return;
  ROLES_BY_DEPT[dept] = ROLES_BY_DEPT[dept] || [];
  // case-insensitive, so "Gaffer" can't be added a second time as "gaffer"
  const clash = ROLES_BY_DEPT[dept].find(r=>r.toLowerCase()===role.toLowerCase());
  if(clash){ alert(`${dept} already has a role called "${clash}".`); return; }
  ROLES_BY_DEPT[dept].push(role);
  await saveDB('db:roles', ROLES_BY_DEPT);
  refreshCrewDatabase();
}
async function toggleHoD(crewId){
  const c = crewById(crewId); if(!c) return;
  c.isHoD = !c.isHoD;
  await saveDB('db:crew', crewDB);
  refreshCrewDatabase();
}
function crewSearchBlob(c){
  return [c.name, c.role, c.showAs, c.department, c.coProductionCompany, c.skills, c.camera1, c.camera2, c.camera3, c.cameraExtras, c.dietary,
          c.previousProjects, c.generalNotes, c.coffeeOrder, c.instagram, c.youtube, c.linkedin, c.email, c.phone, (c.roles||[]).join(' ')]
    .filter(Boolean).join(' ').toLowerCase();
}
/* tel: needs the number without spaces or punctuation; the DISPLAYED text keeps

/* The Crew Database card — TWO LINES, deliberately:

function crewCardHTML(c){

  const bannerAction = !open ? '' : (isEditing

function toggleCrewCard(id){

function toggleAllCrewDbDepts(deptsCSV){

function sortCrewDbGroup(list){
  return crewDbFilter.sort==='name' ? list.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')) : sortHoDFirst(list);

function renderCrewList(){
  const q = (val('crewSearch')||crewSearchQuery||'').toLowerCase();
  const list = document.getElementById('crewList'); if(!list) return;
  /* TAB FIRST, then search, then the filter panel — narrowing, in that order. Search
     deliberately does NOT reach across tabs: the tab is the question you asked, and a
     search that silently returned people from Talent while you were on Crew would make
     the strip a lie. The count on each tab is that tab's whole list, unsearched, so a
     search that empties the current tab still shows you which one to look in. */
  const tab = crewDbTab();
  let filtered = crewDbTabList(tab).filter(c => !q || crewSearchBlob(c).includes(q));
  filtered = filtered.filter(personMatchesCrewDbFilter);
  if(!filtered.length){
    const narrowed = q || crewDbActiveFilterCount();
    list.innerHTML = `<div class="empty-note">${narrowed
      ? `No one in ${esc(tab.label)} matches that.`
      : `No one in ${esc(tab.label)} yet.`}</div>`;

  const buckets = {};
  filtered.forEach(c=>{ const key = deptBucketKey(c.department); (buckets[key]=buckets[key]||[]).push(c); });
  Object.keys(buckets).forEach(d=>{ buckets[d] = sortCrewDbGroup(buckets[d]); });

      + `<div class="dept-group" style="display:${collapsed?'none':'block'}">${buckets[d].map(crewCardHTML).join('')}</div>`;
  }).join('');
  list.innerHTML = toggleRow + (html || filtered.map(crewCardHTML).join(''));
}

async function saveCrew(){
  const name = val('ncName'); if(!name){ alert('Name is required'); return; }
  const id = val('crewEditId');
  const existing = crewById(id);
  if(!existing && !pendingNewCrewRole){ alert('Pick a role — every crew member needs at least one saved role.'); return; }
  /* Duplicate-name warning (Phase BG) — a WARNING, not a block. Two different people
     genuinely can share a name, so this asks rather than forbids.

     Every record now arrives through this function — "Use as template", the one path
     that wrote to db:crew without passing here (and so carried its own confirm), is
     gone. One entry point, one guard.

     Match is on the NAME ALONE, normalised (trimmed, case-insensitive) — never name +
     role. Under BF one record will hold several saved roles, so one person with two
     roles is one CORRECT record; two records sharing a name are wrong whatever roles
     they carry. Building role into the comparison would break the moment BF lands.

     ⚠️ Exact-string matching is weak against years of hand entry. Normalising catches
     trailing spaces and casing; it will NOT catch "M. Marshall" vs "Marshall, M" vs
     "Mike Marshall". This is a guard on new entry, not a duplicate finder — it makes no
     claim to be exhaustive, and it says nothing about the pairs already in the database.
     Reconciling those is BF's job.

     Only fires when the name is actually new or changed, so re-saving an unchanged
     record never nags. Nothing has been mutated at this point — returning is clean. */
  const normName = s => (s||'').trim().toLowerCase();
  if(!existing || normName(existing.name)!==normName(name)){
    const clashes = crewDB.filter(x => x.id!==id && normName(x.name)===normName(name));
    if(clashes.length){
      const detail = clashes.map(x=>[x.role, x.department].filter(Boolean).join(', ')).filter(Boolean);
      const msg = [
        clashes.length>1
          ? `There are already ${clashes.length} crew records called "${name}".`
          : `There's already a crew record called "${name}".`,
        detail.length ? `Existing: ${detail.join(' · ')}` : null,
        '',
        "Two different people can share a name — if that's the case here, carry on. If it's the same person, cancel and edit the existing record instead.",
        '',
        'Save anyway?'
      ].filter(x=>x!==null).join('\n');
      if(!confirm(msg)) return;
    }
  }
  const rec = { id: id||uid(), name,
    showAs: val('ncShowAs'), coProductionCompany: val('ncCoPro'),
    phone: val('ncPhone'), email: val('ncEmail'),
    skills: val('ncSkills'),
    camera1: val('ncCam1'), camera2: val('ncCam2'), camera3: val('ncCam3'), cameraExtras: val('ncCamExtras'),
    dietaryGeneral: val('ncDietaryGeneral'), dietarySpecific: val('ncDietarySpecific'), shoeSize: val('ncShoe'), clothingSize: val('ncClothing'),
    vatRegistered: val('ncVat'), drives: val('ncDrives'), carMakeModel: val('ncCarModel'), carReg: val('ncCarReg'),
    homeAddress: val('ncAddress'),
    generalNotes: val('ncGeneralNotes'), previousProjects: val('ncPrevProjects'),
    instagram: val('ncInstagram'), youtube: val('ncYouTube'), linkedin: val('ncLinkedIn'), coffeeOrder: val('ncCoffeeOrder'),
    rate: val('ncRate'), notes: val('ncNotes'),
    invoicesAs: val('ncInvoicesAs') };
  /* ⚠️ Seeded from the EXISTING map, not built fresh: the Rates section only renders a
     row per role the person currently holds, so rebuilding from the DOM alone would
     quietly drop the rate for a role that had been removed and later added back. Rows
     that are on screen and empty do get deleted — that's collectRoleRates' own job. */
  const roleRates = collectRoleRates(existing && existing.roleRates);
  if(Object.keys(roleRates).length) rec.roleRates = roleRates;
  if(!existing){
    // brand-new crew: the picked role is the only source of role + department
    rec.roles = [pendingNewCrewRole];
    rec.role = pendingNewCrewRole.split('/').slice(1).join('/');
    rec.department = departmentForRolePath(pendingNewCrewRole);
  }
  const merged = Object.assign({}, existing||{}, rec);
  const idx = crewDB.findIndex(x=>x.id===merged.id);
  if(idx>=0) crewDB[idx]=merged; else crewDB.push(merged);
  await saveDB('db:crew', crewDB);
  // if this was a brand-new person added from inside a project, put them on that project straight away
  if(!existing && route.screen==='project' && currentProjectId){
    const p = currentProject();
    if(p){ addCrewEntry(p, merged.id); await saveDB('db:projects', projectsDB); }
  }
  pendingNewCrewRole = '';
  editingCrewId = null; addingCrewNew = false; newCrewPrefillName = '';
  /* Saving an EXISTING record on the Crew Database drops back to read mode on that same
     card, so what you just changed is on screen instead of the list snapping shut. A
     brand-new person is left collapsed: they are new to the list, and the useful thing
     is seeing them take their place in it. */
  if(existing && route.screen==='db-crew') viewingCrewId = merged.id;
  refreshCrewScreen();
}
async function deleteCrew(id){
  if(!confirm('Delete this crew member from the database?')) return;
  const who = (crewById(id)||{}).name || 'crew member';
  const snaps = beginUndo(['db:crew','db:projects']);
  crewDB = crewDB.filter(x=>x.id!==id);
  /* ⚠️ Drops the roster ENTRIES only, and deliberately leaves their shoot-day positions
     behind — because that is exactly what this did before BF, when it filtered p.crewIds
     and touched nothing else. A position whose id no longer resolves has always rendered
     as "(removed crew)" via crewInfo()/resolveCrewForDay(), and it still does; the id in
     it is now an entry id rather than a crew id, which changes nothing about the output.
     Cleaning those up would be a real improvement and a real behaviour change, so it is
     not BF's to make. Contrast removeCrewFromProject()/bulkRemoveSelectedFromProject(),
     which have always cleared positions and so go through removeCrewEntries(). */
  projectsDB.forEach(p=>{
    const gone = new Set(entriesForCrew(id, p).map(e=>e.id));
    if(!gone.size) return;
    p.crewEntries = (p.crewEntries||[]).filter(e=>!gone.has(e.id));
    /* Phase BD — this is the THIRD path that drops entries from a project, and the one
       that does not go through removeCrewEntries(). Its pre-production and post records
       are pruned here for the same reason theirs are: both stores are keyed by entry id
       and nothing else would ever clear them. This is not the same decision as the
       shoot-day positions left dangling above — those render as "(removed crew)" and
       have always been visible; an orphaned prep record is invisible and would simply
       accumulate in the project row forever. Undo is unaffected: prep data lives in
       db:projects, which beginUndo() already snapshots on this path. */
    prunePhaseSchedules(p, gone);
  });
  await saveDB('db:crew', crewDB); await saveDB('db:projects', projectsDB);
  renderCrewList();
  finishUndo(`Deleted ${who} from the crew database.`, snaps);
}

async function runAddressSearch(){
  const q = val('nlSearchBox'); const box=document.getElementById('nlSearchResults');
  if(q.length<3){ box.style.display='none'; return; }
  box.innerHTML='<div class="sritem">Searching…</div>'; box.style.display='';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(!data.length){ box.innerHTML='<div class="sritem">No matches found</div>'; return; }
    box.innerHTML = data.map((r,i)=>`<div class="sritem" onclick="pickAddress(${i})">${esc(r.display_name)}</div>`).join('');
    window._addrResults = data;
  }catch(e){ box.innerHTML='<div class="sritem">Search failed — check your connection</div>'; }
}
function pickAddress(i){
  const r = window._addrResults[i];
  setv('nlAddress', r.display_name);
  setv('nlLatLon', parseFloat(r.lat).toFixed(5)+', '+parseFloat(r.lon).toFixed(5));
  locFormState.lat=parseFloat(r.lat); locFormState.lon=parseFloat(r.lon);
  document.getElementById('nlSearchResults').style.display='none'; setv('nlSearchBox','');
  updateMapPreview();
}
function updateMapPreview(){
  const el=document.getElementById('nlMapPreview'); if(!el) return;
  if(locFormState.lat==null){ el.innerHTML=''; return; }
  const d=0.01, bbox=[locFormState.lon-d,locFormState.lat-d,locFormState.lon+d,locFormState.lat+d].join(',');
  el.innerHTML=`<iframe class="mapembed" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${locFormState.lat},${locFormState.lon}&layer=mapnik"></iframe>`;
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ---- nearest-amenity lookup (OpenStreetMap Overpass) ----
   Hospitals and parking are the same query with a different amenity tag and search
   radii — parking is far denser than hospitals, so it starts much tighter (1km) or
   the nearest result is just noise. Radii are tried in order, widening only if the
   tighter one found nothing. */
const AMENITY_SEARCH = {
  hospital: { tag:'hospital', radii:[10000,25000], noun:'hospital', unnamed:'Unnamed hospital', stateKey:'hospital', elId:'nlHospitalInfo' },
  parking:  { tag:'parking',  radii:[1000,3000,8000], noun:'parking', unnamed:'Unnamed parking', stateKey:'parking', elId:'nlParkingInfo' },
};
/* formats a {name, address, distanceKm} amenity as one display line — used by the
   location form, the shoot day form, and anywhere else one is shown */
function amenityLine(a, missingAddr){
  return a ? `${a.name} — ${a.address||(missingAddr||'')} (~${a.distanceKm}km)` : '';
}
async function findNearestAmenity(kind, lat, lon){
  const cfg = AMENITY_SEARCH[kind];
  for(const r of cfg.radii){
    const query=`[out:json][timeout:20];node["amenity"="${cfg.tag}"](around:${r},${lat},${lon});out;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    const data=await res.json();
    if(data.elements && data.elements.length){
      let best=null,bestD=Infinity;
      data.elements.forEach(el=>{ const dist=haversine(lat,lon,el.lat,el.lon); if(dist<bestD){bestD=dist;best=el;} });
      const t=best.tags||{};
      const addr=[t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:postcode']].filter(Boolean).join(', ');
      return { name:t.name||cfg.unnamed, address:addr, phone:t.phone||t['contact:phone']||'', distanceKm:bestD.toFixed(1) };
    }
  }
  return null;
}
/* the "Find nearest…" buttons on the location form — same flow for both kinds */
async function lookupAmenityForForm(kind){
  const cfg = AMENITY_SEARCH[kind];
  const infoEl=document.getElementById(cfg.elId); if(!infoEl) return;
  if(locFormState.lat==null){ alert('Search and pick an address first so we have coordinates to search from.'); return; }
  infoEl.textContent=`Searching nearby ${cfg.noun}…`;
  try{
    const found = await findNearestAmenity(kind, locFormState.lat, locFormState.lon);
    if(!found){ infoEl.textContent=`No ${cfg.noun} found nearby.`; return; }
    locFormState[cfg.stateKey]=found;
    infoEl.textContent=amenityLine(found, 'address not tagged');
  }catch(e){ infoEl.textContent='Lookup failed — check your connection.'; }
}

async function quickAddLocationForDay(selectEl){
  const raw = (prompt('New location name:')||'').trim();
  if(!raw){ selectEl.value=''; if(selectEl.id==='sdLocation') onDayChanged(); return; }
  let loc = findLocationByName(raw);
  if(!loc){
    loc = { id: uid(), name: raw, address:'', lat:null, lon:null, onsiteContactName:'', onsiteContactPhone:'',
      accessInfo:'', recceInfo:'', parkingInfo:'', hospital:null, nearestParking:null };
    locationsDB.push(loc);
    await saveDB('db:locations', locationsDB);
  }
  // the Locations-tab day-grid only lists locations in p.locationIds — make sure
  // this one is on the project so its row (and ticked checkbox) actually shows up
  const day = currentDay();
  const proj = projById(day&&day.projectId);
  if(proj){
    proj.locationIds = proj.locationIds||[];
    if(!proj.locationIds.includes(loc.id)){ proj.locationIds.push(loc.id); await saveDB('db:projects', projectsDB); }
  }
  // rebuild every location dropdown on this screen so the (possibly new) location
  // is selectable everywhere, preserving whatever each was already showing
  const sdSel = document.getElementById('sdLocation');
  if(sdSel){ const cur=sdSel.value==='__addloc__'?'':sdSel.value; sdSel.innerHTML=locSelectOptionsHTML(); sdSel.value=cur; }

  if(selectEl.id==='sdLocation') onDayChanged();
  await saveShootDay(false);   // link immediately so the Locations tab checkbox reflects it without waiting for a manual Save

/* pulls whatever call time is currently sitting in the DOM into the saved day object,
   so collapsing a group or adding/removing someone never discards an in-progress edit */
function captureInProgressPositions(){
  const day = currentDay(); if(!day) return;
  const container = document.getElementById('rows-posn'); if(!container) return;
  const currentRows = rowsOf('rows-posn', ['posn-crew','posn-call']);
  if(!currentRows.length && (day.positions||[]).length) return; // not rendered yet — don't wipe saved data
  const prevPositions = day.positions || [];
  day.positions = currentRows.map(([cid,call])=>{
    const prev = prevPositions.find(p=>p[0]===cid);
    return [cid, call, '', prev?(prev[3]||''):'', prev?(prev[4]||''):''];
  });
}
function renderPositionAssignments(){
  const el = document.getElementById('rows-posn'); if(!el) return;
  const day = currentDay(); if(!day) return;
  const positions = day.positions || [];
  if(!positions.length){ el.innerHTML = '<div class="empty-note">No one added to this day yet.</div>'; return; }
  const companies = {};
  // Phase BF — cid is an ENTRY id. Two entries for one person are two separate rows
  // here on purpose: that is the whole reason the shoot day stores entry ids.
  positions.forEach(([cid,call,note])=>{
    const c = resolveCrewForDay(cid, day);
    const company = c.coProductionCompany || COMPANY;
    const dept = deptBucketKey(c.department);
    companies[company] = companies[company] || {};
    companies[company][dept] = companies[company][dept] || [];
    companies[company][dept].push({cid, call, note, c});
  });
  const companyNames = Object.keys(companies).sort((a,b)=> a===COMPANY ? -1 : b===COMPANY ? 1 : a.localeCompare(b));
  let html = '';
  companyNames.forEach(company=>{
    const deptMap = companies[company];
    const depts = DEPARTMENTS.filter(d=>deptMap[d]&&deptMap[d].length);
    const companyCollapsed = collapsedPosnCompanies.has(company);
    const totalCount = depts.reduce((sum,d)=>sum+deptMap[d].length,0);
    html += `<div class="posn-company-group">
      <div class="posn-company-header" onclick="togglePosnCompany('${esc(company)}')">
        <span class="dept-caret">${companyCollapsed?'▸':'▾'}</span> ${esc(company)} <span class="dept-count">(${totalCount})</span>
      </div>
      <div class="posn-company-body" style="display:${companyCollapsed?'none':'block'}">`;
    depts.forEach(dept=>{
      const key = company+'||'+dept;
      const deptCollapsed = collapsedPosnDepts.has(key);
      const entries = deptMap[dept].slice().sort((a,b)=>roleSeniorityRank(dept,a.c.role)-roleSeniorityRank(dept,b.c.role) || (a.c.role||'').localeCompare(b.c.role||'') || (a.c.name||'').localeCompare(b.c.name||''));
      html += deptHeaderHTML(dept, entries.length, deptCollapsed, `togglePosnDept('${esc(company)}','${esc(dept)}')`)
        + `<div class="dept-group" style="display:${deptCollapsed?'none':'block'}">`;
      entries.forEach(en=>{
        const c = en.c;
        const isEditing = editingCrewId===en.cid;
        const overridden = hasOverride(en.cid, day);
        html += `<div class="crewrow-select posn-row ${overridden?'posn-row-overridden':''}">
          <input type="hidden" class="posn-crew" value="${esc(en.cid)}">
          <div class="posn-dept-badge">${esc(DEPARTMENT_CODES[dept]||'')}</div>
          <div class="posn-name">${posnIdentityHTML(c, en.cid, isEditing, overridden)}</div>
          <input type="text" class="posn-call" placeholder="Call time" value="${esc(en.call)}">
          <button class="small rm danger" onclick="removePosnRow('${esc(en.cid)}')">${icon('close')}</button>
          ${isEditing ? `<div class="crewgrid-editform">${dayOverrideFormHTML(en.cid)}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html;
}

/* ---------- schedule time/duration helpers ---------- */
function parseTimeStrToMins(s){
  const m = (s||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function parseTimeRangeToMins(s){
  const parts = (s||'').split('-');
  if(parts.length!==2) return null;
  const start = parseTimeStrToMins(parts[0]), end = parseTimeStrToMins(parts[1]);
  if(start==null||end==null) return null;
  return {start,end};
}
function parseDurationToMins(s){
  if(!s) return null;
  s = s.trim();
  const full = s.match(/^(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?\s+(\d+)$/i);
  if(full) return Math.round(parseFloat(full[1])*60) + parseInt(full[2],10);
  let mins=0, matched=false;
  const hrM = s.match(/(\d+(?:\.\d+)?)\s*h/i);
  if(hrM){ mins += Math.round(parseFloat(hrM[1])*60); matched=true; }
  const minM = s.match(/(\d+)\s*m/i);
  if(minM){ mins += parseInt(minM[1],10); matched=true; }
  if(!matched){
    const bareNum = s.match(/^(\d+)$/);
    if(bareNum) return parseInt(bareNum[1],10);
    return null;
  }
  return mins;
}
function formatMinsAsDuration(mins){
  if(mins==null) return '';
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return `${h}hr${h>1?'s':''} ${m}min`;
  if(h) return `${h}hr${h>1?'s':''}`;
  return `${m}min`;
}
function formatMinsAsTime(mins){

/* G16 — fetchedAt is an ISO timestamp from now on, but records written before this
   carry a localised date string and the sample data carries the literal 'sample'.
   Only reformat what is unambiguously ISO: passing a legacy "07/08/2026" through
   Date.parse() would read it as month-first and silently redate it. */
function weatherFetchedLabel(v){
  if(!v) return '';
  if(!/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
  const t = Date.parse(v);
  return isNaN(t) ? v : new Date(t).toLocaleDateString();
}
const WMO={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm'};
async function fetchWeatherForDay(){
  const loc=selectedDayLocation();
  const dateStr=val('sdDate'); const s=document.getElementById('weatherStatus');
  if(!loc||loc.lat==null){ s.textContent='Pick a primary location with saved coordinates first.'; return; }
  if(!dateStr){ s.textContent='Set the shoot date first.'; return; }
  s.textContent='Fetching…';
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((new Date(dateStr+'T00:00:00')-today)/86400000);
  try{
    let url,source;
    if(diffDays<0){ url=`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset&timezone=auto`; source='historical'; }
    else if(diffDays<=15){ url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto`; source='forecast'; }
    else{ s.textContent=`Shoot date is ${diffDays} days out — forecasts only reach ~16 days. Try again nearer the date.`; return; }
    const data=await(await fetch(url)).json();
    if(!data.daily||!data.daily.time||!data.daily.time.length){ s.textContent='No weather data for that date/location.'; return; }
    const tMax=data.daily.temperature_2m_max[0], tMin=data.daily.temperature_2m_min[0], code=data.daily.weathercode[0];
    const precip=data.daily.precipitation_probability_max?data.daily.precipitation_probability_max[0]+'%':(data.daily.precipitation_sum?data.daily.precipitation_sum[0]+'mm':'');
    setv('wxTemp',`${Math.round(tMax)}°C / ${Math.round(tMin)}°C`); setv('wxPrecip',precip);
    setv('wxCond',WMO[code]||('Code '+code));
    setv('wxSun',`${(data.daily.sunrise[0]||'').split('T')[1]||''} / ${(data.daily.sunset[0]||'').split('T')[1]||''}`);
    /* G16 — the "last fetched" stamp moves HERE and only here, because this is the
       only place a fetch actually happens. Written onto the record in memory and
       carried to Supabase by the next saveShootDay(), exactly like the four weather
       fields it sits beside — no extra save of its own. Stored as an ISO timestamp
       so it can be compared and sorted; weatherFetchedLabel() renders it. */
    const fetchedDay = currentDay();
    if(fetchedDay) fetchedDay.weather = Object.assign({}, fetchedDay.weather, {fetchedAt:new Date().toISOString()});
    s.textContent=`Fetched (${source}) just now.`;
  }catch(e){ s.textContent='Fetch failed — check your connection.'; }
}
async function saveShootDay(thenGenerate){

   won't match a saved role, so it can't be used for ranking) */
function positionOutputCompare(a,b){
  return deptRank(a.department)-deptRank(b.department)
    || roleSeniorityRank(deptBucketKey(a.department), a.canonicalRole)-roleSeniorityRank(deptBucketKey(b.department), b.canonicalRole)

  const crewOnly = allPositions.filter(r=>!r.coProductionCompany);

  // out of the canonical-department-order crew list into their own dedicated blocks
  const positions = crewOnly.filter(r=>!['Client','Talent'].includes(deptBucketKey(r.department))).sort(positionOutputCompare);
  const clientPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Client').sort(positionOutputCompare);
  const talentPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Talent').sort(positionOutputCompare);
  const coProBuckets = {};
  allPositions.filter(r=>r.coProductionCompany).forEach(r=>{ (coProBuckets[r.coProductionCompany]=coProBuckets[r.coProductionCompany]||[]).push(r); });
  const coProductionGroups = Object.keys(coProBuckets).sort((a,b)=>a.localeCompare(b))

      <span class="dept-caret" id="pvc-callsheet">${open?'▾':'▸'}</span>
      <div>
        <div class="line1">${esc(d.prodCompany)}${d.shootTitle?(' · '+esc(d.shootTitle)):''}</div>
        <div class="sub">${[fmtDate(d.shootDate),dayLine,d.allCrewCall?('All-crew call '+esc(d.allCrewCall)):''].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  let h='';

  /* ---- two-column key-info block at the top ---- */
  let col1='', col2='';
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)) col1+=`<div class="ki-item"><h4>Weather</h4><div>${[w.temp,w.precip,w.cond,w.sun&&('☀ '+w.sun)].filter(Boolean).map(esc).join(' · ')}</div></div>`;
  if(d.primary){
    col1+=`<div class="ki-item"><h4>Primary location</h4><div>${esc(d.primary.name)}<br>${esc(d.primary.address||'')}</div>`;
    if(d.primary.onsiteContactName) col1+=`<div class="hint">Contact: ${esc(d.primary.onsiteContactName)}${d.primary.onsiteContactPhone?(' — '+esc(d.primary.onsiteContactPhone)):''}</div>`;
    col1+=`</div>`;
  }
  if(d.hospital) col1+=`<div class="ki-item"><h4>Nearest hospital</h4><div>${esc(d.hospital.name)}<br>${esc(d.hospital.address||'')} (~${esc(d.hospital.distanceKm)}km)</div></div>`;
  if(d.brief.length) col2+=`<div class="ki-item"><h4>Production brief</h4><ul>${d.brief.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  if(d.parking) col2+=`<div class="ki-item"><h4>Parking / arrival</h4><div>${esc(d.parking).replace(/\n/g,'<br>')}</div></div>`;
  if(d.notes) col2+=`<div class="ki-item"><h4>Production notes</h4><div>${esc(d.notes).replace(/\n/g,'<br>')}</div></div>`;
  if(col1||col2) h+=`<div class="key-info-grid"><div class="ki-col">${col1}</div><div class="ki-col">${col2}</div></div>`;

  if(d.addLocs.length) h+=`<h3>Additional locations</h3><ul>`+d.addLocs.map(l=>`<li>${esc(l.name)} — ${esc(l.address||'')}${l.note?(' ('+esc(l.note)+')'):''}</li>`).join('')+`</ul>`;
  if(d.schedule.length){ h+=`<h3>Schedule</h3><div class="tablewrap"><table><tr><th>Time</th><th>Duration</th><th>Description</th></tr>`+d.schedule.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')+`</table></div>`; }
  // Client stands apart, ahead of the crew list; Talent stands apart, right after it (Phase N item 3)
  h += positionsTableHTML('Client', d.clientPositions);
  h += positionsTableHTML('Position assignments', d.positions);
  h += positionsTableHTML('Talent', d.talentPositions);
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>{
      h += positionsTableHTML(g.company, g.people, '(co-production)');
    });
  }
  const card = document.getElementById('previewCard'); if(!card) return;
  card.innerHTML = header + `<div id="pvb-callsheet" style="display:${open?'':'none'}; margin-top:14px;">${h}</div>`;
}
/* pushes a "*HEADING*" line then one "*Role* — Name" / "Call · phone" pair per
   person — the shared WhatsApp-text block for Client, Position assignments,
   Talent and each co-production group */
function pushPeopleLines(L, heading, people){
  if(!people || !people.length) return;
  L.push('', `*${heading}*`);
  people.forEach(r=>{ L.push(`*${r.role||'Crew'}* — ${r.name||''}`); const bits=[r.call&&('Call '+r.call),r.phone].filter(Boolean).join(' · '); if(bits)L.push(bits); });
}
function buildWAText(d){
  const L=[]; const dayLine=(d.dayNum||d.dayTotal)?`Day ${d.dayNum||'?'}${d.dayTotal?(' of '+d.dayTotal):''}`:'';
  let head=`*${d.prodCompany}*`; if(d.shootTitle) head+=` — ${d.shootTitle}`; L.push(head);
  const meta=[fmtDate(d.shootDate),dayLine].filter(Boolean).join(' · '); if(meta) L.push(`📅 ${meta}`);
  if(d.allCrewCall) L.push(`⏰ All-crew call: *${d.allCrewCall}*`);
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ L.push('','*WEATHER*'); if(w.temp)L.push(`🌡 ${w.temp}`); if(w.precip)L.push(`☔ ${w.precip}`); if(w.cond)L.push(w.cond); if(w.sun)L.push(`🌅/🌇 ${w.sun}`); }
  if(d.primary){ L.push('','*LOCATION*',`📍 ${d.primary.name}`,d.primary.address||''); if(d.primary.onsiteContactName)L.push(`Contact: ${d.primary.onsiteContactName}${d.primary.onsiteContactPhone?(' — '+d.primary.onsiteContactPhone):''}`); if(d.primary.accessInfo)L.push(`Access: ${d.primary.accessInfo}`); if(d.primary.recceInfo)L.push(`Recce: ${d.primary.recceInfo}`); }
  if(d.addLocs.length){ L.push('','*ADDITIONAL LOCATIONS*'); d.addLocs.forEach(l=>L.push(`- ${l.name} — ${l.address||''}${l.note?(' ('+l.note+')'):''}`)); }
  if(d.hospital) L.push('','*NEAREST HOSPITAL*',`${d.hospital.name} — ${d.hospital.address||''} (~${d.hospital.distanceKm}km)`);
  if(d.schedule.length){ L.push('','*SCHEDULE*'); d.schedule.forEach(r=>L.push(`${r[0]}${r[1]?(' ('+r[1]+')'):''} — ${r[2]}`)); }
  pushPeopleLines(L, 'CLIENT', d.clientPositions);
  pushPeopleLines(L, 'POSITIONS', d.positions);
  pushPeopleLines(L, 'TALENT', d.talentPositions);
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>pushPeopleLines(L, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(d.brief.length){ L.push('','*PRODUCTION BRIEF*'); d.brief.forEach(l=>L.push(`- ${l}`)); }
  if(d.parking) L.push('','*PARKING / ARRIVAL*',d.parking);
  if(d.notes) L.push('','*NOTES*',d.notes);
  /* Phase Q — the four optional sections, appended in the same order the printable
     shape stacks them, each gated by its Include checkbox. Tech specs used to be
     hardcoded OUT of this text ("the version for the full crew"); that rule is now
     the Tech specs checkbox instead of a rule nobody could see, so the old crew-wide
     message is one untick away. Hotels/Catering/Travel are project-wide summaries,
     not per-day slices — the same text their Copy buttons produce. */
  if(exportSections.tech){ L.push(''); techSpecsLines(d).forEach(l=>L.push(l)); }
  if(exportSections.hotels){ const h=hotelSummaryLines(); if(h){ L.push('','*HOTELS*'); h.forEach(l=>L.push(l)); } }
  if(exportSections.catering){ const c=cateringOrderLines(); if(c){ L.push('','*CATERING*'); c.forEach(l=>L.push(l)); } }
  if(exportSections.travel){ const t=transportSummaryLines(); if(t){ L.push('','*TRAVEL*'); t.forEach(l=>L.push(l)); } }
  return L.join('\n');
}
/* pushes a heading row, a Dept/Position/Name/Call/Phone header row, and one row per
   person — the shared Excel block for Client, Position assignments, Talent and each
   co-production group */
function pushPeopleRows(aoa, heading, people){
  if(!people || !people.length) return;
  aoa.push([heading]); aoa.push(['Dept','Position','Name','Call','Phone']);
  people.forEach(r=>aoa.push([DEPARTMENT_CODES[deptBucketKey(r.department)]||'',r.role,r.name,r.call,r.phone])); aoa.push([]);
}
function downloadExcel(){
  const d=currentDay(); if(!d) return;
  const data=buildFullData(d); const aoa=[];
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  aoa.push([data.prodCompany,data.shootTitle]); aoa.push([fmtDate(data.shootDate),dayLine,data.allCrewCall?('All-crew call: '+data.allCrewCall):'']); aoa.push([]);
  const w=data.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ aoa.push(['WEATHER']); aoa.push(['Temp',w.temp,'Precip',w.precip,'Condition',w.cond,'Sunrise/Sunset',w.sun]); aoa.push([]); }
  if(data.primary){ aoa.push(['PRIMARY LOCATION']); aoa.push([data.primary.name,data.primary.address]); if(data.primary.onsiteContactName)aoa.push(['On-site contact',data.primary.onsiteContactName,data.primary.onsiteContactPhone||'']); if(data.primary.accessInfo)aoa.push(['Access',data.primary.accessInfo]); if(data.primary.recceInfo)aoa.push(['Recce',data.primary.recceInfo]); aoa.push([]); }
  if(data.addLocs.length){ aoa.push(['ADDITIONAL LOCATIONS']); aoa.push(['Name','Address','Note']); data.addLocs.forEach(l=>aoa.push([l.name,l.address,l.note])); aoa.push([]); }
  if(data.hospital){ aoa.push(['NEAREST HOSPITAL']); aoa.push([data.hospital.name,data.hospital.address,data.hospital.distanceKm+'km']); aoa.push([]); }
  if(data.schedule.length){ aoa.push(['SCHEDULE']); aoa.push(['Time','Duration','Description']); data.schedule.forEach(r=>aoa.push(r)); aoa.push([]); }
  pushPeopleRows(aoa, 'CLIENT', data.clientPositions);
  pushPeopleRows(aoa, 'POSITION ASSIGNMENTS', data.positions);
  pushPeopleRows(aoa, 'TALENT', data.talentPositions);
  if(data.coProductionGroups && data.coProductionGroups.length){
    data.coProductionGroups.forEach(g=>pushPeopleRows(aoa, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(data.brief.length){ aoa.push(['PRODUCTION BRIEF']); data.brief.forEach(l=>aoa.push([l])); aoa.push([]); }
  if(data.parking){ aoa.push(['PARKING / ARRIVAL']); aoa.push([data.parking]); aoa.push([]); }
  if(data.notes){ aoa.push(['PRODUCTION NOTES']); aoa.push([data.notes]); }
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:24},{wch:24},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Call Sheet');
  /* Phase Q — one sheet per ticked section, same four checkboxes that gate the
     printable blocks and the WhatsApp text. A section with no data at all still
     produces no sheet, ticked or not: an empty tab is worse than a missing one. */
  const addSheet=(name, sheetAoa, cols)=>{
    const s=XLSX.utils.aoa_to_sheet(sheetAoa);
    if(cols) s['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,s,name);
  };
  if(exportSections.tech){
    const tsRows=techSpecRows(data.techSpecs||{});
    const tsAoa=[['TECH SPECS — camera/technical crew reference'],[],...tsRows];
    if(data.cameraDesignations && data.cameraDesignations.length){
      tsAoa.push([]); tsAoa.push(['CAMERA DESIGNATIONS']); tsAoa.push(['Camera','Name','Shorthand','File tag']);
      data.cameraDesignations.forEach(cd=>tsAoa.push([cd.letter, cd.name, cd.shorthand||'', cd.tag]));
    }
    addSheet('Tech Specs', tsAoa, [{wch:20},{wch:30}]);
  }
  if(exportSections.hotels){
    const hotel=buildHotelSummary();
    if(hotel){
      const hAoa=[['HOTEL BOOKING', hotel.summary],[],['ROOM-BOOKING TABLE'],['Room No.','Name','Date from','Date to','Total nights']];
      hotel.roomBooking.forEach(r=>hAoa.push([r.roomNo, r.name, r.from, r.to, r.totalNights]));
      hAoa.push([]); hAoa.push(['PER-NIGHT TABLE']); hAoa.push(['Night','Rooms','Names']);
      hotel.perNight.forEach(n=>hAoa.push([n.label, n.rooms, n.names.join(', ')]));
      addSheet('Hotel', hAoa, [{wch:10},{wch:24},{wch:16},{wch:16},{wch:40}]);
    }
  }
  if(exportSections.catering){
    const catering=buildCateringExport();
    if(catering){
      const cAoa=[['CATERING ORDER'],[]];
      catering.forEach(day=>{
        cAoa.push([day.label]); cAoa.push(['Meal','Count']);
        if(day.bCount) cAoa.push(['Breakfast', day.bCount]);
        if(day.lCount) cAoa.push(['Lunch', day.lCount]);
        if(day.dCount) cAoa.push(['Dinner', day.dCount]);
        if(day.dietaryNotes.length){
          cAoa.push(['Dietary requirements']); cAoa.push(['Name','Type','Specific']);
          day.dietaryNotes.forEach(n=>cAoa.push([n.name, n.general, n.specific]));
        }
        cAoa.push([]);
      });
      addSheet('Catering', cAoa, [{wch:24},{wch:18},{wch:32}]);
    }
  }
  if(exportSections.travel){
    const travel=buildTransportSummary();
    if(travel){
      const tAoa=[['TRANSPORT SUMMARY'],[], ['Method', ...travel.cols.map(c=>c.label)]];
      travel.usedMethods.forEach(m=>tAoa.push([m, ...travel.cols.map(c=>c.counts[m])]));
      tAoa.push(['Daily cost', ...travel.cols.map(c=>Number((c.dailyCost||0).toFixed(2)))]);
      tAoa.push([]); tAoa.push(['Total transport cost', Number((travel.totalCost||0).toFixed(2))]);
      addSheet('Travel', tAoa, [{wch:24}]);
    }
  }
  XLSX.writeFile(wb,`callsheet-${data.shootDate||'draft'}${data.dayNum?('-day'+data.dayNum):''}.xlsx`);
}
</script>
