  if(!target) return;                       // already at an end
  if(dir<0) container.insertBefore(row, target);
  else container.insertBefore(target, row);
}

function shiftScheduleTimes(deltaMinutes, onlySelected){
  const rows = document.querySelectorAll('#rows-sched .row');
  rows.forEach(row=>{
    const timeInput = row.querySelector('.sc-time'); if(!timeInput) return;
    if(onlySelected){ const sel = row.querySelector('.sc-select'); if(!sel || !sel.checked) return; }
    const range = parseTimeRangeToMins(timeInput.value);
    if(range){
      timeInput.value = formatMinsAsTime(range.start+deltaMinutes) + ' - ' + formatMinsAsTime(range.end+deltaMinutes);
      return;
    }
    const single = parseTimeStrToMins(timeInput.value);
    if(single!=null) timeInput.value = formatMinsAsTime(single+deltaMinutes);
  });
}

/* G16 — fetchedAt is an ISO timestamp from now on, but records written before this
   carry a localised date string and the sample data carries the literal 'sample'.
   Only reformat what is unambiguously ISO: passing a legacy "07/08/2026" through
   Date.parse() would read it as month-first and silently redate it. */
function weatherFetchedLabel(v){
  if(!v) return '';
  if(!/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
  const t = Date.parse(v);
  return isNaN(t) ? v : new Date(t).toLocaleDateString();
}
const WMO={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm'};
async function fetchWeatherForDay(){
  const loc=selectedDayLocation();
  const dateStr=val('sdDate'); const s=document.getElementById('weatherStatus');
  if(!loc||loc.lat==null){ s.textContent='Pick a primary location with saved coordinates first.'; return; }
  if(!dateStr){ s.textContent='Set the shoot date first.'; return; }
  s.textContent='Fetching…';
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((new Date(dateStr+'T00:00:00')-today)/86400000);
  try{
    let url,source;
    if(diffDays<0){ url=`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset&timezone=auto`; source='historical'; }
    else if(diffDays<=15){ url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto`; source='forecast'; }
    else{ s.textContent=`Shoot date is ${diffDays} days out — forecasts only reach ~16 days. Try again nearer the date.`; return; }
    const data=await(await fetch(url)).json();
    if(!data.daily||!data.daily.time||!data.daily.time.length){ s.textContent='No weather data for that date/location.'; return; }
    const tMax=data.daily.temperature_2m_max[0], tMin=data.daily.temperature_2m_min[0], code=data.daily.weathercode[0];
    const precip=data.daily.precipitation_probability_max?data.daily.precipitation_probability_max[0]+'%':(data.daily.precipitation_sum?data.daily.precipitation_sum[0]+'mm':'');
    setv('wxTemp',`${Math.round(tMax)}°C / ${Math.round(tMin)}°C`); setv('wxPrecip',precip);
    setv('wxCond',WMO[code]||('Code '+code));
    setv('wxSun',`${(data.daily.sunrise[0]||'').split('T')[1]||''} / ${(data.daily.sunset[0]||'').split('T')[1]||''}`);
    /* G16 — the "last fetched" stamp moves HERE and only here, because this is the
       only place a fetch actually happens. Written onto the record in memory and
       carried to Supabase by the next saveShootDay(), exactly like the four weather
       fields it sits beside — no extra save of its own. Stored as an ISO timestamp
       so it can be compared and sorted; weatherFetchedLabel() renders it. */
    const fetchedDay = currentDay();
    if(fetchedDay) fetchedDay.weather = Object.assign({}, fetchedDay.weather, {fetchedAt:new Date().toISOString()});
    s.textContent=`Fetched (${source}) just now.`;
  }catch(e){ s.textContent='Fetch failed — check your connection.'; }
}
async function saveShootDay(thenGenerate){
  const idx=shootDaysDB.findIndex(x=>x.id===currentShootDayId); if(idx<0) return;
  const d=shootDaysDB[idx];
  d.dayNum=val('sdDayNum'); d.date=val('sdDate'); d.allCrewCall=val('sdAllCall');
  /* G19 — shed the stale stored total on the next write of this day. Nothing reads
     it any more (buildFullData() derives it), so this is tidiness rather than
     correctness — chosen over a read-path strip precisely so this stays clear of
     the weather.fetchedAt mixed-format handling AR put in this same function. */
  delete d.dayTotal;
  d.locationId=document.getElementById('sdLocation').value;
  d.additionalLocationIds=rowsOf('rows-sdaddloc',['sdaddloc-sel','sdaddloc-note']);
  /* G16 — fetchedAt says how STALE the forecast is, which is a real operational
     question on this screen. It must therefore only move when a fetch actually
     happened (fetchWeatherForDay(), which stamps it there). This used to restamp
     unconditionally, so autosave — which fires on any input on this tab — reported
     weather as "fetched today" after editing a schedule row. Preserve whatever the
     record already holds; a day that has never been fetched keeps ''. */
  d.weather={temp:val('wxTemp'),precip:val('wxPrecip'),cond:val('wxCond'),sun:val('wxSun'),
             fetchedAt:(d.weather&&d.weather.fetchedAt)||''};
  d.schedule=rowsOf('rows-sched',['sc-time','sc-dur','sc-desc']);
  const prevPositions = d.positions || [];
  const newPositionsRaw = rowsOf('rows-posn',['posn-crew','posn-call']);
  d.positions = newPositionsRaw.map(([cid,call])=>{
    const prev = prevPositions.find(p=>p[0]===cid);
    return [cid, call, '', prev?(prev[3]||''):'', prev?(prev[4]||''):''];
  });
  // store only what actually differs from the project defaults, so later default changes flow through
  const projTS = Object.assign({}, TECHSPEC_DEFAULTS, (projectOf(d)||{}).techSpecs||{});
  const entered = readTechSpecFields('ts');
  const tsOv = {};
  TECHSPEC_FIELDS.forEach(f=>{ if((entered[f]||'') !== (projTS[f]||'')) tsOv[f] = entered[f]; });
  if(Object.keys(tsOv).length) d.techSpecs = tsOv; else delete d.techSpecs;
  d.brief=parseBriefLines(val('sdBrief'));
  d.parking=val('sdParking'); d.notes=val('sdNotes');
  const saved = await saveDB('db:shootdays',shootDaysDB);
  flashSaveResult('sdStatus', saved);
  // Don't walk the user to the export screen off the back of a save that didn't
  // land — the call sheet they'd generate is one this database has never seen.
  if(thenGenerate && saved && saved.ok) goProjectTab('preview');
}

const OVERRIDABLE_FIELDS = ['role','department','subDepartment','coProductionCompany'];

   the entry's own role/department layered on), so a person holding two entries resolves

  const ov = day && day.crewOverrides && day.crewOverrides[entryId];

function positionOutputCompare(a,b){

    || roleSeniorityRank(deptBucketKey(a.department), a.canonicalRole)-roleSeniorityRank(deptBucketKey(b.department), b.canonicalRole)

  const crewOnly = allPositions.filter(r=>!r.coProductionCompany);

  // out of the canonical-department-order crew list into their own dedicated blocks
  const positions = crewOnly.filter(r=>!['Client','Talent'].includes(deptBucketKey(r.department))).sort(positionOutputCompare);
  const clientPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Client').sort(positionOutputCompare);
  const talentPositions = crewOnly.filter(r=>deptBucketKey(r.department)==='Talent').sort(positionOutputCompare);
  const coProBuckets = {};
  allPositions.filter(r=>r.coProductionCompany).forEach(r=>{ (coProBuckets[r.coProductionCompany]=coProBuckets[r.coProductionCompany]||[]).push(r); });
  const coProductionGroups = Object.keys(coProBuckets).sort((a,b)=>a.localeCompare(b))
    .map(company=>({ company, people: coProBuckets[company].sort(positionOutputCompare) }));

  const cameraDesignations = cameraDesignationRows(cams);

  if(d.addLocs.length){ L.push('','*ADDITIONAL LOCATIONS*'); d.addLocs.forEach(l=>L.push(`- ${l.name} — ${l.address||''}${l.note?(' ('+l.note+')'):''}`)); }
  if(d.hospital) L.push('','*NEAREST HOSPITAL*',`${d.hospital.name} — ${d.hospital.address||''} (~${d.hospital.distanceKm}km)`);
  if(d.schedule.length){ L.push('','*SCHEDULE*'); d.schedule.forEach(r=>L.push(`${r[0]}${r[1]?(' ('+r[1]+')'):''} — ${r[2]}`)); }
  pushPeopleLines(L, 'CLIENT', d.clientPositions);
  pushPeopleLines(L, 'POSITIONS', d.positions);
  pushPeopleLines(L, 'TALENT', d.talentPositions);
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>pushPeopleLines(L, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(d.brief.length){ L.push('','*PRODUCTION BRIEF*'); d.brief.forEach(l=>L.push(`- ${l}`)); }
  if(d.parking) L.push('','*PARKING / ARRIVAL*',d.parking);
  if(d.notes) L.push('','*NOTES*',d.notes);
  /* Phase Q — the four optional sections, appended in the same order the printable
     shape stacks them, each gated by its Include checkbox. Tech specs used to be
     hardcoded OUT of this text ("the version for the full crew"); that rule is now
     the Tech specs checkbox instead of a rule nobody could see, so the old crew-wide
     message is one untick away. Hotels/Catering/Travel are project-wide summaries,
     not per-day slices — the same text their Copy buttons produce. */
  if(exportSections.tech){ L.push(''); techSpecsLines(d).forEach(l=>L.push(l)); }
  if(exportSections.hotels){ const h=hotelSummaryLines(); if(h){ L.push('','*HOTELS*'); h.forEach(l=>L.push(l)); } }
  if(exportSections.catering){ const c=cateringOrderLines(); if(c){ L.push('','*CATERING*'); c.forEach(l=>L.push(l)); } }
  if(exportSections.travel){ const t=transportSummaryLines(); if(t){ L.push('','*TRAVEL*'); t.forEach(l=>L.push(l)); } }
  return L.join('\n');
}
/* pushes a heading row, a Dept/Position/Name/Call/Phone header row, and one row per
   person — the shared Excel block for Client, Position assignments, Talent and each
   co-production group */
function pushPeopleRows(aoa, heading, people){
  if(!people || !people.length) return;
  aoa.push([heading]); aoa.push(['Dept','Position','Name','Call','Phone']);
  people.forEach(r=>aoa.push([DEPARTMENT_CODES[deptBucketKey(r.department)]||'',r.role,r.name,r.call,r.phone])); aoa.push([]);
}
function downloadExcel(){
  const d=currentDay(); if(!d) return;
  const data=buildFullData(d); const aoa=[];
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  aoa.push([data.prodCompany,data.shootTitle]); aoa.push([fmtDate(data.shootDate),dayLine,data.allCrewCall?('All-crew call: '+data.allCrewCall):'']); aoa.push([]);
  const w=data.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ aoa.push(['WEATHER']); aoa.push(['Temp',w.temp,'Precip',w.precip,'Condition',w.cond,'Sunrise/Sunset',w.sun]); aoa.push([]); }
  if(data.primary){ aoa.push(['PRIMARY LOCATION']); aoa.push([data.primary.name,data.primary.address]); if(data.primary.onsiteContactName)aoa.push(['On-site contact',data.primary.onsiteContactName,data.primary.onsiteContactPhone||'']); if(data.primary.accessInfo)aoa.push(['Access',data.primary.accessInfo]); if(data.primary.recceInfo)aoa.push(['Recce',data.primary.recceInfo]); aoa.push([]); }
  if(data.addLocs.length){ aoa.push(['ADDITIONAL LOCATIONS']); aoa.push(['Name','Address','Note']); data.addLocs.forEach(l=>aoa.push([l.name,l.address,l.note])); aoa.push([]); }
  if(data.hospital){ aoa.push(['NEAREST HOSPITAL']); aoa.push([data.hospital.name,data.hospital.address,data.hospital.distanceKm+'km']); aoa.push([]); }
  if(data.schedule.length){ aoa.push(['SCHEDULE']); aoa.push(['Time','Duration','Description']); data.schedule.forEach(r=>aoa.push(r)); aoa.push([]); }
  pushPeopleRows(aoa, 'CLIENT', data.clientPositions);
  pushPeopleRows(aoa, 'POSITION ASSIGNMENTS', data.positions);
  pushPeopleRows(aoa, 'TALENT', data.talentPositions);
  if(data.coProductionGroups && data.coProductionGroups.length){
    data.coProductionGroups.forEach(g=>pushPeopleRows(aoa, `${g.company.toUpperCase()} (CO-PRODUCTION)`, g.people));
  }
  if(data.brief.length){ aoa.push(['PRODUCTION BRIEF']); data.brief.forEach(l=>aoa.push([l])); aoa.push([]); }
  if(data.parking){ aoa.push(['PARKING / ARRIVAL']); aoa.push([data.parking]); aoa.push([]); }
  if(data.notes){ aoa.push(['PRODUCTION NOTES']); aoa.push([data.notes]); }
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:24},{wch:24},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Call Sheet');
  /* Phase Q — one sheet per ticked section, same four checkboxes that gate the
     printable blocks and the WhatsApp text. A section with no data at all still
     produces no sheet, ticked or not: an empty tab is worse than a missing one. */
  const addSheet=(name, sheetAoa, cols)=>{
    const s=XLSX.utils.aoa_to_sheet(sheetAoa);
    if(cols) s['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,s,name);
  };
  if(exportSections.tech){
    const tsRows=techSpecRows(data.techSpecs||{});
    const tsAoa=[['TECH SPECS — camera/technical crew reference'],[],...tsRows];
    if(data.cameraDesignations && data.cameraDesignations.length){
      tsAoa.push([]); tsAoa.push(['CAMERA DESIGNATIONS']); tsAoa.push(['Camera','Name','Shorthand','File tag']);
      data.cameraDesignations.forEach(cd=>tsAoa.push([cd.letter, cd.name, cd.shorthand||'', cd.tag]));
    }
    addSheet('Tech Specs', tsAoa, [{wch:20},{wch:30}]);
  }
  if(exportSections.hotels){
    const hotel=buildHotelSummary();
    if(hotel){
      const hAoa=[['HOTEL BOOKING', hotel.summary],[],['ROOM-BOOKING TABLE'],['Room No.','Name','Date from','Date to','Total nights']];
      hotel.roomBooking.forEach(r=>hAoa.push([r.roomNo, r.name, r.from, r.to, r.totalNights]));
      hAoa.push([]); hAoa.push(['PER-NIGHT TABLE']); hAoa.push(['Night','Rooms','Names']);
      hotel.perNight.forEach(n=>hAoa.push([n.label, n.rooms, n.names.join(', ')]));
      addSheet('Hotel', hAoa, [{wch:10},{wch:24},{wch:16},{wch:16},{wch:40}]);
    }
  }
  if(exportSections.catering){
    const catering=buildCateringExport();
    if(catering){
      const cAoa=[['CATERING ORDER'],[]];
      catering.forEach(day=>{
        cAoa.push([day.label]); cAoa.push(['Meal','Count']);
        if(day.bCount) cAoa.push(['Breakfast', day.bCount]);
        if(day.lCount) cAoa.push(['Lunch', day.lCount]);
        if(day.dCount) cAoa.push(['Dinner', day.dCount]);
        if(day.dietaryNotes.length){
          cAoa.push(['Dietary requirements']); cAoa.push(['Name','Type','Specific']);
          day.dietaryNotes.forEach(n=>cAoa.push([n.name, n.general, n.specific]));
        }
        cAoa.push([]);
      });
      addSheet('Catering', cAoa, [{wch:24},{wch:18},{wch:32}]);
    }
  }
  if(exportSections.travel){
    const travel=buildTransportSummary();
    if(travel){
      const tAoa=[['TRANSPORT SUMMARY'],[], ['Method', ...travel.cols.map(c=>c.label)]];
      travel.usedMethods.forEach(m=>tAoa.push([m, ...travel.cols.map(c=>c.counts[m])]));
      tAoa.push(['Daily cost', ...travel.cols.map(c=>Number((c.dailyCost||0).toFixed(2)))]);
      tAoa.push([]); tAoa.push(['Total transport cost', Number((travel.totalCost||0).toFixed(2))]);
      addSheet('Travel', tAoa, [{wch:24}]);
    }
  }
  XLSX.writeFile(wb,`callsheet-${data.shootDate||'draft'}${data.dayNum?('-day'+data.dayNum):''}.xlsx`);
}
</script>
