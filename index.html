/* Overview "shoot days" count field — kept in sync both ways with the actual
   Shoot Days list. Growing it creates blank new days (same shape as + New day).
   Shrinking it never silently deletes — it always asks which day to lose. */
async function syncShootDayCount(newCountStr){
  const p = currentProject(); if(!p) return;
  const days = projectDays(p.id);
  const newCount = parseInt(newCountStr, 10);
  if(!Number.isFinite(newCount) || newCount < 0 || newCount === days.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
  if(newCount > days.length){
    for(let i=days.length; i<newCount; i++){
      const rec = makeShootDayRecord(p.id, p);
      shootDaysDB.push(rec);
    }
    await saveDB('db:shootdays', shootDaysDB);
    renderProjectOverview(document.getElementById('projectBody'));
    return;
  }
  // shrinking — ask which specific day(s) to lose rather than guessing
  const dayLabel = d => `Day ${d.dayNum||'?'}${d.date?' — '+fmtDate(d.date):''}${d.locationId?' — '+((locById(d.locationId)||{}).name||''):''}`;
  let remaining = days.slice();
  const toRemove = [];
  const removeCount = days.length - newCount;
  for(let i=0; i<removeCount; i++){
    const list = remaining.map((d,idx)=>`${idx+1}. ${dayLabel(d)}`).join('\n');
    const choice = prompt(`Which shoot day have we lost?\n\n${list}\n\nEnter a number (1-${remaining.length}), or Cancel to leave the count as-is:`);
    if(choice===null){ renderProjectOverview(document.getElementById('projectBody')); return; }
    const idx = parseInt(choice, 10) - 1;
    if(!Number.isFinite(idx) || idx<0 || idx>=remaining.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
    toRemove.push(remaining[idx].id);
    remaining = remaining.filter((d,i2)=>i2!==idx);
  }
  shootDaysDB = shootDaysDB.filter(d=>!toRemove.includes(d.id));
  if(toRemove.includes(currentShootDayId)) currentShootDayId = null;
  await saveDB('db:shootdays', shootDaysDB);
  renderProjectOverview(document.getElementById('projectBody'));
}

/* --- address search --- */
let addrSearchTimer;
function debouncedAddressSearch(){ clearTimeout(addrSearchTimer); addrSearchTimer=setTimeout(runAddressSearch,600); }
async function runAddressSearch(){
  const q = val('nlSearchBox'); const box=document.getElementById('nlSearchResults');
  if(q.length<3){ box.style.display='none'; return; }
  box.innerHTML='<div class="sritem">Searching…</div>'; box.style.display='';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(!data.length){ box.innerHTML='<div class="sritem">No matches found</div>'; return; }
    box.innerHTML = data.map((r,i)=>`<div class="sritem" onclick="pickAddress(${i})">${esc(r.display_name)}</div>`).join('');
    window._addrResults = data;
  }catch(e){ box.innerHTML='<div class="sritem">Search failed — check your connection</div>'; }
}
function pickAddress(i){
  const r = window._addrResults[i];
  setv('nlAddress', r.display_name);
  setv('nlLatLon', parseFloat(r.lat).toFixed(5)+', '+parseFloat(r.lon).toFixed(5));
  locFormState.lat=parseFloat(r.lat); locFormState.lon=parseFloat(r.lon);
  document.getElementById('nlSearchResults').style.display='none'; setv('nlSearchBox','');
  updateMapPreview();
}
function updateMapPreview(){
  const el=document.getElementById('nlMapPreview'); if(!el) return;
  if(locFormState.lat==null){ el.innerHTML=''; return; }
  const d=0.01, bbox=[locFormState.lon-d,locFormState.lat-d,locFormState.lon+d,locFormState.lat+d].join(',');
  el.innerHTML=`<iframe class="mapembed" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${locFormState.lat},${locFormState.lon}&layer=mapnik"></iframe>`;
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ---- nearest-amenity lookup (OpenStreetMap Overpass) ----
   Hospitals and parking are the same query with a different amenity tag and search
   radii — parking is far denser than hospitals, so it starts much tighter (1km) or
   the nearest result is just noise. Radii are tried in order, widening only if the
   tighter one found nothing. */
const AMENITY_SEARCH = {
  hospital: { tag:'hospital', radii:[10000,25000], noun:'hospital',  unnamed:'Unnamed hospital', field:'hospital',       stateKey:'hospital', elId:'nlHospitalInfo' },
  parking:  { tag:'parking',  radii:[1000,3000,8000], noun:'parking', unnamed:'Unnamed parking', field:'nearestParking', stateKey:'parking',  elId:'nlParkingInfo' },
};
async function findNearestAmenity(kind, lat, lon){
  const cfg = AMENITY_SEARCH[kind];
  for(const r of cfg.radii){
    const query=`[out:json][timeout:20];node["amenity"="${cfg.tag}"](around:${r},${lat},${lon});out;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    const data=await res.json();
    if(data.elements && data.elements.length){
      let best=null,bestD=Infinity;
      data.elements.forEach(el=>{ const dist=haversine(lat,lon,el.lat,el.lon); if(dist<bestD){bestD=dist;best=el;} });
      const t=best.tags||{};
      const addr=[t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:postcode']].filter(Boolean).join(', ');
      return { name:t.name||cfg.unnamed, address:addr, phone:t.phone||t['contact:phone']||'', distanceKm:bestD.toFixed(1) };
    }
  }
  return null;
}
/* the "Find nearest…" buttons on the location form — same flow for both kinds */
async function lookupAmenityForForm(kind){
  const cfg = AMENITY_SEARCH[kind];
  const infoEl=document.getElementById(cfg.elId); if(!infoEl) return;
  if(locFormState.lat==null){ alert('Search and pick an address first so we have coordinates to search from.'); return; }
  infoEl.textContent=`Searching nearby ${cfg.noun}…`;
  try{
    const found = await findNearestAmenity(kind, locFormState.lat, locFormState.lon);
    if(!found){ infoEl.textContent=`No ${cfg.noun} found nearby.`; return; }
    locFormState[cfg.stateKey]=found;
    infoEl.textContent=amenityLine(found);
  }catch(e){ infoEl.textContent='Lookup failed — check your connection.'; }
}

/* ---------- schedule time/duration helpers ---------- */
function parseTimeStrToMins(s){
  const m = (s||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function parseTimeRangeToMins(s){
  const parts = (s||'').split('-');
  if(parts.length!==2) return null;
  const start = parseTimeStrToMins(parts[0]), end = parseTimeStrToMins(parts[1]);
  if(start==null||end==null) return null;
  return {start,end};
}
function parseDurationToMins(s){
  if(!s) return null;
  s = s.trim();
  const full = s.match(/^(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?\s+(\d+)$/i);
  if(full) return Math.round(parseFloat(full[1])*60) + parseInt(full[2],10);
  let mins=0, matched=false;
  const hrM = s.match(/(\d+(?:\.\d+)?)\s*h/i);
  if(hrM){ mins += Math.round(parseFloat(hrM[1])*60); matched=true; }
  const minM = s.match(/(\d+)\s*m/i);
  if(minM){ mins += parseInt(minM[1],10); matched=true; }
  if(!matched){
    const bareNum = s.match(/^(\d+)$/);
    if(bareNum) return parseInt(bareNum[1],10);
    return null;
  }
  return mins;
}
function formatMinsAsDuration(mins){
  if(mins==null) return '';
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return `${h}hr${h>1?'s':''} ${m}min`;
  if(h) return `${h}hr${h>1?'s':''}`;
  return `${m}min`;
}
function formatMinsAsTime(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function onScheduleTimeInput(input){
  const range = parseTimeRangeToMins(input.value);
  if(!range) return;
  const durInput = input.closest('.row').querySelector('.sc-dur');
  if(durInput) durInput.value = formatMinsAsDuration(range.end - range.start >= 0 ? range.end-range.start : range.end-range.start+1440);
}
function onScheduleDurationInput(input){
  const row = input.closest('.row');
  const timeInput = row.querySelector('.sc-time');
  if(!timeInput || (timeInput.value||'').includes('-')) return; // don't override an existing range
  const start = parseTimeStrToMins(timeInput.value);
  if(start==null) return;
  const durMins = parseDurationToMins(input.value);
  if(durMins==null) return;
  timeInput.value = formatMinsAsTime(start) + ' - ' + formatMinsAsTime(start+durMins);
}
function moveSchedRow(btn, dir){

function shiftScheduleTimes(deltaMinutes, onlySelected){

    if(onlySelected){ const sel = row.querySelector('.sc-select'); if(!sel || !sel.checked) return; }

const WMO={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm'};
async function fetchWeatherForDay(){
  const loc=selectedDayLocation();
  const dateStr=val('sdDate'); const s=document.getElementById('weatherStatus');
  if(!loc||loc.lat==null){ s.textContent='Pick a primary location with saved coordinates first.'; return; }
  if(!dateStr){ s.textContent='Set the shoot date first.'; return; }
  s.textContent='Fetching…';
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((new Date(dateStr+'T00:00:00')-today)/86400000);
  try{
    let url,source;
    if(diffDays<0){ url=`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset&timezone=auto`; source='historical'; }
    else if(diffDays<=15){ url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto`; source='forecast'; }
    else{ s.textContent=`Shoot date is ${diffDays} days out — forecasts only reach ~16 days. Try again nearer the date.`; return; }
    const data=await(await fetch(url)).json();
    if(!data.daily||!data.daily.time||!data.daily.time.length){ s.textContent='No weather data for that date/location.'; return; }
    const tMax=data.daily.temperature_2m_max[0], tMin=data.daily.temperature_2m_min[0], code=data.daily.weathercode[0];
    const precip=data.daily.precipitation_probability_max?data.daily.precipitation_probability_max[0]+'%':(data.daily.precipitation_sum?data.daily.precipitation_sum[0]+'mm':'');
    setv('wxTemp',`${Math.round(tMax)}°C / ${Math.round(tMin)}°C`); setv('wxPrecip',precip);
    setv('wxCond',WMO[code]||('Code '+code));
    setv('wxSun',`${(data.daily.sunrise[0]||'').split('T')[1]||''} / ${(data.daily.sunset[0]||'').split('T')[1]||''}`);
    s.textContent=`Fetched (${source}) just now.`;
  }catch(e){ s.textContent='Fetch failed — check your connection.'; }
}

        ${(base.roles&&base.roles.length) ? `<select onchange="if(this.value!=='__keep__')document.getElementById('ovRole').value=this.value;" onclick="event.stopPropagation()" style="margin-bottom:4px;" title="Quick-pick one of their saved roles">
            <option value="__keep__">— pick a saved role for this day —</option>
            ${base.roles.map(rp=>{const name=rp.includes('/')?rp.split('/').slice(1).join('/'):rp; return `<option value="${esc(name)}" ${eff.role===name?'selected':''}>${esc(name)}</option>`;}).join('')}
          </select>` : ''}
        <input type="text" id="ovRole" value="${esc(eff.role||'')}">
      </div>
      <div><label>Department</label><select id="ovDept">${deptOpts}</select></div>
      <div><label>Lead company</label><select id="ovCoPro">${coOpts}</select></div>
    </div>
    <div class="toolbar">
      <button class="primary" onclick="saveDayOverride('${crewId}')">Save for this day</button>
      ${overridden?`<button class="danger" onclick="clearDayOverride('${crewId}')">Revert to database</button>`:''}
      <button onclick="editCrew('${crewId}')">Cancel</button>
    </div>
  </div>`;
}
async function saveDayOverride(crewId){
  const day = currentDay(); if(!day) return;
  const base = crewById(crewId) || {};
  const pathVal = val('ovDept');
  const [dept, ...rest] = pathVal.split('/');
  const proposed = { role: val('ovRole'), department: dept||'', subDepartment: rest.join('/'), coProductionCompany: val('ovCoPro') };
  // only store fields that actually differ from the database record
  const ov = {};
  OVERRIDABLE_FIELDS.forEach(f=>{ if((proposed[f]||'') !== (base[f]||'')) ov[f] = proposed[f]; });
  day.crewOverrides = day.crewOverrides || {};
  if(Object.keys(ov).length) day.crewOverrides[crewId] = ov; else delete day.crewOverrides[crewId];
  await saveDB('db:shootdays', shootDaysDB);
  editingCrewId = null;
  renderPositionAssignments();
}
async function clearDayOverride(crewId){
  const day = currentDay(); if(!day) return;
  if(day.crewOverrides) delete day.crewOverrides[crewId];
  await saveDB('db:shootdays', shootDaysDB);
  editingCrewId = null;
  renderPositionAssignments();
}
function buildFullData(d){
  const p=projById(d.projectId)||{};
  const primary=locById(d.locationId);
  const addLocs=(d.additionalLocationIds||[]).map(([id,note])=>{const l=locById(id);return l?{name:l.name,address:l.address,note}:null;}).filter(Boolean);
  const allPositions=(d.positions||[]).map(([cid,call])=>{const c=resolveCrewForDay(cid, d);return{role:c.role,name:c.name,call,phone:c.phone,department:c.department||'',subDepartment:c.subDepartment||'',coProductionCompany:c.coProductionCompany||''};});
  const positions = allPositions.filter(r=>!r.coProductionCompany).sort((a,b)=>deptRank(a.department)-deptRank(b.department));
  const coProBuckets = {};
  allPositions.filter(r=>r.coProductionCompany).forEach(r=>{ (coProBuckets[r.coProductionCompany]=coProBuckets[r.coProductionCompany]||[]).push(r); });
  const coProductionGroups = Object.keys(coProBuckets).sort((a,b)=>a.localeCompare(b))
    .map(company=>({ company, people: coProBuckets[company].sort((a,b)=>deptRank(a.department)-deptRank(b.department)) }));
  const cams = resolveCameras(d);
  const cameraDesignations = cams.order.map((cid,oi)=>{
    const c = crewInfo(cid); const baseLetter = letterForIndex(oi);
    return (cams.cameras[cid]||[]).map((cam,ci)=>{
      const letter = baseLetter+String(ci+1).padStart(2,'0');
      return { letter, name:c.name, shorthand:cam.shorthand||'', tag:cameraFileTag(letter,cam.body,c.name) };
    });
  }).flat().concat(
    (cams.unnamed||[]).map((u,ui)=>{
      const letter = 'UM_'+letterForIndex(ui);
      return { letter, name:'Unassigned'+(u.note?(' — '+u.note):''), shorthand:'', tag:cameraFileTag(letter,u.body,'') };
    })
  );
  return { prodCompany:p.company||COMPANY, shootTitle:[p.client,p.title].filter(Boolean).join(' — '),
    dayNum:d.dayNum,dayTotal:d.dayTotal,shootDate:d.date,allCrewCall:d.allCrewCall, weather:d.weather||{},
    primary,addLocs,positions,coProductionGroups, hospital:primary?primary.hospital:null, schedule:d.schedule||[], brief:d.brief||[], parking:d.parking||'', notes:d.notes||'',
    // resolved, not raw: a day stores only what DIFFERS from the project defaults
    // (saveShootDay deletes d.techSpecs entirely when nothing differs), so reading
    // d.techSpecs directly exported blank tech specs for every day on the defaults.
    techSpecs:resolveTechSpecs(d), cameraDesignations };
}
function generatePreview(d){
  const data=buildFullData(d);
  renderPreviewCard(data);
  document.getElementById('waText').textContent=buildWAText(data);
  renderTechSpecsSection(data);
}
function renderTechSpecsSection(d){
  const el=document.getElementById('techSpecsSection'); if(!el) return;
  const ts=d.techSpecs||{};
  const rows=techSpecRows(ts);
  const cams = d.cameraDesignations||[];
  const headerActions = `<button class="small" onclick="copyTechSpecs()">${icon('copy')} Copy tech specs</button>`;
  if(!rows.length && !cams.length){ el.innerHTML = pvBlockHTML('techspecs', 'Tech specs', headerActions, '<div class="empty-note">No tech specs set for this day yet — add them under Tech, or per-day under Shoot Days.</div>'); return; }
  let body = `<div class="hint" style="margin:0 0 10px;">Camera/technical crew only — not included in the WhatsApp text above.</div>`;
  if(rows.length) body += `<table>${rows.map(([k,v])=>`<tr><th style="width:140px;">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`;
  if(cams.length) body += `<h3 style="margin-top:14px;">Camera designations</h3><table><tr><th>Camera</th><th>Name</th><th>Shorthand</th><th>File tag</th></tr>${cams.map(cd=>`<tr><td>${esc(cd.letter)}</td><td>${esc(cd.name)}</td><td>${esc(cd.shorthand||'')}</td><td style="font-family:var(--mono);">${esc(cd.tag)}</td></tr>`).join('')}</table>`;
  el.innerHTML = pvBlockHTML('techspecs', 'Tech specs', headerActions, body);
}
function copyTechSpecsText(){
  const d=currentDay(); if(!d) return '';
  const data=buildFullData(d); const ts=data.techSpecs||{};
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  const L=[`*TECH SPECS* — ${data.shootTitle||''} ${dayLine}`.trim()];
  techSpecRows(ts).forEach(([k,v])=>L.push(`${k}: ${v}`));
  if(data.cameraDesignations && data.cameraDesignations.length){
    L.push('','*CAMERA DESIGNATIONS*');
    data.cameraDesignations.forEach(cd=>L.push(`Camera ${cd.letter} — ${cd.name}${cd.shorthand?(' ['+cd.shorthand+']'):''} (${cd.tag})`));
  }
  return L.join('\n');
}
function copyTechSpecs(){ return copyText(copyTechSpecsText()); }
function renderPreviewCard(d){
  const dayLine=(d.dayNum||d.dayTotal)?`Day ${d.dayNum||'?'}${d.dayTotal?(' of '+d.dayTotal):''}`:'';
  const open = previewBlocks.callsheet;
  const header=`<div class="sd-block-head-toggle" onclick="togglePreviewBlock('callsheet')">
      <span class="dept-caret" id="pvc-callsheet">${open?'▾':'▸'}</span>
      <div>
        <div class="line1">${esc(d.prodCompany)}${d.shootTitle?(' · '+esc(d.shootTitle)):''}</div>
        <div class="sub">${[fmtDate(d.shootDate),dayLine,d.allCrewCall?('All-crew call '+esc(d.allCrewCall)):''].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  let h='';

  /* ---- two-column key-info block at the top ---- */
  let col1='', col2='';
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)) col1+=`<div class="ki-item"><h4>Weather</h4><div>${[w.temp,w.precip,w.cond,w.sun&&('☀ '+w.sun)].filter(Boolean).map(esc).join(' · ')}</div></div>`;
  if(d.primary){
    col1+=`<div class="ki-item"><h4>Primary location</h4><div>${esc(d.primary.name)}<br>${esc(d.primary.address||'')}</div>`;
    if(d.primary.onsiteContactName) col1+=`<div class="hint">Contact: ${esc(d.primary.onsiteContactName)}${d.primary.onsiteContactPhone?(' — '+esc(d.primary.onsiteContactPhone)):''}</div>`;
    col1+=`</div>`;
  }
  if(d.hospital) col1+=`<div class="ki-item"><h4>Nearest hospital</h4><div>${esc(d.hospital.name)}<br>${esc(d.hospital.address||'')} (~${esc(d.hospital.distanceKm)}km)</div></div>`;
  if(d.brief.length) col2+=`<div class="ki-item"><h4>Production brief</h4><ul>${d.brief.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  if(d.parking) col2+=`<div class="ki-item"><h4>Parking / arrival</h4><div>${esc(d.parking).replace(/\n/g,'<br>')}</div></div>`;
  if(d.notes) col2+=`<div class="ki-item"><h4>Production notes</h4><div>${esc(d.notes).replace(/\n/g,'<br>')}</div></div>`;
  if(col1||col2) h+=`<div class="key-info-grid"><div class="ki-col">${col1}</div><div class="ki-col">${col2}</div></div>`;

  if(d.addLocs.length) h+=`<h3>Additional locations</h3><ul>`+d.addLocs.map(l=>`<li>${esc(l.name)} — ${esc(l.address||'')}${l.note?(' ('+esc(l.note)+')'):''}</li>`).join('')+`</ul>`;
  if(d.schedule.length){ h+=`<h3>Schedule</h3><div class="tablewrap"><table><tr><th>Time</th><th>Duration</th><th>Description</th></tr>`+d.schedule.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')+`</table></div>`; }
  if(d.positions.length){ h+=`<h3>Position assignments</h3><div class="tablewrap"><table><tr><th>Dept</th><th>Position</th><th>Name</th><th>Call</th><th>Phone</th></tr>`+d.positions.map(r=>`<tr><td>${esc(DEPARTMENT_CODES[deptBucketKey(r.department)]||'')}</td><td>${esc(r.role)}</td><td>${esc(r.name)}</td><td>${esc(r.call)}</td><td>${esc(r.phone)}</td></tr>`).join('')+`</table></div>`; }
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>{
      h+=`<h3>${esc(g.company)} <span style="color:var(--muted); text-transform:none; font-weight:400;">(co-production)</span></h3><div class="tablewrap"><table><tr><th>Dept</th><th>Position</th><th>Name</th><th>Call</th><th>Phone</th></tr>`+
        g.people.map(r=>`<tr><td>${esc(DEPARTMENT_CODES[deptBucketKey(r.department)]||'')}</td><td>${esc(r.role)}</td><td>${esc(r.name)}</td><td>${esc(r.call)}</td><td>${esc(r.phone)}</td></tr>`).join('')+`</table></div>`;
    });
  }
  document.getElementById('previewCard').innerHTML = header + `<div id="pvb-callsheet" style="display:${open?'':'none'}; margin-top:14px;">${h}</div>`;
}
function buildWAText(d){
  const L=[]; const dayLine=(d.dayNum||d.dayTotal)?`Day ${d.dayNum||'?'}${d.dayTotal?(' of '+d.dayTotal):''}`:'';
  let head=`*${d.prodCompany}*`; if(d.shootTitle) head+=` — ${d.shootTitle}`; L.push(head);
  const meta=[fmtDate(d.shootDate),dayLine].filter(Boolean).join(' · '); if(meta) L.push(`📅 ${meta}`);
  if(d.allCrewCall) L.push(`⏰ All-crew call: *${d.allCrewCall}*`);
  const w=d.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ L.push('','*WEATHER*'); if(w.temp)L.push(`🌡 ${w.temp}`); if(w.precip)L.push(`☔ ${w.precip}`); if(w.cond)L.push(w.cond); if(w.sun)L.push(`🌅/🌇 ${w.sun}`); }
  if(d.primary){ L.push('','*LOCATION*',`📍 ${d.primary.name}`,d.primary.address||''); if(d.primary.onsiteContactName)L.push(`Contact: ${d.primary.onsiteContactName}${d.primary.onsiteContactPhone?(' — '+d.primary.onsiteContactPhone):''}`); if(d.primary.accessInfo)L.push(`Access: ${d.primary.accessInfo}`); if(d.primary.recceInfo)L.push(`Recce: ${d.primary.recceInfo}`); }
  if(d.addLocs.length){ L.push('','*ADDITIONAL LOCATIONS*'); d.addLocs.forEach(l=>L.push(`- ${l.name} — ${l.address||''}${l.note?(' ('+l.note+')'):''}`)); }
  if(d.hospital) L.push('','*NEAREST HOSPITAL*',`${d.hospital.name} — ${d.hospital.address||''} (~${d.hospital.distanceKm}km)`);
  if(d.schedule.length){ L.push('','*SCHEDULE*'); d.schedule.forEach(r=>L.push(`${r[0]}${r[1]?(' ('+r[1]+')'):''} — ${r[2]}`)); }
  if(d.positions.length){ L.push('','*POSITIONS*'); d.positions.forEach(r=>{ L.push(`*${r.role||'Crew'}* — ${r.name||''}`); const bits=[r.call&&('Call '+r.call),r.phone].filter(Boolean).join(' · '); if(bits)L.push(bits); }); }
  if(d.coProductionGroups && d.coProductionGroups.length){
    d.coProductionGroups.forEach(g=>{
      L.push('',`*${g.company.toUpperCase()} (CO-PRODUCTION)*`);
      g.people.forEach(r=>{ L.push(`*${r.role||'Crew'}* — ${r.name||''}`); const bits=[r.call&&('Call '+r.call),r.phone].filter(Boolean).join(' · '); if(bits)L.push(bits); });
    });
  }
  if(d.brief.length){ L.push('','*PRODUCTION BRIEF*'); d.brief.forEach(l=>L.push(`- ${l}`)); }
  if(d.parking) L.push('','*PARKING / ARRIVAL*',d.parking);
  if(d.notes) L.push('','*NOTES*',d.notes);
  return L.join('\n');
}
function copyWA(){ return copyText(document.getElementById('waText').textContent); }
function downloadExcel(){
  const d=currentDay(); if(!d) return;
  const data=buildFullData(d); const aoa=[];
  const dayLine=(data.dayNum||data.dayTotal)?`Day ${data.dayNum||'?'}${data.dayTotal?(' of '+data.dayTotal):''}`:'';
  aoa.push([data.prodCompany,data.shootTitle]); aoa.push([fmtDate(data.shootDate),dayLine,data.allCrewCall?('All-crew call: '+data.allCrewCall):'']); aoa.push([]);
  const w=data.weather;
  if(w&&(w.temp||w.precip||w.cond||w.sun)){ aoa.push(['WEATHER']); aoa.push(['Temp',w.temp,'Precip',w.precip,'Condition',w.cond,'Sunrise/Sunset',w.sun]); aoa.push([]); }
  if(data.primary){ aoa.push(['PRIMARY LOCATION']); aoa.push([data.primary.name,data.primary.address]); if(data.primary.onsiteContactName)aoa.push(['On-site contact',data.primary.onsiteContactName,data.primary.onsiteContactPhone||'']); if(data.primary.accessInfo)aoa.push(['Access',data.primary.accessInfo]); if(data.primary.recceInfo)aoa.push(['Recce',data.primary.recceInfo]); aoa.push([]); }
  if(data.addLocs.length){ aoa.push(['ADDITIONAL LOCATIONS']); aoa.push(['Name','Address','Note']); data.addLocs.forEach(l=>aoa.push([l.name,l.address,l.note])); aoa.push([]); }
  if(data.hospital){ aoa.push(['NEAREST HOSPITAL']); aoa.push([data.hospital.name,data.hospital.address,data.hospital.distanceKm+'km']); aoa.push([]); }
  if(data.schedule.length){ aoa.push(['SCHEDULE']); aoa.push(['Time','Duration','Description']); data.schedule.forEach(r=>aoa.push(r)); aoa.push([]); }
  if(data.positions.length){ aoa.push(['POSITION ASSIGNMENTS']); aoa.push(['Dept','Position','Name','Call','Phone']); data.positions.forEach(r=>aoa.push([DEPARTMENT_CODES[deptBucketKey(r.department)]||'',r.role,r.name,r.call,r.phone])); aoa.push([]); }
  if(data.coProductionGroups && data.coProductionGroups.length){
    data.coProductionGroups.forEach(g=>{
      aoa.push([`${g.company.toUpperCase()} (CO-PRODUCTION)`]); aoa.push(['Dept','Position','Name','Call','Phone']);
      g.people.forEach(r=>aoa.push([DEPARTMENT_CODES[deptBucketKey(r.department)]||'',r.role,r.name,r.call,r.phone])); aoa.push([]);
    });
  }
  if(data.brief.length){ aoa.push(['PRODUCTION BRIEF']); data.brief.forEach(l=>aoa.push([l])); aoa.push([]); }
  if(data.parking){ aoa.push(['PARKING / ARRIVAL']); aoa.push([data.parking]); aoa.push([]); }
  if(data.notes){ aoa.push(['PRODUCTION NOTES']); aoa.push([data.notes]); }
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:24},{wch:24},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Call Sheet');
  const ts=data.techSpecs||{};
  const tsRows=techSpecRows(ts);
  const tsAoa=[['TECH SPECS — camera/technical crew reference'],[],...tsRows];
  if(data.cameraDesignations && data.cameraDesignations.length){
    tsAoa.push([]); tsAoa.push(['CAMERA DESIGNATIONS']); tsAoa.push(['Camera','Name','Shorthand','File tag']);
    data.cameraDesignations.forEach(cd=>tsAoa.push([cd.letter, cd.name, cd.shorthand||'', cd.tag]));
  }
  const wsTech=XLSX.utils.aoa_to_sheet(tsAoa);
  wsTech['!cols']=[{wch:20},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsTech,'Tech Specs');
  XLSX.writeFile(wb,`callsheet-${data.shootDate||'draft'}${data.dayNum?('-day'+data.dayNum):''}.xlsx`);
}
</script>
