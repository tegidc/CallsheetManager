function buildBudgetData(){
  const p = currentProject();
  const days = budgetFilteredDays();
  /* Phase BF — one row per ENTRY, because day rate and days worked are both entry-level
     now. Travel is NOT: see travelClaimed / travelClaimedToday below. */
  const crew = projectEntryViews(p);
  const hotelCosts = getHotelCosts(p);

  const travelCosts = getTransportCosts(p);
  /* each person's travel at their own terms — per day, or a fare once (travelCostOnDay) */
  const travelOverDays = id => days.reduce((s,d)=>s+travelCostOnDay(p, id, d), 0);

  const crewInScope = crew.filter(personMatchesProjectFilter);
  const costedCrewIds = new Set(crewInScope.map(c=>c.crewId));
  const personInScope = id => costedCrewIds.has(id);
  const prodOn = budgetScope.production ? 1 : 0;
  const prepOn = budgetScope.preproduction ? 1 : 0;
  const postOn = budgetScope.post ? 1 : 0;
  const travelClaimed = new Set();
  /* the same once-per-person rule travelClaimed enforces, for the two other person-level
     costs (a bed and a lunch belong to a human, not to each role they are booked as) */
  const personCostClaimed = new Set();
  const cateringCosts = getCateringCosts(p);
  const people = crewInScope.map(c=>{
    const {rate, hasRate, isOverride, kit} = resolveEntryRate(c.id, p);
    const onShoot = entryOnShoot(c.id, p);
    const daysWorked = onShoot ? entryDayCount(c.id, days) : 0;
    const prepDays = entryInPhase('preproduction', c.id, p) ? (prepDaysOf(c.id, p) || 0) : 0;
    const postDays = entryInPhase('post', c.id, p) ? (postDaysOf(c.id, p) || 0) : 0;
    const ent = entryById(c.id, p);
    const isBuyout = !!(ent && ent.buyout);
    const totalPhaseDays = daysWorked + prepDays + postDays;
    const share = n => totalPhaseDays ? rate * (n / totalPhaseDays) : 0;
    const otUnits = entryOvertime(c.id, p) || 0;
    const otRaw = (!isBuyout && daysWorked > 0) ? rate * otUnits : 0;
    const prodRaw = (isBuyout ? (totalPhaseDays ? share(daysWorked) : rate) : rate * daysWorked) + otRaw;
    const prepRaw = isBuyout ? share(prepDays) : rate * prepDays;
    const postRaw = isBuyout ? share(postDays) : rate * postDays;
    const prodSubtotal = prodRaw * prodOn;
    const prepSubtotal = prepRaw * prepOn;
    const postSubtotal = postRaw * postOn;
    const subtotal = prodSubtotal + prepSubtotal + postSubtotal;
    const claimsPerson = crewOnShoot(c.crewId, p) && !personCostClaimed.has(c.crewId);
    if(claimsPerson) personCostClaimed.add(c.crewId);
    const hotelCost = (claimsPerson && !bookedByThem(p, c.crewId, 'stay'))
      ? hotelNightKeysFor(p, c.crewId, days).reduce((s,k)=>s+hotelNightTerms(p, c.crewId, k).rate, 0) * prodOn : 0;
    const mealCost = !claimsPerson ? 0 : crewOwnCatering(c.crewId, p)
      ? days.reduce((sum,d)=>sum + cateringExtraOnDay(p, c.crewId, d), 0) * prodOn
      : days.reduce((sum,d)=>{
      const m = (d.cateringMeals||{})[c.crewId];
      if(!m) return sum;
      return sum + ['b','l','d'].reduce((n,k)=>n + (m[k] ? mealRateFor(p, c.crewId, k) : 0), 0);
    }, 0) * prodOn;
    const paidDays = daysWorked*prodOn + prepDays*prepOn + postDays*postOn;
    /* ⚠️ A buyout's kit is a share of the FEE, not kit × days — the same reasoning as the
       phase split above. Proportion the kit the same way the rate was agreed. */
    const kitSubtotal = kit==null ? null
      : isBuyout ? (rate ? subtotal * (Math.min(kit, rate) / rate) : 0)
                 : Math.min(kit, rate) * paidDays;
    const labourSubtotal = kit!=null ? subtotal - kitSubtotal : null;
    const claimsTravel = crewOnShoot(c.crewId, p) && !travelClaimed.has(c.crewId);
    if(claimsTravel) travelClaimed.add(c.crewId);
    const travelCostRaw = claimsTravel ? travelOverDays(c.crewId) : 0;
    const travelCost = travelCostRaw * prodOn;
    const travelDays = crewDayCount(c.crewId, days, p);
    const travelRate = travelDays ? travelCost / travelDays : 0;   // per day on average — a fare is spread over their days
    const vatRegistered = c.vatRegistered==='Yes';
    const prodVat = vatRegistered ? (prodSubtotal + travelCost) * VAT_RATE : 0;
    const prepVat = vatRegistered ? prepSubtotal * VAT_RATE : 0;
    const postVat = vatRegistered ? postSubtotal * VAT_RATE : 0;
    const vat = prodVat + prepVat + postVat;
    return {
      id:c.id, crewId:c.crewId, name:c.name, role:c.showAs||c.role, department:deptBucketKey(c.department),
      talentEtc: isTalentEtc(c),
      rate, hasRate, isOverride, kit, kitSubtotal, labourSubtotal,
      hotelCost, mealCost, estCosts: hotelCost + mealCost + travelCost,
      isBuyout, prodRaw, prepRaw, postRaw, travelCostRaw,
      otUnits, otRaw, otSubtotal: otRaw * prodOn,
      prodVatRaw: vatRegistered ? (prodRaw + travelCostRaw) * VAT_RATE : 0,
      prepVatRaw: vatRegistered ? prepRaw * VAT_RATE : 0,
      postVatRaw: vatRegistered ? postRaw * VAT_RATE : 0,
      daysWorked, prepDays, postDays,
      subtotal, prodSubtotal, prepSubtotal, postSubtotal,
      travelRate, travelCost, vatRegistered, vat, prodVat, prepVat, postVat,
      display: budgetPersonDisplay(subtotal, vat)
    };
  }).filter(pp => !(pp.talentEtc && !pp.hasRate));   // Talent etc cost nothing unless a fee was entered — no £0 rows

  const deptTotals = {}, deptCounts = {}, deptExVat = {}, deptVat = {};
  people.forEach(pp=>{
    deptTotals[pp.department] = (deptTotals[pp.department]||0) + pp.display;
    deptCounts[pp.department] = (deptCounts[pp.department]||0) + 1;
    deptExVat[pp.department] = (deptExVat[pp.department]||0) + pp.subtotal;
    deptVat[pp.department]   = (deptVat[pp.department]||0) + pp.vat;
  });
  const departments = DEPARTMENTS.filter(d=>deptCounts[d]).map(d=>
    ({dept:d, code:DEPARTMENT_CODES[d]||'', total:deptTotals[d]||0,
      exVat:deptExVat[d]||0, vat:deptVat[d]||0, incVat:(deptExVat[d]||0)+(deptVat[d]||0)}));

  const buildPhaseSlice = ({label, noteName, dayNoun, subKey, vatKey, daysKey, on}) => {
    const ex = {}, vt = {}, counts = {};
    people.forEach(pp=>{
      if(!pp[subKey] && !pp[daysKey]) return;
      ex[pp.department]     = (ex[pp.department]||0) + pp[subKey];
      vt[pp.department]     = (vt[pp.department]||0) + pp[vatKey];
      counts[pp.department] = (counts[pp.department]||0) + 1;
    });
    const exVat = people.reduce((s,pp)=>s+pp[subKey], 0);
    const vat   = people.reduce((s,pp)=>s+pp[vatKey], 0);
    return {
      // label — the block heading and the export row. noteName — how the phase is named
      // mid-sentence in a hint. dayNoun — how its days are named. All three so the prose
      // reads as English rather than as a label dropped into a template.
      label, noteName, dayNoun, on: !!on,
      departments: DEPARTMENTS.filter(d=>counts[d]).map(d=>
        ({dept:d, code:DEPARTMENT_CODES[d]||'', exVat:ex[d]||0, vat:vt[d]||0,
          incVat:(ex[d]||0)+(vt[d]||0), total: budgetPersonDisplay(ex[d]||0, vt[d]||0)})),
      exVat, vat, incVat: exVat + vat,
      daysTotal: people.reduce((s,pp)=>s+(pp[daysKey]||0), 0),
      peopleCount: people.filter(pp=>pp[daysKey]>0).length
    };
  };
  const prep = buildPhaseSlice({label:'Pre-production', noteName:'pre-production', dayNoun:'Prep days',
    subKey:'prepSubtotal', vatKey:'prepVat', daysKey:'prepDays', on:prepOn});
  const post = buildPhaseSlice({label:'Post', noteName:'the edit', dayNoun:'Edit days',
    subKey:'postSubtotal', vatKey:'postVat', daysKey:'postDays', on:postOn});

  const usesLocation = (d, locId) => d.locationId===locId
    || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId);
  const locationFeeForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    if(!locById(locId)) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    /* null means a booked location ticked on no day at all — its fee is real but belongs to no
       day, so it is charged once, project-wide only, exactly as it always was */
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate : 0);
    return sum + fee;
  }, 0);
  /* one labelled charge at a time — cleaning, an overrun, a breakage — summed once for the
     project. Deliberately outside the per-day arithmetic above. */
  const locationExtrasTotal = (p.locationIds||[])
    .reduce((sum, locId)=> sum + resolveLocationCost(locId, p).extrasTotal, 0);
  const locVatRate = locId => resolveLocationCost(locId, p).vat==='Yes' ? VAT_RATE : 0;
  const locationVatForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    const r = locVatRate(locId); if(!r) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate * r : 0);
    return sum + fee * r;
  }, 0);
  const locationExtrasVat = (p.locationIds||[]).reduce((sum, locId)=>
    sum + resolveLocationCost(locId, p).extrasTotal * locVatRate(locId), 0);
  // Phase BS — every extra below belongs to the shoot, so they all follow prodOn.
  const locationRaw = locationFeeForDays(days) + locationExtrasTotal;
  const locationTotal = locationRaw * prodOn;
  /* follows prodOn exactly as the fee it is charged on does */
  const locationVatTotal = (locationVatForDays(days) + locationExtrasVat) * prodOn;

  const cateringGrid = buildCateringSummaryGrid(personInScope);
  const transportSummary = buildTransportSummary(personInScope);
  const dayIdsInScope = new Set(days.map(d=>d.id));
  const sumDailyCost = g => g ? g.cols.filter(c=>dayIdsInScope.has(c.dayId))
                                      .reduce((s,c)=>s+c.dailyCost, 0) : 0;
  const cateringRaw = sumDailyCost(cateringGrid);
  const travelRaw = sumDailyCost(transportSummary) + talentEtcCosts(p).trip;
  const cateringTotal = cateringRaw * prodOn;
  const travelTotal = travelRaw * prodOn;
  const firstProjectDay = projectDays()[0];
  const preNightRooms = (firstProjectDay && days.some(d=>d.id===firstProjectDay.id))
    ? (p.hotelNightBefore||[]).filter(id=>crewOnShoot(id, p) && personInScope(id) && !bookedByThem(p, id, 'stay')).length : 0;
  const onShootGuests = list => (list||[]).filter(id=>crewOnShoot(id, p) && personInScope(id) && !bookedByThem(p, id, 'stay'));
  const onShootRooms = list => onShootGuests(list).length;
  const dayHotelRooms = days.map(d=>onShootRooms(d.hotelNights));
  /* rooms at each guest's own rate for that night (hotelNightTerms) — the night before folds into Day 1 */
  const preNightGuests = preNightRooms ? onShootGuests(p.hotelNightBefore) : [];
  const preNightCost = preNightGuests.reduce((s,id)=>s+hotelNightTerms(p, id, 'pre').rate, 0);
  const dayHotelCost = days.map(d=>onShootGuests(d.hotelNights).reduce((s,id)=>s+hotelNightTerms(p, id, d.id).rate, 0));
  /* + Talent etc's own hotels and travel where WE book them (e.stay / e.trip, by:'us'). Project-wide,
     like a location booked on no day: they join the Hotels / Travel lines but no single day's column. */
  const talentCosts = talentEtcCosts(p);
  const hotelRaw = preNightCost + dayHotelCost.reduce((s,n)=>s+n,0) + talentCosts.stay;
  const hotelTotal = hotelRaw * prodOn;

  /* IDEAS DEMO — Vendors + Additional costs join the extras. A catering vendor
     that follows the Catering tab REPLACES the separate Catering line (its cost
     is inside the Vendors line), or the same lunches would be counted twice.
     Neither carries VAT yet — a demo simplification to flag in feedback. */
  const vendorBookings = projectVendorCosts(p);
  const cateringViaVendor = vendorBookings.some(vc=>vc.useCateringEstimate);
  const vendorsRaw = vendorBookings.reduce((s,vc)=> s + vendorCostEff(vc, cateringRaw).eff, 0);
  const vendorsTotal = vendorsRaw * prodOn;
  const cateringCounted = cateringViaVendor ? 0 : cateringTotal;
  const additionalRaw = (p.additionalCosts||[]).reduce((s,c)=> s + (parseRateNumber(c.amount)||0), 0);
  const additionalTotal = additionalRaw * prodOn;
  /* LINE ITEMS — lines typed straight into the sheet (p.budgetSheet.lines). True costs like any
     other, so they are in every total; each stage's days follow that stage's switch. */
  const sheetFigs = budgetSheetOf(p).lines.map(sheetLineFigures);
  const customTotal = sheetFigs.reduce((s,f)=>s+f.ex, 0);
  const customVat = sheetFigs.reduce((s,f)=>s+f.vat, 0);
  const customRaw = k => sheetFigs.reduce((s,f)=>s+f.byStage[k], 0);
  const customVatRaw = k => sheetFigs.reduce((s,f)=>s+f.byStage[k]*f.vr, 0);

  /* Budget settings: what the caterer and the hotel charge in VAT. Off (0%) unless the project says so. */
  const bset = budgetSheetOf(p).settings;
  const cateringVat = cateringCounted * (Number(bset.vatCatering)||0)/100;
  const hotelVat = hotelTotal * (Number(bset.vatHotel)||0)/100;
  const extrasVatRaw = (cateringViaVendor ? 0 : cateringRaw) * (Number(bset.vatCatering)||0)/100 + hotelRaw * (Number(bset.vatHotel)||0)/100;
  const crewTotalExVat = people.reduce((s,pp)=>s+pp.subtotal, 0);
  /* ⚠️ locationVatTotal is the ONE non-person VAT in here (Phase CP) — see its note above. It
     has to be in this sum or `ex + vat === inc` stops holding the moment a venue charges VAT. */
  const vatTotal = people.reduce((s,pp)=>s+pp.vat, 0) + locationVatTotal + customVat + cateringVat + hotelVat;
  const extrasTotal = cateringCounted + travelTotal + hotelTotal + locationTotal + vendorsTotal + additionalTotal + customTotal;
  const totalExVat = crewTotalExVat + extrasTotal;
  const totalIncVat = totalExVat + vatTotal;

  const perDay = days.map((d,i)=>{
    const onDayIds = new Set((d.positions||[]).map(pos=>pos[0]));
    const dayPeople = people.filter(pp=>onDayIds.has(pp.id));
    /* Phase BF — a person on this day via two entries must carry their travel (and its
       VAT) ONCE. The first of their entries on this day claims it; the rest score zero.
       That is what keeps the per-day VAT column summing back to the per-person one. */
    const travelClaimedToday = new Set();
    const dayTravelRate = pp => {
      if(travelClaimedToday.has(pp.crewId)) return 0;
      travelClaimedToday.add(pp.crewId);
      return travelCostOnDay(p, pp.crewId, d) * prodOn;
    };
    const dayDeptTotals = {}, dayDeptCounts = {}, dayDeptExVat = {}, dayDeptVat = {};
    dayPeople.forEach(pp=>{
      const perDayShare = pp.daysWorked ? pp.prodRaw / pp.daysWorked : 0;
      const dayRate = perDayShare * prodOn;
      const dayVat = pp.vatRegistered ? (dayRate + dayTravelRate(pp))*VAT_RATE : 0;
      dayDeptTotals[pp.department] = (dayDeptTotals[pp.department]||0) + budgetPersonDisplay(dayRate, dayVat);
      dayDeptCounts[pp.department] = (dayDeptCounts[pp.department]||0) + 1;
      dayDeptExVat[pp.department] = (dayDeptExVat[pp.department]||0) + dayRate;
      dayDeptVat[pp.department]   = (dayDeptVat[pp.department]||0) + dayVat;
    });
    const dayDepartments = DEPARTMENTS.filter(dd=>dayDeptCounts[dd]).map(dd=>
      ({dept:dd, code:DEPARTMENT_CODES[dd]||'', total:dayDeptTotals[dd]||0,
        exVat:dayDeptExVat[dd]||0, vat:dayDeptVat[dd]||0, incVat:(dayDeptExVat[dd]||0)+(dayDeptVat[dd]||0)}));
    const cateringCol = cateringGrid ? cateringGrid.cols.find(c=>c.dayId===d.id) : null;
    const travelCol = transportSummary ? transportSummary.cols.find(c=>c.dayId===d.id) : null;
    // Phase BS — each of these is the per-day half of a project-wide extra that
    // already follows prodOn above; gate them here too or Per Day keeps showing
    // catering/travel/hotel/location after Production has been switched off.
    const dayCatering = (cateringCol ? cateringCol.dailyCost : 0) * prodOn;
    const dayTravel = (travelCol ? travelCol.dailyCost : 0) * prodOn;
    // the night before Day 1 has no shoot-day row of its own — folds into Day 1
    const dayHotel = (dayHotelCost[i] + (i===0 ? preNightCost : 0)) * prodOn;
    const dayLocation = locationFeeForDays([d]) * prodOn;
    const crewDisplay = dayDepartments.reduce((s,dd)=>s+dd.total, 0);
    const loc = d.locationId ? locById(d.locationId) : null;
    // AO — the day's own ex-VAT / VAT / inc-VAT, same shape as the project-wide
    // figures so Per Day's expanded table can use the identical itemized columns.
    const dayExVat = dayDepartments.reduce((s,dd)=>s+dd.exVat, 0)
                     + dayCatering + dayTravel + dayHotel + dayLocation;
    /* ⚠️ the day's share of the venue's VAT rides with the day's share of its fee, so Per Day's
       VAT column still sums back to the project's. The EXTRAS' VAT does not appear here for the
       same reason the extras themselves do not — they belong to no day. */
    const dayVatTotal = dayDepartments.reduce((s,dd)=>s+dd.vat, 0) + locationVatForDays([d]) * prodOn;
    return {
      dayId:d.id, dayNum:d.dayNum, locationLabel: loc ? loc.name : '',
      departments:dayDepartments, catering:dayCatering, travel:dayTravel, hotel:dayHotel,
      location:dayLocation,
      exVat: dayExVat, vat: dayVatTotal, incVat: dayExVat + dayVatTotal,
      total: crewDisplay + dayCatering + dayTravel + dayHotel + dayLocation
    };
  });

  return {
    people, departments, cateringTotal, travelTotal, hotelTotal, locationTotal, locationVatTotal, extrasTotal,
    vendorsTotal, additionalTotal, customTotal, customVat, cateringViaVendor, cateringCounted,
    /* the head's COSTS view — each extra's own VAT (travel's rides on the VAT-registered people who travel) */
    cateringVat, hotelVat, travelVat: people.reduce((s,pp)=>s + (pp.vatRegistered ? pp.travelCost*VAT_RATE : 0), 0),
    /* what buildBudgetLines() needs to itemise the extras without re-deriving them */
    src: { p, days, cateringGrid, transportSummary, dayIdsInScope, cateringCosts, travelCosts, hotelCosts,
           hotelRoomNights: preNightRooms + dayHotelRooms.reduce((s,n)=>s+n,0), preNightRooms, dayHotelRooms, talentCosts,
           preNightGuests, hotelGuestsOn: d => onShootGuests(d.hotelNights), personInScope,
           vendorBookings, cateringRaw, prodOn, prepOn, postOn },
    crewTotalExVat, vatTotal, totalExVat, totalIncVat, perDay,
    byEntry: people.reduce((m,pp)=>{ m[pp.id] = pp; return m; }, {}),
    prep, post, phases:[prep, post],
    phaseRaw: (()=>{
      const daysKeyFor = {preproduction:'prepDays', production:'daysWorked', post:'postDays'};
      const countsFor = scope => {
        const members = people.filter(pp=>entryInPhase(scope, pp.id, p));
        return { peopleCount: new Set(members.map(pp=>pp.crewId)).size,
                 daysTotal: people.reduce((n,pp)=>n+(pp[daysKeyFor[scope]]||0), 0) };
      };
      return {
        preproduction: Object.assign({ ex: people.reduce((n,pp)=>n+pp.prepRaw,0) + customRaw('preproduction'), vat: people.reduce((n,pp)=>n+pp.prepVatRaw,0) + customVatRaw('preproduction') }, countsFor('preproduction')),
        post:          Object.assign({ ex: people.reduce((n,pp)=>n+pp.postRaw,0) + customRaw('post'), vat: people.reduce((n,pp)=>n+pp.postVatRaw,0) + customVatRaw('post') }, countsFor('post')),
        production:    Object.assign({ ex: people.reduce((n,pp)=>n+pp.prodRaw,0) + cateringRaw + travelRaw + hotelRaw + locationRaw + customRaw('production'),
                                       crewEx: people.reduce((n,pp)=>n+pp.prodRaw,0),
                                       vat: people.reduce((n,pp)=>n+pp.prodVatRaw,0) + customVatRaw('production') + extrasVatRaw }, countsFor('production')),
      };
    })(),
    prepOn: !!prepOn, prodOn: !!prodOn, postOn: !!postOn,
    hasCrew: crewInScope.length>0, hasDays: days.length>0
  };
}

/* THE PAGE HEAD — Crew and Talent etc (20 Sep 2026, second pass). CSS: .bnr-head.
     left   Budget (+ what it unlocks) on top · the total in a RESERVED slot · the list's own
            buttons on the bottom line, right above the table. The slot is always there, so
            turning Budget on fills a gap rather than growing the head.
     right  the stage selector — on EVERY sub-tab, so nothing moves when you switch.
   ▾ Stages folds the whole head to one line (appSettings.headFolded, db:settings); the chip
   that stands in for the selector carries the selection's colour — see stageChipHTML(). */
function pageHeadHTML({budgetRowHTML='', totalsHTML='', toolsHTML='', stageHTML='', chipHTML='', noteHTML=''} = {}){
  if(appSettings.headFolded) return `<div class="phase-banner bnr-head bnr-folded">
      ${budgetRowHTML}${toolsHTML}<span class="bnr-grow"></span>${chipHTML}${noteHTML}
    </div>`;
  return `<div class="phase-banner bnr-head">
    <div class="bnr-left">
      <div class="bnr-toolrow">${budgetRowHTML}</div>
      <div class="bnr-totals">${totalsHTML}</div>
      <div class="bnr-toolrow">${toolsHTML}</div>
    </div>
    <div class="budget-scope-stack">${stageHTML}</div>
    ${noteHTML}
  </div>`;
}
async function setHeadFolded(on){
  appSettings.headFolded = !!on;
  renderProjectBody();
  await saveAppSettings();
}
/* + Add | Filter | Select — one joined control; `items` are ready-made .bnr-tool buttons */
const toolGroupHTML = items => `<span class="bnr-group">${items.filter(Boolean).join('')}</span>`;
/* the sub-tab row both tabs use; `rightHTML` is the row's own links (Summary, Collapse all) */
function crewSubTabsHTML(current, setterName, rightHTML){
  const labels = {roles:'Roles', travel:'Travel', catering:'Catering', hotel:'Hotel'};
  return `<div class="tabs crewview-tabs">
    ${Object.keys(labels).map(v=>`<div class="tab ${current===v?'active':''}" onclick="${setterName}('${v}')">${labels[v]}</div>`).join('')}
    ${rightHTML ? `<div class="crew-header-row crew-header-right">${rightHTML}</div>` : ''}
  </div>`;
}
/* Whose figures the head shows. The Crew tab counts crew, Talent etc counts talent and clients —
   money from the budget build's people (talent appear there only once they have a fee), head-
   counts from the entries themselves so a no-fee client still counts as a person in a stage.
   Talent's Production figure includes the hotels and travel WE book for them (talentEtcCosts). */
function stageFiguresFor(data, kind){
  const p = currentProject();
  const wantTalent = kind==='talent', everyone = kind==='all';   // 'all' — Crew's All switch
  const mine = data.people.filter(pp=>everyone || !!pp.talentEtc===wantTalent);
  const entries = projectEntryViews(p).filter(v=>everyone || isTalentEtc(v)===wantTalent).filter(personMatchesProjectFilter);
  const days = budgetFilteredDays();
  const extras = (wantTalent || everyone) ? (c=>c.stay+c.trip)(talentEtcCosts(p)) : 0;
  const sumOf = (list, k) => list.reduce((n,x)=>n+(x[k]||0), 0);
  const daysOf = { preproduction:e=>prepDaysOf(e.id,p)||0, production:e=>entryDayCount(e.id,days), post:e=>postDaysOf(e.id,p)||0 };
  const keys = { preproduction:['prepRaw','prepVatRaw'], production:['prodRaw','prodVatRaw'], post:['postRaw','postVatRaw'] };
  const out = {};
  BUDGET_SCOPES.forEach(([k])=>{
    const members = entries.filter(e=>entryInPhase(k, e.id, p));
    out[k] = { ex: sumOf(mine, keys[k][0]) + (k==='production' ? extras : 0), vat: sumOf(mine, keys[k][1]),
               peopleCount: new Set(members.map(e=>e.crewId)).size,
               daysTotal: members.reduce((n,e)=>n+daysOf[k](e), 0) };
  });
  return { byScope: out,
           totalEx: sumOf(mine,'subtotal') + (budgetScope.production ? extras : 0),
           totalVat: sumOf(mine,'vat') };
}
/* ---- STAGES / DEPT (20 Sep 2026) — the head's breakdown can be cut two ways ----
   The right-hand block of every page head is the stage selector OR the same thing by department:
   click a row to leave it out / bring it back, ONLY to isolate it, the All row to get everything
   back. ⚠️ The two CROSS OVER: a department's figure is for the stages showing, and a stage's
   figure is for the departments showing — both are just filters on the one budget build.
   The department rows write the SHARED crew filter (projectCrewFilter.depts — empty = every
   department), so Crew, Talent etc and Budget all narrow together, as the Filter popup's
   department ticks always have. */
let headBreakdown = 'stages';            // 'stages' | 'depts' | 'costs' (25 Sep 2026 — Hotels / Catering / Travel)
function setHeadBreakdown(v){ headBreakdown = v; renderProjectBody(); }
let headDeptPresent = [];                // the departments the last-drawn head listed
const headDeptOn = d => !projectCrewFilter.depts.size || projectCrewFilter.depts.has(d);
function toggleHeadDept(d){
  let on = headDeptPresent.filter(headDeptOn);
  on = on.includes(d) ? on.filter(x=>x!==d) : on.concat(d);
  projectCrewFilter.depts = new Set((on.length===headDeptPresent.length || !on.length) ? [] : on);
  renderProjectBody();
}
function onlyHeadDept(d){
  const f = projectCrewFilter.depts;
  projectCrewFilter.depts = new Set(f.size===1 && f.has(d) ? [] : [d]);
  renderProjectBody();
}
function allHeadDepts(){ projectCrewFilter.depts = new Set(); renderProjectBody(); }
/* every department's figure, whatever is muted — built with the department filter lifted, the
   way budgetStageFigs() lifts the stage switches. `kind`: 'crew' | 'talent' | null (everyone). */
function withAllDepts(fn){
  const keep = projectCrewFilter.depts; projectCrewFilter.depts = new Set();
  try{ return fn(); } finally { projectCrewFilter.depts = keep; }
}
function headDeptFigs(kind){
  return withAllDepts(()=>{
    const data = buildBudgetData(), by = {};
    data.people.filter(pp=>kind==null || (!!pp.talentEtc)===(kind==='talent')).forEach(pp=>{
      const f = by[pp.department] = by[pp.department] || {ex:0, vat:0, people:new Set()};
      f.ex += pp.subtotal; f.vat += pp.vat; f.people.add(pp.crewId);
    });
    /* someone with no fee still belongs to a department — count them, as the stage rows count days */
    projectEntryViews(currentProject()).filter(v=>kind==null || isTalentEtc(v)===(kind==='talent')).filter(personMatchesProjectFilter).forEach(v=>{
      const d = deptBucketKey(v.department); (by[d] = by[d] || {ex:0, vat:0, people:new Set()}).people.add(v.crewId); });
    return DEPARTMENTS.filter(d=>by[d]).map(d=>({ dept:d, ex:by[d].ex, vat:by[d].vat, inc:by[d].ex+by[d].vat, people:by[d].people.size }));
  });
}
function budgetSummaryBarHTML(data, o){
  o = Object.assign({showTotals:true, showStage:true, showMoneyToggle:false, crewOnly:false, listToolsHTML:null, peopleKind:null,
    topToolsHTML:null, totalsOverrideHTML:null, stageFigs:null, deptFigs:null}, o||{});   // the last three: the Budget page head — see budgetPageHeadHTML()
  /* `peopleKind` ('crew' | 'talent') — the page head's scope; see stageFiguresFor() */
  const kindFigs = o.peopleKind ? stageFiguresFor(data, o.peopleKind) : null;
  /* the four figures the headline and the stack read, switched in ONE place */
  const totalEx  = kindFigs ? kindFigs.totalEx : o.crewOnly ? data.crewTotalExVat : data.totalExVat;
  const totalVat = kindFigs ? kindFigs.totalVat : o.crewOnly ? data.people.reduce((s,pp)=>s+pp.vat, 0) : data.vatTotal;
  const totalInc = totalEx + totalVat;
  const fmt = budgetFmt;
  const stats = [[o.peopleKind==='talent' ? 'Talent total' : o.peopleKind==='all' ? 'Crew & talent total' : o.crewOnly ? 'Crew total' : 'Total',   // body text under the figure now, not a caps label
    budgetVatToggle ? totalInc : totalEx,
    budgetVatToggle ? (totalVat>0 ? `inc. ${fmt(totalVat)} VAT` : '') : 'ex-VAT',
    budgetVatToggle ? `xVAT ${fmt(totalEx)}` : '']];
  const rawOf = key => kindFigs ? kindFigs.byScope[key] : ((data.phaseRaw||{})[key] || {});
  const phaseFigures = key => {
    if(o.stageFigs) return o.stageFigs[key];
    const r = kindFigs ? kindFigs.byScope[key] : ((data.phaseRaw||{})[key] || {ex:0, vat:0});
    /* crewEx exists on production only — the other two are crew fee already */
    const ex = (!kindFigs && o.crewOnly && r.crewEx!=null) ? r.crewEx : (r.ex||0);
    return {ex, vat:r.vat||0, inc:ex+(r.vat||0)};
  };
  const scopeMeta = key => {
    const r = rawOf(key);
    const n = r.peopleCount||0, d = r.daysTotal||0;
    return `${n} ${n===1?'person':'people'} · ${d} ${d===1?'day':'days'}`;
  };
  const iso = isolatedStage();
  const figuresHTML = f => budgetVatToggle ? `
        <span class="budget-scope-ex">${fmt(f.ex)}</span>
        <span class="budget-scope-vat">${f.vat ? fmt(f.vat) : '—'}</span>
        <span class="budget-scope-amt">${fmt(f.inc)}</span>`
        : `<span class="budget-scope-amt">${fmt(f.ex)}</span>`;
  /* All stages — every stage's figures, whatever is muted: it is the way back, and says what is there */
  const allRow = () => {
    const sum = BUDGET_SCOPES.map(([k])=>phaseFigures(k)).reduce((a,f)=>({ex:a.ex+f.ex, vat:a.vat+f.vat, inc:a.inc+f.inc}), {ex:0,vat:0,inc:0});
    const days = BUDGET_SCOPES.reduce((n,[k])=>n+(rawOf(k).daysTotal||0), 0);

  const toolBtn = (on, label, call, title) => `<button type="button" class="bnr-tool${on?' on':''}"

  /* the page head (Crew, Talent etc): see pageHeadHTML() */
  if(o.listToolsHTML!=null){

    const cutBtn = (v, label) => `<span class="bnr-cut${headBreakdown===v?' on':''}" role="button" tabindex="0" aria-pressed="${headBreakdown===v}"

    const chipHTML = `<span class="stage-chip${on.length?'':' none'}" role="button" tabindex="0" onclick="setHeadFolded(false)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setHeadFolded(false);}" title="Open the stage selector">

  return `<div class="phase-banner">

async function deleteAdditionalCost(id){
  const p = currentProject(); if(!p) return;
  p.additionalCosts = (p.additionalCosts||[]).filter(x=>x.id!==id);
  await saveDB('db:projects', projectsDB);
  renderProjectBody();

function budgetOrderedPeople(data){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  if(budgetSort==='dept') return DEPARTMENTS.flatMap(d=>sortHoDFirst(data.people.filter(pp=>pp.department===d)));
  return [...data.people].sort((a,b)=>{
    switch(budgetSort){
      case 'name':   return byName(a,b);
      case 'cost':   return (b.display-a.display) || byName(a,b);
      case 'rate':   return ((b.hasRate?b.rate:-1)-(a.hasRate?a.rate:-1)) || byName(a,b);
      case 'days':   return (b.daysWorked-a.daysWorked) || byName(a,b);
      // "no rate on file" is a to-do list, so those come first, then by name
      case 'noRate': return (Number(a.hasRate)-Number(b.hasRate)) || byName(a,b);
      default:       return byName(a,b);
    }
  });
}

/* Copy / Export read the SAME model the screen does (budgetSheetModel), so a pasted table and
   the tab it came from can't differ. A money cell is { v:number } — text for Copy, a real
   number with a £ format for Excel. */
function budgetExportRows(data, view){
  const B = buildBudgetLines(data), T = B.totals, mode = budgetMode;
  const money = v => ({ v: Math.round((v||0)*100)/100 });
  const rows = [];
  const scope = budgetScopeParts();
  if(scope.length) rows.push(['Filtered to', scope.join(' · ')]);
  // always stated: a budget sent to someone else has to say which halves of the shoot it covers
  rows.push(['Costing', budgetScopeLabel()],
    ['Showing', mode==='cost' ? 'Cost — true costs, no float or production fee' : 'Charged — charged rates, float and production fee'],
    ['VAT', budgetVatToggle ? 'included in every total' : 'left out — every figure is ex-VAT'], [],
    ['Cost', money(T.cost)], ['Charged', money(T.charged)], [`Production fee ${B.sheet.feePct}%`, money(T.fee)],
    ['Final total', money(T.final)], ...(T.vatBack ? [['VAT reclaimed', money(T.vatBack)]] : []), ['Margin', money(T.margin)], []);
  if(view==='lines'){
    rows.push(['Code','Item','Name','Total','Pre','Shoot','Post','Qty','OT','Rate','Charged', ...(budgetVatToggle?['VAT %','VAT']:[]), 'Float %','Float']);
    B.sections.forEach(sec=>{
      if(!sec.lines.length) return;
      rows.push([sec.title, '', '', money(sec.lines.reduce((n,l)=>n+B.fig(l,mode).tot, 0))]);
      sec.lines.forEach(l=>{ const f = B.fig(l, mode);
        rows.push([l.code, l.item, l.name, money(f.tot), l.isBuyout?'':(l.pre||''), l.isBuyout?'':(l.shoot||''), l.isBuyout?'':(l.post||''), l.qty||'', l.ot||'', money(l.rate),
          l.chRate!=null ? money(l.chRate) : '', ...(budgetVatToggle ? [l.vatPct==null?'mixed':l.vatPct+'%', money(f.vat)] : []),
          mode==='cost' ? '' : l.floatPct+'%', mode==='cost' ? '' : money(f.fl)]); });
    });
    return rows;
  }
  const m = budgetSheetModel(view, data, B);
  const plain = h => String(h==null?'':h).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
  rows.push(m.cols.map(c=>c[1]));
  m.rows.forEach(r=>{
    const out = [];
    r.cells.forEach(cell=>{
      const o = (cell!=null && typeof cell==='object') ? cell : {h:cell};
      out.push(o.v!=null ? money(o.v) : o.x!=null ? o.x : plain(o.h));
      for(let k=1; k<(o.span||1); k++) out.push('');
    });
    rows.push(out);
  });
  return rows;
}
// The output menu's own labels for the four views — same wording as the view
// switcher (BUDGET_VIEW_LABELS), so the menu can't name a view differently.
const BUDGET_VIEW_LABELS = {lines:'Line Items', department:'Per Department', day:'Per Day', person:'Per Person', costs:'Costs', bbc:'BBC'};
function budgetExportTitle(view){
  const p = currentProject();
  return `BUDGET — ${(p&&(p.title||p.client))||''} — ${BUDGET_VIEW_LABELS[view]||'Budget'}`;
}
function copyBudget(){
  const view = budgetExportViewEff();
  const data = buildBudgetData();
  // two-column rows read as "label: value"; wider rows as a spaced table row
  const out = [budgetExportTitle(view), ''];
  budgetExportRows(data, view).forEach(row=>{
    const r = row.map(c=>(c && typeof c==='object') ? budgetFmt(c.v) : c);
    if(!r.length) return out.push('');
    out.push(r.length===2 ? `${r[0]}: ${r[1]}` : r.join('  |  '));
  });
  copyText(out.join('\n'), 'Budget copied');
}
async function downloadBudgetExcel(){
  try{ await ensureXLSX(); }catch(e){ alert('Could not load the Excel export library — check your connection and try again.'); return; }
  const view = budgetExportViewEff();
  const data = buildBudgetData();
  const aoa = [[budgetExportTitle(view)], []].concat(budgetExportRows(data, view).map(r=>r.length
    ? r.map(c=>(c && typeof c==='object') ? { v:c.v, t:'n', z:'"£"#,##0.00' } : c) : ['']));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Budget');
  const p = currentProject();
  // AP — the view is in the filename too, so exporting all four doesn't leave four
  // files fighting over one name in the downloads folder.
  const slug = s => String(s||'').replace(/[^\w-]+/g,'-').toLowerCase();
  XLSX.writeFile(wb, `budget-${slug((p&&(p.title||p.client))||'project')}-${slug(BUDGET_VIEW_LABELS[view])}.xlsx`);
}

    </div>
    <p class="hint" style="margin-top:10px;">${scope.length
      ? `Exports the ${esc(BUDGET_VIEW_LABELS[view])} view, scoped to your filter (${esc(scope.join(' · '))}) — the export says so at the top.`
      : `Exports the ${esc(BUDGET_VIEW_LABELS[view])} view for the whole project.`}
      VAT here is the same setting as <em>Itemize VAT</em> on the summary bar — changing it changes the figures on screen too.</p>`;
}

/* ============================================================================
   LINE ITEMS (20 Sep 2026) — the budget as a spreadsheet, and the first Budget view.
   Everything the project costs, one row each, read live from buildBudgetData() so it can
   never disagree with the other views. Three things are typed HERE and saved on the project
   as p.budgetSheet:
     charged     { lineKey: rate }  — what the client is charged per unit, overriding the cost
                                      rate in the Charged budget. Blank = charged at cost.
     floatPct / floatLines          — contingency, % of the line's ex-VAT figure; per-line override.
     feePct                         — production fee, % of the charged total.
     lines       [ {id, sec, after, code, item, name, pre, shoot, post, qty, rate, vat} ]
                                    — rows typed straight into the sheet, for what Crew, Venues
                                      and the cost tabs can't account for. `sec` is the section
                                      it was added in, `after` the row it sits under.
   COST = true costs, no float, no fee. CHARGED = charged rates + float + production fee.
   Margin is the gap, float and fee included (unspent float is kept — confirmed 20 Sep 2026).
   ⚠️ A person's kit is its own EQUIP row here, as in the Excel budget — labour and kit are
   charged separately, keys `e:<entryId>` and `k:<entryId>`.
   ============================================================================ */
const escA = s => esc(s).replace(/"/g,'&quot;');
/* ⚠️ The views show the CHARGED budget only (third pass, 20 Sep 2026) — the Cost | Charged switch is
   gone. `budgetMode` stays as the one word the sheet code reads, and fig(l,'cost') still exists
   because Cost is a column and a total; nothing sets this to 'cost' any more. */
const budgetMode = 'charged';
function budgetSheetOf(p){
  const s = (p && p.budgetSheet) || {};
  return { charged: s.charged||{}, floatLines: s.floatLines||{}, lines: s.lines||[],
           floatPct: hasVal(s.floatPct) ? (Number(s.floatPct)||0) : 5,
           feePct:   hasVal(s.feePct)   ? (Number(s.feePct)||0)   : 10,
           settings: Object.assign({}, BUDGET_SETTING_DEFAULTS, s.settings||{}) };
}
/* BUDGET SETTINGS — how THIS project's budget is worked out (the ⚙ Settings popup). Stored as
   p.budgetSheet.settings; only what differs from these defaults needs to be there.
     vatCatering / vatHotel  % VAT the supplier charges — a TRUE cost, so it is in buildBudgetData's
                             vatTotal, not just on the sheet. (Travel has no setting: a VAT-registered
                             person's travel already carries VAT through them.)
     kitRows      'split' = a person's kit is its own EQUIP row · 'folded' = inside their row
     floatBase    'ex' | 'inc' — float is a % of the line before or after VAT
     floatInMargin  true = unspent float is kept (margin) · false = held for the client
     feeBase      'all' | 'exFloat' — production fee on the whole charged total, or not on float
     otCharged    'charged' | 'cost' — overtime follows the charged rate, or stays at the cost rate
     vatBack      true = OVERSEAS CLIENT (e.g. USA): the budget is charged with VAT in it as a final figure,
                  and the VAT paid to suppliers is reclaimed afterwards — so it comes back as margin.
                  What comes back is the COST-side VAT (what was actually paid), not the charged VAT. */
const BUDGET_SETTING_DEFAULTS = { vatBack:false, vatCatering:0, vatHotel:0, kitRows:'split', floatBase:'ex', floatInMargin:true, feeBase:'all', otCharged:'charged' };
function budgetSheetRec(p){
  const s = p.budgetSheet = p.budgetSheet || {};
  s.charged = s.charged || {}; s.floatLines = s.floatLines || {}; s.lines = s.lines || [];
  return s;
}
/* a typed line's cost, stage by stage — shoot days and plain quantities belong to Production */
function sheetLineFigures(l){
  const n = k => Number(l[k])||0;
  const byUnits = { preproduction:n('pre'), production:n('shoot')+n('qty'), post:n('post') };
  const units = BUDGET_SCOPES.reduce((u,[k])=>u + (budgetScope[k] ? byUnits[k] : 0), 0);
  const rate = n('rate'), vr = n('vat')/100;
  return { units, rate, vr, ex: rate*units, vat: rate*units*vr,
           byStage: { preproduction: rate*byUnits.preproduction, production: rate*byUnits.production, post: rate*byUnits.post } };
}
const SHEET_EXTRA_SECTIONS = [['x:catering','Catering','CAT/TRA'], ['x:travel','Travel','CAT/TRA'], ['x:hotel','Hotels','CAT/TRA'],
  ['x:loc','Locations','SET'], ['x:vendors','Vendors','—'], ['x:other','Other costs','PROD']];
const VENDOR_TYPE_CODES = { Catering:'CAT/TRA', Equipment:'EQUIP', Transport:'CAT/TRA', Post:'POST', Other:'—' };
function buildBudgetLines(data){
  const { p, days, cateringGrid, transportSummary, dayIdsInScope, cateringCosts, travelCosts, hotelCosts,
          hotelRoomNights, preNightRooms, dayHotelRooms, talentCosts, vendorBookings, cateringRaw, prodOn, prepOn, postOn,
          preNightGuests, hotelGuestsOn, personInScope } = data.src;
  const nameOf = id => (crewById(id)||{}).name || 'Someone';
  const sheet = budgetSheetOf(p), set = sheet.settings;
  const vatCat = Number(set.vatCatering)||0, vatHtl = Number(set.vatHotel)||0;
  /* WHERE a row's money falls — weights, not pounds, so the same split serves Cost and Charged:
     { pre, post, proj (belongs to no day), days:{dayId:w} }. Per Day reads nothing else. */
  const perDayW = fn => Object.fromEntries(days.map((d,i)=>[d.id, fn(d,i)||0]));
  const bbcOfCode = c => ({PROD:'4', CLIENT:'4', TALENT:'3', CIN:'5', AUD:'5', GRIP:'5', SET:'5', HMUC:'5', EQUIP:'6', 'CAT/TRA':'9', POST:'10'}[c] || '13');
  const rateCard = [];
  const mk = o => Object.assign({ item:'', name:'', pre:0, shoot:0, post:0, qty:0, ot:0, rate:0, hasRate:true,
    vatPct:0, units:0, costEx:0, costVat:0, stages:['production'] }, o);
  /* a quantity × rate extra that belongs to the shoot */
  const extra = (key, code, item, name, qty, rate, o) => mk(Object.assign({ key, code, item, name, qty, rate,
    units: qty*prodOn, costEx: qty*rate*prodOn, dist:{proj:1}, bbc:bbcOfCode(code) }, o||{}));
  const sections = [];
  DEPARTMENTS.forEach(dept=>{
    const lines = [];
    sortHoDFirst(data.people.filter(pp=>pp.department===dept)).forEach(pp=>{
      const phaseDays = pp.daysWorked + pp.prepDays + pp.postDays;
      const onDays = pp.daysWorked*prodOn + pp.prepDays*prepOn + pp.postDays*postOn;
      const units = pp.isBuyout ? (phaseDays ? onDays/phaseDays : prodOn)
                                : onDays + (pp.daysWorked>0 ? pp.otUnits*prodOn : 0);
      const kitAll = pp.kit!=null ? Math.min(pp.kit, pp.rate) : 0;
      const kit = set.kitRows==='folded' ? 0 : kitAll;       // folded: the kit stays inside the person's row
      const vr = pp.vatRegistered ? VAT_RATE : 0;
      const stages = [pp.prepDays&&'preproduction', (pp.daysWorked||(pp.isBuyout&&!phaseDays))&&'production', pp.postDays&&'post'].filter(Boolean);
      const onIds = days.filter(d=>(d.positions||[]).some(pos=>pos[0]===pp.id)).map(d=>d.id);
      const shootW = (pp.isBuyout ? (phaseDays ? pp.daysWorked/phaseDays : 1) : pp.daysWorked + (pp.daysWorked>0 ? pp.otUnits : 0)) * prodOn;
      const dist = { pre: (pp.isBuyout ? (phaseDays ? pp.prepDays/phaseDays : 0) : pp.prepDays) * prepOn,
                     post: (pp.isBuyout ? (phaseDays ? pp.postDays/phaseDays : 0) : pp.postDays) * postOn,
                     proj: onIds.length ? 0 : shootW, days: Object.fromEntries(onIds.map(id=>[id, shootW/onIds.length])) };
      const bbcCat = BBC_STRUCTURE.find(cat=>cat.kind==='people' && cat.test(pp));
      const base = { name:pp.name, pre:pp.prepDays, shoot:pp.daysWorked, post:pp.postDays, qty:pp.isBuyout?1:0, isBuyout:pp.isBuyout,
        ot:pp.isBuyout?0:pp.otUnits, otOn:(!pp.isBuyout && pp.daysWorked>0) ? pp.otUnits*prodOn : 0,
        vatPct:vr*100, units, entryId:pp.id, crewId:pp.crewId, fullRate:pp.rate, stages, dist,
        bbc: bbcCat ? bbcCat.code : '—' };
      lines.push(mk(Object.assign({}, base, { key:'e:'+pp.id, code:DEPARTMENT_CODES[dept]||'—', item:pp.role||'',
        rate:pp.rate-kit, hasRate:pp.hasRate, costEx:(pp.rate-kit)*units, costVat:(pp.rate-kit)*units*vr,
        foldedKit: (set.kitRows==='folded' && kitAll>0) ? kitAll : 0 })));
      if(kit>0) lines.push(mk(Object.assign({}, base, { key:'k:'+pp.id, code:'EQUIP', item:`Kit — ${pp.role||''}`, isKit:true, bbc:'6',
        rate:kit, costEx:kit*units, costVat:kit*units*vr })));
    });
    if(lines.length || sheet.lines.some(l=>l.sec==='d:'+dept))
      sections.push({ key:'d:'+dept, title:dept, code:DEPARTMENT_CODES[dept]||'—', dayCols:true, lines });
  });
  const X = {}; SHEET_EXTRA_SECTIONS.forEach(([key,title,code])=>{ X[key] = { key, title, code, dayCols:false, lines:[] }; });
  if(cateringGrid && !data.cateringViaVendor){
    const cols = cateringGrid.cols.filter(c=>dayIdsInScope.has(c.dayId));
    const sum = k => cols.reduce((n,c)=>n+c[k], 0);
    const drops = cols.reduce((n,c)=>n + (c.b>0?1:0) + (c.l>0?1:0) + (c.d>0?1:0), 0);
    const dropsOn = c => (c.b>0?1:0) + (c.l>0?1:0) + (c.d>0?1:0);
    /* a name at their own meal rate (mealRateFor) comes OUT of the standard line and gets one of its own */
    const fed = (d, id) => { const m = (d.cateringMeals||{})[id]; return m && crewOnShoot(id, p) && personInScope(id) && !crewOwnCatering(id, p) ? m : null; };
    const inDays = days.filter(d=>dayIdsInScope.has(d.id));
    const changedFor = k => [...new Set(inDays.flatMap(d=>Object.keys(d.cateringMeals||{}).filter(id=>{ const m = fed(d, id); return m && m[k] && mealChanged(p, id, k); })))];
    [['b','Breakfast',cateringCosts.b,'b'], ['l','Lunch',cateringCosts.l,'l'], ['d','Dinner',cateringCosts.d,'d'],
     ['del','Delivery',cateringCosts.delivery,'delivery']].forEach(([k,item,rate,field])=>{
      const changed = k==='del' ? [] : changedFor(k);
      const theirs = (c, id) => { const d = inDays.find(x=>x.id===c.dayId), m = d && fed(d, id); return m && m[k] ? 1 : 0; };
      const stdOn = c => k==='del' ? dropsOn(c) : c[k] - changed.reduce((n,id)=>n+theirs(c, id), 0);
      const qty = cols.reduce((n,c)=>n+stdOn(c), 0);
      const line = extra('cat:'+k, 'CAT/TRA', item, k==='del'?'per drop':'per head', qty, rate,
        { vatPct:vatCat, costVat:qty*rate*prodOn*vatCat/100, dist:{ days:Object.fromEntries(cols.map(c=>[c.dayId, stdOn(c)])) } });
      line.costField = { store:'cateringCosts', field };
      rateCard.push({ group:'Catering', store:'cateringCosts', field, line });
      if(qty && rate) X['x:catering'].lines.push(line);
      changed.forEach(id=>{
        const n = cols.reduce((s,c)=>s+theirs(c, id), 0), r = mealRateFor(p, id, k);
        if(n) X['x:catering'].lines.push(extra(`cat:${k}:${id}`, 'CAT/TRA', `${item} — ${nameOf(id)}`, 'per head', n, r,
          { vatPct:vatCat, costVat:n*r*prodOn*vatCat/100, amendedFor:id, dist:{ days:Object.fromEntries(cols.map(c=>[c.dayId, theirs(c, id)])) } }));
      });
    });
    /* per diems — everyone at the standard on one line, a changed allowance on its own; own arrangements one each */
    const pdStd = cateringGrid.perDiem.filter(id=>!perDiemChanged(p, id)), pdRate = cateringCosts.perDiem;
    const pdDays = ids => c => { const d = inDays.find(x=>x.id===c.dayId); return d ? ids.filter(id=>crewOnDay(id, d, p)).length : 0; };
    const pdQty = cols.reduce((n,c)=>n+pdDays(pdStd)(c), 0);
    const pdLine = extra('cat:pd', 'CAT/TRA', 'Per diem', 'per person per day', pdQty, pdRate, { dist:{ days:Object.fromEntries(cols.map(c=>[c.dayId, pdDays(pdStd)(c)])) } });
    pdLine.costField = { store:'cateringCosts', field:'perDiem' };
    rateCard.push({ group:'Catering', store:'cateringCosts', field:'perDiem', line:pdLine });
    if(pdQty && pdRate) X['x:catering'].lines.push(pdLine);
    cateringGrid.perDiem.filter(id=>perDiemChanged(p, id)).forEach(id=>{ const q = cols.reduce((n,c)=>n+pdDays([id])(c), 0), r = perDiemRateFor(p, id);
      if(q && r) X['x:catering'].lines.push(extra('cat:pd:'+id, 'CAT/TRA', `Per diem — ${nameOf(id)}`, cateringDetailOf(p, id) || 'per day', q, r, { amendedFor:id, dist:{ days:Object.fromEntries(cols.map(c=>[c.dayId, pdDays([id])(c)])) } })); });
    cateringGrid.own.forEach(id=>{ const amt = ownCateringCostOf(p, id); if(!amt) return;
      const byDay = Object.fromEntries(inDays.map(d=>[d.id, cateringExtraOnDay(p, id, d) ? 1 : 0]));
      if(Object.values(byDay).some(Boolean)) X['x:catering'].lines.push(extra('cat:own:'+id, 'CAT/TRA', `Own catering — ${nameOf(id)}`, cateringDetailOf(p, id) || 'own arrangement', 1, amt, { amendedFor:id, dist:{ days:byDay } })); });
  }
  if(transportSummary){
    const cols = transportSummary.cols.filter(c=>dayIdsInScope.has(c.dayId));
    /* ⚠️ a VAT-registered person's travel carries VAT through THEM (see buildBudgetData) — it lands
       on the travel row they sit on, so the person's own row is fee-only and the two still sum to pp.vat */
    const travelVatOf = ids => data.people.reduce((n,pp)=>n + ((pp.vatRegistered && ids.has(pp.crewId)) ? pp.travelCost*VAT_RATE : 0), 0);
    const inDays = days.filter(d=>dayIdsInScope.has(d.id));
    /* Talent etc booked by Them are listed, never costed — so they are on no line (bookedByThem) */
    const travellers = [...new Set(projectCrew(p).map(c=>c.id).filter(id=>personInScope(id) && !bookedByThem(p, id, 'trip') && inDays.some(d=>crewOnDay(id, d, p))))];
    /* a name on their own terms — a changed rate, or a fare where the method has no standard — gets its own line */
    const ownTerms = id => { const t = travelTermsFor(p, id); return t.changed || (t.std.rate==null && t.rate!=null); };
    [['Own car', travelCosts.mileage, 'per person per day'], ['Public transport', travelCosts.publicPerDay, 'per person per day']].forEach(([m,rate,unit])=>{
      const std = new Set(travellers.filter(id=>(p.travelMethods||{})[id]===m && !ownTerms(id)));
      const onDay = c => { const d = inDays.find(x=>x.id===c.dayId); return d ? [...std].filter(id=>crewOnDay(id, d, p)).length : 0; };
      const qty = cols.reduce((n,c)=>n+onDay(c), 0);
      const vat = travelVatOf(std);
      const line = extra('trv:'+m, 'CAT/TRA', m, unit, qty, rate, { vatPct: vat ? null : 0, costVat: vat, bbc:'8',
        dist:{ days:Object.fromEntries(cols.map(c=>[c.dayId, onDay(c)])) } });
      line.costField = { store:'transportCosts', field: m==='Own car' ? 'mileage' : 'publicPerDay' };
      rateCard.push({ group:'Travel', store:'transportCosts', field: m==='Own car' ? 'mileage' : 'publicPerDay', line });
      if(qty && rate) X['x:travel'].lines.push(line);
    });
    travellers.filter(ownTerms).forEach(id=>{
      const t = travelTermsFor(p, id);
      const byDay = Object.fromEntries(inDays.map(d=>[d.id, travelCostOnDay(p, id, d)]));
      const cost = Object.values(byDay).reduce((a,b)=>a+b, 0);
      if(!t.rate || !cost) return;
      const vat = travelVatOf(new Set([id]));
      X['x:travel'].lines.push(extra('trv:p:'+id, 'CAT/TRA', `${t.method} — ${nameOf(id)}`, t.note || (t.unit==='trip' ? 'per trip' : 'per day'),
        cost/t.rate, t.rate, { vatPct: vat ? null : 0, costVat: vat, bbc:'8', amendedFor:id,
          dist:{ days:Object.fromEntries(Object.entries(byDay).map(([k,v])=>[k, v/t.rate])) } }));
    });
  }
  if(talentCosts.trip) X['x:travel'].lines.push(extra('trv:talent', 'CAT/TRA', 'Talent travel', 'booked by us', 1, talentCosts.trip, {bbc:'8'}));
  /* every guest-night at its own terms (hotelNightTerms): the ones at the standard rate make the Hotel rooms
     line; a changed night joins a line of its own, one per person per hotel-and-rate */
  const guestNights = [];   // { id, key, dayIdx }
  preNightGuests.forEach(id=>guestNights.push({ id, key:'pre', dayIdx:0 }));   // the night before folds into Day 1, as in Per Day
  days.forEach((d,i)=>hotelGuestsOn(d).forEach(id=>guestNights.push({ id, key:d.id, dayIdx:i })));
  guestNights.forEach(g=>{ g.t = hotelNightTerms(p, g.id, g.key); });
  const stdNights = guestNights.filter(g=>!g.t.changed);
  const roomsLine = extra('htl:rooms', 'CAT/TRA', 'Hotel rooms', 'per room per night', stdNights.length, hotelCosts.perRoomNight,
    { vatPct:vatHtl, costVat:stdNights.length*hotelCosts.perRoomNight*prodOn*vatHtl/100, dist:{ days: perDayW((d,i)=>stdNights.filter(g=>g.dayIdx===i).length) } });
  roomsLine.costField = { store:'hotelCosts', field:'perRoomNight' };
  rateCard.push({ group:'Hotel', store:'hotelCosts', field:'perRoomNight', line:roomsLine });
  if(stdNights.length && hotelCosts.perRoomNight) X['x:hotel'].lines.push(roomsLine);
  const hotelGroups = {};
  guestNights.filter(g=>g.t.changed).forEach(g=>{
    const k = `${g.id}|${g.t.rate}|${g.t.hotel}`;
    (hotelGroups[k] = hotelGroups[k] || { id:g.id, rate:g.t.rate, hotel:g.t.hotel, nights:[] }).nights.push(g);
  });
  Object.entries(hotelGroups).forEach(([k, gr])=>{
    const n = gr.nights.length;
    X['x:hotel'].lines.push(extra('htl:'+k, 'CAT/TRA', `Hotel — ${nameOf(gr.id)}${gr.hotel ? ' · '+gr.hotel : ''}`, 'per night', n, gr.rate,
      { vatPct:vatHtl, costVat:n*gr.rate*prodOn*vatHtl/100, amendedFor:gr.id, dist:{ days: perDayW((d,i)=>gr.nights.filter(g=>g.dayIdx===i).length) } }));
  });
  if(talentCosts.stay) X['x:hotel'].lines.push(extra('htl:talent', 'CAT/TRA', 'Talent hotels', 'booked by us', 1, talentCosts.stay,
    { vatPct:vatHtl, costVat:talentCosts.stay*prodOn*vatHtl/100 }));
  (p.locationIds||[]).forEach(locId=>{
    const loc = locById(locId); if(!loc) return;
    const c = resolveLocationCost(locId, p);
    let fee = locationFeeFor(locId, days, p, locDaysUsed(locId, p).length);
    if(fee===null) fee = c.rate;                       // booked but on no day — charged once, as in buildBudgetData
    const used = days.filter(d=>locOnDay(locId, d)).length;
    const rate = c.mode==='hourly' ? c.rate*c.hours : c.rate;
    const vr = c.vat==='Yes' ? VAT_RATE : 0;
    const modeNote = c.mode==='buyout' ? 'buyout' : c.mode==='hourly' ? `${c.hours||0} hrs a day` : 'per day';
    const usedAll = locDaysUsed(locId, p).length;
    if(fee || rate) X['x:loc'].lines.push(mk({ key:'loc:'+locId, code:'SET', item:loc.name||'Location', name:modeNote, bbc:'7', locId, locMode:c.mode,
      dist: used ? { days: perDayW(d=>locationFeeFor(locId, [d], p, usedAll)) } : { proj:1 },
      qty: c.mode==='buyout' ? 1 : used, rate, vatPct:vr*100, units:(rate ? fee/rate : 0)*prodOn, costEx:fee*prodOn, costVat:fee*prodOn*vr }));
    c.extras.forEach((x,i)=>{ const amt = parseRateNumber(x.amount)||0;
      if(amt) X['x:loc'].lines.push(extra(`lx:${locId}:${i}`, 'SET', x.label||'Extra', loc.name||'', 1, amt, { vatPct:vr*100, costVat:amt*prodOn*vr, bbc:'7', locId, extraId:x.id })); });
  });
  vendorBookings.forEach(vc=>{
    const v = vendorById(vc.vendorId) || {type:'Other', name:'Vendor'};
    const eff = vendorCostEff(vc, cateringRaw);
    if(eff.eff) X['x:vendors'].lines.push(extra('v:'+vc.id, VENDOR_TYPE_CODES[v.type]||'—', v.name||'Vendor',
      `${v.type||'Other'} — ${eff.quoted?'quote':'estimate'}`, 1, eff.eff, { bbc: ({Equipment:'6', Transport:'8', Catering:'9', Post:'10'})[v.type] || '13',
        vcId:vc.id, vcField: eff.quoted ? 'quote' : 'estimate', vcLocked: !!vc.useCateringEstimate && !eff.quoted }));
  });
  (p.additionalCosts||[]).forEach(c=>{ const amt = parseRateNumber(c.amount)||0;
    if(amt) X['x:other'].lines.push(extra('a:'+c.id, 'PROD', c.label||'Additional cost', c.confirmed?'confirmed':'estimate', 1, amt, { bbc:'13', additionalId:c.id })); });
  SHEET_EXTRA_SECTIONS.forEach(([key])=>{ if(X[key].lines.length || key==='x:other' || sheet.lines.some(l=>l.sec===key)) sections.push(X[key]); });
  /* the typed lines, each dropped in under the row it was added after (end of the section if
     that row has since gone); a line whose whole section has gone lands in Other costs */
  const byKey = Object.fromEntries(sections.map(sec=>[sec.key, sec]));
  sheet.lines.forEach(l=>{
    const sec = byKey[l.sec] || byKey['x:other'];
    const f = sheetLineFigures(l);
    const line = mk({ key:'c:'+l.id, custom:true, id:l.id, code:l.code||sec.code, item:l.item||'', name:l.name||'',
      pre:Number(l.pre)||0, shoot:Number(l.shoot)||0, post:Number(l.post)||0, qty:Number(l.qty)||0,
      rate:f.rate, vatPct:f.vr*100, units:f.units, costEx:f.ex, costVat:f.vat, bbc:bbcOfCode(l.code||sec.code),
      dist:{ pre:(Number(l.pre)||0)*prepOn, post:(Number(l.post)||0)*postOn, proj:((Number(l.qty)||0) + (days.length ? 0 : (Number(l.shoot)||0)))*prodOn,
             days: perDayW(()=>(Number(l.shoot)||0)*prodOn/days.length) },
      stages:[Number(l.pre)&&'preproduction', (Number(l.shoot)||Number(l.qty))&&'production', Number(l.post)&&'post'].filter(Boolean) });
    const at = sec.lines.findIndex(x=>x.key===l.after);
    if(l.after==='' ) sec.lines.unshift(line); else if(at<0) sec.lines.push(line); else sec.lines.splice(at+1, 0, line);
  });
  /* never silently drop money: if the rows don't add up to the engine's total, say so as a row */
  const all = () => sections.flatMap(sec=>sec.lines);

     muting Catering & Travel in the head would leave the catering standing. Done after the
     reconciliation above, which has to see everything the engine counted. */

  if(projectCrewFilter.depts.size) sections.forEach(sec=>{

    }

    l.chEx = l.rate>0 ? l.costEx*(r/l.rate) : r*l.units;
    if(set.otCharged==='cost' && l.otOn && l.rate>0) l.chEx -= l.otOn*(r - l.rate);      // overtime stays at the cost rate
    l.chVat = l.costEx>0 ? l.costVat*(l.chEx/l.costEx) : l.chEx*(l.vatPct||0)/100;

    l.floatPct = l.floatOwn!=null ? l.floatOwn : sheet.floatPct;

  };

                     marginLabel: `Margin — markup${set.floatInMargin?', float':''} and fee${vatBack?', plus the VAT reclaimed':''}${set.floatInMargin?'':' (float held for the client)'}` } };

/* Per Person shows ONE charged rate for labour + kit; the difference from the kit's own charged
   rate is what lands on the labour row, so the two views can't disagree */
function setBudgetChargedPerson(entryId, raw, fullRate, labourRate, kitCharged){
  xlsCommit(s=>{
    const v = String(raw||'').replace(/[£,\s]/g,'').replace('−','-');
    if(v===''){ delete s.charged['e:'+entryId]; delete s.charged['k:'+entryId]; return; }
    const pm = v.match(/^([+-]?)(\d+(\.\d+)?)%$/);
    const val = pm ? Math.round(fullRate*(1 + (pm[1]==='-'?-1:1)*Number(pm[2])/100)*100)/100 : xlsNum(v);
    if(val==null){ budgetXlsError = 'Enter a rate like 800, or a percentage like +20%.'; return false; }
    const lab = Math.max(0, Math.round((val - kitCharged)*100)/100);
    if(lab===labourRate) delete s.charged['e:'+entryId]; else s.charged['e:'+entryId] = lab;
  });
}
function setBudgetCostRate(store, field, raw){
  const p = currentProject(); if(!p) return;
  xlsCommit(()=>{
    const v = String(raw||'').trim()==='' ? 0 : xlsNum(raw);
    if(v==null){ budgetXlsError = 'Enter a rate, like 12.50.'; return false; }
    p[store] = Object.assign({}, p[store]||{}, { [field]: v });
  });
}

function xlsFocus(e){
  const el = e.target; if(el.dataset && el.dataset.fk) xlsLastFk = el.dataset.fk;
  if(!el.dataset || !el.dataset.ref) return;
  const ref = document.getElementById('xlsRef'), fx = document.getElementById('xlsFx');
  if(ref) ref.textContent = el.dataset.ref; if(fx) fx.textContent = el.dataset.fx || el.value || '';
  if(el.select) el.select();
}
/* Enter = down one row in the same column, as in Excel */
function xlsKey(e){
  const el = e.target; if(e.key!=='Enter' || !el.dataset || !el.dataset.col) return;
  e.preventDefault();
  const list = [...e.currentTarget.querySelectorAll(`[data-col="${el.dataset.col}"]`)];
  const next = list[list.indexOf(el) + (e.shiftKey ? -1 : 1)];
  if(next) next.focus(); else el.blur();
}
/* ⚠️ every write goes through here. The re-render waits a tick so the field the user has just
   tabbed or Entered INTO is known, and gets the focus back once the sheet is rebuilt. */
function xlsCommit(mutate){
  const p = currentProject(); if(!p) return;
  const changed = mutate(budgetSheetRec(p)) !== false;
  setTimeout(async ()=>{
    const a = document.activeElement, fk = a && a.dataset ? a.dataset.fk : null;
    renderProjectBody();
    if(fk){ const el = [...document.querySelectorAll('[data-fk]')].find(x=>x.dataset.fk===fk); if(el) el.focus(); }
    if(changed) await saveDB('db:projects', projectsDB);
  }, 0);
}
const xlsNum = raw => { const v = String(raw||'').replace(/[£,%\s]/g,''); return /^\d+(\.\d+)?$/.test(v) ? Math.round(Number(v)*100)/100 : null; };
function setBudgetCharged(key, raw, rate){
  xlsCommit(s=>{
    const v = String(raw||'').replace(/[£,\s]/g,'').replace('−','-');
    if(v===''){ delete s.charged[key]; return; }
    const pm = v.match(/^([+-]?)(\d+(\.\d+)?)%$/);
    const val = pm ? Math.round(rate*(1 + (pm[1]==='-'?-1:1)*Number(pm[2])/100)*100)/100 : xlsNum(v);
    if(val==null){ budgetXlsError = 'Enter a rate like 800, or a percentage like +20%.'; return false; }
    if(val===rate) delete s.charged[key]; else s.charged[key] = val;
  });
}
function setBudgetLineFloat(key, raw){
  xlsCommit(s=>{
    if(String(raw||'').trim()===''){ delete s.floatLines[key]; return; }
    const v = xlsNum(raw);
    if(v==null || v>100){ budgetXlsError = 'Enter a float percentage between 0 and 100.'; return false; }
    s.floatLines[key] = v;
  });
}
function setBudgetSheetPct(field, raw){
  xlsCommit(s=>{
    const v = xlsNum(raw);
    if(v==null || v>100){ budgetXlsError = 'Enter a percentage between 0 and 100.'; return false; }
    s[field] = v;
  });
}
function addBudgetLine(sec, after){
  const id = uid();
  xlsCommit(s=>{
    /* anything already sitting under the same row moves under the new line, so the new one lands where the + was */
    s.lines.forEach(l=>{ if(l.sec===sec && l.after===after) l.after = 'c:'+id; });
    const code = sec.startsWith('d:') ? (DEPARTMENT_CODES[sec.slice(2)]||'—') : ((SHEET_EXTRA_SECTIONS.find(x=>x[0]===sec)||[])[2] || '—');
    s.lines.push({ id, sec, after, code, item:'', name:'', pre:'', shoot:'', post:'', qty:1, rate:'', vat:'' });
  });
  setTimeout(()=>{ const el = [...document.querySelectorAll('[data-fk]')].find(x=>x.dataset.fk===`c:${id}|item`); if(el) el.focus(); }, 30);
}
function setBudgetLineField(id, field, raw){
  xlsCommit(s=>{
    const l = s.lines.find(x=>x.id===id); if(!l) return false;
    const t = String(raw||'').trim();
    if(field==='item' || field==='name' || field==='code'){ l[field] = t.slice(0, 80); return; }
    if(t===''){ l[field] = ''; return; }
    const v = xlsNum(t);
    if(v==null || (field==='vat' && v>100)){ budgetXlsError = field==='vat' ? 'Enter a VAT percentage between 0 and 100.' : 'Enter a number, like 2 or 150.'; return false; }
    l[field] = v;
  });
}
async function deleteBudgetLine(id){
  const p = currentProject(); if(!p) return;
  const s = budgetSheetRec(p), l = s.lines.find(x=>x.id===id); if(!l) return;
  const snaps = beginUndo(['db:projects']);
  s.lines.forEach(x=>{ if(x.after==='c:'+id) x.after = l.after; });   // whatever sat under it moves up
  s.lines = s.lines.filter(x=>x.id!==id);
  delete s.charged['c:'+id]; delete s.floatLines['c:'+id];
  await saveDB('db:projects', projectsDB); renderProjectBody();
  finishUndo(`Deleted ${l.item||'line'}.`, snaps);
}

async function syncShootDayCount(newCountStr){
  const p = currentProject(); if(!p) return;
  const days = projectDays(p.id);
  const newCount = parseInt(newCountStr, 10);
  shootDayReductionPending = null;
  if(!Number.isFinite(newCount) || newCount < 0 || newCount === days.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
  if(newCount > days.length){
    for(let i=days.length; i<newCount; i++){
      const rec = makeShootDayRecord(p.id, p);
      shootDaysDB.push(rec);
    }
    await saveDB('db:shootdays', shootDaysDB);
    renderProjectOverview(document.getElementById('projectBody'));
    return;
  }
  // shrinking — expand an inline checkbox picker instead of deciding for the user
  shootDayReductionPending = { removeCount: days.length - newCount, selected: new Set() };
  renderProjectOverview(document.getElementById('projectBody'));
}

  shootDaysDB = shootDaysDB.filter(d=>!pend.selected.has(d.id));
  if(pend.selected.has(currentShootDayId)) currentShootDayId = null;

async function addRoleToDeptAdmin(dept){
  const role = (prompt(`New role in ${dept}:`)||'').trim();
  if(!role) return;
  ROLES_BY_DEPT[dept] = ROLES_BY_DEPT[dept] || [];
  // case-insensitive, so "Gaffer" can't be added a second time as "gaffer"
  const clash = ROLES_BY_DEPT[dept].find(r=>r.toLowerCase()===role.toLowerCase());
  if(clash){ alert(`${dept} already has a role called "${clash}".`); return; }
  ROLES_BY_DEPT[dept].push(role);
  await saveDB('db:roles', ROLES_BY_DEPT);
  refreshCrewDatabase();
}
async function toggleHoD(crewId){

}

  add('Other equipment', c.cameraExtras);
  add('Dietary (general)', c.dietaryGeneral); add('Dietary (specific)', c.dietarySpecific||c.dietary);
  add('Shoe size', c.shoeSize); add('Clothing size', c.clothingSize);
  add('VAT registered', c.vatRegistered); add('Drives', c.drives);
  if(c.drives==='Yes'){ add('Car make/model', c.carMakeModel); add('Registration', c.carReg); }
  add('Home address', c.homeAddress);
  add('Notes', c.generalNotes); add('Previous projects', c.previousProjects);
  add('Instagram', c.instagram); add('YouTube', c.youtube); add('LinkedIn', c.linkedin);
  add('Coffee / tea order', c.coffeeOrder);
  add('Fee / rate (private)', c.rate); add('Private notes', c.notes);
  if(!rows.length) return `<div class="empty-note">Nothing filled in yet beyond the name.</div>`;
  return `<table>${rows.map(([k,v])=>`<tr><th style="width:170px;">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`;
}
async function saveCrew(){
  const name = val('ncName'); if(!name){ alert('Name is required'); return; }
  const id = val('crewEditId');
  const existing = crewById(id);
  if(!existing && !pendingNewCrewRole){ alert('Pick a role — every crew member needs at least one saved role.'); return; }
  const normName = s => (s||'').trim().toLowerCase();
  if(!existing || normName(existing.name)!==normName(name)){
    const clashes = crewDB.filter(x => x.id!==id && normName(x.name)===normName(name));
    if(clashes.length){
      const detail = clashes.map(x=>[x.role, x.department].filter(Boolean).join(', ')).filter(Boolean);
      const msg = [
        clashes.length>1
          ? `There are already ${clashes.length} crew records called "${name}".`
          : `There's already a crew record called "${name}".`,
        detail.length ? `Existing: ${detail.join(' · ')}` : null,
        '',
        "Two different people can share a name — if that's the case here, carry on. If it's the same person, cancel and edit the existing record instead.",
        '',
        'Save anyway?'
      ].filter(x=>x!==null).join('\n');
      if(!confirm(msg)) return;
    }
  }
  const rec = { id: id||uid(), name,
    showAs: val('ncShowAs'), coProductionCompany: val('ncCoPro'),
    phone: val('ncPhone'), email: val('ncEmail'),
    skills: val('ncSkills'),
    camera1: val('ncCam1'), camera2: val('ncCam2'), camera3: val('ncCam3'), cameraExtras: val('ncCamExtras'),
    dietaryGeneral: val('ncDietaryGeneral'), dietarySpecific: val('ncDietarySpecific'), shoeSize: val('ncShoe'), clothingSize: val('ncClothing'),
    vatRegistered: val('ncVat'), drives: val('ncDrives'), carMakeModel: val('ncCarModel'), carReg: val('ncCarReg'),
    homeAddress: val('ncAddress'),
    generalNotes: val('ncGeneralNotes'), previousProjects: val('ncPrevProjects'),
    instagram: val('ncInstagram'), youtube: val('ncYouTube'), linkedin: val('ncLinkedIn'), coffeeOrder: val('ncCoffeeOrder'),
    rate: val('ncRate'), notes: val('ncNotes'),
    invoicesAs: val('ncInvoicesAs') };
  const roleRates = collectRoleRates(existing && existing.roleRates);
  if(Object.keys(roleRates).length) rec.roleRates = roleRates;
  if(!existing){
    // brand-new crew: the picked role is the only source of role + department
    rec.roles = [pendingNewCrewRole];
    rec.role = pendingNewCrewRole.split('/').slice(1).join('/');
    rec.department = departmentForRolePath(pendingNewCrewRole);
  }
  const merged = Object.assign({}, existing||{}, rec);
  const idx = crewDB.findIndex(x=>x.id===merged.id);
  if(idx>=0) crewDB[idx]=merged; else crewDB.push(merged);
  await saveDB('db:crew', crewDB);
  // if this was a brand-new person added from inside a project, put them on that project straight away
  if(!existing && route.screen==='project' && currentProjectId){
    const p = currentProject();
    if(p){ addCrewEntry(p, merged.id); await saveDB('db:projects', projectsDB); }
  }
  pendingNewCrewRole = '';
  editingCrewId = null; addingCrewNew = false; newCrewPrefillName = '';
  if(existing && route.screen==='db-crew') viewingCrewId = merged.id;
  refreshCrewScreen();
}
async function deleteCrew(id){
  if(!confirm('Delete this crew member from the database?')) return;
  const who = (crewById(id)||{}).name || 'crew member';
  const snaps = beginUndo(['db:crew','db:projects']);
  crewDB = crewDB.filter(x=>x.id!==id);
  projectsDB.forEach(p=>{
    const gone = new Set(entriesForCrew(id, p).map(e=>e.id));
    if(!gone.size) return;
    p.crewEntries = (p.crewEntries||[]).filter(e=>!gone.has(e.id));
    prunePhaseSchedules(p, gone);
  });
  await saveDB('db:crew', crewDB); await saveDB('db:projects', projectsDB);
  renderCrewList();
  finishUndo(`Deleted ${who} from the crew database.`, snaps);
}

/* ============================================================ GOOGLE SHEET SYNC (Crew database mirror)
   A Google Sheet as a two-way mirror of db:crew — see google-sheet-sync.gs for the
   script that lives inside the spreadsheet, and MAP.md ▸ Google Sheet sync.

   ⚠️ The sheet NEVER writes into app_data itself. Both directions go through this
   tab: "Send to sheet" rewrites the Crew tab from crewDB; "Load from sheet" reads
   the tab, shows a preview of what would change, and only on Apply mutates crewDB
   and saves through saveDB('db:crew') like any other edit. That keeps the guarded
   write / merge in saveDB() as the one path into the database.

   Column contract: SHEET_SYNC_COLUMNS below. A pull only touches the columns the
   sheet actually has (matched by header, case-insensitively, with a few aliases),
   so a partial sheet — say Name / Phone / Email — updates just those fields and
   leaves everything else on the record alone. Rows without an id become new people
   and get their id written back to the sheet. Rows deleted in the sheet are NOT
   deleted here — deletion cascades into projects, so it stays a deliberate act on
   the Crew database screen; the preview lists them instead. */
const SHEET_SYNC_URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
const sheetSyncYesNo = v => { const s = (v||'').toString().trim().toLowerCase(); return ['yes','y','true','1'].includes(s) ? 'Yes' : ['no','n','false','0'].includes(s) ? 'No' : ''; };
const sheetSyncDietary = v => { const s = (v||'').toString().trim(); const hit = DIETARY_OPTIONS.find(o=>o.toLowerCase()===s.toLowerCase()); return hit || s; };
const sheetSyncRoleName = rp => rp.includes('/') ? rp.split('/').slice(1).join('/') : rp;
/* h = the sheet header the app writes; aliases = other headers a pull will accept
   (an existing sheet of yours probably says "Email address", not "Email").
   f = the crew-record field. get/set/cmp = the three special columns. */
const SHEET_SYNC_COLUMNS = [
  { h:'id',                 special:'id' },
  { h:'Name',               f:'name',               aliases:['full name','crew name'] },
  { h:'Department',         f:'department',         aliases:['dept'] },
  { h:'Role',               f:'role',               aliases:['active role','position','job title'] },
  { h:'Saved roles',        special:'roles',        aliases:['roles','all roles'] },
  { h:'Show as',            f:'showAs',             aliases:['show as (call sheet)','display name'] },
  { h:'Company',            f:'coProductionCompany', aliases:['lead company','production company','co-production company'] },
  { h:'Phone',              f:'phone',              aliases:['phone number','mobile','mobile number','tel'] },
  { h:'Email',              f:'email',              aliases:['email address','e-mail'] },
  { h:'Skills',             f:'skills',             aliases:['skills / tags','tags'] },
  { h:'Main camera 1',      f:'camera1',            aliases:['camera 1','main camera'] },
  { h:'Main camera 2',      f:'camera2',            aliases:['camera 2'] },
  { h:'Main camera 3',      f:'camera3',            aliases:['camera 3'] },
  { h:'Other equipment',    f:'cameraExtras',       aliases:['other equipment / extras','kit','equipment'] },
  { h:'Dietary (general)',  f:'dietaryGeneral',     aliases:['dietary','diet'], norm:sheetSyncDietary },
  { h:'Dietary (specific)', f:'dietarySpecific',    aliases:['allergies','dietary notes','dietary requirements'] },
  { h:'Shoe size',          f:'shoeSize' },
  { h:'Clothing size',      f:'clothingSize',       aliases:['clothing / jacket size','jacket size'] },
  { h:'VAT registered',     f:'vatRegistered',      aliases:['vat','vat registered?'], norm:sheetSyncYesNo },
  { h:'Drives',             f:'drives',             aliases:['drives?','driver'], norm:sheetSyncYesNo },
  { h:'Car make / model',   f:'carMakeModel',       aliases:['car','car make/model','vehicle'] },
  { h:'Registration',       f:'carReg',             aliases:['registration plate','reg','number plate'] },
  { h:'Home address',       f:'homeAddress',        aliases:['address'] },
  { h:'Notes',              f:'generalNotes',       aliases:['general notes'] },
  { h:'Previous projects',  f:'previousProjects' },
  { h:'Instagram',          f:'instagram' },
  { h:'YouTube',            f:'youtube' },
  { h:'LinkedIn',           f:'linkedin' },
  { h:'Coffee / tea order', f:'coffeeOrder',        aliases:['coffee order','coffee'] },
  { h:'Invoices as',        f:'invoicesAs' },
  { h:'Fee / rate',         f:'rate',               aliases:['rate','day rate','fee'] },
  { h:'Private notes',      f:'notes' },
  { h:'Head of Dept',       special:'hod',          aliases:['hod','head of department'] },
];
const sheetSyncCellOf = (c, col) => {
  if(col.special==='id')    return c.id || '';
  if(col.special==='roles') return (c.roles||[]).join('; ');
  if(col.special==='hod')   return c.isHoD ? 'Yes' : '';
  return (c[col.f] ?? '').toString();
};
const sheetSyncNormalise = (col, v) => col.norm ? col.norm(v) : (v||'').toString().trim();

let sheetSyncBusy = '';          // progress text while a request is in flight ('' = idle)
let sheetSyncPreview = null;     // the plan awaiting Apply, from sheetSyncPull()
let sheetSyncNotice = null;      // {kind:'ok'|'err', text} shown in the bar until the next action
let sheetSyncSetupOpen = false;  // the numbered setup steps on the Settings tab
let sheetSyncEditing = false;    // Settings tab: URL field + setup shown (true) or the one-line "Connected" summary (false)

const sheetSyncSettings = () => (appSettings.sheetSync && typeof appSettings.sheetSync==='object') ? appSettings.sheetSync : {};
const sheetSyncUrl = () => (sheetSyncSettings().url || '').trim();
async function sheetSyncSaveSettings(patch){

function sheetSyncWhen(iso){

  const d = new Date(iso); if(isNaN(d)) return '';
