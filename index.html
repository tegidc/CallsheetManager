/* ============================================================ PRE-PRODUCTION (T-8)

   Phase BD. A sibling tab to Crew / Locations / Tech / Shoot Days / Budget /
   Preview & Export, NOT a sixth view inside Crew — it exists because pre-production
   has a different scheduling model to a shoot-day roster. It shows the same crew
   ENTRY rows as the Roles view, so a person doing two roles is two rows.

   ⚠️ THE ONE RULE THIS SCREEN IS BUILT AROUND: there are NO TOTALS. No rate × days,
   no aggregation, no rollup, no section total, no totals column. Rate and days are
   data on rows and nothing on this screen adds anything up. If a later phase wants a
   figure here, that is a decision to be taken deliberately, not a gap to fill in.
   (The only number on the screen that is not a row's own is the department heading's
   roster count, which deptHeaderHTML() renders on every crew screen in the app and
   which counts rows, not prep data.)

   ---- what lives where ----
   DAYS       — p.prepSchedule[entryId].days. A plain editable number and the
                AUTHORITATIVE figure: not derived, not computed, not reconciled
                against the date marks or against shoot days.
   DATE MARKS — p.prepSchedule[entryId].dates, a FLAT ARRAY of 'YYYY-MM-DD'. Their
                purpose is showing NON-CONTIGUOUS patterns (one day, gap, three days,
                gap, two). Click-and-drag is a selection affordance only — it is never
                stored as a range, a start/end pair, or anything but the flat list.
   RATE       — NOT here. It is the entry's own existing `rate`, read through
                resolveEntryRate() and written through saveEntryRate(), the exact same
                field the Roles view and Budget read. There is deliberately ONE rate:
                editing it here changes it everywhere. Do not add a prep-specific rate.

   ⚠️ MARKS ARE INDICATIVE AND NOT BOUND TO THE DAYS NUMBER. "Booked 5, marked 7" is a
   VALID state — someone spreading five days' work across seven. There is deliberately
   NO warning, NO validation, NO reconciliation, NO colour change and NO badge for a
   mismatch, in either direction. Do not add one.

   ---- why a parallel structure and not a field on the entry ----
   p.crewEntries' shape was settled deliberately by Phase BF; this is a parallel, not
   an extension of it. The cost of that choice is that prep data outlives the entry it
   belongs to unless something removes it, which is why prunePrepSchedule() exists and
   is called from both entry-removal paths — see removeCrewEntries() and deleteCrew().
*/

let prepCalendarFor = null;   // entry id whose calendar is open, or null — one at a time
let prepCalMonth = null;      // 'YYYY-MM' the open calendar is currently showing

/* ---- storage accessors ----
   Read-only helpers never create a record: an entry with no prep data must stay
   absent from p.prepSchedule entirely, so a project nobody has used this tab on
   carries no key at all. */
const prepScheduleOf = (p) => ((p||currentProject()||{}).prepSchedule)||{};
const prepRecordOf   = (entryId, p) => prepScheduleOf(p)[entryId] || null;
const prepDaysOf     = (entryId, p) => { const r = prepRecordOf(entryId, p); return r && r.days!=null ? r.days : null; };
const prepDatesOf    = (entryId, p) => { const r = prepRecordOf(entryId, p); return Array.isArray(r&&r.dates) ? r.dates : []; };

/* the ONE write path into p.prepSchedule. Normalises on the way out (dates sorted and
   deduplicated) and deletes rather than storing an empty husk — the same idiom as
   saveEntryRate()'s "clearing the field deletes the key". */
function prepWrite(p, entryId, mutate){
  if(!p || !entryId) return;
  p.prepSchedule = p.prepSchedule || {};
  const existing = p.prepSchedule[entryId];
  const rec = { days: existing && existing.days!=null ? existing.days : null,
                dates: Array.isArray(existing&&existing.dates) ? existing.dates.slice() : [] };
  mutate(rec);
  const dates = [...new Set(rec.dates||[])].sort();
  if(rec.days==null && !dates.length) delete p.prepSchedule[entryId];
  else p.prepSchedule[entryId] = { days: rec.days, dates };
  if(!Object.keys(p.prepSchedule).length) delete p.prepSchedule;
}

/* Pruning. Called from removeCrewEntries() (single + bulk removal) and from
   deleteCrew() (which does not route through it). Takes a Set of entry ids. */
function prunePrepSchedule(p, entryIds){
  if(!p || !p.prepSchedule) return;
  const kill = entryIds instanceof Set ? entryIds : new Set(entryIds||[]);
  kill.forEach(id=>{ delete p.prepSchedule[id]; });
  if(!Object.keys(p.prepSchedule).length) delete p.prepSchedule;
}

/* Days. Written on `onchange`, so it only fires when the value actually changed and
   focus has left. Garbage reverts by re-rendering without saving, exactly as
   saveEntryRate() does — the field visibly returns to the last valid value rather
   than sitting there holding text that was never stored. Empty clears it. */
async function setPrepDays(entryId, rawValue){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  const trimmed = (rawValue||'').trim();
  let next = null;
  if(trimmed!==''){
    const n = Number(trimmed);
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }
    next = n;
  }
  prepWrite(p, entryId, rec=>{ rec.days = next; });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* ---- the per-entry calendar ---- */
function prepCalAnchorMonth(entryId){
  const marks = prepDatesOf(entryId);
  if(marks.length) return marks[0].slice(0,7);
  // otherwise open on something meaningful: the project's first shoot day, else its
  // start date, else this month. Read-only — this tab never touches shoot days.
  const p = currentProject();
  const first = projectDays(p&&p.id)[0];
  const iso = (first && first.date) || (p && p.startDate) || '';
  return /^\d{4}-\d{2}/.test(iso) ? iso.slice(0,7) : new Date().toISOString().slice(0,7);
}
function togglePrepCalendar(entryId){
  if(prepCalendarFor===entryId){ prepCalendarFor = null; prepCalMonth = null; }
  else { prepCalendarFor = entryId; prepCalMonth = prepCalAnchorMonth(entryId); }
  renderProjectBody();
}
function shiftPrepCalMonth(delta){
  if(!prepCalMonth) return;
  const [y,m] = prepCalMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  prepCalMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  renderProjectBody();
}
async function commitPrepDates(entryId, isoList){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  prepWrite(p, entryId, rec=>{ rec.dates = isoList||[]; });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}
async function clearPrepDates(entryId){ await commitPrepDates(entryId, []); }

/* Click-and-drag selection. The drag is a UI affordance for picking several dates
   quickly and nothing more — what gets stored is still the flat array.
   It works off a local Set and direct classList updates rather than re-rendering per
   cell, because a re-render mid-drag would destroy the element the pointer is over.
   ONE save and ONE render happen on mouseup. The first cell decides the direction
   (dragging from an unmarked day marks; from a marked day unmarks), so a drag can
   clear a run as easily as it makes one. A plain click is a one-cell drag. */
let prepDrag = null;   // {entryId, mode:'add'|'remove', set:Set}
function prepDayDown(entryId, iso, ev){
  if(ev) ev.preventDefault();
  const cur = new Set(prepDatesOf(entryId));
  prepDrag = { entryId, mode: cur.has(iso) ? 'remove' : 'add', set: cur };
  prepDragApply(iso);
}
function prepDayEnter(iso){ if(prepDrag) prepDragApply(iso); }
function prepDragApply(iso){
  if(!prepDrag) return;
  if(prepDrag.mode==='add') prepDrag.set.add(iso); else prepDrag.set.delete(iso);
  const el = document.querySelector(`.prep-cal-day[data-iso="${iso}"]`);
  if(el) el.classList.toggle('marked', prepDrag.set.has(iso));
}
document.addEventListener('mouseup', ()=>{
  if(!prepDrag) return;
  const d = prepDrag; prepDrag = null;
  commitPrepDates(d.entryId, [...d.set]);
});

const PREP_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const PREP_WEEKDAYS = ['M','T','W','T','F','S','S'];
function prepCalendarHTML(entryId){
  const ym = prepCalMonth || prepCalAnchorMonth(entryId);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday-first
  const marked = new Set(prepDatesOf(entryId));
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="prep-cal-day empty"></span>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push(`<span class="prep-cal-day${marked.has(iso)?' marked':''}" data-iso="${iso}"
      onmousedown="prepDayDown('${entryId}','${iso}',event)" onmouseenter="prepDayEnter('${iso}')">${d}</span>`);
  }
  return `<div class="prep-cal">
      <div class="prep-cal-head">
        <span class="prep-cal-nav" onclick="shiftPrepCalMonth(-1)" title="Previous month">‹</span>
        <span class="prep-cal-title">${PREP_MONTH_NAMES[m-1]} ${y}</span>
        <span class="prep-cal-nav" onclick="shiftPrepCalMonth(1)" title="Next month">›</span>
        ${marked.size ? `<span class="prep-cal-clear" onclick="clearPrepDates('${entryId}')">Clear marks</span>` : ''}
      </div>
      <div class="prep-cal-grid">
        ${PREP_WEEKDAYS.map(w=>`<span class="prep-cal-wd">${w}</span>`).join('')}
        ${cells.join('')}
      </div>
      <div class="hint">Click or drag to mark the days this person is needed in prep. Marks are indicative — they don't have to match the booked number.</div>
    </div>`;
}

/* The soft counter. Muted, no emphasis and no colour change when the two differ —
   a mismatch is a valid state, not a warning. Renders empty (not "0 days booked")
   when there is nothing to say, so an untouched row reads as genuinely empty. */
function prepCounterText(days, markCount){
  const parts = [];
  if(days!=null) parts.push(`${days} day${days===1?'':'s'} booked`);
  if(markCount) parts.push(`${markCount} date${markCount===1?'':'s'} marked`);
  return parts.join(' · ');
}

/* Pre-production (T-2.9) PERSON BLOCK (Phase BK; collapsible Phase BL).
   ⚠️ Takes a PERSON BLOCK. Prep days, the entry rate and the date marks are ALL
   entry-level (p.prepSchedule is keyed by entry id), so every one of them sits on a
   ROLE ROW — the name line here carries nothing but the person, because this tab has
   no person-level fact of its own. Rate and days are still two bare number fields with
   NO column headers and NO inline labels: magnitude alone distinguishes them. Do not
   add labels back. ⚠️ Still no totals of any kind on this screen — nothing here sums,
   rolls up or multiplies anything, and BK/BL added none.
   The role cell reuses roleBannerHTML() exactly as the Roles view has it — since Phase
   BM that is one chip which IS the roles-menu trigger, no separate "+" marker. */
function prepRowHTML(block){
  const p = currentProject(), shootDays = projectDays();
  const fronted = frontedEntryOfBlock(block, p, shootDays);
  const rest = block.entries.filter(e=>e.id!==fronted.id);
  // an open date-marks calendar belonging to a stacked-away entry has to stay on
  // screen, so the block renders open in that one case — derived from prepCalendarFor,
  // which already exists; NOT a new piece of open/closed state.
  const open = rest.some(e=>e.id===prepCalendarFor);
  /* Phase BN — the fronted entry's Role/fields/calendar cells render straight onto
     the SAME .prep-grid div as the name (not a second, independently-gridded
     .pb-role-row), which is what let a single-role person's name and prep fields
     land on two separate lines. A stacked-away (extra) entry still gets its own
     .pb-role-row below, genuinely a new row. */
  const entryCellsHTML = (e, toggleHTML) => {
    const rate = resolveEntryRate(e.id, p);
    const days = prepDaysOf(e.id, p);
    const marks = prepDatesOf(e.id, p);
    const calOpen = prepCalendarFor===e.id;
    return { calOpen, html: `<div class="prep-cell pb-role-cell" data-label="Role" style="grid-column:3;"><span class="roles-inline">${roleBannerHTML(e)}${toggleHTML}</span></div>
      <div class="prep-cell prep-fields" style="grid-column:4;">
        <div class="prep-fields-row">
          <input type="text" inputmode="decimal" class="budget-rate-input" value="${rate.hasRate?rate.rate:''}" placeholder="—"
            title="Day rate — the same rate as the Roles view and Budget"
            onclick="event.stopPropagation()" onchange="saveEntryRate('${e.id}', this.value)">
          <input type="text" inputmode="numeric" class="budget-rate-input prep-days-input" value="${days!=null?days:''}" placeholder="—"
            title="Pre-production days"
            onclick="event.stopPropagation()" onchange="setPrepDays('${e.id}', this.value)">
        </div>
        <div class="prep-counter">${esc(prepCounterText(days, marks.length))}</div>
      </div>
      <div class="prep-cell prep-calcell" style="grid-column:5;">
        <button type="button" class="icon-btn prep-cal-btn${marks.length?' has-marks':''}"
          onclick="togglePrepCalendar('${e.id}')"
          title="${marks.length ? `${marks.length} date${marks.length===1?'':'s'} marked` : 'No dates marked'}"
          aria-label="Date marks">${icon('calendar')}</button>
      </div>
      ${calOpen ? `<div class="prep-calwrap">${prepCalendarHTML(e.id)}</div>` : ''}` };
  };
  const frontedCells = entryCellsHTML(fronted, personBlockToggleHTML(block, rest.length, open));
  const isEditing = editingCrewId===block.id;
  const head = `<div class="prep-grid pb-head${frontedCells.calOpen?' prep-grid-row-open':''}">
    <div class="prep-cell prep-controls">${crewControlsHTML(block, {selectCbHTML:personBlockSelectCbHTML(block)})}</div>
    <div class="prep-cell prep-name" data-label="Name" title="${esc(block.name)}">${esc(block.name)}</div>
    ${frontedCells.html}
  </div>`;
  const stack = rest.map(e=>{
    const cells = entryCellsHTML(e, '');
    return `<div class="prep-grid pb-role-row pb-role-extra${cells.calOpen?' prep-grid-row-open':''}"${open?'':' style="display:none;"'}>${cells.html}</div>`;
  }).join('');
  /* Phase BQ — Pre-production carries the Edit pencil and its expansion like Roles and
     Days on site. It was the one sub-tab without one (Phase BJ: "no crew-record edit
     path of its own"), which meant the Controls column rendered a checkbox and a gap
     where every other tab has a pencil. Same crewControlsHTML/crewExpansionHTML pair
     the other five use — no second edit path, and nothing about prep days/marks
     changes; this only reaches the crew RECORD, exactly as the pencil does elsewhere. */
  return personBlockWrapHTML(block, head + stack,
    { editing:isEditing, open, expansionHTML:crewExpansionHTML(block, 'pb-editform') });
}

/* ---------- Project Locations ---------- */
function renderProjectLocations(body){
  const p = currentProject();
  const assigned = (p.locationIds||[]).map(id=>locById(id)).filter(Boolean);
  const days = projectDays();
  body.innerHTML = `
    <div class="section">
      <h2>Locations on this project</h2>
      ${assigned.length ? locDayGridHTML(assigned, days) : '<div class="empty-note">No locations assigned to this project yet.</div>'}
    </div>
    <div class="section">
      <h2>Add location</h2>
      <button class="small" onclick="toggleLocAdd()">${locAddOpen?'Cancel':'+ Add location'}</button>
      ${locAddOpen ? `
        <div class="searchresults" style="margin-top:10px;">
          <input type="text" id="locAddSearch" placeholder="Search saved locations…" value="${esc(locAddQuery)}" oninput="onLocAddInput(this.value)" autocomplete="off">
          <div class="srlist" id="locAddResults">${locAddResultsHTML()}</div>
        </div>
        <div id="locFormWrap" style="display:none; margin-top:12px;"></div>
      ` : '<div id="locFormWrap" style="display:none;"></div>'}
    </div>`;
  if(locAddOpen) document.getElementById('locAddSearch')?.focus();
}
/* ---- ONE way to add a location (Phase Q) ----
   This tab used to carry two buttons that overlapped: a "select from the database"
   dropdown and a separate "add a new location" form. Which one you needed depended
   on something you could only find out by opening the dropdown and reading it, and
   picking wrong meant backing out and starting again in the other one.

   Now there is one button. It opens a search field over the Locations database, and
   the "create new location" option lives at the bottom of the same result list —
   so the answer to "is it already saved?" arrives as you type, and either outcome
   continues from where you already are. Both paths still end where they always did:
   an existing pick goes through addLocToProject(), and a new one through the same
   locFormHTML()/saveLocation() form with locFormContext set to this project, which
   is what attaches it to p.locationIds on save. */
let locAddOpen = false;
let locAddQuery = '';
function toggleLocAdd(){
  locAddOpen = !locAddOpen;
  if(!locAddOpen) locAddQuery = '';
  renderProjectBody();
}
function onLocAddInput(q){
  locAddQuery = q;
  const el = document.getElementById('locAddResults');
  if(el) el.innerHTML = locAddResultsHTML();   // results only — re-rendering the tab would steal focus mid-word
}
function locAddResultsHTML(){
  const p = currentProject(); if(!p) return '';
  const assignedIds = p.locationIds||[];
  const q = locAddQuery.trim();
  const ql = q.toLowerCase();
  const blob = l => (l.name+' '+(l.address||'')).toLowerCase();
  const matches = locationsDB.filter(l=>!assignedIds.includes(l.id)).filter(l=>!ql || blob(l).includes(ql)).slice(0,8);
  const rows = matches.map(l=>`<div class="sritem" onclick="addLocToProject('${l.id}')">
      <strong>${esc(l.name)}</strong>${l.address?`<div class="hint">${esc(l.address)}</div>`:''}
    </div>`).join('');
  let note = '';
  if(!matches.length){
    const alreadyOn = ql && locationsDB.some(l=>assignedIds.includes(l.id) && blob(l).includes(ql));
    note = `<div class="sritem" style="cursor:default; color:var(--muted);">${
      alreadyOn ? 'Already on this project.'
      : q ? `No saved location matches “${esc(q)}”.`
      : 'Every saved location is already on this project.'}</div>`;
  }
  return rows + note + `<div class="sritem" style="color:var(--tape);" onclick="startNewLocationFromSearch()">${
    q ? `+ Create new location “${esc(q)}”` : '+ Create a new location'}</div>`;
}
function startNewLocationFromSearch(){
  const p = currentProject(); if(!p) return;
  const w = document.getElementById('locFormWrap'); if(!w) return;
  locFormState = {lat:null, lon:null, hospital:null, parking:null};
  locFormContext = p.id;                       // what makes saveLocation() attach it to this project
  w.innerHTML = locFormHTML({ name: locAddQuery.trim() });
  w.style.display = '';
  w.scrollIntoView({behavior:'smooth', block:'nearest'});
}
/* Day-checkbox grid for project locations — same pattern as Crew tab's Days on site.
   Ticking a day for a location sets it as that day's primary location if the day has
   none yet, otherwise adds it to that day's additional locations. */
function locDayGridHTML(assigned, days){
  if(!days.length){
    return assigned.map(l=>`
      <div class="list-card">
        <div class="meta"><strong>${esc(l.name)}</strong><div>${esc(l.address||'')}</div></div>
        <div class="actions"><button class="small danger" onclick="removeLocFromProject('${l.id}')">${icon('trash')} Remove</button></div>
      </div>`).join('') + `<div class="hint" style="margin-top:8px;">Add shoot days first, then tick which days each location is used.</div>`;
  }
  const dayHeaderRow = `<div class="crewgrid crewgrid-header-row" style="--daycols:${days.length};">
      <div class="crewgrid-header crewgrid-corner" style="grid-column:1/4;"></div>
      ${days.map(d=>`<div class="crewgrid-header" title="Day ${esc(d.dayNum||'?')} — ${esc(fmtDate(d.date)||'date not set')}">D${esc(d.dayNum||'?')}</div>`).join('')}
      <div class="crewgrid-header"></div>
    </div>`;
  return `<div class="tablewrap">${dayHeaderRow}${assigned.map(l=>locRowHTML(l, days)).join('')}</div>`;
}
/* ⚠️ Shares .crewgrid with the Crew tab's Days on site/Hotel/Travel/Catering, so
   Phase BO's shared Controls/Name/Role leading columns apply here too even though
   this row has neither a checkbox nor a role — the name cell spans all three
   (grid-column:1/4) rather than landing in the narrow Controls track alone. */
function locRowHTML(l, days){
  const dayCells = days.map(d=>{
    const isPrimary = d.locationId===l.id;
    const isAdditional = (d.additionalLocationIds||[]).some(pair=>pair[0]===l.id);
    const checked = isPrimary || isAdditional;
    return `<div class="crewgrid-check" data-day="D${esc(d.dayNum||'?')}"><input type="checkbox" ${checked?'checked':''} onchange="toggleLocOnDay('${l.id}','${d.id}',this.checked)" title="${isPrimary?'Primary location — ':''}Day ${esc(d.dayNum||'?')}"></div>`;
  }).join('');

/* ---- collapsible block plumbing, shared by Preview & Export and the Shoot Day editor ----
   Both keep an {key:isOpen} map and a pair of DOM ids per block (body + caret). The
   only thing that differed between them was the id prefix, so that's the parameter. */
function applyBlockState(state, prefix, key){
  const bodyEl = document.getElementById(prefix+'b-'+key);
  const caret  = document.getElementById(prefix+'c-'+key);
  if(bodyEl) bodyEl.style.display = state[key] ? '' : 'none';

}
function toggleBlock(state, prefix, key){

/* ============ collapsibleSectionHTML() — the shared collapsible-section header
   (Gate 1 / G2) ============
   Every collapsible section in the app is a .sd-block-head with a caret, an id pair
   (<prefix>c-<key> / <prefix>b-<key>) and a display:${state?'':'none'} body — that
   shape was written out by hand in six near-identical places. Same split as
   filterPanelFootHTML()/filterToggleHTML(): only the markup is shared; each caller
   keeps its own open-state flag and its own toggle function (state lives in
   settingsBlocks/techBlocks/previewBlocks/etc. above, or a bare boolean for a
   singleton section) and calls into applyBlockState()/toggleBlock() exactly as
   before. No state moves here.

   Left OUT deliberately, not overlooked — eight builders were not eight instances
   of one thing:
     sdBlock()      — the whole head is the click target, not a caret+title span,
                       and its body carries .sd-block-body (the only one of the
                       eight that does). A real structural difference.
     budgetDayViewHTML()'s row — trailing <strong>total</strong> AND a bespoke
                       inline margin (`margin:14px 0 0`) neither shared by anything
                       else nor expressible as a boolean flag.
     budgetCostsViewHTML()'s group() — its inline margin-top is conditional on
                       which group renders first (`key==='catering'?'0':'18px'`),
                       standing in for the .sd-block:first-child rule that already
                       exists elsewhere in this file. Routing it through this shared
                       shape would mean either a param only one caller ever uses, or
                       silently changing its spacing (18px → the default 26px).
                       Left for a second pass rather than guessed at.

     state    — that section's own open flag
     prefix   — id prefix; '' omits the id attributes entirely, for a singleton
                section with nothing else to key off (e.g. Tasks)
     key      — that instance's key; '' for a singleton
     title    — already-formatted title HTML, inserted verbatim — callers that need
                escaping still call esc() themselves before passing it in, exactly
                as settingsBlockHTML() already did
     inner    — the body's inner HTML
     actions  — optional header-trailing HTML (e.g. a Copy button); stays outside
                the toggle span so it's clickable while the body is collapsed
     id       — optional id on the wrapper div
     wrapClass— the wrapper's class(es); defaults to 'section'
     onToggle — that caller's own toggle call, as an onclick string             */
function collapsibleSectionHTML({state=false, prefix='', key='', title='', inner='', actions='', id='', wrapClass='section', onToggle=''} = {}){
  const caretId = prefix ? ` id="${prefix}c-${key}"` : '';
  const bodyId  = prefix ? ` id="${prefix}b-${key}"` : '';
  return `<div class="${wrapClass}"${id?` id="${id}"`:''}>
    <div class="sd-block-head flush">
      <span class="sd-block-head-toggle" onclick="${onToggle}"><span class="dept-caret"${caretId}>${state?'▾':'▸'}</span> ${title}</span>
      ${actions||''}
    </div>
    <div${bodyId} style="display:${state?'':'none'}">${inner}</div>
  </div>`;
}

function pvBlockHTML(key, title, headerActionsHTML, bodyInnerHTML){
  return collapsibleSectionHTML({

    actions: headerActionsHTML, onToggle: `togglePreviewBlock('${key}')`

}

/* ============================================================
   BUDGET (Phase Budget) — cost visibility only, not a working budget.
   Rolls up cost data already entered elsewhere in the app (crew day rate ×
   days worked, the Catering/Travel cost summaries, Hotel room-nights) into
   three views. Deliberately excludes location fees (one fee can span several
   shoot days — not handling that here) and offers no editable line-item
   budget or export of its own; Preview & Export stays the export surface.
   ============================================================ */

// UK standard rate. Not project-configurable — this phase is cost VISIBILITY,
// not a real budgeting tool, so a fixed rate is the deliberate scope line.
const VAT_RATE = 0.20;

/* Room rate lives on the Hotel tab (hotelSummaryHTML, field id hcRoomNight) —
   moved here from Budget in Phase AD so it matches how Catering/Travel already
   own their own rates (getCateringCosts()/getTransportCosts()), same
   {field: Number(val)||0} shape as those two. Budget only reads it. */
function getHotelCosts(p){
  const c = (p && p.hotelCosts) || {};
  return { perRoomNight: Number(c.perRoomNight)||0 };
}
async function saveHotelCosts(){
  const p = currentProject(); if(!p) return;
  p.hotelCosts = { perRoomNight: Number(val('hcRoomNight'))||0 };
  await saveDB('db:projects', projectsDB);
}

/* Best-effort numeric extraction from the crew database's free-text Fee/rate
   field ("£450/day" -> 450). Returns null when nothing numeric is found,
   which the caller treats as "no rate on file", not as a rate of zero. */
function parseRateNumber(str){
  if(!str) return null;
  const m = String(str).replace(/,/g,'').match(/[\d]+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

/* Phase BF — the day rate now lives ON THE ENTRY (`entry.rate`), replacing the old
   p.crewRateOverrides[crewId] map, because rate is one of the three things that vary
   per role: the same person can be booked as an AC at one rate and an operator at
   another on the same project. Falls back to a best-effort parse of the crew database's
   Fee/rate field, and finally to "no rate on file" rather than silently costing someone
   at 0 — both unchanged.
   ⚠️ Renamed from resolveCrewRate(c, p) deliberately rather than kept and re-pointed:
   the argument changed from a crew record to an entry id, and a silent signature change
   on a money field is exactly the kind of thing that reads fine and computes wrong. Do
   not look for resolveCrewRate / saveCrewRateOverride. */
function resolveEntryRate(entryId, p){
  const e = entryById(entryId, p || currentProject());
  if(e && Object.prototype.hasOwnProperty.call(e, 'rate')){
    const n = Number(e.rate);
    if(!isNaN(n)) return { rate:n, hasRate:true, isOverride:true };
  }
  const c = e ? crewById(e.crewId) : null;
  const parsed = parseRateNumber(c && c.rate);
  if(parsed!=null) return { rate:parsed, hasRate:true, isOverride:false };
  return { rate:0, hasRate:false, isOverride:false };
}
async function saveEntryRate(entryId, rawValue){
  const p = currentProject(); if(!p) return;
  const e = entryById(entryId, p); if(!e) return;
  const trimmed = (rawValue||'').trim();
  if(trimmed===''){
    delete e.rate;                                  // clearing reverts to the database rate
  } else {
    const n = Number(trimmed);
    if(isNaN(n)){ renderProjectBody(); return; }    // reject garbage, revert the field to the last valid value
    e.rate = n;
  }
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* AG: the Day Rate "Save to database" icon — the first thing in the app that writes
   from a project back to the shared crew database itself (everything else here is the
   opposite direction: database → per-project override). Deliberately a separate,
   explicit action from the project's own autosave: the entry's own rate keeps behaving
   exactly as before, this only pushes the currently-resolved rate onto c.rate, the
   crew member's STANDING rate. Reused verbatim in all three places the Day Rate field
   appears (Roles tab, Budget Per Person, the crew Edit expansion) — `context` just
   keeps their status-flash element ids from colliding when more than one is on screen
   at once (the Roles row and its own Edit expansion render simultaneously). */
function crewRateSaveIconHTML(entryId, context){
  const elId = `crsStatus-${context}-${entryId}`;
  return `<button type="button" class="icon-btn" onclick="saveCrewRateToDatabase('${entryId}','${context}')" title="Saves to Database" aria-label="Save day rate to database">${icon('save')}</button><span class="hint" id="${elId}"></span>`;
}
async function saveCrewRateToDatabase(entryId, context){
  // Same selected-set fan-out as every other bulk-editable field on the Crew tab
  // (selectedEditTargets) — but this is the one field that can silently rewrite
  // someone else's standing database record, so unlike those, a 2+ selection gets an
  // explicit confirmation first. Cancelling changes nothing.
  const targets = selectedEditTargets(entryId);
  if(targets.length>1 && !confirm('This will change all these entries in the database — is that ok?')) return;
  const p = currentProject();
  // Phase BF — targets are ENTRY ids; the write lands on the PERSON each one points at.
  // Two entries for one person resolve to one crew record, so the last one wins — which
  // is the honest outcome for a field the database only has one of.
  targets.forEach(id=>{
    const e = entryById(id, p); if(!e) return;
    const c = crewById(e.crewId); if(!c) return;
    const { rate, hasRate } = resolveEntryRate(id, p);
    // vatRegistered is NOT touched here — AH's Budget VAT checkbox already mutates
    // it directly on the live crewDB record the moment it's ticked, so whatever's
    // currently in memory rides along with this same saveDB call for free (AH's
    // "pushes both fields together in one action").
    if(hasRate) c.rate = `£${rate}/day`;
  });
  flashSaveResult(`crsStatus-${context}-${entryId}`, await saveDB('db:crew', crewDB), 'Saved to database');
}

/* AN — the one money formatter for every Budget figure: the summary bar, all

/* R16 — a department filter, and R4 — a sort, for Per Person. Both live in the SAME
   panel as the day filter rather than becoming per-view controls: like the day

let budgetDeptFilter = new Set();
let budgetSort = 'dept';
function toggleBudgetFilterDept(dept, on){

/* Clears BOTH scopes — days and departments. Named clearBudgetFilter(), not
   ...DayFilter(): R16 added the department scope to this same panel and the
   function grew to cover it, but the old name stuck and a second, day-only

function clearBudgetFilter(){ budgetDayFilter.clear(); budgetDeptFilter.clear(); renderProjectBody(); }
function budgetActiveFilterCount(){ return budgetDayFilterCount() + budgetDeptFilter.size; }
/* budgetScopeParts() — the "N of M day(s)" segment of "describe the active
   budget scope", written three times (filter panel hint, export header,
   output-menu hint) and unified here (Gate 1 / G10). This is the part that was
   genuinely duplicated, pluralisation bug included: two callers always said
   "days", one correctly said "day" for a single day. Fixed once, to the
   correct form.
   The department segment is deliberately NOT folded in here — it's a real
   content difference, not a copy-paste one. The filter panel shows a count
   ("2 departments") next to checkboxes that already show the names; the
   export and output panels show the actual department names, because that's
   what the exported text needs to say to be read on its own. Each caller
   still builds that part itself, exactly as before. */
function budgetScopeParts(){
  const allDays = projectDays();
  const n = budgetDayFilterCount();
  return n ? [`${n} of ${allDays.length} day${allDays.length===1?'':'s'}`] : [];
}

function budgetFilterPanelHTML(){
  const all = projectDays();
  const chips = all.length ? all.map(d=>
      `<label><input type="checkbox" ${budgetDayFilter.has(d.id)?'checked':''} onchange="toggleBudgetFilterDay('${d.id}', this.checked)"> Day ${esc(d.dayNum||'?')}</label>`
    ).join('') : '<span class="hint">No shoot days yet.</span>';
  // Only departments actually present on this project — same rule as the Crew panel.
  const p = currentProject();
  const present = DEPARTMENTS.filter(d=>projectEntryViews(p).some(c=>deptBucketKey(c.department)===d));
  const deptChips = present.length ? present.map(d=>
      `<label><input type="checkbox" ${budgetDeptFilter.has(d)?'checked':''} onchange="toggleBudgetFilterDept('${d}', this.checked)"> ${esc(d)}</label>`
    ).join('') : '<span class="hint">No crew on this project yet.</span>';
  const dn = budgetDeptFilter.size;
  const scope = budgetScopeParts();
  if(dn) scope.push(`${dn} department${dn>1?'s':''}`);
  return `<div class="filter-panel">
    <div><div class="hint" style="margin-bottom:4px;">Shoot days</div><div class="filter-chips">${chips}</div></div>
    <div style="margin-top:10px;"><div class="hint" style="margin-bottom:4px;">Departments</div><div class="filter-chips">${deptChips}</div></div>
    <div class="grid g3" style="margin-top:10px;">
      <div><label for="budgetSortPick">Sort (Per Person)</label>
        <select id="budgetSortPick" onchange="setBudgetSort(this.value)">
          <option value="dept"     ${budgetSort==='dept'?'selected':''}>By department (HoD first)</option>
          <option value="name"     ${budgetSort==='name'?'selected':''}>By name</option>
          <option value="cost"     ${budgetSort==='cost'?'selected':''}>By cost (highest first)</option>
          <option value="rate"     ${budgetSort==='rate'?'selected':''}>By day rate (highest first)</option>
          <option value="days"     ${budgetSort==='days'?'selected':''}>By days worked (most first)</option>
          <option value="noRate"   ${budgetSort==='noRate'?'selected':''}>Missing a day rate first</option>
        </select></div>
    </div>
    ${filterPanelFootHTML({
      hint: scope.length ? `Costing ${scope.join(' · ')} — every figure below is for those only.`
                         : 'Whole project. Tick any day or department to narrow it.',
      active: budgetActiveFilterCount()>0,   // === scope.length; this panel's gating is unchanged
      onClear: 'clearBudgetFilter()'
    })}
  </div>`;
}

function buildBudgetData(){
  const p = currentProject();
  const days = budgetFilteredDays();
  /* Phase BF — one row per ENTRY, because day rate and days worked are both entry-level
     now. Travel is NOT: see travelRateFor/firstEntryOnDay below. */
  const crew = projectEntryViews(p);
  const hotelCosts = getHotelCosts(p);

  /* AO — VAT follows the PERSON, so a VAT-registered crew member's TRAVEL carries
     VAT too: travel is charged back through them, not paid direct to a supplier.
     This resolves buildTransportSummary()'s per-day arithmetic down to the one
     per-person figure it's already built from, rather than inventing a second
     attribution: a method is stored once per person per project (p.travelMethods),
     only 'Own car' (mileage) and 'Public transport' (flat day rate) carry a cost, and
     that cost lands on each day the person is actually on site — the same
     `daysWorked` signal below. So per-person travel = rate-for-their-method ×
     daysWorked, and summing that over everyone gives back exactly the travelTotal
     the Travel extras row shows.
     ⚠️ Catering and Hotel are DELIBERATELY excluded — see the note on hotelTotal. */
  const travelCosts = getTransportCosts(p);
  const travelMethods = p.travelMethods || {};
  const travelRateFor = id => {
    const m = travelMethods[id];
    if(m==='Own car') return travelCosts.mileage;
    if(m==='Public transport') return travelCosts.publicPerDay;
    return 0;   // Train / Flying / Production transport / custom: counted, never costed
  };

  // R16 — department scope. Applied to the people list itself, so the summary bar,
  // Per Department, Per Day and Per Person can't disagree about what's being costed.
  const crewInScope = budgetDeptFilter.size
    ? crew.filter(c=>budgetDeptFilter.has(deptBucketKey(c.department)))
    : crew;
  /* ⚠️ Phase BF — travel is charged ONCE PER PERSON, not once per entry, and over the
     DEDUPLICATED union of that person's days. Attributing it to whichever of their
     entries is in scope first keeps AO's reconciliation exact in both directions:
     summed over rows it still equals buildTransportSummary()'s travelTotal, and summed
     over days (see firstEntryOnDay in perDay below) it still equals each person's own
     figure. Charging it per entry would double a two-role person's travel AND the VAT
     on it, since AO's VAT base is (day rate + travel). */
  const travelClaimed = new Set();
  const people = crewInScope.map(c=>{
    const {rate, hasRate, isOverride} = resolveEntryRate(c.id, p);
    const daysWorked = entryDayCount(c.id, days);
    const subtotal = rate * daysWorked;
    const claimsTravel = !travelClaimed.has(c.crewId);
    if(claimsTravel) travelClaimed.add(c.crewId);
    const travelRate = claimsTravel ? travelRateFor(c.crewId) : 0;
    const travelCost = travelRate * crewDayCount(c.crewId, days, p);
    const vatRegistered = c.vatRegistered==='Yes';
    // AO — the VAT base is day rate AND travel, both invoiced by this person.
    // travelCost itself is NOT added to `subtotal`/`display`: it's already counted
    // once in the Travel extras row, and counting it here too would double it.
    const vat = vatRegistered ? (subtotal + travelCost) * VAT_RATE : 0;
    return {
      id:c.id, crewId:c.crewId, name:c.name, role:c.showAs||c.role, department:deptBucketKey(c.department),
      rate, hasRate, isOverride, daysWorked, subtotal, travelRate, travelCost, vatRegistered, vat,
      display: budgetPersonDisplay(subtotal, vat)
    };
  });

  // Filtered by PRESENCE (deptCounts), not by a truthy total — a department
  // with people assigned but no rate set should show as £0.00, not vanish, or
  // a whole department missing its rates would go unnoticed on a cost screen.
  /* AO — each department also carries a REAL VAT breakdown, summed from the actual
     mix of registered and unregistered people in it, never a flat 20% of the
     department total: a department with one registered person out of six shows only
     that one person's VAT. exVat is the department's own crew cost; vat is all VAT
     its people charge (day rate + their travel — see travelRateFor above), which is
     why vat is NOT 20% of exVat for anyone with travel. Summed across departments
     these give back exactly crewTotalExVat / vatTotal. */
  const deptTotals = {}, deptCounts = {}, deptExVat = {}, deptVat = {};
  people.forEach(pp=>{
    deptTotals[pp.department] = (deptTotals[pp.department]||0) + pp.display;
    deptCounts[pp.department] = (deptCounts[pp.department]||0) + 1;
    deptExVat[pp.department] = (deptExVat[pp.department]||0) + pp.subtotal;
    deptVat[pp.department]   = (deptVat[pp.department]||0) + pp.vat;
  });
  const departments = DEPARTMENTS.filter(d=>deptCounts[d]).map(d=>
    ({dept:d, code:DEPARTMENT_CODES[d]||'', total:deptTotals[d]||0,
      exVat:deptExVat[d]||0, vat:deptVat[d]||0, incVat:(deptExVat[d]||0)+(deptVat[d]||0)}));

  /* R2 — location fees. A fee is entered once on the location record, then spread
     evenly across the shoot days that location is actually used on, so Per Day and
     the day filter stay honest rather than a lump landing arbitrarily on Day 1.
     A location used on 3 days at £900 contributes £300 to each of them; filter to
     one of those days and you see £300, not £900 and not nothing.
     Days are counted across the WHOLE project, not just the days in scope — the
     per-day share is a property of the deal, and mustn't change size depending on
     what the filter happens to be showing. A location with no day assigned can't be
     apportioned, so it's charged whole (better visible than silently dropped).
     Uses parseRateNumber(), the same free-text reader as the crew rate field. */
  const usesLocation = (d, locId) => d.locationId===locId
    || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId);
  const locationFeeForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    const loc = locById(locId); if(!loc) return sum;
    const fee = parseRateNumber(loc.fee); if(!fee) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    if(!totalDaysUsed) return sum + (dayList===days ? fee : 0);   // unassigned: charge once, project-wide only
    const perDay = fee / totalDaysUsed;
    return sum + perDay * dayList.filter(d=>usesLocation(d, locId)).length;
  }, 0);
  const locationTotal = locationFeeForDays(days);

  const cateringGrid = buildCateringSummaryGrid();
  const transportSummary = buildTransportSummary();
  // Both grids are the Catering/Travel tabs' OWN summaries, always built for the
  // whole shoot, so their .totalCost is project-wide by definition. Sum their
  // per-day columns against the days actually in scope instead — with no day
  // filter set that's every column, i.e. the same number .totalCost gave.
  /* G15 — scoped and joined on d.id, the stable day identity every other screen in
     the app already uses. This was dayNum: free text the user types, non-unique,
     routinely blank ('?' is an expected display state) and mixed-type across
     records. Two days sharing a dayNum — or two both blank, which is easier to
     reach — made .find() return the first for both, putting one day's catering and
     travel cost on another day's row, and a day filter picking one of them silently
     pulled in the other's cost. Not a crash: a wrong number in a budget. Every
     reconciliation invariant would still have appeared to hold, because both sides
     read the same wrong figure. */
  const dayIdsInScope = new Set(days.map(d=>d.id));
  const sumDailyCost = g => g ? g.cols.filter(c=>dayIdsInScope.has(c.dayId))
                                      .reduce((s,c)=>s+c.dailyCost, 0) : 0;
  const cateringTotal = sumDailyCost(cateringGrid);
  const travelTotal = sumDailyCost(transportSummary);
  // Room-nights counted directly off the day records rather than via
  // buildHotelSummary(), which filters down to "active" nights only and would
  // need label-matching to recover one specific day's figure — this way, the
  // project-wide and per-day totals below share the exact same calculation.
  // The night before Day 1 is only a cost if Day 1 itself is in scope. projectDays()
  // is day-ordered and `days` preserves that order, so when Day 1 IS in scope it's
  // still days[0] — which keeps the `i===0` fold-in below correct either way.
  const firstProjectDay = projectDays()[0];
  const preNightRooms = (firstProjectDay && days.some(d=>d.id===firstProjectDay.id))
    ? (p.hotelNightBefore||[]).length : 0;
  const dayHotelRooms = days.map(d=>(d.hotelNights||[]).length);
  const hotelTotal = (preNightRooms + dayHotelRooms.reduce((s,n)=>s+n,0)) * hotelCosts.perRoomNight;

  /* ⚠️ AO — Catering, Hotel and Locations carry NO per-person VAT, and that is
     DELIBERATE, not an oversight: they are paid direct to a supplier (caterer,
     hotel, location owner), not invoiced back through a crew member, so there is no
     person whose vatRegistered status could attach to them. Travel is the exception
     precisely because it IS charged back through the crew member. Do not "fix" this
     by adding VAT to them. */
  const crewTotalExVat = people.reduce((s,pp)=>s+pp.subtotal, 0);
  const vatTotal = people.reduce((s,pp)=>s+pp.vat, 0);
  const extrasTotal = cateringTotal + travelTotal + hotelTotal + locationTotal;
  const totalExVat = crewTotalExVat + extrasTotal;
  const totalIncVat = totalExVat + vatTotal;

  const perDay = days.map((d,i)=>{
    const onDayIds = new Set((d.positions||[]).map(pos=>pos[0]));
    const dayPeople = people.filter(pp=>onDayIds.has(pp.id));
    /* Phase BF — a person on this day via two entries must carry their travel (and its
       VAT) ONCE. The first of their entries on this day claims it; the rest score zero.
       That is what keeps the per-day VAT column summing back to the per-person one. */
    const travelClaimedToday = new Set();
    const dayTravelRate = pp => {
      if(travelClaimedToday.has(pp.crewId)) return 0;
      travelClaimedToday.add(pp.crewId);
      return travelRateFor(pp.crewId);
    };
    const dayDeptTotals = {}, dayDeptCounts = {}, dayDeptExVat = {}, dayDeptVat = {};
    dayPeople.forEach(pp=>{
      // AO — one day's share of this person's VAT base: their day rate plus that
      // day's travel (travelRate is per on-site day by construction). Summed over
      // every day they work this gives back pp.vat exactly.
      const dayVat = pp.vatRegistered ? (pp.rate + dayTravelRate(pp))*VAT_RATE : 0;
      dayDeptTotals[pp.department] = (dayDeptTotals[pp.department]||0) + budgetPersonDisplay(pp.rate, dayVat);
      dayDeptCounts[pp.department] = (dayDeptCounts[pp.department]||0) + 1;
      dayDeptExVat[pp.department] = (dayDeptExVat[pp.department]||0) + pp.rate;
      dayDeptVat[pp.department]   = (dayDeptVat[pp.department]||0) + dayVat;
    });
    const dayDepartments = DEPARTMENTS.filter(dd=>dayDeptCounts[dd]).map(dd=>
      ({dept:dd, code:DEPARTMENT_CODES[dd]||'', total:dayDeptTotals[dd]||0,
        exVat:dayDeptExVat[dd]||0, vat:dayDeptVat[dd]||0, incVat:(dayDeptExVat[dd]||0)+(dayDeptVat[dd]||0)}));
    const cateringCol = cateringGrid ? cateringGrid.cols.find(c=>c.dayId===d.id) : null;
    const travelCol = transportSummary ? transportSummary.cols.find(c=>c.dayId===d.id) : null;
    const dayCatering = cateringCol ? cateringCol.dailyCost : 0;
    const dayTravel = travelCol ? travelCol.dailyCost : 0;
    // the night before Day 1 has no shoot-day row of its own — folds into Day 1
    const rooms = dayHotelRooms[i] + (i===0 ? preNightRooms : 0);
    const dayHotel = rooms * hotelCosts.perRoomNight;
    const dayLocation = locationFeeForDays([d]);
    const crewDisplay = dayDepartments.reduce((s,dd)=>s+dd.total, 0);
    const loc = d.locationId ? locById(d.locationId) : null;
    // AO — the day's own ex-VAT / VAT / inc-VAT, same shape as the project-wide
    // figures so Per Day's expanded table can use the identical itemized columns.
    const dayExVat = dayDepartments.reduce((s,dd)=>s+dd.exVat, 0)
                     + dayCatering + dayTravel + dayHotel + dayLocation;
    const dayVatTotal = dayDepartments.reduce((s,dd)=>s+dd.vat, 0);
    return {
      dayId:d.id, dayNum:d.dayNum, locationLabel: loc ? loc.name : '',
      departments:dayDepartments, catering:dayCatering, travel:dayTravel, hotel:dayHotel,
      location:dayLocation,
      exVat: dayExVat, vat: dayVatTotal, incVat: dayExVat + dayVatTotal,
      total: crewDisplay + dayCatering + dayTravel + dayHotel + dayLocation
    };
  });

  return {
    people, departments, cateringTotal, travelTotal, hotelTotal, locationTotal, extrasTotal,
    crewTotalExVat, vatTotal, totalExVat, totalIncVat, perDay,
    hasCrew: crewInScope.length>0, hasDays: days.length>0
  };
}

function budgetSummaryBarHTML(data){
  const fmt = budgetFmt;
  const stats = budgetVatToggle
    ? [['Total (ex-VAT)', data.totalExVat], ['VAT', data.vatTotal], ['Total (inc-VAT)', data.totalIncVat]]
    : [['Total', data.totalIncVat]];
  return `<div class="budget-summary">
    ${stats.map(([lbl,v])=>`<div class="budget-stat"><div class="num">${fmt(v)}</div><div class="lbl">${esc(lbl)}</div></div>`).join('')}
    <div class="budget-vat-toggle"><label><input type="checkbox" ${budgetVatToggle?'checked':''} onchange="toggleBudgetVat(this.checked)"> Itemize VAT</label></div>
  </div>`;
}

/* Shared by the project-wide Per Department view and each Per Day row's own
   expanded breakdown — "same department + aggregated-extras structure … just
   scoped to that single day" per the brief. Extras rows are always their own
   labelled block, never folded into a department — a catering or travel bill
   isn't any one department's cost. */
/* AO — takes ONE options object rather than the seven positional args it had: the
   itemized breakdown needs exVat/vat/incVat as well, and ten positional args at two
   call sites is a bug waiting to happen. Shape is the same either way — the
   project-wide caller passes the data's project totals, the Per Day caller passes
   that day's, and both get the identical table.
   With Itemize VAT on the department rows carry a real ex-VAT / VAT / inc-VAT
   breakdown (see buildBudgetData) instead of one Cost column. The extras rows show
   £0.00 VAT deliberately — catering/hotel/location are supplier-paid so no person's
   vatRegistered attaches to them, and travel's VAT is charged by the crew member who
   travelled, so it sits in THEIR department's row, not here. */
function budgetDeptExtrasTableHTML(o){
  const fmt = budgetFmt;
  const {departments, catering, travel, hotel, location, extrasLabel} = o;
  if(!departments.length && !catering && !travel && !hotel && !location){
    return '<div class="empty-note">Nothing to cost yet.</div>';
  }
  const deptCell = d => `<td>${d.code?`<span class="dept-code">${esc(d.code)}</span> `:''}${esc(d.dept)}</td>`;
  if(!budgetVatToggle){
    return `<div class="tablewrap"><table>
      <tr><th>Department</th><th>Cost</th></tr>
      ${departments.map(d=>`<tr>${deptCell(d)}<td>${fmt(d.total)}</td></tr>`).join('')}
      <tr class="budget-extras-row"><td colspan="2"><span class="subhead" style="margin:0;">${esc(extrasLabel)}</span></td></tr>
      <tr><td>Catering</td><td>${fmt(catering)}</td></tr>
      <tr><td>Travel</td><td>${fmt(travel)}</td></tr>
      <tr><td>Hotels</td><td>${fmt(hotel)}</td></tr>
      <tr><td>Locations</td><td>${fmt(location)}</td></tr>
      <tr class="budget-total-row"><td>Total</td><td>${fmt(o.total)}</td></tr>
    </table></div>`;
  }
  const extraRow = (lbl, v) => `<tr><td>${lbl}</td><td>${fmt(v)}</td><td>${fmt(0)}</td><td>${fmt(v)}</td></tr>`;
  const anyTravelVat = departments.some(d=>d.vat>0) && travel>0;
  return `<div class="tablewrap"><table>
    <tr><th>Department</th><th>Ex-VAT</th><th>VAT</th><th>Inc-VAT</th></tr>
    ${departments.map(d=>`<tr>${deptCell(d)}<td>${fmt(d.exVat)}</td><td>${fmt(d.vat)}</td><td>${fmt(d.incVat)}</td></tr>`).join('')}
    <tr class="budget-extras-row"><td colspan="4"><span class="subhead" style="margin:0;">${esc(extrasLabel)}</span></td></tr>
    ${extraRow('Catering', catering)}
    ${extraRow('Travel', travel)}
    ${extraRow('Hotels', hotel)}
    ${extraRow('Locations', location)}
    <tr class="budget-total-row"><td>Total</td><td>${fmt(o.exVat)}</td><td>${fmt(o.vat)}</td><td>${fmt(o.incVat)}</td></tr>
  </table></div>
  <div class="hint" style="margin-top:8px;">A department's VAT is summed from the people in it who are actually VAT-registered — not 20% of its total.${anyTravelVat?' It includes VAT on their travel, which is itself shown ex-VAT in the Travel row above.':''} Catering, Hotels and Locations are paid direct to a supplier, so no crew member's VAT attaches to them.</div>`;
}

function budgetDepartmentViewHTML(data){
  if(!data.hasCrew && !data.cateringTotal && !data.travelTotal && !data.hotelTotal && !data.locationTotal){
    return '<div class="empty-note">No crew assigned to this project yet.</div>';
  }
  const displayTotal = budgetVatToggle ? data.totalExVat : data.totalIncVat;
  return budgetDeptExtrasTableHTML({
    departments: data.departments, catering: data.cateringTotal, travel: data.travelTotal,
    hotel: data.hotelTotal, location: data.locationTotal, extrasLabel: 'Project-wide extras',
    total: displayTotal, exVat: data.totalExVat, vat: data.vatTotal, incVat: data.totalIncVat
  });
}

function budgetPersonViewHTML(data){
  if(!data.hasCrew) return '<div class="empty-note">No crew assigned to this project yet.</div>';
  const fmt = budgetFmt;
  // Same order as everywhere else crew is listed without an explicit sort
  // control: canonical department order, HoD-first within it (sortHoDFirst).
  // There's no existing sortable-table (click-a-column-header) pattern
  // anywhere in this app to extend, so this stays a fixed, sensible order
  // rather than inventing a new UI paradigm for one screen.
  const ordered = budgetOrderedPeople(data);
  const noRateCount = data.people.filter(pp=>!pp.hasRate).length;
  // AO — with Itemize VAT on, the person's own VAT amount gets a column of its own.
  // It has to be visible now that it is no longer simply 20% of the Subtotal beside
  // it: for a VAT-registered person it also covers their travel (charged back
  // through them), which is itemised ex-VAT in the Travel extras row instead.
  const anyTravel = data.people.some(pp=>pp.travelCost>0);
  const vatCell = pp => {
    const travelNote = pp.vatRegistered && pp.travelCost
      ? ` title="Includes ${budgetFmt(pp.travelCost*VAT_RATE)} VAT on ${budgetFmt(pp.travelCost)} of travel"` : '';
    return `<td${travelNote}>${pp.vat ? fmt(pp.vat) : '<span class="budget-noRate">—</span>'}</td>`;
  };
  return `<div class="tablewrap"><table>
    <tr><th>Name</th><th>Role</th><th>Day rate</th><th style="text-align:center;">VAT reg.</th><th style="text-align:center;">Days</th>${budgetVatToggle?'<th>VAT</th>':''}<th>Subtotal</th></tr>
    ${ordered.map(pp=>`<tr>
      <td>${esc(pp.name)}</td>
      <td>${esc(pp.role||'')}</td>
      <td><span class="rate-with-save"><input type="text" inputmode="decimal" class="budget-rate-input" value="${pp.rate||''}" placeholder="—" onchange="saveEntryRate('${pp.id}', this.value)">${crewRateSaveIconHTML(pp.id, 'b')}</span></td>
      <td style="text-align:center;"><input type="checkbox" ${pp.vatRegistered?'checked':''} onchange="toggleBudgetVatRegistered('${pp.id}', this.checked)" title="Charges VAT"></td>
      <td style="text-align:center;">${pp.daysWorked}</td>
      ${budgetVatToggle?vatCell(pp):''}
      <td>${pp.hasRate ? fmt(pp.display) : '<span class="budget-noRate">—</span>'}</td>
    </tr>`).join('')}
  </table></div>
  ${noRateCount ? `<div class="hint" style="margin-top:8px;">${noRateCount} crew member${noRateCount>1?'s have':' has'} no day rate on file — enter one above, or add it on their crew database record.</div>` : ''}
  ${anyTravel ? `<div class="hint" style="margin-top:8px;">A VAT-registered crew member's travel carries VAT too — it's charged back through them — so their VAT covers day rate ${budgetVatToggle?'and travel':'and travel, baked into the Subtotal'}. The travel cost itself is counted once, in the Travel line of Per Department.</div>` : ''}
  <div class="hint" style="margin-top:8px;">Ticking VAT here doesn't save on its own — it's saved to the crew database together with the day rate, the next time that row's Save icon is clicked.</div>`;
}

function budgetDayViewHTML(data){
  if(!data.hasDays) return '<div class="empty-note">Add shoot days first, then assign crew positions to cost them out here.</div>';
  syncBudgetDayBlocks(data.perDay.map(d=>d.dayId));
  const fmt = budgetFmt;
  const toggleRow = data.perDay.length>1 ? expandCollapseAllHTML('toggleAllBudgetDayBlocks()', undefined, allBlocksCollapsed(budgetDayBlocks), 'bd') : '';
  const rows = data.perDay.map(d=>{
    const open = budgetDayBlocks[d.dayId];
    const title = `Day ${esc(d.dayNum||'?')}${d.locationLabel?' — '+esc(d.locationLabel):''}`;
    return `<div class="sd-block">
      <div class="sd-block-head" style="margin:14px 0 0;">
        <span class="sd-block-head-toggle" onclick="toggleBudgetDayBlock('${d.dayId}')" style="flex:1;">
          <span class="dept-caret" id="bdc-${d.dayId}">${open?'▾':'▸'}</span> ${title}
        </span>
        <strong>${fmt(d.total)}</strong>
      </div>
      <div id="bdb-${d.dayId}" style="display:${open?'':'none'}; margin-top:10px;">
        ${budgetDeptExtrasTableHTML({
          departments: d.departments, catering: d.catering, travel: d.travel,
          hotel: d.hotel, location: d.location, extrasLabel: 'Day extras',
          total: d.total, exVat: d.exVat, vat: d.vat, incVat: d.incVat
        })}
      </div>
    </div>`;
  }).join('');
  return toggleRow + rows;
}

function budgetOrderedPeople(data){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  if(budgetSort==='dept') return DEPARTMENTS.flatMap(d=>sortHoDFirst(data.people.filter(pp=>pp.department===d)));
  return [...data.people].sort((a,b)=>{
    switch(budgetSort){
      case 'name':   return byName(a,b);
      case 'cost':   return (b.display-a.display) || byName(a,b);
      case 'rate':   return ((b.hasRate?b.rate:-1)-(a.hasRate?a.rate:-1)) || byName(a,b);
      case 'days':   return (b.daysWorked-a.daysWorked) || byName(a,b);
      // "no rate on file" is a to-do list, so those come first, then by name
      case 'noRate': return (Number(a.hasRate)-Number(b.hasRate)) || byName(a,b);
      default:       return byName(a,b);
    }
  });
}

/* R1 — Budget was the only summary screen in the app with no way to get the numbers
   out; every other one (hotel, catering, travel, tech) has had a Copy since its own
   phase. Built from the SAME buildBudgetData() the screen renders from, so the copy
   and the screen can never disagree — and it honours the active day/department
   filter, because a budget you send while filtered should say so rather than quietly
   exporting the whole project. Rows mirror the visible view, not a fixed shape.
   Phase AP — `view` is now passed in rather than read off the global budgetView, so
   the output menu can export a view you aren't currently looking at. Still ONE data
   path: every figure comes from the buildBudgetData() handed in. */
function budgetExportRows(data, view){
  const fmt = budgetFmt;
  const rows = [];
  const scope = budgetScopeParts();
  if(budgetDeptFilter.size)  scope.push([...budgetDeptFilter].join(', '));
  if(scope.length) rows.push(['Filtered to', scope.join(' · ')], []);
  budgetVatToggle
    ? rows.push(['Total (ex-VAT)', fmt(data.totalExVat)], ['VAT', fmt(data.vatTotal)], ['Total (inc-VAT)', fmt(data.totalIncVat)])
    : rows.push(['Total', fmt(data.totalIncVat)]);
  rows.push([]);
  // AO — the itemized shapes mirror the screen column-for-column: Per Person gains
  // the VAT amount, Per Department/Per Day the ex-VAT/VAT/inc-VAT breakdown.
  if(view==='person'){
    rows.push(budgetVatToggle
      ? ['Name','Role','Day rate','VAT reg.','Days','VAT','Subtotal']
      : ['Name','Role','Day rate','VAT reg.','Days','Subtotal']);
    budgetOrderedPeople(data).forEach(pp=>rows.push([
      pp.name, pp.role||'', pp.hasRate?fmt(pp.rate):'no rate on file',
      pp.vatRegistered?'Yes':'No', pp.daysWorked,
      ...(budgetVatToggle ? [pp.vat?fmt(pp.vat):'—'] : []),
      pp.hasRate?fmt(pp.display):'—']));
  } else if(view==='day'){
    rows.push(budgetVatToggle ? ['Day','Location','Ex-VAT','VAT','Inc-VAT'] : ['Day','Location','Total']);
    data.perDay.forEach(d=>rows.push(budgetVatToggle
      ? [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]
      : [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.total)]));
  } else if(view==='costs'){
    /* AP — Costs is the one view that isn't a rollup, so R1 quietly exported the
       Per Department shape for it. Now that the menu names it, it exports what it
       actually shows: the per-unit RATES, read through the very same
       getCateringCosts()/getTransportCosts()/getHotelCosts() getters
       budgetCostsViewHTML() renders from — not a second copy of them — followed by
       the extras totals those rates produce, which still come from buildBudgetData()
       like every other figure here. No VAT split: these are supplier costs, and per
       AO's "VAT follows the person" they carry none. */
    const p = currentProject();
    const cc = getCateringCosts(p), tc = getTransportCosts(p), hc = getHotelCosts(p);
    // Single-cell captions, not two-column headers: these rows are label/value
    // pairs, and copyBudget() renders a 2-cell row as "label: value" — a
    // ['Rate','Amount'] header would come out as the nonsense line "Rate: Amount".
    rows.push(['Rates'],
      ['Catering — per breakfast', fmt(cc.b)],
      ['Catering — per lunch', fmt(cc.l)],
      ['Catering — per dinner', fmt(cc.d)],
      ['Catering — delivery', fmt(cc.delivery)],
      ['Travel — public transport per day', fmt(tc.publicPerDay)],
      ['Travel — mileage (own car, per use)', fmt(tc.mileage)],
      ['Hotel — per room/night', fmt(hc.perRoomNight)],
      [],
      ['Totals'],
      ['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
      ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)]);
  } else if(budgetVatToggle){
    rows.push(['Department','Ex-VAT','VAT','Inc-VAT']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]));
    const extra = (lbl,v)=>[lbl, fmt(v), fmt(0), fmt(v)];
    rows.push(extra('Catering', data.cateringTotal), extra('Travel', data.travelTotal),
              extra('Hotels', data.hotelTotal), extra('Locations', data.locationTotal),
              ['Total', fmt(data.totalExVat), fmt(data.vatTotal), fmt(data.totalIncVat)]);
  } else {
    rows.push(['Department','Cost']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.total)]));
    rows.push(['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
              ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)],
              ['Total', fmt(data.totalIncVat)]);
  }
  return rows;
}

const BUDGET_VIEW_LABELS = {department:'Per Department', day:'Per Day', person:'Per Person', costs:'Costs'};

function copyBudget(){

  const out = [budgetExportTitle(view), ''];

    out.push(r.length===2 ? `${r[0]}: ${r[1]}` : r.join('  |  '));

function downloadBudgetExcel(){
  const view = budgetExportViewEff();

/* Overview "shoot days" count field — kept in sync both ways with the actual
   Shoot Days list. Growing it creates blank new days (same shape as + New day).
   Shrinking it never silently deletes — it expands an inline checkbox picker
   (shootDayReductionPending) so the specific day(s) to lose can be ticked,
   rather than a sequence of native prompt() popups (Phase T item 1). */
let shootDayReductionPending = null;   // { removeCount, selected:Set() } while picking which day(s) to remove
function shootDayLabel(d){ return `Day ${d.dayNum||'?'}${d.date?' — '+fmtDate(d.date):''}${d.locationId?' — '+((locById(d.locationId)||{}).name||''):''}`; }
async function syncShootDayCount(newCountStr){
  const p = currentProject(); if(!p) return;
  const days = projectDays(p.id);
  const newCount = parseInt(newCountStr, 10);
  shootDayReductionPending = null;
  if(!Number.isFinite(newCount) || newCount < 0 || newCount === days.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
  if(newCount > days.length){
    for(let i=days.length; i<newCount; i++){
      const rec = makeShootDayRecord(p.id, p);
      shootDaysDB.push(rec);
    }
    await saveDB('db:shootdays', shootDaysDB);
    renderProjectOverview(document.getElementById('projectBody'));
    return;
  }
  // shrinking — expand an inline checkbox picker instead of deciding for the user
  shootDayReductionPending = { removeCount: days.length - newCount, selected: new Set() };
  renderProjectOverview(document.getElementById('projectBody'));
}
function toggleShootDayReductionPick(dayId, checked){
  if(!shootDayReductionPending) return;
  if(checked) shootDayReductionPending.selected.add(dayId); else shootDayReductionPending.selected.delete(dayId);
  renderProjectOverview(document.getElementById('projectBody'));
}

  shootDaysDB = shootDaysDB.filter(d=>!pend.selected.has(d.id));
  if(pend.selected.has(currentShootDayId)) currentShootDayId = null;
  shootDayReductionPending = null;

}

async function addSubDeptAdmin(dept){
  const sd = (prompt(`New sub-department under ${dept}:`)||'').trim();
  if(!sd) return;
  SUBDEPARTMENTS_BY_DEPT[dept] = SUBDEPARTMENTS_BY_DEPT[dept] || [];
  if(!SUBDEPARTMENTS_BY_DEPT[dept].includes(sd)) SUBDEPARTMENTS_BY_DEPT[dept].push(sd);
  await saveDB('db:subdepartments', SUBDEPARTMENTS_BY_DEPT);
  refreshCrewDatabase();
}
async function renameSubDeptAdmin(dept, oldSd){
  const newSd = (prompt(`Rename "${oldSd}" to:`, oldSd)||'').trim();
  if(!newSd || newSd===oldSd) return;
  const list = SUBDEPARTMENTS_BY_DEPT[dept] || [];
  const i = list.indexOf(oldSd);
  if(i>-1) list[i] = newSd;
  crewDB.forEach(c=>{ if(c.department===dept && c.subDepartment===oldSd) c.subDepartment = newSd; });
  await saveDB('db:subdepartments', SUBDEPARTMENTS_BY_DEPT);
  await saveDB('db:crew', crewDB);
  refreshCrewDatabase();
}
async function removeSubDeptAdmin(dept, sd){
  const affected = crewDB.filter(c=>c.department===dept && c.subDepartment===sd).length;
  if(!confirm(`Remove "${sd}"${affected?` — ${affected} crew member(s) will have their sub-department cleared`:''}?`)) return;
  SUBDEPARTMENTS_BY_DEPT[dept] = (SUBDEPARTMENTS_BY_DEPT[dept]||[]).filter(x=>x!==sd);
  crewDB.forEach(c=>{ if(c.department===dept && c.subDepartment===sd) c.subDepartment = ''; });
  await saveDB('db:subdepartments', SUBDEPARTMENTS_BY_DEPT);
  await saveDB('db:crew', crewDB);
  refreshCrewDatabase();
}
async function toggleHoD(crewId){
  const c = crewById(crewId); if(!c) return;
  c.isHoD = !c.isHoD;
  await saveDB('db:crew', crewDB);
  refreshCrewDatabase();
}

function sortCrewDbGroup(list){

function renderCrewList(){
  const q = (val('crewSearch')||crewSearchQuery||'').toLowerCase();
  const list = document.getElementById('crewList'); if(!list) return;
  let filtered = crewDB.filter(c => !q || crewSearchBlob(c).includes(q));
  filtered = filtered.filter(personMatchesCrewDbFilter);
  if(!filtered.length){ list.innerHTML = '<div class="empty-note">No crew found.</div>'; return; }
  // group by department; unknown/blank departments fall under "Other"
  const buckets = {};
  filtered.forEach(c=>{ const key = deptBucketKey(c.department); (buckets[key]=buckets[key]||[]).push(c); });
  Object.keys(buckets).forEach(d=>{ buckets[d] = sortCrewDbGroup(buckets[d]); });

  const deptsCSV = deptsPresent.join(',');
  const toggleRow = deptsPresent.length>1 ? expandCollapseAllHTML(`toggleAllCrewDbDepts('${deptsCSV}')`, undefined, deptsPresent.every(d=>collapsedDepts.has(d)), 'depts') : '';

      + `<div class="dept-group" style="display:${collapsed?'none':'block'}">${buckets[d].map(crewCardHTML).join('')}</div>`;

async function saveCrew(){
  const name = val('ncName'); if(!name){ alert('Name is required'); return; }
  const id = val('crewEditId');
  const existing = crewById(id);
  if(!existing && !pendingNewCrewRole){ alert('Pick a role — every crew member needs at least one saved role.'); return; }
  /* Duplicate-name warning (Phase BG) — a WARNING, not a block. Two different people
     genuinely can share a name, so this asks rather than forbids.

     Covers records created or renamed BY HAND, which is the path that actually passes
     through this function. The "Use as template" flow does not reach here at all —
     duplicateCrew() writes straight to db:crew — so it carries its own confirm step in
     useCrewAsTemplate(). Two entry points, two guards, on purpose.

     Match is on the NAME ALONE, normalised (trimmed, case-insensitive) — never name +
     role. Under BF one record will hold several saved roles, so one person with two
     roles is one CORRECT record; two records sharing a name are wrong whatever roles
     they carry. Building role into the comparison would break the moment BF lands.

     ⚠️ Exact-string matching is weak against years of hand entry. Normalising catches
     trailing spaces and casing; it will NOT catch "M. Marshall" vs "Marshall, M" vs
     "Mike Marshall". This is a guard on new entry, not a duplicate finder — it makes no
     claim to be exhaustive, and it says nothing about the pairs already in the database.
     Reconciling those is BF's job.

     Only fires when the name is actually new or changed, so re-saving an unchanged
     record never nags. Nothing has been mutated at this point — returning is clean. */
  const normName = s => (s||'').trim().toLowerCase();
  if(!existing || normName(existing.name)!==normName(name)){
    const clashes = crewDB.filter(x => x.id!==id && normName(x.name)===normName(name));
    if(clashes.length){
      const detail = clashes.map(x=>[x.role, x.department].filter(Boolean).join(', ')).filter(Boolean);
      const msg = [
        clashes.length>1
          ? `There are already ${clashes.length} crew records called "${name}".`
          : `There's already a crew record called "${name}".`,
        detail.length ? `Existing: ${detail.join(' · ')}` : null,
        '',
        "Two different people can share a name — if that's the case here, carry on. If it's the same person, cancel and edit the existing record instead.",
        '',
        'Save anyway?'
      ].filter(x=>x!==null).join('\n');
      if(!confirm(msg)) return;
    }
  }
  const rec = { id: id||uid(), name,
    subDepartment: val('ncSubDept'), showAs: val('ncShowAs'), coProductionCompany: val('ncCoPro'),
    phone: val('ncPhone'), email: val('ncEmail'),
    skills: val('ncSkills'),
    camera1: val('ncCam1'), camera2: val('ncCam2'), camera3: val('ncCam3'), cameraExtras: val('ncCamExtras'),
    dietaryGeneral: val('ncDietaryGeneral'), dietarySpecific: val('ncDietarySpecific'), shoeSize: val('ncShoe'), clothingSize: val('ncClothing'),
    vatRegistered: val('ncVat'), drives: val('ncDrives'), carMakeModel: val('ncCarModel'), carReg: val('ncCarReg'),
    homeAddress: val('ncAddress'),
    generalNotes: val('ncGeneralNotes'), previousProjects: val('ncPrevProjects'),
    instagram: val('ncInstagram'), youtube: val('ncYouTube'), linkedin: val('ncLinkedIn'), coffeeOrder: val('ncCoffeeOrder'),
    rate: val('ncRate'), notes: val('ncNotes') };
  if(!existing){
    // brand-new crew: the picked role is the only source of role + department
    rec.roles = [pendingNewCrewRole];
    rec.role = pendingNewCrewRole.split('/').slice(1).join('/');
    rec.department = departmentForRolePath(pendingNewCrewRole);
  }
  const merged = Object.assign({}, existing||{}, rec);
  const idx = crewDB.findIndex(x=>x.id===merged.id);
  if(idx>=0) crewDB[idx]=merged; else crewDB.push(merged);
  await saveDB('db:crew', crewDB);
  // if this was a brand-new person added from inside a project, put them on that project straight away
  if(!existing && route.screen==='project' && currentProjectId){
    const p = currentProject();
    if(p){ addCrewEntry(p, merged.id); await saveDB('db:projects', projectsDB); }
  }
  pendingNewCrewRole = '';
  editingCrewId = null; addingCrewNew = false;
  refreshCrewScreen();
}
async function deleteCrew(id){
  if(!confirm('Delete this crew member from the database?')) return;
  const who = (crewById(id)||{}).name || 'crew member';
  const snaps = beginUndo(['db:crew','db:projects']);
  crewDB = crewDB.filter(x=>x.id!==id);
  /* ⚠️ Drops the roster ENTRIES only, and deliberately leaves their shoot-day positions
     behind — because that is exactly what this did before BF, when it filtered p.crewIds
     and touched nothing else. A position whose id no longer resolves has always rendered
     as "(removed crew)" via crewInfo()/resolveCrewForDay(), and it still does; the id in
     it is now an entry id rather than a crew id, which changes nothing about the output.
     Cleaning those up would be a real improvement and a real behaviour change, so it is
     not BF's to make. Contrast removeCrewFromProject()/bulkRemoveSelectedFromProject(),
     which have always cleared positions and so go through removeCrewEntries(). */
  projectsDB.forEach(p=>{
    const gone = new Set(entriesForCrew(id, p).map(e=>e.id));
    if(!gone.size) return;
    p.crewEntries = (p.crewEntries||[]).filter(e=>!gone.has(e.id));
    /* Phase BD — this is the THIRD path that drops entries from a project, and the one
       that does not go through removeCrewEntries(). Its pre-production records are
       pruned here for the same reason theirs are: p.prepSchedule is keyed by entry id
       and nothing else would ever clear it. This is not the same decision as the
       shoot-day positions left dangling above — those render as "(removed crew)" and
       have always been visible; an orphaned prep record is invisible and would simply
       accumulate in the project row forever. Undo is unaffected: prep data lives in
       db:projects, which beginUndo() already snapshots on this path. */
    prunePrepSchedule(p, gone);
  });
  await saveDB('db:crew', crewDB); await saveDB('db:projects', projectsDB);
  renderCrewList();
  finishUndo(`Deleted ${who} from the crew database.`, snaps);
}

function pickAddress(i){

function updateMapPreview(){

  if(locFormState.lat==null){ el.innerHTML=''; return; }
  const d=0.01, bbox=[locFormState.lon-d,locFormState.lat-d,locFormState.lon+d,locFormState.lat+d].join(',');
  el.innerHTML=`<iframe class="mapembed" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${locFormState.lat},${locFormState.lon}&layer=mapnik"></iframe>`;

function haversine(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ---- nearest-amenity lookup (OpenStreetMap Overpass) ----
   Hospitals and parking are the same query with a different amenity tag and search
   radii — parking is far denser than hospitals, so it starts much tighter (1km) or
   the nearest result is just noise. Radii are tried in order, widening only if the
   tighter one found nothing. */
const AMENITY_SEARCH = {
  hospital: { tag:'hospital', radii:[10000,25000], noun:'hospital', unnamed:'Unnamed hospital', stateKey:'hospital', elId:'nlHospitalInfo' },
  parking:  { tag:'parking',  radii:[1000,3000,8000], noun:'parking', unnamed:'Unnamed parking', stateKey:'parking', elId:'nlParkingInfo' },
};
/* formats a {name, address, distanceKm} amenity as one display line — used by the
   location form, the shoot day form, and anywhere else one is shown */
function amenityLine(a, missingAddr){
  return a ? `${a.name} — ${a.address||(missingAddr||'')} (~${a.distanceKm}km)` : '';
}
async function findNearestAmenity(kind, lat, lon){
  const cfg = AMENITY_SEARCH[kind];
  for(const r of cfg.radii){
    const query=`[out:json][timeout:20];node["amenity"="${cfg.tag}"](around:${r},${lat},${lon});out;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    const data=await res.json();
    if(data.elements && data.elements.length){
      let best=null,bestD=Infinity;
      data.elements.forEach(el=>{ const dist=haversine(lat,lon,el.lat,el.lon); if(dist<bestD){bestD=dist;best=el;} });
      const t=best.tags||{};
      const addr=[t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:postcode']].filter(Boolean).join(', ');
      return { name:t.name||cfg.unnamed, address:addr, phone:t.phone||t['contact:phone']||'', distanceKm:bestD.toFixed(1) };
    }
  }
  return null;
}
/* the "Find nearest…" buttons on the location form — same flow for both kinds */
async function lookupAmenityForForm(kind){
  const cfg = AMENITY_SEARCH[kind];
  const infoEl=document.getElementById(cfg.elId); if(!infoEl) return;
  if(locFormState.lat==null){ alert('Search and pick an address first so we have coordinates to search from.'); return; }
  infoEl.textContent=`Searching nearby ${cfg.noun}…`;
  try{
    const found = await findNearestAmenity(kind, locFormState.lat, locFormState.lon);
    if(!found){ infoEl.textContent=`No ${cfg.noun} found nearby.`; return; }
    locFormState[cfg.stateKey]=found;
    infoEl.textContent=amenityLine(found, 'address not tagged');
  }catch(e){ infoEl.textContent='Lookup failed — check your connection.'; }
}

/* ---------- schedule time/duration helpers ---------- */
function parseTimeStrToMins(s){
  const m = (s||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function parseTimeRangeToMins(s){
  const parts = (s||'').split('-');
  if(parts.length!==2) return null;
  const start = parseTimeStrToMins(parts[0]), end = parseTimeStrToMins(parts[1]);
  if(start==null||end==null) return null;
  return {start,end};
}
function parseDurationToMins(s){
  if(!s) return null;
  s = s.trim();
  const full = s.match(/^(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?\s+(\d+)$/i);
  if(full) return Math.round(parseFloat(full[1])*60) + parseInt(full[2],10);
  let mins=0, matched=false;
  const hrM = s.match(/(\d+(?:\.\d+)?)\s*h/i);
  if(hrM){ mins += Math.round(parseFloat(hrM[1])*60); matched=true; }
  const minM = s.match(/(\d+)\s*m/i);
  if(minM){ mins += parseInt(minM[1],10); matched=true; }
  if(!matched){
    const bareNum = s.match(/^(\d+)$/);
    if(bareNum) return parseInt(bareNum[1],10);
    return null;
  }
  return mins;
}
function formatMinsAsDuration(mins){
  if(mins==null) return '';
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return `${h}hr${h>1?'s':''} ${m}min`;
  if(h) return `${h}hr${h>1?'s':''}`;
  return `${m}min`;
}
function formatMinsAsTime(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function onScheduleTimeInput(input){
  const range = parseTimeRangeToMins(input.value);
  if(!range) return;
  const durInput = input.closest('.row').querySelector('.sc-dur');
  if(durInput) durInput.value = formatMinsAsDuration(range.end - range.start >= 0 ? range.end-range.start : range.end-range.start+1440);
}
function onScheduleDurationInput(input){
  const row = input.closest('.row');
  const timeInput = row.querySelector('.sc-time');
  if(!timeInput || (timeInput.value||'').includes('-')) return; // don't override an existing range
  const start = parseTimeStrToMins(timeInput.value);
  if(start==null) return;
  const durMins = parseDurationToMins(input.value);
  if(durMins==null) return;
  timeInput.value = formatMinsAsTime(start) + ' - ' + formatMinsAsTime(start+durMins);
}
function moveSchedRow(btn, dir){
