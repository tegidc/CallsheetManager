     membership), so narrowing on either screen narrows both.
     ⚠️ IT MOVES MONEY. Excluding someone on the Crew tab takes their cost out of every
     Budget figure — that is the point, but it means the grand total now depends on a
     control that lives on another tab. The filter row says what is in scope. */
  const crewInScope = crew.filter(personMatchesProjectFilter);
  /* ⚠️ Phase BF — travel is charged ONCE PER PERSON, not once per entry, and over the
     DEDUPLICATED union of that person's days. Attributing it to whichever of their
     entries is in scope first keeps AO's reconciliation exact in both directions:
     summed over rows it still equals buildTransportSummary()'s travelTotal, and summed
     over days (see firstEntryOnDay in perDay below) it still equals each person's own
     figure. Charging it per entry would double a two-role person's travel AND the VAT
     on it, since AO's VAT base is (day rate + travel). */
  /* Phase BS — the scopes, three of them since BT. `prodOn` gates every figure that
     belongs to the shoot (day rate × days on site, and the catering/travel/hotel/
     location extras below); `prepOn` gates prep days and `postOn` edit days, each ×
     the same entry rate. Written as 1/0 factors rather than sprinkled `if`s so a scope
     can never be applied in one place and forgotten in another — every production
     figure in this function is multiplied by prodOn exactly once. */
  const prodOn = budgetScope.production ? 1 : 0;
  const prepOn = budgetScope.preproduction ? 1 : 0;
  const postOn = budgetScope.post ? 1 : 0;
  const travelClaimed = new Set();
  /* the same once-per-person rule travelClaimed enforces, for the two other person-level
     costs (a bed and a lunch belong to a human, not to each role they are booked as) */
  const personCostClaimed = new Set();
  const cateringCosts = getCateringCosts(p);
  const people = crewInScope.map(c=>{
    const {rate, hasRate, isOverride, kit} = resolveEntryRate(c.id, p);
    /* ⚠️ Off the shoot = no shoot days costed, however many are still TICKED. The ticks
       are kept exactly as they were (see toggleEntryOnShoot); this only stops them being
       counted, so switching back on restores the identical figure. Prep and Post are not
       shoot facts and are deliberately untouched — someone can be cut from the shoot and
       still be booked for the edit. */
    const onShoot = entryOnShoot(c.id, p);
    const daysWorked = onShoot ? entryDayCount(c.id, days) : 0;
    /* Prep and edit days are per ENTRY, like the rate and the days worked — both stores
       are keyed by entry id (see phaseDaysOf). ⚠️ NEITHER is filtered by the day filter:
       a prep day and an edit day are not shoot days and can't be attributed to one, so
       filtering to "Day 2" leaves both whole. Their own toggles are how you take them
       out.
       ⚠️ Phase BU — GATED ON MEMBERSHIP, exactly as daysWorked is gated on onShoot above,
       and for the same reason: taking somebody out of prep or out of the edit has to stop
       the money as well as hide the row. Their booked number is kept untouched (see
       CREW_PHASES), so ticking them back restores the identical figure — but a phase costed
       off the stored number alone would keep billing someone you had cut from the job. */
    const prepDays = entryInPhase('preproduction', c.id, p) ? (prepDaysOf(c.id, p) || 0) : 0;
    const postDays = entryInPhase('post', c.id, p) ? (postDaysOf(c.id, p) || 0) : 0;
    /* ---- BUYOUT ----
       A buyout is one agreed fee for the whole job, not a day rate. With it on, `rate` IS
       the total and the day counts stop multiplying — they only decide how that fee is
       APPORTIONED across the three phases, so Per Day, the phase stack and Per Department
       all still have something honest to show. £5,000 over 5 prep / 10 shoot / 5 post is
       £1,250 / £2,500 / £1,250, and sums back to £5,000 — never £100,000.
       ⚠️ A buyout with NO days recorded lands entirely on Production. The fee exists
       whether or not anyone has filled the days in, and the shoot is the phase it
       belongs to by default; dropping it because a field is blank would silently lose
       real money from the total.
       ⚠️ Switching a scope off still removes that phase's share, exactly as it does for a
       day rate — the scopes mean "don't cost this phase", and a buyout is not exempt.
       ⚠️ RAW = "what this would be if its scope were on". The scoped figures collapse to
       0 when a phase is off, which is right for a total and useless for the scope stack,
       which has to keep showing what switching it back on would add. */
    const ent = entryById(c.id, p);
    const isBuyout = !!(ent && ent.buyout);
    const totalPhaseDays = daysWorked + prepDays + postDays;
    const share = n => totalPhaseDays ? rate * (n / totalPhaseDays) : 0;
    /* ---- OVERTIME (Phase BY) — units × the day rate, on the PRODUCTION side ----
       A unit is a day-equivalent, so the cost is simply rate × units and it lands on the shoot:
       there is no prep or edit overtime column, and prodOn is what gates it.
       ⚠️ NOT COSTED ON A BUYOUT. A buyout has no day rate — `rate` IS the whole agreed fee, so
       "units × the day rate" has nothing to multiply. Deriving a day-equivalent from the fee
       (fee ÷ days) would make the total exceed the one agreed number, which is the single thing
       a buyout means. The units stay visible in the column; they just don't multiply.
       ⚠️ NOT COSTED WITH NO SHOOT DAYS either, and this one is load-bearing rather than
       philosophical: Per Day spreads a person's production money across the days they work, so
       money belonging to somebody with zero days has no row to sit on and would break
       `perDay + prep + post === totalExVat` — the exact invariant Phase BU had to repair. And
       overtime on a shoot you are not on is not a real fact anyway. */
    const otUnits = entryOvertime(c.id, p) || 0;
    const otRaw = (!isBuyout && daysWorked > 0) ? rate * otUnits : 0;
    const prodRaw = (isBuyout ? (totalPhaseDays ? share(daysWorked) : rate) : rate * daysWorked) + otRaw;
    const prepRaw = isBuyout ? share(prepDays) : rate * prepDays;
    const postRaw = isBuyout ? share(postDays) : rate * postDays;
    const prodSubtotal = prodRaw * prodOn;
    const prepSubtotal = prepRaw * prepOn;
    const postSubtotal = postRaw * postOn;
    const subtotal = prodSubtotal + prepSubtotal + postSubtotal;
    /* The kit/labour split of THIS person's subtotal. Same day count the subtotal is
       built from — scopes already applied — so kitSubtotal + labourSubtotal === subtotal
       exactly, for any combination of scopes. labour is the REMAINDER rather than
       labourOf() × days, so a rounding difference can never leave the two halves
       failing to add up to the whole they are a split of.
       kit is null for anyone with no split: not zero, because "no kit in this rate" and
       "£0 of kit" print differently (a dash, not a figure). */
    /* ---- Est. Costs: what this person costs the production BESIDE their fee ----
       Their hotel nights, their travel, and their meals. ⚠️ DELIBERATELY NOT added to
       subtotal, display, VAT or any total: those figures are already counted once each
       in the Catering / Travel / Hotels extras rows of Per Department, and adding them
       per person as well would double the whole lot. This column is a look, not a sum.
       ⚠️ Hotel and meals are PERSON-level (keyed by crewId) while a row is an ENTRY, so
       a two-role person would otherwise be charged twice for one bed and one lunch —
       the first entry claims them, exactly as travel already does. */
    const claimsPerson = crewOnShoot(c.crewId, p) && !personCostClaimed.has(c.crewId);
    if(claimsPerson) personCostClaimed.add(c.crewId);
    const hotelNights = claimsPerson
      ? ((p.hotelNightBefore||[]).includes(c.crewId) ? 1 : 0)
        + days.filter(d=>(d.hotelNights||[]).includes(c.crewId)).length
      : 0;
    const hotelCost = hotelNights * hotelCosts.perRoomNight * prodOn;
    const mealCost = claimsPerson ? days.reduce((sum,d)=>{
      const m = (d.cateringMeals||{})[c.crewId];
      if(!m) return sum;
      return sum + (m.b?cateringCosts.b:0) + (m.l?cateringCosts.l:0) + (m.d?cateringCosts.d:0);
    }, 0) * prodOn : 0;
    const paidDays = daysWorked*prodOn + prepDays*prepOn + postDays*postOn;
    /* ⚠️ A buyout's kit is a share of the FEE, not kit × days — the same reasoning as the
       phase split above. Proportion the kit the same way the rate was agreed. */
    const kitSubtotal = kit==null ? null
      : isBuyout ? (rate ? subtotal * (Math.min(kit, rate) / rate) : 0)
                 : Math.min(kit, rate) * paidDays;
    const labourSubtotal = kit!=null ? subtotal - kitSubtotal : null;
    const claimsTravel = crewOnShoot(c.crewId, p) && !travelClaimed.has(c.crewId);
    if(claimsTravel) travelClaimed.add(c.crewId);
    const travelRateRaw = claimsTravel ? travelRateFor(c.crewId) : 0;
    const travelCostRaw = travelRateRaw * crewDayCount(c.crewId, days, p);
    const travelRate = travelRateRaw * prodOn;
    const travelCost = travelRate * crewDayCount(c.crewId, days, p);
    const vatRegistered = c.vatRegistered==='Yes';
    /* AO — the VAT base is day rate AND travel, both invoiced by this person.
       travelCost itself is NOT added to `subtotal`/`display`: it's already counted
       once in the Travel extras row, and counting it here too would double it.
       ⚠️ Phase BS splits the VAT along the same seam as the money (Phase BT makes that
       three ways, not two), because the parts reconcile against different things:
       prodVat has to sum back to the Per Day view's VAT column (neither prep nor the
       edit has a shoot day to land on), prepVat to the Pre-production block and postVat
       to the Post block that view carries. pp.vat is still their sum, so every
       project-wide figure is unchanged when all three scopes are on. */
    const prodVat = vatRegistered ? (prodSubtotal + travelCost) * VAT_RATE : 0;
    const prepVat = vatRegistered ? prepSubtotal * VAT_RATE : 0;
    const postVat = vatRegistered ? postSubtotal * VAT_RATE : 0;
    const vat = prodVat + prepVat + postVat;
    return {
      id:c.id, crewId:c.crewId, name:c.name, role:c.showAs||c.role, department:deptBucketKey(c.department),
      rate, hasRate, isOverride, kit, kitSubtotal, labourSubtotal,
      hotelCost, mealCost, estCosts: hotelCost + mealCost + travelCost,
      isBuyout, prodRaw, prepRaw, postRaw, travelCostRaw,
      /* otUnits is what was typed; otRaw is what it costs (0 on a buyout or with no shoot
         days — see above); otSubtotal is that gated by Production, and is ALREADY inside
         prodSubtotal → subtotal → every total. Carried separately so a screen can say how much
         of a fee is overtime, never as a second thing to add on. */
      otUnits, otRaw, otSubtotal: otRaw * prodOn,
      prodVatRaw: vatRegistered ? (prodRaw + travelCostRaw) * VAT_RATE : 0,
      prepVatRaw: vatRegistered ? prepRaw * VAT_RATE : 0,
      postVatRaw: vatRegistered ? postRaw * VAT_RATE : 0,
      daysWorked, prepDays, postDays,
      subtotal, prodSubtotal, prepSubtotal, postSubtotal,
      travelRate, travelCost, vatRegistered, vat, prodVat, prepVat, postVat,
      display: budgetPersonDisplay(subtotal, vat)
    };
  });

  // Filtered by PRESENCE (deptCounts), not by a truthy total — a department
  // with people assigned but no rate set should show as £0.00, not vanish, or
  // a whole department missing its rates would go unnoticed on a cost screen.
  /* AO — each department also carries a REAL VAT breakdown, summed from the actual
     mix of registered and unregistered people in it, never a flat 20% of the
     department total: a department with one registered person out of six shows only
     that one person's VAT. exVat is the department's own crew cost; vat is all VAT
     its people charge (day rate + their travel — see travelRateFor above), which is
     why vat is NOT 20% of exVat for anyone with travel. Summed across departments
     these give back exactly crewTotalExVat / vatTotal. */
  const deptTotals = {}, deptCounts = {}, deptExVat = {}, deptVat = {};
  people.forEach(pp=>{
    deptTotals[pp.department] = (deptTotals[pp.department]||0) + pp.display;
    deptCounts[pp.department] = (deptCounts[pp.department]||0) + 1;
    deptExVat[pp.department] = (deptExVat[pp.department]||0) + pp.subtotal;
    deptVat[pp.department]   = (deptVat[pp.department]||0) + pp.vat;
  });
  const departments = DEPARTMENTS.filter(d=>deptCounts[d]).map(d=>
    ({dept:d, code:DEPARTMENT_CODES[d]||'', total:deptTotals[d]||0,
      exVat:deptExVat[d]||0, vat:deptVat[d]||0, incVat:(deptExVat[d]||0)+(deptVat[d]||0)}));

  /* Phase BS — the SAME department roll-up again, over ONE phase's money. Not a second
     source of truth: it reads pp.prepSubtotal/pp.prepVat (and since Phase BT
     pp.postSubtotal/pp.postVat), the same per-person figures already folded into
     `departments` above. It exists because Per Day needs somewhere honest to put a
     phase that has no shoot day to sit on, and because Per Department's hint has to be
     able to say how much of the total is prep and how much is the edit.
     ⚠️ Phase BT made it a FUNCTION taking the three per-person keys, rather than the
     second hand-written copy Post would otherwise have been — the two slices are the
     same arithmetic and have to stay that way. */
  const buildPhaseSlice = ({label, noteName, dayNoun, subKey, vatKey, daysKey, on}) => {
    const ex = {}, vt = {}, counts = {};
    people.forEach(pp=>{
      if(!pp[subKey] && !pp[daysKey]) return;
      ex[pp.department]     = (ex[pp.department]||0) + pp[subKey];
      vt[pp.department]     = (vt[pp.department]||0) + pp[vatKey];
      counts[pp.department] = (counts[pp.department]||0) + 1;
    });
    const exVat = people.reduce((s,pp)=>s+pp[subKey], 0);
    const vat   = people.reduce((s,pp)=>s+pp[vatKey], 0);
    return {
      // label — the block heading and the export row. noteName — how the phase is named
      // mid-sentence in a hint. dayNoun — how its days are named. All three so the prose
      // reads as English rather than as a label dropped into a template.
      label, noteName, dayNoun, on: !!on,
      departments: DEPARTMENTS.filter(d=>counts[d]).map(d=>
        ({dept:d, code:DEPARTMENT_CODES[d]||'', exVat:ex[d]||0, vat:vt[d]||0,
          incVat:(ex[d]||0)+(vt[d]||0), total: budgetPersonDisplay(ex[d]||0, vt[d]||0)})),
      exVat, vat, incVat: exVat + vat,
      daysTotal: people.reduce((s,pp)=>s+(pp[daysKey]||0), 0),
      peopleCount: people.filter(pp=>pp[daysKey]>0).length
    };
  };
  const prep = buildPhaseSlice({label:'Pre-production', noteName:'pre-production', dayNoun:'Prep days',
    subKey:'prepSubtotal', vatKey:'prepVat', daysKey:'prepDays', on:prepOn});
  const post = buildPhaseSlice({label:'Post', noteName:'the edit', dayNoun:'Edit days',
    subKey:'postSubtotal', vatKey:'postVat', daysKey:'postDays', on:postOn});

  /* R2 — location fees. A fee is entered once on the location record, then spread
     evenly across the shoot days that location is actually used on, so Per Day and
     the day filter stay honest rather than a lump landing arbitrarily on Day 1.
     A location used on 3 days at £900 contributes £300 to each of them; filter to
     one of those days and you see £300, not £900 and not nothing.
     Days are counted across the WHOLE project, not just the days in scope — the
     per-day share is a property of the deal, and mustn't change size depending on
     what the filter happens to be showing. A location with no day assigned can't be
     apportioned, so it's charged whole (better visible than silently dropped).
     Uses parseRateNumber(), the same free-text reader as the crew rate field. */
  const usesLocation = (d, locId) => d.locationId===locId
    || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId);
  /* ⚠️ Phase CO — THIS NOW READS resolveLocationCost(), which knows about buyout / per day /
     hourly. It used to assume every venue was a buyout (one fee, split across the days used).
     That case is unchanged and is still the default; the other two are new. ⚠️ EXTRAS ARE NOT
     IN HERE — they are charged once, project-wide, and apportioning them per day would
     multiply them by the days used. See locationExtrasTotal below. */
  const locationFeeForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    if(!locById(locId)) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    /* null means a booked location ticked on no day at all — its fee is real but belongs to no
       day, so it is charged once, project-wide only, exactly as it always was */
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate : 0);
    return sum + fee;
  }, 0);
  /* one labelled charge at a time — cleaning, an overrun, a breakage — summed once for the
     project. Deliberately outside the per-day arithmetic above. */
  const locationExtrasTotal = (p.locationIds||[])
    .reduce((sum, locId)=> sum + resolveLocationCost(locId, p).extrasTotal, 0);
  /* ⚠️ Phase CP — LOCATION VAT, and it does NOT contradict the AO note further down. That note
     says catering/hotel/locations carry no PER-PERSON VAT, because no crew member invoices them
     — which is true and still true. What was missing was the venue's own VAT status, and a
     VAT-registered studio charges VAT on its own bill. `vatRegistered` on the location record
     (project-overridable like the rest) supplies the party the note said did not exist.
     ⚠️ Applies to the FEE and the EXTRAS alike — it is all one invoice from the venue. */
  const locVatRate = locId => resolveLocationCost(locId, p).vat==='Yes' ? VAT_RATE : 0;
  const locationVatForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    const r = locVatRate(locId); if(!r) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate * r : 0);
    return sum + fee * r;
  }, 0);
  const locationExtrasVat = (p.locationIds||[]).reduce((sum, locId)=>
    sum + resolveLocationCost(locId, p).extrasTotal * locVatRate(locId), 0);
  // Phase BS — every extra below belongs to the shoot, so they all follow prodOn.
  const locationRaw = locationFeeForDays(days) + locationExtrasTotal;
  const locationTotal = locationRaw * prodOn;
  /* follows prodOn exactly as the fee it is charged on does */
  const locationVatTotal = (locationVatForDays(days) + locationExtrasVat) * prodOn;

  const cateringGrid = buildCateringSummaryGrid();
  const transportSummary = buildTransportSummary();
  // Both grids are the Catering/Travel tabs' OWN summaries, always built for the
  // whole shoot, so their .totalCost is project-wide by definition. Sum their
  // per-day columns against the days actually in scope instead — with no day
  // filter set that's every column, i.e. the same number .totalCost gave.
  /* G15 — scoped and joined on d.id, the stable day identity every other screen in
     the app already uses. This was dayNum: free text the user types, non-unique,
     routinely blank ('?' is an expected display state) and mixed-type across
     records. Two days sharing a dayNum — or two both blank, which is easier to
     reach — made .find() return the first for both, putting one day's catering and
     travel cost on another day's row, and a day filter picking one of them silently
     pulled in the other's cost. Not a crash: a wrong number in a budget. Every
     reconciliation invariant would still have appeared to hold, because both sides
     read the same wrong figure. */
  const dayIdsInScope = new Set(days.map(d=>d.id));
  const sumDailyCost = g => g ? g.cols.filter(c=>dayIdsInScope.has(c.dayId))
                                      .reduce((s,c)=>s+c.dailyCost, 0) : 0;
  const cateringRaw = sumDailyCost(cateringGrid);
  const travelRaw = sumDailyCost(transportSummary);
  const cateringTotal = cateringRaw * prodOn;
  const travelTotal = travelRaw * prodOn;
  // Room-nights counted directly off the day records rather than via
  // buildHotelSummary(), which filters down to "active" nights only and would
  // need label-matching to recover one specific day's figure — this way, the
  // project-wide and per-day totals below share the exact same calculation.
  // The night before Day 1 is only a cost if Day 1 itself is in scope. projectDays()
  // is day-ordered and `days` preserves that order, so when Day 1 IS in scope it's
  // still days[0] — which keeps the `i===0` fold-in below correct either way.
  const firstProjectDay = projectDays()[0];
  const preNightRooms = (firstProjectDay && days.some(d=>d.id===firstProjectDay.id))
    ? (p.hotelNightBefore||[]).filter(id=>crewOnShoot(id, p)).length : 0;
  const onShootRooms = list => (list||[]).filter(id=>crewOnShoot(id, p)).length;
  const dayHotelRooms = days.map(d=>onShootRooms(d.hotelNights));
  const hotelRaw = (preNightRooms + dayHotelRooms.reduce((s,n)=>s+n,0)) * hotelCosts.perRoomNight;
  const hotelTotal = hotelRaw * prodOn;

  /* ⚠️ AO — Catering, Hotel and Locations carry NO per-person VAT, and that is
     DELIBERATE, not an oversight: they are paid direct to a supplier (caterer,
     hotel, location owner), not invoiced back through a crew member, so there is no
     person whose vatRegistered status could attach to them. Travel is the exception
     precisely because it IS charged back through the crew member. Do not "fix" this
     by adding VAT to them. */
  const crewTotalExVat = people.reduce((s,pp)=>s+pp.subtotal, 0);
  /* ⚠️ locationVatTotal is the ONE non-person VAT in here (Phase CP) — see its note above. It
     has to be in this sum or `ex + vat === inc` stops holding the moment a venue charges VAT. */
  const vatTotal = people.reduce((s,pp)=>s+pp.vat, 0) + locationVatTotal;
  const extrasTotal = cateringTotal + travelTotal + hotelTotal + locationTotal;
  const totalExVat = crewTotalExVat + extrasTotal;
  const totalIncVat = totalExVat + vatTotal;

  const perDay = days.map((d,i)=>{
    const onDayIds = new Set((d.positions||[]).map(pos=>pos[0]));
    const dayPeople = people.filter(pp=>onDayIds.has(pp.id));
    /* Phase BF — a person on this day via two entries must carry their travel (and its
       VAT) ONCE. The first of their entries on this day claims it; the rest score zero.
       That is what keeps the per-day VAT column summing back to the per-person one. */
    const travelClaimedToday = new Set();
    const dayTravelRate = pp => {
      if(travelClaimedToday.has(pp.crewId)) return 0;
      travelClaimedToday.add(pp.crewId);
      return travelRateFor(pp.crewId) * prodOn;
    };
    const dayDeptTotals = {}, dayDeptCounts = {}, dayDeptExVat = {}, dayDeptVat = {};
    dayPeople.forEach(pp=>{
      /* AO — one day's share of this person's VAT base: their day rate plus that
         day's travel (travelRate is per on-site day by construction). Summed over
         every day they work this gives back pp.prodVat exactly.
         ⚠️ Phase BS — pp.prodVat, not pp.vat: a shoot day carries no share of prep,
         so prep's VAT lives in the Pre-production block instead. `dayRate` follows
         prodOn for the same reason every other production figure does.
         ⚠️ BUG FIX (Phase BU) — this was `pp.rate * prodOn`, which is wrong for a BUYOUT:
         a buyout's `rate` IS the whole agreed fee, not a per-day figure, so multiplying it
         by each shoot day billed it once per day. On the live ROW 2026 data that overstated
         Per Day by £24,000 — Brian De Carvalho's £5,000 buyout read as £25,000 across five
         days, Angel Leatherwood's £1,000 as £5,000 — and broke the invariant this view
         exists to keep: perDay + prep + post === totalExVat. Everywhere else already got
         this right (`prodRaw` apportions the fee across the phases via share()), so Per Day
         and Per Person disagreed about the same person while every other check passed.
         PRE-EXISTING, not introduced here; found because Roles now reads these same figures.
         The per-day amount is that person's PRODUCTION share spread over the shoot days they
         actually work, which sums back to prodSubtotal exactly.
         ⚠️ KNOWN REMAINING GAP: a buyout with a fee but NO shoot-day position has production
         money and no day row to carry it (buildBudgetData deliberately lands the whole fee
         on Production in that case). `daysWorked` is 0, so this returns 0 and Per Day comes
         up short by the fee — the same shape of problem prep and post solve with their own
         always-open blocks outside the day rows. No such record exists in either project
         today. Closing it properly means a third block, which is a deliberate decision, not
         a line to slip into a bug fix. */
      /* ⚠️ ONE expression for both, and Phase BY needed it to be: a person's production money
         spread over the shoot days they actually work. For a day rate that is
         (rate × days + overtime) ÷ days — i.e. the rate plus that day's share of the OT — and
         for a buyout it is the apportioned fee ÷ days. Written as `pp.rate` for the non-buyout
         case it silently dropped the overtime, which is what would have broken
         `perDay + prep + post === totalExVat` all over again.
         ⚠️ prodRaw, not prodSubtotal: the `* prodOn` is applied here, once, like every other
         production figure in this function. */
      const perDayShare = pp.daysWorked ? pp.prodRaw / pp.daysWorked : 0;
      const dayRate = perDayShare * prodOn;
      const dayVat = pp.vatRegistered ? (dayRate + dayTravelRate(pp))*VAT_RATE : 0;
      dayDeptTotals[pp.department] = (dayDeptTotals[pp.department]||0) + budgetPersonDisplay(dayRate, dayVat);
      dayDeptCounts[pp.department] = (dayDeptCounts[pp.department]||0) + 1;
      dayDeptExVat[pp.department] = (dayDeptExVat[pp.department]||0) + dayRate;
      dayDeptVat[pp.department]   = (dayDeptVat[pp.department]||0) + dayVat;
    });
    const dayDepartments = DEPARTMENTS.filter(dd=>dayDeptCounts[dd]).map(dd=>
      ({dept:dd, code:DEPARTMENT_CODES[dd]||'', total:dayDeptTotals[dd]||0,
        exVat:dayDeptExVat[dd]||0, vat:dayDeptVat[dd]||0, incVat:(dayDeptExVat[dd]||0)+(dayDeptVat[dd]||0)}));
    const cateringCol = cateringGrid ? cateringGrid.cols.find(c=>c.dayId===d.id) : null;
    const travelCol = transportSummary ? transportSummary.cols.find(c=>c.dayId===d.id) : null;
    // Phase BS — each of these is the per-day half of a project-wide extra that
    // already follows prodOn above; gate them here too or Per Day keeps showing
    // catering/travel/hotel/location after Production has been switched off.
    const dayCatering = (cateringCol ? cateringCol.dailyCost : 0) * prodOn;
    const dayTravel = (travelCol ? travelCol.dailyCost : 0) * prodOn;
    // the night before Day 1 has no shoot-day row of its own — folds into Day 1
    const rooms = dayHotelRooms[i] + (i===0 ? preNightRooms : 0);
    const dayHotel = rooms * hotelCosts.perRoomNight * prodOn;
    const dayLocation = locationFeeForDays([d]) * prodOn;
    const crewDisplay = dayDepartments.reduce((s,dd)=>s+dd.total, 0);
    const loc = d.locationId ? locById(d.locationId) : null;
    // AO — the day's own ex-VAT / VAT / inc-VAT, same shape as the project-wide
    // figures so Per Day's expanded table can use the identical itemized columns.
    const dayExVat = dayDepartments.reduce((s,dd)=>s+dd.exVat, 0)
                     + dayCatering + dayTravel + dayHotel + dayLocation;
    /* ⚠️ the day's share of the venue's VAT rides with the day's share of its fee, so Per Day's
       VAT column still sums back to the project's. The EXTRAS' VAT does not appear here for the
       same reason the extras themselves do not — they belong to no day. */
    const dayVatTotal = dayDepartments.reduce((s,dd)=>s+dd.vat, 0) + locationVatForDays([d]) * prodOn;
    return {
      dayId:d.id, dayNum:d.dayNum, locationLabel: loc ? loc.name : '',
      departments:dayDepartments, catering:dayCatering, travel:dayTravel, hotel:dayHotel,
      location:dayLocation,
      exVat: dayExVat, vat: dayVatTotal, incVat: dayExVat + dayVatTotal,
      total: crewDisplay + dayCatering + dayTravel + dayHotel + dayLocation
    };
  });

  return {
    people, departments, cateringTotal, travelTotal, hotelTotal, locationTotal, locationVatTotal, extrasTotal,
    crewTotalExVat, vatTotal, totalExVat, totalIncVat, perDay,
    /* Phase BU — `people` indexed by ENTRY id, so Crew ▸ Roles can put the Budget's own row
       for a person straight onto that person's row instead of recomputing it. ⚠️ It is the
       SAME objects, not copies: the point is that Roles cannot show a different figure from
       the Budget. An entry the filters excluded is simply absent, and Roles renders a dash
       for it — "not costed" and "£0" being different facts. */
    byEntry: people.reduce((m,pp)=>{ m[pp.id] = pp; return m; }, {}),
    /* Phase BS/BT — the two non-shoot phase slices, ALREADY counted inside the figures
       above (people[].subtotal → departments → crewTotalExVat → totalExVat). Carried
       separately so Per Day can show each as its own block and Per Department can say
       how much of itself is prep and how much is the edit — never as a second thing to
       add on. ⚠️ Anything that adds prep.exVat or post.exVat to totalExVat is
       double-counting. `phases` is the pair in chronological render order; the two
       named keys are the same objects, for readers that want one specifically. */
    prep, post, phases:[prep, post],
    /* ⚠️ THE SCOPE STACK'S OWN FIGURES, and the only ones in here that ignore the on/off
       flags. Everything else above collapses to 0 when its scope is switched off, which
       is correct for a total and wrong for a control that has to keep saying what
       switching it back on would add. Production carries the extras because prodOn is
       what gates them; prep and post are crew fee alone, which is all a prep or edit day
       has. Never add these to a total — they double everything above. */
    /* ⚠️ Phase BV — `peopleCount` / `daysTotal` on each entry, for the STAGE stack to show
       when the money is hidden (Budget off on Roles). Same "ignore the on/off flags" rule as the
       figures beside them: a switched-off phase greys out but still says what it holds.
         peopleCount — DISTINCT HUMANS, counted on crewId, not rows. A person booked twice in
                       one phase is one person; counting entries here would be the Phase AO
                       double-count wearing a different hat.
                       ⚠️ Counted from MEMBERSHIP, not from "has days" — "booked, days not
                       settled yet" is exactly the state the membership lists exist for, and a
                       phase reading "0 people" while its tab lists four of them would be a
                       lie. So `4 people · 0 days` is a real and useful state.
         daysTotal   — PERSON-DAYS, summed, which is the quantity the money is built from
                       (people × days × rate) and the same thing Per Department's hint already
                       means by "60 days across 4 crew members". NOT the number of distinct
                       calendar days — for Production that would be the 6-day shoot rather
                       than the 180 person-days being paid for, and the two differ by two
                       orders of magnitude. */
    phaseRaw: (()=>{
      const daysKeyFor = {preproduction:'prepDays', production:'daysWorked', post:'postDays'};
      const countsFor = scope => {
        const members = people.filter(pp=>entryInPhase(scope, pp.id, p));
        return { peopleCount: new Set(members.map(pp=>pp.crewId)).size,
                 daysTotal: people.reduce((n,pp)=>n+(pp[daysKeyFor[scope]]||0), 0) };
      };
      return {
        preproduction: Object.assign({ ex: people.reduce((n,pp)=>n+pp.prepRaw,0), vat: people.reduce((n,pp)=>n+pp.prepVatRaw,0) }, countsFor('preproduction')),
        post:          Object.assign({ ex: people.reduce((n,pp)=>n+pp.postRaw,0), vat: people.reduce((n,pp)=>n+pp.postVatRaw,0) }, countsFor('post')),
        /* ⚠️ Phase CR — `ex` is the ALL-IN production figure (crew fees plus the four extras
           that hang off the shoot) and `crewEx` is the crew fees ALONE. Both are carried
           because the two screens reading this stack want different ones: the Budget tab is
           the aggregator and wants everything, Crew ▸ Roles is a crew screen and wants the
           department it is showing. Prep and post need no such pair — they are crew fee only
           by definition, there being no catering on a prep day. */
        production:    Object.assign({ ex: people.reduce((n,pp)=>n+pp.prodRaw,0) + cateringRaw + travelRaw + hotelRaw + locationRaw,
                                       crewEx: people.reduce((n,pp)=>n+pp.prodRaw,0),
                                       vat: people.reduce((n,pp)=>n+pp.prodVatRaw,0) }, countsFor('production')),
      };
    })(),
    prepOn: !!prepOn, prodOn: !!prodOn, postOn: !!postOn,
    hasCrew: crewInScope.length>0, hasDays: days.length>0
  };
}

/* ============ THE BANNER, shared by Budget's three views and Crew ▸ Roles ============
   ⚠️ ONE function, two screens — the point of Phase BU. Roles was asked to become "almost
   an exact copy of Budget Per Person, including the budget totals at the top"; rendering
   the Budget's actual banner is how the two can never quote different figures. It reads
   the same `data` from the same buildBudgetData(), so there is no second arithmetic here
   and nothing to keep in step.
   o.showTotals      — zone 1 carries the figures (false = Roles with Budget off; the zone
                       stays, see .phase-banner, it just says why it is empty)
   o.showStage       — zone 2 carries the three phase buttons
   o.showMoneyToggle — the Budget button, the Crew tab's three money-bearing sub-tabs

   ⚠️ WHERE EACH ZONE IS HONEST. On Roles and on all three Budget views the STAGE buttons
   both cost and (on Roles) filter, so they belong. On Pre-Prod and Post they do NEITHER —
   those tabs are one phase each by definition, and the standing rule that they carry NO
   TOTALS of any kind (see PHASE_TABS) rules the figures out as well. So both tabs render
   this banner with zones 1 and 2 off, carrying the TOOLS cluster alone.
   ⚠️ That is deliberately not "keep a second Budget in the Crew toolbar for those two tabs".
   One control, built in one place, wherever it appears — which is the merge Phase BU was
   asked for. A tool row with two empty zones beside it is a smaller cost than two
   implementations of the same button drifting apart. */
function budgetSummaryBarHTML(data, o){
  /* ⚠️ Phase CR — `crewOnly` is the Crew tab's view of the money: crew fees, and nothing else.
     Catering, travel, hotels and locations are real costs on this job but they are not what a
     CREW screen is counting, and a Roles headline that quietly included the venue hire made the
     one number you scan there disagree with the column of rates underneath it. THE BUDGET TAB
     IS THE AGGREGATOR and is unchanged — it still shows everything, because that is its job.
     ⚠️ This is presentation only. buildBudgetData() computes one set of figures and both
     screens read it; nothing here recalculates anything, so the two can still never disagree
     about a number they both show. */
  o = Object.assign({showTotals:true, showStage:true, showMoneyToggle:false, crewOnly:false}, o||{});
  /* the four figures the headline and the stack read, switched in ONE place */
  const totalEx  = o.crewOnly ? data.crewTotalExVat : data.totalExVat;
  const totalVat = o.crewOnly ? data.people.reduce((s,pp)=>s+pp.vat, 0) : data.vatTotal;
  const totalInc = totalEx + totalVat;
  const fmt = budgetFmt;
  /* ⚠️ With Itemize VAT OFF the single headline is ALREADY the inc-VAT figure — it just
     never said so, and "TOTAL" beside a number carrying £6,567 of VAT is a number you
     could quote to a client by mistake. The third element is a tiny note on the label
     line naming the VAT inside it. Not shown with the toggle ON: the three stats there
     spell the same thing out in full, and repeating it would be noise. Not shown when
     the VAT is zero either — nobody on the job is VAT registered, and "inc. £0.00 VAT"
     is a fact about nothing. */
  /* ⚠️ Phase CJ — ONE HEADLINE, ALWAYS, AND ITEMIZE VAT NO LONGER RESHAPES IT. It used to
     swap between three 26px figures (ex-VAT / VAT / inc-VAT) and this single one, which meant
     the widest, loudest element on the screen changed shape under a toggle that is really
     about the TABLE's columns. The one figure is the inc-VAT total — the number you would
     quote — with both of the others written small underneath it, so nothing is lost and
     nothing has to be switched to read it.
     ⚠️ ex-VAT is GREEN and inc. VAT is muted, deliberately: they are two different kinds of
     fact about the headline. The VAT note says what is INSIDE the number above it; the ex-VAT
     line is a second number in its own right, and the one you work from. Both in the same
     size and weight, so neither reads as more important than the headline.
     ⚠️ "xVAT", NOT "ex-VAT" — that is the word the Budget tab's Per Department table already
     uses for this exact figure (see its TOTAL / xVAT / VAT header, and the note there about
     not relabelling one without the other). Two words for one number across two screens of
     the same app is how a reader ends up wondering whether they are the same thing. */
  /* ⚠️ Phase CK — the xVAT line and the stack's two extra columns FOLLOW THE VAT TOGGLE; the
     `inc. £X VAT` note beside the label does NOT, and that is deliberate. The note is a safety
     rail, not a breakdown: "TOTAL" printed beside a number carrying £8,127 of VAT is a figure
     you could quote to a client by mistake, and switching the breakdown off is not a reason to
     stop saying what is inside the headline. Shown only when there IS VAT — nobody on the job
     being VAT registered makes "inc. £0.00 VAT" a fact about nothing. */
  const stats = [[o.crewOnly ? 'Crew total' : 'Total',
    budgetVatToggle ? totalInc : totalEx,
    budgetVatToggle ? (totalVat>0 ? `inc. ${fmt(totalVat)} VAT` : '') : 'ex-VAT',
    budgetVatToggle ? `xVAT ${fmt(totalEx)}` : '']];
  /* Phase BS — the scope toggles sit in the same cluster as Itemize VAT, and in that
     reading order: WHAT is being costed, then HOW it's shown. All start ticked, so the
     number you land on is the complete one.
     ⚠️ Phase BT — they render from BUDGET_SCOPES, which is chronological: Pre-production,
     Production, Post. Do not hand-order them here; that list is the one order. */
  /* ⚠️ THE THREE SCOPES ARE A STACK NOW, not checkboxes in the toggle cluster. Each line
     carries its own total, sitting under the grand total it adds up to, so the shape of
     the job is readable without ticking anything: how much is prep, how much is the
     shoot, how much is the edit. The whole line is the control — clicking it toggles
     that scope — and a scope that is off GREYS OUT rather than disappearing, because a
     £0 you switched off and a £0 you never booked are different facts.
     ⚠️ Order comes from BUDGET_SCOPES, which is chronological. Do not hand-order here.
     ⚠️ Production has no phase slice of its own — prep and post are the two carved OUT
     of the shoot — so its figure is the remainder, total minus the two. Same arithmetic
     Per Department already shows, not a second source that could disagree with it. */
  /* Reads phaseRaw, NOT the scoped slices — a switched-off phase still has to show what it
     would cost, and its scoped figure is 0 by construction.
     ⚠️ Phase CJ — THREE FIGURES PER PHASE NOW: ex-VAT, VAT, inc-VAT. This is what the space
     freed by collapsing the headline bought, and it is the same itemization the headline
     carries, one level down — so "how much of the shoot is VAT" is readable without opening
     the Budget tab. It no longer follows Itemize VAT: that toggle is about the table's
     columns, and a stack that changed shape under it was the same fault the headline had. */
  const phaseFigures = key => {
    const r = (data.phaseRaw||{})[key] || {ex:0, vat:0};
    /* crewEx exists on production only — the other two are crew fee already */
    const ex = (o.crewOnly && r.crewEx!=null) ? r.crewEx : (r.ex||0);
    return {ex, vat:r.vat||0, inc:ex+(r.vat||0)};
  };
  /* ⚠️ WITH THE MONEY OFF, THE STACK SAYS WHAT IS IN THE PHASE INSTEAD OF WHAT IT COSTS.
     It used to print the figure regardless, which quietly defeated Budget: the whole point of
     that control is that a rate or a total cannot be read over your shoulder, and three
     phase totals are exactly the numbers you would least want on screen. So the amount is
     replaced — not blanked, since a row with a name and nothing after it reads as broken —
     by the two counts that ARE safe to show and are what you want while staffing anyway.
     Counts come from phaseRaw, so they ignore the on/off flags for the same reason the
     figures do: a switched-off phase greys out and still says what it holds. */
  const scopeMeta = key => {
    const r = (data.phaseRaw||{})[key] || {};
    const n = r.peopleCount||0, d = r.daysTotal||0;
    return `${n} ${n===1?'person':'people'} · ${d} ${d===1?'day':'days'}`;
  };
  const scopeRow = ([key, label]) => `<div class="budget-scope-row${budgetVatToggle&&o.showTotals?' itemized':''}${budgetScope[key]?'':' off'}"
      role="button" tabindex="0" aria-pressed="${budgetScope[key]?'true':'false'}"
      onclick="toggleBudgetScope('${key}', !budgetScope['${key}'])"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleBudgetScope('${key}', !budgetScope['${key}']);}"
      title="${budgetScope[key]?'Costed — click to leave it out':'Not costed — click to include it'}">
      <span class="budget-scope-name">${esc(label)}</span>
      ${o.showTotals ? (()=>{ const f = phaseFigures(key); return budgetVatToggle ? `
        <span class="budget-scope-ex">${fmt(f.ex)}</span>
        <span class="budget-scope-vat">${f.vat ? fmt(f.vat) : '—'}</span>
        <span class="budget-scope-amt">${fmt(f.inc)}</span>`
        : `<span class="budget-scope-amt">${fmt(f.ex)}</span>`; })()
        : `<span class="budget-scope-count">${esc(scopeMeta(key))}</span>`}
    </div>`;
  const nothingOn = BUDGET_SCOPES.every(([k])=>!budgetScope[k]);
  /* ---- TOTALS, zone 1. "Totaliser or blank" — and blank keeps its column ----
     `showTotals` is false only on Crew ▸ Roles with Budget off. The zone still renders, with
     a sentence in it: an empty left third of a banner reads as a screen that failed rather
     than one you switched the money off on. */
  const totalsHTML = o.showTotals
    ? stats.map(([lbl,v,note,sub])=>`<div class="budget-stat"><div class="num">${fmt(v)}</div><div class="lbl">${esc(lbl)}${note?`<span class="budget-stat-note">${esc(note)}</span>`:''}</div>${sub?`<div class="budget-stat-sub">${esc(sub)}</div>`:''}</div>`).join('')
    : `<div class="bnr-totals-off">Rates and totals hidden. Turn on <strong>Budget</strong> to cost this list — the phase buttons still filter who is on it.</div>`;
  /* ---- TOOLS, zone 3 ----
     ⚠️ ONE cluster for everything that changes what this screen SHOWS, as buttons. The
     mode picker is Roles-only (there are no rows to retype on a Budget rollup) and Budget is
     Roles-only for the opposite reason — the Budget tab exists to show money, so a
     control that hides all of it there would only be a way to get to a blank screen. */
  const toolBtn = (on, label, call, title) => `<button type="button" class="bnr-tool${on?' on':''}"
      aria-pressed="${on?'true':'false'}" onclick="${call}" title="${esc(title)}">${label}</button>`;
  /* ⚠️ REMOVED in Phase CF: `modeHTML` and the `.bnr-modes` STAGE | DAYS picker. Roles has
     one shape now — see the note where ROLES_MODES used to live. */
  const moneyHTML = o.showMoneyToggle
    ? toolBtn(crewShowMoney, 'Budget', 'toggleCrewMoney()',
        crewShowMoney ? 'Hide rates and totals' : 'Show rates and totals')
    : '';
  /* Itemize VAT / Split kit / Costs PP are meaningless with the money hidden, so on Roles
     with Budget off they go rather than sitting there doing nothing to a blank column. */
  const showMoneyTools = !o.showMoneyToggle || crewShowMoney;
  const moneyToolsHTML = showMoneyTools ? [
      /* ⚠️ Phase CK — LABELLED "VAT", not "Itemize VAT". It now governs one consistent thing
         across the whole screen — whether the VAT breakdown is shown at all: the headline's
         xVAT line, the phase stack's xVAT and VAT columns, and the table's Subtotal and VAT
         columns. "Itemize" described the old three-figures-vs-one headline swap, which no
         longer happens. */
      /* ⚠️ THE LABEL IS THE STATE, not the action (Phase CN): "VAT" while the totals include
         it, "xVAT" while they don't. Every other pill in this cluster is a thing you switch on,
         so its label can stay fixed and the lit/unlit state carries the rest; this one changes
         what the biggest number on the screen MEANS, and a button reading "VAT" above a column
         of ex-VAT figures is the one misreading worth spending a word to prevent. */
      toolBtn(budgetVatToggle, budgetVatToggle ? 'VAT' : 'xVAT', `toggleBudgetVat(${!budgetVatToggle})`,
        budgetVatToggle ? 'Hide the VAT breakdown' : 'Break out xVAT and VAT on the totals, the phases and every row'),
      toolBtn(budgetSplitKit, 'Split kit &amp; labour', `toggleBudgetSplitKit(${!budgetSplitKit})`,
        'Break each rate into its equipment and labour halves'),
      toolBtn(budgetCostsPP, 'Costs PP', `toggleBudgetCostsPP(${!budgetCostsPP})`,
        "Show what each person costs besides their fee — their hotel, travel and meals")
    ].join('') : '';
  /* ⚠️ TWO ROWS, AND Budget IS THE LAST THING ON THE SECOND ONE. Both rows are right-aligned
     and Budget sits at the end of its row, so it holds ONE x whether the three money tools are
     beside it or not — the same rule STAGE follows, applied to the control you reach for
     most. The extras therefore grow LEFTWARD from it: `Itemize VAT · Split kit & labour ·
     Costs PP · Budget`.
     ⚠️ Do not put Budget first. It was, and turning it on made the three extras appear to its
     RIGHT — which shoved nothing, but turning it off then pulled Budget from the left end of a
     four-button row to the right end of a one-button row, i.e. the button you had just
     clicked jumped ~290px out from under the pointer.
     ⚠️ And do not merge the two rows. The mode picker answers "what am I editing"; Budget and
     its tools answer "what am I looking at". One wrapping row of seven buttons re-flowed
     unpredictably as the extras came and went, which is what moved Budget in the first place. */
  return `<div class="phase-banner">
    <div class="bnr-totals">${o.showTotals||o.showStage ? totalsHTML : ''}</div>
    <div class="budget-scope-stack">${o.showStage ? `${o.showTotals ? `<div class="budget-scope-row${budgetVatToggle?' itemized':''} budget-scope-head" aria-hidden="true">
        <span class="budget-scope-name"></span>${budgetVatToggle ? `<span class="budget-scope-ex">xVAT</span>
        <span class="budget-scope-vat">VAT</span>` : ''}<span class="budget-scope-amt">Total</span>
      </div>` : ''}${BUDGET_SCOPES.map(scopeRow).join('')}` : ''}</div>
    <div class="bnr-tools">
      <div class="bnr-toolrow">${moneyToolsHTML}${moneyHTML}</div>
    </div>
    ${o.showStage && nothingOn ? `<div class="bnr-scope-note hint">Every phase is off, so nothing is being costed and only crew in no phase at all are listed. Click Pre-production, Production or Post — or all three.</div>` : ''}
  </div>`;
}

/* Shared by the project-wide Per Department view and each Per Day row's own
   expanded breakdown — "same department + aggregated-extras structure … just
   scoped to that single day" per the brief. Extras rows are always their own
   labelled block, never folded into a department — a catering or travel bill
   isn't any one department's cost. */
/* AO — takes ONE options object rather than the seven positional args it had: the
   itemized breakdown needs exVat/vat/incVat as well, and ten positional args at two
   call sites is a bug waiting to happen. Shape is the same either way — the
   project-wide caller passes the data's project totals, the Per Day caller passes
   that day's, and both get the identical table.
   With Itemize VAT on the department rows carry a real ex-VAT / VAT / inc-VAT
   breakdown (see buildBudgetData) instead of one Cost column. The extras rows show
   £0.00 VAT deliberately — catering/hotel/location are supplier-paid so no person's
   vatRegistered attaches to them, and travel's VAT is charged by the crew member who
   travelled, so it sits in THEIR department's row, not here. */
/* ⚠️ Phase BS added `o.hideExtras` — the Pre-production block (Per Day) is crew cost
   and nothing else: there is no catering, travel, hotel or location on a prep day, and
   four £0.00 rows under an "extras" heading would read as missing data rather than as
   absent-by-definition. It suppresses the extras block and its trailing note only; the
   department rows and the total keep exactly the same shape and columns. */
function budgetDeptExtrasTableHTML(o){
  const fmt = budgetFmt;
  const {departments, catering, travel, hotel, location, extrasLabel, hideExtras} = o;
  if(!departments.length && !catering && !travel && !hotel && !location){
    return '<div class="empty-note">Nothing to cost yet.</div>';
  }
  const deptCell = d => `<td>${d.code?`<span class="dept-code">${esc(d.code)}</span> `:''}${esc(d.dept)}</td>`;
  if(!budgetVatToggle){
    return `<div class="tablewrap"><table>
      <tr><th>Department</th><th>Cost</th></tr>
      ${departments.map(d=>`<tr>${deptCell(d)}<td>${fmt(d.total)}</td></tr>`).join('')}
      ${hideExtras ? '' : `<tr class="budget-extras-row"><td colspan="2"><span class="subhead" style="margin:0;">${esc(extrasLabel)}</span></td></tr>
      <tr><td>Catering</td><td>${fmt(catering)}</td></tr>
      <tr><td>Travel</td><td>${fmt(travel)}</td></tr>
      <tr><td>Hotels</td><td>${fmt(hotel)}</td></tr>
      <tr><td>Locations</td><td>${fmt(location)}</td></tr>`}
      <tr class="budget-total-row"><td>Total</td><td>${fmt(o.total)}</td></tr>
    </table></div>`;
  }
  /* ⚠️ TOTAL FIRST, then the working: TOTAL (inc-VAT) · xVAT (ex-VAT) · VAT. Same
     reading order and the same two names as Per Person's TOTAL / Subtotal pair — the
     figure you want, then what it is made of. An extras line carries no VAT (paid direct
     to a supplier, not through a crew member), so its TOTAL and xVAT are the same number
     and its VAT is zero. */
  const extraRow = (lbl, v) => `<tr><td>${lbl}</td><td>${fmt(v)}</td><td>${fmt(v)}</td><td>${fmt(0)}</td></tr>`;
  const anyTravelVat = departments.some(d=>d.vat>0) && travel>0;
  return `<div class="tablewrap"><table>
    <tr><th>Department</th><th>TOTAL</th><th>xVAT</th><th>VAT</th></tr>
    ${departments.map(d=>`<tr>${deptCell(d)}<td>${fmt(d.incVat)}</td><td>${fmt(d.exVat)}</td><td>${fmt(d.vat)}</td></tr>`).join('')}
    ${hideExtras ? '' : `<tr class="budget-extras-row"><td colspan="4"><span class="subhead" style="margin:0;">${esc(extrasLabel)}</span></td></tr>
    ${extraRow('Catering', catering)}
    ${extraRow('Travel', travel)}
    ${extraRow('Hotels', hotel)}
    ${extraRow('Locations', location)}`}
    <tr class="budget-total-row"><td>Total</td><td>${fmt(o.incVat)}</td><td>${fmt(o.exVat)}</td><td>${fmt(o.vat)}</td></tr>
  </table></div>
  ${hideExtras ? '' : `<div class="hint" style="margin-top:8px;">A department's VAT is summed from the people in it who are actually VAT-registered — not 20% of its total.${anyTravelVat?' It includes VAT on their travel, which is itself shown ex-VAT in the Travel row above.':''} Catering, Hotels and Locations are paid direct to a supplier, so no crew member's VAT attaches to them.</div>`}`;
}

function budgetDepartmentViewHTML(data){
  if(!data.hasCrew && !data.cateringTotal && !data.travelTotal && !data.hotelTotal && !data.locationTotal){
    return '<div class="empty-note">No crew assigned to this project yet.</div>';
  }
  const displayTotal = budgetVatToggle ? data.totalExVat : data.totalIncVat;
  /* Phase BS — prep money is folded INTO each department's row (a prep day is that
     department's cost), so the only thing missing was a way to see how much of the
     total it is. This note says it rather than adding a "Pre-production" pseudo-
     department, which would double-count against the rows above it. Phase BT — the
     edit is folded in exactly the same way, and gets a sentence in the same note
     rather than a second block of hint text under the table. */
  const phaseParts = data.phases.filter(ph=>ph.on && ph.exVat).map(ph=>
    `${budgetFmt(budgetVatToggle ? ph.exVat : ph.incVat)} of ${ph.noteName} (${ph.daysTotal} day${ph.daysTotal===1?'':'s'} across ${ph.peopleCount} crew member${ph.peopleCount===1?'':'s'})`);
  const noteHTML = phaseParts.length ? `<div class="hint" style="margin-top:8px;">Department totals include ${phaseParts.join(' and ')}, at the same day rate. Untick ${phaseParts.length>1?'either scope':'that scope'} above for the shoot on its own.</div>` : '';
  return budgetDeptExtrasTableHTML({
    departments: data.departments, catering: data.cateringTotal, travel: data.travelTotal,
    hotel: data.hotelTotal, location: data.locationTotal, extrasLabel: 'Project-wide extras',
    total: displayTotal, exVat: data.totalExVat, vat: data.vatTotal, incVat: data.totalIncVat
  }) + noteHTML;
}

function budgetPersonViewHTML(data){
  if(!data.hasCrew) return '<div class="empty-note">No crew assigned to this project yet.</div>';
  const fmt = budgetFmt;
  // Same order as everywhere else crew is listed without an explicit sort
  // control: canonical department order, HoD-first within it (sortHoDFirst).
  // There's no existing sortable-table (click-a-column-header) pattern
  // anywhere in this app to extend, so this stays a fixed, sensible order
  // rather than inventing a new UI paradigm for one screen.
  const ordered = budgetOrderedPeople(data);
  const noRateCount = data.people.filter(pp=>!pp.hasRate).length;
  // AO — with Itemize VAT on, the person's own VAT amount gets a column of its own.
  // It has to be visible now that it is no longer simply 20% of the Subtotal beside
  // it: for a VAT-registered person it also covers their travel (charged back
  // through them), which is itemised ex-VAT in the Travel extras row instead.
  const anyTravel = data.people.some(pp=>pp.travelCost>0);
  const vatCell = pp => {
    const travelNote = pp.vatRegistered && pp.travelCost
      ? ` title="Includes ${budgetFmt(pp.travelCost*VAT_RATE)} VAT on ${budgetFmt(pp.travelCost)} of travel"` : '';
    return `<td${travelNote}>${pp.vat ? fmt(pp.vat) : '<span class="budget-noRate">—</span>'}</td>`;
  };
  /* Phase BS — a count column appears only when its scope is being costed, so the
     Subtotal is always explicable from the columns beside it. With all three on you see
     Prep, Days AND Edit and the subtotal is rate × (prep + days + edit); with Production
     off the Days column goes rather than sitting there uncosted next to a smaller
     number. Phase BT — the three count columns are declared once, in the same
     chronological order as the toggles, so the header and the body cells cannot
     disagree about which ones are showing. */
  const countCols = [
    /* ⚠️ `tab` is quoted straight into the note below as a place to GO ("…are the
       Pre-Prod and Post tabs' booked days"), so these are the Crew sub-tab labels
       verbatim, not prose names for the phases — they have to track viewLabels or the
       note sends people to a tab that isn't there. The Budget's own scope toggles keep
       the longer "Pre-production" for the first scope — that one is a costing scope,
       not a tab, and nothing tells you to click it; the middle scope and the middle tab
       are both "Production" and now agree word for word. */
    {on:data.prepOn, head:'Prep', title:'Pre-Prod days',    tab:'Pre-Prod', value:pp=>pp.prepDays},
    {on:data.prodOn, head:'Days', title:'Production days',  tab:null,       value:pp=>pp.daysWorked},
    {on:data.postOn, head:'Edit', title:'Edit days booked on the Post tab', tab:'Post', value:pp=>pp.postDays}
  ].filter(c=>c.on);
  /* The one note covering whichever non-shoot columns are showing — two near-identical
     sentences stacked under the table said the same thing twice. */
  const offShoot = countCols.filter(c=>c.tab);
  const offShootNote = offShoot.length ? `<div class="hint" style="margin-top:8px;">${
      offShoot.map(c=>c.head).join(' and ')} ${offShoot.length>1?'are':'is'} the ${
      offShoot.map(c=>c.tab).join(' and ')} tab${offShoot.length>1?'s\'':'\'s'} booked days, at the same day rate — ${
      offShoot.length>1?'neither is':'it is not'} filtered by the shoot-day filter, because ${
      offShoot.length>1?'neither is a shoot day':'a '+offShoot[0].head.toLowerCase()+' day isn\'t a shoot day'}.</div>` : '';
  /* Kit and Labour appear only when the toggle is ON *and* somebody on this project
     actually has a split rate — two empty columns on a job where nobody brings kit
     would be noise on every other job. They sit immediately before Subtotal because
     they are that Subtotal taken apart: Kit + Labour === Subtotal, always. A person
     with no split shows a dash in both rather than their whole fee under Labour, which
     would read as a claim their rate had been examined and found to be all labour. */
  const anySplit = data.people.some(pp=>pp.kit!=null);
  const showSplit = budgetSplitKit && anySplit;
  const splitCell = v => `<td>${v!=null ? fmt(v) : '<span class="budget-noRate">—</span>'}</td>`;
  /* COLUMN ORDER, and it is deliberate: Name · Role · TOTAL · Prep · Days · Edit ·
     Day rate · Subtotal · [Kit · Labour] · Est. Costs · VAT reg. · VAT.
     TOTAL leads because it is what you scan the list for; the columns after it are the
     working that produces it, left to right — how many days, at what rate, giving what
     subtotal. Kit/Labour sit next to Subtotal because they are a split OF it.
     ⚠️ TOTAL is inc-VAT (pp.display) and Subtotal is ex-VAT, the same pair of names the
     Per Department table uses (TOTAL / xVAT / VAT). Do not relabel one without the other.
     ⚠️ Est. Costs is NOT part of TOTAL and never should be — see buildBudgetData. */
  const estCell = pp => `<td class="budget-est-costs">${pp.estCosts ? fmt(pp.estCosts) : '<span class="budget-noRate">—</span>'}</td>`;
  return `<div class="tablewrap"><table>
    <tr><th>Name</th><th>Role</th><th>TOTAL</th>${countCols.map(c=>`<th style="text-align:center;" title="${esc(c.title)}">${c.head}</th>`).join('')}<th>Day rate</th><th>Subtotal</th>${showSplit?'<th title="Equipment portion of the day rate, across every day being costed">Kit</th><th title="What is left of the day rate once kit comes out">Labour</th>':''}${budgetCostsPP?'<th>Est. Costs</th>':''}<th style="text-align:center;">VAT reg.</th>${budgetVatToggle?'<th>VAT</th>':''}</tr>
    ${ordered.map((pp,i)=>`<tr class="${i>0 && ordered[i-1].crewId===pp.crewId ? 'budget-same-person' : ''}">
      <td>${i>0 && ordered[i-1].crewId===pp.crewId ? '' : esc(pp.name)}</td>
      <td>${esc(pp.role||'')}</td>
      <td><strong>${pp.hasRate ? fmt(pp.display) : '<span class="budget-noRate">—</span>'}</strong></td>
      ${countCols.map(c=>`<td style="text-align:center;">${c.value(pp) || '<span class="budget-noRate">—</span>'}</td>`).join('')}
      <td><span class="rate-with-save"><span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input" value="${pp.rate||''}" placeholder="—" onchange="saveEntryRate('${pp.id}', this.value)"></span>${crewRateSaveIconHTML(pp.id, 'b')}</span>${pp.isBuyout?'<span class="buyout-flag" title="One agreed fee — the day counts only split it across the phases">Buyout</span>':''}</td>
      <td>${pp.hasRate ? fmt(pp.subtotal) : '<span class="budget-noRate">—</span>'}</td>
      ${showSplit ? splitCell(pp.kitSubtotal)+splitCell(pp.labourSubtotal) : ''}
      ${budgetCostsPP ? estCell(pp) : ''}
      <td style="text-align:center;"><input type="checkbox" ${pp.vatRegistered?'checked':''} onchange="toggleBudgetVatRegistered('${pp.id}', this.checked)" title="Charges VAT"></td>
      ${budgetVatToggle?vatCell(pp):''}
    </tr>`).join('')}
    ${showSplit || budgetCostsPP ? `<tr class="budget-total-row">
      <td colspan="${3+countCols.length}">${[showSplit?'Kit and labour':'', budgetCostsPP?'est. costs':''].filter(Boolean).join(' · ')}</td>
      <td></td><td></td>
      ${showSplit ? `<td>${fmt(data.people.reduce((n,pp)=>n+(pp.kitSubtotal||0),0))}</td><td>${fmt(data.people.reduce((n,pp)=>n+(pp.labourSubtotal||0),0))}</td>` : ''}
      ${budgetCostsPP ? `<td class="budget-est-costs">${fmt(data.people.reduce((n,pp)=>n+(pp.estCosts||0),0))}</td>` : ''}
      <td></td>${budgetVatToggle?'<td></td>':''}
    </tr>` : ''}
  </table></div>
  ${showSplit ? `<div class="hint" style="margin-top:8px;">Kit is the equipment portion of a split day rate, set per role on the crew record. It is part of the Subtotal, not on top of it — the two columns add up to it. Untick Split kit &amp; labour above to hide them.</div>` : ''}
  ${data.phases.some(ph=>ph.on && ph.daysTotal) ? offShootNote : ''}
  ${noRateCount ? `<div class="hint" style="margin-top:8px;">${noRateCount} crew member${noRateCount>1?'s have':' has'} no day rate on file — enter one above, or add it on their crew database record.</div>` : ''}
  ${(()=>{
    /* ⚠️ Phase BY — said here because without it this table's arithmetic looks WRONG: a
       subtotal that is more than rate × days, with nothing on screen to explain the difference.
       Overtime is entered on Crew ▸ Roles and is already inside Subtotal and TOTAL. Shown only
       when somebody actually has some, so a job with no overtime carries no note about it. */
    const ot = data.people.reduce((n,pp)=>n+(pp.otSubtotal||0), 0);
    const who = data.people.filter(pp=>pp.otSubtotal>0).length;
    return ot ? `<div class="hint" style="margin-top:8px;">Subtotals include ${budgetFmt(ot)} of overtime across ${who} role${who===1?'':'s'}, at the day rate — so a row can read higher than its rate × days. Overtime units are entered in the <strong>OT</strong> column on Crew ▸ Roles.</div>` : '';
  })()}
  ${anyTravel ? `<div class="hint" style="margin-top:8px;">A VAT-registered crew member's travel carries VAT too — it's charged back through them — so their VAT covers day rate ${budgetVatToggle?'and travel':'and travel, baked into the Subtotal'}. The travel cost itself is counted once, in the Travel line of Per Department.</div>` : ''}
  <div class="hint" style="margin-top:8px;">Ticking VAT here doesn't save on its own — it's saved to the crew database together with the day rate, the next time that row's Save icon is clicked.</div>`;
}

function budgetDayViewHTML(data){
  if(!data.hasDays) return '<div class="empty-note">Add shoot days first, then assign crew positions to cost them out here.</div>';
  syncBudgetDayBlocks(data.perDay.map(d=>d.dayId));
  const fmt = budgetFmt;
  const toggleRow = data.perDay.length>1 ? expandCollapseAllHTML('toggleAllBudgetDayBlocks()', undefined, allBlocksCollapsed(budgetDayBlocks), 'bd') : '';
  /* Phase BS — Pre-production gets a block of its own ABOVE the shoot days, and it is
     not one of them: `budgetDayBlocks` is keyed by day id and syncBudgetDayBlocks()
     prunes anything that isn't, so this block is deliberately outside that plumbing
     and always open. Without it the day rows would no longer sum to the total the
     summary bar shows, which is the one thing this view has to be able to do.
     ⚠️ Phase BT — Post is the SAME block, built by the same expression from data.phases,
     and it sits BELOW the shoot days for the reason Pre-production sits above them:
     this view reads down the page in the order the job happens. */
  const phaseBlockHTML = (ph, topMargin) => (ph.on && ph.exVat) ? `<div class="sd-block">
      <div class="sd-block-head" style="margin:${topMargin} 0 0;">
        <span style="flex:1;">${esc(ph.label)} <span class="dept-count">(${ph.daysTotal} day${ph.daysTotal===1?'':'s'} · ${ph.peopleCount} crew)</span></span>
        <strong>${fmt(budgetVatToggle ? ph.exVat : ph.incVat)}</strong>
      </div>
      <div style="margin-top:10px;">
        ${budgetDeptExtrasTableHTML({
          departments: ph.departments, catering:0, travel:0, hotel:0, location:0,
          hideExtras: true,
          total: budgetVatToggle ? ph.exVat : ph.incVat,
          exVat: ph.exVat, vat: ph.vat, incVat: ph.incVat
        })}
        <div class="hint" style="margin-top:8px;">${esc(ph.dayNoun)} belong to the project, not to any one shoot day, so they sit here rather than on a day row — and the shoot-day filter leaves them alone.</div>
      </div>
    </div>` : '';
  // prep leads the list, so it keeps a flush top; post follows the day rows and takes
  // the same 14px gap they put between each other.
  const prepBlock = phaseBlockHTML(data.prep, '0');
  const postBlock = phaseBlockHTML(data.post, '14px');
  const rows = data.perDay.map(d=>{
    const open = budgetDayBlocks[d.dayId];
    const title = `Day ${esc(d.dayNum||'?')}${d.locationLabel?' — '+esc(d.locationLabel):''}`;
    return `<div class="sd-block">
      <div class="sd-block-head" style="margin:14px 0 0;">
        <span class="sd-block-head-toggle" onclick="toggleBudgetDayBlock('${d.dayId}')" style="flex:1;">
          <span class="dept-caret" id="bdc-${d.dayId}">${open?'▾':'▸'}</span> ${title}
        </span>
        <strong>${fmt(d.total)}</strong>
      </div>
      <div id="bdb-${d.dayId}" style="display:${open?'':'none'}; margin-top:10px;">
        ${budgetDeptExtrasTableHTML({
          departments: d.departments, catering: d.catering, travel: d.travel,
          hotel: d.hotel, location: d.location, extrasLabel: 'Day extras',
          total: d.total, exVat: d.exVat, vat: d.vat, incVat: d.incVat
        })}
      </div>
    </div>`;
  }).join('');
  return toggleRow + prepBlock + rows + postBlock;
}

/* AF: Budget's own "Costs" tab. Deliberately holds no state of its own — every field
   here is the exact same DOM id, read via the exact same getCateringCosts()/
   getTransportCosts()/getHotelCosts() and written via the exact same saveCateringCosts()/
   saveTransportCosts()/saveHotelCosts() as the Hotel/Catering/Travel tabs under Crew.
   That's what keeps the two places in sync for free — there is nowhere else these
   values live, so editing either one is editing the one underlying p.cateringCosts/
   p.transportCosts/p.hotelCosts record; the next render of either screen just reads
   it fresh. Reusing the ids (ccCostB etc.) is safe because only one tab body is ever
   in the DOM at once — same precedent as hcRoomNight being reused between the Hotel
   tab and Preview & Export. */
function budgetCostsViewHTML(){
  const p = currentProject();
  const cateringCosts = getCateringCosts(p);
  const transportCosts = getTransportCosts(p);
  const hotelCosts = getHotelCosts(p);
  // R16 — the three cost groups collapse, via the same shared applyBlockState
  // plumbing (prefix 'bc') as every other collapsible block, rather than a
  // hand-rolled toggle. Open by default: this tab exists to be typed into.
  const group = (key, title, fields) => `<div class="sd-block">
      <div class="sd-block-head flush" style="margin-top:${key==='catering'?'0':'18px'};">
        <span class="sd-block-head-toggle" onclick="toggleBudgetCostBlock('${key}')">
          <span class="dept-caret" id="bcc-${key}">${budgetCostBlocks[key]?'▾':'▸'}</span> ${title}
        </span>
      </div>
      <div id="bcb-${key}" style="display:${budgetCostBlocks[key]?'':'none'};">
        <div style="display:flex; gap:18px; flex-wrap:wrap;">${fields}</div>
      </div>
    </div>`;
  return `
    <div class="hint" style="margin-bottom:14px;">Same cost fields as the Hotel/Catering/Travel tabs under Crew —
      a change made here or there updates both.</div>
    ${expandCollapseAllHTML('toggleAllBudgetCostBlocks()', undefined, allBlocksCollapsed(budgetCostBlocks), 'bc')}
    ${group('catering', 'Catering',
        costFieldHTML('ccCostB', 'Est. cost per Breakfast', cateringCosts.b)
      + costFieldHTML('ccCostL', 'Est. cost per Lunch', cateringCosts.l)
      + costFieldHTML('ccCostD', 'Est. cost per Dinner', cateringCosts.d)
      + costFieldHTML('ccCostDelivery', 'Delivery cost', cateringCosts.delivery))}
    ${group('travel', 'Travel',
        costFieldHTML('tsCostPublic', 'Est. public transport cost/day', transportCosts.publicPerDay)
      + costFieldHTML('tsCostMileage', 'Mileage rate (own car, per use)', transportCosts.mileage))}
    ${group('hotel', 'Hotel',
        costFieldHTML('hcRoomNight', 'Est. cost per room/night', hotelCosts.perRoomNight))}`;
}
/* Targeted refresh of just the summary bar after a Costs-tab cost field autosaves —
   same "don't blow away the field the user is still typing in" rule as
   refreshCateringSummaryFigures()/renderTransportSummaryGridSection() (Phase P2/W). */
function renderBudgetSummaryBar(){
  const el = document.getElementById('budgetSummaryBarWrap'); if(!el) return;
  el.innerHTML = budgetSummaryBarHTML(buildBudgetData());
}
/* R4 — the Per Person row order, in ONE place so the screen and the Copy/Excel
   export can't drift apart. Default stays canonical department order, HoD first
   within it (what every other crew list does when nothing is chosen); the rest
   answer the questions a cost screen actually gets asked. Ties fall back to name so
   the order is stable rather than depending on however the array happened to arrive. */
/* R16 — the Costs tab's three groups, on the shared collapsible plumbing (prefix
   'bc') rather than a fourth hand-rolled toggle. Open by default: unlike a summary
   block you glance at, this tab exists to be typed into. */
let budgetCostBlocks = { catering:true, travel:true, hotel:true };
function toggleBudgetCostBlock(key){ toggleBlock(budgetCostBlocks, 'bc', key); }
function toggleAllBudgetCostBlocks(){ setAllBlocksCollapsed(budgetCostBlocks, 'bc', !allBlocksCollapsed(budgetCostBlocks)); }

function budgetOrderedPeople(data){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  if(budgetSort==='dept') return DEPARTMENTS.flatMap(d=>sortHoDFirst(data.people.filter(pp=>pp.department===d)));
  return [...data.people].sort((a,b)=>{
    switch(budgetSort){
      case 'name':   return byName(a,b);
      case 'cost':   return (b.display-a.display) || byName(a,b);
      case 'rate':   return ((b.hasRate?b.rate:-1)-(a.hasRate?a.rate:-1)) || byName(a,b);
      case 'days':   return (b.daysWorked-a.daysWorked) || byName(a,b);
      // "no rate on file" is a to-do list, so those come first, then by name
      case 'noRate': return (Number(a.hasRate)-Number(b.hasRate)) || byName(a,b);
      default:       return byName(a,b);
    }
  });
}

/* R1 — Budget was the only summary screen in the app with no way to get the numbers
   out; every other one (hotel, catering, travel, tech) has had a Copy since its own
   phase. Built from the SAME buildBudgetData() the screen renders from, so the copy
   and the screen can never disagree — and it honours the active day/department
   filter, because a budget you send while filtered should say so rather than quietly
   exporting the whole project. Rows mirror the visible view, not a fixed shape.
   Phase AP — `view` is now passed in rather than read off the global budgetView, so
   the output menu can export a view you aren't currently looking at. Still ONE data
   path: every figure comes from the buildBudgetData() handed in. */
function budgetExportRows(data, view){
  const fmt = budgetFmt;
  const rows = [];
  const scope = budgetScopeParts();
  if(budgetDeptFilter.size)  scope.push([...budgetDeptFilter].join(', '));
  if(scope.length) rows.push(['Filtered to', scope.join(' · ')]);
  // Phase BS — always stated, not only when it's non-default: a budget sent to
  // someone else has to say which halves of the shoot it covers.
  rows.push(['Costing', budgetScopeLabel()], []);
  budgetVatToggle
    ? rows.push(['Total (ex-VAT)', fmt(data.totalExVat)], ['VAT', fmt(data.vatTotal)], ['Total (inc-VAT)', fmt(data.totalIncVat)])
    : rows.push(['Total', fmt(data.totalIncVat)]);
  rows.push([]);
  // AO — the itemized shapes mirror the screen column-for-column: Per Person gains
  // the VAT amount, Per Department/Per Day the ex-VAT/VAT/inc-VAT breakdown.
  if(view==='person'){
    /* Phase BS — the count columns follow the scopes, exactly as on screen. Phase BT —
       and in the same chronological order the screen puts them in (Prep, Days, Edit),
       so a pasted table and the tab it came from read identically. */
    rows.push(['Name','Role','Day rate','VAT reg.',
      ...(data.prepOn ? ['Prep'] : []), ...(data.prodOn ? ['Days'] : []),
      ...(data.postOn ? ['Edit'] : []),
      ...(budgetVatToggle ? ['VAT'] : []), 'Subtotal']);
    budgetOrderedPeople(data).forEach(pp=>rows.push([
      pp.name, pp.role||'', pp.hasRate?fmt(pp.rate):'no rate on file',
      pp.vatRegistered?'Yes':'No',
      ...(data.prepOn ? [pp.prepDays||0] : []),
      ...(data.prodOn ? [pp.daysWorked] : []),
      ...(data.postOn ? [pp.postDays||0] : []),
      ...(budgetVatToggle ? [pp.vat?fmt(pp.vat):'—'] : []),
      pp.hasRate?fmt(pp.display):'—']));
  } else if(view==='day'){
    rows.push(budgetVatToggle ? ['Day','Location','Ex-VAT','VAT','Inc-VAT'] : ['Day','Location','Total']);
    // Phase BS/BT — the prep row leads and the post row closes, same as the blocks do
    // on screen, so the rows still add up to the total printed above them.
    const phaseRow = ph => { if(!(ph.on && ph.exVat)) return;
      const span = `${ph.daysTotal} day${ph.daysTotal===1?'':'s'}`;
      rows.push(budgetVatToggle ? [ph.label, span, fmt(ph.exVat), fmt(ph.vat), fmt(ph.incVat)]
                                : [ph.label, span, fmt(ph.incVat)]); };
    phaseRow(data.prep);
    data.perDay.forEach(d=>rows.push(budgetVatToggle
      ? [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]
      : [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.total)]));
    phaseRow(data.post);
  } else if(view==='costs'){
    /* AP — Costs is the one view that isn't a rollup, so R1 quietly exported the
       Per Department shape for it. Now that the menu names it, it exports what it
       actually shows: the per-unit RATES, read through the very same
       getCateringCosts()/getTransportCosts()/getHotelCosts() getters
       budgetCostsViewHTML() renders from — not a second copy of them — followed by
       the extras totals those rates produce, which still come from buildBudgetData()
       like every other figure here. No VAT split: these are supplier costs, and per
       AO's "VAT follows the person" they carry none. */
    const p = currentProject();
    const cc = getCateringCosts(p), tc = getTransportCosts(p), hc = getHotelCosts(p);
    // Single-cell captions, not two-column headers: these rows are label/value
    // pairs, and copyBudget() renders a 2-cell row as "label: value" — a
    // ['Rate','Amount'] header would come out as the nonsense line "Rate: Amount".
    rows.push(['Rates'],
      ['Catering — per breakfast', fmt(cc.b)],
      ['Catering — per lunch', fmt(cc.l)],
      ['Catering — per dinner', fmt(cc.d)],
      ['Catering — delivery', fmt(cc.delivery)],
      ['Travel — public transport per day', fmt(tc.publicPerDay)],
      ['Travel — mileage (own car, per use)', fmt(tc.mileage)],
      ['Hotel — per room/night', fmt(hc.perRoomNight)],
      [],
      ['Totals'],
      ['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
      ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)]);
  } else if(budgetVatToggle){
    rows.push(['Department','Ex-VAT','VAT','Inc-VAT']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]));
    const extra = (lbl,v)=>[lbl, fmt(v), fmt(0), fmt(v)];
    rows.push(extra('Catering', data.cateringTotal), extra('Travel', data.travelTotal),
              extra('Hotels', data.hotelTotal), extra('Locations', data.locationTotal),
              ['Total', fmt(data.totalExVat), fmt(data.vatTotal), fmt(data.totalIncVat)]);
  } else {
    rows.push(['Department','Cost']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.total)]));
    rows.push(['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
              ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)],
              ['Total', fmt(data.totalIncVat)]);
  }
  return rows;
}
// The output menu's own labels for the four views — same wording as the view
// switcher (BUDGET_VIEW_LABELS), so the menu can't name a view differently.
const BUDGET_VIEW_LABELS = {department:'Per Department', day:'Per Day', person:'Per Person', costs:'Costs'};
function budgetExportTitle(view){
  const p = currentProject();
  return `BUDGET — ${(p&&(p.title||p.client))||''} — ${BUDGET_VIEW_LABELS[view]||'Budget'}`;
}
function copyBudget(){
  const view = budgetExportViewEff();
  const data = buildBudgetData();
  // two-column rows read as "label: value"; wider rows as a spaced table row
  const out = [budgetExportTitle(view), ''];
  budgetExportRows(data, view).forEach(r=>{
    if(!r.length) return out.push('');
    out.push(r.length===2 ? `${r[0]}: ${r[1]}` : r.join('  |  '));
  });
  copyText(out.join('\n'), 'Budget copied');
}
function downloadBudgetExcel(){
  const view = budgetExportViewEff();
  const data = buildBudgetData();
  const aoa = [[budgetExportTitle(view)], []].concat(budgetExportRows(data, view).map(r=>r.length?r:['']));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Budget');
  const p = currentProject();
  // AP — the view is in the filename too, so exporting all four doesn't leave four
  // files fighting over one name in the downloads folder.
  const slug = s => String(s||'').replace(/[^\w-]+/g,'-').toLowerCase();
  XLSX.writeFile(wb, `budget-${slug((p&&(p.title||p.client))||'project')}-${slug(BUDGET_VIEW_LABELS[view])}.xlsx`);
}
