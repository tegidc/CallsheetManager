/* ================================================ THE PHASE TABS: PRE-PRODUCTION + POST

   Phase BD built Pre-production (T-8); Phase BT added POST — the edit — as a second
   tab of exactly the same shape, and turned everything below into ONE implementation
   the two share rather than a copy. They exist as their own Crew sub-tabs because
   neither phase has shoot days: a prep day and an edit day are scheduled against the
   calendar, not against a roster of numbered days. Both show the same crew ENTRY rows
   as the Roles view, so a person doing two roles is two rows.

   ⚠️ ONE IMPLEMENTATION, TWO TABS. Every function below takes `phase` — the
   crewGridView key, 'preprod' or 'post' — and looks the rest up in PHASE_TABS. There
   is deliberately no second copy of the calendar, the drag, the counter or the row: a
   fix to one is a fix to both, and the two tabs cannot drift into behaving differently.
   Adding a third phase is adding a PHASE_TABS entry and a view key, nothing more.
   They share the .prep-* CSS for the same reason — "essentially a copy of
   Pre-production's functionality" is the brief, and one grid is how that stays true.

   ⚠️ THE ONE RULE THESE SCREENS ARE BUILT AROUND: there are NO TOTALS. No rate × days,
   no aggregation, no rollup, no section total, no totals column. Rate and days are
   data on rows and nothing on this screen adds anything up. If a later phase wants a
   figure here, that is a decision to be taken deliberately, not a gap to fill in.
   (The only number on the screen that is not a row's own is the department heading's
   roster count, which deptHeaderHTML() renders on every crew screen in the app and
   which counts rows, not prep data.)

   ---- what lives where ----
   DAYS       — p.prepSchedule[entryId].days / p.postSchedule[entryId].days. A plain
                editable number and the AUTHORITATIVE figure: not derived, not computed,
                not reconciled against the date marks or against shoot days.
   DATE MARKS — the same record's .dates, a FLAT ARRAY of 'YYYY-MM-DD'. Their purpose is
                showing NON-CONTIGUOUS patterns (one day, gap, three days, gap, two).
                Click-and-drag is a selection affordance only — it is never stored as a
                range, a start/end pair, or anything but the flat list.
   RATE       — NOT here. It is the entry's own existing `rate`, read through
                resolveEntryRate() and written through saveEntryRate(), the exact same
                field the Roles view and Budget read. There is deliberately ONE rate,
                now across THREE phases: editing it here changes it everywhere. Do not
                add a prep-specific or edit-specific rate.
   ⚠️ TWO SEPARATE STORES, ONE SHAPE. p.prepSchedule and p.postSchedule are parallel and
   independent — booking someone 10 prep days says nothing about their edit days, and
   nothing anywhere copies, defaults or reconciles one from the other.

   ⚠️ MARKS ARE INDICATIVE AND NOT BOUND TO THE DAYS NUMBER. "Booked 5, marked 7" is a
   VALID state — someone spreading five days' work across seven. There is deliberately
   NO warning, NO validation, NO reconciliation, NO colour change and NO badge for it, and
   the number is never clamped to the marks or the marks to the number.
   ⚠️ AMENDED IN PHASE BW, IN ONE DIRECTION ONLY. The rule above said "no badge for a
   mismatch, in either direction". The user asked for the UNDER case to be flagged: "it is
   worth flagging if they don't have the minimum amount of days". So:
     marked > booked — still silent, still valid, still the five-over-six case above.
     marked < booked — FLAGGED, because it is a booking with nowhere to sit: days you are
                       paying for that have not been placed on a calendar.
   The flag is amber, advisory, and blocks nothing; it lives in the Dates popup and on the
   Dates column's button (see datesPhaseTally / datesEntryShort). ⚠️ It is a WARNING, not
   validation — nothing reconciles, nothing is clamped, and the state is still saveable. Do
   not extend it into the over direction, and do not make it refuse anything.
   ⚠️ These two TABS still show no flag of any kind. It belongs to the Roles screen, where the
   booked number and the calendar are in the same row; here they are the whole point of the
   screen and a badge on every row would be noise.

   ---- why a parallel structure and not a field on the entry ----
   p.crewEntries' shape was settled deliberately by Phase BF; these are parallel, not
   an extension of it. The cost of that choice is that phase data outlives the entry it
   belongs to unless something removes it, which is why prunePhaseSchedules() exists and
   is called from both entry-removal paths — see removeCrewEntries() and deleteCrew().
*/

/* The two tabs, and everything that differs between them. Keyed by crewGridView value
   — that key IS the phase throughout this section, so there is no second mapping to
   keep in step. ⚠️ `store` is a PROJECT key: adding a phase here adds a project field. */
const PHASE_TABS = {
  preprod: {
    /* ⚠️ No `label` here. There used to be one ('Pre-production'), and nothing ever read
       it — the sub-tab strip has always taken its labels from viewLabels. Left in place
       through the rename it would have been a second, silently-stale copy of a tab name.
       If a phase ever does need a display name of its own, read it from viewLabels. */
    store:'prepSchedule', daysTitle:'Pre-Prod days',
    // where the calendar opens when nothing is marked yet: prep runs UP TO the shoot,
    // so it anchors on the first shoot day; the edit runs after it, so post anchors on
    // the last. Read-only either way — neither tab ever touches a shoot day.
    anchor:'first',
    calHint:"Click or drag to mark the days this person is needed in prep. Marks are indicative — they don't have to match the booked number."
  },
  post: {
    store:'postSchedule', daysTitle:'Edit days',
    anchor:'last',
    calHint:"Click or drag to mark the days this person is needed in the edit. Marks are indicative — they don't have to match the booked number."
  }
};
const isPhaseTab = (view) => Object.prototype.hasOwnProperty.call(PHASE_TABS, view);

/* ONE calendar open at a time across BOTH tabs — it holds the phase as well as the
   entry, because the same entry id exists on both and "open on Pre-production" must
   not render open on Post. (setCrewGridView() closes it on every tab switch anyway;
   this is the belt to that braces.) */
let phaseCalendarFor = null;   // {phase, entryId} or null
let phaseCalMonth = null;      // 'YYYY-MM' the open calendar is currently showing
const phaseCalOpen = (phase, entryId) =>
  !!phaseCalendarFor && phaseCalendarFor.phase===phase && phaseCalendarFor.entryId===entryId;
function closePhaseCalendar(){ phaseCalendarFor = null; phaseCalMonth = null; }

/* ---- storage accessors ----
   Read-only helpers never create a record: an entry with no data for a phase must stay
   absent from that phase's store entirely, so a project nobody has used the tab on
   carries no key at all. */
const phaseScheduleOf = (phase, p) => ((p||currentProject()||{})[PHASE_TABS[phase].store])||{};
const phaseRecordOf   = (phase, entryId, p) => phaseScheduleOf(phase, p)[entryId] || null;
const phaseDaysOf     = (phase, entryId, p) => { const r = phaseRecordOf(phase, entryId, p); return r && r.days!=null ? r.days : null; };
const phaseDatesOf    = (phase, entryId, p) => { const r = phaseRecordOf(phase, entryId, p); return Array.isArray(r&&r.dates) ? r.dates : []; };
/* the two named readers the REST of the app uses (fronting, Budget). Thin aliases, so
   there is still exactly one implementation underneath them. */
const prepDaysOf = (entryId, p) => phaseDaysOf('preprod', entryId, p);
const postDaysOf = (entryId, p) => phaseDaysOf('post', entryId, p);

/* the ONE write path into either store. Normalises on the way out (dates sorted and
   deduplicated) and deletes rather than storing an empty husk — the same idiom as
   saveEntryRate()'s "clearing the field deletes the key". */
function phaseWrite(phase, p, entryId, mutate){
  if(!p || !entryId) return;
  const store = PHASE_TABS[phase].store;
  p[store] = p[store] || {};
  const existing = p[store][entryId];
  const rec = { days: existing && existing.days!=null ? existing.days : null,
                dates: Array.isArray(existing&&existing.dates) ? existing.dates.slice() : [] };
  mutate(rec);
  const dates = [...new Set(rec.dates||[])].sort();
  if(rec.days==null && !dates.length) delete p[store][entryId];
  else p[store][entryId] = { days: rec.days, dates };
  if(!Object.keys(p[store]).length) delete p[store];
}

/* Pruning. Called from removeCrewEntries() (single + bulk removal) and from
   deleteCrew() (which does not route through it). Takes a Set of entry ids.
   ⚠️ Phase BT — clears EVERY phase store, not just prep. A new phase added to
   PHASE_TABS is pruned by both call sites for free; one hand-named store here would
   have been the thing left dangling. */
function prunePhaseSchedules(p, entryIds){
  if(!p) return;
  const kill = entryIds instanceof Set ? entryIds : new Set(entryIds||[]);
  Object.values(PHASE_TABS).forEach(({store})=>{
    if(!p[store]) return;
    kill.forEach(id=>{ delete p[store][id]; });
    if(!Object.keys(p[store]).length) delete p[store];
  });
  /* ⚠️ Phase BU — the MEMBERSHIP lists are pruned here too, and walked from CREW_PHASES
     for the reason this function walks PHASE_TABS rather than naming two stores by hand:
     a phase added later is pruned for free. That includes p.onShoot, which nothing pruned
     before this phase — a removed entry's id sat in it indefinitely, harmless only because
     every read tests membership of a list of entries that still exist. Now that the same
     list shape drives what a phase tab SHOWS, a stale id is one bad interaction away from
     mattering, so it goes. */
  CREW_PHASES.forEach(({members})=>{
    if(!Array.isArray(p[members])) return;
    p[members] = p[members].filter(id=>!kill.has(id));
  });
  /* Phase BX — overtime is entry-keyed too, so it is pruned in the same pass. This function is
     the one place every entry-keyed project store gets cleaned up; a new one added anywhere
     else and not listed here is a dangling record waiting to be found. */
  if(p.overtime){
    kill.forEach(id=>{ delete p.overtime[id]; });
    if(!Object.keys(p.overtime).length) delete p.overtime;
  }
}

/* Days. Written on `onchange`, so it only fires when the value actually changed and
   focus has left. Garbage reverts by re-rendering without saving, exactly as
   saveEntryRate() does — the field visibly returns to the last valid value rather
   than sitting there holding text that was never stored. Empty clears it. */
async function setPhaseDays(phase, entryId, rawValue){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  const trimmed = (rawValue||'').trim();
  let next = null;
  if(trimmed!==''){
    const n = Number(trimmed);
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }
    next = n;
  }
  phaseWrite(phase, p, entryId, rec=>{ rec.days = next; });
  /* ⚠️ Phase CF — NOTHING TO WRITE HERE ANY MORE. Typing a number still puts them in the
     phase and clearing it still takes them out, but both are now consequences of the number
     itself (see entryInPhase) rather than a second write alongside it. This block used to
     add them to p[ph.members] and deliberately never removed them on clear — that asymmetry
     is exactly what "days decide it" replaces. */
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* ---- the per-entry calendar ---- */
function phaseCalAnchorMonth(phase, entryId){
  const marks = phaseDatesOf(phase, entryId);
  if(marks.length) return marks[0].slice(0,7);
  // otherwise open on something meaningful: the shoot day this phase sits next to
  // (first for prep, last for the edit), else the project's start date, else this
  // month. Read-only — neither tab ever touches shoot days.
  const p = currentProject();
  const days = projectDays(p&&p.id);
  const anchorDay = PHASE_TABS[phase].anchor==='last' ? days[days.length-1] : days[0];
  const iso = (anchorDay && anchorDay.date) || (p && p.startDate) || '';
  return /^\d{4}-\d{2}/.test(iso) ? iso.slice(0,7) : new Date().toISOString().slice(0,7);
}
function togglePhaseCalendar(phase, entryId){
  if(phaseCalOpen(phase, entryId)) closePhaseCalendar();
  else { phaseCalendarFor = {phase, entryId}; phaseCalMonth = phaseCalAnchorMonth(phase, entryId); }
  renderProjectBody();
}
function shiftPhaseCalMonth(delta){
  if(!phaseCalMonth) return;
  const [y,m] = phaseCalMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  phaseCalMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  renderProjectBody();
}
async function commitPhaseDates(phase, entryId, isoList){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  phaseWrite(phase, p, entryId, rec=>{ rec.dates = isoList||[]; });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
  /* ⚠️ Phase BW — the Dates popup lives on #globalOverlay, which renderProjectBody() does not
     touch. Without this every mark made in the popup would save and then not appear until you
     closed it. Harmless when nothing is open — the dialog builders each return '' . */
  renderGlobalOverlay();
}
async function clearPhaseDates(phase, entryId){ await commitPhaseDates(phase, entryId, []); }

/* Click-and-drag selection. The drag is a UI affordance for picking several dates
   quickly and nothing more — what gets stored is still the flat array.
   It works off a local Set and direct classList updates rather than re-rendering per
   cell, because a re-render mid-drag would destroy the element the pointer is over.
   ONE save and ONE render happen on mouseup. The first cell decides the direction
   (dragging from an unmarked day marks; from a marked day unmarks), so a drag can
   clear a run as easily as it makes one. A plain click is a one-cell drag. */
let prepDrag = null;   // {phase, entryId, mode:'add'|'remove', set:Set}
function phaseDayDown(phase, entryId, iso, ev){
  if(ev) ev.preventDefault();
  const cur = new Set(phaseDatesOf(phase, entryId));
  prepDrag = { phase, entryId, mode: cur.has(iso) ? 'remove' : 'add', set: cur };
  prepDragApply(iso);
}
function phaseDayEnter(iso){ if(prepDrag) prepDragApply(iso); }
function prepDragApply(iso){
  if(!prepDrag) return;
  if(prepDrag.mode==='add') prepDrag.set.add(iso); else prepDrag.set.delete(iso);
  const el = document.querySelector(`.prep-cal-day[data-iso="${iso}"]`);
  if(el) el.classList.toggle('marked', prepDrag.set.has(iso));
}
document.addEventListener('mouseup', ()=>{
  if(!prepDrag) return;
  const d = prepDrag; prepDrag = null;
  commitPhaseDates(d.phase, d.entryId, [...d.set]);
});

const PREP_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const PREP_WEEKDAYS = ['M','T','W','T','F','S','S'];

/* ============================ THE DATES POPUP (Phase BW) ============================
   One person, all three phases, one calendar. Opened from the Dates column on Roles (DAYS
   mode) and replaces the inline single-phase calendar that column used to expand into.

   WHY A POPUP. The inline version could only ever show the phase whose icon you clicked, in
   a 56px cell. The question being answered is "when is this person actually here", and that
   is not answerable one phase at a time: prep butting into the shoot, or an edit starting
   before the shoot wraps, are exactly what you are looking for. So all three render at once —
   the one you are editing filled in its colour, the other two as dots under the date.

   ⚠️ SHOOT IS READ-ONLY, AND DERIVED. Its dates are the shoot days this entry holds a
   position on (d.positions), which the Production grid owns. There is nowhere to store a
   "shoot date" against a person that isn't a shoot day, so the grid refuses the click and
   says why rather than accepting an edit it would have to throw away.

   ⚠️ Its own state, NOT phaseCalendarFor. That flag belongs to the Pre-Prod/Post tabs' inline
   calendars; sharing it would mean opening this popup could render one of those tabs expanded
   underneath, and closing one would close the other. They are never on screen together, and
   they stay independent so it can't matter.
   ⚠️ Lives on #globalOverlay, like the roles menu and the two role dialogs, so it survives the
   re-render that every edit inside it triggers. */
let datesDialogFor = null;     // entry id, or null
let datesDialogPhase = 'preprod';
let datesDialogMonth = null;   // 'YYYY-MM'
/* ⚠️ THE POPUP NEEDS ITS OWN ANCHOR, because it can be sitting on the SHOOT phase and
   phaseCalAnchorMonth() cannot: that function reads PHASE_TABS[phase], and PHASE_TABS holds
   only the two tabs that exist — preprod and post. Passing 'days' to it throws on
   `.store` of undefined. The shoot anchors on the person's own first shoot date, else the
   project's first shoot day, else the project start. */
function datesAnchorMonth(phase, entryId){
  const marks = datesPhaseMarks(phase, entryId);
  if(marks.length) return marks[0].slice(0,7);
  if(phase!=='days') return phaseCalAnchorMonth(phase, entryId);
  const p = currentProject();
  const first = projectDays(p && p.id)[0];
  const iso = (first && first.date) || (p && p.startDate) || '';
  return /^\d{4}-\d{2}/.test(iso) ? iso.slice(0,7) : new Date().toISOString().slice(0,7);
}
function openDatesDialog(entryId, phase){
  datesDialogFor = entryId;
  datesDialogPhase = phase || 'preprod';
  datesDialogMonth = datesAnchorMonth(datesDialogPhase, entryId);
  renderGlobalOverlay();
}
function closeDatesDialog(){ datesDialogFor = null; datesDialogMonth = null; renderGlobalOverlay(); }
/* ⚠️ Phase CF — THE POPUP IS THE PERSON'S CALENDAR, and this is how you move around inside it.
   `datesDialogFor` is still an ENTRY id, because a mark has to be written against one role —
   prep days belong to the prep booking, not to the human in the abstract. What changed is
   that the calendar SHOWS every role that person holds; this switches which one you are
   writing to, without closing and reopening from another row. */
function setDatesDialogEntry(entryId){
  if(!entryId || entryId===datesDialogFor) return;
  datesDialogFor = entryId;
  /* keep the month you are looking at if this role has anything there, otherwise go to where
     its own dates are — the same rule setDatesDialogPhase() uses when you change phase */
  const inView = datesPhaseMarks(datesDialogPhase, entryId).some(iso=>iso.slice(0,7)===datesDialogMonth);
  if(!inView) datesDialogMonth = datesAnchorMonth(datesDialogPhase, entryId);
  renderGlobalOverlay();
}
function setDatesDialogPhase(phase){
  datesDialogPhase = phase;
  /* re-anchor on the phase you have just switched to, but only when the month you are
     looking at holds nothing for it — otherwise switching phases to compare two of them in
     the same month would jump you somewhere else mid-comparison. */
  const inView = datesPhaseMarks(phase, datesDialogFor).some(iso=>iso.slice(0,7)===datesDialogMonth);
  if(!inView) datesDialogMonth = datesAnchorMonth(phase, datesDialogFor);
  renderGlobalOverlay();
}
function shiftDatesDialogMonth(delta){
  if(!datesDialogMonth) return;
  const [y,m] = datesDialogMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  datesDialogMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  renderGlobalOverlay();
}
/* ⚠️ THE ONE READER for "which dates does this entry hold in this phase", and the only place
   that knows the shoot is derived rather than stored. Everything in the popup — the marks, the
   counts, the shortfall flag — goes through it, so the read-only phase cannot end up computed
   two different ways. */
function datesPhaseMarks(phase, entryId){
  const p = currentProject(); if(!p || !entryId) return [];
  if(phase==='days'){
    return projectDays(p.id).filter(d=>entryOnDay(entryId, d) && /^\d{4}-\d{2}-\d{2}/.test(d.date||''))
      .map(d=>d.date.slice(0,10)).sort();
  }
  return phaseDatesOf(phase, entryId, p);
}
/* booked days vs dates marked, per phase.
   ⚠️ THE SHOOT CANNOT BE SHORT, by construction: its booked figure and its marks are the same
   set of shoot days, so `booked` reads from the marks rather than from a stored number. */
function datesPhaseTally(phase, entryId){
  const p = currentProject();
  const marked = datesPhaseMarks(phase, entryId).length;
  const booked = phase==='days' ? marked : (phaseDaysOf(phase, entryId, p) || 0);
  return { booked, marked, short: Math.max(0, booked - marked) };
}
/* any phase on this entry with dates still to place — what the row's button reports */
const datesEntryShort = entryId =>
  CREW_PHASES.filter(ph=>ph.view!=='days').reduce((n,ph)=>n + datesPhaseTally(ph.view, entryId).short, 0);
const datesEntryMarks = entryId =>
  CREW_PHASES.reduce((n,ph)=>n + datesPhaseMarks(ph.view, entryId).length, 0);

/* the row's cell: one button, carrying how many dates are marked and whether any phase is
   short — so a shortfall is findable without opening all 41 rows. */
function datesCellHTML(e){
  const marks = datesEntryMarks(e.id);
  const short = datesEntryShort(e.id);
  const label = short ? `${short} to place` : marks ? `${marks} date${marks===1?'':'s'}` : 'Dates';
  const title = short
    ? `${short} booked day${short===1?'':'s'} not yet on the calendar — click to place them`
    : marks ? `${marks} date${marks===1?'':'s'} marked across prep, the shoot and the edit` : 'No dates marked yet';
  return `<div class="roles-grid-cell dates-cell" data-label="Dates">
    <button type="button" class="dates-btn${marks?' has-marks':''}${short?' short':''}"
      onclick="event.stopPropagation();openDatesDialog('${e.id}')" title="${esc(title)}">
      ${icon('calendar')}${esc(label)}${short?' <span aria-hidden="true">⚠</span>':''}
    </button></div>`;
}
function datesDialogHTML(){
  if(!datesDialogFor) return '';
  const p = currentProject(); if(!p) return '';
  const e = entryById(datesDialogFor, p); if(!e) return '';
  const person = crewById(e.crewId) || {};
  const personEntries = entriesForCrew(e.crewId, p);
  const multi = personEntries.length > 1;
  /* ⚠️ Phase CH — EACH PHASE CARRIES A SECOND NUMBER: what this person's OTHER roles hold in
     it. Without it the popup could say "Shoot —" for Tegid's Executive Producer booking while
     he is on all six shoot days as DOP, which is true of the ROLE and misleading about the
     PERSON — and this popup is the person's calendar now. The dots in the grid already carry
     it per date; this is the same fact at a glance, in the numbers.
     ⚠️ DISTINCT DATES, not a sum: two roles working the same day is one day of that person's
     life, and adding them would report a week of work as ten days. */
  const phases = CREW_PHASES.map(ph=>{
    const elsewhere = personEntries.filter(en=>en.id!==datesDialogFor)
      .map(en=>({role: en.role||'no role', marks: datesPhaseMarks(ph.view, en.id)}))
      .filter(x=>x.marks.length);
    return {
      ph, cls: ph.view==='preprod' ? 'prep' : ph.view==='days' ? 'shoot' : 'post',
      tally: datesPhaseTally(ph.view, datesDialogFor),
      otherN: new Set(elsewhere.flatMap(x=>x.marks)).size,
      otherWho: elsewhere.map(x=>`${x.marks.length} as ${x.role}`).join(' · ')
    };
  });
  const sel = phases.find(x=>x.ph.view===datesDialogPhase) || phases[0];
  const readonly = sel.ph.view==='days';
  const ym = datesDialogMonth || datesAnchorMonth(sel.ph.view, datesDialogFor);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday-first
  const mine = new Set(datesPhaseMarks(sel.ph.view, datesDialogFor));
  /* ⚠️ Phase CF — "OTHERS" IS NOW EVERY OTHER (ROLE × PHASE) THIS PERSON HOLDS, not just the
     other two phases of this one entry. That is the whole point of the change: Sabrina is Line
     Producer in prep and post and a different role on the shoot, and placing her prep dates
     without being able to see the shoot dates her OTHER role holds is how you book someone
     twice. Computed once here, not per cell — it is up to nine sets on a two-role person. */
  const others = [];
  personEntries.forEach(en=>{
    CREW_PHASES.forEach(ph2=>{
      if(en.id===datesDialogFor && ph2.view===sel.ph.view) return;   // that pair IS `mine`
      const set = new Set(datesPhaseMarks(ph2.view, en.id));
      if(!set.size) return;
      others.push({
        cls: ph2.view==='preprod' ? 'prep' : ph2.view==='days' ? 'shoot' : 'post',
        head: ph2.head + (multi ? ' · ' + (en.role || 'no role') : ''),
        set
      });
    });
  });
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="prep-cal-day empty"></span>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hits = others.filter(o=>o.set.has(iso));
    /* ⚠️ ONE DOT PER PHASE, not per matching set. A two-role person on the same shoot day in
       both roles hits twice, and two identical dots under one date says nothing the first one
       didn't. The TITLE still names every role that holds it. */
    const dots = hits.length
      /* `cls` IS the token suffix — prep / shoot / post — so the dot's colour comes straight
         from the same variable the phase circle and the calendar tint use. */
      ? `<span class="dates-others">${[...new Set(hits.map(o=>o.cls))].map(cls=>`<i style="background:var(--phase-${cls})"></i>`).join('')}</span>` : '';
    const holds = [mine.has(iso)?(sel.ph.head + (multi ? ' · ' + (e.role||'no role') : '')):null]
      .concat(hits.map(o=>o.head)).filter(Boolean);
    const title = holds.length ? `${fmtDate(iso)||iso} — ${holds.join(' + ')}` : (fmtDate(iso)||iso);
    /* ⚠️ Same class and the same handlers as the inline calendar, so the click-and-drag
       machinery (phaseDayDown/phaseDayEnter/prepDragApply and the document mouseup) is shared
       rather than reimplemented. Safe because only ONE calendar is ever in the DOM: Roles'
       inline band was removed in this phase, and the Pre-Prod/Post tabs are a different tab
       body. prepDragApply()'s document-wide querySelector depends on that. */
    cells.push(`<span class="prep-cal-day${mine.has(iso)?' marked':''}" data-iso="${iso}" title="${esc(title)}"
      ${readonly?'':`onmousedown="phaseDayDown('${sel.ph.view}','${datesDialogFor}','${iso}',event)" onmouseenter="phaseDayEnter('${iso}')"`}>${d}${dots}</span>`);
  }
  /* the bracketed figure is ANOTHER ROLE'S — bracketed and italic because it is not yours to
     edit from here, and reads as an aside rather than as a second total */
  const phaseBtn = x => `<button type="button" class="dates-phase ${x.cls}${x.ph.view===sel.ph.view?' on':''}"
      onclick="setDatesDialogPhase('${x.ph.view}')" aria-pressed="${x.ph.view===sel.ph.view?'true':'false'}"
      title="${esc(`${x.tally.marked} marked as ${e.role||'no role'}`)}${x.otherN?esc(` · ${x.otherWho} — switch role above to change those`):''}">
      <span class="dates-dot"></span>
      <span class="dates-phase-lbl">${x.ph.head}</span>
      <span class="dates-phase-n">${x.tally.marked||'—'}${
        x.otherN ? `<span class="dates-phase-other">(${x.otherN})</span>` : ''
      }${x.tally.short?' ⚠':''}</span>
    </button>`;
  /* ⚠️ THE SHORTFALL FLAG, and it is deliberately ONE-DIRECTIONAL. Marking MORE dates than
     booked days is a normal, valid state and gets no comment: five days' work spread over six
     is exactly the case the brief gave. Marking FEWER means a booking with nowhere to be —
     that is worth saying, so it is said. See PHASE_TABS for the rule this replaced. */
  const shortHTML = (!readonly && sel.tally.short) ? `<div class="dates-short">
      <span aria-hidden="true">⚠</span>
      <span><strong>${sel.tally.short} of ${sel.tally.booked} booked ${sel.ph.head.toLowerCase()} day${sel.tally.booked===1?'':'s'} not on the calendar yet.</strong>
        Marking more days than booked is fine — five days' work can spread over six — but fewer means a booking with nowhere to sit.</span>
    </div>` : '';
  const countHTML = readonly
    ? `<span class="dates-count">${sel.tally.marked} shoot day${sel.tally.marked===1?'':'s'} — set on the Production tab</span>`
    : `<span class="dates-count">${sel.tally.booked||'No'} day${sel.tally.booked===1?'':'s'} booked · ${sel.tally.marked} marked</span>`;
  return `<div class="modal-overlay" onclick="if(event.target===this) closeDatesDialog()">
    <div class="modal-box dates-box" onclick="event.stopPropagation()">
      <div class="dates-head">
        <div class="dates-name">${esc(person.name||'—')}</div>
        <div class="dates-role">${multi ? `${personEntries.length} roles on this project` : esc(e.showAs||e.role||'')}</div>
      </div>
      ${multi ? `<div class="dates-roles" role="group" aria-label="Which role you are marking">
        ${personEntries.map(en=>`<button type="button" class="dates-role-btn${en.id===datesDialogFor?' on':''}"
            aria-pressed="${en.id===datesDialogFor?'true':'false'}"
            onclick="setDatesDialogEntry('${en.id}')"
            title="${en.id===datesDialogFor?'You are marking dates for this role':'Mark dates for this role instead'}"
          >${esc(en.role||'no role')}</button>`).join('')}
      </div>` : ''}
      <div class="dates-phases">${phases.map(phaseBtn).join('')}</div>
      <div class="prep-cal dates-cal ${sel.cls}${readonly?' readonly':''}">
        <div class="prep-cal-head">
          <span class="prep-cal-nav" onclick="shiftDatesDialogMonth(-1)" title="Previous month">‹</span>
          <span class="prep-cal-title">${PREP_MONTH_NAMES[m-1]} ${y}</span>
          <span class="prep-cal-nav" onclick="shiftDatesDialogMonth(1)" title="Next month">›</span>
          ${(!readonly && mine.size) ? `<span class="prep-cal-clear" onclick="clearPhaseDates('${sel.ph.view}','${datesDialogFor}')">Clear ${esc(sel.ph.head.toLowerCase())}</span>` : ''}
        </div>
        <div class="prep-cal-grid">
          ${PREP_WEEKDAYS.map(w=>`<span class="prep-cal-wd">${w}</span>`).join('')}
          ${cells.join('')}
        </div>
      </div>
      ${shortHTML}
      <div class="dates-foot">
        ${countHTML}
        <button class="small" style="margin-left:auto;" onclick="closeDatesDialog()">Done</button>
      </div>
      <div class="hint" style="margin-top:8px;">${readonly
        ? 'Shoot dates come from the shoot days this person is on — tick those on the Production tab, or from the Shoot column on Roles.'
        : `Click or drag to mark the days. Dots under a date are ${multi?'this person’s other roles and phases':'the other phases'}, so you can see where they overlap.`}${
        multi ? ' You are marking <strong>'+esc(e.role||'no role')+'</strong> — a bracketed <em>(n)</em> above is days held by their other role; use the buttons to switch to it.' : ''}</div>
    </div>
  </div>`;
}
function phaseCalendarHTML(phase, entryId){
  const ym = phaseCalMonth || phaseCalAnchorMonth(phase, entryId);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday-first
  const marked = new Set(phaseDatesOf(phase, entryId));
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="prep-cal-day empty"></span>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push(`<span class="prep-cal-day${marked.has(iso)?' marked':''}" data-iso="${iso}"
      onmousedown="phaseDayDown('${phase}','${entryId}','${iso}',event)" onmouseenter="phaseDayEnter('${iso}')">${d}</span>`);
  }
  return `<div class="prep-cal">
      <div class="prep-cal-head">
        <span class="prep-cal-nav" onclick="shiftPhaseCalMonth(-1)" title="Previous month">‹</span>
        <span class="prep-cal-title">${PREP_MONTH_NAMES[m-1]} ${y}</span>
        <span class="prep-cal-nav" onclick="shiftPhaseCalMonth(1)" title="Next month">›</span>
        ${marked.size ? `<span class="prep-cal-clear" onclick="clearPhaseDates('${phase}','${entryId}')">Clear marks</span>` : ''}
      </div>
      <div class="prep-cal-grid">
        ${PREP_WEEKDAYS.map(w=>`<span class="prep-cal-wd">${w}</span>`).join('')}
        ${cells.join('')}
      </div>
      <div class="hint">${esc(PHASE_TABS[phase].calHint)}</div>
    </div>`;
}

/* ⚠️ REMOVED — the soft counter ("5 days booked · 7 dates marked") that rendered under
   the rate/days inputs on Pre-production and Post, along with prepCounterText() and the
   .prep-counter rules. It restated the days input sitting directly above it and the
   calendar button's own marks state beside it, so every row said the same thing three
   times over. The two figures still read from the inputs and the marker; nothing else
   consumed this text. Do not reintroduce it as a "summary" — the row IS the summary. */

/* Pre-production (T-2.9) and Post (Phase BT) PERSON BLOCK (Phase BK; collapsible BL).
   ⚠️ Takes a PERSON BLOCK and the phase. Booked days, the entry rate and the date marks
   are ALL entry-level (both stores are keyed by entry id), so every one of them sits on
   a ROLE ROW — the name line here carries nothing but the person, because these tabs
   have no person-level fact of their own. ⚠️ Still no totals of any kind on either
   screen — nothing here sums, rolls up or multiplies anything, and BK/BL/BT added none.
   The role cell reuses roleBannerHTML() exactly as the Roles view has it — since Phase
   BM that is one chip which IS the roles-menu trigger, no separate "+" marker. */
function phaseRowHTML(block, phase){
  const p = currentProject(), shootDays = projectDays();
  const fronted = frontedEntryOfBlock(block, p, shootDays);
  const rest = block.entries.filter(e=>e.id!==fronted.id);
  // an open date-marks calendar belonging to a stacked-away entry has to stay on
  // screen, so the block renders open in that one case — derived from phaseCalendarFor,
  // which already exists; NOT a new piece of open/closed state.
  const open = rest.some(e=>phaseCalOpen(phase, e.id));
  /* Phase BN — the fronted entry's Role/fields/calendar cells render straight onto
     the SAME .prep-grid div as the name (not a second, independently-gridded
     .pb-role-row), which is what let a single-role person's name and prep fields
     land on two separate lines. A stacked-away (extra) entry still gets its own
     .pb-role-row below, genuinely a new row. */
  const entryCellsHTML = (e, toggleHTML) => {
    const rate = resolveEntryRate(e.id, p);
    const days = phaseDaysOf(phase, e.id, p);
    const marks = phaseDatesOf(phase, e.id, p);
    const calOpen = phaseCalOpen(phase, e.id);
    return { calOpen, html: `<div class="prep-cell pb-role-cell" data-label="Role" style="grid-column:3;"><span class="roles-inline">${roleBannerHTML(e)}${toggleHTML}</span></div>
      <div class="prep-cell prep-fields" style="grid-column:4;">
        <div class="prep-fields-row">
          ${crewShowMoney?`<span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input" value="${rate.hasRate?rate.rate:''}" placeholder="—"
            title="Day rate — the same rate as the Roles view and Budget"
            onclick="event.stopPropagation()" onchange="saveEntryRate('${e.id}', this.value)"></span>`:''}
          <input type="text" inputmode="numeric" class="budget-rate-input prep-days-input" value="${days!=null?days:''}" placeholder="—"
            title="${esc(PHASE_TABS[phase].daysTitle)}"
            onclick="event.stopPropagation()" onchange="setPhaseDays('${phase}','${e.id}', this.value)">
        </div>
      </div>
      <div class="prep-cell prep-calcell" style="grid-column:5;">
        <button type="button" class="icon-btn prep-cal-btn${marks.length?' has-marks':''}"
          onclick="togglePhaseCalendar('${phase}','${e.id}')"
          title="${marks.length ? `${marks.length} date${marks.length===1?'':'s'} marked` : 'No dates marked'}"
          aria-label="Date marks">${icon('calendar')}</button>
      </div>
      ${calOpen ? `<div class="prep-calwrap">${phaseCalendarHTML(phase, e.id)}</div>` : ''}` };
  };
  const frontedCells = entryCellsHTML(fronted, personBlockToggleHTML(block, rest.length, open));
  const isEditing = editingCrewId===block.id;
  const head = `<div class="prep-grid pb-head${frontedCells.calOpen?' prep-grid-row-open':''}${crewShowMoney?'':' no-money'}">
    <div class="prep-cell prep-controls">${crewControlsHTML(block, {selectCbHTML:personBlockSelectCbHTML(block)})}</div>
    <div class="prep-cell prep-name" data-label="Name" title="${esc(block.name)}">${esc(block.name)}${repeatStarHTML(block.crewId)}</div>
    ${frontedCells.html}
  </div>`;
  const stack = rest.map(e=>{
    const cells = entryCellsHTML(e, '');
    return `<div class="prep-grid pb-role-row pb-role-extra${cells.calOpen?' prep-grid-row-open':''}${crewShowMoney?'':' no-money'}"${open?'':' style="display:none;"'}>${cells.html}</div>`;
  }).join('');
  /* Phase BQ — Pre-production carries the Edit pencil and its expansion like Roles and
     Days on site. It was the one sub-tab without one (Phase BJ: "no crew-record edit
     path of its own"), which meant the Controls column rendered a checkbox and a gap
     where every other tab has a pencil. Same crewControlsHTML/crewExpansionHTML pair
     the others use — no second edit path, and nothing about booked days/marks
     changes; this only reaches the crew RECORD, exactly as the pencil does elsewhere.
     Post inherits it by construction, being the same function. */
  return personBlockWrapHTML(block, head + stack,
    { editing:isEditing, open, expansionHTML:crewExpansionHTML(block, 'pb-editform') });
}

/* Day-checkbox grid for project locations — same pattern as Crew tab's Days on site.
   Ticking a day for a location sets it as that day's primary location if the day has
   none yet, otherwise adds it to that day's additional locations. */
/* ============ WHAT A LOCATION COSTS (Phase CO) ============
   ⚠️ THE ONE READER — every figure on the Locations tab, in the Budget and in the Per Day
   breakdown comes through resolveLocationCost(). A second place that decides what a venue
   costs is a second answer to the same question.

   ⚠️ WHERE EACH PIECE LIVES, and it is deliberately split:
     · the BILLING BASIS (mode, rate, hours) is a fact about the VENUE, so it lives on the
       location record and follows it to every project — with a per-project override on top,
       exactly the shape crew day rates already have (p.crewRateOverrides over the crew record),
       and a save-to-database icon to push the override back down when the venue's terms have
       actually changed rather than just this job's.
     · the EXTRAS are a fact about THIS SHOOT — a cleaning charge, an overrun, a breakage — so
       they live on the project and never follow the venue anywhere. */
const LOCATION_FEE_MODES = [
  ['buyout', 'Buyout',  'One agreed fee for the venue, split across the days it is used'],
  ['perday', 'Per day', 'The fee is charged for each day the location is used'],
  ['hourly', 'Hourly',  'The fee is charged per hour, for the hours below, on each day used']
];
const locFeeModeLabel = m => (LOCATION_FEE_MODES.find(x=>x[0]===m)||LOCATION_FEE_MODES[0])[1];
/* ⚠️ HOISTED from inside buildBudgetData, where it was a local called usesLocation. The day
   grid, the cost card and the budget all have to agree about "is this location used that day",
   and they were about to be three copies of one expression. Primary or additional counts. */
const locOnDay = (locId, d) => !!d && (d.locationId===locId
  || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId));
const locDaysUsed = (locId, p) => projectDays(p ? p.id : undefined).filter(d=>locOnDay(locId, d));
function resolveLocationCost(locId, p){
  const proj = p || currentProject() || {};
  const loc = locById(locId) || {};
  const rec = ((proj.locationCosts||{})[locId]) || {};
  const has = v => v!=null && v!=='';
  const mode = has(rec.mode) ? rec.mode : (loc.feeMode || 'buyout');
  const rate = has(rec.rate) ? parseRateNumber(rec.rate) : parseRateNumber(loc.fee);
  const hours = has(rec.hours) ? (Number(rec.hours)||0) : (Number(loc.feeHours)||0);
  const extras = (rec.extras||[]).filter(x=>x);
  return {
    mode, rate, hours, extras,
    /* ⚠️ Phase CP — PER-DAY OVERRIDES, keyed by shoot-day id: `{[dayId]:{rate,hours}}`. A
       half-day at a lower rate, or six hours on the Friday and ten on the Monday, is a real
       bill and "rate × number of days" cannot express it. Project-scoped only — a venue's
       record has no opinion about YOUR Tuesday. Absent = use the standard figure above, so a
       location nobody has fiddled with still costs rate × days. */
    days: rec.days || {},
    /* the venue's own VAT status, not a person's — see the AO note in buildBudgetData for why
       that distinction is the whole reason locations had no VAT before */
    vat: has(rec.vat) ? rec.vat : (loc.vatRegistered || ''),
    extrasTotal: extras.reduce((sum,x)=>sum + (parseRateNumber(x.amount)||0), 0),
    /* true when THIS PROJECT is saying something different from the venue's own record —
       what the save-to-database icon offers to reconcile */
    isOverride: has(rec.mode) || has(rec.rate) || has(rec.hours) || has(rec.vat)
  };
}
/* one day's figure for a per-day or hourly location: its own override if it has one, the
   standard figure if not. ⚠️ Read through these two and nothing else, or a day's cost on the
   card and the same day's cost in the budget will drift. */
const locDayOverride = (c, dayId, field) => {
  const v = ((c.days||{})[dayId]||{})[field];
  return (v!=null && v!=='') ? v : null;
};
function locDayCost(c, d){
  const r = locDayOverride(c, d.id, 'rate');
  const rate = r!=null ? parseRateNumber(r) : c.rate;
  if(c.mode!=='hourly') return rate;
  const h = locDayOverride(c, d.id, 'hours');
  return rate * (h!=null ? (Number(h)||0) : c.hours);
}
/* the FEE for a given set of days, mode by mode. ⚠️ Extras are NOT in here — they are charged
   once, project-wide, and adding them per day would multiply them by the days used. */
function locationFeeFor(locId, dayList, p, allDaysUsed){
  const c = resolveLocationCost(locId, p);
  const {mode, rate} = c;
  const usedDays = (dayList||[]).filter(d=>locOnDay(locId, d));
  /* ⚠️ Phase CP — SUMMED DAY BY DAY, not rate × count, so a day carrying its own rate or its
     own hours is billed at what it actually cost. With no overrides anywhere this returns the
     identical number the multiplication did. */
  if(mode==='perday' || mode==='hourly') return usedDays.reduce((sum,d)=>sum + locDayCost(c, d), 0);
  if(!rate) return 0;
  const usedHere = usedDays.length;
  /* buyout: ONE fee, apportioned across the days it is actually used on, so Per Day can carry
     its share. ⚠️ A location ticked on no day at all still costs its fee — it is booked — and
     is charged project-wide only, which is why the caller passes allDaysUsed. */
  const totalUsed = allDaysUsed!=null ? allDaysUsed : locDaysUsed(locId, p).length;
  if(!totalUsed) return null;                 // caller decides: project-wide charge, or nothing
  return (rate / totalUsed) * usedHere;
}
/* ---- the writers. All project-scoped except saveLocationFeeToDatabase(). ---- */
function locCostRec(locId, p){
  const proj = p || currentProject();
  proj.locationCosts = proj.locationCosts || {};
  proj.locationCosts[locId] = proj.locationCosts[locId] || {};
  return proj.locationCosts[locId];
}
async function setLocationCostField(locId, field, value){
  const rec = locCostRec(locId);
  const v = (value||'').trim();
  /* ⚠️ AN OVERRIDE THAT MATCHES THE DATABASE IS NOT AN OVERRIDE. Picking "Buyout" on a venue
     whose record already says Buyout must clear the key, not store it — otherwise the row
     claims to be "set for this project only" while agreeing with the record it is overriding,
     and the save-to-database icon offers to save something that is already saved. */
  const loc = locById(locId) || {};
  const ownValue = field==='mode' ? (loc.feeMode||'buyout')
                 : field==='rate' ? String(loc.fee||'')
                 : field==='vat'  ? String(loc.vatRegistered||'')
                 : String(loc.feeHours||'');
  /* delete rather than storing '' — an absent override is what makes the venue's own record
     show through again, the same contract p.crewRateOverrides has */
  if(v==='' || v===ownValue) delete rec[field]; else rec[field] = v;
  if(!Object.keys(rec).length) delete (currentProject().locationCosts||{})[locId];
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
async function setLocationDayField(locId, dayId, field, value){
  const rec = locCostRec(locId);
  rec.days = rec.days || {};
  const cell = rec.days[dayId] = rec.days[dayId] || {};
  const v = (value||'').trim();
  if(v==='') delete cell[field]; else cell[field] = v;
  /* an empty cell is not an override — prune it, and the whole table with it, so a location
     that has been fiddled with and put back is byte-identical to one that never was */
  if(!Object.keys(cell).length) delete rec.days[dayId];
  if(!Object.keys(rec.days).length) delete rec.days;
  if(!Object.keys(rec).length) delete (currentProject().locationCosts||{})[locId];
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
async function addLocationExtra(locId){
  const rec = locCostRec(locId);
  rec.extras = rec.extras || [];
  rec.extras.push({id:uid(), label:'', amount:''});
  renderProjectBody();
  document.getElementById('locx-'+rec.extras[rec.extras.length-1].id)?.focus();
  saveInBackground('db:projects', projectsDB);
}
async function setLocationExtra(locId, extraId, field, value){
  const rec = locCostRec(locId);
  const x = (rec.extras||[]).find(e=>e.id===extraId); if(!x) return;
  x[field] = value;
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
async function removeLocationExtra(locId, extraId){
  const rec = locCostRec(locId);
  rec.extras = (rec.extras||[]).filter(e=>e.id!==extraId);
  if(!rec.extras.length) delete rec.extras;
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
/* ⚠️ The one write that leaves this project. Same shape and the same confirmation habit as
   saveCrewRateToDatabase(): pushing a project override down onto the shared record changes
   what every OTHER project sees, so it says so first. */
async function saveLocationFeeToDatabase(locId){
  const loc = locById(locId); if(!loc) return;
  const {mode, rate, hours} = resolveLocationCost(locId);
  if(!confirm(`Save ${locFeeModeLabel(mode).toLowerCase()} ${budgetFmt(rate)}${mode==='hourly'?` × ${hours} hrs`:''} to “${loc.name}” in the Locations database? Every project using this location will pick it up.`)) return;
  loc.feeMode = mode;
  loc.fee = String(rate||'');
  loc.feeHours = mode==='hourly' ? String(hours||'') : (loc.feeHours||'');
  loc.vatRegistered = resolveLocationCost(locId).vat || '';
  /* the override has become the record, so drop it — otherwise the row keeps claiming to
     differ from a database it now matches */
  const rec = locCostRec(locId);
  delete rec.mode; delete rec.rate; delete rec.hours; delete rec.vat;
  await saveDB('db:locations', locationsDB);
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}
/* ---- the cost panel that opens under a location row (Phase CQ) ----
   ⚠️ NO HEADING AND NO NAME. It hangs off the row that carries both; repeating them was the
   thing that made the old standalone "Location costs" section read as a second list of the
   same locations rather than as the detail behind the first one. */
function locCostPanelHTML(l, days){
  const p = currentProject();
  const c = resolveLocationCost(l.id, p);
  const used = locDaysUsed(l.id, p).length;
  const rec = ((p.locationCosts||{})[l.id]) || {};
  const fee = locationFeeFor(l.id, days, p, used);
  const feeTotal = fee===null ? c.rate : fee;
  /* said in words, because "£4,200" against a venue tells you nothing about whether it is
     going to move when you tick another day */
  const basis = !c.rate ? 'No fee set'
    : c.mode==='perday' ? `${budgetFmt(c.rate)} × ${used} day${used===1?'':'s'}`
    : c.mode==='hourly' ? `${budgetFmt(c.rate)} × ${c.hours||0} hr${c.hours===1?'':'s'} × ${used} day${used===1?'':'s'}`
    : used ? `${budgetFmt(c.rate)} split across ${used} day${used===1?'':'s'}`
    : `${budgetFmt(c.rate)} — not ticked on any day yet, so charged once`;
  /* ⚠️ Phase CP — DAY BY DAY, for per-day and hourly only. A buyout has one fee by definition,
     so a per-day table under it would be inviting you to edit a number that does not exist.
     Placeholders carry the standard figure, so a blank cell is visibly "the usual" rather than
     zero, and typing in one costs that day differently without touching the others. */
  const usedDays = locDaysUsed(l.id, p);
  const dayRows = (c.mode==='buyout' || !usedDays.length) ? '' : `<div class="loc-days">
      <div class="loc-day-head" style="--locday-cols:${c.mode==='hourly'?2:1};"><span></span>${c.mode==='hourly'?'<span>Hours</span>':''}<span>Rate</span><span>Cost</span></div>
      ${usedDays.map(d=>`<div class="loc-day-row" style="--locday-cols:${c.mode==='hourly'?2:1};">
        <span class="loc-day-num" title="${esc(fmtDate(d.date)||'date not set')}">D${esc(d.dayNum||'?')}</span>
        ${c.mode==='hourly'?`<input type="text" inputmode="decimal" class="budget-rate-input" placeholder="${esc(String(c.hours||0))}"
          value="${esc(locDayOverride(c,d.id,'hours')||'')}" onchange="setLocationDayField('${l.id}','${d.id}','hours', this.value)">`:''}
        <input type="text" inputmode="decimal" class="budget-rate-input" placeholder="${esc(String(c.rate||0))}"
          value="${esc(locDayOverride(c,d.id,'rate')||'')}" onchange="setLocationDayField('${l.id}','${d.id}','rate', this.value)">
        <span class="loc-day-cost">${budgetFmt(locDayCost(c, d))}</span>
      </div>`).join('')}
    </div>`;
  const extras = c.extras.map(x=>`<div class="loc-extra-row">
      <input type="text" id="locx-${x.id}" class="loc-extra-label" value="${esc(x.label||'')}" placeholder="What for — cleaning, overrun…"
        onchange="setLocationExtra('${l.id}','${x.id}','label', this.value)">
      <span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input" value="${esc(x.amount||'')}" placeholder="0.00"
        onchange="setLocationExtra('${l.id}','${x.id}','amount', this.value)"></span>
      <button type="button" class="icon-btn danger-ic" onclick="removeLocationExtra('${l.id}','${x.id}')" title="Remove this charge" aria-label="Remove charge">${icon('trash')}</button>
    </div>`).join('');
  return `<div class="loc-cost-body">
    <div class="loc-cost-fields">
      <div><label>Charged as</label>
        <select onchange="setLocationCostField('${l.id}','mode', this.value)">
          ${LOCATION_FEE_MODES.map(([k,lbl,t])=>`<option value="${k}" ${c.mode===k?'selected':''} title="${esc(t)}">${lbl}</option>`).join('')}
        </select></div>
      <div><label>${c.mode==='hourly'?'Rate per hour':c.mode==='perday'?'Rate per day':'Fee'}</label>
        <span class="rate-with-save"><span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input"
          value="${esc(rec.rate!=null&&rec.rate!==''?rec.rate:(c.rate||''))}" placeholder="0.00"
          onchange="setLocationCostField('${l.id}','rate', this.value)"></span>
        <button type="button" class="icon-btn" onclick="saveLocationFeeToDatabase('${l.id}')" title="Saves to Database" aria-label="Save to the Locations database">${icon('save')}</button></span></div>
      ${c.mode==='hourly' ? `<div><label>Hours per day</label>
        <input type="text" inputmode="decimal" class="budget-rate-input" value="${esc(rec.hours!=null&&rec.hours!==''?rec.hours:(c.hours||''))}" placeholder="0"
          onchange="setLocationCostField('${l.id}','hours', this.value)"></div>` : ''}
      ${/* ⚠️ A TOGGLE, not a three-way select. "Not set" and "No" were two ways of saying the
            venue does not charge VAT and produced the identical figure, so the third state was
            a distinction the budget could not see. Same checkbox treatment as Roles' Buyout and
            VAT reg. cells. */''}
      <div class="loc-vat-field"><label>Charges VAT</label>
        <label class="loc-vat-toggle"><input type="checkbox" ${c.vat==='Yes'?'checked':''}
          onchange="setLocationCostField('${l.id}','vat', this.checked?'Yes':'No')"
          title="${c.vat==='Yes'?`Charging ${Math.round(VAT_RATE*100)}% VAT on this venue's bill`:'Not charging VAT'}"><span>${Math.round(VAT_RATE*100)}%</span></label></div>
    </div>
    <div class="hint">${esc(basis)}${c.vat==='Yes'?` · plus ${Math.round(VAT_RATE*100)}% VAT`:''}${c.isOverride?' · set for this project only — the save icon writes it to the database':''}</div>
    ${dayRows}
    ${extras ? `<div class="loc-extras">${extras}</div>` : ''}
    <div class="toolbar" style="margin:8px 0 0;">

      ${c.extrasTotal?`<span class="hint">${budgetFmt(c.extrasTotal)} of extras, charged once</span>`:''}
    </div>
  </div>`;
}
/* the tab's own banner — the same shape and the same pill as Crew ▸ Roles, cut to what a
   locations screen has to say: one total, and the toggle that hides it. ⚠️ Deliberately NOT
   budgetSummaryBarHTML(): that carries phase scopes and crew tools which mean nothing here,
   and bending it to a second screen's needs is how one banner becomes two banners' worth of
   options. What it shares is the vocabulary — .bnr-tool, .budget-stat, the same words. */
function locBannerHTML(assigned, days){
  const p = currentProject();
  const total = assigned.reduce((sum,l)=>{
    const c = resolveLocationCost(l.id, p);
    const fee = locationFeeFor(l.id, days, p, locDaysUsed(l.id, p).length);
    return sum + (fee===null ? c.rate : fee) + c.extrasTotal;
  }, 0);
  const vat = assigned.reduce((sum,l)=>{
    const c = resolveLocationCost(l.id, p);
    if(c.vat!=='Yes') return sum;
    const fee = locationFeeFor(l.id, days, p, locDaysUsed(l.id, p).length);
    return sum + ((fee===null ? c.rate : fee) + c.extrasTotal) * VAT_RATE;
  }, 0);
  return `<div class="phase-banner loc-banner">
    <div class="bnr-totals">${locShowMoney
      ? `<div class="budget-stat"><div class="num">${budgetFmt(total + vat)}</div>
           <div class="lbl">Locations${vat?`<span class="budget-stat-note">inc. ${budgetFmt(vat)} VAT</span>`:''}</div>
           ${vat?`<div class="budget-stat-sub">xVAT ${budgetFmt(total)}</div>`:''}</div>`
      : `<div class="bnr-totals-off">Location costs hidden. Turn on <strong>Budget</strong> to see what each venue costs — the day ticks work either way.</div>`}</div>
    <div class="bnr-toolrow" style="grid-area:tools;">

    </div>
  </div>`;
}

/* ⚠️ Shares .crewgrid with the Crew tab's Days on site/Hotel/Travel/Catering, so
   Phase BO's shared Controls/Name/Role leading columns apply here too even though
   this row has neither a checkbox nor a role — the name cell spans all three

async function toggleLocOnDay(locId, dayId, checked){
  const d = dayById(dayId); if(!d) return;
  d.additionalLocationIds = d.additionalLocationIds || [];
  if(checked){
    if(!d.locationId){ d.locationId = locId; }
    else if(d.locationId!==locId && !d.additionalLocationIds.some(pair=>pair[0]===locId)){ d.additionalLocationIds.push([locId, '']); }
  } else {
    if(d.locationId===locId) d.locationId = '';
    d.additionalLocationIds = d.additionalLocationIds.filter(pair=>pair[0]!==locId);
  }
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}

/* Collapse state for Preview & Export sections — same GLOBAL-not-per-day rule as
   shootDayBlocks: collapsing one day's Tech specs, say, keeps it collapsed on the
   next day too. Each section's header keeps its Copy button visible even while
   collapsed (see pvBlockHTML) — collapsing is about scanning the page fast, not
   about hiding the one action you actually came here for. */
/* No 'excel' key since Phase Q follow-up: the Excel download is a button in the
   Format panel now, not a collapsible block of its own. */
let previewBlocks = { callsheet:true, whatsapp:true, techspecs:true, catering:true };
/* ---- collapsible block plumbing, shared by Preview & Export and the Shoot Day editor ----
   Both keep an {key:isOpen} map and a pair of DOM ids per block (body + caret). The
   only thing that differed between them was the id prefix, so that's the parameter. */
function applyBlockState(state, prefix, key){
  const bodyEl = document.getElementById(prefix+'b-'+key);
  const caret  = document.getElementById(prefix+'c-'+key);
  if(bodyEl) bodyEl.style.display = state[key] ? '' : 'none';
  if(caret)  caret.textContent    = state[key] ? '▾' : '▸';
}
function toggleBlock(state, prefix, key){
  state[key] = !state[key]; applyBlockState(state, prefix, key);
  refreshExpandCollapseAll(prefix, allBlocksCollapsed(state));
}
function setAllBlocksCollapsed(state, prefix, collapsed){
  Object.keys(state).forEach(key=>{ state[key] = !collapsed; applyBlockState(state, prefix, key); });
  refreshExpandCollapseAll(prefix, allBlocksCollapsed(state));
}
/* ============ collapsibleSectionHTML() — the shared collapsible-section header
   (Gate 1 / G2) ============
   Every collapsible section in the app is a .sd-block-head with a caret, an id pair
   (<prefix>c-<key> / <prefix>b-<key>) and a display:${state?'':'none'} body — that
   shape was written out by hand in six near-identical places. Same split as
   filterPanelFootHTML()/filterToggleHTML(): only the markup is shared; each caller
   keeps its own open-state flag and its own toggle function (state lives in
   settingsBlocks/techBlocks/previewBlocks/etc. above, or a bare boolean for a
   singleton section) and calls into applyBlockState()/toggleBlock() exactly as
   before. No state moves here.

   Left OUT deliberately, not overlooked — eight builders were not eight instances
   of one thing:
     sdBlock()      — the whole head is the click target, not a caret+title span,
                       and its body carries .sd-block-body (the only one of the
                       eight that does). A real structural difference.
     budgetDayViewHTML()'s row — trailing <strong>total</strong> AND a bespoke
                       inline margin (`margin:14px 0 0`) neither shared by anything
                       else nor expressible as a boolean flag.
     budgetCostsViewHTML()'s group() — its inline margin-top is conditional on
                       which group renders first (`key==='catering'?'0':'18px'`),
                       standing in for the .sd-block:first-child rule that already
                       exists elsewhere in this file. Routing it through this shared
                       shape would mean either a param only one caller ever uses, or
                       silently changing its spacing (18px → the default 26px).
                       Left for a second pass rather than guessed at.

     state    — that section's own open flag
     prefix   — id prefix; '' omits the id attributes entirely, for a singleton
                section with nothing else to key off (e.g. Tasks)
     key      — that instance's key; '' for a singleton
     title    — already-formatted title HTML, inserted verbatim — callers that need
                escaping still call esc() themselves before passing it in, exactly
                as settingsBlockHTML() already did
     inner    — the body's inner HTML
     actions  — optional header-trailing HTML (e.g. a Copy button); stays outside
                the toggle span so it's clickable while the body is collapsed
     id       — optional id on the wrapper div
     wrapClass— the wrapper's class(es); defaults to 'section'
     onToggle — that caller's own toggle call, as an onclick string             */
function collapsibleSectionHTML({state=false, prefix='', key='', title='', inner='', actions='', id='', wrapClass='section', onToggle=''} = {}){

}

/* ============================================================
   BUDGET (Phase Budget) — cost visibility only, not a working budget.
   Rolls up cost data already entered elsewhere in the app (crew day rate ×
   days worked, the Catering/Travel cost summaries, Hotel room-nights) into
   three views. Deliberately excludes location fees (one fee can span several
   shoot days — not handling that here) and offers no editable line-item
   budget or export of its own; Preview & Export stays the export surface.
   ============================================================ */

// UK standard rate. Not project-configurable — this phase is cost VISIBILITY,
// not a real budgeting tool, so a fixed rate is the deliberate scope line.
const VAT_RATE = 0.20;

/* Room rate lives on the Hotel tab (hotelSummaryHTML, field id hcRoomNight) —
   moved here from Budget in Phase AD so it matches how Catering/Travel already
   own their own rates (getCateringCosts()/getTransportCosts()), same
   {field: Number(val)||0} shape as those two. Budget only reads it. */
function getHotelCosts(p){
  const c = (p && p.hotelCosts) || {};
  return { perRoomNight: Number(c.perRoomNight)||0 };
}
async function saveHotelCosts(){
  const p = currentProject(); if(!p) return;
  p.hotelCosts = { perRoomNight: Number(val('hcRoomNight'))||0 };
  await saveDB('db:projects', projectsDB);
}

/* Best-effort numeric extraction from the crew database's free-text Fee/rate
   field ("£450/day" -> 450). Returns null when nothing numeric is found,
   which the caller treats as "no rate on file", not as a rate of zero. */
function parseRateNumber(str){
  if(!str) return null;
  const m = String(str).replace(/,/g,'').match(/[\d]+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

/* Phase BF — the day rate now lives ON THE ENTRY (`entry.rate`), replacing the old
   p.crewRateOverrides[crewId] map, because rate is one of the three things that vary
   per role: the same person can be booked as an AC at one rate and an operator at
   another on the same project. Falls back to a best-effort parse of the crew database's
   Fee/rate field, and finally to "no rate on file" rather than silently costing someone
   at 0 — both unchanged.
   ⚠️ Renamed from resolveCrewRate(c, p) deliberately rather than kept and re-pointed:
   the argument changed from a crew record to an entry id, and a silent signature change
   on a money field is exactly the kind of thing that reads fine and computes wrong. Do
   not look for resolveCrewRate / saveCrewRateOverride. */
/* ---- per-role rates (the crew form's Rates section) ----
   c.roleRates is keyed by ROLE PATH — "Cinematography/DOP", the same string c.roles
   holds — so one person carries a different rate for each role they're booked as:

     c.roleRates = { "Cinematography/DOP": { rate:800, kit:200 }, … }

   ⚠️ kit == null (or the key absent) means "with Kit" is OFF: one undivided rate.
   ⚠️ kit is an ABSOLUTE amount, never a percentage. It is an equipment charge, so it
      does not move when the day rate does — which is what makes it survive a project
      override (see resolveEntryRate).
   ⚠️ LABOUR IS NEVER STORED. It is always rate − kit, so the parts cannot drift out of
      agreement with the rate they are a split of. Do not add a labour field. */
const roleRateFor = (c, rolePath) => (rolePath && c && c.roleRates && c.roleRates[rolePath]) || null;
/* an ENTRY stores department and role separately; c.roles/c.roleRates key on the joined
   path, so this is the one place the two shapes are reconciled */
const entryRolePath = e => (e && e.department && e.role) ? `${e.department}/${e.role}` : '';
/* floored at 0, so a kit charge larger than the day rate reads as "all kit" rather than
   as a negative operator fee */
const labourOf = (rate, kit) => Math.max(0, (Number(rate)||0) - (Number(kit)||0));
/* THE RATE CHAIN, most specific first:
     1. the project entry's own override        (this job only)
     2. this person's rate FOR THIS ROLE        (Rates section)
     3. their single catch-all rate, c.rate     (Fee / rate)
     4. no rate
   ⚠️ Step 2 is new and sits ABOVE c.rate because it is the more specific fact — a DOP
   who also operates has two real rates, and c.rate can only hold one. Nobody's number
   moved when it landed: a person with no roleRates entry falls straight through to
   exactly the behaviour that was here before.
   The kit split is resolved SEPARATELY from the rate and rides along with it even when
   an override wins, because kit is an absolute equipment charge: re-rating the DOP from
   800 to 900 for one job leaves the 200 of kit alone and puts the extra 100 on labour. */
function resolveEntryRate(entryId, p){
  const e = entryById(entryId, p || currentProject());
  const c = e ? crewById(e.crewId) : null;
  const rr = roleRateFor(c, entryRolePath(e));
  const kit = (rr && rr.kit!=null && !isNaN(Number(rr.kit))) ? Number(rr.kit) : null;
  if(e && Object.prototype.hasOwnProperty.call(e, 'rate')){
    const n = Number(e.rate);
    if(!isNaN(n)) return { rate:n, hasRate:true, isOverride:true, kit };
  }
  if(rr && rr.rate!=null && rr.rate!=='' && !isNaN(Number(rr.rate))){
    return { rate:Number(rr.rate), hasRate:true, isOverride:false, kit };
  }
  const parsed = parseRateNumber(c && c.rate);
  if(parsed!=null) return { rate:parsed, hasRate:true, isOverride:false, kit };
  return { rate:0, hasRate:false, isOverride:false, kit:null };
}
async function saveEntryRate(entryId, rawValue){
  const p = currentProject(); if(!p) return;
  const e = entryById(entryId, p); if(!e) return;
  const trimmed = (rawValue||'').trim();
  if(trimmed===''){
    delete e.rate;                                  // clearing reverts to the database rate
  } else {
    const n = Number(trimmed);
    if(isNaN(n)){ renderProjectBody(); return; }    // reject garbage, revert the field to the last valid value
    e.rate = n;
  }
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* AG: the Day Rate "Save to database" icon — the first thing in the app that writes
   from a project back to the shared crew database itself (everything else here is the
   opposite direction: database → per-project override). Deliberately a separate,
   explicit action from the project's own autosave: the entry's own rate keeps behaving
   exactly as before, this only pushes the currently-resolved rate onto c.rate, the
   crew member's STANDING rate. Reused verbatim in all three places the Day Rate field
   appears (Roles tab, Budget Per Person, the crew Edit expansion) — `context` just
   keeps their status-flash element ids from colliding when more than one is on screen
   at once (the Roles row and its own Edit expansion render simultaneously). */
function crewRateSaveIconHTML(entryId, context){
  const elId = `crsStatus-${context}-${entryId}`;
  return `<button type="button" class="icon-btn" onclick="saveCrewRateToDatabase('${entryId}','${context}')" title="Saves to Database" aria-label="Save day rate to database">${icon('save')}</button><span class="hint" id="${elId}"></span>`;
}
async function saveCrewRateToDatabase(entryId, context){
  // Same selected-set fan-out as every other bulk-editable field on the Crew tab
  // (selectedEditTargets) — but this is the one field that can silently rewrite
  // someone else's standing database record, so unlike those, a 2+ selection gets an
  // explicit confirmation first. Cancelling changes nothing.
  const targets = selectedEditTargets(entryId);
  if(targets.length>1 && !confirm('This will change all these entries in the database — is that ok?')) return;
  const p = currentProject();
  // Phase BF — targets are ENTRY ids; the write lands on the PERSON each one points at.
  // Two entries for one person resolve to one crew record, so the last one wins — which
  // is the honest outcome for a field the database only has one of.
  targets.forEach(id=>{
    const e = entryById(id, p); if(!e) return;
    const c = crewById(e.crewId); if(!c) return;
    const { rate, hasRate } = resolveEntryRate(id, p);
    // vatRegistered is NOT touched here — AH's Budget VAT checkbox already mutates
    // it directly on the live crewDB record the moment it's ticked, so whatever's
    // currently in memory rides along with this same saveDB call for free (AH's
    // "pushes both fields together in one action").
    if(hasRate) c.rate = `£${rate}/day`;
  });
  flashSaveResult(`crsStatus-${context}-${entryId}`, await saveDB('db:crew', crewDB), 'Saved to database');
}

let budgetCostsPP = false;
function toggleBudgetCostsPP(checked){ budgetCostsPP = checked; renderProjectBody(); }
/* Phase BS — WHAT is being costed, sitting alongside Itemize VAT (which is HOW).
   Phase BT added the third phase and fixed the ORDER (see BUDGET_SCOPES).
     preproduction — the Pre-production sub-tab's prep days × the SAME entry rate
                     (resolveEntryRate — one rate, shared by Roles, the two phase tabs
                     and here; there is no separate prep rate and no separate edit rate).
     production    — the shoot itself: day rate × days on site, plus the

     post          — the Post sub-tab's edit days × that same entry rate.
   ⚠️ ALL THREE DEFAULT ON, so the out-of-the-box figure is the complete one. Turning

   ⚠️ Session state, like budgetView / budgetVatToggle / the filters. Deliberately NOT
   persisted to the project: this is "what am I looking at right now", not a property
   of the shoot. */
/* ⚠️ Phase BT — ONE ordered list, and it is CHRONOLOGICAL: prep, shoot, edit. The
   toggles render from it, the scope label reads from it, and the Crew sub-tabs are in
   the same order, so nothing can put the three phases in two different orders. Adding a
   scope means adding a row here, not editing three places. */
const BUDGET_SCOPES = [
  ['preproduction', 'Pre-production'],
  ['production',    'Production'],
  ['post',          'Post']
];
let budgetScope = { preproduction:true, production:true, post:true };
function toggleBudgetScope(key, on){ budgetScope[key] = on; renderProjectBody(); }
/* One phrase for what's being costed, used by the summary-bar note and the export
   header so the two can't describe the same state differently. */
function budgetScopeLabel(){
  const on = BUDGET_SCOPES.filter(([k])=>budgetScope[k]).map(([,label])=>label);
  if(!on.length) return 'Nothing (every scope off)';

// {dayId: true/false}, same shared plumbing (toggleBlock/setAllBlocksCollapsed
// /applyBlockState) as the sd/tt/pv collapsible blocks. Unlike those, the

}

function setAllBudgetDayBlocksCollapsed(collapsed){ setAllBlocksCollapsed(budgetDayBlocks, 'bd', collapsed); }
function toggleAllBudgetDayBlocks(){ setAllBudgetDayBlocksCollapsed(!allBlocksCollapsed(budgetDayBlocks)); }

/* AN — the one money formatter for every Budget figure: the summary bar, all
   four views (Department/Person/Day/Costs) and the Copy/Excel export. Formatting
   only — thousands-separated, still 2dp — never touches the number itself, so
   nothing here can put a view, the export or a filtered subtotal out of step with
   another; that arithmetic is buildBudgetData()/budgetPersonDisplay()'s job alone. */
function budgetFmt(n){ return '£'+(n||0).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2}); }

/* A person's DISPLAYED cost, respecting the VAT toggle (Phase CL: subtotal+VAT when the

function budgetPersonDisplay(subtotal, vat){ return subtotal + (budgetVatToggle ? vat : 0); }

/* AH: Budget Per Person's VAT checkbox — the editable front-end for the same

   Mutates the live crewDB record straight away (so VAT toggles on/off in this same

/* ---- Budget day filter (Phase Refinement) ---------------------------------

   that applies to all four views at once, so it's a filter on the data rather

   the same markup as projectCrewFilter's Days sub-section. No OR/AND mode here:

   meaning the selection can have. */

let budgetFilterOpen = false;
function toggleBudgetFilterPanel(){ budgetFilterOpen = !budgetFilterOpen; renderProjectBody(); }
function toggleBudgetFilterDay(dayId, on){

function budgetSelectedDays(){ return projectDays().filter(d=>budgetDayFilter.has(d.id)); }

}
/* R16 — a department filter, and R4 — a sort, for Per Person. Both live in the SAME

function toggleBudgetFilterDept(dept, on){

}

/* Clears BOTH scopes — days and departments. Named clearBudgetFilter(), not
   ...DayFilter(): R16 added the department scope to this same panel and the
   function grew to cover it, but the old name stuck and a second, day-only
   definition of it sat above this one as dead code (the later definition
   silently won). Both are gone; this is the only one. */
function clearBudgetFilter(){
  budgetDayFilter.clear();
  /* ⚠️ Clears the SHARED crew filter too, because that is what is scoping the money now.
     Sort and Group by are display choices, not scope, and are deliberately left alone. */
  projectCrewFilter.depts.clear(); projectCrewFilter.roles.clear();
  projectCrewFilter.company = ''; projectCrewFilter.excludeTalent = false;
  projectCrewFilter.excludeOtherCompanies = false; projectCrewFilter.inverse = false;

}

       + (projectCrewFilter.excludeTalent?1:0) + (projectCrewFilter.excludeOtherCompanies?1:0)
       + projectCrewFilter.roles.size + (projectCrewFilter.company?1:0) + (projectCrewFilter.inverse?1:0);
}
/* budgetScopeParts() — the "N of M day(s)" segment of "describe the active
   budget scope", written three times (filter panel hint, export header,
   output-menu hint) and unified here (Gate 1 / G10). This is the part that was
   genuinely duplicated, pluralisation bug included: two callers always said
   "days", one correctly said "day" for a single day. Fixed once, to the
   correct form.

function budgetScopeParts(){

  const chips = all.length ? all.map(d=>
      `<label><input type="checkbox" ${budgetDayFilter.has(d.id)?'checked':''} onchange="toggleBudgetFilterDay('${d.id}', this.checked)"> Day ${esc(d.dayNum||'?')}</label>`
    ).join('') : '<span class="hint">No shoot days yet.</span>';
  // Only departments actually present on this project — same rule as the Crew panel.
  const p = currentProject();
  const present = DEPARTMENTS.filter(d=>projectEntryViews(p).some(c=>deptBucketKey(c.department)===d));
  /* ⚠️ These write projectCrewFilter — the Crew tab's own state — not a budget-local
     copy. Same boxes, same effect, whichever screen you tick them on. */
  const deptChips = present.length ? present.map(d=>
      `<label><input type="checkbox" ${projectCrewFilter.depts.has(d)?'checked':''} onchange="toggleProjectFilterDept('${d}', this.checked); renderProjectBody();"> ${esc(d)}</label>`
    ).join('') : '<span class="hint">No crew on this project yet.</span>';
  const excludeChips = `<label><input type="checkbox" ${projectCrewFilter.excludeTalent?'checked':''} onchange="projectCrewFilter.excludeTalent=this.checked; renderProjectBody();"> Exclude Talent</label>
    <label><input type="checkbox" ${projectCrewFilter.excludeOtherCompanies?'checked':''} onchange="projectCrewFilter.excludeOtherCompanies=this.checked; renderProjectBody();"> Exclude other companies</label>`;
  const dn = projectCrewFilter.depts.size;
  const scope = budgetScopeParts();
  if(dn) scope.push(`${dn} department${dn>1?'s':''}`);
  return `<div class="filter-panel">
    <div><div class="hint" style="margin-bottom:4px;">Shoot days</div><div class="filter-chips">${chips}</div></div>
    <div style="margin-top:10px;"><div class="hint" style="margin-bottom:4px;">Departments <span style="opacity:.7;">— shared with the Crew tab's filter</span></div><div class="filter-chips">${deptChips}</div></div>
    <div style="margin-top:10px;"><div class="filter-chips">${excludeChips}</div></div>
    <div class="grid g3" style="margin-top:10px;">
      <div><label for="budgetSortPick">Sort (Per Person)</label>
        <select id="budgetSortPick" onchange="setBudgetSort(this.value)">
          <option value="dept"     ${budgetSort==='dept'?'selected':''}>By department (HoD first)</option>
          <option value="name"     ${budgetSort==='name'?'selected':''}>By name</option>
          <option value="cost"     ${budgetSort==='cost'?'selected':''}>By cost (highest first)</option>
          <option value="rate"     ${budgetSort==='rate'?'selected':''}>By day rate (highest first)</option>
          <option value="days"     ${budgetSort==='days'?'selected':''}>By days worked (most first)</option>
          <option value="noRate"   ${budgetSort==='noRate'?'selected':''}>Missing a day rate first</option>
        </select></div>
    </div>
    ${filterPanelFootHTML({
      hint: scope.length ? `Costing ${scope.join(' · ')} — every figure below is for those only.`
                         : 'Whole project. Tick any day or department to narrow it.',
      active: budgetActiveFilterCount()>0,   // === scope.length; this panel's gating is unchanged
      onClear: 'clearBudgetFilter()'
    })}
  </div>`;
}

function buildBudgetData(){
  const p = currentProject();
  const days = budgetFilteredDays();
  /* Phase BF — one row per ENTRY, because day rate and days worked are both entry-level
     now. Travel is NOT: see travelRateFor/firstEntryOnDay below. */
  const crew = projectEntryViews(p);
  const hotelCosts = getHotelCosts(p);

  /* AO — VAT follows the PERSON, so a VAT-registered crew member's TRAVEL carries
     VAT too: travel is charged back through them, not paid direct to a supplier.
     This resolves buildTransportSummary()'s per-day arithmetic down to the one
     per-person figure it's already built from, rather than inventing a second
     attribution: a method is stored once per person per project (p.travelMethods),
     only 'Own car' (mileage) and 'Public transport' (flat day rate) carry a cost, and
     that cost lands on each day the person is actually on site — the same
     `daysWorked` signal below. So per-person travel = rate-for-their-method ×
     daysWorked, and summing that over everyone gives back exactly the travelTotal
     the Travel extras row shows.
     ⚠️ Catering and Hotel are DELIBERATELY excluded — see the note on hotelTotal. */
  const travelCosts = getTransportCosts(p);
  const travelMethods = p.travelMethods || {};
  const travelRateFor = id => {
    const m = travelMethods[id];
    if(m==='Own car') return travelCosts.mileage;
    if(m==='Public transport') return travelCosts.publicPerDay;
    return 0;   // Train / Flying / Production transport / custom: counted, never costed
  };

  /* R16 — WHO is costed. Applied to the people list itself, so the summary bar, Per
     Department, Per Day and Per Person can't disagree about it.
     ⚠️ ONE FILTER, SHARED WITH THE CREW TAB. This used to be budgetDeptFilter, a second
     department scope that knew nothing about the Crew tab's — so excluding Talent there
     left them costed here, and the two screens disagreed about who was on the job.
     personMatchesProjectFilter() is the exact predicate the Crew tab filters with
     (departments, company, roles, exclude Talent / other companies, inverse, day
