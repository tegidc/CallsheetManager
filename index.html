/* ---------- talking to the script ---------- */
/* GET with query params; POST as text/plain so the browser sends it without a CORS
   preflight (Apps Script web apps answer the redirect-then-JSON dance fine for a
   simple request, and not at all for a preflighted one). */
/* ⚠️ Google delivers a web app's answer through a redirect to script.googleusercontent.com,
   and that hop intermittently 404s AFTER the script has run and completed (seen 14 Sep
   2026: same request, 200 then 404 then 200; every execution "Completed" in the log).
   So a 404 is retried, not reported. Safe because both actions are idempotent: `replace`
   rewrites the same rows, `writeIds` skips a row that already carries an id. */
const SHEET_SYNC_ATTEMPTS = 4;
async function sheetSyncRequest(method, params, body){
  const url = sheetSyncUrl();
  if(!SHEET_SYNC_URL_RE.test(url)) throw new Error('No valid web-app URL saved — it should start with https://script.google.com/macros/s/ and end in /exec.');
  const u = new URL(url);
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k, v));
  let lastErr = null;
  for(let attempt=1; attempt<=SHEET_SYNC_ATTEMPTS; attempt++){
    const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 60000);
    let res, text;
    try{
      res = await fetch(u.toString(), method==='POST'
        ? { method:'POST', redirect:'follow', signal:ctrl.signal, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body||{}) }
        : { method:'GET', redirect:'follow', signal:ctrl.signal });
      text = await res.text();
    }catch(e){
      throw new Error(e.name==='AbortError' ? 'The sheet did not answer within a minute.' : 'Could not reach the sheet — check your connection, and that the script is deployed with access set to "Anyone".');
    }finally{ clearTimeout(timer); }
    let data = null;
    try{ data = JSON.parse(text); }catch(e){ data = null; }
    if(data){
      if(data.ok!==true) throw new Error(data.error || 'The script reported an error.');
      return data;
    }
    if(res.status===200) throw new Error('The script answered with a page instead of data — in Apps Script, deploy it as a Web app with "Who has access: Anyone".');
    lastErr = new Error(`The script answered with HTTP ${res.status}${attempt>1?` (${attempt} tries)`:''}.`);
    if(res.status!==404 && res.status!==500 && res.status!==502 && res.status!==503) break;
    if(attempt<SHEET_SYNC_ATTEMPTS) await new Promise(r=>setTimeout(r, 700*attempt));
  }
  throw lastErr;
}

/* ---------- the plan: what a pull would change ---------- */
/* Pure — reads crewDB, never writes it. Every candidate record is built on a clone
   and kept on the plan, so Apply just swaps clones in. */
function sheetSyncPlan(data){
  const norm = s => (s||'').toString().trim().toLowerCase();
  const headers = (data.headers||[]).map(h=>(h||'').toString().trim());
  const present = [];    // [{col, header}] — columns the sheet actually has
  const unknown = [];
  headers.forEach(h=>{
    if(!h) return;
    const col = SHEET_SYNC_COLUMNS.find(c=>norm(c.h)===norm(h) || (c.aliases||[]).some(a=>a===norm(h)));
    if(col && !present.some(p=>p.col===col)) present.push({col, header:h}); else unknown.push(h);
  });
  const has = key => present.some(p=>p.col.special===key || p.col.f===key);
  const headerFor = col => (present.find(p=>p.col===col)||{}).header;
  const cellRaw = (row, col) => { const h = headerFor(col); return h==null ? undefined : (row[h] ?? ''); };
  const plan = { present, unknown, changes:[], adds:[], linkIds:[], missing:[], skippedBlank:0, newRoles:[], hasName:has('name') };
  if(!has('id') && !plan.hasName) return plan;   // nothing we can match on
  const seenIds = new Set();
  const idCol = SHEET_SYNC_COLUMNS[0];
  (data.rows||[]).forEach(row=>{
    const id = has('id') ? (cellRaw(row, idCol)||'').toString().trim() : '';
    const name = plan.hasName ? (cellRaw(row, SHEET_SYNC_COLUMNS[1])||'').toString().trim() : '';
    /* match by id; failing that by a UNIQUE name (a Form submission from someone
       already in the database, or a sheet that has never been sent to). A name shared
       by two records is ambiguous, so that row becomes a new person rather than a guess.
       Two rows for the same person (their own row plus a form submission) layer in
       sheet order — the later row's cells land on top of the earlier row's. */
    let existing = id ? crewById(id) : null, linkedByName = false;
    if(!existing && name){
      const hits = crewDB.filter(c=>norm(c.name)===norm(name));
      if(hits.length===1){ existing = hits[0]; linkedByName = true; }
    }
    if(!existing && !name){ plan.skippedBlank++; return; }
    if(existing) seenIds.add(existing.id);
    const prior = existing ? plan.changes.find(ch=>ch.id===existing.id) : null;
    const base = prior ? prior.rec : existing ? dbClone(existing) : { id: id || uid(), name, roles:[], role:'', department:'' };
    /* A row the app wrote carries an id and is authoritative: a blank cell there
       means "cleared". A row without an id (a Form submission, a row typed in by
       hand) only contributes the cells it fills in, and never renames the person
       it was matched to. */
    const partial = !id;
    const changed = [];
    present.forEach(({col})=>{
      const raw = cellRaw(row, col);
      const v = sheetSyncNormalise(col, raw);
      if(col.special==='id') return;
      if(partial && v==='') return;
      if(linkedByName && col.f==='name') return;
      if(col.special==='roles'){
        const list = v.split(/[;\n|]/).map(s=>s.trim()).filter(Boolean);
        if(!list.length && !existing) return;               // a new person with no saved-roles cell — derived below
        if(JSON.stringify(list)!==JSON.stringify(base.roles||[])){ base.roles = list; changed.push(col.h); }
        return;
      }
      if(col.special==='hod'){
        const on = v==='Yes';
        if(on!==!!base.isHoD){ if(on) base.isHoD = true; else delete base.isHoD; changed.push(col.h); }
        return;
      }
      const cur = (base[col.f] ?? '').toString();
      if(v!==cur){ base[col.f] = v; changed.push(col.h); }
    });
    // Department / Role / Saved roles must agree with each other, whichever the sheet supplied
    const rolesBefore = JSON.stringify(base.roles||[]), roleBefore = base.role, deptBefore = base.department;
    sheetSyncReconcileRoles(base);
    if(JSON.stringify(base.roles||[])!==rolesBefore && !changed.includes('Saved roles')) changed.push('Saved roles');
    if(base.role!==roleBefore && !changed.includes('Role')) changed.push('Role');
    if(base.department!==deptBefore && !changed.includes('Department')) changed.push('Department');
    (base.roles||[]).forEach(rp=>{
      const d = departmentForRolePath(rp), r = sheetSyncRoleName(rp);
      if(d && r && DEPARTMENTS.includes(d) && !rolesFor(d).some(x=>x.toLowerCase()===r.toLowerCase()) && !plan.newRoles.includes(rp)) plan.newRoles.push(rp);
    });
    if(!existing){
      if(!base.name){ plan.skippedBlank++; return; }
      plan.adds.push({ row:row._row, name:base.name, rec:base, keepId:!!id });
    } else {
      if(linkedByName) plan.linkIds.push({ row:row._row, name, id:existing.id });   // the script adds an id column if the sheet has none
      if(prior) changed.forEach(f=>{ if(!prior.fields.includes(f)) prior.fields.push(f); });
      else if(changed.length) plan.changes.push({ id:existing.id, name:existing.name, fields:changed, rec:base, was:existing });
    }
  });
  if(has('id')) plan.missing = crewDB.filter(c=>!seenIds.has(c.id)).map(c=>c.name||'(no name)');
  return plan;
}
/* the one place Department, Role and Saved roles are squared with each other after
   a sheet edit — the same invariants setActiveRole()/addRoleToCrew() keep: roles are
   "Dept/Role" paths, the active role is one of them, department follows it */
function sheetSyncReconcileRoles(c){
  c.roles = (c.roles||[]).map(s=>(s||'').toString().trim()).filter(Boolean);
  c.role = (c.role||'').toString().trim(); c.department = (c.department||'').toString().trim();
  if(c.role && !c.department){ const rp = c.roles.find(r=>sheetSyncRoleName(r).toLowerCase()===c.role.toLowerCase()); if(rp) c.department = departmentForRolePath(rp); }
  if(c.role && c.department){
    const path = `${c.department}/${c.role}`;
    const hit = c.roles.find(r=>r.toLowerCase()===path.toLowerCase());
    if(hit){ c.role = sheetSyncRoleName(hit); c.department = departmentForRolePath(hit); }
    else c.roles.push(path);
  }
  if(!c.role && c.roles.length){ c.role = sheetSyncRoleName(c.roles[0]); c.department = departmentForRolePath(c.roles[0]); }
}

/* ---------- actions ---------- */
async function sheetSyncRun(label, fn){
  if(sheetSyncBusy) return;
  sheetSyncBusy = label; sheetSyncNotice = null; refreshCrewDatabase();
  try{ await fn(); }
  catch(e){ sheetSyncNotice = { kind:'err', text: e.message || String(e) }; }
  finally{ sheetSyncBusy = ''; refreshCrewDatabase(); }
}
async function sheetSyncSaveUrl(){
  const url = val('sheetSyncUrlInput');
  if(url && !SHEET_SYNC_URL_RE.test(url)){
    sheetSyncNotice = { kind:'err', text: url.endsWith('/dev')
      ? 'That is the /dev test URL — use the Web app URL from Deploy ▸ Manage deployments, which ends in /exec.'
      : 'That does not look like an Apps Script web-app URL (https://script.google.com/macros/s/…/exec).' };
    refreshCrewDatabase(); return;
  }
  await sheetSyncSaveSettings({ url, sheetUrl: url ? sheetSyncSettings().sheetUrl : '', sheetName: url ? sheetSyncSettings().sheetName : '' });
  sheetSyncNotice = url ? null : { kind:'ok', text:'Google Sheet disconnected.' };
  if(url) await sheetSyncTest(); else refreshCrewDatabase();
}
async function sheetSyncTest(){
  await sheetSyncRun('Testing the connection…', async ()=>{
    const r = await sheetSyncRequest('GET', { ping:1 });
    await sheetSyncSaveSettings({ sheetUrl:r.url||'', sheetName:r.spreadsheet||'' });
    sheetSyncEditing = false;
    sheetSyncNotice = { kind:'ok', text:`Connected to "${r.spreadsheet}" — the ${r.sheet} tab has ${r.rows} row${r.rows===1?'':'s'}.` };
  });
}
/* app → sheet. Reads the sheet first so an edit made there since the last load is
   never silently flattened: if the plan shows changes, the user is asked. */
async function sheetSyncPush(){
  await sheetSyncRun('Sending to the sheet…', async ()=>{
    const current = await sheetSyncRequest('GET');
    const plan = sheetSyncPlan(current);
    const pending = plan.changes.length + plan.adds.length;
    if(pending){
      const who = plan.changes.concat(plan.adds).slice(0,5).map(x=>x.name).join(', ');
      if(!confirm(`The sheet has ${pending} edit${pending===1?'':'s'} that aren't in the app yet (${who}${pending>5?', …':''}).\n\nSending now will overwrite them with what the app has. Load from sheet first if you want to keep them.\n\nOverwrite the sheet?`)){ sheetSyncNotice = { kind:'ok', text:'Nothing sent.' }; return; }
    }
    const headers = SHEET_SYNC_COLUMNS.map(c=>c.h);
    const rows = crewDB.map(c=>SHEET_SYNC_COLUMNS.map(col=>sheetSyncCellOf(c, col)));
    const r = await sheetSyncRequest('POST', null, { action:'replace', headers, rows });
    await sheetSyncSaveSettings({ lastPush:new Date().toISOString(), sheetUrl: current.url || sheetSyncSettings().sheetUrl });
    sheetSyncNotice = { kind:'ok', text:`Sent ${r.written} ${r.written===1?'person':'people'} to the sheet.` };
  });
}
/* sheet → app, step 1: read and plan. Nothing is written until sheetSyncApply(). */
async function sheetSyncPull(){
  sheetSyncPreview = null;
  await sheetSyncRun('Reading the sheet…', async ()=>{
    const data = await sheetSyncRequest('GET');
    if(!(data.headers||[]).length) throw new Error('The Crew tab is empty — press "Send to sheet" first to write the columns.');
    const plan = sheetSyncPlan(data);
    if(!plan.hasName && !plan.present.some(p=>p.col.special==='id')) throw new Error('The sheet needs at least a "Name" column (or the app\'s "id" column) in row 1 to match people up.');
    if(!plan.changes.length && !plan.adds.length && !plan.linkIds.length){
      sheetSyncNotice = { kind:'ok', text:`Nothing to load — the sheet and the app already match.${plan.missing.length?` (${plan.missing.length} in the app but not in the sheet — they stay.)`:''}` };
      await sheetSyncSaveSettings({ lastPull:new Date().toISOString(), sheetUrl: data.url || sheetSyncSettings().sheetUrl });
      return;
    }
    plan.sheetUrl = data.url || '';
    sheetSyncPreview = plan;
  });
}
function sheetSyncCancel(){ sheetSyncPreview = null; sheetSyncNotice = null; refreshCrewDatabase(); }
/* sheet → app, step 2: apply the plan through the normal save path. */
async function sheetSyncApply(){
  const plan = sheetSyncPreview; if(!plan) return;
  sheetSyncPreview = null;
  await sheetSyncRun('Loading into the app…', async ()=>{
    const snaps = beginUndo(['db:crew']);
    let applied = 0, stale = 0;
    plan.changes.forEach(ch=>{
      const idx = crewDB.findIndex(c=>c.id===ch.id);
      // the record was edited in the app while the preview was open — leave it, say so
      if(idx<0 || crewDB[idx]!==ch.was){ stale++; return; }
      crewDB[idx] = ch.rec; applied++;
    });
    plan.adds.forEach(a=>{ crewDB.push(a.rec); });
    plan.newRoles.forEach(rp=>{
      const d = departmentForRolePath(rp), r = sheetSyncRoleName(rp);
      ROLES_BY_DEPT[d] = ROLES_BY_DEPT[d] || [];
      if(!ROLES_BY_DEPT[d].some(x=>x.toLowerCase()===r.toLowerCase())) ROLES_BY_DEPT[d].push(r);
    });
    const res = await saveDB('db:crew', crewDB);
    if(res && res.ok===false) throw new Error('The crew database could not be saved — nothing from the sheet was kept. ' + (res.detail||''));
    if(plan.newRoles.length) await saveDB('db:roles', ROLES_BY_DEPT);
    // write the new ids back so the next load matches these rows instead of adding them again
    let idsBack = null;
    const toWrite = plan.adds.filter(a=>!a.keepId).map(a=>({ row:a.row, name:a.name, id:a.rec.id })).concat(plan.linkIds);
    if(toWrite.length){
      try{ idsBack = await sheetSyncRequest('POST', null, { action:'writeIds', ids:toWrite }); }
      catch(e){ idsBack = { error:e.message }; }
    }
    await sheetSyncSaveSettings({ lastPull:new Date().toISOString(), sheetUrl: plan.sheetUrl || sheetSyncSettings().sheetUrl });
    const bits = [];
    if(applied) bits.push(`${applied} updated`);
    if(plan.adds.length) bits.push(`${plan.adds.length} added`);
    if(plan.newRoles.length) bits.push(`${plan.newRoles.length} new role${plan.newRoles.length===1?'':'s'} added to the roles list`);
    if(stale) bits.push(`${stale} skipped (edited here while the preview was open)`);
    let text = `Loaded from the sheet: ${bits.join(', ')}.`;
    if(idsBack && (idsBack.error || (idsBack.skipped||[]).length)) text += ` Some new rows could not be given their id in the sheet${idsBack.error?` (${idsBack.error})`:''} — press "Send to sheet" to line it up.`;
    sheetSyncNotice = { kind:'ok', text };
    finishUndo(`Loaded ${applied + plan.adds.length} ${applied + plan.adds.length===1?'change':'changes'} from the Google Sheet.`, snaps);
  });
}

let addrSearchTimer;

async function runAddressSearch(){

    window._addrResults = data;
  }catch(e){ box.innerHTML='<div class="sritem">Search failed — check your connection</div>'; }
}
function pickAddress(i){
  const r = window._addrResults[i];
  setv('nlAddress', r.display_name);
  setv('nlLatLon', parseFloat(r.lat).toFixed(5)+', '+parseFloat(r.lon).toFixed(5));
  locFormState.lat=parseFloat(r.lat); locFormState.lon=parseFloat(r.lon);
  document.getElementById('nlSearchResults').style.display='none'; setv('nlSearchBox','');
  updateMapPreview();

function updateMapPreview(){
  const el=document.getElementById('nlMapPreview'); if(!el) return;
  if(locFormState.lat==null){ el.innerHTML=''; return; }
  const d=0.01, bbox=[locFormState.lon-d,locFormState.lat-d,locFormState.lon+d,locFormState.lat+d].join(',');
  el.innerHTML=`<iframe class="mapembed" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${locFormState.lat},${locFormState.lon}&layer=mapnik"></iframe>`;
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const AMENITY_SEARCH = {
  hospital: { tag:'hospital', radii:[10000,25000], noun:'hospital', unnamed:'Unnamed hospital', stateKey:'hospital', elId:'nlHospitalInfo' },
  parking:  { tag:'parking',  radii:[1000,3000,8000], noun:'parking', unnamed:'Unnamed parking', stateKey:'parking', elId:'nlParkingInfo' },
};
/* formats a {name, address, distanceKm} amenity as one display line — used by the
   location form, the shoot day form, and anywhere else one is shown */
function amenityLine(a, missingAddr){
  return a ? `${a.name} — ${a.address||(missingAddr||'')} (~${a.distanceKm}km)` : '';
}
async function findNearestAmenity(kind, lat, lon){
  const cfg = AMENITY_SEARCH[kind];
  for(const r of cfg.radii){
    const query=`[out:json][timeout:20];node["amenity"="${cfg.tag}"](around:${r},${lat},${lon});out;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    const data=await res.json();
    if(data.elements && data.elements.length){
      let best=null,bestD=Infinity;
      data.elements.forEach(el=>{ const dist=haversine(lat,lon,el.lat,el.lon); if(dist<bestD){bestD=dist;best=el;} });
      const t=best.tags||{};
      const addr=[t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:postcode']].filter(Boolean).join(', ');
      return { name:t.name||cfg.unnamed, address:addr, phone:t.phone||t['contact:phone']||'', distanceKm:bestD.toFixed(1) };
    }
  }
  return null;
}
/* the "Find nearest…" buttons on the location form — same flow for both kinds */
async function lookupAmenityForForm(kind){
  const cfg = AMENITY_SEARCH[kind];
  const infoEl=document.getElementById(cfg.elId); if(!infoEl) return;
  if(locFormState.lat==null){ alert('Search and pick an address first so we have coordinates to search from.'); return; }
  infoEl.textContent=`Searching nearby ${cfg.noun}…`;
  try{
    const found = await findNearestAmenity(kind, locFormState.lat, locFormState.lon);
    if(!found){ infoEl.textContent=`No ${cfg.noun} found nearby.`; return; }
    locFormState[cfg.stateKey]=found;
    infoEl.textContent=amenityLine(found, 'address not tagged');
  }catch(e){ infoEl.textContent='Lookup failed — check your connection.'; }
}

/* IDEAS DEMO — the day form's hospital / car park Fetch buttons. Same Overpass
   lookup the Locations database uses, run against the selected PRIMARY location's
   coordinates, and the result is SAVED ONTO THE LOCATION RECORD — so every
   project using that location inherits it, exactly as if it had been looked up
   in the Locations database. */
async function fetchDayAmenity(kind){
  const statusEl = document.getElementById(kind==='hospital' ? 'sdHospitalStatus' : 'sdCarParkStatus');
  const l = selectedDayLocation();
  if(!l){ if(statusEl) statusEl.textContent = 'Select a primary location first.'; return; }
  if(l.lat==null || l.lon==null){ if(statusEl) statusEl.textContent = 'This location has no map position yet — pick its address in the Locations database first.'; return; }
  if(statusEl) statusEl.textContent = `Searching nearby ${AMENITY_SEARCH[kind].noun}…`;
  try{
    const found = await findNearestAmenity(kind, l.lat, l.lon);
    if(!found){ if(statusEl) statusEl.textContent = `No ${AMENITY_SEARCH[kind].noun} found nearby.`; return; }
    if(kind==='hospital') l.hospital = found; else l.nearestParking = found;
    const res = await saveDB('db:locations', locationsDB);
    if(statusEl) statusEl.textContent = (res && res.ok) ? 'Found — saved to this location for every project.' : 'Found, but saving failed — see the banner.';
    updateHospitalDisplay(); updateParkingLookupDisplay();
  }catch(e){ if(statusEl) statusEl.textContent = 'Lookup failed — check your connection.'; }
}

/* ---------- schedule time/duration helpers ---------- */
function parseTimeStrToMins(s){
  const m = (s||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function parseTimeRangeToMins(s){
  const parts = (s||'').split('-');
  if(parts.length!==2) return null;
  const start = parseTimeStrToMins(parts[0]), end = parseTimeStrToMins(parts[1]);
  if(start==null||end==null) return null;
  return {start,end};
}
function parseDurationToMins(s){
  if(!s) return null;
  s = s.trim();
  const full = s.match(/^(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?\s+(\d+)$/i);
  if(full) return Math.round(parseFloat(full[1])*60) + parseInt(full[2],10);
  let mins=0, matched=false;
  const hrM = s.match(/(\d+(?:\.\d+)?)\s*h/i);
  if(hrM){ mins += Math.round(parseFloat(hrM[1])*60); matched=true; }
  const minM = s.match(/(\d+)\s*m/i);
  if(minM){ mins += parseInt(minM[1],10); matched=true; }
  if(!matched){
    const bareNum = s.match(/^(\d+)$/);
    if(bareNum) return parseInt(bareNum[1],10);
    return null;
  }
  return mins;
}
function formatMinsAsDuration(mins){
  if(mins==null) return '';
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return `${h}hr${h>1?'s':''} ${m}min`;
  if(h) return `${h}hr${h>1?'s':''}`;
  return `${m}min`;
}
function formatMinsAsTime(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function onScheduleTimeInput(input){
  const range = parseTimeRangeToMins(input.value);
  if(!range) return;
  const durInput = input.closest('.row').querySelector('.sc-dur');
  if(durInput) durInput.value = formatMinsAsDuration(range.end - range.start >= 0 ? range.end-range.start : range.end-range.start+1440);
}
function onScheduleDurationInput(input){
  const row = input.closest('.row');
  const timeInput = row.querySelector('.sc-time');
  if(!timeInput || (timeInput.value||'').includes('-')) return; // don't override an existing range
  const start = parseTimeStrToMins(timeInput.value);
  if(start==null) return;
  const durMins = parseDurationToMins(input.value);
  if(durMins==null) return;
  timeInput.value = formatMinsAsTime(start) + ' - ' + formatMinsAsTime(start+durMins);
}
function moveSchedRow(btn, dir){
  const row = btn.closest('.row');
  const container = document.getElementById('rows-sched');
  const rows = [...container.querySelectorAll('.row')].filter(r=>r.querySelector('.sc-time'));
  const i = rows.indexOf(row);
  if(i<0) return;
  const target = rows[i+dir];
  if(!target) return;                       // already at an end
  if(dir<0) container.insertBefore(row, target);
  else container.insertBefore(target, row);
}
function shiftSelected(direction){
  const amount = parseInt(val('schedShiftAmount')||'15', 10) * direction;
  const anySelected = [...document.querySelectorAll('#rows-sched .sc-select')].some(cb=>cb.checked);
  if(!anySelected){ alert('Tick the rows you want to shift, or use "Select all" first.'); return; }
  shiftScheduleTimes(amount, true);
}
function toggleSelectAllSched(){
  const boxes = [...document.querySelectorAll('#rows-sched .sc-select')];
  const allOn = boxes.length && boxes.every(cb=>cb.checked);
  boxes.forEach(cb=>{ cb.checked = !allOn; });
  const btn = document.getElementById('schedSelectAllBtn');
  if(btn) btn.textContent = allOn ? 'Select all' : 'Clear all';
}
function shiftScheduleTimes(deltaMinutes, onlySelected){
  const rows = document.querySelectorAll('#rows-sched .row');
  rows.forEach(row=>{
    const timeInput = row.querySelector('.sc-time'); if(!timeInput) return;
    if(onlySelected){ const sel = row.querySelector('.sc-select'); if(!sel || !sel.checked) return; }
    const range = parseTimeRangeToMins(timeInput.value);
    if(range){
      timeInput.value = formatMinsAsTime(range.start+deltaMinutes) + ' - ' + formatMinsAsTime(range.end+deltaMinutes);
      return;
    }
    const single = parseTimeStrToMins(timeInput.value);
    if(single!=null) timeInput.value = formatMinsAsTime(single+deltaMinutes);
  });
}
function rowsOf(containerId, classes){
  return [...document.getElementById(containerId).querySelectorAll('.row, .crewrow-select')].map(r=>

function weatherFetchedLabel(v){
  if(!v) return '';
  if(!/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;

const WMO={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm'};
async function fetchWeatherForDay(){
  const loc=selectedDayLocation();
  const dateStr=val('sdDate'); const s=document.getElementById('weatherStatus');
  if(!loc||loc.lat==null){ s.textContent='Pick a primary location with saved coordinates first.'; return; }
  if(!dateStr){ s.textContent='Set the shoot date first.'; return; }
  s.textContent='Fetching…';
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((new Date(dateStr+'T00:00:00')-today)/86400000);
  try{
    let url,source;
    if(diffDays<0){ url=`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset&timezone=auto`; source='historical'; }
    else if(diffDays<=15){ url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto`; source='forecast'; }
    else{ s.textContent=`Shoot date is ${diffDays} days out — forecasts only reach ~16 days. Try again nearer the date.`; return; }
    const data=await(await fetch(url)).json();
    if(!data.daily||!data.daily.time||!data.daily.time.length){ s.textContent='No weather data for that date/location.'; return; }
    const tMax=data.daily.temperature_2m_max[0], tMin=data.daily.temperature_2m_min[0], code=data.daily.weathercode[0];
    const precip=data.daily.precipitation_probability_max?data.daily.precipitation_probability_max[0]+'%':(data.daily.precipitation_sum?data.daily.precipitation_sum[0]+'mm':'');
    setv('wxTemp',`${Math.round(tMax)}°C / ${Math.round(tMin)}°C`); setv('wxPrecip',precip);
    setv('wxCond',WMO[code]||('Code '+code));
    setv('wxSun',`${(data.daily.sunrise[0]||'').split('T')[1]||''} / ${(data.daily.sunset[0]||'').split('T')[1]||''}`);
    const fetchedDay = currentDay();
    if(fetchedDay) fetchedDay.weather = Object.assign({}, fetchedDay.weather, {fetchedAt:new Date().toISOString()});
    s.textContent=`Fetched (${source}) just now.`;
    sdAutoSizeAll();
    scheduleAutosave('shootday', () => saveShootDay(false));   // setv() fires no input event
  }catch(e){ s.textContent='Fetch failed — check your connection.'; }
}
async function saveShootDay(thenGenerate){

  if(!document.getElementById('sdEditCard')) return;
  const idx=shootDaysDB.findIndex(x=>x.id===currentShootDayId); if(idx<0) return;
  const d=shootDaysDB[idx];

  delete d.dayTotal;
  d.locationId=document.getElementById('sdLocation').value;
  d.additionalLocationIds=rowsOf('rows-sdaddloc',['sdaddloc-sel','sdaddloc-note']);
  d.weather={temp:val('wxTemp'),precip:val('wxPrecip'),cond:val('wxCond'),sun:val('wxSun'),
             fetchedAt:(d.weather&&d.weather.fetchedAt)||''};
  d.schedule=rowsOf('rows-sched',['sc-time','sc-dur','sc-desc']);
  const prevPositions = d.positions || [];
  const newPositionsRaw = rowsOf('rows-posn',['posn-crew','posn-call']);
  d.positions = newPositionsRaw.map(([cid,call])=>{
    const prev = prevPositions.find(p=>p[0]===cid);
    return [cid, call, '', prev?(prev[3]||''):'', prev?(prev[4]||''):''];
  });
  // tech specs are not on this form (their own card below it, saveDayTechSpecs) — never touch d.techSpecs here
  d.brief=parseBriefLines(val('sdBrief'));

  flashSaveResult('sdStatus', saved);

  // the call sheet they'd be looking at is one this database has never seen.

}

function resolveCrewForDay(entryId, day){

  if(data.notes){ aoa.push(['PRODUCTION NOTES']); aoa.push([data.notes]); }
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:24},{wch:24},{wch:14},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Call Sheet');
  /* Phase Q — one sheet per ticked section, same four checkboxes that gate the
     printable blocks and the WhatsApp text. A section with no data at all still
     produces no sheet, ticked or not: an empty tab is worse than a missing one. */
  const addSheet=(name, sheetAoa, cols)=>{
    const s=XLSX.utils.aoa_to_sheet(sheetAoa);
    if(cols) s['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,s,name);
  };
  if(activeExportSections().tech){
    const tsRows=techSpecRows(data.techSpecs||{});
    const tsAoa=[['TECH SPECS — camera/technical crew reference'],[],...tsRows];
    if(data.cameraDesignations && data.cameraDesignations.length){
      tsAoa.push([]); tsAoa.push(['CAMERA DESIGNATIONS']); tsAoa.push(['Camera','Name','Shorthand','File tag']);
      data.cameraDesignations.forEach(cd=>tsAoa.push([cd.letter, cd.name, cd.shorthand||'', cd.tag]));
    }
    addSheet('Tech Specs', tsAoa, [{wch:20},{wch:30}]);
  }
  if(activeExportSections().hotels){
    const hotel=buildHotelSummary();
    if(hotel){
      const hAoa=[['HOTEL BOOKING', hotel.summary],[],['ROOM-BOOKING TABLE'],['Room No.','Name','Date from','Date to','Total nights']];
      hotel.roomBooking.forEach(r=>hAoa.push([r.roomNo, r.name, r.from, r.to, r.totalNights]));
      hAoa.push([]); hAoa.push(['PER-NIGHT TABLE']); hAoa.push(['Night','Rooms','Names']);
      hotel.perNight.forEach(n=>hAoa.push([n.label, n.rooms, n.names.join(', ')]));
      addSheet('Hotel', hAoa, [{wch:10},{wch:24},{wch:16},{wch:16},{wch:40}]);
    }
  }
  if(activeExportSections().catering){
    const catering=buildCateringExport();
    if(catering){
      const cAoa=[['CATERING ORDER'],[]];
      catering.forEach(day=>{
        cAoa.push([day.label]); cAoa.push(['Meal','Count']);
        if(day.bCount) cAoa.push(['Breakfast', day.bCount]);
        if(day.lCount) cAoa.push(['Lunch', day.lCount]);
        if(day.dCount) cAoa.push(['Dinner', day.dCount]);
        if(day.dietaryNotes.length){
          cAoa.push(['Dietary requirements']); cAoa.push(['Name','Type','Specific']);
          day.dietaryNotes.forEach(n=>cAoa.push([n.name, n.general, n.specific]));
        }
        cAoa.push([]);
      });
      addSheet('Catering', cAoa, [{wch:24},{wch:18},{wch:32}]);
    }
  }
  if(activeExportSections().travel){
    const travel=buildTransportSummary();
    if(travel){
      const tAoa=[['TRANSPORT SUMMARY'],[], ['Method', ...travel.cols.map(c=>c.label)]];
      travel.usedMethods.forEach(m=>tAoa.push([m, ...travel.cols.map(c=>c.counts[m])]));
      tAoa.push(['Daily cost', ...travel.cols.map(c=>Number((c.dailyCost||0).toFixed(2)))]);
      tAoa.push([]); tAoa.push(['Total transport cost', Number((travel.totalCost||0).toFixed(2))]);
      addSheet('Travel', tAoa, [{wch:24}]);
    }
  }
  XLSX.writeFile(wb,`callsheet-${data.shootDate||'draft'}${data.dayNum?('-day'+data.dayNum):''}.xlsx`);
}
</script>
</body>
</html>
