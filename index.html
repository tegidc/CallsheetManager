  const rateRaw = row.querySelector('.rr-rate').value.trim();
  const rate = Number(rateRaw);
  const kit = Number(kitInput.value);
  const hasRate = rateRaw!=='' && !isNaN(rate);
  row.querySelector('.rr-labour').textContent =
    (split && hasRate && !isNaN(kit)) ? fmtRateVat(labourOf(rate, kit)) : '—';
  /* ⚠️ Reads #ncVat LIVE rather than a value captured at render: the select sits in this
     same section and can be changed after the rows are on screen. */
  const vatReg = (val('ncVat')==='Yes');
  row.querySelector('.rr-vat').textContent = (vatReg && hasRate) ? fmtRateVat(rate*VAT_RATE) : '—';
  row.querySelector('.rr-inc').textContent = (vatReg && hasRate) ? fmtRateVat(rate*(1+VAT_RATE)) : '—';
}
/* the VAT select changes every row at once, so it re-runs the same per-row function

/* The read side of the Rates section. A row with no usable rate stores NOTHING rather

function collectRoleRates(existing){
  const out = Object.assign({}, existing||{});
  document.querySelectorAll('.rate-row[data-rolepath]').forEach(row=>{
    const path = row.getAttribute('data-rolepath');
    const rateRaw = row.querySelector('.rr-rate').value.trim();
    const rate = Number(rateRaw);

   for browsers/contexts that block it. Pass a message to confirm, or omit to copy
   silently (used where the button itself is feedback enough). */
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }
    catch(e2){ alert('Copy failed — select the text and copy manually.'); document.body.removeChild(ta); return; }
    document.body.removeChild(ta);
  }
  if(okMsg) alert(okMsg);
}

const DB_OBJECT_KEYS = ['db:roleseniority','db:settings','db:roles'];
const isObjDB = key => DB_OBJECT_KEYS.includes(key);
let dbStamp = {};   // key -> updated_at last seen
let dbBase  = {};   // key -> deep snapshot matching that stamp
let dbLoadFailed = new Set();
const dbClone = v => JSON.parse(JSON.stringify(v ?? null));

async function loadDB(key){
  const empty = () => isObjDB(key) ? {} : [];
  try{
    const { data, error } = await sb.from('app_data').select('value, updated_at').eq('key', key).maybeSingle();
    if(error){ console.error('Supabase load failed ('+key+'):', error.message); dbLoadFailed.add(key); return empty(); }
    dbLoadFailed.delete(key);
    if(!data){ dbStamp[key] = null; dbBase[key] = empty(); return empty(); }
    dbStamp[key] = data.updated_at;
    dbBase[key]  = dbClone(data.value);
    return data.value;
  }catch(e){ console.error('Supabase load exception ('+key+'):', e); dbLoadFailed.add(key); return empty(); }
}

function mergeDB(base, mine, theirs){
  const same = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  if(Array.isArray(mine) && Array.isArray(theirs)){
    const keyed = a => Array.isArray(a) && a.every(r => r && typeof r==='object' && r.id);
    if(!keyed(mine) || !keyed(theirs) || !keyed(base||[])) return mine;
    const B = new Map((base||[]).map(r=>[r.id,r]));
    const M = new Map(mine.map(r=>[r.id,r]));
    const T = new Map(theirs.map(r=>[r.id,r]));
    const out = [];
    // their order first (so records added elsewhere keep a stable home), then ours
    const ids = [...new Set([...theirs.map(r=>r.id), ...mine.map(r=>r.id)])];
    ids.forEach(id=>{
      const b = B.get(id), m = M.get(id), t = T.get(id);
      if(m && t)  { out.push(same(m,b) ? t : m); return; }           // both have it: the side that changed wins, ours on a tie
      if(m && !t) { if(!b) out.push(m); return; }                    // only ours: new here = keep, else they deleted it
      if(!m && t) { if(!b) out.push(t); return; }                    // only theirs: new there = keep, else we deleted it
    });
    return out;
  }
  if(mine && theirs && typeof mine==='object' && typeof theirs==='object'){
    const out = {...theirs};
    Object.keys(mine).forEach(k=>{
      if(!same(mine[k], (base||{})[k]) || !(k in theirs)) out[k] = mine[k];   // we changed it, or it's new here
    });
    Object.keys(base||{}).forEach(k=>{ if(!(k in mine) && same((base||{})[k], theirs[k])) delete out[k]; });
    return out;
  }
  return mine;
}

/* ⚠️ ONE WRITE PER KEY AT A TIME (20 Sep 2026). saveDBNow()'s guarded write compares against the
   stamp of the last write this tab SAW LAND — so two saves of the same key in flight together
   race each other: the second is "beaten" by the first, re-reads, retries, and a burst of quick
   clicks (Add, Add, Add in the flag popup; a run of meal ticks) could lose all three attempts and
   be reported as "not saved — another writer". Queuing per key removes the self-inflicted
   conflict; the merge path is still there for a genuine second tab or device. `value` is the
   live array/object, so a queued save writes the state as it is when its turn comes. */
const _saveChains = {};
function saveDB(key, value){
  const run = () => saveDBNow(key, value);
  const p = (_saveChains[key] || Promise.resolve()).then(run, run);
  _saveChains[key] = p.catch(()=>{});
  return p;
}
async function saveDBNow(key, value){
  const stamp = () => new Date().toISOString();
  // `value` is reassigned by the merge below, so this deliberately reads it at
  // call time: a retry should push the merged value, not the pre-merge one.
  const fail = (kind, detail) => { reportSaveFailure(key, kind, detail, value); return {ok:false, kind, detail}; };
  const ok   = () => { clearSaveFailure(key); return {ok:true}; };
  if(dbLoadFailed.has(key)){
    // This collection never loaded, so what's in memory is NOT what's in the
    // database — writing now would overwrite the stored data with a fallback.
    return fail('unsaved', "this data couldn't be loaded when the app started, so saving it is blocked to protect what's already stored — reload the page");
  }
  try{
    for(let attempt=0; attempt<3; attempt++){
      const now = stamp();
      // No row yet (or we've never read one): plain upsert, nothing to conflict with.
      if(dbStamp[key] == null){
        const { data, error } = await sb.from('app_data')
          .upsert({ key, value, updated_at:now }).select('updated_at');
        if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
        // store the stamp AS POSTGRES RETURNS IT, not the JS string we sent: the two
        // differ textually ('…123Z' vs '…123000+00:00') and only compare equal because
        // postgres casts them. Round-tripping the canonical value removes that reliance.
        dbStamp[key] = (data && data[0] && data[0].updated_at) || now;
        dbBase[key] = dbClone(value); return ok();
      }
      // Guarded write — only lands if nobody else has written since we last looked.
      const { data, error } = await sb.from('app_data')
        .update({ value, updated_at:now }).eq('key', key).eq('updated_at', dbStamp[key]).select('updated_at');
      if(error){ console.error('Supabase save failed ('+key+'):', error.message); return fail('unsaved', error.message); }
      if(data && data.length){ dbStamp[key] = data[0].updated_at || now; dbBase[key] = dbClone(value); return ok(); }

      // Guard failed: somebody wrote in between. Take their version, merge, retry.
      const { data: fresh, error: reErr } = await sb.from('app_data')
        .select('value, updated_at').eq('key', key).maybeSingle();
      if(reErr || !fresh){
        console.error('Supabase merge re-read failed ('+key+')', reErr && reErr.message);
        return fail('unsaved', (reErr && reErr.message) || 'the stored row could not be read back');
      }
      const merged = mergeDB(dbBase[key], value, fresh.value);
      console.warn(`[${key}] another tab or device wrote while this one was editing — merged both instead of overwriting.`);
      dbStamp[key] = fresh.updated_at;
      dbBase[key]  = dbClone(fresh.value);
      value = merged;
      applyMergedDB(key, merged);   // put the merged result back into the live in-memory array
    }
    console.error('Supabase save gave up after repeated conflicts ('+key+')');
    return fail('discarded', 'three guarded writes in a row were beaten by another writer');
  }catch(e){
    console.error('Supabase save exception ('+key+'):', e);
    return fail('unsaved', (e && e.message) || String(e));
  }
}

function saveInBackground(key, value){
  return saveDB(key, value).then(res=>{
    if(res && !res.ok) renderProjectBody();
    return res;
  });
}

const DB_KEY_LABELS = {
  'db:crew':'the crew database', 'db:locations':'the locations database',
  'db:projects':'project details', 'db:shootdays':'shoot days',
  'db:settings':'settings', 'db:roles':'the roles list',
  'db:roleseniority':'role seniority',
  'db:travelmethods':'travel methods', 'db:coprocompanies':'production companies',
  'db:vendors':'the vendors list', 'db:feedback':'demo feedback notes'
};
let saveFailure = null;   // {key, kind:'unsaved'|'discarded', detail, value, retrying}

function reportSaveFailure(key, kind, detail, value){
  /* 'discarded' outranks 'unsaved' for the same key: it's the one that means data
     is actually gone, so a later network blip must not quietly demote the wording
     from "your change was not saved" to "not saved yet". */
  const keepWorse = saveFailure && saveFailure.key===key
                    && saveFailure.kind==='discarded' && kind!=='discarded';
  saveFailure = { key, value, retrying:false,
                  kind:   keepWorse ? 'discarded'        : kind,
                  detail: keepWorse ? saveFailure.detail : detail };
  renderSaveFailureBanner();
}
/* Cleared only by a success on the SAME key — db:projects saving fine says nothing
   about whether db:shootdays ever landed. */
function clearSaveFailure(key){
  if(saveFailure && saveFailure.key===key){ saveFailure = null; renderSaveFailureBanner(); }
}
function dismissSaveFailure(){ saveFailure = null; renderSaveFailureBanner(); }
async function retrySaveFailure(){
  if(!saveFailure || saveFailure.retrying) return;
  const f = saveFailure;
  f.retrying = true; renderSaveFailureBanner();
  await saveDB(f.key, f.value);   // clears the banner on success, replaces it on a fresh failure
  if(saveFailure === f) saveFailure.retrying = false;
  renderSaveFailureBanner();
}
function renderSaveFailureBanner(){
  let el = document.getElementById('saveFailBanner');
  if(!saveFailure){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='saveFailBanner'; document.body.appendChild(el); }
  const f = saveFailure, what = DB_KEY_LABELS[f.key] || f.key, lost = f.kind==='discarded';
  el.className = 'save-banner' + (lost ? ' save-banner-lost' : '');
  const msg = lost
    ? `<strong>Your last change was not saved.</strong> Something else kept writing to ${esc(what)} while you were editing, so this change could not be stored. It is still on screen but it is <strong>not in the database</strong> — reload now and it is gone.`
    : `<strong>Not saved yet.</strong> Couldn't write ${esc(what)} to the database. Nothing has been lost — your changes are still on screen, and the next save of the same data that succeeds will carry them.`;
  el.innerHTML = `<div class="save-banner-text">${msg}${f.detail?`<div class="save-banner-detail">${esc(f.detail)}</div>`:''}</div>
    <button type="button" class="small" onclick="retrySaveFailure()"${f.retrying?' disabled':''}>${f.retrying?'Retrying…':'Retry save'}</button>
    <span class="save-banner-close" onclick="dismissSaveFailure()" title="Dismiss">${icon('close')}</span>`;
}

/* The in-memory arrays are what every screen renders from, and other code holds
   references to them, so a merge has to be written back IN PLACE (splice, not
   reassign) or half the app keeps rendering the pre-merge copy. */
function applyMergedDB(key, merged){
  const live = { 'db:crew':()=>crewDB, 'db:locations':()=>locationsDB,
                 'db:projects':()=>projectsDB, 'db:shootdays':()=>shootDaysDB,
                 'db:travelmethods':()=>travelMethodsList, 'db:coprocompanies':()=>coProCompaniesList,
                 'db:vendors':()=>vendorsDB, 'db:feedback':()=>feedbackDB }[key];
  if(live && Array.isArray(merged)){
    const arr = live(); if(Array.isArray(arr)){ arr.splice(0, arr.length, ...merged); }
  } else if(key==='db:settings' && merged && typeof merged==='object'){
    appSettings = Object.assign({}, SETTINGS_DEFAULTS, merged); applyAppSettings();
  } else if(key==='db:roleseniority' && merged) { ROLE_SENIORITY = merged; }
  else if(key==='db:roles' && merged && !Array.isArray(merged)) { ROLES_BY_DEPT = merged; }
  if(typeof renderSide==='function') renderSide();
  if(typeof renderMain==='function') renderMain();
}

async function initApp(){
  /* All nine collections load in PARALLEL — none depends on another's value, and
     in series this was nine full round-trips before anything rendered. */
  const [crew, locations, projects, shootdays, travel, copro,
         savedRoles, savedRoleSeniority, savedSettings, vendors, feedback] = await Promise.all([
    loadDB('db:crew'), loadDB('db:locations'), loadDB('db:projects'),
    loadDB('db:shootdays'), loadDB('db:travelmethods'), loadDB('db:coprocompanies'),
    loadDB('db:roles'), loadDB('db:roleseniority'), loadDB('db:settings'),
    loadDB('db:vendors'), loadDB('db:feedback')
  ]);
  crewDB = crew; locationsDB = locations; projectsDB = projects;
  shootDaysDB = shootdays; travelMethodsList = travel; coProCompaniesList = copro;
  vendorsDB = vendors; feedbackDB = feedback;
  if(savedRoles && !Array.isArray(savedRoles) && Object.keys(savedRoles).length) ROLES_BY_DEPT = savedRoles;
  if(savedRoleSeniority && !Array.isArray(savedRoleSeniority) && Object.keys(savedRoleSeniority).length) ROLE_SENIORITY = savedRoleSeniority;
  if(savedSettings && !Array.isArray(savedSettings)) appSettings = Object.assign({}, SETTINGS_DEFAULTS, savedSettings);
  applyAppSettings();
  if(['all','crew','talent'].includes(appSettings.crewPeopleKind)) crewPeopleKind = appSettings.crewPeopleKind;
  renderLoadFailureBanner();
  if(!travelMethodsList.length){
    travelMethodsList = ['Own car','Production transport','Train','Flying','Public transport'];
    await saveDB('db:travelmethods', travelMethodsList);
  }
  if(!dbLoadFailed.size && !crewDB.length && !locationsDB.length && !projectsDB.length){
    try{
      await loadScriptOnce('sample-data.js');
      await seedSampleData();
      await migrateCrewEntries();
      await migrateOnShoot();
      await migratePhaseMembers();
    }catch(e){ console.error('Sample data failed to load:', e); }
  }
  renderSide(); renderMain();
  renderDemoBanner();
}

const GRID_ROW_SELECTOR = '.crewgrid-row, .meal-subrow, .pb-role-row';
const checkboxesIn = row => [...row.querySelectorAll('.crewgrid-check input[type=checkbox]')];
document.addEventListener('keydown', function(e){
  const keys = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter'];
  if(!keys.includes(e.key)) return;
  const active = document.activeElement;
  if(!active || active.type!=='checkbox' || !active.closest('.crewgrid-check')) return;

  // Enter toggles, matching Space — click() so the onchange handler still fires
  if(e.key==='Enter'){ e.preventDefault(); active.click(); return; }

  const row = active.closest(GRID_ROW_SELECTOR);
  if(!row) return;
  e.preventDefault();
  const inRow = checkboxesIn(row);
  const i = inRow.indexOf(active);

  if(e.key==='Home'){ inRow[0]?.focus(); return; }
  if(e.key==='End'){ inRow[inRow.length-1]?.focus(); return; }
  if(e.key==='ArrowRight'){ if(i<inRow.length-1) inRow[i+1].focus(); return; }
  if(e.key==='ArrowLeft'){ if(i>0) inRow[i-1].focus(); return; }

  // up/down: same column index in the nearest row that actually has checkboxes
  const allRows = [...document.querySelectorAll(GRID_ROW_SELECTOR)];
  const step = e.key==='ArrowDown' ? 1 : -1;
  for(let ri = allRows.indexOf(row) + step; ri >= 0 && ri < allRows.length; ri += step){
    const targetInputs = checkboxesIn(allRows[ri]);
    if(!targetInputs.length) continue;              // skip label-only rows
    targetInputs[Math.min(i, targetInputs.length-1)].focus();
    return;
  }
});

async function toggleAllForPerson(id, kind){
  const days = projectDays();
  if(kind==='hotel'){
    const crewId = id;
    const p = currentProject();
    p.hotelNightBefore = p.hotelNightBefore || [];
    const allOn = p.hotelNightBefore.includes(crewId) && days.every(d=>(d.hotelNights||[]).includes(crewId));
    if(allOn){
      p.hotelNightBefore = p.hotelNightBefore.filter(id=>id!==crewId);
      days.forEach(d=>{ d.hotelNights = (d.hotelNights||[]).filter(id=>id!==crewId); });
    } else {
      if(!p.hotelNightBefore.includes(crewId)) p.hotelNightBefore.push(crewId);
      days.forEach(d=>{ d.hotelNights = d.hotelNights||[]; if(!d.hotelNights.includes(crewId)) d.hotelNights.push(crewId); });
    }
    saveInBackground('db:projects', projectsDB);
  } else {
    // 'days' — Days on site, keyed by ENTRY id
    const entryId = id;
    const allOn = days.length>0 && days.every(d=>entryOnDay(entryId, d));
    days.forEach(d=>{
      d.positions = d.positions || [];
      const idx = d.positions.findIndex(pos=>pos[0]===entryId);
      if(allOn){ if(idx>-1) d.positions.splice(idx,1); }
      else if(idx===-1){ d.positions.push([entryId, '', '', '', '']); }
    });
  }
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}
/* ---- toggle-all for one meal across every day, for one person (Catering) ---- */
async function toggleAllMealForPerson(crewId, mealKey){
  const days = projectDays();
  const allOn = days.length>0 && days.every(d=>getCateringMeals(d.id, crewId)[mealKey]);
  days.forEach(d=>{
    d.cateringMeals = d.cateringMeals || {};
    d.cateringMeals[crewId] = d.cateringMeals[crewId] || {b:false, l:false, d:false};
    d.cateringMeals[crewId][mealKey] = !allOn;
    if(!d.cateringMeals[crewId].b && !d.cateringMeals[crewId].l && !d.cateringMeals[crewId].d) delete d.cateringMeals[crewId];
  });
  // G14 — render first, save after (see saveInBackground)
  renderProjectBody();
  saveInBackground('db:shootdays', shootDaysDB);
}

function refreshTabScrollCues(){
  document.querySelectorAll('.tabs').forEach(tabs=>{
    const overflows = tabs.scrollWidth > tabs.clientWidth + 1;
    let wrap = tabs.parentElement;
    if(!wrap || !wrap.classList.contains('tabscroll')){
      if(!overflows) return;                       // nothing to signal
      wrap = document.createElement('div');
      wrap.className = 'tabscroll';
      tabs.parentNode.insertBefore(wrap, tabs);
      wrap.appendChild(tabs);
      tabs.addEventListener('scroll', ()=>{
        const atEnd = tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2;
        wrap.classList.toggle('tabscroll-end', atEnd);
      }, {passive:true});
    }
    wrap.classList.toggle('tabscroll-end', !overflows ||
      tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2);
  });
}

/* ⚠️ EVERY RE-RENDER KEEPS YOUR PLACE (20 Sep 2026). A tab is rebuilt wholesale by innerHTML, which
   used to throw away where you were: the page could shift, and any scroll box inside the tab —
   Roles' own frozen-pane list above all — snapped back to its top, so one click on Only / a tick /
   a toggle meant hunting for the person you had been looking at. renderProjectBody() now notes the
   page position and every inner scroller's position before the rebuild and puts them back after —
   but only when it is still the same screen (tab + sub-view); a tab change still starts at the top. */
const SCROLL_KEEPERS = '.roles-tablewrap, .tablewrap, .xls-wrap, .sd-tablescroll, .filter-box';
let _lastBodyScreen = '';
function renderProjectBody(){
  const body = document.getElementById('projectBody');
  if(!body) return;
  const screen = [currentProjectId, currentProjectTab, crewGridView, crewPeopleKind, budgetView].join('|');
  const same = screen===_lastBodyScreen;
  const pageY = window.scrollY, pageX = window.scrollX;
  const inner = same ? [...body.querySelectorAll(SCROLL_KEEPERS)].map(el=>[el.scrollTop, el.scrollLeft]) : [];
  renderProjectBodyNow(body);
  _lastBodyScreen = [currentProjectId, currentProjectTab, crewGridView, crewPeopleKind, budgetView].join('|');
  if(!same) return;
  [...body.querySelectorAll(SCROLL_KEEPERS)].forEach((el,i)=>{ if(inner[i]){ el.scrollTop = inner[i][0]; el.scrollLeft = inner[i][1]; } });
  if(window.scrollY!==pageY || window.scrollX!==pageX) window.scrollTo(pageX, pageY);
}
function renderProjectBodyNow(body){
  setTimeout(refreshTabScrollCues, 0);
  if(currentProjectTab==='overview') return renderProjectOverview(body);

function crewSearchResultsHTML(query, onCreateJS, limit){

  const hiddenN = pool.length - pool.filter(inScope).length;
  const everyoneLink = bothKinds ? '' : addPersonEveryone
    ? `<div class="sritem" style="cursor:pointer; color:var(--tape);" onclick="setAddPersonEveryone(false)">Showing everyone — back to ${wantTalent?'talent &amp; clients':'crew'} only</div>`

/* ============================================================ TALENT ETC (T-10)
   Talent and Client on a project — see isTalentEtc(). One card in the call-sheet style: a Client
   group and a Talent group; per person a tick for each shoot day (the SAME d.positions the call
   sheet reads — toggleCrewOnDay), an optional fee, and beneath it their own hotel and travel.
     e.rate + e.buyout   the fee (a buyout, so Budget costs it once, not per day) — only if typed
     e.stay = {hotel, nights, perNight, by}     e.trip = {note, cost, by}     by: 'us' | 'them'
   Only by:'us' is costed (talentEtcCosts → Budget's Hotels / Travel lines). */
const stayOf = e => Object.assign({hotel:'', nights:'', perNight:'', by: deptBucketKey(e.department)==='Client' ? 'them' : 'us'}, e.stay||{});
const tripOf = e => Object.assign({note:'', cost:'', by: deptBucketKey(e.department)==='Client' ? 'them' : 'us'}, e.trip||{});
const numOf = v => { const n = Number(String(v==null?'':v).replace(/[£,\s]/g,'')); return isNaN(n) ? 0 : n; };
function talentEtcCosts(p){
  let stay = 0, trip = 0;
  /* ⚠️ 26 Sep 2026 — Talent etc's hotel and travel are Crew's now (night ticks, a travel method, the
     per-person rates). These legacy per-entry figures still count ONLY for someone with no nights
     ticked / no method set, so nothing already costed disappears until it is re-entered the new way. */
  projectEntries(p).filter(isTalentEtc).forEach(e=>{
    const s = stayOf(e), t = tripOf(e);
    if(s.by==='us' && !hotelNightKeysFor(p, e.crewId).length) stay += numOf(s.nights) * numOf(s.perNight);
    if(t.by==='us' && !(p.travelMethods||{})[e.crewId]) trip += numOf(t.cost);
  });
  return {stay, trip};
}
async function setTalentFee(entryId, raw){
  const p = currentProject(), e = entryById(entryId, p); if(!e) return;
  const v = String(raw||'').trim();
  if(!v){ delete e.rate; delete e.buyout; }
  else { const n = numOf(v); if(n<=0){ renderProjectBody(); return; } e.rate = n; e.buyout = true; }
  flashSaveResult('talentStatus', await saveDB('db:projects', projectsDB));
  refreshTalentSummary();
}
function setTalentField(entryId, group, field, value){
  const p = currentProject(), e = entryById(entryId, p); if(!e) return;
  e[group] = Object.assign({}, group==='stay' ? stayOf(e) : tripOf(e), {[field]: value});
  if(field==='by') renderProjectBody();               // the switch is drawn from state
  else refreshTalentSummary();
  scheduleAutosave('talent', async () => flashSaveResult('talentStatus', await saveDB('db:projects', projectsDB)));
}

function talentSummaryHTML(p){
  const list = projectEntries(p).filter(isTalentEtc);
  const fees = list.reduce((s,e)=> s + (Object.prototype.hasOwnProperty.call(e,'rate') ? numOf(e.rate) : 0), 0);
  const c = talentEtcCosts(p);
  // each sub-tab totals its own column — all three are what Budget counts
  if(crewGridView==='hotel')  return `Hotels we book ${c.stay?budgetFmt(c.stay):'—'}`;
  if(crewGridView==='travel') return `Travel we book ${c.trip?budgetFmt(c.trip):'—'}`;
  return `Fees ${fees?budgetFmt(fees):'—'}`;
}
function refreshTalentSummary(){

  // the Hotel row's own total, without re-rendering the row being typed in

   stacked under their name; it is now Roles (day ticks + fee) / Hotel (e.stay) / Travel (e.trip)

/* ⚠️ 24 Sep 2026 — Talent etc is Crew's switch now, not a tab, so its sub-tab IS Crew's:

/* ---- FLAGS (20 Sep 2026) ----
   A flag GROUP is one pill ("3 crew members with no day rate set"); its ELEMENTS are the
   individual things behind it (one per person / per day), each with a stable key:
     date:<dayId>  loc:<dayId>  daycrew:<dayId>  rate:<entryId>  venues  crew
   Clicking a pill opens the flag popup, where each element is either ADDED to the task list
   (a task carrying flagKey — and the field that fixes it, see taskFieldHTML) or IGNORED
   (p.ignoredFlags). An element stops being a flag once it is ignored or has an open task. */
function buildTaskFlagGroups(p, days){
  const plural = (n, one, many) => `${n} ${n===1?one:many}`;
  const groups = [];
  const add = (key, els, titleFn, go) => { if(els.length) groups.push({key, elements:els, titleFn, go}); };
  const dayEl = (kind, d, what) => ({ key:`${kind}:${d.id}`, label:shootDayLabel(d), task:`${what} — Day ${d.dayNum||'?'}${d.date?' ('+fmtDate(d.date)+')':''}` });
  add('date', days.filter(d=>!d.date).map(d=>dayEl('date', d, 'Shoot date')),
      n=>`${plural(n,'shoot day','shoot days')} missing a date`, `goProjectTab('days')`);
  add('venues', (p.locationIds||[]).length ? [] : [{key:'venues', label:'This project has no venues yet', task:'Add a venue to the project'}],
      ()=>'No venues added yet', `goProjectTab('locations')`);
  add('crew', projectEntries(p).length ? [] : [{key:'crew', label:'This project has no crew yet', task:'Add crew to the project'}],
      ()=>'No crew assigned yet', `goProjectTab('crew')`);
  add('loc', days.filter(d=>!d.locationId).map(d=>dayEl('loc', d, 'Location')),
      n=>`${plural(n,'shoot day','shoot days')} with no location`, `goProjectTab('days')`);
  add('daycrew', days.filter(d=>!(d.positions||[]).length).map(d=>dayEl('daycrew', d, 'Crew')),
      n=>`${plural(n,'shoot day','shoot days')} with no crew`, `goProjectTab('days')`);
  /* a note with no diet chosen — the caterer can't file it under anything (the Catering summary lists
     them under the standard diet, marked) */
  add('diet', [...new Set(projectEntries(p).map(e=>e.crewId))].filter(id=>crewOnShoot(id, p)).map(id=>crewById(id)).filter(c=>c && !c.dietaryGeneral && (c.dietarySpecific||c.dietary))
      .map(c=>({ key:`diet:${c.id}`, label:`${c.name||'(no name)'} — “${c.dietarySpecific||c.dietary}”`, task:`Set a diet for ${c.name||'(no name)'} — they have a dietary note but no diet chosen` })),
      n=>`${plural(n,'person has','people have')} a dietary note but no diet set`, `crewGridView='catering';goProjectTab('crew')`);
  if(typeof resolveEntryRate==='function'){
    add('rate', projectEntryViews(p).filter(v=>!isTalentEtc(v) && !resolveEntryRate(v.id,p).hasRate).map(v=>({
          key:`rate:${v.id}`, label:`${v.name||'(no name)'}${v.role?' — '+v.role:''}`, task:`Day rate — ${v.name||'(no name)'}${v.role?' ('+v.role+')':''}` })),
      n=>`${plural(n,'crew member','crew members')} with no day rate set`, `budgetView='person';goProjectTab('budget')`);
  }
  return groups;
}
/* the groups as they should be SHOWN: minus what is ignored or already an open task */
function buildTaskFlags(p, days){
  const hidden = new Set([...(p.ignoredFlags||[]), ...(p.tasks||[]).filter(t=>t.flagKey && !t.completed).map(t=>t.flagKey)]);
  return buildTaskFlagGroups(p, days).map(g=>{
    const els = g.elements.filter(e=>!hidden.has(e.key));
    // the pill counts what is LEFT to deal with, not everything behind the flag
    return els.length ? Object.assign({}, g, { elements:els, label:g.titleFn(els.length) }) : null;
  }).filter(Boolean);
}
function taskFlagPillsHTML(groups){
  if(!groups.length) return '<div class="empty-note">No flags right now.</div>';
  return `<div class="taglist">${groups.map(g=>`<span class="pill" style="cursor:pointer;border:1px solid var(--danger);color:var(--danger)" onclick="openFlagDialog('${g.key}')" title="Click to add to your tasks, or ignore">⚠ ${esc(g.label)}</span>`).join('')}</div>`;
}
/* a flag-task whose problem has gone away (fixed from its own field, or anywhere else in the
   app) ticks itself off; one whose subject no longer exists does too */
function syncFlagTasks(p, days){
  const live = new Set(buildTaskFlagGroups(p, days).flatMap(g=>g.elements.map(e=>e.key)));
  let changed = false;
  (p.tasks||[]).forEach(t=>{ if(t.flagKey && !t.completed && !live.has(t.flagKey)){ t.completed = true; changed = true; } });
  if(changed) saveInBackground('db:projects', projectsDB);
}
/* ---- the flag popup ----
   ⚠️ It stays open until Done (or Esc / a click outside) — the point is to work through several
   elements in one sitting. The rows are a SNAPSHOT taken on open (flagDialogRows); a row that has
   been dealt with stays in the list, marked Added / Ignored with an Undo, rather than vanishing. */
let flagDialogKey = null;
let flagDialogRows = [];          // [{key,label,task}] as they were when the popup opened
let flagDialogHandled = {};       // key -> 'add' | 'ignore', this sitting only
let flagDialogTitle = '', flagDialogGo = '';
function openFlagDialog(key){
  const p = currentProject(); if(!p) return;
  const g = buildTaskFlags(p, projectDays(p.id)).find(x=>x.key===key); if(!g) return;
  flagDialogKey = key; flagDialogRows = g.elements.slice(); flagDialogHandled = {};
  flagDialogTitle = g.label; flagDialogGo = g.go;
  renderFlagDialog();
}
function closeFlagDialog(){ flagDialogKey = null; flagDialogRows = []; flagDialogHandled = {}; const el = document.getElementById('flagDialog'); if(el) el.remove(); }
function renderFlagDialog(){
  if(!flagDialogKey) return;
  let el = document.getElementById('flagDialog');
  if(!el){ el = document.createElement('div'); el.id = 'flagDialog'; document.body.appendChild(el); }
  const list = el.querySelector('.flag-list'), scroll = list ? list.scrollTop : 0;
  const left = flagDialogRows.filter(e=>!flagDialogHandled[e.key]);

async function completeFlagTask(taskId){
  const p = currentProject(); if(!p) return;

  const day = dayById(id);
  let saveDays = false;

    const n = Number(v.replace(/[£,\s]/g,''));
    if(!v || isNaN(n) || n<0){ say('Enter a number'); return; }
    const e = entryById(id, p); if(!e){ say('No longer on the project'); return; }
    e.rate = n;                                   // same field Budget → Per Person writes (saveEntryRate)
  } else if(kind==='date'){
    if(!v){ say('Pick a date'); return; }
    if(!day){ say('That day no longer exists'); return; }

  } else if(kind==='loc'){
    if(!v){ say('Pick a venue'); return; }
    if(!day){ say('That day no longer exists'); return; }
    day.locationId = v; saveDays = true;
    const l = locById(v); if(l && l.parkingInfo && !day.parking) day.parking = l.parkingInfo;   // as the day form pre-fills it
    p.locationIds = p.locationIds || []; if(!p.locationIds.includes(v)) p.locationIds.push(v);
  } else if(kind==='venues'){
    if(!v){ say('Pick a venue'); return; }
    p.locationIds = p.locationIds || []; if(!p.locationIds.includes(v)) p.locationIds.push(v);
  } else if(kind==='daycrew'){
    if(!v){ say('Pick someone'); return; }
    if(!day){ say('That day no longer exists'); return; }
    day.positions = day.positions || [];
    if(!day.positions.some(x=>x[0]===v)) day.positions.push([v,'','','','']);
    saveDays = true;
  } else return;
  t.completed = true;
  renderProjectBody();                            // G14 — render first, save after
  if(saveDays) await saveDB('db:shootdays', shootDaysDB);
  await saveDB('db:projects', projectsDB);
}

/* ============================================================ PROJECT NOTES (T-9)
   A scratchpad per project: free text, nothing else. Stored on the project record
   (p.notes = [{id, html, text, createdAt, updatedAt}]) next to Tasks, so it travels
   with the project and needs no new collection. Newest first, searchable, autosaved
   the way Project details is.
   18 Sep 2026 — bodies are rich text (contenteditable): bold / italic / underline,
   a heading, bullet and numbered lists (Tab / Shift+Tab nests), plus "- " / "* " /
   "1. " at the start of a line as typing shortcuts. `html` is the body, ALWAYS passed
   through sanitizeNoteHTML() (whitelist of tags, no attributes) on the way in (paste,
   save) and on the way out (render). `text` is kept as the plain-text shadow: search,
   the delete-Undo peek, and notes written before this date (text only) all read it.
   Still deliberately no tags, attachments or sharing — when a scrap turns into
   something real it becomes a task, a venue or a crew entry through the tools that
   already exist. */
let notesQuery = '';
const NOTE_TAGS = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u', UL:'ul', OL:'ol', LI:'li', BR:'br',
  DIV:'div', P:'div', BLOCKQUOTE:'div', PRE:'div', TR:'div', SECTION:'div', ARTICLE:'div',
  H1:'h3', H2:'h3', H3:'h3', H4:'h3', H5:'h3', H6:'h3' };
const NOTE_DROP = /^(SCRIPT|STYLE|META|LINK|TITLE|HEAD|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|IMG)$/i;
/* rebuilds the markup from whitelisted tags only — unknown elements are unwrapped
   (their text survives), attributes never do. DOMParser documents are inert. */
function sanitizeNoteHTML(html){
  const src = new DOMParser().parseFromString('<body>'+(html||'')+'</body>','text/html').body;
  const out = document.createElement('div');
  const walk = (from, to) => from.childNodes.forEach(ch=>{
    if(ch.nodeType===3){ to.appendChild(document.createTextNode(ch.nodeValue.replace(/[\r\n\t]+/g,' '))); return; }
    if(ch.nodeType!==1 || NOTE_DROP.test(ch.tagName)) return;
    const tag = NOTE_TAGS[ch.tagName.toUpperCase()];
    const el = tag ? to.appendChild(document.createElement(tag)) : null;
    if(tag!=='br') walk(ch, el||to);
  });
  walk(src, out);
  return out.innerHTML;
}
/* a note's body as safe HTML — notes from before rich text only have `text` */
const noteHTML = (n) => sanitizeNoteHTML(n.html!=null ? n.html : esc(n.text||'').replace(/\n/g,'<br>'));
const noteIsEmpty = (el) => !el.textContent.trim() && !el.querySelector('ul,ol,h3');
const noteEditorOf = (node) => { const el = node && (node.nodeType===1 ? node : node.parentElement); return el ? el.closest('.note-text') : null; };
/* toolbar buttons — they keep the selection (onmousedown preventDefault in the markup) */
function noteCmd(btn, cmd){
  const ed = btn.closest('.note-row').querySelector('.note-text'); if(!ed) return;
  if(noteEditorOf(getSelection().anchorNode) !== ed) ed.focus();
  if(cmd==='heading') document.execCommand('formatBlock', false, /^h3$/i.test(document.queryCommandValue('formatBlock')) ? 'div' : 'h3');
  else document.execCommand(cmd, false, null);
  noteAfterEdit(ed);
}
function noteAfterEdit(ed){
  ed.classList.toggle('is-empty', noteIsEmpty(ed));
  refreshNoteTools();
  scheduleAutosave('notes', saveProjectNotes);
}
function refreshNoteTools(){
  const ed = noteEditorOf(getSelection().anchorNode);
  document.querySelectorAll('.note-tools .icon-btn').forEach(b=>{
    let on = false;
    if(ed && b.closest('.note-row') === ed.closest('.note-row')){
      try{ on = b.dataset.cmd==='heading' ? /^h3$/i.test(document.queryCommandValue('formatBlock')) : document.queryCommandState(b.dataset.cmd); }catch(e){}
    }
    b.classList.toggle('active', on);
  });
}
/* "- " / "* " / "1. " typed at the start of a plain line turns it into a list */
function noteAutoList(e){
  if(e.inputType!=='insertText' || e.data!==' ') return;
  const sel = getSelection(); if(!sel.isCollapsed) return;
  const node = sel.anchorNode; if(!node || node.nodeType!==3) return;
  const m = /^(-|\*|1\.)[ \u00a0]$/.exec(node.nodeValue.slice(0, sel.anchorOffset)); if(!m) return;
  if(node.previousSibling && !/^(BR|UL|OL|DIV|H3)$/.test(node.previousSibling.nodeName)) return;   // must open the line
  if(node.parentElement.tagName!=='DIV') return;          // not inside a list item, heading or bold run
  const ed = e.target, end = sel.anchorOffset;
  // after the input event has finished — editing commands don't nest reliably inside it
  setTimeout(()=>{
    const s2 = getSelection();
    if(s2.anchorNode!==node || s2.anchorOffset!==end || !s2.isCollapsed) return;
    const r = document.createRange(); r.setStart(node,0); r.setEnd(node,end);
    s2.removeAllRanges(); s2.addRange(r);
    document.execCommand('delete');
    document.execCommand(m[1]==='1.' ? 'insertOrderedList' : 'insertUnorderedList');
    noteAfterEdit(ed);
  }, 0);
}
function fmtDateTime(iso){
  if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return '';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* T-9 is a SECTION OF OVERVIEW since 20 Sep 2026 (it was its own tab). notesSectionHTML() is the
   markup, wireNotesHandlers() the key/paste plumbing; the Overview's own body.oninput routes
   .note-text typing to noteAfterEdit(). */
let notesSectionOpen = true;
function toggleNotesSection(){ flushNotesEdits(); notesSectionOpen = !notesSectionOpen; renderProjectBody(); }
/* ⚠️ saveProjectNotes() READS THE EDITORS. Anything that rebuilds or leaves them calls this first,
   or the last second of typing (the autosave debounce) is lost. The DOM reads happen before the
   first await, so callers needn't await it. */
function flushNotesEdits(){
  if(!document.querySelector('.note-text')) return;
  clearTimeout(autosaveTimers.notes);
  saveProjectNotes();

function notesSectionHTML(p){

function wireNotesHandlers(body){
  try{ document.execCommand('defaultParagraphSeparator', false, 'div'); }catch(e){}
  // Tab / Shift+Tab nests a list item (anywhere else Tab keeps its normal job);
  // Enter on an empty item steps out one level, so Enter twice ends the list
  body.onkeydown = (e) => {
    if((e.key!=='Tab' && e.key!=='Enter') || e.isComposing || !noteEditorOf(e.target)) return;
    const at = getSelection().anchorNode, el = at && (at.nodeType===1 ? at : at.parentElement);
    const li = el && el.closest('li'); if(!li) return;
    if(e.key==='Enter' && (e.shiftKey || li.textContent.trim() || li.querySelector('ul,ol'))) return;
    e.preventDefault();
    document.execCommand(e.key==='Tab' && !e.shiftKey ? 'indent' : 'outdent');
    noteAfterEdit(noteEditorOf(e.target));
  };
  // paste keeps structure (paragraphs, lists, bold) but none of the source's styling
  body.onpaste = (e) => {
    const ed = noteEditorOf(e.target); if(!ed || !e.clipboardData) return;
    e.preventDefault();
    const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
    document.execCommand('insertHTML', false, html ? sanitizeNoteHTML(html) : esc(text).replace(/\r?\n/g,'<br>'));
    noteAfterEdit(ed);
  };
  if(!wireNotesHandlers._sel){ wireNotesHandlers._sel = true; document.addEventListener('selectionchange', ()=>{ if(document.querySelector('.note-tools')) refreshNoteTools(); }); }
}
function renderNotesList(){
  const el = document.getElementById('notesList'); if(!el) return;

  if(!rows.length){ el.innerHTML = `<div class="empty-note">Nothing matches “${esc(notesQuery.trim())}”.</div>`; return; }
  el.innerHTML = (q ? `<div class="hint" style="margin:0 0 6px;">${rows.length} of ${all.length} match.</div>` : '') + rows.map(n=>{
    const edited = n.updatedAt && (n.updatedAt||'').slice(0,16) !== (n.createdAt||'').slice(0,16);

        <span class="note-tools" onmousedown="event.preventDefault()">
          <button class="icon-btn" data-cmd="bold" onclick="noteCmd(this,'bold')" title="Bold (⌘B)" aria-label="Bold"><b>B</b></button>

          <button class="icon-btn" data-cmd="heading" onclick="noteCmd(this,'heading')" title="Heading" aria-label="Heading">H</button>
          <button class="icon-btn" data-cmd="insertUnorderedList" onclick="noteCmd(this,'insertUnorderedList')" title="Bullet list (or type “- ” at the start of a line)" aria-label="Bullet list">•—</button>
          <button class="icon-btn" data-cmd="insertOrderedList" onclick="noteCmd(this,'insertOrderedList')" title="Numbered list (or type “1. ”)" aria-label="Numbered list">1.</button>
        </span>

      </div>
      <div class="note-text" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note" data-id="${n.id}" data-placeholder="Type anything — a number, a name, half a thought.">${noteHTML(n)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.note-text').forEach(ed=>ed.classList.toggle('is-empty', noteIsEmpty(ed)));

/* reads every note body on screen; writes only the ones that changed */
async function saveProjectNotes(){

  document.querySelectorAll('.note-text').forEach(ed=>{
    const n = (p.notes||[]).find(x=>x.id===ed.dataset.id); if(!n) return;

/* ---- file attachments ---- */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]); // strip the data: URL prefix
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
async function fileToContentBlock(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    const b64 = await fileToBase64(file);
    return { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } };
  }
  if(name.endsWith('.docx')){
    try{ await ensureMammoth(); }catch(e){ throw new Error('the .docx reader failed to load'); }
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return { type:'text', text:`[Attached document: ${file.name}]\n\n${result.value}` };
  }
  const text = await fileToText(file);
  return { type:'text', text:`[Attached document: ${file.name}]\n\n${text}` };
}
async function handleAiScanFileInput(inputEl){
  const files = [...(inputEl.files||[])];
  inputEl.value = ''; // so re-picking the same file again later still fires onchange
  const failures = [];
  for(const file of files){
    if(file.size > 15*1024*1024){ failures.push(`"${file.name}" is over 15MB — attach a smaller file.`); continue; }
    try{
      const block = await fileToContentBlock(file);
      aiScanPendingFiles.push({ block, filename: file.name });
    } catch(err){
      failures.push(`Couldn't read "${file.name}": ${err.message||err}`);
    }
  }
  aiScanError = failures.length ? failures.join('\n') : null;
  renderProjectBody();
}
function removeAiScanPendingFile(idx){ aiScanPendingFiles.splice(idx,1); renderProjectBody(); }

/* ---- sending a turn ---- */
function buildCrewSummary(){ return crewDB.map(c=>({id:c.id, name:c.name, role:c.role||''})); }
function buildLocationSummary(){ return locationsDB.map(l=>({id:l.id, name:l.name})); }
function pendingAiToolResultBlocks(){
  const last = aiScanMessages[aiScanMessages.length-1];
  if(!last || last.role!=='assistant') return [];
  const toolUses = (last.content||[]).filter(b=>b.type==='tool_use');
  return toolUses.map(tu=>{
    const st = aiScanProposals[tu.id];
    let text = 'The user has not reviewed this proposal yet.';
    if(st){
      if(st.status==='accepted_new') text = 'The user added this as a new record in the project.';
      else if(st.status==='accepted_match') text = `The user confirmed this matches an existing record (${st.matchLabel||'match'}) and assigned it to the project.`;
      else if(st.status==='discarded') text = 'The user declined this proposal. Do not propose it again unless new information changes it.';
    }
    return { type:'tool_result', tool_use_id: tu.id, content: text };
  });
}
/* strip the display-only filename we stash on document/text blocks before
   they go anywhere near the actual API request */
function stripAiScanDisplayFields(messages){
  return JSON.parse(JSON.stringify(messages, (k,v)=> k==='_filename' ? undefined : v));
}
async function sendAiScanMessage(){
  if(aiScanBusy) return;
  const text = (val('aiScanInput')||'').trim();
  const files = aiScanPendingFiles.slice();
  if(!text && !files.length) return;

  const content = files.map(f=>Object.assign({}, f.block, {_filename:f.filename}));
  if(text) content.push({ type:'text', text });
  const newUserMsg = { role:'user', content:[...pendingAiToolResultBlocks(), ...content] };

  aiScanPendingUserMsg = newUserMsg;
  aiScanBusy = true; aiScanError = null;
  renderProjectBody();

  try{
    const outgoing = stripAiScanDisplayFields([...aiScanMessages, newUserMsg]);
    const res = await fetch(AI_SCAN_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_SCAN_ANON_KEY, 'apikey':AI_SCAN_ANON_KEY },
      body: JSON.stringify({ messages: outgoing, crewSummary: buildCrewSummary(), locationSummary: buildLocationSummary() })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
    const assistantMsg = { role:'assistant', content: data.content||[] };
    assistantMsg.content.forEach(b=>{
      if(b.type==='tool_use') aiScanProposals[b.id] = { type:b.name, input:b.input||{}, status:'pending' };
    });
    aiScanMessages = [...aiScanMessages, newUserMsg, assistantMsg];
    aiScanPendingUserMsg = null;
    aiScanPendingFiles = [];
    aiScanDraftText = '';
  } catch(err){
    aiScanError = err.message || String(err);
    aiScanPendingUserMsg = null; // don't leave a fake-sent bubble behind — aiScanDraftText/aiScanPendingFiles are untouched, so Send retries cleanly
  } finally {
    aiScanBusy = false;
    renderProjectBody();
  }
}

function finishUndo(label, snaps){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = { label, snaps, timer:setTimeout(dismissUndo, UNDO_WINDOW_MS) };
  renderUndoToast();
}
function dismissUndo(){
  if(undoPending && undoPending.timer) clearTimeout(undoPending.timer);
  undoPending = null; renderUndoToast();
}
async function undoLastAction(){
  if(!undoPending) return;
  const snaps = undoPending.snaps;
  dismissUndo();
  for(const s of snaps){ undoRestoreCollection(s.key, s.data); await saveDB(s.key, s.data); }
  // A deleted project/day may have been the open one — bounce out rather than
  // leaving the screen pointed at a record that has just come back differently.
  if(currentProjectId && !projById(currentProjectId)){ route={screen:'welcome'}; currentProjectId=null; }
  renderSide(); renderMain();
}
function renderUndoToast(){
  let el = document.getElementById('undoToast');
  if(!undoPending){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id='undoToast'; document.body.appendChild(el); }
  el.className = 'undo-toast';
  el.innerHTML = `<span>${esc(undoPending.label)}</span>
    <span class="undo-action" onclick="undoLastAction()">Undo</span>
    <span class="undo-close" onclick="dismissUndo()" title="Dismiss">${icon('close')}</span>`;
}

async function deleteProject(id){
  if(!confirm('Delete this project and all its shoot days? Crew and locations in your databases are not affected.')) return;
  const proj = projById(id);
  const snaps = beginUndo(['db:projects','db:shootdays']);
  projectsDB = projectsDB.filter(p=>p.id!==id);
  shootDaysDB = shootDaysDB.filter(d=>d.projectId!==id);
  await saveDB('db:projects', projectsDB); await saveDB('db:shootdays', shootDaysDB);
  route={screen:'welcome'}; currentProjectId=null; renderSide(); renderMain();
  finishUndo(`Deleted project "${(proj&&(proj.title||proj.client))||''}" and its shoot days.`, snaps);
}

const roleNameOf = rp => rp.includes('/') ? rp.split('/').slice(1).join('/') : rp;
function filterChipsHTML(items, emptyHint){
  if(!items || !items.length) return `<span class="hint">${emptyHint||'—'}</span>`;
  return items.map(i=>`<label><input type="checkbox" ${i.checked?'checked':''} onchange="${i.onchange}"> ${i.label}</label>`).join('');
}
function filterPanelHTML(spec){
  const selects = (spec.selects||[]).filter(Boolean);
  const selectsRow = selects.length ? `<div class="grid g${Math.min(selects.length,3)}">${selects.map(sel=>
    `<div><label${sel.id?` for="${sel.id}"`:''}>${sel.label}</label><select ${sel.id?`id="${sel.id}" `:''}onchange="${sel.onchange}">${
      sel.options.map(o=>`<option value="${o.v}" ${o.selected?'selected':''}>${o.label}</option>`).join('')}</select></div>`).join('')}</div>` : '';
  const sections = (spec.sections||[]).filter(Boolean).map((sec,i)=>{
    const mt = (i===0 && !selects.length) ? '' : ' style="margin-top:10px;"';
    if(sec.collapsible){
      return `<div${mt}>
        <div class="hint" style="margin-bottom:4px;cursor:pointer;" onclick="${sec.collapsible.onToggle}"><span class="dept-caret">${sec.collapsible.open?'▾':'▸'}</span> ${sec.title}${sec.collapsible.countLabel||''}</div>
        ${sec.collapsible.open ? `<div class="filter-chips">${sec.body}</div>` : ''}
      </div>`;
    }
    return `<div${mt}><div class="hint" style="margin-bottom:4px;">${sec.title}</div>${sec.raw ? sec.body : `<div class="filter-chips">${sec.body}</div>`}</div>`;
  }).join('');
  return `<div class="filter-panel">${selectsRow}${sections}${filterPanelFootHTML(spec.foot||{})}</div>`;
}

let projectCrewFilter = { depts:new Set(), company:'', roles:new Set(), excludeTalent:false, excludeOtherCompanies:true, inverse:false, sort:'seniority', groupBy:'none', days:new Set(), daysMode:'or' };
let projectCrewFilterOpen = false;
let projectCrewFilterRolesOpen = false;
function toggleProjectFilterRolesSection(){ projectCrewFilterRolesOpen = !projectCrewFilterRolesOpen; renderProjectBody(); }
let projectCrewSelected = new Set();
function matchesCrewFilterState(c, f){
  if(f.depts.size && !f.depts.has(deptBucketKey(c.department))) return false;
  if(f.company==='__blank__' && (c.coProductionCompany||'')) return false;
  else if(f.company && f.company!=='__blank__' && (c.coProductionCompany||'')!==f.company) return false;
  if(f.roles.size && !(c.roles||[]).some(r=>f.roles.has(r))) return false;
  if(f.excludeTalent && isTalentEtc(c)) return false;
  if(f.excludeOtherCompanies && (c.coProductionCompany||'')) return false;
  return true;
}
function personMatchesProjectDayFilter(c){
  const f = projectCrewFilter;
  if(!f.days.size) return true;
  const p = currentProject();
  const days = shootDaysDB.filter(d=>d.projectId===currentProjectId && f.days.has(d.id));
  const onDay = c.crewId ? (d => entryOnDay(c.id, d)) : (d => crewOnDay(c.id, d, p));
  return f.daysMode==='and' ? days.every(onDay) : days.some(onDay);
}
function personMatchesProjectFilter(c){
  const matches = matchesCrewFilterState(c, projectCrewFilter) && personMatchesProjectDayFilter(c);
  return projectCrewFilter.inverse ? !matches : matches;
}
function personHasHotel(c, p, days){
  const id = personIdOf(c);   // hotel is person-level; `c` may be an entry view
  if(((p&&p.hotelNightBefore)||[]).includes(id)) return true;
  return days.some(d=>(d.hotelNights||[]).includes(id));
}
function crewSeniorityBand(c){
  const r = roleSeniorityRank(c.department, c.role);
  if(r<10) return 'Department leads';
  if(r<30) return 'Mid-level';
  return 'Support / entry level';
}
function sortProjectCrewGroup(list, p, days){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  switch(projectCrewFilter.sort){
    case 'name': return list.slice().sort(byName);
    case 'role': return list.slice().sort((a,b)=>(a.role||'').localeCompare(b.role||'')||byName(a,b));
    case 'seniority': return list.slice().sort((a,b)=>roleSeniorityRank(a.department,a.role)-roleSeniorityRank(b.department,b.role)||byName(a,b));
    case 'company': return list.slice().sort((a,b)=>(a.coProductionCompany||'￿').localeCompare(b.coProductionCompany||'￿')||byName(a,b));
    case 'daysCount': {
      const pj = currentProject();
      const dayCount = c => c.isPersonBlock ? crewDayCount(personIdOf(c), days, pj)
                          : c.crewId ? entryDayCount(c.id, days) : crewDayCount(c.id, days, pj);
      return list.slice().sort((a,b)=>dayCount(b)-dayCount(a)||byName(a,b));
    }
    case 'added': {
      // Phase BK — a person joined the project when their FIRST entry did, not when
      // their highest-seniority one did, so a block ranks on its earliest entry.
      const order = projectEntries(p).map(e=>e.id);
      const idx = c => c.isPersonBlock
        ? Math.min(...c.entries.map(e=>order.indexOf(e.id)))
        : order.indexOf(c.id);
      return list.slice().sort((a,b)=>idx(a)-idx(b));
    }
    case 'dept':
    default: return sortHoDFirst(list);
  }
}
function buildProjectCrewGroups(list, p, days){
  const gb = projectCrewFilter.groupBy;
  const bySort = arr => sortProjectCrewGroup(arr, p, days);
  const bucketOf = keyFn => {
    const buckets = {};
    list.forEach(c=>{ const key = keyFn(c); (buckets[key]=buckets[key]||[]).push(c); });
    return buckets;
  };
  const groupAlpha = (rawKeyFn, blankLabel) => {
    const buckets = bucketOf(c => rawKeyFn(c) || blankLabel);
    const keys = Object.keys(buckets).sort((a,b)=> a===blankLabel?1 : b===blankLabel?-1 : a.localeCompare(b));
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  };
  const groupFixed = (keyFn, orderedKeys) => {
    const buckets = bucketOf(keyFn);
    return orderedKeys.filter(k=>buckets[k]&&buckets[k].length).map(k=>({key:k, label:k, code:'', items:bySort(buckets[k])}));
  };
  const SIMPLE_GROUPERS = {
    company:  () => groupAlpha(c => c.coProductionCompany, 'No lead company'),
    role:     () => groupAlpha(c => c.role, 'No role set'),
    travel:   () => groupAlpha(c => ((p&&p.travelMethods)||{})[personIdOf(c)], 'Not set'),
    catering: () => groupAlpha(c => c.dietaryGeneral, 'Standard / not set'),
    hotel:      () => groupFixed(c => personHasHotel(c,p,days) ? 'Has hotel' : 'No hotel', ['Has hotel','No hotel']),
    personType: () => groupFixed(c => deptBucketKey(c.department)==='Talent' ? 'Talent' : deptBucketKey(c.department)==='Client' ? 'Client' : 'Crew', ['Crew','Talent','Client']),
    // c.vatRegistered is strictly '' / 'Yes' / 'No' — the same #ncVat field
    // Budget's VAT calc already reads (buildBudgetData()), not a second source
    vat:        () => groupFixed(c => c.vatRegistered==='Yes' ? 'VAT registered' : c.vatRegistered==='No' ? 'Not VAT registered' : 'Not set', ['VAT registered','Not VAT registered','Not set']),
    seniority:  () => groupFixed(crewSeniorityBand, ['Department leads','Mid-level','Support / entry level']),
  };
  if(SIMPLE_GROUPERS[gb]) return SIMPLE_GROUPERS[gb]();

  if(gb==='deptCompany'){
    const meta = {};
    list.forEach(c=>{
      const dept = deptBucketKey(c.department), co = c.coProductionCompany || 'No lead company';
      const key = `${dept} — ${co}`;
      (meta[key]=meta[key]||{dept,co,items:[]}).items.push(c);
    });
    return Object.keys(meta)
      .sort((a,b)=> (DEPARTMENTS.indexOf(meta[a].dept)-DEPARTMENTS.indexOf(meta[b].dept)) || meta[a].co.localeCompare(meta[b].co))
      .map(key=>({key, label:key, code:DEPARTMENT_CODES[meta[key].dept]||'', items:bySort(meta[key].items)}));
  }
  if(gb==='daysOnSite'){
    // Phase BK — a PERSON BLOCK is on a day if ANY of its entries is (crewOnDay, the
    // person-level signal), so a two-role person lands in that day's bucket once.
    const isOn = (c, d) => c.isPersonBlock ? crewOnDay(personIdOf(c), d, p)
                         : c.crewId ? entryOnDay(c.id, d) : crewOnDay(c.id, d, p);
    const buckets = {};
    (days||[]).forEach(d=>{
      const onDay = list.filter(c=>isOn(c, d));
      if(onDay.length) buckets[`Day ${d.dayNum||'?'}`] = onDay;
    });
    const notOn = list.filter(c=>!(days||[]).some(d=>isOn(c, d)));
    if(notOn.length) buckets['Not on any shoot day'] = notOn;
    const keys = (days||[]).map(d=>`Day ${d.dayNum||'?'}`).filter(k=>buckets[k]).concat(notOn.length?['Not on any shoot day']:[]);
    return keys.map(key=>({key, label:key, code:'', items:bySort(buckets[key])}));
  }
  if(gb==='none'){
    const buckets = bucketOf(c => deptBucketKey(c.department));
    const known = DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length);
    const rest = Object.keys(buckets).filter(d=>!DEPARTMENTS.includes(d)).sort();
    const items = known.concat(rest).reduce((out,d)=>out.concat(bySort(buckets[d])), []);
    return [{key:'all', label:'All crew', code:'', items}];
  }
  // default: 'dept'
  const buckets = bucketOf(c => deptBucketKey(c.department));
  return DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length).map(d=>({key:d, label:d, code:DEPARTMENT_CODES[d]||'', items:bySort(buckets[d])}));
}

function selectedEditTargets(entryId){
  if(!(projectCrewSelected.size>1 && projectCrewSelected.has(entryId))) return [entryId];
  const p = currentProject(), days = projectDays();
  const self = entryById(entryId, p);
  const out = [entryId], seen = new Set(self ? [self.crewId] : []);
  projectCrewSelected.forEach(id=>{
    const e = entryById(id, p);
    if(!e || seen.has(e.crewId)) return;
    seen.add(e.crewId);
    out.push(bulkTargetEntryId(e.crewId, e, p, days));
  });
  return out;
}

/* the person behind a row, whichever kind of view it is */
const personIdOf = (c) => c.crewId || c.id;

function seniorityRankOf(c){
  const r = roleSeniorityRank(c.department, c.role);
  return r===Infinity ? Number.MAX_SAFE_INTEGER : r;   // Infinity-Infinity is NaN
}
function topSeniorityEntry(entries){
  return entries.slice().sort((a,b)=>seniorityRankOf(a)-seniorityRankOf(b))[0];
}
function buildPersonBlocks(entryViews){
  const order = [], byPerson = new Map();
  (entryViews||[]).forEach(v=>{
    if(!byPerson.has(v.crewId)){ byPerson.set(v.crewId, []); order.push(v.crewId); }
    byPerson.get(v.crewId).push(v);
  });
  return order.map(crewId=>{
    const entries = byPerson.get(crewId);
    return Object.assign({}, topSeniorityEntry(entries), { crewId, entries, isPersonBlock:true });
  });
}

let frontedEntryCache = { view:null, projectId:null, map:new Map() };
function frontedCacheMap(){
  if(frontedEntryCache.view!==crewGridView || frontedEntryCache.projectId!==currentProjectId){
    frontedEntryCache = { view:crewGridView, projectId:currentProjectId, map:new Map() };
  }
  return frontedEntryCache.map;
}
function resetFrontedEntryCache(){ frontedEntryCache = { view:null, projectId:null, map:new Map() }; }
function phaseDaysOfEntry(entryId, p, days){
  // Phase BT — both phase tabs front on their OWN booked days, each reading only its
  // own store; everything else still fronts on the shoot-day signal.
  if(isPhaseTab(crewGridView)) return phaseDaysOf(crewGridView, entryId, p) || 0;
  return entryDayCount(entryId, days);
}
/* works on entry views AND on raw p.crewEntries records — both carry id/role/department */
function pickFrontedEntry(entries, p, days){
  return entries.slice().sort((a,b)=>
      (phaseDaysOfEntry(b.id, p, days) - phaseDaysOfEntry(a.id, p, days))
   || (seniorityRankOf(a) - seniorityRankOf(b))
  )[0];
}
/* the fronted entry of a block being rendered — memoised, re-picked if the cached
   choice is not among this block's currently visible entries */
function frontedEntryOfBlock(block, p, days){
  const entries = block.entries;
  if(entries.length<2) return entries[0];
  const map = frontedCacheMap();
  const cached = map.get(block.crewId);
  if(cached){ const hit = entries.find(e=>e.id===cached); if(hit) return hit; }
  const best = pickFrontedEntry(entries, p, days);
  map.set(block.crewId, best.id);
  return best;
}
/* a person's entries that are CURRENTLY ON SCREEN — the same entry-grain filter test
   renderProjectCrew() builds the blocks from, so this can't drift from what is rendered. */
function visibleEntriesForPerson(crewId, p){

const ROLES_FREEZE_MIN_W = 901;   // matches the @media(max-width:900px) block that releases it
function sizeRolesTablewrap(){

const ROLES_ZONE_MIN_GUTTER = 40;   // the floor of .roles-widezone's own clamp()
/* the same gutter .roles-widezone's CSS clamp() resolves to, in JS, so the two cannot drift */
const rolesZoneGutter = () =>
  Math.min(110, Math.max(ROLES_ZONE_MIN_GUTTER, document.documentElement.clientWidth * 0.05));
function fitRolesZone(){
  const zone = document.querySelector('.roles-zone');
  const el = document.querySelector('.roles-tablewrap');
  if(!zone) return;
  zone.style.marginLeft = zone.style.marginRight = '';
  if(!el || window.innerWidth < ROLES_FREEZE_MIN_W) return;   // mobile has always just scrolled
  const wide = zone.classList.contains('roles-widezone');
  zone.style.marginLeft = zone.style.marginRight = '0px';
  const overflow = el.scrollWidth - el.clientWidth;
  if(overflow <= 0) return;                                    // fits the paper column: leave it there
  const gutter = rolesZoneGutter();
  const box = zone.getBoundingClientRect();
  if(!wide){
    /* Budget OFF — grow RIGHT only, so the left edge stays on the banner. See the note above. */
    const room = document.documentElement.clientWidth - box.right - ROLES_ZONE_MIN_GUTTER;
    const take = Math.min(overflow, Math.max(0, room));
    if(take > 0) zone.style.marginRight = -take + 'px';
    return;
  }
  const maxBleed = Math.max(0, Math.min(box.left, document.documentElement.clientWidth - box.right) - gutter);
  const bleed = Math.min(Math.ceil(overflow / 2), maxBleed);
  if(bleed > 0) zone.style.marginLeft = zone.style.marginRight = -bleed + 'px';
}

function onRolesGridKey(ev){
  const key = ev.key;
  if(key!=='ArrowUp' && key!=='ArrowDown' && key!=='ArrowLeft' && key!=='ArrowRight') return;
  if(ev.altKey || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
  const el = ev.target;
  const cell = el && el.closest && el.closest('.roles-grid.pb-head > *');
  if(!cell) return;
  /* the day ticks that Space opens are ordinary checkbox cells to the right of Shoot, so
     nothing special is needed for them — they are reached, and filled, exactly like Buyout */
  const row = cell.parentElement;
  const horizontal = key==='ArrowLeft' || key==='ArrowRight';
  /* the free-text exception — see the note above. A number cell (.roles-num / the rate) is
     not asked; it always moves. */
  if(horizontal && el.tagName==='INPUT' && el.type==='text' && !cell.matches('.roles-num, .roles-grid-rate')){
    const at = el.selectionStart;
    if(at!==el.selectionEnd) return;                       // a selection: let the arrow collapse it
    if(key==='ArrowLeft'  && at>0) return;
    if(key==='ArrowRight' && at<(el.value||'').length) return;
  }
  const cells = [...row.children];
  const i = cells.indexOf(cell);
  const step = (key==='ArrowRight' || key==='ArrowDown') ? 1 : -1;
  let moved = false;
  if(horizontal){
    /* skip cells with nothing to focus — Total, Subtotal and the Shoot count are read-only,
       and stopping on them would be a dead keypress in the middle of a row */
    for(let j=i+step; j>=0 && j<cells.length && !moved; j+=step) moved = rolesNavFocus(cells[j]);
  } else {
    const rows = rolesNavRows(), r = rows.indexOf(row);
    for(let j=r+step; j>=0 && j<rows.length && !moved; j+=step) moved = rolesNavFocus(rows[j].children[i]);
  }
  /* only swallow the key if it actually moved — at the edge of the table the arrow should
     still scroll the page, as it would anywhere else */
  if(moved) ev.preventDefault();
}

/* ROLES → 3–4 LETTER CODES. A code saved with the role wins (Settings ▸ Departments & roles writes

   initials for several words, the first four letters for one. ⚠️ Keyed by NAME, not by
   "Department/Role": the code is for reading a row at a glance, and a Producer is PROD wherever
   they sit. */
const ROLE_CODE_DEFAULTS = {
  'Director':'DIR', 'Executive Producer':'EP', 'Line Producer':'LP', 'Field Producer':'FP', 'Producer':'PROD',
  'Production Manager':'PM', 'Production Coordinator':'PC', 'PA':'PA', 'Runner':'RUN',
  'Presenter':'PRES', 'Host':'HOST', 'Guest':'GST', 'Contributor':'CONT', 'Cast':'CAST', 'Talent':'TAL', 'Model':'MOD',
  'DOP':'DOP', '1st AC':'1AC', '2nd AC':'2AC', 'Camera Operator':'CAM', 'Loader':'LOAD', 'Focus Puller':'FOC',
  'Sound Mixer':'MIX', 'Sound Recordist':'SND', 'Boom Operator':'BOOM',
  'Gaffer':'GAF', 'Best Boy':'BB', 'Grip':'GRIP', 'Rigger':'RIG', 'Equipment Manager':'EQM', 'Kit Tech':'KIT',
  'Set Designer':'SETD', 'Art Director':'ART', 'Props':'PROP', 'HMUA':'HMUA', 'Hair Stylist':'HAIR', 'Costume/Wardrobe':'WARD',
  'Chef':'CHEF', 'Caterer':'CAT', 'Driver':'DRV', 'Travel Coordinator':'TRAV',
  'Editor':'EDIT', 'Colourist':'COL', 'DIT':'DIT', 'Assistant Editor':'AE', 'Designer':'DES', 'Stylist':'STY'
};
const ROLE_JOINERS = new Set(['of','and','the','for','to','a']);
function roleCodeByRule(role){
  const words = String(role||'').trim().split(/[\s/\-]+/).filter(Boolean).filter(w=>!ROLE_JOINERS.has(w.toLowerCase()));
  if(!words.length) return '';
  if(words.length<2) return words[0].slice(0,4).toUpperCase();
  /* a word that is already an abbreviation ("AD", "PA", "DOP", "OFTV") contributes itself, not
     just its first letter — "1st AD" must not collapse to "1A" */
  return words.map(w=>(w.length<=4 && w===w.toUpperCase()) ? w : w[0].toUpperCase()).join('').slice(0,4);
}
function rolesShortRole(role){
  const raw = String(role||'').trim();
  if(!raw) return '';
  const saved = (appSettings.roleCodes||{})[raw];
  if(saved || ROLE_CODE_DEFAULTS[raw]) return saved || ROLE_CODE_DEFAULTS[raw];
  // "Talent / Model" — two roles on one line: the more specific one (the last) names the row
  const parts = raw.split('/').map(x=>x.trim()).filter(Boolean);
  const last = parts.length>1 ? parts[parts.length-1] : '';
  return (last && ((appSettings.roleCodes||{})[last] || ROLE_CODE_DEFAULTS[last])) || roleCodeByRule(raw);
}

function rolesColumns(data){
  const money = crewShowMoney;
  const people = (data && data.people) || [];
  /* Kit and Labour appear only when the project's Budget setting shows kit on its own
     (Settings ▸ Kit rows) AND somebody here actually has a split rate — so two empty

  const push = (head, width, o) => cols.push(Object.assign({head, width}, o||{}));
  if(money) push('Total', '92px', {key:'total', title:'Fee for this role across every phase being costed — inc-VAT, the same figure the Budget shows'});
  CREW_PHASES.forEach(ph=>{
    if(!budgetScope[ph.scope]) return;
    const isShoot = ph.view==='days';
    /* the Shoot header is a CONTROL in the modes that show a count — clicking it opens the
       per-day ticks to its right. `chev` is the whole cue: a caret and the word, no button
       chrome, matching the app's other disclosure headers (dept-caret, sd-block-head). */
    const canOpen = isShoot && projectDays().length>0;
    push(canOpen
        ? `<span class="roles-shoot-head" role="button" tabindex="0"
             onclick="event.stopPropagation();toggleRolesShootColumn()"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleRolesShootColumn();}"
             aria-expanded="${rolesShootOpen()?'true':'false'}"
             ><span class="dept-caret">${rolesShootOpen()?'▾':'▸'}</span>${ph.head}</span>`
        : ph.head,
      '46px',
      {key:'phase', phase:ph,
       title: canOpen ? (rolesShootOpen()?'Click to close the day ticks':'Click to tick which shoot days') : ph.headTitle});
    if(isShoot && rolesShootOpen()){
      projectDays().forEach(d=>push(`D${esc(d.dayNum||'?')}`, '30px',
        {key:'shootday', day:d,
         title:`Day ${esc(d.dayNum||'?')} — ${esc(fmtDate(d.date)||'date not set')}`}));
    }
    if(isShoot && budgetScope.production){
      push('OT', '46px', {key:'overtime',
        title:'Overtime, in units — a unit is one day’s equivalent, so 0.5 is half a day, costed at the day rate. Not costed on a buyout (no day rate to multiply) or with no shoot days.'});
    }
  });
  /* Buyout is a fact about the DEAL — one agreed fee rather than a day rate — so it sits
     beside the day counts whose meaning it changes. (Phase BV kept it out of the old DATES
     mode; there are no modes to be in or out of since Phase CF.) */
  push('Buyout', '60px', {key:'buyout', title:'One agreed fee for the whole job — the day counts only split it across the phases'});
  if(money){
    push('Day rate', '104px', {key:'rate'});
    if(budgetVatToggle) push('Subtotal', '92px', {key:'subtotal', title:'This role’s fee ex-VAT'});
    if(showSplit){
      push('Kit', '78px', {key:'kit', title:'Equipment portion of the day rate, across every day being costed'});
      push('Labour', '78px', {key:'labour', title:'What is left of the day rate once kit comes out'});
    }
    push('VAT reg.', '62px', {key:'vatreg', title:'Charges VAT'});
    if(budgetVatToggle) push('VAT', '84px', {key:'vat'});
  }
  push('Dates', '112px', {key:'dates', title:'Mark which dates this person works in prep and the edit'});
  push('Show as', '160px', {key:'showas', left:true,
    title:'The name this person is called on the call sheet, if it should differ from their own'});
  cols.forEach(c=>{
    c.id = c.key==='phase' ? 'phase:'+c.phase.scope
         : c.key==='shootday' ? 'day:'+c.day.id
         : c.key;
  });
  const ordered = applyRolesColumnOrder(cols);
  const template = ['var(--pb-controls-w)','var(--pb-dept-w)','var(--pb-role-w)','var(--pb-name-w)']
    .concat(ordered.map(c=>c.width)).concat('minmax(0,1fr)').join(' ');
  return {cols:ordered, template, showSplit};
}
function rolesHeadCellHTML(c){
  const cls = `roles-grid-header${c.left?'':' roles-head-c'}${c.key==='shootday'?'':' roles-head-drag'}`;
  if(c.key==='shootday') return `<div class="${cls}"${c.title?` title="${esc(c.title)}"`:''}>${c.head}</div>`;
  const hint = (c.title ? c.title + ' · ' : '') + 'Drag to move this column, or Alt+←/→';
  return `<div class="${cls}" draggable="true" data-colid="${esc(c.id)}" tabindex="0"
      title="${esc(hint)}"
      ondragstart="onRolesColDragStart(event,'${esc(c.id)}')"
      ondragover="onRolesColDragOver(event,'${esc(c.id)}')"
      ondragleave="onRolesColDragLeave(event)"
      ondrop="onRolesColDrop(event,'${esc(c.id)}')"
      ondragend="onRolesColDragEnd()"
      onkeydown="onRolesColKey(event,'${esc(c.id)}')">${c.head}</div>`;
}
function applyRolesColumnOrder(cols){
  const order = appSettings.rolesColumnOrder;
  if(!order || !order.length) return cols;
  /* a unit is a column plus whatever must travel with it */
  const units = [];
  cols.forEach(c=>{
    if(c.key==='shootday' && units.length) units[units.length-1].cols.push(c);
    else units.push({id:c.id, cols:[c]});
  });
  let rank = -1;
  return units.map((u,i)=>{
    const r = order.indexOf(u.id);
    if(r>=0){ rank = r; return {u, r, tie:0, i}; }
    return {u, r:rank, tie:1, i};
  }).sort((a,b)=> a.r-b.r || a.tie-b.tie || a.i-b.i)
    .reduce((out,k)=>out.concat(k.u.cols), []);
}
/* the ids currently on screen, in the order they are on screen — read from the DOM rather
   than rebuilt, so the thing being reordered is exactly the thing you are looking at */
function rolesVisibleColIds(){
  return [...document.querySelectorAll('.roles-grid-header-row [data-colid]')].map(el=>el.dataset.colid);
}
function reorderRolesColumns(visibleIds, dragId, targetId, after){
  const out = (appSettings.rolesColumnOrder || []).slice();
  visibleIds.forEach((id,i)=>{
    if(out.includes(id)) return;
    const prev = visibleIds.slice(0,i).reverse().find(x=>out.includes(x));
    out.splice(prev ? out.indexOf(prev)+1 : 0, 0, id);
  });
  const next = out.filter(id=>id!==dragId);
  const t = next.indexOf(targetId);
  if(t<0) return out;
  next.splice(after ? t+1 : t, 0, dragId);
  return next;
}
async function saveRolesColumnOrder(order, focusId){
  appSettings.rolesColumnOrder = order;
  await saveAppSettings();
  renderProjectBody();
  /* the heading you just moved keeps the focus, so a second Alt+Arrow lands on the same
     column instead of the top of the document */
  if(focusId){
    const el = document.querySelector(`.roles-grid-header-row [data-colid="${focusId}"]`);
    if(el) el.focus();
  }
}
async function resetRolesColumnOrder(){
  appSettings.rolesColumnOrder = null;
  await saveAppSettings();
  renderProjectBody();
}
let rolesDragColId = null;
function rolesClearDropCues(){
  document.querySelectorAll('.roles-col-dropbefore,.roles-col-dropafter')
    .forEach(el=>el.classList.remove('roles-col-dropbefore','roles-col-dropafter'));
}
const rolesDropAfter = (ev, el) => {
  const r = el.getBoundingClientRect();
  return ev.clientX > r.left + r.width/2;
};
function onRolesColDragStart(ev, id){
  rolesDragColId = id;
  ev.dataTransfer.effectAllowed = 'move';
  /* Firefox refuses to start a drag with no payload; the id is also the payload */
  try{ ev.dataTransfer.setData('text/plain', id); }catch(_){}
  ev.currentTarget.classList.add('roles-col-dragging');
}
function onRolesColDragOver(ev, id){
  if(!rolesDragColId || rolesDragColId===id) return;
  ev.preventDefault();                      // without this the drop never fires
  ev.dataTransfer.dropEffect = 'move';
  const el = ev.currentTarget;
  const after = rolesDropAfter(ev, el);
  rolesClearDropCues();
  el.classList.add(after ? 'roles-col-dropafter' : 'roles-col-dropbefore');
}
function onRolesColDragLeave(ev){
  ev.currentTarget.classList.remove('roles-col-dropbefore','roles-col-dropafter');
}
function onRolesColDragEnd(){
  rolesDragColId = null;
  rolesClearDropCues();
  document.querySelectorAll('.roles-col-dragging').forEach(el=>el.classList.remove('roles-col-dragging'));
}
function onRolesColDrop(ev, id){
  ev.preventDefault();
  const drag = rolesDragColId, after = rolesDropAfter(ev, ev.currentTarget);
  const ids = rolesVisibleColIds();
  onRolesColDragEnd();
  if(!drag || drag===id) return;
  saveRolesColumnOrder(reorderRolesColumns(ids, drag, id, after));
}
/* Alt+←/→ — the same move without a mouse, and the reason the drag can stay pointer-only */
function onRolesColKey(ev, id){
  if(!ev.altKey || (ev.key!=='ArrowLeft' && ev.key!=='ArrowRight')) return;
  ev.preventDefault();
  const ids = rolesVisibleColIds();
  const j = ids.indexOf(id) + (ev.key==='ArrowLeft' ? -1 : 1);
  if(j<0 || j>=ids.length) return;
  saveRolesColumnOrder(reorderRolesColumns(ids, id, ids[j], ev.key==='ArrowRight'), id);
}

   headTitle:'Booked pre-production days'},

function entryInPhase(scope, entryId, p){
  const ph = phaseByScope(scope); if(!ph) return false;

  if(ph.view==='days'){
    /* deliberately NOT projectDays() — this runs once per entry per phase inside the budget
       build, and that helper sorts a filtered copy of every shoot day each time it is asked */
    return (shootDaysDB||[]).some(d=>d.projectId===proj.id && entryOnDay(entryId, d));

   has to tell "in none of them" (always visible) apart from "in one you've switched off". */

const entryOvertime = (entryId, p) => {
  const proj = p || currentProject();
  const v = ((proj||{}).overtime||{})[entryId];
  return v==null ? null : v;
};
async function setEntryOvertime(entryId, rawValue){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  const trimmed = (rawValue||'').trim();
  let next = null;
  if(trimmed!==''){
    const n = Number(trimmed);
    /* garbage reverts by re-rendering without saving, exactly as saveEntryRate() and
       setPhaseDays() do — the field visibly returns to the last stored value rather than
       sitting there holding text nothing accepted */
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }
    next = n;
  }
  p.overtime = p.overtime || {};
  /* delete rather than storing 0 or null — "no overtime" is the absence of a record, the same
     idiom phaseWrite() and saveEntryRate() use, so a project nobody has touched carries no key */
  if(next==null) delete p.overtime[entryId]; else p.overtime[entryId] = next;
  if(!Object.keys(p.overtime).length) delete p.overtime;
  // bulk-select fans out over the selected ENTRIES, like every other row control
  selectedEditTargets(entryId).forEach(id=>{
    if(id===entryId) return;
    if(!entryById(id, p)) return;
    p.overtime = p.overtime || {};
    if(next==null) delete p.overtime[id]; else p.overtime[id] = next;
    if(!Object.keys(p.overtime).length) delete p.overtime;
  });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* ============ AUTO-FILL MEALS (20 Sep 2026) ============
   Works meals out from who is booked on which day and the day's call and wrap:
     call before 08:30 → breakfast · on site across 13:00 → lunch · wrap after 18:00 → dinner
   Call = the person's own call on that day's Position assignments (earliest, if they hold two
   roles), else the all-crew call. Wrap = the schedule's WRAP row. ⚠️ THE BACKUP: a day with
   neither gives LUNCH ONLY — on site means lunch, the most common case; a day with only one of
   them decides what it can and assumes lunch. Crew AND talent, whichever tab it is opened from
   (one kitchen); people on Own catering are left alone. Undoable. */
const MEAL_RULES = { breakfastBefore: 8*60+30, lunchAt: 13*60, dinnerAfter: 18*60 };
function looseTimeToMins(str){
  const t = String(str||'').trim(); if(!t) return null;
  const viaColon = parseTimeStrToMins(t.replace('.',':')); if(viaColon!=null) return viaColon;
  const m = t.match(/^(\d{1,2})(\d{2})?\s*(am|pm)?$/i); if(!m) return null;
  let h = parseInt(m[1],10); const min = m[2] ? parseInt(m[2],10) : 0;
  if(m[3] && /pm/i.test(m[3]) && h<12) h += 12;
  if(m[3] && /am/i.test(m[3]) && h===12) h = 0;
  return (h>23 || min>59) ? null : h*60+min;
}
function dayWrapMins(d){
  const row = (d.schedule||[]).filter(r=>/\bwrap\b/i.test(r[2]||'')).pop(); if(!row) return null;
  const range = parseTimeRangeToMins(row[0]);
  return range ? range.start : looseTimeToMins(row[0]);
}
function personCallMins(crewId, d, p){
  const mine = new Set(entriesForCrew(crewId, p).map(e=>e.id));
  const own = (d.positions||[]).filter(pos=>mine.has(pos[0])).map(pos=>looseTimeToMins(pos[1])).filter(v=>v!=null);
  return own.length ? Math.min(...own) : looseTimeToMins(d.allCrewCall);
}
function suggestedMeals(callMins, wrapMins){
  if(callMins==null && wrapMins==null) return {b:false, l:true, d:false, guessed:true};
  return { b: callMins!=null && callMins < MEAL_RULES.breakfastBefore,
           l: (callMins==null || callMins < MEAL_RULES.lunchAt) && (wrapMins==null || wrapMins > MEAL_RULES.lunchAt),
           d: wrapMins!=null && wrapMins > MEAL_RULES.dinnerAfter,
           guessed: callMins==null || wrapMins==null };
}

    const ownCalls = on.filter(id=>personCallMins(id, d, p)!==call).length;
    const meals = MEAL_KEYS.filter(([k])=>m[k]).map(([,l])=>l).join(', ') || 'no meals';
    const basis = call==null && wrap==null ? 'no call or wrap time — lunch only'

    return `<tr><td><strong>D${esc(d.dayNum||'?')}</strong>${d.date?' · '+esc(fmtDate(d.date)):''}</td><td>${basis}</td><td>${meals}</td>
      <td>${on.length} ${on.length===1?'person':'people'}${ownCalls?` <span class="hint">(${ownCalls} on their own call)</span>`:''}</td></tr>`;
  }).join('');
  return `<div class="modal-overlay" onclick="if(event.target===this) toggleMealFill()">
