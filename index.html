<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Sheet App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Jost:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- AI Scan (Phase AI Scan): client-side .docx text extraction only — PDFs go to the
     Anthropic API natively as a document block, no library needed for those. -->
<style>
  :root{
    --bg:#FFFFFF;            /* White (was Ivory #FFFFF5) — matches --panel for a seamless flat feel */
    --panel:#FFFFFF; --panel-2:#EEF5F2;
    /* Drawn dividing lines — deliberately faint (Fonts Review). Used for rules
       between rows and under headings, NOT for form fields. */
    --line:rgba(17,10,8,.10);
    /* Form fields are ruled underlines now, and a 10% line is too faint to read as
       "fill this in" — so fields get their own, stronger weight. */
    --field-line:rgba(17,10,8,.30);
    --tape:#017756;          /* Sea Green — primary brand accent, LIGHT backgrounds */
    --tape-light:#0FA47A;    /* same hue lifted for DARK backgrounds — 6.17:1 on the
                                sidebar vs 3.52:1 for --tape (Fonts Review) */
    --tape-ink:#FFFFF5;      /* Ivory text on Sea Green */
    --danger:#a4321f;
    --text:#110A08;          /* Black */
    --muted:#6f6a63;
    --mono:ui-monospace, monospace;                     /* browser default mono — no webfont loaded (Style Review) */
    --disp:'Fraunces', Georgia, serif;                  /* stands in for Moret */
    --label:'Oswald', sans-serif;                       /* brand utility font — kept as-is */
    --body:'Jost', 'Futura PT', sans-serif;              /* stands in for Futura PT */
    /* Brand-green background tints. Style Review collapsed nine hand-written rgba()
       values down to four tokens — two "barely there" levels for panels vs editing
       states, then medium/strong for badges and active controls. */
    --tint-1:rgba(1,119,86,.03);   /* panels: filter, bulk-edit, formgroup, day-override */
    --tint-2:rgba(1,119,86,.05);   /* editing / overridden row states */
    --tint-3:rgba(1,119,86,.10);   /* badges, hover fills, bulk action bar */
    --tint-4:rgba(1,119,86,.14);   /* active controls — must stay distinct from tint-3 */
    --phase-prep:#8A5A0B; --phase-shoot:#017756; --phase-post:#4A3C8C;
    --phase-prep-soft:rgba(138,90,11,.13); --phase-shoot-soft:rgba(1,119,86,.13);
    --phase-post-soft:rgba(74,60,140,.13);
    --tint-5:rgba(1,119,86,.35);   /* sidebar active-project gradient */
    --tint-6:rgba(1,119,86,.28);   /* selected saved-role pill / Head of Department pill */
    /* Default box: white fill, 8px radius, 10px padding (Style Review) */
    --box-radius:8px; --box-pad:10px;
    --fs-name:14px; --fs-field:13px; --fs-meta:12px; --fs-ctl:11px;
    --field-label-w:112px;   /* label column for inline fields — keeps rows aligned */
    --pb-controls-w:34px;    /* a bulk-select checkbox, and nothing else. ⚠️ Was 56px, to
                                 fit Roles' Edit pencil beside it — Phase CC took that
                                 pencil out (selecting and pressing Edit is the one way in
                                 now), so all six tabs are checkbox-only and the column is
                                 the width of a checkbox again. 22px of the table back. */
    --pb-dept-w:56px;        /* Style check, 20 Sep 2026 — DEPT has its own column on every person
                                 row (DEPT | ROLE | NAME); 56px fits the widest code, CAT/TRA */
    --pb-name-w:170px;       /* fixed, not flexible — a flexible Name column is what
                                 let Role drift depending on how long a name was.
                                 170px (was 220px, Phase BO follow-up — narrowed to
                                 close up the gap before Role) comfortably fits every
                                 name in the sample data at 14px Jost 600; a longer
                                 one just sits closer to the chip, same overflow
                                 handling as everywhere else in the app */
    --pb-role-w:150px;       /* fixed; role chips longer than this ellipsis-truncate
                                 (.pb-role-cell .role-chip below) — the full name is
                                 still in the chip's title tooltip */
    --bnr-totals-w:260px;
    --bnr-stage-w:440px;
    --pb-phase-fields-w:130px; /* Pre-production/Post only: the rate+days column, sized
                                 to the two inputs (60 + 10 gap + 60). Was a flat 200px
                                 sized to the removed "N days booked" counter. Retuned
                                 for mobile below, where the inputs themselves grow. */
    --sidew:230px;
    /* ⚠️ The page's paper width and its side padding, as TOKENS rather than two numbers
       inside .main — Roles' wide zone (see .roles-widezone) has to compute how far it may
       break out of that column, which means knowing both. Change them here, not in .main. */
    --mainw:840px; --main-pad:22px;
    --side-bg:#110A08; --side-text:#FFFFF5; --side-line:rgba(255,255,245,.14); --side-hover:rgba(255,255,245,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--text); font-family:var(--body); -webkit-font-smoothing:antialiased;}

  .app{display:flex; min-height:100vh;}
  .side{width:var(--sidew); flex:0 0 var(--sidew); background:var(--side-bg); border-right:1px solid var(--side-line);
    padding:16px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .main{flex:1; min-width:0; padding:20px var(--main-pad) 90px; max-width:var(--mainw); margin:0 auto;}

  /* top bar + scrim: only ever visible on mobile */
  .topbar{display:none;}
  .scrim{display:none;}

  .brand{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .brand .dot{width:10px; height:10px; border-radius:3px; background:var(--tape); transform:rotate(45deg);}
  .brand strong{font-family:var(--disp); font-size:16px; letter-spacing:.3px; color:var(--side-text);}

  .side-label{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; color:rgba(255,255,245,.55);
    text-transform:uppercase; margin:16px 6px 6px;}
  .side-item{padding:8px 10px; border-radius:5px; font-size:var(--fs-field); cursor:pointer; color:var(--side-text);
    display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .side-item:hover{background:var(--side-hover);}
  /* Sidebar accents use --tape-light, the brand hue lifted for dark backgrounds
     (Fonts Review). #0FA47A measures 6.17:1 on the sidebar against 3.52:1 for the
     brand green, so active items clear AA without introducing a second identity. */
  .side-item.active{background:var(--side-hover); color:var(--tape-light); font-weight:600;}
  .side-item .ico{opacity:.85; font-size:var(--fs-meta);}
  .side-proj{padding:7px 10px; border-radius:5px; font-size:var(--fs-field); cursor:pointer; margin-bottom:2px; color:var(--side-text);}
  .side-proj:hover{background:var(--side-hover);}
  .side-proj.active{background:linear-gradient(90deg, var(--tint-5), transparent); color:var(--tape-light); font-weight:600; border-left:2px solid var(--tape-light); padding-left:8px;}
  .side-proj .code{font-family:var(--label); letter-spacing:1.2px; font-size:var(--fs-ctl); color:rgba(255,255,245,.5); display:block;}
  .side-proj.active .code{color:var(--tape-light); opacity:.9;}
  .side-new{margin-top:6px; width:100%; text-align:left; font-size:var(--fs-meta); color:rgba(255,255,245,.6); background:transparent; border:1px dashed var(--side-line);}
  .side-new:hover{color:var(--tape-light); border-color:var(--tape-light);}
  .side-empty{font-size:var(--fs-meta); color:rgba(255,255,245,.45); padding:4px 10px; font-style:italic;}

  .section{background:none; border:none; border-radius:0; padding:0; margin-bottom:26px;}
  /* Style check, 20 Sep 2026 — block headings are INK everywhere (15px on the page, 17px as a
     card title), following the call sheet. Green is for what is live: the active tab, a lit
     toggle, a link, a hover. */
  .section h2{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.2px; text-transform:none;
    color:var(--text); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .section h2::after{content:''; flex:1; height:1px; background:var(--line);}
  .sd-block{margin-bottom:4px;}
  /* flex-start + margin-left:auto on any trailing action, NOT space-between: with
     space-between a header that has no action (every Shoot Day block) pushed its
     own title to the far right, away from its caret. */
  .sd-block-head{display:flex; align-items:center; justify-content:flex-start; gap:8px; cursor:pointer; user-select:none;
    font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.2px;
    color:var(--text); margin:26px 0 12px; padding-bottom:0; border-bottom:none;}
  .sd-block:first-child .sd-block-head{margin-top:0;}
  .sd-block-head.flush{margin:0 0 12px;}
  .sd-block-head .dept-caret{font-size:11px; color:inherit;}
  .sd-block-head > button{margin-left:12px; flex:0 0 auto;}
  .sd-block-head:hover{color:var(--tape);}
  /* The rule fills the gap between title and any trailing action. When a
     .sd-block-head-toggle is present the rule belongs to it, so it sits between
     the title and the button rather than after the button. */
  .sd-block-head:not(:has(.sd-block-head-toggle))::after{content:''; flex:1; height:1px; background:var(--line);}
  /* Preview & Export section headers reuse the same look, but only the caret+title
     span toggles collapse — the header action (e.g. a Copy button) sits alongside it
     and stays clickable/visible on its own, including while the body is collapsed. */
  .sd-block-head-toggle{display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:0;}
  .sd-block-head-toggle::after{content:''; flex:1; height:1px; background:var(--line);}
  .sd-block-head-toggle:hover{color:var(--tape);}
  .sd-block-head-toggle .dept-caret{color:inherit;}
  .grid{display:grid; gap:10px;} .grid.g2{grid-template-columns:1fr 1fr;} .grid.g3{grid-template-columns:1fr 1fr 1fr;}

  label{display:block; font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; color:var(--muted); margin-bottom:4px; font-weight:500;}

  .grid:not(.g3) > div:has(> label:first-child){display:grid;
    grid-template-columns:var(--field-label-w) minmax(0,1fr);
    align-items:center; column-gap:10px; row-gap:4px;}
  .grid:not(.g3) > div:has(> label:first-child) > label{margin:0; line-height:1.25; align-self:center;}
  .grid:not(.g3) > div:has(> label:first-child) > *:not(label){grid-column:2;}
  /* textareas are tall — pin the label to the first line instead of centring it */
  .grid:not(.g3) > div:has(> label:first-child):has(> textarea){align-items:start;}
  .grid:not(.g3) > div:has(> label:first-child):has(> textarea) > label{padding-top:9px;}

  .ts-grid{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center;}
  .ts-field, .field-inline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;}
  .ts-field > label, .field-inline > label{margin:0; white-space:nowrap; flex:0 0 auto;}
  .ts-field > select, .ts-field > input[type=text],
  .field-inline > select, .field-inline > input[type=text]{width:auto; min-width:0; flex:0 1 auto;}
  /* [type=text] is needed to out-specify the global input[type=text]{width:100%} */
  .ts-field input[type=text]{width:152px; padding:6px 8px; font-size:var(--fs-field);}
  /* box sized to the value it holds, rather than every field getting the same width */
  .ts-field input.fld-xs{width:52px;} .ts-field input.fld-sm{width:78px;}
  .ts-field input.fld-md{width:132px;} .ts-field input.fld-date{width:150px;}
  .ts-field input[type=date]{width:150px; padding:6px 8px; font-size:var(--fs-field);}
  .ts-field > .hint, .field-inline > .hint{margin:0; flex:1 1 220px; min-width:0;}
  .ts-banner{font-size:var(--fs-meta); color:var(--muted); background:var(--panel-2); border:1px solid var(--line);
    border-radius:5px; padding:7px 10px; margin-bottom:12px;}
  .ts-banner.differs{background:var(--tint-3); border-color:var(--tape); color:var(--text);}
  .ts-banner span{color:var(--tape); cursor:pointer; text-decoration:underline; margin-left:6px;}
  .cam-row{display:grid; grid-template-columns:minmax(150px,1fr) minmax(0,2fr) 60px; gap:10px; align-items:start;
    padding:11px 0;}
  .cam-who strong{font-family:var(--body); font-weight:600; font-size:14px;}
  .cam-tags{font-family:var(--mono); font-size:var(--fs-ctl); margin-top:4px; line-height:1.5;}
  /* align-items:flex-start stops "+ Add camera" stretching the full column width */
  .cam-cams{display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0;}
  .cam-cams > .cam-cam-line{align-self:stretch;}
  .cam-cam-line{display:flex; align-items:center; gap:6px;}
  .cam-badge{font-family:var(--label); font-size:var(--fs-ctl); font-weight:600; letter-spacing:1.2px; color:var(--tape);
    background:var(--tint-3); border-radius:5px; padding:5px 7px; flex:0 0 auto; white-space:nowrap;}
  .cam-body-input, .cam-shorthand-input{font-size:var(--fs-field); padding:5px 7px; min-height:0; width:auto; flex:1 1 0; min-width:0;}
  .cam-reorder{display:flex; flex-direction:column; gap:4px; align-items:center;}
  .cam-reorder .icon-btn[disabled]{opacity:.25; cursor:default;}
  .req::after{content:' *'; color:var(--danger);}
  input[type=text], input[type=date], textarea, select{
    width:100%; background:transparent; border:none; border-radius:0;
    border-bottom:1px solid var(--field-line);
    color:var(--text); padding:6px 8px 5px; font-family:var(--body); font-size:var(--fs-field);}
  input[type=text]:hover, input[type=date]:hover, textarea:hover, select:hover{
    border-bottom-color:var(--text);}
  input:focus, textarea:focus, select:focus{
    outline:none; border-bottom-color:var(--tape); box-shadow:0 1px 0 0 var(--tape);}
  input[readonly]{opacity:.7; border-bottom-style:dotted;}
  /* Settings' colour pickers (Phase Q). A swatch is the value, so it gets the box the
     ruled-line fields deliberately don't have — there is no "writing area" to underline. */
  input[type=color]{width:56px; height:30px; padding:2px; background:transparent;
    border:1px solid var(--field-line); border-radius:var(--box-radius); cursor:pointer;}
  textarea{resize:vertical; min-height:52px; line-height:1.5;}

  input[type=checkbox]{
    appearance:none; -webkit-appearance:none; width:16px; height:16px; margin:0;
    border:1.5px solid #8d8880; border-radius:3px; background:#fff;
    position:relative; cursor:pointer; flex:0 0 auto; vertical-align:middle;}
  input[type=checkbox]::after{
    content:'\00D7'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-family:var(--body); font-weight:500; font-size:15px;
    line-height:1; color:var(--text); opacity:0;}
  input[type=checkbox]:checked{border-color:var(--text);}
  input[type=checkbox]:checked::after{opacity:1;}
  input[type=checkbox]:hover{border-color:var(--text);}
  input[type=checkbox]:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}

  button{font-family:var(--body); font-weight:600; font-size:var(--fs-field); cursor:pointer; border-radius:5px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:8px 13px;}
  button:hover{border-color:var(--tape);} button:active{transform:translateY(1px);}
  button.primary{background:var(--tape); color:var(--tape-ink); border-color:var(--tape);}
  button.danger{color:var(--danger);} button.small{padding:5px 9px; font-size:var(--fs-meta);}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0;
    border:none; background:transparent; color:var(--muted); font-size:var(--fs-meta); cursor:pointer; border-radius:5px;
    vertical-align:middle; margin-left:2px; line-height:1;}
  .icon-btn:hover{color:var(--tape); background:var(--tint-3);}
  .icon-btn.active{color:var(--tape); background:var(--tint-4);}
  /* destructive icon button — stays quiet until hovered, so a row of controls
     doesn't read as a row of warnings */
  .icon-btn.danger-ic:hover{color:var(--danger); background:rgba(164,50,31,.10);}
  .ic{display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; vertical-align:-2px;}
  .ic svg{display:block; width:100%; height:100%;}
  .icon-btn .ic{width:14px; height:14px; vertical-align:middle;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center;}
  .status{font-size:var(--fs-meta); color:var(--muted);}

  /* Page headline follows the preview-card pattern picked in the Style Review:
     a large all-caps display title, with upper-and-lower-case sub information
     in the body font beneath it (not an uppercase eyebrow above it). */
  .page-head{margin-bottom:16px;}
  .page-head h1{font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:.4px;
    text-transform:uppercase; margin:0; color:var(--text);}
  .page-head .eyebrow{font-family:var(--body); font-size:13px; letter-spacing:0; color:var(--muted);
    text-transform:none; margin-top:2px;}
  .page-head .code{font-family:var(--label); font-weight:500; letter-spacing:1.2px; font-size:var(--fs-ctl); color:var(--tape); margin-top:4px;}

  .tabs{display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .crewdb-tab-count{font-family:var(--body); font-weight:400; letter-spacing:0; opacity:.55;}
  /* Google Sheet sync bar (Crew database) — one quiet row above the search box */
  .sheet-sync-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; padding:8px 10px;
    border:1px solid var(--line); border-radius:8px;}
  .sheet-sync-title{font-family:var(--label); font-weight:500; font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); display:inline-flex; align-items:center; gap:6px; margin-right:4px;}
  .sheet-sync-status{font-size:var(--fs-meta); color:var(--muted); margin-left:auto;}
  .sheet-sync-link{color:var(--tape); text-decoration:underline; text-underline-offset:2px;}
  .sheet-sync-notice{font-size:var(--fs-meta); color:var(--tape); margin:-4px 0 10px; padding:0 10px;}
  .sheet-sync-notice.err{color:var(--danger);}
  /* Project Notes (T-9) — ruled rows, borderless bodies: a scratchpad, not a form */
  /* Talent etc — the SAME row as the Crew sub-tabs (.crewgrid's lead columns, header type,
     name weight, tick size); only the middle columns differ per view, set inline as --te-cols */
  .tegrid{display:grid; grid-template-columns:var(--pb-controls-w) var(--pb-dept-w) var(--pb-role-w) var(--pb-name-w) var(--te-cols);
    align-items:center; column-gap:10px;}
  .tegrid .crewgrid-header.te-l{text-align:left;}
  .tegrid input[type=text]{padding:0; margin:0; height:auto; min-height:0; width:100%; font-size:var(--fs-field); line-height:1.6; border-bottom:none; box-shadow:0 1px 0 var(--field-line);}
  .tegrid input[type=text]:hover{box-shadow:0 1px 0 var(--text);}
  .tegrid input[type=text]:focus{box-shadow:0 1.5px 0 var(--tape);}
  .tegrid input.te-num{text-align:center;}
  .te-role{font-size:var(--fs-meta); color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .te-total{font-size:var(--fs-meta); text-align:right; font-variant-numeric:tabular-nums;}
  .te-by{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; justify-self:center;}
  .te-by span{font-family:var(--label); font-size:9px; letter-spacing:.8px; text-transform:uppercase; padding:1px 7px; cursor:pointer; color:var(--muted); user-select:none;}
  .te-by span.on{background:var(--tape); color:var(--tape-ink);}
  .te-by span.on.them{background:var(--muted);}
  @media (pointer:coarse){ .tegrid input[type=text]{font-size:16px;} }
  @media(max-width:900px){ .tegrid{min-width:560px;} }
  .task-field{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; color:var(--text);}
  .list-card .meta .task-field, .list-card .meta .task-field span{color:var(--text); font-size:var(--fs-field); margin-top:0;}
  .list-card .meta .task-field{margin-top:8px;}
  .list-card .meta .task-field .task-field-msg{font-size:var(--fs-meta);}
  .flag-box{max-width:520px;}
  .flag-list{max-height:50vh; overflow:auto; border-top:1px solid var(--line);}
  .flag-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:var(--fs-field);}
  .flag-row-label{flex:1; min-width:0;}
  .flag-row.handled .flag-row-label{color:var(--muted);}
  .flag-row-state{font-size:var(--fs-meta); color:var(--tape); white-space:nowrap;}
  .notes-bar{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px;}
  .notes-search{flex:1 1 260px;}
  .note-row{padding:10px 0; border-top:1px solid var(--line);}
  .note-row:last-child{border-bottom:1px solid var(--line);}
  .note-meta{display:flex; align-items:center; gap:8px; font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:2px;}
  .note-meta .note-edited{text-transform:none; letter-spacing:0; font-family:var(--body); font-size:var(--fs-meta);}
  .note-meta{flex-wrap:wrap;}
  .note-meta .note-del{margin-left:6px;}
  /* formatting tools stay out of sight until the note is hovered or being typed in —
     opacity, not display, so nothing shifts under the cursor on focus */
  .note-tools{display:flex; gap:2px; margin-left:auto; opacity:0; transition:opacity .12s;}
  .note-row:hover .note-tools, .note-row:focus-within .note-tools{opacity:1;}
  @media (hover:none){ .note-tools{opacity:.55;} }
  .note-tools .icon-btn{font-family:var(--body); font-size:13px; letter-spacing:0; text-transform:none; margin-left:0;}
  .note-text{position:relative; width:100%; border:none; background:transparent; padding:4px 0; margin:0; min-height:30px; font-family:var(--body); font-size:var(--fs-name); line-height:1.55; color:var(--text); border-radius:0; overflow-wrap:anywhere;}

  .filter-panel{border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); margin-bottom:10px; background:var(--tint-1);}

  /* desktop only: ≤900px pins that column at a hard 60px (see the sticky block), so the variable

  @media(min-width:901px){

  .crew-rowselect .pb-head:has(.bulk-select-cb:checked),

  .crew-rowselect .pb-head:has(.bulk-select-cb:checked){box-shadow:inset 3px 0 0 var(--tape);}
  .crew-select-mode .pb-head{cursor:pointer;}

  .crew-select-mode .pb-head:has(.bulk-select-cb:checked):hover,

  .roles-grid{display:grid; align-items:center; column-gap:10px;

  .roles-col-toggle:hover{color:var(--text);}
  .roles-col-toggle:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}

  .roles-shoot-total:hover{color:var(--tape);}
  .roles-shoot-total:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  .roles-tablewrap{max-height:60vh; overflow:auto; overscroll-behavior:contain;}

  @media(max-width:900px){ .sd-two-col{grid-template-columns:1fr;} }

  .roles-tablewrap .roles-grid,

  .roles-tablewrap .roles-grid-name,
  .roles-tablewrap .pb-head-name{
    position:sticky; left:calc(var(--pb-controls-w) + var(--pb-dept-w) + var(--pb-role-w) + 30px); z-index:2;

  .roles-tablewrap .roles-grid-header-row .pb-head-blank,
  .roles-tablewrap .roles-grid-header-row .pb-head-dept,

  .roles-widezone{--roles-bleed:0px;}

  .roles-grid-header, .prep-grid-header{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; color:var(--muted); letter-spacing:1.2px; text-transform:uppercase;}

  .roles-head-drag{cursor:grab;}

  .prep-header-fields{display:flex; align-items:center; gap:10px;}

  .pb-dept-cell{min-width:0; font-size:var(--fs-field); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .roles-grid-controls{display:flex; align-items:center; gap:0;}
  .roles-grid-name{min-width:0; font-family:var(--body); font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .roles-grid-cell{min-width:0;}

  .dates-head{margin-bottom:12px;}
  .dates-name{font-family:var(--body); font-weight:600; font-size:15px; line-height:1.25;}
  .dates-role{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-top:2px;}
  /* the phase picker: three circles, one per phase, in their own colours */
  .dates-phases{display:flex; gap:8px; margin-bottom:12px;}
  .dates-phase{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:8px 4px 7px; border:1px solid var(--line); border-radius:var(--box-radius);
    cursor:pointer; user-select:none; background:transparent;}
  .dates-phase:hover{border-color:var(--field-line);}
  .dates-phase:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-dot{width:16px; height:16px; border-radius:50%; flex:0 0 auto;
    border:2px solid currentColor; background:transparent;}
  .dates-phase-lbl{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; line-height:1;}
  .dates-phase-n{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    line-height:1; letter-spacing:0; text-transform:none;}
  .dates-phase.prep{color:var(--phase-prep);} .dates-phase.shoot{color:var(--phase-shoot);}
  .dates-phase.post{color:var(--phase-post);}
  /* selected: the circle fills and the card takes the phase's own faint wash, so which phase
     you are editing is readable from the card and not only from the ring */
  .dates-phase.on .dates-dot{background:currentColor;}
  .dates-phase.on{border-color:currentColor; font-weight:600;}
  .dates-phase.prep.on{background:var(--phase-prep-soft);}
  .dates-phase.shoot.on{background:var(--phase-shoot-soft);}
  .dates-phase.post.on{background:var(--phase-post-soft);}
  .dates-cal{--phase-c:var(--tape);}
  .dates-cal.prep{--phase-c:var(--phase-prep); color:var(--phase-prep);}
  .dates-cal.shoot{--phase-c:var(--phase-shoot); color:var(--phase-shoot);}
  .dates-cal.post{--phase-c:var(--phase-post); color:var(--phase-post);}
  .dates-cal .prep-cal-day.marked{background:var(--phase-c); border-color:var(--phase-c); color:#fff;}
  .dates-cal{border:none; padding:0; margin:0;}
  /* a day the OTHER phases hold: a dot under the number, in that phase's colour, so a clash
     between prep and the shoot is visible while you are marking either */
  .prep-cal-day{position:relative;}
  .dates-others{position:absolute; bottom:2px; left:0; right:0; display:flex;
    justify-content:center; gap:2px; pointer-events:none;}
  .dates-others i{width:4px; height:4px; border-radius:50%; display:block;}
  .prep-cal-day.marked .dates-others i{outline:1px solid rgba(255,255,255,.7);}
  /* read-only: the shoot's dates are the shoot days' own, so the grid says so rather than
     accepting clicks that could not be stored anywhere */
  .dates-cal.readonly .prep-cal-day{cursor:default;}
  .dates-cal.readonly .prep-cal-day:not(.empty):hover{border-color:var(--line);}
  .dates-foot{margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dates-count{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);}
  /* the shortfall flag — fewer dates marked than days booked. Amber, not red: nothing is
     broken and nothing is blocked, there is just a booking not yet placed on the calendar. */
  .dates-short{display:flex; align-items:flex-start; gap:7px; margin-top:10px;
    padding:8px 10px; border-radius:5px; background:rgba(138,90,11,.09);
    border:1px solid rgba(138,90,11,.28);
    font-family:var(--body); font-size:var(--fs-meta); color:#7A4F09; line-height:1.45;}
  .dates-short strong{color:#7A4F09;}
  /* the row's own button. .short is the same signal at list scale, so a shortfall is findable
     without opening all 41 rows. */
  .dates-cell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .dates-btn{display:inline-flex; align-items:center; gap:4px; cursor:pointer;
    border:1px solid var(--line); border-radius:5px; background:transparent; padding:3px 7px;
    font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:.8px; color:var(--muted);
    white-space:nowrap;}
  .dates-phase-other{font-style:italic; font-weight:400; opacity:.65; margin-left:3px;}
  .dates-roles{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;}
  .dates-role-btn{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:.8px;
    text-transform:uppercase; padding:5px 10px; border:1px solid var(--line); border-radius:20px;
    background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .dates-role-btn:hover{border-color:var(--tape); color:var(--tape);}
  .dates-role-btn.on{border-color:var(--tape); background:var(--tint-3); color:var(--tape); font-weight:600;}
  .dates-role-btn:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-btn:hover{border-color:var(--tape); color:var(--tape);}
  .dates-btn:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .dates-btn.has-marks{color:var(--text);}
  .dates-btn.short{border-color:rgba(138,90,11,.5); color:#7A4F09;}
  .dates-btn svg{flex:0 0 auto;}
  .modal-overlay{position:fixed; inset:0; background:rgba(17,10,8,.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;}
  .modal-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--box-radius); padding:16px; max-width:420px; width:100%; box-shadow:0 12px 40px rgba(17,10,8,.25);}
  .modal-box h3{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin:0 0 14px;
    display:flex; align-items:center; gap:8px;}
  .modal-box h3::after{content:''; flex:1; height:1px; background:var(--line);}
  /* the crew form is a real form, not a confirm dialog — .modal-box's 420px would put two
     fields per line and then scroll forever, and the page behind it is 840px of paper */
  .crew-edit-box{max-width:620px; max-height:88vh; overflow:auto;}
  .loc-name-cell{cursor:pointer; user-select:none; display:flex; align-items:baseline; gap:6px;}
  .loc-name-cell:hover{color:var(--tape);}
  .loc-name-cell:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  .loc-name-cell .dept-caret{flex:0 0 auto;}
  .loc-name-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* a venue's name is a record title like any other — Jost 600 14px (was the browser's bold 16px) */
  .loc-name-text strong{font-family:var(--body); font-weight:600; font-size:var(--fs-name);}
  .loc-open-address{font-size:var(--fs-field); color:var(--text); margin-bottom:10px;}
  .venue-tools{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .loc-row-total{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;
    font-weight:600; align-self:center;}
  .loc-row-open{background:var(--tint-1);}
  .loc-cost-panel{margin-top:8px;}
  /* the banner: the same grid as .phase-banner, minus the phase stack it has no use for */
  .loc-banner{grid-template-columns:minmax(0,1fr); grid-template-areas:"totals" "tools";}
  .loc-banner .bnr-toolrow{justify-content:flex-end;}
  /* VAT as a toggle, sized and spaced like the other fields on the row */
  .loc-vat-field .loc-vat-toggle{display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--body); font-size:var(--fs-meta); color:var(--text); padding:6px 0;}
  .loc-cost-fields{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end;}
  .loc-cost-fields > div{min-width:0;}
  .loc-cost-fields select{width:130px;}
  .loc-cost-fields .budget-rate-input{width:96px;}
  /* one charge per line — these are things you read down a list and total in your head, not
     a wrapping row of pills */
  .loc-extras{margin-top:10px; border-top:1px solid var(--line); padding-top:8px;}
  .loc-extra-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .loc-extra-label{flex:1 1 auto; min-width:0;}
  .loc-extra-row .budget-rate-input{width:96px;}
  /* ---- day-by-day rates/hours (Phase CP) ---- */
  .loc-days{margin-top:10px; border-top:1px solid var(--line); padding-top:8px;}
  .loc-day-head, .loc-day-row{display:grid; grid-template-columns:44px repeat(var(--locday-cols,2), 96px) minmax(0,1fr);
    align-items:center; gap:8px;}
  .loc-day-head{font-family:var(--label); font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--muted); margin-bottom:4px;}
  .loc-day-head span:last-child, .loc-day-cost{text-align:right;}
  .loc-day-row{margin-bottom:4px;}
  .loc-day-num{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1px; color:var(--tape);}
  .loc-day-cost{font-variant-numeric:tabular-nums; white-space:nowrap;}
  @media(max-width:900px){
    .loc-cost-fields select, .loc-cost-fields .budget-rate-input{width:100%;}
    .loc-cost-fields > div{flex:1 1 100%;}
  }
  .add-person-box{max-width:520px;}
  .add-person-search{width:100%; font-size:15px; padding:10px 12px;}
  /* tall enough to show the shortlist without the modal growing and shrinking as you type —
     a list that changes height under the cursor is a list you mis-click */
  .add-person-results{margin-top:10px; max-height:46vh; overflow:auto;}
  .crew-add-person{margin-right:4px;}
  .crew-edit-box .crew-edit-form{margin:0;}
  .roles-grid-name{display:flex; align-items:center; gap:6px; min-width:0;}
  .roles-grid-name .pill.dept{flex:0 0 56px; display:inline-flex; justify-content:center;
    padding-left:0; padding-right:0;}
  .roles-name-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* the name on a Roles row opens the person's record in the edit pop-up (crewEditModalHTML) */
  .roles-name-link{cursor:pointer;} .roles-name-link:hover{color:var(--tape); text-decoration:underline; text-underline-offset:2px;}
  .roles-inline{display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px;}
  .formgroup{border:none; border-radius:0; padding:0; margin-bottom:16px; background:none;}
  .formgroup > .fg-title{font-family:var(--label); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;}
  .formgroup > .fg-title::after{content:''; flex:1; height:1px; background:var(--line);}
  /* collapsible crew-form sections */
  summary.fg-title{cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:6px;}
  summary.fg-title::-webkit-details-marker{display:none;}
  summary.fg-title::before{content:'▸'; font-size:9px; transition:transform .15s ease; display:inline-block;}
  details[open] > summary.fg-title::before{transform:rotate(90deg);}
  summary.fg-title:hover{opacity:.75;}
  .private-note{font-size:var(--fs-meta); color:var(--muted); background:rgba(164,50,31,.08); border:1px solid rgba(164,50,31,.28);
    border-radius:5px; padding:6px 9px; margin-bottom:8px;}
  .private-note b{color:var(--danger);}
  .taglist{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .crewrow-select{display:grid; grid-template-columns:46px 1fr 100px 34px; gap:8px; align-items:start; margin-bottom:8px; padding-top:6px;}
  .posn-dept-badge{font-family:var(--label); font-size:var(--fs-ctl); font-weight:600; letter-spacing:1.2px; color:var(--tape);
    background:var(--tint-3); border-radius:5px; padding:6px 4px; text-align:center; align-self:center;}
  /* shared crew identity block — used by every crew list in the app */
  .crew-ident{min-width:0;}
  /* compact single-row variant — everything on one line */
  .crew-ident.one-line{display:flex; align-items:center; gap:6px; flex-wrap:nowrap; min-width:0;}
  .crew-ident.one-line strong{font-family:var(--body); font-weight:600; font-size:14px; white-space:nowrap;}
  .crew-ident.one-line .crew-ident-sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .crew-ident.one-line select.pill-select{max-width:150px;}
  .crew-ident.one-line .icon-btn{flex:0 0 auto;}
  .override-dot{color:var(--tape); font-size:9px; flex:0 0 auto; cursor:help;}
  .posn-row-overridden{background:var(--tint-2); border-radius:8px;}
  .day-override-form{border:1px solid var(--line); border-radius:var(--box-radius); padding:var(--box-pad); background:var(--tint-1);}
  .day-override-form .fg-title{font-family:var(--label); font-size:11px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-bottom:8px;}
  .crewgrid{display:grid; grid-template-columns:var(--pb-controls-w) var(--pb-dept-w) var(--pb-role-w) var(--pb-name-w) repeat(var(--daycols), var(--daycolwidth, 38px)) 74px minmax(0,1fr);
    align-items:center; column-gap:10px;}
  .crewgrid-header-row{padding-bottom:6px; margin-bottom:4px; border-bottom:1.5px solid rgba(17,10,8,.35);}
  /* ---- Crew ▸ Hotel / Catering / Travel with Budget on (25 Sep 2026) — see costGridOn() ----
     The cost columns take the fixed 74px column's place and follow the ticks; each sub-tab sets its
     own --costcols (COST_COLS). They are tinted, a costing sheet beside the roster. A name on its
     own rate is amber — the pre-production stage's ink, the one warm colour the app already has. */
  .crewgrid.cost-on{grid-template-columns:var(--pb-controls-w) var(--pb-dept-w) var(--pb-role-w) var(--pb-name-w) repeat(var(--daycols), var(--daycolwidth, 38px)) var(--costcols) minmax(0,1fr);}
  /* Catering: the ticks, [the cost columns], Dietary, how they eat, the row's All */
  .crewgrid.catering-grid{column-gap:8px; grid-template-columns:var(--pb-controls-w) var(--pb-dept-w) var(--pb-role-w) var(--pb-name-w) repeat(var(--daycols), var(--daycolwidth, 62px)) minmax(80px,1fr) 168px 30px;}
  .crewgrid.catering-grid.cost-on{grid-template-columns:var(--pb-controls-w) var(--pb-dept-w) var(--pb-role-w) var(--pb-name-w) repeat(var(--daycols), var(--daycolwidth, 62px)) var(--costcols) minmax(80px,1fr) 168px 30px;}
  /* the cost cells wear Roles' clothes — muted header, centred tabular figures, the same rate input — no tint */
  .cost-cell{display:flex; align-items:center; justify-content:center; gap:3px; min-width:0;
    font-size:var(--fs-field); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .cost-cell.cost-span{grid-column:span 3;}
  .cost-unit{font-size:var(--fs-meta); color:var(--muted);}
  .cost-in{width:100%; min-width:0; text-align:center; font-variant-numeric:tabular-nums;}

  /* ---- the summaries (Hotel / Catering / Travel) — grid, then the list ---- */

  .sum-star{color:var(--phase-prep); font-weight:600; margin-left:1px;}

  .crewgrid-row{padding:8px 0;}
  .crewgrid-controls{display:flex; align-items:center;}
  .crewgrid-role-cell{min-width:0;}
  /* ⚠️ FLEX, so the repeat asterisk sits BESIDE the name rather than under it. The cell
     holds a <div class="crew-ident"> and then the star as a sibling; block-level layout
     put the star on its own line on every crewgrid tab. */
  .crewgrid-row-name{min-width:0; display:flex; align-items:center; gap:3px;}
  .crewgrid-row-name > .crew-ident{min-width:0;}
  .crewgrid-row-name .icon-btn{margin-left:0; margin-right:2px;}
  .crewgrid-check{display:flex; justify-content:center;}
  .crewview-tabs{margin-bottom:12px;}
  .crewgrid-check input{width:16px; height:16px;}
  /* catering: three stacked rows per person (Breakfast/Lunch/Dinner), kept compact
     so three rows don't feel like three times the space of one */
  /* catering: B / L / D sit INSIDE each day column, on the person's own line */
  .meal-trio, .meal-trio-head{display:flex; justify-content:center; gap:5px;}
  .crewgrid-check.meal-trio input{width:14px; height:14px;}
  .crewgrid-check.meal-trio input::after{font-size:12px;}
  .meal-trio-head span{width:14px; text-align:center; font-family:var(--body); font-size:9px; font-weight:400; letter-spacing:0; color:var(--muted); cursor:pointer; user-select:none; border-radius:3px;}
  .meal-trio-head span:hover{color:var(--tape); background:var(--tint-3);}
  .meal-trio-head span:focus-visible{outline:2px solid var(--tape); outline-offset:1px;}
  .meal-fill-table{width:100%; border-collapse:collapse;}
  .meal-fill-table th, .meal-fill-table td{text-align:left; padding:6px 16px 6px 0; font-size:var(--fs-field); border-bottom:1px solid var(--line); white-space:nowrap;}
  .meal-fill-table th{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); border-bottom:1.5px solid rgba(17,10,8,.35);}
  .crewview-tabs .crew-header-row .bnr-tool{font-family:var(--label);}
  .meal-tail{gap:12px; min-width:0; padding-left:12px;}
  .meal-diet{flex:1 1 auto; min-width:0; text-align:left; font-size:var(--fs-meta); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .meal-all.open .meal-all-key{font-family:var(--label); font-size:9px; letter-spacing:.8px; border:1px solid var(--line); border-radius:5px; padding:0 5px; line-height:16px;}
  .meal-all.open .meal-all-key:hover{border-color:var(--tape);}
  .meal-all.open > .meal-row-all:last-child{color:var(--tape);}
  .meal-all{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-meta); color:var(--muted);}
  .meal-own .meal-trio{opacity:.35;}
  .crewgrid-catering-person{padding-bottom:6px; margin-bottom:6px;}
  .crewgrid-catering-person:last-child{margin-bottom:0;}
  .meal-subrow{margin-top:1px;}
  .meal-subrow .meal-cell input{width:13px; height:13px;}
  .meal-subrow .meal-cell input::after{font-size:12px;}
  .meal-row-label-wrap{display:flex; align-items:center; gap:8px; min-width:0; padding-left:2px;}
  .meal-row-label{font-family:var(--label); font-size:11px; font-weight:500; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape);}
  .meal-row-all{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    cursor:pointer; flex-shrink:0; text-align:right;}
  .meal-row-all:hover{color:var(--tape);}
  .crewgrid-remove{display:flex; align-items:center; justify-content:flex-end; gap:2px;}
  /* Row-level "All": a text control in the body font, always in the row's final
     column so it lines up down the page (Fonts Review). Was a bordered button on
     Days/Hotel and a left-hand text link on Catering — now one thing, one place. */
  .all-toggle-btn{background:none; border:none; padding:0; min-height:0;
    font-family:var(--body); font-weight:400; font-size:var(--fs-meta); color:var(--muted);
    cursor:pointer; text-align:right;}
  .all-toggle-btn:hover{color:var(--tape); border:none;}
  .crewgrid-editform{grid-column:1/-1; margin-top:8px; border:1px solid var(--tape); border-radius:var(--box-radius); padding:var(--box-pad); background:var(--panel);}

  .person-block{padding:6px 0;}
  .person-block-editing{background:var(--tint-2); border-radius:8px; padding:8px;}
  .person-block .pb-head{padding:0;}
  .pb-head, .pb-role-row{min-height:33px;}
  .pb-role-row{padding:2px 0;}
  .pb-role-cell{min-width:0;}
  .pb-role-cell .roles-inline{flex-wrap:nowrap; min-width:0; max-width:100%;}
  /* the role chip itself ellipsis-truncates inside that now-bounded box rather
     than stretching the row or overflowing; full text is still in the chip's title */
  .pb-role-cell .role-chip{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; min-width:0;}
  .pb-toggle{display:inline-flex; align-items:center; gap:3px; cursor:pointer; user-select:none;
    color:var(--muted); font-family:var(--body); font-size:var(--fs-meta); line-height:1; flex:0 0 auto;}
  .pb-toggle:hover{color:var(--tape);}
  .pb-caret{font-size:9px;}
  /* the crew Edit/View expansion, shared by all six sub-tabs' blocks. Same treatment as
     the .roles-grid-editform / .crewgrid-editform it replaces, minus the grid-column —
     it is a sibling of the rows now, not a cell inside one. */
  .pb-editform{margin-top:8px; border:1px solid var(--tape); border-radius:var(--box-radius);
    padding:var(--box-pad); background:var(--panel);}

  /* scrollable wrapper for wide preview tables */
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px;}
  .tablewrap table{min-width:520px;}

  /* ---- LINE ITEMS — the budget as a spreadsheet (20 Sep 2026) ----
     Column letters, row numbers and a full grid, because the point is that it reads like the
     Excel budget it replaces. Blue ink = a figure typed here (the finance convention for a
     hard-coded input); everything else is read from the rest of the project. */
  .xls-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); background:var(--panel);}
  .section table.xls{width:auto; min-width:0; table-layout:fixed; border-collapse:collapse;
    font-size:var(--fs-meta); font-variant-numeric:tabular-nums;}
  .section table.xls td, .section table.xls th{border:1px solid var(--line); height:26px; padding:0 6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; text-align:left;
    font-family:var(--body); font-size:var(--fs-meta); font-weight:400; letter-spacing:0; text-transform:none; color:var(--text);}
  .section table.xls .xls-hd{background:var(--tint-1); color:var(--muted); text-align:center; padding:0;
    font-family:var(--label); font-size:10px; letter-spacing:.6px;}
  .section table.xls tr.xls-cols td{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape);}
  .section table.xls .n{text-align:right;} .section table.xls .c{text-align:center;}
  .section table.xls .mu{color:var(--muted);}
  .section table.xls tr.xls-sec td{background:var(--tint-2); font-weight:600;}
  .section table.xls tr.xls-tot td{font-weight:600;}
  .section table.xls tr.xls-rule td{border-top:1.5px solid var(--field-line);}
  .section table.xls td.xls-in{padding:0;}
  .section table.xls td.xls-in input, .section table.xls td.xls-in select{width:100%; height:25px; min-height:0; margin:0;
    padding:0 6px; border:none; border-radius:0; box-shadow:none; background:transparent; text-align:right;
    font-family:var(--body); font-size:var(--fs-meta); font-variant-numeric:tabular-nums; color:#1F5FBF;}
  .section table.xls td.xls-in input.l, .section table.xls td.xls-in select{text-align:left;}
  .section table.xls td.xls-in input.c{text-align:center;}
  .section table.xls td.xls-in input::placeholder{color:var(--muted); opacity:.75;}
  .section table.xls td.xls-in input:focus, .section table.xls td.xls-in select:focus{outline:2px solid var(--tape); outline-offset:-2px;}
  .xls-gut{display:flex; align-items:center; justify-content:space-between; height:25px; padding:0 2px 0 5px;}
  .xls-gut button{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; line-height:1;
    height:18px; min-width:16px; padding:0 3px; border-radius:3px; opacity:.45;}
  .xls tr:hover .xls-gut button, .xls-gut button:focus-visible{opacity:1;}
  .xls-gut button:hover{background:var(--tint-3); color:var(--tape);}
  .xls-gut button.del:hover{color:var(--danger);}
  .xls-bar{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border:1px solid var(--line); border-top:none;
    background:var(--tint-1); padding:5px 8px; font-size:var(--fs-meta); color:var(--muted);}
  .xls-bar .err{color:var(--danger);}
  .xls-pos{color:var(--tape);} .xls-neg{color:var(--danger);}
  .xls-pct{display:inline-flex; align-items:center; gap:4px; font-family:var(--label); font-size:var(--fs-ctl);
    letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);}
  .xls-pct input[type=text]{width:44px; padding:3px 4px; text-align:right; font-size:var(--fs-meta);}
  /* a lit button that happens to be first in a joined group keeps its lit ink (Cost | Charged) */
  .bnr-group .bnr-tool.on:first-child, .bnr-group .bnr-tool.on:first-child:hover{color:var(--tape-ink);}
  /* 90% opaque (70% was unreadable over the sheet) and no dimming, docked right — so the totals and the sheet can be watched changing */
  .modal-overlay.bset-overlay{background:transparent; justify-content:flex-end; align-items:flex-start;}
  .modal-box.bset-box{max-width:440px; background:rgba(255,255,255,.9); backdrop-filter:none;}
  .bset-box .bset-row{grid-template-columns:120px minmax(0,1fr);}
  .bset-row{display:grid; grid-template-columns:150px minmax(0,1fr); gap:2px 14px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line);}
  .bset-name{font-size:var(--fs-field);}
  .bset-hint{grid-column:2; margin-top:0;}
  .bset-chips{display:flex; flex-wrap:wrap; gap:4px 14px;} .bset-chips label{display:inline-flex; align-items:center; gap:5px; margin:0; font-size:var(--fs-field);}
  .bset-box .tabs{border-bottom:none; gap:4px;} .bset-box .tab{padding:5px 10px;}
  /* the Budget page head's own pieces, inside the shared .bnr-head */
  .bnr-head .budget-stat.bhead-final, .loc-banner .budget-stat.bhead-final{display:block;}
  .loc-banner .budget-stat.bhead-final .num{font-size:26px; line-height:1.15;}
  .bnr-head .bnr-totals{min-height:70px; align-items:flex-start;}
  .bnr-head .budget-stat.bhead-final .num{font-size:26px; line-height:1.15;}
  .bhead-sub{font-family:var(--body); font-size:var(--fs-meta); font-weight:400; color:var(--text); margin-top:2px; font-variant-numeric:tabular-nums;}
  .bhead-sub .mu{color:var(--muted);}
  .bhead-strip{display:flex; flex-wrap:wrap; gap:10px 34px; margin:2px 0 14px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  /* the figures under the Final total are lighter than it, so there is one headline in the head */
  .bhead-strip .budget-stat .num{font-size:21px; line-height:1.2; font-weight:400;}
  .bhead-row{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:0 0 12px;}
  .bhead-row .bnr-grow{flex:1 1 auto;}
  .bhead-view{position:relative; display:inline-flex;}
  .bhead-view > .bnr-tool{color:var(--text); font-weight:600;}
  .bhead-view-k{color:var(--muted); font-weight:400; margin-right:3px;}
  .bhead-view-shade{position:fixed; inset:0; z-index:40;}
  .bhead-view-menu{position:absolute; top:calc(100% + 4px); left:0; z-index:41; display:flex; flex-direction:column; min-width:170px;
    background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:4px; box-shadow:0 8px 24px rgba(17,10,8,.14);}
  .bhead-view-menu button{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase; text-align:left;
    color:var(--muted); background:transparent; border:none; border-radius:3px; padding:7px 9px; cursor:pointer; white-space:nowrap;}
  .bhead-view-menu button:hover{background:var(--tint-2); color:var(--tape);}
  .bhead-view-menu button.on{color:var(--text); font-weight:600; background:var(--tint-3);}
  .bhead-view-menu button:focus-visible{outline:2px solid var(--tape); outline-offset:-2px;}
  /* Edit on: the cells that write back to another tab are shaded, so it is plain what just unlocked */
  .section table.xls td.xls-ed{background:var(--tint-3);}
  .section table.xls td.xls-btn{padding:0;}
  .section table.xls td.xls-btn button{width:100%; height:25px; border:none; background:transparent; cursor:pointer; color:#1F5FBF;
    font-family:var(--body); font-size:var(--fs-meta);}
  .section table.xls td.xls-btn button:hover{text-decoration:underline;}
  .xls-fx{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-bottom:none; height:26px;
    font-size:var(--fs-meta); background:var(--panel);}
  .xls-fx span{padding:0 9px; line-height:26px; white-space:nowrap;}
  .xls-fx span:first-child{min-width:54px; text-align:center; border-right:1px solid var(--line);}
  .xls-fx span:nth-child(2){border-right:1px solid var(--line);}
  .xls-fx span:last-child{font-family:var(--mono);}

  .phase-banner{display:grid; grid-template-columns:var(--bnr-totals-w) minmax(0,1fr);
    grid-template-areas:"totals stage" "tools tools";
    gap:12px 28px; align-items:start;
    margin:14px 0 18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .bnr-totals{grid-area:totals; display:flex; align-items:flex-start; gap:30px; min-width:0;}
  /* fixed width inside a flexible column, so the amounts right-align on the same edge on
     every view rather than tracking whatever width is left over */
  .phase-banner .budget-scope-stack{grid-area:stage; width:var(--bnr-stage-w); max-width:100%;}
  .budget-stat .num{font-family:var(--label); font-weight:700; font-size:26px; letter-spacing:.4px;
    color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .budget-stat .lbl{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--tape); margin-top:2px;}
  /* the note that makes the whole banner's state readable when TOTALS is blank — otherwise
     an empty left third reads as a screen that failed to load rather than one with the
     money deliberately switched off */
  .bnr-totals-off{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);
    align-self:center; max-width:34ch; line-height:1.45;}
  .bnr-tools{grid-area:tools; display:flex; flex-direction:column; align-items:flex-end;
    gap:7px; min-width:0;}
  .bnr-toolrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .bnr-tool{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:5px; padding:4px 9px; cursor:pointer;
    user-select:none; white-space:nowrap; line-height:1.35;}
  .bnr-tool:hover{border-color:var(--tape); color:var(--tape);}
  /* ONE "+ ADD" BUTTON (Style check, 20 Sep 2026) — every button that adds a thing is this:
     the toolbar's Oswald outline, in ink so it leads its row. Mint Jost (button.small) is for
     neutral actions — Edit, Send to sheet; solid green is the one primary action in a dialog. */
  .bnr-tool.add{color:var(--text);}
  .bnr-tool.add:hover{color:var(--tape);}
  .bnr-tool.add.on, .bnr-tool.add.on:hover{color:var(--tape-ink);}
  input.role-code-input{width:48px; text-align:center; padding:0 2px; min-height:0; height:20px; font-size:var(--fs-meta);
    text-transform:uppercase; letter-spacing:.4px; margin-right:6px;}
  .bnr-tool.on{background:var(--tape); border-color:var(--tape); color:var(--tape-ink); font-weight:600;}
  .bnr-tool:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .bnr-scope-note{grid-column:1/-1; margin:0;}
  /* ---- THE PAGE HEAD (20 Sep 2026) — Crew and Talent etc share it; see pageHeadHTML().
     No rule of its own: the sub-tab row underneath draws the line. */
  .phase-banner.bnr-head{grid-template-columns:minmax(0,1fr) var(--bnr-stage-w); grid-template-areas:"left stage"; align-items:stretch; margin:6px 0 14px; padding-bottom:0; border-bottom:none;}
  /* ⚠️ min-height + space-between: Budget top, list tools bottom, and the total's slot between
     them is RESERVED — the head is the same height with Budget on or off. */
  .bnr-left{grid-area:left; display:flex; flex-direction:column; justify-content:space-between; gap:6px; min-width:0; min-height:98px;}
  .bnr-head .bnr-toolrow{justify-content:flex-start;}
  /* the total is ONE line here (figure, label, VAT notes on a shared baseline) so the reserved
     slot is a single row tall and the head stays close to the stage selector's own height */
  .bnr-head .bnr-totals{grid-area:auto; min-height:28px; align-items:center;}
  .bnr-head .budget-stat{display:flex; align-items:baseline; flex-wrap:wrap; gap:0 9px;}
  .bnr-head .budget-stat .num{font-size:21px; line-height:1.2;}
  .bnr-head .budget-stat .lbl, .bnr-head .budget-stat-sub{margin-top:0;}
  .bnr-toolrow .status{font-family:var(--body); font-size:var(--fs-meta); color:var(--muted);}
  /* + Add | Filter | Select — one joined control, hairlines between */
  .bnr-group{display:inline-flex; flex-wrap:wrap;}
  .bnr-group .bnr-tool{border-radius:0; margin-left:-1px;}
  .bnr-group .bnr-tool:first-child{border-radius:5px 0 0 5px; margin-left:0; color:var(--text);}
  .bnr-group .bnr-tool:last-child{border-radius:0 5px 5px 0;}
  .bnr-group .bnr-tool:only-child{border-radius:5px;}
  .bnr-group .bnr-tool:hover, .bnr-group .bnr-tool.on, .bnr-group .bnr-tool:focus-visible{position:relative; z-index:1;}
  .bnr-group .bnr-tool:first-child:hover{color:var(--tape);}
  .bnr-fold{cursor:pointer; user-select:none;} .bnr-fold:hover{color:var(--tape);}
  /* folded: the whole head on one line; the chip's colour is the stage selection (--tape follows
     applyStageColour: black for all / a mix, the stage's own colour when one is isolated) */
  .phase-banner.bnr-head.bnr-folded{display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .bnr-folded .bnr-grow{flex:1 1 auto;}
  .stage-chip{display:inline-flex; align-items:center; gap:7px; border-radius:5px; padding:4px 10px; cursor:pointer; user-select:none;
    background:var(--tape); border:1px solid var(--tape); color:#fff; white-space:nowrap; line-height:1.35;
    font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px; text-transform:uppercase; font-weight:500;}
  .stage-chip .stage-chip-meta{font-family:var(--body); font-size:var(--fs-meta); letter-spacing:0; text-transform:none; font-weight:400; opacity:.85;}
  .stage-chip .stage-dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.85);}
  .stage-chip.none{background:transparent; color:var(--muted); border-color:var(--line);}
  .stage-chip:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  /* Summary / Collapse all ride at the right-hand end of the sub-tab row */
  .crewview-tabs .crew-header-row{margin:0 0 0 auto; align-self:center;}
  /* the filter popup: the one filter panel, without its box — the dialog is the box */
  .modal-box.filter-box{max-width:660px; max-height:calc(100vh - 32px); overflow:auto;}
  .filter-box .filter-panel{border:none; padding:0; margin:0; background:none;}
  .budget-rate-input{width:64px; text-align:left;}
  .money-field{display:inline-flex; align-items:baseline; gap:1px; min-width:0;}
  .money-field::before{content:'£'; color:var(--muted); font-size:var(--fs-meta); flex:0 0 auto;}
  .money-field:has(input:placeholder-shown)::before{opacity:.45;}
  .money-field input{text-align:center;}
  /* the three numeric columns on Roles read as a block of figures, so they centre together
     — a right-aligned rate beside a left-aligned day count reads as two different tables */
  .roles-num .budget-rate-input, .roles-grid-rate .money-field input{text-align:center;}
  :is(.roles-grid-header, .prep-grid-header).roles-head-c{text-align:center;}
  .prep-grid.no-money{--pb-phase-fields-w:60px;}
  .prep-grid.no-money .prep-header-fields span{width:60px;}
  .rate-rows-scroll{overflow-x:auto;}
  .rate-rows{display:flex; flex-direction:column; gap:2px; min-width:560px;}
  .rate-row{display:grid; grid-template-columns:minmax(0,1fr) 74px 92px 74px 60px 66px 72px;
    align-items:center; column-gap:10px; min-height:32px;}
  .rate-row-head{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape);
    padding-bottom:4px; margin-bottom:2px; border-bottom:1px solid var(--line);}
  .rate-row-role{font-family:var(--body); font-weight:600; font-size:var(--fs-name);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rate-row-split{display:flex; align-items:center; gap:6px; margin:0;
    font-family:var(--body); font-size:var(--fs-meta); font-weight:400; letter-spacing:0;
    text-transform:none; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .rate-row .budget-rate-input{width:100%;}
  /* a disabled kit box still holds its column — it reads as "not split", not as missing */
  .rate-row .rr-kit:disabled{opacity:.4; cursor:not-allowed;}
  /* all three derived cells are TEXT, never inputs, so they can't look typeable */
  .rr-labour, .rr-vat, .rr-inc{font-size:var(--fs-meta); color:var(--muted);}
  /* the inc-VAT figure is the one you quote, so it carries the ink the others don't */
  .rr-inc{color:var(--text);}
  /* AG: the Day Rate input + its "save to crew database" icon, wherever the pair appears
     (Roles tab, Budget Per Person, the crew Edit expansion) */
  .rate-with-save{display:inline-flex; align-items:center; gap:4px;}
  .rate-with-save .hint{font-size:11px; white-space:nowrap;}
  .budget-extras-row td{padding-top:14px;}
  .budget-total-row td{padding-top:10px; border-top:1.5px solid var(--field-line);
    font-weight:600;}
  .budget-noRate{color:var(--muted); font-style:italic;}
  /* the VAT note riding on the TOTAL's label. Body font, not the label's uppercase
     letter-spaced type — it is a sentence about the number, not a second heading for it. */
  .budget-stat-note{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; text-transform:none; color:var(--muted); margin-left:8px;}
  /* the ex-VAT line under the headline. Same size and weight as the VAT note beside the
     label — they are a pair — but green, because it is a NUMBER in its own right rather
     than a remark about the one above it. */
  .budget-stat-sub{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; text-transform:none; color:var(--tape); margin-top:3px;
    font-variant-numeric:tabular-nums;}
  /* ---- STAGE: the phase stack, zone 2 of the banner ----
     Phase BU gave it a zone of its own rather than letting it ride at the end of the
     headline's flex row, which is what made it move when the headline changed shape. */
  .budget-scope-stack{display:flex; flex-direction:column; gap:1px; min-width:0;}
  /* dot | name | ONLY | slack | figures. The name column is a FIXED width so the three ONLY
     buttons stand in one vertical line straight after the titles. */
  .budget-scope-row{display:grid; grid-template-columns:8px 100px 40px minmax(0,1fr) 84px;
    align-items:center; gap:0 8px;
    padding:3px 0; cursor:pointer; border-bottom:1px solid var(--line);
    font-family:var(--body); font-size:var(--fs-meta);}
  .budget-scope-row.itemized{grid-template-columns:8px 100px 40px minmax(0,1fr) 84px 68px 84px;}
  .budget-scope-lead{grid-column:1 / 5;}
  /* by DEPARTMENT: one more column (% of the budget), so the figure columns tighten to keep the block's width */
  .budget-scope-row.dept-mode{grid-template-columns:8px minmax(0,1fr) 40px 84px 40px;}
  .budget-scope-row.dept-mode.itemized{grid-template-columns:8px minmax(0,1fr) 38px 78px 60px 78px 36px;}
  .budget-scope-row.dept-mode .budget-scope-lead{grid-column:1 / 4;}
  .budget-scope-row.dept-mode .budget-scope-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .budget-scope-row.dept-mode .budget-scope-count{grid-column:4 / -1;}
  .budget-scope-row.cost-mode[role=button]{cursor:pointer;}
  .budget-scope-row.cost-mode.cost-cur .budget-scope-name{font-weight:600;}
  .budget-scope-row.cost-mode.cost-cur .stage-dot{background:var(--tape);}
  .bnr-left .bnr-toolrow:empty{display:none;}      /* Budget's head has no tool rows of its own — its total sits at the top */
  .budget-scope-pct{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums;}
  .stage-dot.stage-dot-dept{background:var(--tape);}
  .bnr-cut{cursor:pointer; user-select:none; opacity:.4;} .bnr-cut.on{opacity:1; color:var(--text);}
  .bnr-cut:hover{opacity:1; color:var(--tape);} .bnr-cut:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .bnr-cut-sep{opacity:.4; margin:0 4px;}
  .budget-scope-all{font-weight:600;}
  .stage-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 auto;}
  .stage-dot.stage-dot-all{background:var(--text);}
  .stage-dot.stage-pre{background:var(--phase-prep);} .stage-dot.stage-prod{background:var(--phase-shoot);} .stage-dot.stage-post{background:var(--phase-post);}
  /* ONLY takes its OWN stage's colour, whatever the page is wearing */
  .stage-only{--c:var(--text); font-family:var(--label); font-size:9px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; line-height:1.3;
    width:40px; padding:1px 0; text-align:center; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--muted);}
  .stage-only.stage-pre{--c:var(--phase-prep);} .stage-only.stage-prod{--c:var(--phase-shoot);} .stage-only.stage-post{--c:var(--phase-post);}
  .stage-only:hover{border-color:var(--c); color:var(--c);}
  .stage-only.on{background:var(--c); border-color:var(--c); color:#fff; font-weight:600;}
  /* the stage colour — see applyStageColour() */
  .stage-all{--tape:var(--text); --tint-1:rgba(17,10,8,.025); --tint-2:rgba(17,10,8,.04); --tint-3:rgba(17,10,8,.07);
    --tint-4:rgba(17,10,8,.11); --tint-5:rgba(17,10,8,.30); --tint-6:rgba(17,10,8,.22);}
  .stage-pre{--tape:var(--phase-prep); --tint-1:rgba(138,90,11,.035); --tint-2:rgba(138,90,11,.06); --tint-3:rgba(138,90,11,.11);
    --tint-4:rgba(138,90,11,.15); --tint-5:rgba(138,90,11,.35); --tint-6:rgba(138,90,11,.28);}
  .stage-prod{--tape:var(--phase-shoot); --tint-1:rgba(1,119,86,.03); --tint-2:rgba(1,119,86,.05); --tint-3:rgba(1,119,86,.10);
    --tint-4:rgba(1,119,86,.14); --tint-5:rgba(1,119,86,.35); --tint-6:rgba(1,119,86,.28);}
  .stage-post{--tape:var(--phase-post); --tint-1:rgba(74,60,140,.035); --tint-2:rgba(74,60,140,.06); --tint-3:rgba(74,60,140,.11);
    --tint-4:rgba(74,60,140,.15); --tint-5:rgba(74,60,140,.35); --tint-6:rgba(74,60,140,.28);}
  /* the little stage tags beside a name on Roles: text where the list has room (money off,
     desktop — the name column widens to take them), dots everywhere else */
  .stage-tags{display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;}
  .stage-tag{width:7px; height:7px; border-radius:50%; font-size:0; line-height:0; display:inline-block;}
  .stage-tag.stage-pre{background:var(--phase-prep);} .stage-tag.stage-prod{background:var(--phase-shoot);} .stage-tag.stage-post{background:var(--phase-post);}
  @media(min-width:901px){
    .roles-tags-text .stage-tag{width:auto; height:auto; border-radius:3px; padding:0 5px; font-family:var(--label); font-size:9px; font-weight:500;
      letter-spacing:.8px; line-height:15px; text-transform:uppercase; color:#fff;}
  }
  /* the counts row (money off) has one cell where the figures go, so it spans them */
  .budget-scope-row .budget-scope-count{grid-column:4 / -1; text-align:right;}
  .budget-scope-ex, .budget-scope-vat{text-align:right; white-space:nowrap; color:var(--muted);
    font-variant-numeric:tabular-nums;}
  /* ex-VAT is the figure you work from, so it carries the brand colour the headline's own
     ex-VAT line does — the two are the same fact at two scales */
  .budget-scope-ex{color:var(--tape);}
  /* the column headings: the same uppercase label type the rest of the banner uses, and not
     a control — clicking a scope row is a toggle, and this row must not look like one */
  .budget-scope-head{cursor:default; font-family:var(--label); font-size:10px;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); padding-bottom:2px;}
  .budget-scope-head:hover{color:var(--muted);}
  .budget-scope-row:last-child{border-bottom:none;}
  .budget-scope-row:hover{color:var(--tape);}
  .budget-scope-row:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .budget-scope-name{white-space:nowrap;}
  .budget-scope-amt{font-weight:600; white-space:nowrap; text-align:right;
    font-variant-numeric:tabular-nums;}
  /* what the row says with the money hidden. Body font and muted, NOT the amount's Oswald
     600 — it is a description of the phase, not a figure standing where a figure was, and
     matching the money's weight would invite reading it as one. */
  .budget-scope-count{font-family:var(--body); font-size:var(--fs-meta); font-weight:400;
    letter-spacing:0; color:var(--muted); white-space:nowrap;}
  .budget-scope-row.off{opacity:.38;}
  .budget-same-person td{border-top:none;}
  tr:has(+ .budget-same-person) td{border-bottom:none;}
  /* ---- catering summary ----
     The total leads the block: it's the number you came for, and it used to sit under a
     six-column grid, below the fold. */
  .csm-total{font-size:var(--fs-meta); color:var(--muted); margin-bottom:10px;}
  .csm-total strong{font-family:var(--body); font-size:17px; color:var(--text); margin-left:6px;}
  /* the cost column is inputs, so it needs a real width where the day columns can stay
     as narrow as their numbers */
  .csm-cost-head{width:96px;}
  .csm-cost-cell{width:96px;}
  .csm-cost-cell input{width:80px; text-align:left;}
  /* Dietaries / Specials are sub-tables INSIDE the summary block, so they take a quieter
     heading than the block's own — the same label type as a column header, not an h2 */
  .csm-subhead{font-family:var(--label); font-size:var(--fs-ctl); font-weight:500;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--tape); margin:18px 0 4px;}
  /* the note and its pencil are one unit: the pencil sits at the END of the text rather
     than in a column of its own, so a short note doesn't leave the icon stranded */
  .csm-note{display:inline-flex; align-items:flex-start; gap:4px;}
  .csm-note .icon-btn{flex:0 0 auto;}

  .ai-chat{max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    padding:2px 2px 2px 0; margin-bottom:10px;}
  .ai-turn{border-left:2px solid var(--line); padding-left:12px;}
  .ai-turn-assistant{border-left-color:var(--tape);}
  .ai-turn-role{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  .ai-turn-assistant .ai-turn-role{color:var(--tape);}
  .ai-bubble-text{font-size:var(--fs-field); line-height:1.5;}
  .ai-bubble-file{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-meta);
    color:var(--muted); background:var(--panel-2); border-radius:20px; padding:3px 10px; margin-top:4px;}
  .ai-card{border:1px solid var(--tape); border-radius:var(--box-radius); padding:var(--box-pad);
    margin-top:8px; background:var(--tint-1);}
  .ai-card-resolved{border-color:var(--line); background:none; opacity:.72;}
  .ai-match-banner{display:flex; align-items:center; gap:8px; font-size:var(--fs-meta);
    margin-bottom:10px; cursor:pointer;}
  .ai-card-status{font-family:var(--label); font-size:var(--fs-ctl); letter-spacing:1.2px;
    text-transform:uppercase; color:var(--muted); margin-top:8px;}
  /* G17 — pre-line so a multi-file attach can report one line per failed file
     rather than only the last one. Single-line errors are unaffected. */
  .ai-error{border:1px solid var(--danger); color:var(--danger); border-radius:var(--box-radius);
    padding:9px 11px; font-size:var(--fs-meta); margin-bottom:10px; white-space:pre-line;}
  /* R14 — "no API key set". Deliberately NOT .ai-error red: nothing has gone wrong
     and nothing the user did caused it; it's a setup step they're being told about
     before they waste a message on it. Amber, informational. */
  .ai-notconfigured{border:1px solid rgba(180,120,10,.45); background:rgba(180,120,10,.07);
    color:#7a5200; border-radius:var(--box-radius); padding:10px 12px;
    font-size:var(--fs-meta); line-height:1.5; margin-bottom:10px;
    display:flex; align-items:flex-start; gap:8px;}
  .ai-notconfigured code{font-family:var(--mono); font-size:var(--fs-meta);
    background:rgba(180,120,10,.14); padding:1px 5px; border-radius:3px;}
  .ai-notconfigured .ic, .ai-notconfigured svg{flex:0 0 auto;}
  /* R13 — an active Inverse flips what the whole list means, so the toggle says so
     rather than leaving it to a tick buried in the open panel. */
  .filter-inverted{font-family:var(--label); font-size:9px; letter-spacing:.8px;
    text-transform:uppercase; color:var(--danger); border:1px solid var(--danger);
    border-radius:3px; padding:0 4px; margin-left:4px; vertical-align:1px;}
  /* R17 — the undo toast. Sits above everything, bottom-left so it never covers the
     primary actions on the right, and stays out of the mobile drawer's way. */
  .undo-toast{position:fixed; left:18px; bottom:18px; z-index:900; display:flex; align-items:center; gap:14px;
    background:var(--text); color:#FBFAF8; border-radius:8px; padding:11px 14px;
    font-family:var(--body); font-size:var(--fs-meta); box-shadow:0 6px 22px rgba(0,0,0,.28);
    max-width:min(420px, calc(100vw - 36px));}
  .undo-toast .undo-action{font-weight:600; color:var(--tape-light); cursor:pointer; white-space:nowrap;}
  .undo-toast .undo-action:hover{text-decoration:underline;}
  .undo-toast .undo-close{cursor:pointer; opacity:.6; display:inline-flex;}
  .undo-toast .undo-close:hover{opacity:1;}
  .undo-toast svg{width:13px; height:13px;}
  @media(max-width:600px){ .undo-toast{left:12px; right:12px; bottom:12px; max-width:none;} }
  .save-banner{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:950;
    display:flex; align-items:flex-start; gap:14px;
    background:#FBF6E9; border:1px solid rgba(180,120,10,.55); color:#5f4100;
    border-radius:8px; padding:11px 13px; font-family:var(--body); font-size:var(--fs-meta);
    line-height:1.5; box-shadow:0 6px 22px rgba(0,0,0,.22);
    max-width:min(620px, calc(100vw - 28px));}
  .save-banner-lost{background:#FBEDEA; border-color:var(--danger); color:#6d2114;}
  .save-banner-text{flex:1 1 auto;}
  .save-banner-detail{font-family:var(--mono); font-size:11px; opacity:.75; margin-top:5px;
    word-break:break-word;}
  .save-banner button.small{flex:0 0 auto; margin-top:1px;}
  .save-banner-close{cursor:pointer; opacity:.6; display:inline-flex; margin-top:2px;}
  .save-banner-close:hover{opacity:1;}
  .save-banner svg{width:13px; height:13px;}
  @media(max-width:600px){ .save-banner{left:12px; right:12px; transform:none;
    max-width:none; flex-wrap:wrap;} }
  /* the inline counterpart — a status span that is reporting a failure, not "Saved" */
  .status-failed{color:var(--danger); font-weight:600;}
  .ai-attachments{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .ai-input-row{display:flex; align-items:center; gap:8px;}
  .ai-input-row input[type=text]{flex:1;}

  /* ============================================================
     MOBILE / TABLET
     ============================================================ */
  @media(max-width:900px){
    /* --- slide-out drawer nav --- */

      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;

      border-bottom:1px solid var(--side-line);

    .topbar .burger{
      background:transparent; border:1px solid var(--side-line); color:var(--side-text);

      display:flex; align-items:center; justify-content:center; padding:0;

    .side-label{font-size:11px; margin:18px 6px 7px;}

    /* --- form controls: 16px stops iOS auto-zoom on focus --- */
    input[type=text], input[type=date], textarea, select{

    label{font-size:12px; margin-bottom:5px;}

    /* --- everything in one column --- */

    .rows-sched .row input[type=text]{padding:9px 8px; min-height:42px;}

    .sc-move .ic{width:13px; height:13px;}

    .sched-insert-hint span{width:20px; height:20px; font-size:13px;}

    .tabs{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      scroll-snap-type:x proximity;}

    .list-card .actions button{flex:1 1 auto;}

    :root{--pb-controls-w:0px; --pb-dept-w:50px; --pb-name-w:126px; --pb-role-w:104px;}

    :root{--pb-pin-w:186px;}   /* 50 + 10 + 126 */
    .crewgrid-controls, .roles-grid-controls, .prep-controls, .pb-head-blank{
      position:sticky; left:0; z-index:2; background:var(--bg);

    }
    .crewgrid-row-name, .roles-grid-name, .prep-name, .pb-head-name{

  const wasActive = c.role && rolePath.endsWith('/'+c.role);

  if(wasActive && c.roles.length){ await setActiveRole(crewId, c.roles[0], true); }
  if(cascade){
    projectIds.forEach(pid=>{
      const p = projById(pid); if(!p) return;
      const kill = entriesForCrew(crewId, p).filter(e=>e.role===roleName).map(e=>e.id);
      if(kill.length) removeCrewEntries(p, kill);
    });
  }
  await saveDB('db:crew', crewDB);
  if(cascade){ await saveDB('db:projects', projectsDB); await saveDB('db:shootdays', shootDaysDB); }
  refreshCrewScreen();
  if(cascade){
    const who = c.name || 'crew member';
    const n = projectIds.length;
    finishUndo(`Deleted role "${roleName}" from ${who} across ${n} project${n===1?'':'s'}.`, snaps);
  }
}

  if(rate.hasRate) opts.push({key:'rate',    label:`Day rate — ${budgetFmt(rate.rate)}${entryIsBuyout(entryId)?' (buyout)':''}`});
  if(prep)         opts.push({key:'prep',    label:`Prep days — ${prep}`});

  if(travel)       opts.push({key:'travel',  label:`Travel — ${travel}`});

async function confirmSwap(entryId){
  const p = currentProject(); if(!p || !swapPickId) return;
  const e = entryById(entryId, p); if(!e) return;
  const oldId = e.crewId, newId = swapPickId;
  const oldName = (crewById(oldId)||{}).name || 'them', newName = (crewById(newId)||{}).name || 'them';
  const keep = swapKeep || {};
  const days = projectDays();
  const wasLastEntry = entriesForCrew(oldId, p).length === 1;
  if(!confirm(`Swap ${oldName} for ${newName} on ${e.role||'this role'}?`)) return;
  const snaps = beginUndo(['db:projects','db:shootdays']);
  // ---- the booking: ONE field, because everything else is keyed to the entry ----
  e.crewId = newId;
  if(!keep.rate){ delete e.rate; delete e.buyout; }
  if(!keep.prep && p.prepSchedule) delete p.prepSchedule[entryId];
  if(!keep.post && p.postSchedule) delete p.postSchedule[entryId];
  if(!keep.shoot){
    days.forEach(d=>{ if(Array.isArray(d.positions)) d.positions = d.positions.filter(pos=>pos[0]!==entryId); });
  }
  // ---- person-keyed logistics: moved by hand, never over the new person's own ----
  days.forEach(d=>{
    if(keep.hotel && (d.hotelNights||[]).includes(oldId) && !d.hotelNights.includes(newId)) d.hotelNights.push(newId);
    if(keep.catering && (d.cateringMeals||{})[oldId] && !(d.cateringMeals||{})[newId]){
      d.cateringMeals[newId] = Object.assign({}, d.cateringMeals[oldId]);
    }
    if(wasLastEntry){
      if(Array.isArray(d.hotelNights)) d.hotelNights = d.hotelNights.filter(id=>id!==oldId);
      if(d.cateringMeals) delete d.cateringMeals[oldId];
    }
  });
  if(keep.hotel && (p.hotelNightBefore||[]).includes(oldId) && !p.hotelNightBefore.includes(newId)) p.hotelNightBefore.push(newId);
  if(wasLastEntry && Array.isArray(p.hotelNightBefore)) p.hotelNightBefore = p.hotelNightBefore.filter(id=>id!==oldId);
  p.travelMethods = p.travelMethods || {};
  if(keep.travel && p.travelMethods[oldId] && !p.travelMethods[newId]) p.travelMethods[newId] = p.travelMethods[oldId];
  if(wasLastEntry) delete p.travelMethods[oldId];
  await saveDB('db:projects', projectsDB);
  await saveDB('db:shootdays', shootDaysDB);
  swapPickId = ''; swapKeep = null;
  closeRolesMenu();
  renderProjectBody();
  finishUndo(`${oldName} swapped for ${newName}`, snaps);
}

  const out = [];

  if(prep) out.push({stage:'Pre-Prod', days:prep});

/* Recalculates ONE row in place — never a re-render, which would throw away whatever is

function refreshRateRow(el){

  kitInput.disabled = !split;
