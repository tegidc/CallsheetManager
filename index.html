/* The two tabs, and everything that differs between them. Keyed by crewGridView value
   — that key IS the phase throughout this section, so there is no second mapping to
   keep in step. ⚠️ `store` is a PROJECT key: adding a phase here adds a project field. */
const PHASE_TABS = {
  preprod: {
    store:'prepSchedule', daysTitle:'Pre-Prod days',
    // where the calendar opens when nothing is marked yet: prep runs UP TO the shoot,
    // so it anchors on the first shoot day; the edit runs after it, so post anchors on
    // the last. Read-only either way — neither tab ever touches a shoot day.
    anchor:'first',
    calHint:"Click or drag to mark the days this person is needed in prep. Marks are indicative — they don't have to match the booked number."
  },
  post: {
    store:'postSchedule', daysTitle:'Edit days',
    anchor:'last',
    calHint:"Click or drag to mark the days this person is needed in the edit. Marks are indicative — they don't have to match the booked number."
  }
};
const isPhaseTab = (view) => Object.prototype.hasOwnProperty.call(PHASE_TABS, view);

let phaseCalendarFor = null;   // {phase, entryId} or null
let phaseCalMonth = null;      // 'YYYY-MM' the open calendar is currently showing
const phaseCalOpen = (phase, entryId) =>
  !!phaseCalendarFor && phaseCalendarFor.phase===phase && phaseCalendarFor.entryId===entryId;
function closePhaseCalendar(){ phaseCalendarFor = null; phaseCalMonth = null; }

const phaseScheduleOf = (phase, p) => ((p||currentProject()||{})[PHASE_TABS[phase].store])||{};
const phaseRecordOf   = (phase, entryId, p) => phaseScheduleOf(phase, p)[entryId] || null;
const phaseDaysOf     = (phase, entryId, p) => { const r = phaseRecordOf(phase, entryId, p); return r && r.days!=null ? r.days : null; };
const phaseDatesOf    = (phase, entryId, p) => { const r = phaseRecordOf(phase, entryId, p); return Array.isArray(r&&r.dates) ? r.dates : []; };
/* the two named readers the REST of the app uses (fronting, Budget). Thin aliases, so
   there is still exactly one implementation underneath them. */
const prepDaysOf = (entryId, p) => phaseDaysOf('preprod', entryId, p);
const postDaysOf = (entryId, p) => phaseDaysOf('post', entryId, p);

/* the ONE write path into either store. Normalises on the way out (dates sorted and
   deduplicated) and deletes rather than storing an empty husk — the same idiom as
   saveEntryRate()'s "clearing the field deletes the key". */
function phaseWrite(phase, p, entryId, mutate){
  if(!p || !entryId) return;
  const store = PHASE_TABS[phase].store;
  p[store] = p[store] || {};
  const existing = p[store][entryId];
  const rec = { days: existing && existing.days!=null ? existing.days : null,
                dates: Array.isArray(existing&&existing.dates) ? existing.dates.slice() : [] };
  mutate(rec);
  const dates = [...new Set(rec.dates||[])].sort();
  if(rec.days==null && !dates.length) delete p[store][entryId];
  else p[store][entryId] = { days: rec.days, dates };
  if(!Object.keys(p[store]).length) delete p[store];
}

function prunePhaseSchedules(p, entryIds){
  if(!p) return;
  const kill = entryIds instanceof Set ? entryIds : new Set(entryIds||[]);
  Object.values(PHASE_TABS).forEach(({store})=>{
    if(!p[store]) return;
    kill.forEach(id=>{ delete p[store][id]; });
    if(!Object.keys(p[store]).length) delete p[store];
  });
  CREW_PHASES.forEach(({members})=>{
    if(!Array.isArray(p[members])) return;
    p[members] = p[members].filter(id=>!kill.has(id));
  });
  /* Phase BX — overtime is entry-keyed too, so it is pruned in the same pass. This function is
     the one place every entry-keyed project store gets cleaned up; a new one added anywhere
     else and not listed here is a dangling record waiting to be found. */
  if(p.overtime){
    kill.forEach(id=>{ delete p.overtime[id]; });
    if(!Object.keys(p.overtime).length) delete p.overtime;
  }
}

async function setPhaseDays(phase, entryId, rawValue){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  const trimmed = (rawValue||'').trim();
  let next = null;
  if(trimmed!==''){
    const n = Number(trimmed);
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }
    next = n;
  }
  phaseWrite(phase, p, entryId, rec=>{ rec.days = next; });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

/* ---- the per-entry calendar ---- */
function phaseCalAnchorMonth(phase, entryId){
  const marks = phaseDatesOf(phase, entryId);
  if(marks.length) return marks[0].slice(0,7);
  // otherwise open on something meaningful: the shoot day this phase sits next to
  // (first for prep, last for the edit), else the project's start date, else this
  // month. Read-only — neither tab ever touches shoot days.
  const p = currentProject();
  const days = projectDays(p&&p.id);
  const anchorDay = PHASE_TABS[phase].anchor==='last' ? days[days.length-1] : days[0];
  const iso = (anchorDay && anchorDay.date) || (p && p.startDate) || '';
  return /^\d{4}-\d{2}/.test(iso) ? iso.slice(0,7) : new Date().toISOString().slice(0,7);
}
function togglePhaseCalendar(phase, entryId){
  if(phaseCalOpen(phase, entryId)) closePhaseCalendar();
  else { phaseCalendarFor = {phase, entryId}; phaseCalMonth = phaseCalAnchorMonth(phase, entryId); }
  renderProjectBody();
}
function shiftPhaseCalMonth(delta){
  if(!phaseCalMonth) return;
  const [y,m] = phaseCalMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  phaseCalMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  renderProjectBody();
}
async function commitPhaseDates(phase, entryId, isoList){
  const p = currentProject(); if(!p) return;
  if(!entryById(entryId, p)) return;
  phaseWrite(phase, p, entryId, rec=>{ rec.dates = isoList||[]; });
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
  /* ⚠️ Phase BW — the Dates popup lives on #globalOverlay, which renderProjectBody() does not
     touch. Without this every mark made in the popup would save and then not appear until you
     closed it. Harmless when nothing is open — the dialog builders each return '' . */
  renderGlobalOverlay();
}
async function clearPhaseDates(phase, entryId){ await commitPhaseDates(phase, entryId, []); }

let prepDrag = null;   // {phase, entryId, mode:'add'|'remove', set:Set}
function phaseDayDown(phase, entryId, iso, ev){
  if(ev) ev.preventDefault();
  const cur = new Set(phaseDatesOf(phase, entryId));
  prepDrag = { phase, entryId, mode: cur.has(iso) ? 'remove' : 'add', set: cur };
  prepDragApply(iso);
}
function phaseDayEnter(iso){ if(prepDrag) prepDragApply(iso); }
function prepDragApply(iso){
  if(!prepDrag) return;
  if(prepDrag.mode==='add') prepDrag.set.add(iso); else prepDrag.set.delete(iso);
  const el = document.querySelector(`.prep-cal-day[data-iso="${iso}"]`);
  if(el) el.classList.toggle('marked', prepDrag.set.has(iso));
}
document.addEventListener('mouseup', ()=>{
  if(!prepDrag) return;
  const d = prepDrag; prepDrag = null;
  commitPhaseDates(d.phase, d.entryId, [...d.set]);
});

const PREP_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const PREP_WEEKDAYS = ['M','T','W','T','F','S','S'];

let datesDialogFor = null;     // entry id, or null
let datesDialogPhase = 'preprod';
let datesDialogMonth = null;   // 'YYYY-MM'
function datesAnchorMonth(phase, entryId){
  const marks = datesPhaseMarks(phase, entryId);
  if(marks.length) return marks[0].slice(0,7);
  if(phase!=='days') return phaseCalAnchorMonth(phase, entryId);
  const p = currentProject();
  const first = projectDays(p && p.id)[0];
  const iso = (first && first.date) || (p && p.startDate) || '';
  return /^\d{4}-\d{2}/.test(iso) ? iso.slice(0,7) : new Date().toISOString().slice(0,7);
}
function openDatesDialog(entryId, phase){
  datesDialogFor = entryId;
  datesDialogPhase = phase || 'preprod';
  datesDialogMonth = datesAnchorMonth(datesDialogPhase, entryId);
  renderGlobalOverlay();
}
function closeDatesDialog(){ datesDialogFor = null; datesDialogMonth = null; renderGlobalOverlay(); }
function setDatesDialogEntry(entryId){
  if(!entryId || entryId===datesDialogFor) return;
  datesDialogFor = entryId;
  /* keep the month you are looking at if this role has anything there, otherwise go to where
     its own dates are — the same rule setDatesDialogPhase() uses when you change phase */
  const inView = datesPhaseMarks(datesDialogPhase, entryId).some(iso=>iso.slice(0,7)===datesDialogMonth);
  if(!inView) datesDialogMonth = datesAnchorMonth(datesDialogPhase, entryId);
  renderGlobalOverlay();
}
function setDatesDialogPhase(phase){
  datesDialogPhase = phase;
  /* re-anchor on the phase you have just switched to, but only when the month you are
     looking at holds nothing for it — otherwise switching phases to compare two of them in
     the same month would jump you somewhere else mid-comparison. */
  const inView = datesPhaseMarks(phase, datesDialogFor).some(iso=>iso.slice(0,7)===datesDialogMonth);
  if(!inView) datesDialogMonth = datesAnchorMonth(phase, datesDialogFor);
  renderGlobalOverlay();
}
function shiftDatesDialogMonth(delta){
  if(!datesDialogMonth) return;
  const [y,m] = datesDialogMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  datesDialogMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  renderGlobalOverlay();
}
function datesPhaseMarks(phase, entryId){
  const p = currentProject(); if(!p || !entryId) return [];
  if(phase==='days'){
    return projectDays(p.id).filter(d=>entryOnDay(entryId, d) && /^\d{4}-\d{2}-\d{2}/.test(d.date||''))
      .map(d=>d.date.slice(0,10)).sort();
  }
  return phaseDatesOf(phase, entryId, p);
}
/* booked days vs dates marked, per phase.
   ⚠️ THE SHOOT CANNOT BE SHORT, by construction: its booked figure and its marks are the same
   set of shoot days, so `booked` reads from the marks rather than from a stored number. */
function datesPhaseTally(phase, entryId){
  const p = currentProject();
  const marked = datesPhaseMarks(phase, entryId).length;
  const booked = phase==='days' ? marked : (phaseDaysOf(phase, entryId, p) || 0);
  return { booked, marked, short: Math.max(0, booked - marked) };
}
/* any phase on this entry with dates still to place — what the row's button reports */
const datesEntryShort = entryId =>
  CREW_PHASES.filter(ph=>ph.view!=='days').reduce((n,ph)=>n + datesPhaseTally(ph.view, entryId).short, 0);
const datesEntryMarks = entryId =>
  CREW_PHASES.reduce((n,ph)=>n + datesPhaseMarks(ph.view, entryId).length, 0);

/* the row's cell: one button, carrying how many dates are marked and whether any phase is
   short — so a shortfall is findable without opening all 41 rows. */
function datesCellHTML(e){
  const marks = datesEntryMarks(e.id);
  const short = datesEntryShort(e.id);
  const label = short ? `${short} to place` : marks ? `${marks} date${marks===1?'':'s'}` : 'Dates';
  const title = short
    ? `${short} booked day${short===1?'':'s'} not yet on the calendar — click to place them`
    : marks ? `${marks} date${marks===1?'':'s'} marked across prep, the shoot and the edit` : 'No dates marked yet';
  return `<div class="roles-grid-cell dates-cell" data-label="Dates">
    <button type="button" class="dates-btn${marks?' has-marks':''}${short?' short':''}"
      onclick="event.stopPropagation();openDatesDialog('${e.id}')" title="${esc(title)}">
      ${icon('calendar')}${esc(label)}${short?' <span aria-hidden="true">⚠</span>':''}
    </button></div>`;
}
function datesDialogHTML(){
  if(!datesDialogFor) return '';
  const p = currentProject(); if(!p) return '';
  const e = entryById(datesDialogFor, p); if(!e) return '';
  const person = crewById(e.crewId) || {};
  const personEntries = entriesForCrew(e.crewId, p);
  const multi = personEntries.length > 1;
  const phases = CREW_PHASES.map(ph=>{
    const elsewhere = personEntries.filter(en=>en.id!==datesDialogFor)
      .map(en=>({role: en.role||'no role', marks: datesPhaseMarks(ph.view, en.id)}))
      .filter(x=>x.marks.length);
    return {
      ph, cls: ph.view==='preprod' ? 'prep' : ph.view==='days' ? 'shoot' : 'post',
      tally: datesPhaseTally(ph.view, datesDialogFor),
      otherN: new Set(elsewhere.flatMap(x=>x.marks)).size,
      otherWho: elsewhere.map(x=>`${x.marks.length} as ${x.role}`).join(' · ')
    };
  });
  const sel = phases.find(x=>x.ph.view===datesDialogPhase) || phases[0];
  const readonly = sel.ph.view==='days';
  const ym = datesDialogMonth || datesAnchorMonth(sel.ph.view, datesDialogFor);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday-first
  const mine = new Set(datesPhaseMarks(sel.ph.view, datesDialogFor));
  const others = [];
  personEntries.forEach(en=>{
    CREW_PHASES.forEach(ph2=>{
      if(en.id===datesDialogFor && ph2.view===sel.ph.view) return;   // that pair IS `mine`
      const set = new Set(datesPhaseMarks(ph2.view, en.id));
      if(!set.size) return;
      others.push({
        cls: ph2.view==='preprod' ? 'prep' : ph2.view==='days' ? 'shoot' : 'post',
        head: ph2.head + (multi ? ' · ' + (en.role || 'no role') : ''),
        set
      });
    });
  });
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="prep-cal-day empty"></span>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hits = others.filter(o=>o.set.has(iso));
    /* ⚠️ ONE DOT PER PHASE, not per matching set. A two-role person on the same shoot day in
       both roles hits twice, and two identical dots under one date says nothing the first one
       didn't. The TITLE still names every role that holds it. */
    const dots = hits.length
      /* `cls` IS the token suffix — prep / shoot / post — so the dot's colour comes straight
         from the same variable the phase circle and the calendar tint use. */
      ? `<span class="dates-others">${[...new Set(hits.map(o=>o.cls))].map(cls=>`<i style="background:var(--phase-${cls})"></i>`).join('')}</span>` : '';
    const holds = [mine.has(iso)?(sel.ph.head + (multi ? ' · ' + (e.role||'no role') : '')):null]
      .concat(hits.map(o=>o.head)).filter(Boolean);
    const title = holds.length ? `${fmtDate(iso)||iso} — ${holds.join(' + ')}` : (fmtDate(iso)||iso);
    cells.push(`<span class="prep-cal-day${mine.has(iso)?' marked':''}" data-iso="${iso}" title="${esc(title)}"
      ${readonly?'':`onmousedown="phaseDayDown('${sel.ph.view}','${datesDialogFor}','${iso}',event)" onmouseenter="phaseDayEnter('${iso}')"`}>${d}${dots}</span>`);
  }
  /* the bracketed figure is ANOTHER ROLE'S — bracketed and italic because it is not yours to
     edit from here, and reads as an aside rather than as a second total */
  const phaseBtn = x => `<button type="button" class="dates-phase ${x.cls}${x.ph.view===sel.ph.view?' on':''}"
      onclick="setDatesDialogPhase('${x.ph.view}')" aria-pressed="${x.ph.view===sel.ph.view?'true':'false'}"
      title="${esc(`${x.tally.marked} marked as ${e.role||'no role'}`)}${x.otherN?esc(` · ${x.otherWho} — switch role above to change those`):''}">
      <span class="dates-dot"></span>
      <span class="dates-phase-lbl">${x.ph.head}</span>
      <span class="dates-phase-n">${x.tally.marked||'—'}${
        x.otherN ? `<span class="dates-phase-other">(${x.otherN})</span>` : ''
      }${x.tally.short?' ⚠':''}</span>
    </button>`;
  const shortHTML = (!readonly && sel.tally.short) ? `<div class="dates-short">
      <span aria-hidden="true">⚠</span>
      <span><strong>${sel.tally.short} of ${sel.tally.booked} booked ${sel.ph.head.toLowerCase()} day${sel.tally.booked===1?'':'s'} not on the calendar yet.</strong>
        Marking more days than booked is fine — five days' work can spread over six — but fewer means a booking with nowhere to sit.</span>
    </div>` : '';
  const countHTML = readonly
    ? `<span class="dates-count">${sel.tally.marked} shoot day${sel.tally.marked===1?'':'s'} — set on the Production tab</span>`
    : `<span class="dates-count">${sel.tally.booked||'No'} day${sel.tally.booked===1?'':'s'} booked · ${sel.tally.marked} marked</span>`;
  return `<div class="modal-overlay" onclick="if(event.target===this) closeDatesDialog()">
    <div class="modal-box dates-box" onclick="event.stopPropagation()">
      <div class="dates-head">
        <div class="dates-name">${esc(person.name||'—')}</div>
        <div class="dates-role">${multi ? `${personEntries.length} roles on this project` : esc(e.showAs||e.role||'')}</div>
      </div>
      ${multi ? `<div class="dates-roles" role="group" aria-label="Which role you are marking">
        ${personEntries.map(en=>`<button type="button" class="dates-role-btn${en.id===datesDialogFor?' on':''}"
            aria-pressed="${en.id===datesDialogFor?'true':'false'}"
            onclick="setDatesDialogEntry('${en.id}')"
            title="${en.id===datesDialogFor?'You are marking dates for this role':'Mark dates for this role instead'}"
          >${esc(en.role||'no role')}</button>`).join('')}
      </div>` : ''}
      <div class="dates-phases">${phases.map(phaseBtn).join('')}</div>
      <div class="prep-cal dates-cal ${sel.cls}${readonly?' readonly':''}">
        <div class="prep-cal-head">
          <span class="prep-cal-nav" onclick="shiftDatesDialogMonth(-1)" title="Previous month">‹</span>
          <span class="prep-cal-title">${PREP_MONTH_NAMES[m-1]} ${y}</span>
          <span class="prep-cal-nav" onclick="shiftDatesDialogMonth(1)" title="Next month">›</span>
          ${(!readonly && mine.size) ? `<span class="prep-cal-clear" onclick="clearPhaseDates('${sel.ph.view}','${datesDialogFor}')">Clear ${esc(sel.ph.head.toLowerCase())}</span>` : ''}
        </div>
        <div class="prep-cal-grid">
          ${PREP_WEEKDAYS.map(w=>`<span class="prep-cal-wd">${w}</span>`).join('')}
          ${cells.join('')}
        </div>
      </div>
      ${shortHTML}
      <div class="dates-foot">
        ${countHTML}
        <button class="small" style="margin-left:auto;" onclick="closeDatesDialog()">Done</button>
      </div>
      <div class="hint" style="margin-top:8px;">${readonly
        ? 'Shoot dates come from the shoot days this person is on — tick those on the Production tab, or from the Shoot column on Roles.'
        : `Click or drag to mark the days. Dots under a date are ${multi?'this person’s other roles and phases':'the other phases'}, so you can see where they overlap.`}${
        multi ? ' You are marking <strong>'+esc(e.role||'no role')+'</strong> — a bracketed <em>(n)</em> above is days held by their other role; use the buttons to switch to it.' : ''}</div>
    </div>
  </div>`;
}
function phaseCalendarHTML(phase, entryId){
  const ym = phaseCalMonth || phaseCalAnchorMonth(phase, entryId);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday-first
  const marked = new Set(phaseDatesOf(phase, entryId));
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="prep-cal-day empty"></span>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push(`<span class="prep-cal-day${marked.has(iso)?' marked':''}" data-iso="${iso}"
      onmousedown="phaseDayDown('${phase}','${entryId}','${iso}',event)" onmouseenter="phaseDayEnter('${iso}')">${d}</span>`);
  }
  return `<div class="prep-cal">
      <div class="prep-cal-head">
        <span class="prep-cal-nav" onclick="shiftPhaseCalMonth(-1)" title="Previous month">‹</span>
        <span class="prep-cal-title">${PREP_MONTH_NAMES[m-1]} ${y}</span>
        <span class="prep-cal-nav" onclick="shiftPhaseCalMonth(1)" title="Next month">›</span>
        ${marked.size ? `<span class="prep-cal-clear" onclick="clearPhaseDates('${phase}','${entryId}')">Clear marks</span>` : ''}
      </div>
      <div class="prep-cal-grid">
        ${PREP_WEEKDAYS.map(w=>`<span class="prep-cal-wd">${w}</span>`).join('')}
        ${cells.join('')}
      </div>
      <div class="hint">${esc(PHASE_TABS[phase].calHint)}</div>
    </div>`;
}

function phaseRowHTML(block, phase){
  const p = currentProject(), shootDays = projectDays();
  const fronted = frontedEntryOfBlock(block, p, shootDays);
  const rest = block.entries.filter(e=>e.id!==fronted.id);
  // an open date-marks calendar belonging to a stacked-away entry has to stay on
  // screen, so the block renders open in that one case — derived from phaseCalendarFor,
  // which already exists; NOT a new piece of open/closed state.
  const open = rest.some(e=>phaseCalOpen(phase, e.id));
  const entryCellsHTML = (e, toggleHTML) => {
    const rate = resolveEntryRate(e.id, p);
    const days = phaseDaysOf(phase, e.id, p);
    const marks = phaseDatesOf(phase, e.id, p);
    const calOpen = phaseCalOpen(phase, e.id);
    return { calOpen, html: `<div class="prep-cell pb-role-cell" data-label="Role" style="grid-column:3;"><span class="roles-inline">${roleBannerHTML(e)}${toggleHTML}</span></div>
      <div class="prep-cell prep-fields" style="grid-column:4;">
        <div class="prep-fields-row">
          ${crewShowMoney?`<span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input" value="${rate.hasRate?rate.rate:''}" placeholder="—"
            title="Day rate — the same rate as the Roles view and Budget"
            onclick="event.stopPropagation()" onchange="saveEntryRate('${e.id}', this.value)"></span>`:''}
          <input type="text" inputmode="numeric" class="budget-rate-input prep-days-input" value="${days!=null?days:''}" placeholder="—"
            title="${esc(PHASE_TABS[phase].daysTitle)}"
            onclick="event.stopPropagation()" onchange="setPhaseDays('${phase}','${e.id}', this.value)">
        </div>
      </div>
      <div class="prep-cell prep-calcell" style="grid-column:5;">
        <button type="button" class="icon-btn prep-cal-btn${marks.length?' has-marks':''}"
          onclick="togglePhaseCalendar('${phase}','${e.id}')"
          title="${marks.length ? `${marks.length} date${marks.length===1?'':'s'} marked` : 'No dates marked'}"
          aria-label="Date marks">${icon('calendar')}</button>
      </div>
      ${calOpen ? `<div class="prep-calwrap">${phaseCalendarHTML(phase, e.id)}</div>` : ''}` };
  };
  const frontedCells = entryCellsHTML(fronted, personBlockToggleHTML(block, rest.length, open));
  const isEditing = editingCrewId===block.id;
  const head = `<div class="prep-grid pb-head${frontedCells.calOpen?' prep-grid-row-open':''}${crewShowMoney?'':' no-money'}">
    <div class="prep-cell prep-controls">${crewControlsHTML(block, {selectCbHTML:personBlockSelectCbHTML(block)})}</div>
    <div class="prep-cell prep-name" data-label="Name" title="${esc(block.name)}">${esc(block.name)}${repeatStarHTML(block.crewId)}</div>
    ${frontedCells.html}
  </div>`;
  const stack = rest.map(e=>{
    const cells = entryCellsHTML(e, '');
    return `<div class="prep-grid pb-role-row pb-role-extra${cells.calOpen?' prep-grid-row-open':''}${crewShowMoney?'':' no-money'}"${open?'':' style="display:none;"'}>${cells.html}</div>`;
  }).join('');
  return personBlockWrapHTML(block, head + stack,
    { editing:isEditing, open, expansionHTML:crewExpansionHTML(block, 'pb-editform') });
}

const LOCATION_FEE_MODES = [
  ['buyout', 'Buyout',  'One agreed fee for the venue, split across the days it is used'],
  ['perday', 'Per day', 'The fee is charged for each day the location is used'],
  ['hourly', 'Hourly',  'The fee is charged per hour, for the hours below, on each day used']
];
const locFeeModeLabel = m => (LOCATION_FEE_MODES.find(x=>x[0]===m)||LOCATION_FEE_MODES[0])[1];
/* ⚠️ HOISTED from inside buildBudgetData, where it was a local called usesLocation. The day
   grid, the cost card and the budget all have to agree about "is this location used that day",
   and they were about to be three copies of one expression. Primary or additional counts. */
const locOnDay = (locId, d) => !!d && (d.locationId===locId
  || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId));
const locDaysUsed = (locId, p) => projectDays(p ? p.id : undefined).filter(d=>locOnDay(locId, d));
function resolveLocationCost(locId, p){
  const proj = p || currentProject() || {};
  const loc = locById(locId) || {};
  const rec = ((proj.locationCosts||{})[locId]) || {};
  const has = hasVal;
  const mode = pickVal(rec.mode, loc.feeMode || 'buyout');
  const rate = hasVal(rec.rate) ? parseRateNumber(rec.rate) : parseRateNumber(loc.fee);
  const hours = hasVal(rec.hours) ? (Number(rec.hours)||0) : (Number(loc.feeHours)||0);
  const extras = (rec.extras||[]).filter(x=>x);
  return {
    mode, rate, hours, extras,
    days: rec.days || {},
    /* the venue's own VAT status, not a person's — see the AO note in buildBudgetData for why
       that distinction is the whole reason locations had no VAT before */
    vat: has(rec.vat) ? rec.vat : (loc.vatRegistered || ''),
    extrasTotal: extras.reduce((sum,x)=>sum + (parseRateNumber(x.amount)||0), 0),
    /* true when THIS PROJECT is saying something different from the venue's own record —
       what the save-to-database icon offers to reconcile */
    isOverride: has(rec.mode) || has(rec.rate) || has(rec.hours) || has(rec.vat)
  };
}
/* one day's figure for a per-day or hourly location: its own override if it has one, the
   standard figure if not. ⚠️ Read through these two and nothing else, or a day's cost on the
   card and the same day's cost in the budget will drift. */
const locDayOverride = (c, dayId, field) => {
  const v = ((c.days||{})[dayId]||{})[field];
  return hasVal(v) ? v : null;
};
function locDayCost(c, d){
  const r = locDayOverride(c, d.id, 'rate');
  const rate = r!=null ? parseRateNumber(r) : c.rate;
  if(c.mode!=='hourly') return rate;
  const h = locDayOverride(c, d.id, 'hours');
  return rate * (h!=null ? (Number(h)||0) : c.hours);
}
/* the FEE for a given set of days, mode by mode. ⚠️ Extras are NOT in here — they are charged
   once, project-wide, and adding them per day would multiply them by the days used. */
function locationFeeFor(locId, dayList, p, allDaysUsed){
  const c = resolveLocationCost(locId, p);
  const {mode, rate} = c;
  const usedDays = (dayList||[]).filter(d=>locOnDay(locId, d));
  /* ⚠️ Phase CP — SUMMED DAY BY DAY, not rate × count, so a day carrying its own rate or its
     own hours is billed at what it actually cost. With no overrides anywhere this returns the
     identical number the multiplication did. */
  if(mode==='perday' || mode==='hourly') return usedDays.reduce((sum,d)=>sum + locDayCost(c, d), 0);
  if(!rate) return 0;
  const usedHere = usedDays.length;
  /* buyout: ONE fee, apportioned across the days it is actually used on, so Per Day can carry
     its share. ⚠️ A location ticked on no day at all still costs its fee — it is booked — and
     is charged project-wide only, which is why the caller passes allDaysUsed. */
  const totalUsed = allDaysUsed!=null ? allDaysUsed : locDaysUsed(locId, p).length;
  if(!totalUsed) return null;                 // caller decides: project-wide charge, or nothing
  return (rate / totalUsed) * usedHere;
}
/* ---- the writers. All project-scoped except saveLocationFeeToDatabase(). ---- */
function locCostRec(locId, p){
  const proj = p || currentProject();
  proj.locationCosts = proj.locationCosts || {};
  proj.locationCosts[locId] = proj.locationCosts[locId] || {};
  return proj.locationCosts[locId];
}
async function setLocationCostField(locId, field, value){
  const rec = locCostRec(locId);
  const v = (value||'').trim();
  const loc = locById(locId) || {};
  const ownValue = field==='mode' ? (loc.feeMode||'buyout')
                 : field==='rate' ? String(loc.fee||'')
                 : field==='vat'  ? String(loc.vatRegistered||'')
                 : String(loc.feeHours||'');
  /* delete rather than storing '' — an absent override is what makes the venue's own record
     show through again, the same contract p.crewRateOverrides has */
  if(v==='' || v===ownValue) delete rec[field]; else rec[field] = v;
  if(!Object.keys(rec).length) delete (currentProject().locationCosts||{})[locId];
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}
async function setLocationDayField(locId, dayId, field, value){
  const rec = locCostRec(locId);
  rec.days = rec.days || {};
  const cell = rec.days[dayId] = rec.days[dayId] || {};
  const v = (value||'').trim();
  if(v==='') delete cell[field]; else cell[field] = v;
  /* an empty cell is not an override — prune it, and the whole table with it, so a location
     that has been fiddled with and put back is byte-identical to one that never was */
  if(!Object.keys(cell).length) delete rec.days[dayId];
  if(!Object.keys(rec.days).length) delete rec.days;
  if(!Object.keys(rec).length) delete (currentProject().locationCosts||{})[locId];
  renderProjectBody();
  saveInBackground('db:projects', projectsDB);
}

/* ⚠️ The one write that leaves this project. Same shape and the same confirmation habit as
   saveCrewRateToDatabase(): pushing a project override down onto the shared record changes
   what every OTHER project sees, so it says so first. */
async function saveLocationFeeToDatabase(locId){
  const loc = locById(locId); if(!loc) return;
  const {mode, rate, hours} = resolveLocationCost(locId);
  if(!confirm(`Save ${locFeeModeLabel(mode).toLowerCase()} ${budgetFmt(rate)}${mode==='hourly'?` × ${hours} hrs`:''} to “${loc.name}” in the Locations database? Every project using this location will pick it up.`)) return;
  loc.feeMode = mode;
  loc.fee = String(rate||'');
  loc.feeHours = mode==='hourly' ? String(hours||'') : (loc.feeHours||'');
  loc.vatRegistered = resolveLocationCost(locId).vat || '';
  /* the override has become the record, so drop it — otherwise the row keeps claiming to
     differ from a database it now matches */
  const rec = locCostRec(locId);
  delete rec.mode; delete rec.rate; delete rec.hours; delete rec.vat;
  await saveDB('db:locations', locationsDB);
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}
function locCostPanelHTML(l, days){
  const p = currentProject();
  const c = resolveLocationCost(l.id, p);
  const used = locDaysUsed(l.id, p).length;
  const rec = ((p.locationCosts||{})[l.id]) || {};
  const fee = locationFeeFor(l.id, days, p, used);
  const feeTotal = fee===null ? c.rate : fee;
  /* said in words, because "£4,200" against a venue tells you nothing about whether it is
     going to move when you tick another day */
  const basis = !c.rate ? 'No fee set'
    : c.mode==='perday' ? `${budgetFmt(c.rate)} × ${used} day${used===1?'':'s'}`
    : c.mode==='hourly' ? `${budgetFmt(c.rate)} × ${c.hours||0} hr${c.hours===1?'':'s'} × ${used} day${used===1?'':'s'}`
    : used ? `${budgetFmt(c.rate)} split across ${used} day${used===1?'':'s'}`
    : `${budgetFmt(c.rate)} — not ticked on any day yet, so charged once`;
  const usedDays = locDaysUsed(l.id, p);
  const dayRows = (c.mode==='buyout' || !usedDays.length) ? '' : `<div class="loc-days">
      <div class="loc-day-head" style="--locday-cols:${c.mode==='hourly'?2:1};"><span></span>${c.mode==='hourly'?'<span>Hours</span>':''}<span>Rate</span><span>Cost</span></div>
      ${usedDays.map(d=>`<div class="loc-day-row" style="--locday-cols:${c.mode==='hourly'?2:1};">
        <span class="loc-day-num" title="${esc(fmtDate(d.date)||'date not set')}">D${esc(d.dayNum||'?')}</span>
        ${c.mode==='hourly'?`<input type="text" inputmode="decimal" class="budget-rate-input" placeholder="${esc(String(c.hours||0))}"

const VAT_RATE = 0.20;

/* Best-effort numeric extraction from the crew database's free-text Fee/rate
   field ("£450/day" -> 450). Returns null when nothing numeric is found,
   which the caller treats as "no rate on file", not as a rate of zero. */
function parseRateNumber(str){
  if(!str) return null;
  const m = String(str).replace(/,/g,'').match(/[\d]+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

const roleRateFor = (c, rolePath) => (rolePath && c && c.roleRates && c.roleRates[rolePath]) || null;
/* an ENTRY stores department and role separately; c.roles/c.roleRates key on the joined
   path, so this is the one place the two shapes are reconciled */
const entryRolePath = e => (e && e.department && e.role) ? `${e.department}/${e.role}` : '';
/* floored at 0, so a kit charge larger than the day rate reads as "all kit" rather than
   as a negative operator fee */
const labourOf = (rate, kit) => Math.max(0, (Number(rate)||0) - (Number(kit)||0));
function resolveEntryRate(entryId, p){
  const e = entryById(entryId, p || currentProject());
  const c = e ? crewById(e.crewId) : null;
  const rr = roleRateFor(c, entryRolePath(e));
  const kit = (rr && rr.kit!=null && !isNaN(Number(rr.kit))) ? Number(rr.kit) : null;
  if(e && Object.prototype.hasOwnProperty.call(e, 'rate')){
    const n = Number(e.rate);
    if(!isNaN(n)) return { rate:n, hasRate:true, isOverride:true, kit };
  }
  if(rr && rr.rate!=null && rr.rate!=='' && !isNaN(Number(rr.rate))){
    return { rate:Number(rr.rate), hasRate:true, isOverride:false, kit };
  }
  const parsed = parseRateNumber(c && c.rate);
  if(parsed!=null) return { rate:parsed, hasRate:true, isOverride:false, kit };
  return { rate:0, hasRate:false, isOverride:false, kit:null };
}
async function saveEntryRate(entryId, rawValue){
  const p = currentProject(); if(!p) return;
  const e = entryById(entryId, p); if(!e) return;
  const trimmed = (rawValue||'').trim();
  if(trimmed===''){
    delete e.rate;                                  // clearing reverts to the database rate
  } else {
    const n = Number(trimmed);
    if(isNaN(n) || n < 0){ renderProjectBody(); return; }  // reject garbage and negatives, revert the field to the last valid value
    e.rate = n;
  }
  await saveDB('db:projects', projectsDB);
  renderProjectBody();
}

async function saveCrewRateToDatabase(entryId, context){
  const targets = selectedEditTargets(entryId);
  if(targets.length>1 && !confirm('This will change all these entries in the database — is that ok?')) return;
  const p = currentProject();
  // Phase BF — targets are ENTRY ids; the write lands on the PERSON each one points at.
  // Two entries for one person resolve to one crew record, so the last one wins — which
  // is the honest outcome for a field the database only has one of.
  targets.forEach(id=>{
    const e = entryById(id, p); if(!e) return;
    const c = crewById(e.crewId); if(!c) return;
    const { rate, hasRate } = resolveEntryRate(id, p);
    if(hasRate) c.rate = `£${rate}/day`;
  });
  flashSaveResult(`crsStatus-${context}-${entryId}`, await saveDB('db:crew', crewDB), 'Saved to database');
}

const _lazyScripts = {};
function loadScriptOnce(src, integrity){
  if(_lazyScripts[src]) return _lazyScripts[src];
  _lazyScripts[src] = new Promise((resolve, reject)=>{
    const el = document.createElement('script');
    el.src = src; el.integrity = integrity; el.crossOrigin = 'anonymous';
    el.onload = resolve;
    el.onerror = () => { delete _lazyScripts[src]; reject(new Error('failed to load '+src)); };
    document.head.appendChild(el);
  });
  return _lazyScripts[src];
}

function budgetDayFilterCount(){ return budgetSelectedDays().length; }
function budgetFilteredDays(){
  const kept = budgetSelectedDays();
  return kept.length ? kept : projectDays();
}
let budgetSort = 'dept';
function setBudgetSort(v){ budgetSort = v; renderProjectBody(); }
function clearBudgetFilter(){
  budgetDayFilter.clear();
  /* ⚠️ Clears the SHARED crew filter too, because that is what is scoping the money now.
     Sort and Group by are display choices, not scope, and are deliberately left alone. */
  projectCrewFilter.depts.clear(); projectCrewFilter.roles.clear();
  projectCrewFilter.company = ''; projectCrewFilter.excludeTalent = false;
  projectCrewFilter.excludeOtherCompanies = false; projectCrewFilter.inverse = false;
  renderProjectBody();
}
/* counts the SHARED crew scope, not a budget-local one — so the Filter chip shows a
   number when the Crew tab is the thing narrowing the money */
function budgetActiveFilterCount(){
  return budgetDayFilterCount() + projectCrewFilter.depts.size
       + (projectCrewFilter.excludeTalent?1:0) + (projectCrewFilter.excludeOtherCompanies?1:0)
       + projectCrewFilter.roles.size + (projectCrewFilter.company?1:0) + (projectCrewFilter.inverse?1:0);
}
function budgetScopeParts(){
  const allDays = projectDays();
  const n = budgetDayFilterCount();
  return n ? [`${n} of ${allDays.length} day${allDays.length===1?'':'s'}`] : [];
}

function budgetFilterPanelHTML(){
  const all = projectDays();
  const p = currentProject();
  const f = projectCrewFilter;   // ⚠️ dept/exclude boxes write the SHARED crew filter, deliberately
  const opt = (v, label, cur) => ({v, label, selected: cur===v});
  const present = DEPARTMENTS.filter(d=>projectEntryViews(p).some(c=>deptBucketKey(c.department)===d));
  const dn = f.depts.size;
  const scope = budgetScopeParts();
  if(dn) scope.push(`${dn} department${dn>1?'s':''}`);
  return filterPanelHTML({
    selects: [
      { label:'Sort (Per Person)', id:'budgetSortPick', onchange:'setBudgetSort(this.value)', options: [
        opt('dept','By department (HoD first)',budgetSort), opt('name','By name',budgetSort),
        opt('cost','By cost (highest first)',budgetSort), opt('rate','By day rate (highest first)',budgetSort),
        opt('days','By days worked (most first)',budgetSort), opt('noRate','Missing a day rate first',budgetSort) ] },
    ],
    sections: [
      { title:'Shoot days', body: filterChipsHTML(all.map(d=>({checked:budgetDayFilter.has(d.id), onchange:`toggleBudgetFilterDay('${d.id}', this.checked)`, label:`Day ${esc(d.dayNum||'?')}`})), 'No shoot days yet.') },
      { title:'Departments <span style="opacity:.7;">— shared with the Crew tab\'s filter</span>',
        body: filterChipsHTML(present.map(d=>({checked:f.depts.has(d), onchange:`toggleProjectFilterDept('${d}', this.checked); renderProjectBody();`, label:esc(d)})), 'No crew on this project yet.') },
    ],
    foot: {
      controls: `<label><input type="checkbox" ${f.excludeTalent?'checked':''} onchange="projectCrewFilter.excludeTalent=this.checked; renderProjectBody();"> Exclude Talent</label>
      <label><input type="checkbox" ${f.excludeOtherCompanies?'checked':''} onchange="projectCrewFilter.excludeOtherCompanies=this.checked; renderProjectBody();"> Exclude other companies</label>`,
      hint: scope.length ? `Costing ${scope.join(' · ')} — every figure below is for those only.`
                         : 'Whole project. Tick any day or department to narrow it.',
      active: budgetActiveFilterCount()>0,
      onClear: 'clearBudgetFilter()'
    }
  });
}

function buildBudgetData(){
  const p = currentProject();
  const days = budgetFilteredDays();
  /* Phase BF — one row per ENTRY, because day rate and days worked are both entry-level
     now. Travel is NOT: see travelRateFor/firstEntryOnDay below. */
  const crew = projectEntryViews(p);
  const hotelCosts = getHotelCosts(p);

  const travelCosts = getTransportCosts(p);
  const travelMethods = p.travelMethods || {};
  const travelRateFor = id => {
    const m = travelMethods[id];
    if(m==='Own car') return travelCosts.mileage;
    if(m==='Public transport') return travelCosts.publicPerDay;
    return 0;   // Train / Flying / Production transport / custom: counted, never costed
  };

  const crewInScope = crew.filter(personMatchesProjectFilter);
  const costedCrewIds = new Set(crewInScope.map(c=>c.crewId));
  const personInScope = id => costedCrewIds.has(id);
  const prodOn = budgetScope.production ? 1 : 0;
  const prepOn = budgetScope.preproduction ? 1 : 0;
  const postOn = budgetScope.post ? 1 : 0;
  const travelClaimed = new Set();
  /* the same once-per-person rule travelClaimed enforces, for the two other person-level
     costs (a bed and a lunch belong to a human, not to each role they are booked as) */
  const personCostClaimed = new Set();
  const cateringCosts = getCateringCosts(p);
  const people = crewInScope.map(c=>{
    const {rate, hasRate, isOverride, kit} = resolveEntryRate(c.id, p);
    const onShoot = entryOnShoot(c.id, p);
    const daysWorked = onShoot ? entryDayCount(c.id, days) : 0;
    const prepDays = entryInPhase('preproduction', c.id, p) ? (prepDaysOf(c.id, p) || 0) : 0;
    const postDays = entryInPhase('post', c.id, p) ? (postDaysOf(c.id, p) || 0) : 0;
    const ent = entryById(c.id, p);
    const isBuyout = !!(ent && ent.buyout);
    const totalPhaseDays = daysWorked + prepDays + postDays;
    const share = n => totalPhaseDays ? rate * (n / totalPhaseDays) : 0;
    const otUnits = entryOvertime(c.id, p) || 0;
    const otRaw = (!isBuyout && daysWorked > 0) ? rate * otUnits : 0;
    const prodRaw = (isBuyout ? (totalPhaseDays ? share(daysWorked) : rate) : rate * daysWorked) + otRaw;
    const prepRaw = isBuyout ? share(prepDays) : rate * prepDays;
    const postRaw = isBuyout ? share(postDays) : rate * postDays;
    const prodSubtotal = prodRaw * prodOn;
    const prepSubtotal = prepRaw * prepOn;
    const postSubtotal = postRaw * postOn;
    const subtotal = prodSubtotal + prepSubtotal + postSubtotal;
    const claimsPerson = crewOnShoot(c.crewId, p) && !personCostClaimed.has(c.crewId);
    if(claimsPerson) personCostClaimed.add(c.crewId);
    const hotelNights = claimsPerson
      ? ((p.hotelNightBefore||[]).includes(c.crewId) ? 1 : 0)
        + days.filter(d=>(d.hotelNights||[]).includes(c.crewId)).length
      : 0;
    const hotelCost = hotelNights * hotelCosts.perRoomNight * prodOn;
    const mealCost = claimsPerson ? days.reduce((sum,d)=>{
      const m = (d.cateringMeals||{})[c.crewId];
      if(!m) return sum;
      return sum + (m.b?cateringCosts.b:0) + (m.l?cateringCosts.l:0) + (m.d?cateringCosts.d:0);
    }, 0) * prodOn : 0;
    const paidDays = daysWorked*prodOn + prepDays*prepOn + postDays*postOn;
    /* ⚠️ A buyout's kit is a share of the FEE, not kit × days — the same reasoning as the
       phase split above. Proportion the kit the same way the rate was agreed. */
    const kitSubtotal = kit==null ? null
      : isBuyout ? (rate ? subtotal * (Math.min(kit, rate) / rate) : 0)
                 : Math.min(kit, rate) * paidDays;
    const labourSubtotal = kit!=null ? subtotal - kitSubtotal : null;
    const claimsTravel = crewOnShoot(c.crewId, p) && !travelClaimed.has(c.crewId);
    if(claimsTravel) travelClaimed.add(c.crewId);
    const travelRateRaw = claimsTravel ? travelRateFor(c.crewId) : 0;
    const travelCostRaw = travelRateRaw * crewDayCount(c.crewId, days, p);
    const travelRate = travelRateRaw * prodOn;
    const travelCost = travelRate * crewDayCount(c.crewId, days, p);
    const vatRegistered = c.vatRegistered==='Yes';
    const prodVat = vatRegistered ? (prodSubtotal + travelCost) * VAT_RATE : 0;
    const prepVat = vatRegistered ? prepSubtotal * VAT_RATE : 0;
    const postVat = vatRegistered ? postSubtotal * VAT_RATE : 0;
    const vat = prodVat + prepVat + postVat;
    return {
      id:c.id, crewId:c.crewId, name:c.name, role:c.showAs||c.role, department:deptBucketKey(c.department),
      rate, hasRate, isOverride, kit, kitSubtotal, labourSubtotal,
      hotelCost, mealCost, estCosts: hotelCost + mealCost + travelCost,
      isBuyout, prodRaw, prepRaw, postRaw, travelCostRaw,
      otUnits, otRaw, otSubtotal: otRaw * prodOn,
      prodVatRaw: vatRegistered ? (prodRaw + travelCostRaw) * VAT_RATE : 0,
      prepVatRaw: vatRegistered ? prepRaw * VAT_RATE : 0,
      postVatRaw: vatRegistered ? postRaw * VAT_RATE : 0,
      daysWorked, prepDays, postDays,
      subtotal, prodSubtotal, prepSubtotal, postSubtotal,
      travelRate, travelCost, vatRegistered, vat, prodVat, prepVat, postVat,
      display: budgetPersonDisplay(subtotal, vat)
    };
  });

  const deptTotals = {}, deptCounts = {}, deptExVat = {}, deptVat = {};
  people.forEach(pp=>{
    deptTotals[pp.department] = (deptTotals[pp.department]||0) + pp.display;
    deptCounts[pp.department] = (deptCounts[pp.department]||0) + 1;
    deptExVat[pp.department] = (deptExVat[pp.department]||0) + pp.subtotal;
    deptVat[pp.department]   = (deptVat[pp.department]||0) + pp.vat;
  });
  const departments = DEPARTMENTS.filter(d=>deptCounts[d]).map(d=>
    ({dept:d, code:DEPARTMENT_CODES[d]||'', total:deptTotals[d]||0,
      exVat:deptExVat[d]||0, vat:deptVat[d]||0, incVat:(deptExVat[d]||0)+(deptVat[d]||0)}));

  const buildPhaseSlice = ({label, noteName, dayNoun, subKey, vatKey, daysKey, on}) => {
    const ex = {}, vt = {}, counts = {};
    people.forEach(pp=>{
      if(!pp[subKey] && !pp[daysKey]) return;
      ex[pp.department]     = (ex[pp.department]||0) + pp[subKey];
      vt[pp.department]     = (vt[pp.department]||0) + pp[vatKey];
      counts[pp.department] = (counts[pp.department]||0) + 1;
    });
    const exVat = people.reduce((s,pp)=>s+pp[subKey], 0);
    const vat   = people.reduce((s,pp)=>s+pp[vatKey], 0);
    return {
      // label — the block heading and the export row. noteName — how the phase is named
      // mid-sentence in a hint. dayNoun — how its days are named. All three so the prose
      // reads as English rather than as a label dropped into a template.
      label, noteName, dayNoun, on: !!on,
      departments: DEPARTMENTS.filter(d=>counts[d]).map(d=>
        ({dept:d, code:DEPARTMENT_CODES[d]||'', exVat:ex[d]||0, vat:vt[d]||0,
          incVat:(ex[d]||0)+(vt[d]||0), total: budgetPersonDisplay(ex[d]||0, vt[d]||0)})),
      exVat, vat, incVat: exVat + vat,
      daysTotal: people.reduce((s,pp)=>s+(pp[daysKey]||0), 0),
      peopleCount: people.filter(pp=>pp[daysKey]>0).length
    };
  };
  const prep = buildPhaseSlice({label:'Pre-production', noteName:'pre-production', dayNoun:'Prep days',
    subKey:'prepSubtotal', vatKey:'prepVat', daysKey:'prepDays', on:prepOn});
  const post = buildPhaseSlice({label:'Post', noteName:'the edit', dayNoun:'Edit days',
    subKey:'postSubtotal', vatKey:'postVat', daysKey:'postDays', on:postOn});

  const usesLocation = (d, locId) => d.locationId===locId
    || (d.additionalLocationIds||[]).some(pair=>pair[0]===locId);
  const locationFeeForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    if(!locById(locId)) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    /* null means a booked location ticked on no day at all — its fee is real but belongs to no
       day, so it is charged once, project-wide only, exactly as it always was */
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate : 0);
    return sum + fee;
  }, 0);
  /* one labelled charge at a time — cleaning, an overrun, a breakage — summed once for the
     project. Deliberately outside the per-day arithmetic above. */
  const locationExtrasTotal = (p.locationIds||[])
    .reduce((sum, locId)=> sum + resolveLocationCost(locId, p).extrasTotal, 0);
  const locVatRate = locId => resolveLocationCost(locId, p).vat==='Yes' ? VAT_RATE : 0;
  const locationVatForDays = dayList => (p.locationIds||[]).reduce((sum, locId)=>{
    const r = locVatRate(locId); if(!r) return sum;
    const totalDaysUsed = projectDays().filter(d=>usesLocation(d, locId)).length;
    const fee = locationFeeFor(locId, dayList, p, totalDaysUsed);
    if(fee===null) return sum + (dayList===days ? resolveLocationCost(locId, p).rate * r : 0);
    return sum + fee * r;
  }, 0);
  const locationExtrasVat = (p.locationIds||[]).reduce((sum, locId)=>
    sum + resolveLocationCost(locId, p).extrasTotal * locVatRate(locId), 0);
  // Phase BS — every extra below belongs to the shoot, so they all follow prodOn.
  const locationRaw = locationFeeForDays(days) + locationExtrasTotal;
  const locationTotal = locationRaw * prodOn;
  /* follows prodOn exactly as the fee it is charged on does */
  const locationVatTotal = (locationVatForDays(days) + locationExtrasVat) * prodOn;

  const cateringGrid = buildCateringSummaryGrid(personInScope);
  const transportSummary = buildTransportSummary(personInScope);
  const dayIdsInScope = new Set(days.map(d=>d.id));
  const sumDailyCost = g => g ? g.cols.filter(c=>dayIdsInScope.has(c.dayId))
                                      .reduce((s,c)=>s+c.dailyCost, 0) : 0;
  const cateringRaw = sumDailyCost(cateringGrid);
  const travelRaw = sumDailyCost(transportSummary);
  const cateringTotal = cateringRaw * prodOn;
  const travelTotal = travelRaw * prodOn;
  const firstProjectDay = projectDays()[0];
  const preNightRooms = (firstProjectDay && days.some(d=>d.id===firstProjectDay.id))
    ? (p.hotelNightBefore||[]).filter(id=>crewOnShoot(id, p) && personInScope(id)).length : 0;
  const onShootRooms = list => (list||[]).filter(id=>crewOnShoot(id, p) && personInScope(id)).length;
  const dayHotelRooms = days.map(d=>onShootRooms(d.hotelNights));
  const hotelRaw = (preNightRooms + dayHotelRooms.reduce((s,n)=>s+n,0)) * hotelCosts.perRoomNight;
  const hotelTotal = hotelRaw * prodOn;

  /* IDEAS DEMO — Vendors + Additional costs join the extras. A catering vendor
     that follows the Catering tab REPLACES the separate Catering line (its cost
     is inside the Vendors line), or the same lunches would be counted twice.
     Neither carries VAT yet — a demo simplification to flag in feedback. */
  const vendorBookings = projectVendorCosts(p);
  const cateringViaVendor = vendorBookings.some(vc=>vc.useCateringEstimate);
  const vendorsRaw = vendorBookings.reduce((s,vc)=> s + vendorCostEff(vc, cateringRaw).eff, 0);
  const vendorsTotal = vendorsRaw * prodOn;
  const cateringCounted = cateringViaVendor ? 0 : cateringTotal;
  const additionalRaw = (p.additionalCosts||[]).reduce((s,c)=> s + (parseRateNumber(c.amount)||0), 0);
  const additionalTotal = additionalRaw * prodOn;

  const crewTotalExVat = people.reduce((s,pp)=>s+pp.subtotal, 0);
  /* ⚠️ locationVatTotal is the ONE non-person VAT in here (Phase CP) — see its note above. It
     has to be in this sum or `ex + vat === inc` stops holding the moment a venue charges VAT. */
  const vatTotal = people.reduce((s,pp)=>s+pp.vat, 0) + locationVatTotal;
  const extrasTotal = cateringCounted + travelTotal + hotelTotal + locationTotal + vendorsTotal + additionalTotal;
  const totalExVat = crewTotalExVat + extrasTotal;
  const totalIncVat = totalExVat + vatTotal;

  const perDay = days.map((d,i)=>{
    const onDayIds = new Set((d.positions||[]).map(pos=>pos[0]));
    const dayPeople = people.filter(pp=>onDayIds.has(pp.id));
    /* Phase BF — a person on this day via two entries must carry their travel (and its
       VAT) ONCE. The first of their entries on this day claims it; the rest score zero.
       That is what keeps the per-day VAT column summing back to the per-person one. */
    const travelClaimedToday = new Set();
    const dayTravelRate = pp => {
      if(travelClaimedToday.has(pp.crewId)) return 0;
      travelClaimedToday.add(pp.crewId);
      return travelRateFor(pp.crewId) * prodOn;
    };
    const dayDeptTotals = {}, dayDeptCounts = {}, dayDeptExVat = {}, dayDeptVat = {};
    dayPeople.forEach(pp=>{
      const perDayShare = pp.daysWorked ? pp.prodRaw / pp.daysWorked : 0;
      const dayRate = perDayShare * prodOn;
      const dayVat = pp.vatRegistered ? (dayRate + dayTravelRate(pp))*VAT_RATE : 0;
      dayDeptTotals[pp.department] = (dayDeptTotals[pp.department]||0) + budgetPersonDisplay(dayRate, dayVat);
      dayDeptCounts[pp.department] = (dayDeptCounts[pp.department]||0) + 1;
      dayDeptExVat[pp.department] = (dayDeptExVat[pp.department]||0) + dayRate;
      dayDeptVat[pp.department]   = (dayDeptVat[pp.department]||0) + dayVat;
    });
    const dayDepartments = DEPARTMENTS.filter(dd=>dayDeptCounts[dd]).map(dd=>
      ({dept:dd, code:DEPARTMENT_CODES[dd]||'', total:dayDeptTotals[dd]||0,
        exVat:dayDeptExVat[dd]||0, vat:dayDeptVat[dd]||0, incVat:(dayDeptExVat[dd]||0)+(dayDeptVat[dd]||0)}));
    const cateringCol = cateringGrid ? cateringGrid.cols.find(c=>c.dayId===d.id) : null;
    const travelCol = transportSummary ? transportSummary.cols.find(c=>c.dayId===d.id) : null;
    // Phase BS — each of these is the per-day half of a project-wide extra that
    // already follows prodOn above; gate them here too or Per Day keeps showing
    // catering/travel/hotel/location after Production has been switched off.
    const dayCatering = (cateringCol ? cateringCol.dailyCost : 0) * prodOn;
    const dayTravel = (travelCol ? travelCol.dailyCost : 0) * prodOn;
    // the night before Day 1 has no shoot-day row of its own — folds into Day 1
    const rooms = dayHotelRooms[i] + (i===0 ? preNightRooms : 0);
    const dayHotel = rooms * hotelCosts.perRoomNight * prodOn;
    const dayLocation = locationFeeForDays([d]) * prodOn;
    const crewDisplay = dayDepartments.reduce((s,dd)=>s+dd.total, 0);
    const loc = d.locationId ? locById(d.locationId) : null;
    // AO — the day's own ex-VAT / VAT / inc-VAT, same shape as the project-wide
    // figures so Per Day's expanded table can use the identical itemized columns.
    const dayExVat = dayDepartments.reduce((s,dd)=>s+dd.exVat, 0)
                     + dayCatering + dayTravel + dayHotel + dayLocation;
    /* ⚠️ the day's share of the venue's VAT rides with the day's share of its fee, so Per Day's
       VAT column still sums back to the project's. The EXTRAS' VAT does not appear here for the
       same reason the extras themselves do not — they belong to no day. */
    const dayVatTotal = dayDepartments.reduce((s,dd)=>s+dd.vat, 0) + locationVatForDays([d]) * prodOn;
    return {
      dayId:d.id, dayNum:d.dayNum, locationLabel: loc ? loc.name : '',
      departments:dayDepartments, catering:dayCatering, travel:dayTravel, hotel:dayHotel,
      location:dayLocation,
      exVat: dayExVat, vat: dayVatTotal, incVat: dayExVat + dayVatTotal,
      total: crewDisplay + dayCatering + dayTravel + dayHotel + dayLocation
    };
  });

  return {
    people, departments, cateringTotal, travelTotal, hotelTotal, locationTotal, locationVatTotal, extrasTotal,
    vendorsTotal, additionalTotal, cateringViaVendor, cateringCounted,
    crewTotalExVat, vatTotal, totalExVat, totalIncVat, perDay,
    byEntry: people.reduce((m,pp)=>{ m[pp.id] = pp; return m; }, {}),
    prep, post, phases:[prep, post],
    phaseRaw: (()=>{
      const daysKeyFor = {preproduction:'prepDays', production:'daysWorked', post:'postDays'};
      const countsFor = scope => {
        const members = people.filter(pp=>entryInPhase(scope, pp.id, p));
        return { peopleCount: new Set(members.map(pp=>pp.crewId)).size,
                 daysTotal: people.reduce((n,pp)=>n+(pp[daysKeyFor[scope]]||0), 0) };
      };
      return {
        preproduction: Object.assign({ ex: people.reduce((n,pp)=>n+pp.prepRaw,0), vat: people.reduce((n,pp)=>n+pp.prepVatRaw,0) }, countsFor('preproduction')),
        post:          Object.assign({ ex: people.reduce((n,pp)=>n+pp.postRaw,0), vat: people.reduce((n,pp)=>n+pp.postVatRaw,0) }, countsFor('post')),
        production:    Object.assign({ ex: people.reduce((n,pp)=>n+pp.prodRaw,0) + cateringRaw + travelRaw + hotelRaw + locationRaw,
                                       crewEx: people.reduce((n,pp)=>n+pp.prodRaw,0),
                                       vat: people.reduce((n,pp)=>n+pp.prodVatRaw,0) }, countsFor('production')),
      };
    })(),
    prepOn: !!prepOn, prodOn: !!prodOn, postOn: !!postOn,
    hasCrew: crewInScope.length>0, hasDays: days.length>0
  };
}

function budgetSummaryBarHTML(data, o){
  o = Object.assign({showTotals:true, showStage:true, showMoneyToggle:false, crewOnly:false}, o||{});
  /* the four figures the headline and the stack read, switched in ONE place */
  const totalEx  = o.crewOnly ? data.crewTotalExVat : data.totalExVat;
  const totalVat = o.crewOnly ? data.people.reduce((s,pp)=>s+pp.vat, 0) : data.vatTotal;
  const totalInc = totalEx + totalVat;
  const fmt = budgetFmt;
  const stats = [[o.crewOnly ? 'Crew total' : 'Total',
    budgetVatToggle ? totalInc : totalEx,
    budgetVatToggle ? (totalVat>0 ? `inc. ${fmt(totalVat)} VAT` : '') : 'ex-VAT',
    budgetVatToggle ? `xVAT ${fmt(totalEx)}` : '']];
  const phaseFigures = key => {
    const r = (data.phaseRaw||{})[key] || {ex:0, vat:0};
    /* crewEx exists on production only — the other two are crew fee already */
    const ex = (o.crewOnly && r.crewEx!=null) ? r.crewEx : (r.ex||0);
    return {ex, vat:r.vat||0, inc:ex+(r.vat||0)};
  };
  const scopeMeta = key => {
    const r = (data.phaseRaw||{})[key] || {};
    const n = r.peopleCount||0, d = r.daysTotal||0;
    return `${n} ${n===1?'person':'people'} · ${d} ${d===1?'day':'days'}`;
  };
  const scopeRow = ([key, label]) => `<div class="budget-scope-row${budgetVatToggle&&o.showTotals?' itemized':''}${budgetScope[key]?'':' off'}"
      role="button" tabindex="0" aria-pressed="${budgetScope[key]?'true':'false'}"
      onclick="toggleBudgetScope('${key}', !budgetScope['${key}'])"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleBudgetScope('${key}', !budgetScope['${key}']);}"
      title="${budgetScope[key]?'Costed — click to leave it out':'Not costed — click to include it'}">
      <span class="budget-scope-name">${esc(label)}</span>
      ${o.showTotals ? (()=>{ const f = phaseFigures(key); return budgetVatToggle ? `
        <span class="budget-scope-ex">${fmt(f.ex)}</span>
        <span class="budget-scope-vat">${f.vat ? fmt(f.vat) : '—'}</span>
        <span class="budget-scope-amt">${fmt(f.inc)}</span>`
        : `<span class="budget-scope-amt">${fmt(f.ex)}</span>`; })()
        : `<span class="budget-scope-count">${esc(scopeMeta(key))}</span>`}
    </div>`;
  const nothingOn = BUDGET_SCOPES.every(([k])=>!budgetScope[k]);
  const totalsHTML = o.showTotals
    ? stats.map(([lbl,v,note,sub])=>`<div class="budget-stat"><div class="num">${fmt(v)}</div><div class="lbl">${esc(lbl)}${note?`<span class="budget-stat-note">${esc(note)}</span>`:''}</div>${sub?`<div class="budget-stat-sub">${esc(sub)}</div>`:''}</div>`).join('')

      aria-pressed="${on?'true':'false'}" onclick="${call}" title="${esc(title)}">${label}</button>`;
  /* ⚠️ REMOVED in Phase CF: `modeHTML` and the `.bnr-modes` STAGE | DAYS picker. Roles has
     one shape now — see the note where ROLES_MODES used to live. */
  const moneyHTML = o.showMoneyToggle
    ? toolBtn(crewShowMoney, 'Budget', 'toggleCrewMoney()',

    : '';
  /* Itemize VAT / Split kit / Costs PP are meaningless with the money hidden, so on Roles
     with Budget off they go rather than sitting there doing nothing to a blank column. */
  const showMoneyTools = !o.showMoneyToggle || crewShowMoney;
  const moneyToolsHTML = showMoneyTools ? [
      toolBtn(budgetVatToggle, budgetVatToggle ? 'VAT' : 'xVAT', `toggleBudgetVat(${!budgetVatToggle})`,
        budgetVatToggle ? 'Hide the VAT breakdown' : 'Break out xVAT and VAT on the totals, the phases and every row'),
      toolBtn(budgetSplitKit, 'Split kit &amp; labour', `toggleBudgetSplitKit(${!budgetSplitKit})`,
        'Break each rate into its equipment and labour halves'),
      toolBtn(budgetCostsPP, 'Costs PP', `toggleBudgetCostsPP(${!budgetCostsPP})`,
        "Show what each person costs besides their fee — their hotel, travel and meals")
    ].join('') : '';
  return `<div class="phase-banner">
    <div class="bnr-totals">${o.showTotals||o.showStage ? totalsHTML : ''}</div>
    <div class="budget-scope-stack">${o.showStage ? `${o.showTotals ? `<div class="budget-scope-row${budgetVatToggle?' itemized':''} budget-scope-head" aria-hidden="true">
        <span class="budget-scope-name"></span>${budgetVatToggle ? `<span class="budget-scope-ex">xVAT</span>
        <span class="budget-scope-vat">VAT</span>` : ''}<span class="budget-scope-amt">Total</span>
      </div>` : ''}${BUDGET_SCOPES.map(scopeRow).join('')}` : ''}</div>
    <div class="bnr-tools">
      <div class="bnr-toolrow">${moneyToolsHTML}${moneyHTML}</div>
    </div>
    ${o.showStage && nothingOn ? `<div class="bnr-scope-note hint">Every phase is off, so nothing is being costed and only crew in no phase at all are listed. Click Pre-production, Production or Post — or all three.</div>` : ''}
  </div>`;
}

/* IDEAS DEMO — the BBC view: the same money re-cut into a BBC-style cost
   structure. ⚠️ THE MAPPING IS A FIRST DRAFT for feedback, not a claim about how
   you'd fill in a real BBC form — every rule below is changeable:
   producers/directors split out of Production by role name; kit fees are NOT split
   out of day rates yet; vendors land by their type; VAT column reuses the app's
   per-person VAT. Same grand total as every other view, re-grouped. */
const BBC_STRUCTURE = [
  { code:'2',  name:'Producer & Director',        kind:'people', test: pp => /producer|director/i.test(pp.role||'') },
  { code:'3',  name:'Artists & Contributors',     kind:'people', test: pp => deptBucketKey(pp.department)==='Talent' },
  { code:'4',  name:'Production Unit',            kind:'people', test: pp => ['Production','Client'].includes(deptBucketKey(pp.department)) },
  { code:'5',  name:'Technical Crew',             kind:'people', test: pp => ['Cinematography','Audio','Grip','Set','Vanities','Other'].includes(deptBucketKey(pp.department)) },
  { code:'6',  name:'Equipment & Facilities',     kind:'people', test: pp => deptBucketKey(pp.department)==='Equipment', vendorType:'Equipment' },
  { code:'7',  name:'Locations & Studios',        kind:'extra',  amount: d => d.locationTotal, vat: d => d.locationVatTotal },
  { code:'8',  name:'Travel & Transport',         kind:'extra',  amount: d => d.travelTotal, vendorType:'Transport' },
  { code:'9',  name:'Accommodation & Catering',   kind:'extra',  amount: d => d.hotelTotal + d.cateringCounted, vendorType:'Catering' },
  { code:'10', name:'Post Production',            kind:'people', test: pp => deptBucketKey(pp.department)==='Post Production', vendorType:'Post' },
  { code:'13', name:'Sundries & Other',           kind:'extra',  amount: d => d.additionalTotal, vendorType:'Other' },
];
function budgetBBCViewHTML(data){
  const fmt = budgetFmt;
  const p = currentProject();
  const cateringEst = (buildCateringSummaryGrid()||{}).totalCost || 0;
  const vendorEffByType = {};
  projectVendorCosts(p).forEach(vc=>{
    const v = vendorById(vc.vendorId) || {type:'Other'};
    vendorEffByType[v.type] = (vendorEffByType[v.type]||0) + vendorCostEff(vc, cateringEst).eff;
  });
  const claimed = new Set();
  const rows = BBC_STRUCTURE.map(cat=>{
    let ex=0, vat=0, who=[];
    if(cat.kind==='people'){
      data.people.forEach(pp=>{
        if(claimed.has(pp.id) || !cat.test(pp)) return;
        claimed.add(pp.id); ex += pp.subtotal; vat += pp.vat; who.push(pp);
      });
    } else {
      ex += cat.amount(data);
      if(cat.vat) vat += cat.vat(data);
    }
    if(cat.vendorType && vendorEffByType[cat.vendorType]){ ex += vendorEffByType[cat.vendorType]; }
    return { cat, ex, vat, inc: ex+vat, count: who.length };
  });
  // people no rule caught (shouldn't happen, but never silently drop money)
  const unclaimed = data.people.filter(pp=>!claimed.has(pp.id));
  if(unclaimed.length){
    const ex = unclaimed.reduce((s,pp)=>s+pp.subtotal,0), vat = unclaimed.reduce((s,pp)=>s+pp.vat,0);
    rows.push({ cat:{code:'—', name:'Unmapped (tell me where these go)'}, ex, vat, inc:ex+vat, count:unclaimed.length });
  }
  const shown = rows.filter(r=>r.ex||r.vat);
  const totEx = rows.reduce((s,r)=>s+r.ex,0), totVat = rows.reduce((s,r)=>s+r.vat,0);
  return `
  <div class="hint" style="margin-bottom:10px;">The same money as every other view, re-cut into a BBC-style cost structure.
    <strong>The mapping is a first draft</strong> — producers &amp; directors are pulled out of Production by role name, kit is not yet split
    out of day rates into Facilities, and vendors land by their type. Say what's wrong via Feedback below.</div>
  <div class="tablewrap"><table>
    <tr><th style="width:40px;"></th><th>Category</th>${budgetVatToggle?'<th>TOTAL</th><th>xVAT</th><th>VAT</th>':'<th>Cost</th>'}<th class="hint">covers</th></tr>
    ${shown.map(r=>`<tr>
      <td><span class="dept-code">${esc(r.cat.code)}</span></td>
      <td>${esc(r.cat.name)}</td>
      ${budgetVatToggle?`<td>${fmt(r.inc)}</td><td>${fmt(r.ex)}</td><td>${fmt(r.vat)}</td>`:`<td>${fmt(r.inc)}</td>`}
      <td class="hint">${r.count?`${r.count} ${r.count===1?'person':'people'}`:''}</td>
    </tr>`).join('')}
    <tr class="budget-total-row"><td></td><td>Total</td>${budgetVatToggle?`<td>${fmt(totEx+totVat)}</td><td>${fmt(totEx)}</td><td>${fmt(totVat)}</td>`:`<td>${fmt(totEx+totVat)}</td>`}<td></td></tr>
  </table></div>
  ${feedbackButtonHTML('bbc-view', 'the BBC view')}`;
}

    ${ordered.map((pp,i)=>`<tr class="${i>0 && ordered[i-1].crewId===pp.crewId ? 'budget-same-person' : ''}">
      <td>${i>0 && ordered[i-1].crewId===pp.crewId ? '' : esc(pp.name)}</td>
      <td>${esc(pp.role||'')}</td>
      <td><strong>${pp.hasRate ? fmt(pp.display) : '<span class="budget-noRate">—</span>'}</strong></td>
      ${countCols.map(c=>`<td style="text-align:center;">${c.value(pp) || '<span class="budget-noRate">—</span>'}</td>`).join('')}
      <td><span class="rate-with-save"><span class="money-field"><input type="text" inputmode="decimal" class="budget-rate-input" value="${pp.rate||''}" placeholder="—" onchange="saveEntryRate('${pp.id}', this.value)"></span>${crewRateSaveIconHTML(pp.id, 'b')}</span>${pp.isBuyout?'<span class="buyout-flag" title="One agreed fee — the day counts only split it across the phases">Buyout</span>':''}</td>
      <td>${pp.hasRate ? fmt(pp.subtotal) : '<span class="budget-noRate">—</span>'}</td>
      ${showSplit ? splitCell(pp.kitSubtotal)+splitCell(pp.labourSubtotal) : ''}
      ${budgetCostsPP ? estCell(pp) : ''}

    ${showSplit || budgetCostsPP ? `<tr class="budget-total-row">
      <td colspan="${3+countCols.length}">${[showSplit?'Kit and labour':'', budgetCostsPP?'est. costs':''].filter(Boolean).join(' · ')}</td>
      <td></td><td></td>

      ${budgetCostsPP ? `<td class="budget-est-costs">${fmt(data.people.reduce((n,pp)=>n+(pp.estCosts||0),0))}</td>` : ''}

  <div class="hint" style="margin-top:8px;">Ticking VAT here doesn't save on its own — it's saved to the crew database together with the day rate, the next time that row's Save icon is clicked.</div>`;
}

function budgetDayViewHTML(data){

  const toggleRow = data.perDay.length>1 ? expandCollapseAllHTML('toggleAllBudgetDayBlocks()', undefined, allBlocksCollapsed(budgetDayBlocks), 'bd') : '';
  const phaseBlockHTML = (ph, topMargin) => (ph.on && ph.exVat) ? `<div class="sd-block">
      <div class="sd-block-head" style="margin:${topMargin} 0 0;">

      </div>
    </div>` : '';
  // prep leads the list, so it keeps a flush top; post follows the day rows and takes

function budgetOrderedPeople(data){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'');
  if(budgetSort==='dept') return DEPARTMENTS.flatMap(d=>sortHoDFirst(data.people.filter(pp=>pp.department===d)));
  return [...data.people].sort((a,b)=>{
    switch(budgetSort){
      case 'name':   return byName(a,b);
      case 'cost':   return (b.display-a.display) || byName(a,b);
      case 'rate':   return ((b.hasRate?b.rate:-1)-(a.hasRate?a.rate:-1)) || byName(a,b);
      case 'days':   return (b.daysWorked-a.daysWorked) || byName(a,b);
      // "no rate on file" is a to-do list, so those come first, then by name
      case 'noRate': return (Number(a.hasRate)-Number(b.hasRate)) || byName(a,b);
      default:       return byName(a,b);
    }
  });
}

function budgetExportRows(data, view){
  const fmt = budgetFmt;
  const rows = [];
  const scope = budgetScopeParts();
  if(scope.length) rows.push(['Filtered to', scope.join(' · ')]);
  // Phase BS — always stated, not only when it's non-default: a budget sent to
  // someone else has to say which halves of the shoot it covers.
  rows.push(['Costing', budgetScopeLabel()], []);
  budgetVatToggle
    ? rows.push(['Total (ex-VAT)', fmt(data.totalExVat)], ['VAT', fmt(data.vatTotal)], ['Total (inc-VAT)', fmt(data.totalIncVat)])
    : rows.push(['Total', fmt(data.totalIncVat)]);
  rows.push([]);
  // AO — the itemized shapes mirror the screen column-for-column: Per Person gains
  // the VAT amount, Per Department/Per Day the ex-VAT/VAT/inc-VAT breakdown.
  if(view==='person'){
    /* Phase BS — the count columns follow the scopes, exactly as on screen. Phase BT —
       and in the same chronological order the screen puts them in (Prep, Days, Edit),
       so a pasted table and the tab it came from read identically. */
    rows.push(['Name','Role','Day rate','VAT reg.',
      ...(data.prepOn ? ['Prep'] : []), ...(data.prodOn ? ['Days'] : []),
      ...(data.postOn ? ['Edit'] : []),
      ...(budgetVatToggle ? ['VAT'] : []), 'Subtotal']);
    budgetOrderedPeople(data).forEach(pp=>rows.push([
      pp.name, pp.role||'', pp.hasRate?fmt(pp.rate):'no rate on file',
      pp.vatRegistered?'Yes':'No',
      ...(data.prepOn ? [pp.prepDays||0] : []),
      ...(data.prodOn ? [pp.daysWorked] : []),
      ...(data.postOn ? [pp.postDays||0] : []),
      ...(budgetVatToggle ? [pp.vat?fmt(pp.vat):'—'] : []),
      pp.hasRate?fmt(pp.display):'—']));
  } else if(view==='day'){
    rows.push(budgetVatToggle ? ['Day','Location','Ex-VAT','VAT','Inc-VAT'] : ['Day','Location','Total']);
    // Phase BS/BT — the prep row leads and the post row closes, same as the blocks do
    // on screen, so the rows still add up to the total printed above them.
    const phaseRow = ph => { if(!(ph.on && ph.exVat)) return;
      const span = `${ph.daysTotal} day${ph.daysTotal===1?'':'s'}`;
      rows.push(budgetVatToggle ? [ph.label, span, fmt(ph.exVat), fmt(ph.vat), fmt(ph.incVat)]
                                : [ph.label, span, fmt(ph.incVat)]); };
    phaseRow(data.prep);
    data.perDay.forEach(d=>rows.push(budgetVatToggle
      ? [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]
      : [`Day ${d.dayNum||'?'}`, d.locationLabel||'', fmt(d.total)]));
    phaseRow(data.post);
  } else if(view==='costs'){
    const p = currentProject();
    const cc = getCateringCosts(p), tc = getTransportCosts(p), hc = getHotelCosts(p);
    // Single-cell captions, not two-column headers: these rows are label/value
    // pairs, and copyBudget() renders a 2-cell row as "label: value" — a
    // ['Rate','Amount'] header would come out as the nonsense line "Rate: Amount".
    rows.push(['Rates'],
      ['Catering — per breakfast', fmt(cc.b)],
      ['Catering — per lunch', fmt(cc.l)],
      ['Catering — per dinner', fmt(cc.d)],
      ['Catering — delivery', fmt(cc.delivery)],
      ['Travel — public transport per day', fmt(tc.publicPerDay)],
      ['Travel — mileage (own car, per use)', fmt(tc.mileage)],
      ['Hotel — per room/night', fmt(hc.perRoomNight)],
      [],
      ['Totals'],
      ['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
      ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)]);
  } else if(budgetVatToggle){
    rows.push(['Department','Ex-VAT','VAT','Inc-VAT']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.exVat), fmt(d.vat), fmt(d.incVat)]));
    const extra = (lbl,v)=>[lbl, fmt(v), fmt(0), fmt(v)];
    rows.push(extra('Catering', data.cateringTotal), extra('Travel', data.travelTotal),
              extra('Hotels', data.hotelTotal), extra('Locations', data.locationTotal),
              ['Total', fmt(data.totalExVat), fmt(data.vatTotal), fmt(data.totalIncVat)]);
  } else {
    rows.push(['Department','Cost']);
    data.departments.forEach(d=>rows.push([d.dept, fmt(d.total)]));
    rows.push(['Catering', fmt(data.cateringTotal)], ['Travel', fmt(data.travelTotal)],
              ['Hotels', fmt(data.hotelTotal)], ['Locations', fmt(data.locationTotal)],
              ['Total', fmt(data.totalIncVat)]);
  }
  return rows;
}

async function syncShootDayCount(newCountStr){
  const p = currentProject(); if(!p) return;
  const days = projectDays(p.id);
  const newCount = parseInt(newCountStr, 10);
  shootDayReductionPending = null;
  if(!Number.isFinite(newCount) || newCount < 0 || newCount === days.length){ renderProjectOverview(document.getElementById('projectBody')); return; }
  if(newCount > days.length){
    for(let i=days.length; i<newCount; i++){
      const rec = makeShootDayRecord(p.id, p);
      shootDaysDB.push(rec);
    }
    await saveDB('db:shootdays', shootDaysDB);
    renderProjectOverview(document.getElementById('projectBody'));
    return;
  }
  // shrinking — expand an inline checkbox picker instead of deciding for the user
  shootDayReductionPending = { removeCount: days.length - newCount, selected: new Set() };
  renderProjectOverview(document.getElementById('projectBody'));
}

async function addRoleToDeptAdmin(dept){
  const role = (prompt(`New role in ${dept}:`)||'').trim();
  if(!role) return;
  ROLES_BY_DEPT[dept] = ROLES_BY_DEPT[dept] || [];
  // case-insensitive, so "Gaffer" can't be added a second time as "gaffer"
  const clash = ROLES_BY_DEPT[dept].find(r=>r.toLowerCase()===role.toLowerCase());
  if(clash){ alert(`${dept} already has a role called "${clash}".`); return; }
  ROLES_BY_DEPT[dept].push(role);
  await saveDB('db:roles', ROLES_BY_DEPT);
  refreshCrewDatabase();
}

  return crewDbFilter.sort==='name' ? list.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')) : sortHoDFirst(list);

function renderCrewList(){
  const q = (val('crewSearch')||crewSearchQuery||'').toLowerCase();
  const list = document.getElementById('crewList'); if(!list) return;
  const tab = crewDbTab();
  let filtered = crewDbTabList(tab).filter(c => !q || crewSearchBlob(c).includes(q));
  filtered = filtered.filter(personMatchesCrewDbFilter);
  if(!filtered.length){
    const narrowed = q || crewDbActiveFilterCount();
    list.innerHTML = `<div class="empty-note">${narrowed
      ? `No one in ${esc(tab.label)} matches that.`
      : `No one in ${esc(tab.label)} yet.`}</div>`;
    return;
  }
  // group by department; unknown/blank departments fall under "Other"
  const buckets = {};
  filtered.forEach(c=>{ const key = deptBucketKey(c.department); (buckets[key]=buckets[key]||[]).push(c); });
  Object.keys(buckets).forEach(d=>{ buckets[d] = sortCrewDbGroup(buckets[d]); });
  const deptsPresent = DEPARTMENTS.filter(d=>buckets[d]&&buckets[d].length);
  const deptsCSV = deptsPresent.join(',');
  const toggleRow = deptsPresent.length>1 ? expandCollapseAllHTML(`toggleAllCrewDbDepts('${deptsCSV}')`, undefined, deptsPresent.every(d=>collapsedDepts.has(d)), 'depts') : '';
  const html = deptsPresent.map(d=>{

    return deptHeaderHTML(d, buckets[d].length, collapsed, `toggleDeptCollapse('${d}')`)
      + `<div class="dept-group" style="display:${collapsed?'none':'block'}">${buckets[d].map(crewCardHTML).join('')}</div>`;
  }).join('');
  list.innerHTML = toggleRow + (html || filtered.map(crewCardHTML).join(''));
}

  add('Role', c.role); add('Department', c.department);
  add('Show as', c.showAs);
  // blank means the lead company — name it, rather than showing no company row at all
  add('Company', c.coProductionCompany || COMPANY);
  // only when set: blank means they invoice as themselves, which the Name row already says
  add('Invoices as', c.invoicesAs);
  /* one line per role that carries its own rate, so the View panel says the same thing
     the Rates section does without duplicating its arithmetic */
  Object.entries((c.roleRates)||{}).forEach(([path, rr])=>{
    if(rr==null || rr.rate==null) return;
    const role = path.includes('/') ? path.split('/').slice(1).join('/') : path;
    add(`Rate · ${role}`, rr.kit!=null
      ? `${rr.rate} (kit ${rr.kit} + labour ${labourOf(rr.rate, rr.kit)})`
      : String(rr.rate));
  });
  add('Phone', c.phone); add('Email', c.email); add('Skills / tags', c.skills);
  add('Main camera 1', c.camera1); add('Main camera 2', c.camera2); add('Main camera 3', c.camera3);
  add('Other equipment', c.cameraExtras);
  add('Dietary (general)', c.dietaryGeneral); add('Dietary (specific)', c.dietarySpecific||c.dietary);
  add('Shoe size', c.shoeSize); add('Clothing size', c.clothingSize);
  add('VAT registered', c.vatRegistered); add('Drives', c.drives);
  if(c.drives==='Yes'){ add('Car make/model', c.carMakeModel); add('Registration', c.carReg); }

  add('Notes', c.generalNotes); add('Previous projects', c.previousProjects);
  add('Instagram', c.instagram); add('YouTube', c.youtube); add('LinkedIn', c.linkedin);
  add('Coffee / tea order', c.coffeeOrder);
  add('Fee / rate (private)', c.rate); add('Private notes', c.notes);
  if(!rows.length) return `<div class="empty-note">Nothing filled in yet beyond the name.</div>`;
  return `<table>${rows.map(([k,v])=>`<tr><th style="width:170px;">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`;
